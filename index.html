todos os pólipos, com colonoscopia anual","C":"Colectomia segmentar do segmento mais acometido","D":"Nenhuma cirurgia; apenas quimioprevenção com AINE"},"ok":"Na polipose adenomatosa familiar (FAP), o risco de câncer colorretal é praticamente 100% até os 40 anos se o cólon não for removido. A conduta é cirúrgica: proctocolectomia total com bolsa ileal e anastomose ileoanal (IPAA), que elimina toda a mucosa em risco, ou colectomia total com anastomose ileorretal quando o reto tem poucos pólipos, com vigilância retal rigorosa e vitalícia.","w":{"B":"Polipectomia de centenas de lesões é impraticável e não previne o câncer.","C":"Colectomia segmentar deixa mucosa doente e risco intacto.","D":"A quimioprevenção (celecoxibe, sulindaco) reduz o número de pólipos, mas não substitui a cirurgia."},"p":["Manifestações extracolônicas da FAP: pólipos duodenais e periampulares (a principal causa de morte após a colectomia — exige vigilância com duodenoscopia de visão lateral e classificação de Spigelman), tumores desmoides, osteomas, cistos epidermoides e hipertrofia congênita do epitélio pigmentar da retina (a síndrome de Gardner reúne várias delas)."],"f":"NCCN Guidelines — Genetic/Familial High-Risk Assessment: Colorectal; ASCRS Practice Guidelines; Sabiston, 21ª ed., cap. 51."},{"v":"Vol. III (autorais)","c":14,"n":3,"g":"D","s":["Paciente com adenocarcinoma de cólon metastático apresenta tumor com instabilidade de microssatélites alta (MSI-H / dMMR). Qual a implicação terapêutica?"],"a":{"A":"Melhor resposta à quimioterapia com 5-FU isolado","B":"Indicação de anti-EGFR independentemente do status de RAS","C":"Pior prognóstico em todos os estágios, com indicação de quimioterapia intensiva","D":"Indicação de imunoterapia com inibidor de checkpoint (pembrolizumabe ou nivolumabe), que apresenta resultados superiores à quimioterapia em primeira linha"},"ok":"Tumores MSI-H/dMMR têm alta carga mutacional e produzem muitos neoantígenos, o que os torna especialmente sensíveis aos inibidores de checkpoint. O ensaio KEYNOTE-177 demonstrou superioridade do pembrolizumabe sobre a quimioterapia em primeira linha no câncer colorretal metastático MSI-H, com sobrevida livre de progressão substancialmente maior e menor toxicidade.","w":{"A":"Inverte a evidência: tumores MSI-H respondem mal ao 5-FU isolado, e por isso a adjuvância com fluoropirimidina isolada não é recomendada no estádio II MSI-H.","B":"A indicação de anti-EGFR depende de RAS selvagem e de tumor de cólon esquerdo — o status de MSI não a determina.","C":"No estádio II localizado, o MSI-H confere melhor prognóstico (e por isso dispensa adjuvância). No metastático, o prognóstico é pior sem imunoterapia, mas a alternativa erra ao propor quimioterapia intensiva em vez do tratamento dirigido."},"p":["Pesquisa obrigatória em todo câncer colorretal: MSI/MMR (prognóstico, imunoterapia, rastreio de Lynch), RAS (KRAS e NRAS — anti-EGFR só em selvagem) e BRAF V600E (pior prognóstico, esquema específico com encorafenibe)."],"f":"André T et al., NEJM — KEYNOTE-177; NCCN Guidelines — Colon Cancer."},{"v":"Vol. III (autorais)","c":14,"n":4,"g":"B","s":["Sobre a excisão total do mesorreto (ETM) no câncer de reto, assinale a correta:"],"a":{"A":"É uma técnica de ressecção segmentar, sem preocupação com o plano de dissecção","B":"Consiste na dissecção no plano avascular entre a fáscia mesorretal e a fáscia pré-sacral, removendo o mesorreto íntegro; reduziu a recidiva local de cerca de 30% para menos de 10%","C":"Aumenta a taxa de recidiva local em comparação à dissecção romba tradicional","D":"Está indicada apenas em tumores do reto proximal"},"ok":"A ETM, sistematizada por Heald, é a mudança técnica mais importante da cirurgia do reto no século XX. A dissecção é feita sob visão direta no plano avascular (\"holy plane\") entre a fáscia mesorretal (visceral) e a fáscia pré- sacral (parietal), removendo o mesorreto como um envelope íntegro com todo o tecido linfático e os depósitos tumorais. A recidiva local caiu de cerca de 30% para menos de 10%.","w":{"A":"É exatamente o oposto: a ETM é definida pelo respeito ao plano anatômico.","C":"Inverte o resultado da técnica.","D":"Nos tumores do reto proximal aceita-se a excisão parcial do mesorreto, com margem distal de 5 cm no mesorreto. A ETM completa é obrigatória nos tumores do reto médio e distal."},"p":["A margem circunferencial (radial) é o preditor mais forte de recidiva","local: margem ≤ 1 mm é considerada comprometida. A avaliação da fáscia mesorretal pela ressonância de pelve no pré-operatório é o que permite planejar a neoadjuvância."],"f":"Heald RJ, Ryall RD, Lancet — Recurrence and survival after total mesorectal excision; NCCN Guidelines — Rectal Cancer; Sabiston, 21ª ed., cap. 51."},{"v":"Vol. III (autorais)","c":14,"n":5,"g":"C","s":["Paciente com adenocarcinoma de reto distal submetido a quimiorradioterapia neoadjuvante apresenta, na reavaliação, ausência de lesão ao toque retal, à endoscopia e à ressonância — resposta clínica completa. Qual a conduta possível?"],"a":{"A":"Cirurgia obrigatória em todos os casos, independentemente da resposta","B":"Alta sem seguimento","C":"Estratégia Watch and Wait, com vigilância intensiva e cirurgia de resgate em caso de rebrota tumoral, em centros com protocolo estruturado","D":"Radioterapia adicional em dose plena"},"ok":"A estratégia Watch and Wait, sistematizada pelo grupo brasileiro de Habr- Gama, oferece preservação do órgão a pacientes com resposta clínica completa após neoadjuvância, evitando a morbidade da ressecção — sobretudo em tumores distais, em que a alternativa seria amputação abdominoperineal com colostomia definitiva. Exige vigilância intensiva (toque retal, endoscopia, ressonância e marcadores em intervalos curtos nos primeiros 2 a 3 anos) e capacidade de cirurgia de resgate imediata, já que a rebrota ocorre em 20 a 30%, quase sempre nos primeiros 2 anos.","w":{"A":"A cirurgia obrigatória era o padrão anterior; a evidência acumulada legitimou a preservação do órgão em pacientes selecionados.","B":"Alta sem seguimento é inaceitável — a estratégia depende inteiramente da vigilância.","D":"Não há indicação de reirradiação em dose plena nesse contexto."},"p":["Requisitos para adotar a estratégia: resposta clínica completa (não parcial), protocolo estruturado, paciente aderente e informado, e equipe capaz de resgate cirúrgico."],"f":"Habr-Gama A et al., Ann Surg — Operative versus nonoperative treatment for stage 0 distal rectal cancer; International Watch & Wait Database (IWWD); NCCN Guidelines."},{"v":"Vol. III (autorais)","c":14,"n":6,"g":"A","s":["Paciente com adenocarcinoma de cólon e carcinomatose peritoneal limitada (índice de carcinomatose peritoneal baixo), sem doença extra-abdominal, ECOG 0. Qual a estratégia terapêutica que pode ser considerada em centros especializados?"],"a":{"A":"Citorredução completa associada a HIPEC (quimioterapia intraperitoneal hipertérmica), em pacientes altamente selecionados","B":"Cirurgia paliativa isolada","C":"Radioterapia abdominal total","D":"Nenhum tratamento além de cuidados de suporte"},"ok":"Em pacientes muito selecionados — carcinomatose limitada, ausência de doença extra-abdominal, bom performance status e possibilidade de citorredução completa —, a combinação de cirurgia citorredutora com HIPEC pode oferecer sobrevida prolongada. O ponto crítico é que o benefício depende inteiramente de se atingir citorredução completa (CC- 0/CC-1); com doença residual macroscópica, não há ganho.","w":{"B":"A cirurgia paliativa isolada não oferece controle da doença.","C":"A radioterapia abdominal total tem toxicidade proibitiva e não é opção.","D":"Renunciar ao tratamento em paciente ECOG 0 com doença limitada desperdiça uma possibilidade real de sobrevida prolongada."},"p":["Nuance importante: o ensaio francês PRODIGE 7 questionou o benefício adicional da HIPEC sobre a citorredução completa isolada no câncer colorretal — o que reforça que o determinante principal do prognóstico é a qualidade da citorredução, e não a quimioterapia intraperitoneal em si. O tema permanece em debate."],"f":"Quénet F et al., Lancet Oncol — PRODIGE 7; NCCN Guidelines — Colon Cancer; Sabiston, 21ª ed., cap. 51."},{"v":"Vol. III (autorais)","c":14,"n":7,"g":"D","s":["Após polipectomia de três adenomas tubulares menores que 10 mm, com displasia de baixo grau, em colonoscopia completa e de boa qualidade, qual o intervalo recomendado para a próxima colonoscopia?"],"a":{"A":"6 meses","B":"1 ano","C":"10 anos","D":"3 a 5 anos"},"ok":"A vigilância pós-polipectomia é estratificada pelo número, tamanho e histologia dos pólipos. Três a quatro adenomas pequenos (&lt; 10 mm) com displasia de baixo grau configuram risco intermediário, com intervalo recomendado de 3 a 5 anos nas diretrizes atuais (que ampliaram os intervalos em relação às versões antigas, diante da evidência de baixo risco).","w":{"A":"Seis meses é intervalo de ressecção incompleta ou piecemeal de lesão grande, para confirmar a erradicação.","B":"Um ano se aplica a situações de alto risco: 10 ou mais adenomas, ou ressecção fragmentada de lesão ≥ 20 mm.","C":"Dez anos é o intervalo para colonoscopia normal ou com 1 a 2 adenomas pequenos, de baixo grau, em algumas diretrizes."},"p":["Características de adenoma avançado (que encurtam o intervalo para 3 anos): tamanho ≥ 10 mm, componente viloso, ou displasia de alto grau. Pólipos serrilhados sésseis têm regras próprias e são fonte da via alternativa de carcinogênese (BRAF, metilação de CpG), com predomínio no cólon direito."],"f":"US Multi-Society Task Force on Colorectal Cancer — Recommendations for follow-up after colonoscopy and polypectomy; ESGE Guideline on post-polypectomy surveillance."},{"v":"Vol. III (autorais)","c":14,"n":8,"g":"B","s":["Paciente com câncer colorretal metastático, RAS selvagem, tumor primário no cólon esquerdo. Qual a terapia-alvo de primeira linha mais apropriada em associação à quimioterapia?"],"a":{"A":"Bevacizumabe, pois o status de RAS não influencia a escolha","B":"Anti-EGFR (cetuximabe ou panitumumabe), que apresenta melhor benefício em tumores RAS selvagens de cólon esquerdo","C":"Trastuzumabe","D":"Imatinibe"},"ok":"Os anticorpos anti-EGFR exigem duas condições para funcionar: RAS selvagem (KRAS e NRAS não mutados — a mutação ativa a via a jusante do receptor, tornando o bloqueio inútil) e, conforme a evidência acumulada, lateralidade esquerda do tumor primário. Tumores de cólon direito, mesmo RAS selvagens, respondem pior aos anti-EGFR, e neles se prefere o bevacizumabe.","w":{"A":"O status de RAS é determinante absoluto para anti-EGFR — daí a obrigatoriedade da pesquisa.","C":"O trastuzumabe é anti-HER2, com papel no câncer gástrico e de mama, e em um pequeno subgrupo HER2-amplificado de colorretal (em linhas posteriores).","D":"O imatinibe é do GIST e da leucemia mieloide crônica."},"p":["Origem embriológica explica a lateralidade: cólon direito vem do intestino médio (mais MSI-H, BRAF, mucinoso, pior prognóstico em metastático); cólon esquerdo vem do intestino posterior (mais instabilidade cromossômica, melhor resposta a anti-EGFR)."],"f":"NCCN Guidelines — Colon Cancer; Arnold D et al., Ann Oncol — prognostic and predictive value of primary tumour side."},{"v":"Vol. III (autorais)","c":14,"n":9,"g":"C","s":["Paciente de 45 anos com dor anal intensa durante e após a evacuação, com sangramento vivo em pequena quantidade. Ao exame, observa-se ulceração linear na linha média posterior do canal anal, com plicoma sentinela. Qual a conduta inicial?"],"a":{"A":"Hemorroidectomia","B":"Esfincterotomia lateral interna imediata","C":"Tratamento clínico: banhos de assento, dieta rica em fibras, laxantes formadores de bolo e relaxantes tópicos do esfíncter (nitroglicerina ou bloqueador de canal de cálcio)","D":"Drenagem de abscesso perianal"},"ok":"A fissura anal é a causa mais comum de dor anal intensa relacionada à evacuação. A fisiopatologia envolve hipertonia do esfíncter interno com isquemia relativa da comissura posterior — daí a localização característica. O tratamento inicial é clínico, eficaz em cerca de 50 a 70%: regularização do hábito intestinal, banhos de assento e relaxantes tópicos do esfíncter, que quebram o ciclo dor-espasmo-isquemia.","w":{"A":"Hemorroidas não produzem ulceração linear na linha média posterior.","B":"A esfincterotomia lateral interna é o padrão-ouro cirúrgico e tem alta taxa de cura, mas se reserva às fissuras crônicas refratárias ao tratamento clínico, pelo risco de incontinência.","D":"Não há descrição de abscesso — ausência de flutuação, febre ou massa dolorosa."},"p":["Sinal de alerta: fissura em localização atípica (lateral), múltipla ou de aspecto irregular deve levantar suspeita de doença de Crohn, tuberculose, sífilis, HIV ou neoplasia — e exige investigação."],"f":"ASCRS Clinical Practice Guidelines for the Management of Anal Fissures; Sabiston, 21ª ed., cap. 52."},{"v":"Vol. III (autorais)","c":14,"n":10,"g":"A","s":["Paciente de 70 anos com obstrução colônica completa por neoplasia de cólon direito, sem sinais de perfuração, hemodinamicamente estável, sem metástases. Qual a conduta cirúrgica mais adequada?"],"a":{"A":"Colectomia direita com anastomose ileocólica primária, geralmente segura mesmo em cenário de urgência","B":"Colostomia derivativa em alça, com ressecção em segundo tempo","C":"Prótese colônica no cólon direito","D":"Colectomia total com ileostomia definitiva"},"ok":"A obstrução de cólon direito tem uma vantagem prática decisiva: a anastomose ileocólica é bem tolerada mesmo em cenário de urgência, porque o íleo tem bom suprimento sanguíneo, calibre adequado e conteúdo líquido com baixa carga bacteriana. Por isso a colectomia direita com anastomose primária é a conduta padrão em paciente estável, sem contaminação grosseira.","w":{"B":"A derivação em alça sem ressecção adia o tratamento oncológico e impõe dois tempos cirúrgicos desnecessariamente.","C":"A prótese colônica é técnica e anatomicamente difícil no cólon direito, além de ser indicada sobretudo em obstruções esquerdas, como paliação.","D":"Colectomia total com ileostomia definitiva é desproporcional em doença localizada e ressecável."},"p":["Contraste com a obstrução esquerda: ali a anastomose primária é mais arriscada (cólon distendido, conteúdo sólido, alta carga bacteriana), e as opções incluem Hartmann, anastomose primária com lavagem intraoperatória e estoma de proteção, ou prótese como ponte."],"f":"ASCRS Clinical Practice Guidelines; WSES Guidelines on obstructive colon cancer; Sabiston, 21ª ed., cap. 51."},{"v":"Vol. III (autorais)","c":15,"n":1,"g":"B","s":["Segundo a classificação de Couinaud, uma hepatectomia direita formal compreende a ressecção de quais segmentos?"],"a":{"A":"Segmentos II, III e IV","B":"Segmentos V, VI, VII e VIII","C":"Segmentos IV, V e VIII","D":"Segmentos II e III"},"ok":"A divisão funcional de Couinaud organiza o fígado em 8 segmentos com pedículo portal e drenagem venosa próprios. A hepatectomia direita remove os segmentos V, VI, VII e VIII, delimitados pela linha de Cantlie — plano que vai da fossa vesicular à veia cava, passando pela veia hepática média.","w":{"A":"Segmentos II, III e IV correspondem à hepatectomia esquerda.","C":"Segmentos IV, V e VIII correspondem à meso-hepatectomia (hepatectomia central).","D":"Segmentos II e III correspondem à segmentectomia lateral esquerda (a antiga \"lobectomia esquerda\" da nomenclatura anatômica de superfície)."},"p":["Cuidado com a terminologia antiga: o \"lobo esquerdo\" anatômico (delimitado pelo ligamento falciforme) corresponde apenas aos segmentos II e III, enquanto o \"fígado esquerdo\" funcional inclui também o IV. Essa confusão é fonte clássica de erro. O segmento I (caudado) tem drenagem venosa direta para a cava e é ressecado em bloco nos colangiocarcinomas peri-hilares."],"f":"Couinaud C — Le foie: études anatomiques et chirurgicales; Brisbane 2000 Terminology of Liver Anatomy and Resections; Sabiston, 21ª ed., cap. 53."},{"v":"Vol. III (autorais)","c":15,"n":2,"g":"C","s":["Paciente submetido a hepatectomia direita ampliada evolui no 5º pós-operatório com icterícia (bilirrubina 4,2 mg/dL), INR 1,9 e encefalopatia. Qual o diagnóstico e a base do manejo?"],"a":{"A":"Colangite; CPRE de urgência","B":"Rejeição de enxerto; imunossupressão","C":"Insuficiência hepática pós-hepatectomia; suporte intensivo, correção de fatores agravantes (sepse, sangramento, congestão), avaliação de trombose portal e, em casos selecionados, discussão de transplante","D":"Hepatite medicamentosa; suspender medicações"},"ok":"A insuficiência hepática pós-hepatectomia é a principal causa de mortalidade após ressecções maiores. Define-se pelo critério \"50-50\" — bilirrubina acima de 2,9 mg/dL e INR acima de 1,7 no 5º dia — ou pelos critérios do ISGLS. Decorre de remanescente hepático insuficiente ou disfuncional. O manejo é de suporte: identificar e tratar sepse, sangramento e congestão venosa, avaliar trombose portal e, em casos extremos, considerar transplante.","w":{"A":"Não há febre nem dilatação de vias biliares descritas, e a coagulopatia com encefalopatia aponta para falência sintética.","B":"Não houve transplante — não há enxerto a rejeitar.","D":"A hepatite medicamentosa não explicaria o contexto imediato de uma ressecção hepática ampla."},"p":["Prevenção é o que realmente importa: volumetria pré-operatória, embolização portal ou ALPPS para hipertrofiar o remanescente, e respeito aos limites de volume — 20 a 25% em fígado normal, 30 a 40% em fígado quimioterapiado ou esteatótico, e 40% ou mais em cirrótico."],"f":"Balzan S et al., Ann Surg — critério 50-50; Rahbari NN et al., Surgery — ISGLS definition of post-hepatectomy liver failure; Sabiston, 21ª ed., cap. 53."},{"v":"Vol. III (autorais)","c":15,"n":3,"g":"A","s":["Sobre o rastreamento do carcinoma hepatocelular, assinale a correta:"],"a":{"A":"Deve ser realizado com ultrassonografia a cada 6 meses em cirróticos e em portadores de hepatite B selecionados, com ou sem alfafetoproteína","B":"Deve ser feito com tomografia trimestral em todos os cirróticos","C":"A alfafetoproteína isolada é suficiente","D":"Não há indicação de rastreamento, pois não altera desfechos"},"ok":"O rastreamento do CHC baseia-se em ultrassonografia semestral, intervalo escolhido pelo tempo de duplicação tumoral. As populações-alvo são os cirróticos de qualquer etiologia e portadores de hepatite B com fatores de risco adicionais (história familiar, origem asiática ou africana, idade, alta carga viral), mesmo sem cirrose. A alfafetoproteína pode ser associada, com ganho modesto de sensibilidade.","w":{"B":"A tomografia trimestral seria excessiva em radiação, custo e ansiedade, sem ganho demonstrado.","C":"A AFP isolada tem sensibilidade e especificidade insuficientes — ela se eleva em apenas 60 a 70% dos CHC e também em hepatite ativa e regeneração.","D":"O rastreamento detecta lesões em estágio precoce, permitindo tratamento curativo, e é recomendação consolidada."},"p":["Nódulo detectado ao rastreio: &lt; 1 cm → repetir ultrassom em 3 a 6 meses. ≥ 1 cm → imagem dinâmica (TC ou RM multifásica); padrão típico (realce arterial + washout) fecha o diagnóstico sem biópsia."],"f":"EASL Clinical Practice Guidelines on HCC; AASLD Practice Guidance on HCC; Sabiston, 21ª ed., cap. 53."},{"v":"Vol. III (autorais)","c":15,"n":4,"g":"D","s":["Paciente com carcinoma hepatocelular avançado (BCLC C — invasão portal, ECOG 1), com função hepática Child-Pugh A. Qual a terapia sistêmica de primeira linha atualmente preferida?"],"a":{"A":"Quimioterapia com doxorrubicina","B":"TACE","C":"Ressecção hepática","D":"Terapia sistêmica de primeira linha — atezolizumabe associado a bevacizumabe (ou alternativas como durvalumabe com tremelimumabe), tendo sorafenibe e lenvatinibe como opções"},"ok":"O BCLC C (invasão vascular, disseminação extra-hepática ou ECOG 1–2, com função preservada) é tratado com terapia sistêmica. O ensaio IMbrave150 estabeleceu a combinação de atezolizumabe (anti-PD-L1) com bevacizumabe (anti-VEGF) como superior ao sorafenibe em sobrevida global e livre de progressão, tornando-se o padrão de primeira linha. O sorafenibe e o lenvatinibe permanecem como opções, sobretudo quando há contraindicação à imunoterapia.","w":{"A":"A quimioterapia citotóxica convencional tem eficácia muito limitada no CHC.","B":"A TACE é o tratamento do BCLC B (intermediário, multinodular sem invasão vascular) — a invasão portal é praticamente contraindicação, pelo risco de isquemia hepática.","C":"A ressecção não se aplica a doença com invasão vascular macroscópica."},"p":["Antes de iniciar bevacizumabe, é obrigatória a endoscopia para rastrear e tratar varizes esofágicas, dado o risco de sangramento."],"f":"Finn RS et al., NEJM — IMbrave150; EASL e AASLD Guidelines; BCLC 2022 update."},{"v":"Vol. III (autorais)","c":15,"n":5,"g":"B","s":["Paciente com lesão hepática cística de 8 cm, multiloculada, com vesículas-filhas e calcificação parietal, procedente de área rural com criação de ovinos. Sorologia positiva. Qual o diagnóstico e a conduta?"],"a":{"A":"Cisto simples; observação","B":"Cisto hidático (equinococose); albendazol associado a PAIR (punção- aspiração-injeção-reaspiração) ou cirurgia, com cuidado para evitar extravasamento do conteúdo","C":"Abscesso piogênico; drenagem percutânea simples","D":"Cistoadenocarcinoma; hepatectomia"},"ok":"A equinococose (Echinococcus granulosus) tem epidemiologia característica — contato com cães pastores e ovinos — e imagem típica com vesículas- filhas e calcificação. O tratamento combina albendazol com PAIR (punção, aspiração, injeção de solução escolicida e reaspiração) ou cirurgia. O ponto crítico é evitar o extravasamento do conteúdo, que pode causar choque anafilático e disseminação peritoneal (equinococose secundária).","w":{"A":"O cisto simples é anecoico, unilocular, de paredes finas e sem septos ou calcificação.","C":"O abscesso piogênico cursa com febre, leucocitose e quadro séptico; a punção às cegas em cisto hidático é justamente o que se deve evitar.","D":"O cistoadenocarcinoma biliar tem aspecto distinto, com componente sólido e septos espessos, sem vesículas-filhas nem contexto epidemiológico."},"p":["Classificação da OMS (WHO-IWGE) por atividade: CE1 e CE2 ativos (tratar), CE3 transicional, CE4 e CE5 inativos (podem ser apenas acompanhados)."],"f":"WHO Informal Working Group on Echinococcosis — Expert consensus for the diagnosis and treatment of cystic and alveolar echinococcosis; Sabiston, 21ª ed., cap. 53."},{"v":"Vol. III (autorais)","c":15,"n":6,"g":"C","s":["Paciente com colangite esclerosante primária (CEP) e retocolite ulcerativa apresenta piora da colestase e perda ponderal. Qual a principal complicação a ser investigada e como?"],"a":{"A":"Cirrose biliar secundária; biópsia hepática","B":"Coledocolitíase; CPRE diagnóstica","C":"Colangiocarcinoma; colangiorressonância, CA 19-9 e, se necessário, colangioscopia com biópsia/escovado","D":"Hepatite autoimune; autoanticorpos"},"ok":"A colangite esclerosante primária é o fator de risco mais importante para colangiocarcinoma no ocidente, com incidência de cerca de 0,5 a 1,5% ao ano e risco cumulativo de 10 a 15%. Qualquer deterioração clínica — piora da colestase, perda ponderal, prurido refratário, colangites de repetição — deve levantar essa suspeita. A investigação combina colangiorressonância, CA 19-9 e, quando há estenose dominante, colangioscopia com escovado ou biópsia.","w":{"A":"A cirrose biliar secundária é evolução natural da CEP, mas não explica a piora aguda com perda ponderal.","B":"A coledocolitíase é possível, mas não é a preocupação principal, e a CPRE puramente diagnóstica está proscrita.","D":"A hepatite autoimune pode coexistir (síndrome de sobreposição), mas não é a primeira suspeita nesse contexto."},"p":["Pacientes com CEP e doença inflamatória intestinal têm risco aumentado também de câncer colorretal, e devem fazer colonoscopia anual com biópsias — intervalo bem menor que o da colite isolada."],"f":"AASLD e EASL Practice Guidance on Primary Sclerosing Cholangitis; Sabiston, 21ª ed., cap. 54."},{"v":"Vol. III (autorais)","c":15,"n":7,"g":"A","s":["Mulher de 24 anos com dor em hipocôndrio direito, icterícia intermitente e massa palpável. Colangiorressonância evidencia dilatação fusiforme do colédoco extra- hepático, sem cálculos. Qual o diagnóstico, a classificação e a conduta?"],"a":{"A":"Cisto de colédoco tipo I de Todani; ressecção completa do cisto com colecistectomia e hepaticojejunostomia em Y de Roux, pelo risco de malignização","B":"Coledocolitíase; CPRE com extração","C":"Síndrome de Mirizzi; colecistectomia","D":"Colangite esclerosante; ursodesoxicólico"},"ok":"A tríade clássica do cisto de colédoco — dor, icterícia e massa palpável — está presente em menos de um terço dos casos, mas é característica quando completa. O tipo I de Todani (dilatação fusiforme do colédoco extra- hepático) é o mais comum, respondendo por 50 a 80%. O tratamento é a ressecção completa do cisto com colecistectomia e reconstrução por hepaticojejunostomia em Y de Roux — nunca a simples derivação interna (cistoduodenostomia ou cistojejunostomia), abandonada pelo risco de colangite e malignização.","w":{"B":"Não há cálculos descritos, e a dilatação é fusiforme e congênita.","C":"Mirizzi exigiria cálculo impactado no infundíbulo, ausente.","D":"A colangite esclerosante cursa com estenoses e dilatações alternadas em \"contas de rosário\", não com dilatação fusiforme isolada."},"p":["O risco de colangiocarcinoma sobre o cisto de colédoco é de 10 a 30% ao longo da vida e aumenta com a idade — motivo pelo qual a ressecção é indicada mesmo em assintomáticos. A fisiopatologia envolve a junção pancreatobiliar anômala, com refluxo de suco pancreático para a via biliar. Classificação de Todani: I fusiforme extra-hepático; II divertículo; III coledococele; IVa intra e extra-hepático; IVb múltiplos extra- hepáticos; V intra-hepático (doença de Caroli)."],"f":"Todani T et al. — classificação dos cistos de colédoco; Sabiston, 21ª ed., cap. 54; NCCN Guidelines — Hepatobiliary Cancers."},{"v":"Vol. III (autorais)","c":15,"n":8,"g":"D","s":["Paciente com colangiocarcinoma intra-hepático solitário de 5 cm, sem doença extra-hepática, fígado não cirrótico, com bom performance status. Qual a conduta com intenção curativa?"],"a":{"A":"Transplante hepático","B":"Quimioembolização","C":"Ablação por radiofrequência como primeira escolha","D":"Ressecção hepática com linfadenectomia regional, seguida de quimioterapia adjuvante (capecitabina)"},"ok":"O colangiocarcinoma intra-hepático ressecável é tratado por hepatectomia com margens livres associada a linfadenectomia regional (hilar), que é fator prognóstico e de estadiamento adequado. A adjuvância com capecitabina por 6 meses tornou-se padrão após o ensaio BILCAP.","w":{"A":"O transplante hepático não é padrão no colangiocarcinoma intra- hepático — os resultados historicamente ruins o mantiveram fora das indicações, com protocolos experimentais em curso para lesões muito pequenas em cirróticos.","B":"A quimioembolização é terapia locorregional paliativa, para doença irressecável.","C":"A ablação por radiofrequência tem papel limitado em lesões pequenas e em pacientes sem condições cirúrgicas — não é primeira escolha em lesão ressecável de 5 cm."},"p":["Em doença avançada, a primeira linha é gencitabina com cisplatina, hoje frequentemente associada a durvalumabe (ensaio TOPAZ-1). Pesquise alterações moleculares: FGFR2, IDH1, HER2 e MSI-H, que abrem opções dirigidas."],"f":"Primrose JN et al., Lancet Oncol — BILCAP trial; NCCN Guidelines — Hepatobiliary Cancers; Sabiston, 21ª ed., cap. 53 e 54."},{"v":"Vol. III (autorais)","c":15,"n":9,"g":"C","s":["Paciente com CHC dentro dos critérios de Milão, em lista de transplante, com previsão de espera de 8 meses. Qual a conduta durante a espera?"],"a":{"A":"Nenhuma intervenção; apenas aguardar","B":"Ressecção hepática, retirando o paciente da lista","C":"Terapia-ponte (TACE ou ablação por radiofrequência) para controle tumoral, reduzindo o risco de progressão e de saída da lista por evolução da doença","D":"Quimioterapia sistêmica com sorafenibe"},"ok":"Em tempos de espera superiores a 6 meses, recomenda-se terapia-ponte com TACE ou ablação por radiofrequência. O objetivo é impedir que o tumor progrida além dos critérios de Milão, o que levaria à exclusão do paciente da lista (o chamado \"dropout\"), cuja taxa chega a 15 a 30% ao ano sem intervenção.","w":{"A":"Aguardar sem intervenção com previsão de 8 meses expõe a risco elevado de progressão.","B":"A ressecção retiraria o paciente da lista e, em cirrótico, não trata a doença de base nem o risco multicêntrico — embora exista o conceito de \"ressecção-ponte\" em cenários selecionados.","D":"O sorafenibe não é terapia-ponte; é tratamento de doença avançada."},"p":["Conceito relacionado: downstaging — reduzir tumores que estão além dos critérios de Milão para dentro deles, tornando o paciente elegível ao transplante. É estratégia aceita em protocolos definidos, com necessidade de resposta sustentada."],"f":"EASL e AASLD Guidelines on HCC; UNOS/OPTN policies on HCC exception points; Sabiston, 21ª ed., cap. 53."},{"v":"Vol. III (autorais)","c":15,"n":10,"g":"B","s":["Sobre a manobra de Pringle na cirurgia hepática, assinale a correta:"],"a":{"A":"Consiste no clampeamento da veia cava inferior supra e infra-hepática","B":"Consiste no clampeamento do pedículo hepático (artéria hepática e veia porta) no ligamento hepatoduodenal, reduzindo o sangramento durante a transecção do parênquima","C":"Consiste na ligadura definitiva da artéria hepática própria","D":"É contraindicada em qualquer hepatectomia"},"ok":"A manobra de Pringle ocluiu o ligamento hepatoduodenal, interrompendo o influxo arterial e portal ao fígado e reduzindo substancialmente o sangramento durante a transecção do parênquima. É habitualmente aplicada de forma intermitente (ciclos de 15 minutos de clampeamento com 5 minutos de reperfusão), o que reduz a lesão de isquemia-reperfusão e é mais bem tolerado, inclusive em fígados comprometidos.","w":{"A":"O clampeamento da cava supra e infra-hepática somado ao Pringle configura a exclusão vascular total do fígado, manobra distinta, reservada a lesões próximas às veias hepáticas ou à cava, com repercussão hemodinâmica importante.","C":"A ligadura definitiva da artéria hepática própria não é a manobra, e comprometeria a vascularização da via biliar.","D":"É manobra rotineira e amplamente utilizada."},"p":["Sangramento persistente durante o Pringle indica origem nas veias hepáticas ou na cava (retrógrado), não no pedículo — informação útil no trauma hepático, em que o Pringle serve inclusive como teste diagnóstico da fonte da hemorragia."],"f":"Sabiston, 21ª ed., cap. 53; Pringle JH, Ann Surg 1908 — descrição original; literatura sobre clampeamento intermitente."}],"cases":{"Vol. I|1":"Cuidados perioperatórios","Vol. I|3":"Infecção em cirurgia: peritonite e profilaxia","Vol. I|4":"Nutrição em cirurgia: enteral × parenteral","Vol. I|5":"ATLS: cuidados iniciais e trauma torácico","Vol. I|6":"ATLS: trauma abdominal, TCE e TRM","Vol. I|7":"Hérnias de parede abdominal","Vol. I|8":"Litíase biliar","Vol. II|9":"Pancreatite aguda e crônica","Vol. II|10":"Abdome agudo","Vol. II|11":"Esôfago: doenças benignas e tumores","Vol. II|12":"Tumores de estômago","Vol. II|13":"Tumores de pâncreas","Vol. II|14":"Tumores de cólon e reto","Vol. II|15":"Tumores de fígado e vias biliares","Vol. III (autorais)|2":"REMIT — questões inéditas","Vol. III (autorais)|3":"Infecção em cirurgia — questões inéditas","Vol. III (autorais)|4":"Nutrição em cirurgia — questões inéditas","Vol. III (autorais)|8":"Litíase biliar — questões inéditas","Vol. III (autorais)|10":"Abdome agudo — questões inéditas","Vol. III (autorais)|12":"Tumores de estômago — questões inéditas","Vol. III (autorais)|13":"Tumores de pâncreas — questões inéditas","Vol. III (autorais)|14":"Tumores de cólon e reto — questões inéditas"},"f":[["B","Quais são os 3 mecanismos da tríade de Virchow?","Estase venosa, lesão endotelial e hipercoagulabilidade.","Caso01_PerioperatorioTEV"],["B","Liste os principais fatores de risco para TEV no pós-operatório.","Câncer, cirurgia de grande porte, imobilização, obesidade, idade avançada, estrogênios, trombofilias, gravidez/puerpério, TEV prévio.","Caso01_PerioperatorioTEV"],["B","Na prova: insuficiência hepática é fator de risco para TEV? Qual a ressalva atual?","Para a banca, NÃO (↓ fatores II, VII, IX, X e INR alto, tendência a sangramento). ⚠️ Correção/atualização: na cirrose há \"reequilíbrio hemostático\" (↓ proteína C, S e antitrombina também) e INR alto NÃO protege contra trombose; TEV e trombose de porta ocorrem. Responda \"não é fator\" só por convenção da banca.","Caso01_PerioperatorioTEV ATUALIZADO"],["B","Cirurgia laparoscópica como fator de risco para TEV: qual o raciocínio?","É a opção de MENOR risco (menos inflamação, deambulação precoce), mas não é protetora: pneumoperitônio e Trendelenburg aumentam a estase em MMII.","Caso01_PerioperatorioTEV"],["B","Paciente com câncer pélvico, anticoncepcional oral e pós-operatório de grande porte: qual profilaxia de TEV?","Combinada: mecânica (compressão pneumática intermitente) + farmacológica (HBPM). Em cirurgia oncológica abdominal/pélvica, manter HBPM por 4 semanas após a alta.","Caso01_PerioperatorioTEV"],["C","Na cirurgia oncológica abdominal/pélvica, a HBPM é mantida por {{c1::4 semanas}} após a alta e associada à profilaxia {{c2::mecânica (compressão pneumática)}}.","Escore de Caprini ≥ 5 = risco alto/muito alto.","Caso01_PerioperatorioTEV"],["B","Qual o destino do lactato do Ringer lactato?","Metabolizado no fígado (oxidação a piruvato e gliconeogênese), consumindo H⁺ → gera bicarbonato. Efeito alcalinizante discreto; preferível ao SF 0,9% em grandes volumes (acidose hiperclorêmica).","Caso01_Fluidos"],["B","Quando o Ringer lactato perde parte do efeito tampão?","Em hepatopatia grave e choque com hipoperfusão hepática (↓ clearance do lactato). Também confunde a interpretação do lactato sérico como marcador de perfusão.","Caso01_Fluidos"],["B","Cite os principais pilares do ERAS/ACERTO.","Aconselhamento pré-op, jejum abreviado (líquidos claros até 2 h, sólidos até 6 h), maltodextrina 2 h antes, sem preparo mecânico rotineiro do cólon, analgesia multimodal/peridural, restrição hídrica (evitar fluidoterapia liberal), evitar drenos e sondas, dieta e mobilização precoces, profilaxia de náusea/vômito.","Caso01_ERAS"],["B","Antigo paradigma × ERAS: o que mudou em relação a sonda nasogástrica, drenos, opioides e fluidos?","Antes: SNG, drenos, opioides e hidratação liberal rotineiros. Hoje: uso SELETIVO (SNG só se íleo/obstrução/vômitos; ↑ atelectasia e pneumonia, não reduz deiscência), poupar opioides, fluidos restritivos.","Caso01_ERAS"],["B","Por que a peridural é pilar do ERAS em laparotomias?","Bloqueia fibras simpáticas eferentes (T5–L2), atenua o íleo paralítico, poupa opioide e reduz a resposta endócrino-metabólica ao trauma.","Caso01_ERAS"],["B","Quais os 4 mecanismos do íleo pós-operatório?","Resposta inflamatória à manipulação intestinal, hiperatividade simpática reflexa, opioides e reflexos neurogênicos espinhais.","Caso01_ERAS"],["B","Jejum pré-operatório (ASA 2023 / ACERTO): tempos para líquidos claros, leite/refeição leve e refeição completa?","Líquidos claros: até 2 h. Leite, sucos com polpa, refeição leve: 6 h. Refeição com gordura/carne: 8 h (ASA).","Caso01_ERAS"],["B","O que é \"líquido claro\" no jejum?","Translúcido, sem resíduo e sem gordura: água, chá, café sem leite, suco coado sem polpa, bebida com maltodextrina. Leite (inclusive vegetal) NÃO é líquido claro.","Caso01_ERAS"],["B","Atualização: pacientes em uso de agonistas de GLP-1 (semaglutida, tirzepatida) antes de anestesia?","⚠️ Risco aumentado de conteúdo gástrico residual/aspiração. Orientação multissocietária (2024): considerar dieta líquida clara por 24 h antes e avaliar caso a caso (suspensão x manutenção, ultrassom gástrico se dúvida). Confirmar protocolo do serviço.","Caso01_ERAS ATUALIZADO"],["B","Quais as 3 fases do checklist de Cirurgia Segura da OMS (PNSP/Portaria 529/2013)?","Sign in (antes da indução anestésica), Time out (antes da incisão), Sign out (antes de o paciente sair da sala).","Caso01_CirurgiaSegura"],["B","O que é confirmado no Sign in?","Identidade, sítio cirúrgico, consentimento, alergias, via aérea difícil, risco de sangramento.","Caso01_CirurgiaSegura"],["B","O que é confirmado no Time out?","Apresentação nominal da equipe (marca registrada), confirmação de paciente/sítio/procedimento, antibiótico nos últimos 60 min, exames de imagem essenciais expostos.","Caso01_CirurgiaSegura"],["B","Qual item identifica o Time out em um enunciado?","Apresentação nominal de todos os membros da equipe (com função), imediatamente antes da incisão.","Caso01_CirurgiaSegura"],["B","Quais vacinas são indicadas na esplenectomia?","Pneumocócica, meningocócica e anti-Haemophilus influenzae tipo b (bactérias encapsuladas). Atualização: pneumo conjugada (PCV20/PCV21) + meningo ACWY e MenB conforme calendário vigente.","Caso01_Esplenectomia ATUALIZADO"],["B","Qual o melhor momento para vacinar na esplenectomia eletiva e na de urgência?","Eletiva: ≥ 2 semanas ANTES. Urgência (trauma): ≥ 14 dias DEPOIS.","Caso01_Esplenectomia"],["B","Qual o agente mais frequente da sepse pós-esplenectomia (OPSI)?","Streptococcus pneumoniae (50–90%), seguido de N. meningitidis e H. influenzae b.","Caso01_Esplenectomia"],["B","Colecistectomia videolaparoscópica em ASA II, boa capacidade funcional: qual regime?","Hospital-dia/ambulatorial (alta em < 24 h).","Caso01_Perioperatorio"],["B","Paciente assintomático com capacidade funcional ≥ 4 METs, cirurgia de risco baixo/intermediário: precisa de parecer/teste cardiológico?","Não. Segue para a cirurgia (algoritmo ACC/AHA).","Caso01_RiscoCardiaco"],["B","Cite exemplos de 1 MET, 4 METs e > 10 METs.","1 MET: repouso. 4 METs: subir um lance de escada, caminhada rápida em plano, tarefa doméstica pesada. > 10 METs: esportes vigorosos.","Caso01_RiscoCardiaco"],["B","Qual a sequência do algoritmo ACC/AHA de avaliação cardíaca pré-operatória?","1) Urgência? 2) Síndrome coronariana aguda? 3) Risco cardíaco estimado (RCRI/Lee, NSQIP) 4) Capacidade funcional (≥ 4 METs?) 5) Teste só se mudar conduta.","Caso01_RiscoCardiaco"],["B","Manejo de medicações no dia da cirurgia: betabloqueador, SGLT2 e IECA/BRA?","Manter betabloqueador (rebote se suspenso). Suspender SGLT2 3 dias antes (4 dias ertugliflozina): risco de cetoacidose euglicêmica. IECA/BRA: tendência a suspender 24 h antes pelo risco de hipotensão.","Caso01_RiscoCardiaco"],["B","Quais medicações geralmente se mantêm no perioperatório?","Anti-hipertensivos (ressalva IECA/BRA), betabloqueador, estatina, psicotrópicos, levotiroxina, inalatórios e corticoide crônico (com dose de estresse).","Caso01_RiscoCardiaco"],["B","Classificação ASA de I a VI?","I: hígido. II: doença sistêmica leve controlada. III: doença sistêmica grave com limitação funcional. IV: doença grave, ameaça constante à vida. V: moribundo. VI: morte encefálica (doador). E = emergência.","Caso01_RiscoCardiaco"],["B","O escore ASA se correlaciona com morbimortalidade perioperatória?","Sim, correlação consistente (apesar de subjetivo). Afirmar que \"não se correlaciona\" é falso.","Caso01_RiscoCardiaco"],["B","Por que a explanação pré-operatória do procedimento é obrigatória?","Reduz ansiedade, melhora adesão a dieta/deambulação precoces, diminui analgésicos e cumpre o consentimento informado (proteção clínica e médico-legal). É o primeiro item do ACERTO.","Caso01_ERAS"],["B","REMIT: qual o principal estímulo que dispara a resposta endócrina ao trauma/cirurgia?","Estímulo neural aferente (nociceptores da área lesada → medula → hipotálamo → eixo HHA e sistema simpático). Prova clínica: bloqueio neuroaxial atenua a resposta.","Caso02_REMIT"],["B","Qual a sequência do eixo hormonal ativado na REMIT?","Dor/lesão → hipotálamo (CRH) → adeno-hipófise (ACTH) → córtex adrenal (cortisol). Simultaneamente: simpático → medula adrenal (catecolaminas); neuro-hipófise → ADH.","Caso02_REMIT"],["B","Quais hormônios SOBEM na fase aguda da REMIT?","Cortisol, ACTH, catecolaminas, glucagon, ADH, aldosterona, GH, prolactina.","Caso02_REMIT"],["B","Quais hormônios CAEM na REMIT?","Insulina (queda relativa, com resistência periférica), T3 (síndrome do eutireóideo doente), testosterona e estrogênio.","Caso02_REMIT"],["B","Tríade dos hormônios contrarregulatórios do trauma?","Cortisol, glucagon e catecolaminas: glicogenólise, gliconeogênese, lipólise e proteólise → hiperglicemia do estresse mesmo em não diabéticos.","Caso02_REMIT"],["B","Quanto o cortisol aumenta após cirurgia de grande porte e quais suas ações?","4–5× o basal em 24 h. Gliconeogênese, proteólise muscular, lipólise, resistência à insulina e efeito permissivo às catecolaminas.","Caso02_REMIT"],["B","Pegadinha: o que NÃO aumenta entre os hormônios do trauma (ACTH, cortisol, catecolaminas, ADH, aldosterona)?","A insulina: diminui (relativa) na fase aguda; o erro é incluí-la entre os que sobem.","Caso02_REMIT"],["B","Fase EBB da REMIT: características?","Primeiras horas (\"choque\"): ↓ débito cardíaco, ↓ VO₂, hipoperfusão, hipotermia, com hormônios de estresse JÁ elevados.","Caso02_REMIT"],["B","Fase FLOW da REMIT: características?","Dias (\"hipermetabólica\"): ↑ débito cardíaco, ↑ VO₂, febre, hiperglicemia, proteólise e gliconeogênese.","Caso02_REMIT"],["C","Na REMIT, a fase {{c1::EBB}} é hipodinâmica ({{c2::↓ DC e ↓ VO₂}}) e a fase {{c3::FLOW}} é hiperdinâmica ({{c4::↑ DC e ↑ VO₂}}).","","Caso02_REMIT"],["B","Quanto dura a fase catabólica após cirurgia de grande porte não complicada (Moore)?","3–5 dias, com balanços nitrogenado e calórico negativos.","Caso02_REMIT"],["B","Sequência das fases de Moore?","Catabólica (3–5 d) → transição (1–2 d, diurese) → anabólica precoce (semanas) → ganho de gordura (meses).","Caso02_REMIT"],["B","Qual o marcador clínico clássico de entrada na fase anabólica (regressão da REMIT)?","Retorno da fome/apetite (também diurese restabelecida e balanço nitrogenado positivo).","Caso02_REMIT"],["B","Quais condutas ATENUAM a REMIT?","Videolaparoscopia, peridural/bloqueios regionais, analgesia preemptiva, jejum abreviado com carboidrato, normotermia, aconselhamento e pré-habilitação.","Caso02_REMIT"],["B","Quais condutas INTENSIFICAM a REMIT?","Jejum prolongado, grandes incisões, uso excessivo de dispositivos de energia, hipotermia, dor não controlada.","Caso02_REMIT"],["B","Como a clonidina atenua a REMIT?","Agonista α2 central: ↓ liberação de noradrenalina → ↓ resposta simpática (sedação, analgesia, bradicardia, hipotensão). Dexmedetomidina: mesmo mecanismo, mais seletiva.","Caso02_REMIT"],["B","Quais as principais citocinas da REMIT e suas funções?","IL-1 (pirógeno endógeno, febre via PGE2) e TNF-α (mobiliza substratos: glicogenólise/lipólise). Ambas induzem IL-6 hepática → proteínas de fase aguda.","Caso02_REMIT"],["B","Proteínas de fase aguda positivas e negativas?","Positivas (↑): PCR, fibrinogênio. Negativas (↓): albumina, transferrina, pré-albumina.","Caso02_REMIT"],["B","Qual o mecanismo da vasopressina (ADH) no pós-operatório?","Libera-se com dor, hipovolemia, náusea e estresse; age em V2 do ducto coletor (aquaporina-2) → reabsorve água livre → hiponatremia dilucional e oligúria com urina concentrada.","Caso02_REMIT"],["B","Pós-operatório com hiponatremia + osmolaridade urinária elevada + taquicardia e vasoconstrição: mecanismo?","Excesso de ADH (estímulo não osmótico: dor/estresse) + ativação simpática. Evitar soluções hipotônicas.","Caso02_REMIT"],["B","Hipófise: quais hormônios saem da adeno e da neuro-hipófise?","Adeno: ACTH, GH, TSH, FSH, LH, prolactina. Neuro: ADH e ocitocina.","Caso02_REMIT"],["B","Metabolismo na fase flow: de onde vem a glicose?","Proteólise muscular fornece alanina e glutamina ao fígado → gliconeogênese, para tecidos glicose-dependentes (cérebro, hemácias, ferida, células inflamatórias).","Caso02_REMIT"],["B","Dose de estresse de corticoide no perioperatório (clássica) e atualização?","Clássico: pequeno porte 25 mg hidrocortisona; médio 50–75 mg/dia 1–2 dias; grande 100 mg na indução + 50 mg/dia (ou 25 mg 8/8 h) por 48–72 h. ⚠️ Atualização (diretriz britânica Woodcock 2020, Anaesthesia): uso de prednisolona ≥ 5 mg/dia: 100 mg IV na indução e depois 200 mg/24 h em infusão, até poder tomar o dobro da dose oral habitual, com desmame em ~48 h. A evidência é fraca e doses menores podem bastar; confirme o protocolo local.","Caso02_REMIT ATUALIZADO"],["B","ISC que aparece nas primeiras 24–48 h: quais agentes e qual diagnóstico pensar?","Infecção necrotizante de partes moles: Streptococcus pyogenes (grupo A) e Clostridium perfringens. Tratamento: desbridamento cirúrgico precoce + antibiótico amplo.","Caso03_Infeccao"],["B","Fasciíte necrotizante tipo I × tipo II?","Tipo I: polimicrobiana (aeróbios + anaeróbios), diabéticos e Fournier. Tipo II: monomicrobiana por S. pyogenes, jovens hígidos. Tratamento sempre: desbridamento cirúrgico precoce.","Caso03_Infeccao"],["B","Qual a janela de tempo da antibioticoprofilaxia antes da incisão segundo a OMS?","Dentro de 120 min antes da incisão, ajustada à meia-vida (cefazolina/cefuroxima: 30–60 min; vancomicina e fluoroquinolona: mais próximo de 120 min).","Caso03_Profilaxia"],["B","Quando termina a antibioticoprofilaxia cirúrgica?","Ao fim da cirurgia: dose na indução, redose se cirurgia > 2 meias-vidas (cefazolina ~4 h) ou perda > 1500 mL. Manter após = terapia, exige justificativa (foco não controlado, perfuração, etc.).","Caso03_Profilaxia"],["B","Características do antimicrobiano ideal para profilaxia?","Espectro estreito dirigido à flora do sítio, boa penetração tecidual, dose única, baixa toxicidade, baixo custo. Protótipo: cefazolina.","Caso03_Profilaxia"],["B","Profilaxia × terapia: diferença?","Profilaxia: espectro estreito, dose única, na indução, redose se longa. Terapia: espectro pelo foco/gravidade, duração definida, descalonamento por cultura.","Caso03_Profilaxia"],["B","Qual preparo de pele tem evidência robusta (recomendação forte OMS)?","Clorexidina alcoólica (efeito imediato do álcool + residual da clorexidina); superior ao PVPI aquoso.","Caso03_ISC"],["B","Recomendações FORTES da OMS para ISC?","Profilaxia em até 120 min, não usar lâmina na tricotomia (tricotomia só se necessária, com tricotomizador), clorexidina alcoólica, não prolongar antibiótico no pós-op. Também: normotermia, controle glicêmico, FiO₂ 80% em intubados (ver card de atualização).","Caso03_ISC"],["B","Banho pré-operatório com clorexidina é superior ao com sabonete comum?","Falso. OMS recomenda banho pré-op, mas SEM evidência de superioridade da clorexidina sobre sabonete comum/antimicrobiano.","Caso03_ISC"],["B","Atualização: FiO₂ 80% intra e pós-operatória para reduzir ISC: ainda vale?","⚠️ A OMS (2016) recomendava FiO₂ 80% em intubados (intra-op e 2–6 h após); o CDC (2017) já considerava a evidência insuficiente e estudos posteriores são conflitantes. Para a prova da disciplina siga a OMS; na prática, individualize.","Caso03_ISC ATUALIZADO"],["B","Qual antisséptico age por radicais livres?","Peróxido de hidrogênio (H₂O₂): gera radicais hidroxila, eficaz contra anaeróbios (sem catalase); uso restrito por citotoxicidade.","Caso03_ISC"],["B","Colecistite aguda: duração do antibiótico após colecistectomia (TG18)?","Grau I/II com foco ressecado: suspender em ≤ 24 h. Grau III ou foco não completamente controlado: 4–7 dias após o controle do foco. Bacteremia por Enterococcus/Streptococcus: ≥ 2 semanas. ⚠️ Gabarito do banco (A: \"só na indução\") entra em conflito com a literatura em casos graves/bile purulenta: confirmar com o tutor.","Caso03_Infeccao ATUALIZADO"],["B","STOP-IT (Sawyer, NEJM 2015): qual a conclusão?","Em infecção intra-abdominal com controle adequado do foco, ~4 dias de antibiótico equivalem a esquemas prolongados (até 2 dias após resolução de febre/leucocitose).","Caso03_Infeccao"],["B","Relaparotomia: programada × sob demanda?","Programada: reintervenções em intervalos fixos (24–48 h). Sob demanda: reoperar só se deterioração/novo foco. Ensaio de van Ruler: sem diferença de mortalidade; sob demanda poupa reoperações. Escolha depende do serviço.","Caso03_Infeccao"],["B","Pós-op de colectomia (5º dia) com taquicardia, taquipneia, íleo, drenagem sero-hemática e TC com pneumoperitônio + líquido livre: diagnóstico e conduta?","Deiscência de anastomose (pico 5º–7º dia). Antibiótico + estabilização; com repercussão sistêmica: laparotomia exploradora com colostomia (Hartmann).","Caso03_Infeccao"],["B","Pneumoperitônio no pós-operatório: quando valorizar?","Esperado até 3–7 dias após laparotomia. Indica deiscência quando associado a líquido livre/coleção e deterioração clínica.","Caso03_Infeccao"],["B","Como se interpreta hoje a albumina sérica?","Marcador de gravidade da doença/inflamação (proteína de fase aguda negativa), NÃO de estado nutricional. Mantém forte valor PROGNÓSTICO (↑ morbimortalidade, deiscência, ISC).","Caso04_Nutricao"],["B","Meia-vida da albumina × pré-albumina × transferrina?","Albumina ~20 dias (prognóstico); pré-albumina/transtirretina ~2 dias (resposta recente à terapia nutricional); transferrina ~8 dias (influenciada pelo ferro).","Caso04_Nutricao"],["B","Critérios de risco nutricional GRAVE (ESPEN/ACERTO)?","Perda ponderal > 10–15% em 6 meses, IMC < 18,5, ASG grau C, albumina < 3,0 g/dL (sem disfunção hepática/renal). A transferrina NÃO faz parte.","Caso04_Nutricao"],["B","Conduta no paciente cirúrgico com risco nutricional grave?","Terapia nutricional pré-operatória por 7–14 dias, adiando a cirurgia eletiva (inclusive oncológica) se necessário.","Caso04_Nutricao"],["B","Como funciona o NRS-2002?","Comprometimento nutricional (0–3) + gravidade da doença (0–3) + 1 ponto se idade ≥ 70. Escore ≥ 3: indica terapia nutricional; ≥ 5: risco elevado.","Caso04_Nutricao"],["B","Classificação da ASG (Avaliação Subjetiva Global)?","A: bem nutrido. B: moderadamente desnutrido/em risco. C: gravemente desnutrido.","Caso04_Nutricao"],["B","Metas calóricas e proteicas em cirurgia?","Energia: 25–30 kcal/kg/dia. Proteína: 1,2–1,5 g/kg/dia em cirúrgicos (até 2,0 g/kg/dia em críticos).","Caso04_Nutricao"],["B","Quais as complicações características da NPT?","Infecção de corrente sanguínea (cateter), litíase/lama biliar (sem estímulo enteral → sem CCK → estase), hiperglicemia, síndrome de realimentação, esteatose/colestase hepática, distúrbios hidroeletrolíticos, complicações da punção central.","Caso04_Nutricao"],["B","Por que a NPT causa litíase biliar?","Sem alimento no TGI não há liberação de colecistocinina → vesícula não esvazia → estase e lama biliar.","Caso04_Nutricao"],["B","Qual a hierarquia das vias de nutrição?","Via oral → suplemento oral → enteral por sonda → parenteral. \"Se o intestino funciona, use-o.\" Parenteral só se TGI inacessível, não funcionante ou insuficiente após tentativa enteral.","Caso04_Nutricao"],["B","Politrauma de 10 dias, TGI funcionante, aceitando só 40% da dieta oral: conduta?","Nutrição enteral por sonda (complementando a via oral).","Caso04_Nutricao"],["B","Quando se evita iniciar nutrição enteral?","Íleo/obstrução (ex.: resíduo gástrico > 600 mL com distensão), instabilidade hemodinâmica com altas doses de vasopressor, obstrução mecânica completa, isquemia intestinal, HDA ativa e vômitos incoercíveis.","Caso04_Nutricao"],["B","Componentes da dieta imunomoduladora?","Arginina, ácidos graxos ômega-3 e nucleotídeos (glutamina entra em algumas fórmulas, mas ⚠️ não é recomendada de rotina pela ESPEN). A tiamina NÃO faz parte. ⚠️ Atenção: o gabarito do banco (Q4.7: ômega-3) está errado; a resposta coerente é tiamina.","Caso04_Nutricao ATUALIZADO"],["B","Benefício comprovado da imunonutrição? Indicação e momento?","Reduz complicações infecciosas e tempo de internação (NÃO reduz mortalidade global). Indicada em cirurgia oncológica de grande porte do TGI superior com desnutrição; iniciar 5–7 dias antes e manter 5–7 dias no pós-op.","Caso04_Nutricao"],["B","Síndrome de realimentação: mecanismo, prevenção e atualização?","Retorno da glicose → insulina ↑ → desloca P, K e Mg para o intracelular (hipofosfatemia, hipocalemia, hipomagnesemia). Repor tiamina ANTES das calorias; monitorar eletrólitos. ⚠️ Atualização: início com 10–20 kcal/kg/dia nas primeiras 24 h (ASPEN 2020; NICE 10 kcal/kg, 5 se risco extremo) e progressão gradual, em vez de \"25% da meta\" fixo.","Caso04_Nutricao ATUALIZADO"],["B","Desnutrição grave + perfuração gástrica contaminada + falha de acesso enteral: qual nutrição?","Nutrição parenteral, iniciada com aporte baixo e progressão lenta (risco de síndrome de realimentação).","Caso04_Nutricao"],["B","Paciente com tumor gástrico obstrutivo, perda de 10% do peso em 1 semana, IMC 18, ingesta 40%: classificação?","Risco nutricional grave (NRS-2002 ≥ 5).","Caso04_Nutricao"],["B","Quais são as vias aéreas DEFINITIVAS no ATLS?","Tubo orotraqueal, tubo nasotraqueal e via aérea cirúrgica (cricotireoidostomia ou traqueostomia). Exige tubo na traqueia + cuff insuflado + fixado + conectado a O₂.","Caso05_ATLS_Torax"],["B","Combitubo, máscara laríngea e tubo laríngeo são vias aéreas definitivas?","Não, são temporárias/supraglóticas (pontes). O combitubo costuma ficar no esôfago.","Caso05_ATLS_Torax"],["B","Percussão maciça + murmúrio abolido × hipertimpânica + murmúrio abolido no trauma?","Maciça = hemotórax (drenar). Hipertimpânica + jugular túrgida + desvio de traqueia = pneumotórax hipertensivo (descompressão).","Caso05_ATLS_Torax"],["B","Choque + murmúrio diminuído com macicez à esquerda + dor abdominal: conduta inicial?","Drenagem torácica em selo d'água (tratar \"B\" antes de seguir; diagnóstica e terapêutica). Duas fontes de choque hipovolêmico possíveis (tórax e abdome).","Caso05_ATLS_Torax"],["B","Indicações de toracotomia no hemotórax?","Clássico (ATLS 10ª): drenagem inicial > 1500 mL ou > 200 mL/h por 2–4 h. ⚠️ ATLS 11ª ed. retirou os critérios rígidos de volume: decide-se pela avaliação clínica e fisiológica (instabilidade persistente).","Caso05_ATLS_Torax"],["B","Turgência jugular no trauma de tórax: diferencial?","Pneumotórax hipertensivo, tamponamento cardíaco e contusão miocárdica com falência de VD. Murmúrio abolido unilateral decide pelo pneumotórax hipertensivo.","Caso05_ATLS_Torax"],["B","Pneumotórax hipertensivo: conduta e local da descompressão por agulha (ATLS 10ª/11ª)?","Descompressão imediata (sem esperar RX) seguida de toracostomia com drenagem em selo d'água. Adulto: 5º EIC, linha axilar anterior (parede mais fina). 2º EIC hemiclavicular continua aceito. Criança: 2º EIC hemiclavicular. Na ATLS 11ª ed. (2025) a ênfase é em agulha de menor calibre e na decisão clínica; confirme o sítio no manual vigente.","Caso05_ATLS_Torax ATUALIZADO"],["B","Qual a mudança central do ATLS 11ª edição (2025) na avaliação primária?","Acrescentou-se o \"x\": xABCDE = controle de hemorragia externa exsanguinante PRIMEIRO (torniquete, agentes hemostáticos), depois via aérea, respiração, circulação, déficit neurológico e exposição. Também: cristaloide mínimo, transfusão balanceada 1:1:1 ou sangue total de baixo título, TXA em ≤ 3 h (1 g + 1 g; 2 g em bolus no TCE), estabilizar choque antes da intubação e capítulo próprio de trauma penetrante.","Caso05_ATLS_Torax ATUALIZADO"],["B","Por que a ventilação com bolsa-válvula-máscara pode precipitar AESP em pneumotórax hipertensivo?","A pressão positiva empurra ar para o espaço pleural, colapsa o retorno venoso e causa AESP. Causa mecânica reversível: descompressão imediata.","Caso05_ATLS_Torax"],["B","Diferenças do trauma na gestante?","Elevação do diafragma (drenar 1–2 EIC acima), hipervolemia fisiológica (mascara perda de até 1500 mL), decúbito lateral esquerdo após 20 semanas (alivia compressão da cava).","Caso05_ATLS_Torax"],["B","Critérios NEXUS para dispensar imagem cervical?","Todos presentes: sem dor à palpação da linha média posterior, sem déficit neurológico focal, consciência normal, sem intoxicação, sem lesão dolorosa distrativa. (Sobriedade é um deles.)","Caso05_ATLS_Torax"],["B","Canadian C-Spine Rule: aplicabilidade?","Alternativa ao NEXUS (sensibilidade semelhante, maior especificidade); não se aplica a Glasgow < 15, instáveis ou intoxicados.","Caso05_ATLS_Torax"],["B","Trauma torácico fechado, escoriação, dessaturação, intubado, estável, FAST negativo: provável diagnóstico e conduta?","Contusão pulmonar: suporte (ventilação mecânica protetora). Piora nas primeiras 24–48 h; RX inicial pode ser normal, TC é mais sensível.","Caso05_ATLS_Torax"],["B","Pneumotórax estável de volume significativo em RX (ausência de trama vascular periférica): conduta?","Toracostomia com drenagem em selo d'água. Conferir sempre a lateralidade na imagem.","Caso05_ATLS_Torax"],["B","Gangrena de Fournier: etiologia e tratamento?","Fasciíte necrotizante polimicrobiana (tipo I: anaeróbios, estreptococo e enterobactérias; crepitação = gás). Ressuscitação, antibiótico amplo (ex.: pip-tazo + clindamicina ± vancomicina) e desbridamento cirúrgico amplo e precoce.","Caso05_Fournier"],["B","Glasgow: pontuações de cada componente?","Ocular: 4 espontânea / 3 ao chamado / 2 à dor / 1 nenhuma. Verbal: 5 orientado / 4 confuso / 3 palavras inapropriadas / 2 sons incompreensíveis / 1 nenhuma. Motora: 6 obedece / 5 localiza / 4 retirada / 3 decorticação (flexão anormal) / 2 descerebração (extensão) / 1 nenhuma.","Caso06_TCE"],["B","Na assimetria motora, qual lado pontua no Glasgow?","Sempre a MELHOR resposta motora. Ex.: decortica à D (3), localiza à E (5) → motora 5. Atualização: registrar também reatividade pupilar (GCS-P = GCS − nº de pupilas não reativas).","Caso06_TCE ATUALIZADO"],["B","Glasgow ≤ 8: conduta imediata no TCE?","Via aérea definitiva (IOT) e TC de crânio sem contraste após estabilização.","Caso06_TCE"],["B","Quais as lesões secundárias a evitar no TCE?","Hipóxia (SatO₂ < 90%), hipotensão, hipercapnia, hipoglicemia, hipertermia e convulsão. Atualização (BTF 4ª ed.): manter PAS ≥ 100 mmHg (50–69 anos) ou ≥ 110 mmHg (15–49 e > 70 anos); ATLS clássico cita PAS > 90.","Caso06_TCE ATUALIZADO"],["B","Doutrina de Monro-Kellie: composição e compensação inicial?","Crânio rígido: parênquima ~80%, sangue ~10%, líquor ~10%. Massa expansiva é compensada inicialmente por ↓ líquor e ↓ sangue venoso. Esgotada a complacência, pequenos aumentos de volume elevam muito a PIC.","Caso06_TCE"],["B","Como calcular a PPC e quais os alvos?","PPC = PAM − PIC. Alvo 60–70 mmHg (BTF). Tratar PIC > 22 mmHg.","Caso06_TCE"],["B","Achados da fratura de base ANTERIOR do crânio?","Sinal do guaxinim (equimose periorbitária), rinorragia/rinorreia liquórica, anosmia (I par), lesão de nervos oculomotores. Tontura não é típica.","Caso06_TCE"],["B","Achados da fratura de base MÉDIA/POSTERIOR (rochedo)?","Sinal de Battle (equimose mastóidea), otorragia/otorreia, paralisia facial periférica, hipoacusia e vertigem. Contraindica SNG nasal na fratura de base anterior.","Caso06_TCE"],["B","Hematoma extradural × subdural?","Extradural: artéria meníngea média, biconvexo (lentiforme), não cruza suturas, intervalo lúcido, bom prognóstico se drenado cedo. Subdural: veias-ponte, crescente, cruza suturas, lesão parenquimatosa associada, pior prognóstico.","Caso06_TCE"],["B","Indicações cirúrgicas do hematoma extradural?","Volume > 30 mL, espessura > 15 mm, desvio de linha média > 5 mm, ou deterioração neurológica (GCS < 9 com anisocoria = urgente).","Caso06_TCE"],["B","Distribuição trimodal da mortalidade no trauma (Trunkey)?","Imediata (segundos–minutos: grandes vasos, coração, cérebro), precoce (minutos–horas, \"hora de ouro\": hemorragias tratáveis) e tardia (dias–semanas: sepse e falência de órgãos).","Caso06_TraumaAbdome"],["B","Quais são as indicações de laparotomia imediata no trauma abdominal penetrante?","Instabilidade hemodinâmica, peritonite, evisceração, sangramento por SNG ou toque retal, arma de fogo transfixante do abdome.","Caso06_TraumaAbdome"],["B","Paciente instável + suspeita de lesão abdominal: o que fazer?","Sala de cirurgia direta (laparotomia). Imagem é para o paciente estável. Peritonite franca + choque = laparotomia, sem exames adicionais.","Caso06_TraumaAbdome"],["B","Estável, trauma contuso, esplenectomia grau III na TC: conduta?","Tratamento não operatório (TNO): requer trauma contuso, estabilidade hemodinâmica e ausência de outras indicações cirúrgicas; sucesso > 90% nos graus I–III; angioembolização se blush/pseudoaneurisma. Exige vigilância ativa (Ht seriado, cirurgião e CC disponíveis).","Caso06_TraumaAbdome"],["B","O que é a ruptura esplênica em dois tempos?","Hematoma subcapsular contido pela cápsula; estabilidade por horas–dias; ruptura tardia da cápsula → hemorragia abrupta.","Caso06_TraumaAbdome"],["B","FAST × LPD: papel e contraindicações?","Ambos à beira do leito, indicados no instável/exame não confiável. LPD: contraindicação absoluta se laparotomia já indicada; relativas: cirurgia prévia, obesidade mórbida, gestação avançada, coagulopatia. FAST não tem contraindicação, mas é limitado (retroperitônio, víscera oca). ⚠️ O gabarito do banco (Q6.4, \"sem contraindicações\") é discutível: confirmar com o tutor.","Caso06_TraumaAbdome ATUALIZADO"],["B","Fratura pélvica instável (livro aberto) + hipotensão: sequência de condutas?","Faixa pélvica (binder) → ressuscitação com protocolo de transfusão maciça + ácido tranexâmico → FAST. FAST positivo: laparotomia. FAST negativo: angioembolização ou packing pré-peritoneal.","Caso06_TraumaAbdome"],["B","Ácido tranexâmico no trauma (CRASH-2): dose e janela?","1 g em 10 min seguido de 1 g em 8 h, iniciado em até 3 h do trauma (maior benefício na 1ª hora).","Caso06_TraumaAbdome"],["B","Tríade letal do trauma e indicação de damage control?","Hipotermia, acidose metabólica e coagulopatia (se retroalimentam). Indica cirurgia de controle de danos.","Caso06_TraumaAbdome"],["B","Etapas do damage control?","1) Cirurgia abreviada: controlar hemorragia (packing, clampeamento, shunt) e contaminação (grampear alças, sem anastomose), abdome aberto. 2) UTI: reaquecer, corrigir coagulopatia/acidose. 3) Reoperação definitiva em 24–48 h.","Caso06_TraumaAbdome"],["B","Queda a cavaleiro: sinais de lesão de uretra posterior e conduta?","Sangue no meato, hematoma perineal/escrotal, próstata alta (flutuante), retenção urinária. NÃO sondar: uretrocistografia retrógrada; se lesão, cistostomia suprapúbica. Cullen NÃO é sinal de lesão uretral.","Caso06_TraumaAbdome"],["B","Sinais de Cullen e Grey-Turner: significado?","Cullen: equimose periumbilical. Grey-Turner: equimose de flanco. Ambos indicam sangramento retroperitoneal (pancreatite hemorrágica, AAA roto, ectópica rota).","Caso06_TraumaAbdome"],["B","Classificação de Le Fort das fraturas de face?","I: horizontal (só o palato se move). II: piramidal (palato + nariz; passa pela parede medial da órbita; risco de rinorreia). III: disjunção craniofacial (toda a face se move).","Caso06_TraumaFace"],["B","Regra dos nove de Wallace no adulto?","Cabeça/pescoço 9%, cada MS 9%, tronco anterior 18%, tronco posterior 18%, cada MI 18%, períneo 1%. Criança: cabeça 18%, cada MI 14%.","Caso06_Queimaduras"],["B","Quais são os limites do triângulo de Hesselbach?","Medial: borda lateral do reto abdominal. Súpero-lateral: vasos epigástricos inferiores. Inferior (base): ligamento inguinal. Por aí saem as hérnias DIRETAS.","Caso07_Hernias"],["B","Regra de ouro: hérnia direta × indireta?","Indireta: lateral aos vasos epigástricos inferiores (anel inguinal interno, acompanha o funículo). Direta: medial a eles (Hesselbach, fraqueza da fáscia transversalis).","Caso07_Hernias"],["B","Qual estrutura NÃO faz parte do funículo espermático?","Artéria epigástrica inferior (ramo da ilíaca externa; é a referência que separa direta de indireta). O funículo contém: ducto deferente, artérias testicular/deferencial/cremastérica, plexo pampiniforme, ramo genital do genitofemoral, linfáticos e vestígio do processo vaginal.","Caso07_Hernias"],["B","Classificação de Nyhus: tipos I a IV?","I: indireta, anel normal (criança). II: indireta com anel alargado e parede posterior íntegra. III: defeito de parede posterior (A direta, B indireta grande/mista, C femoral). IV: recidivada (A direta, B indireta, C femoral, D mista).","Caso07_Nyhus"],["C","Nyhus III: A = {{c1::direta}}, B = {{c2::indireta grande/mista}}, C = {{c3::femoral}}. Nyhus IV (recidiva): A = {{c4::direta}}, B = {{c5::indireta}}, C = {{c6::femoral}}, D = {{c7::mista}}.","","Caso07_Nyhus"],["B","Hérnia indireta recidivada pela segunda vez: Nyhus?","IV (IVB): toda recidiva é tipo IV, qualquer que fosse o tipo original.","Caso07_Nyhus"],["B","Nyhus IIIA e IVC: que hérnias são?","IIIA: inguinal direta. IVC: femoral recidivada.","Caso07_Nyhus"],["B","Hérnia acima do ligamento inguinal, lateral aos epigástricos, anel interno alargado, parede posterior íntegra: classificação?","Nyhus II.","Caso07_Nyhus"],["B","Encarcerada × estrangulada?","Encarcerada: irredutível. Estrangulada: irredutível com comprometimento vascular (dor intensa, hiperemia, febre, leucocitose, sinais de obstrução).","Caso07_Hernias"],["B","Hérnia inguinal estrangulada com líquido livre na cavidade: conduta?","Laparotomia com avaliação de viabilidade e ressecção intestinal. Campo contaminado: evitar tela de polipropileno (usar sutura/tela biológica ou absorvível). ⚠️ Atualização: estudos recentes aceitam telas sintéticas macroporosas leves em campo contaminado selecionado (EHS/HerniaSurge); o ensino clássico ainda evita.","Caso07_Hernias ATUALIZADO"],["B","Técnica de Lichtenstein: o que é e qual sua equivalência com a laparoscopia?","Reparo aberto sem tensão com tela de polipropileno fixada ao ligamento inguinal, tendão conjunto e tubérculo púbico (com abertura para o funículo). Recidiva equivalente a TAPP/TEP; diferenças em dor crônica, recuperação e custo.","Caso07_Tecnicas"],["B","Lichtenstein corrige hérnia femoral?","NÃO: a tela fica acima do ligamento inguinal e o canal femoral (abaixo) permanece descoberto. Femoral: McVay (Cooper), plug femoral, Stoppa, TAPP/TEP.","Caso07_Tecnicas"],["B","Triângulo do desastre (\"doom\") × triângulo da dor (\"pain\")?","Desastre: entre ducto deferente (medial) e vasos gonadais (lateral); contém ilíacos externos; não grampear. Dor: lateral aos vasos gonadais, abaixo do trato iliopúbico; contém nervo femorocutâneo lateral, femoral e ramo femoral do genitofemoral; grampear → neuralgia crônica.","Caso07_Tecnicas"],["B","Princípio de Fruchaud?","Todas as hérnias da virilha (indireta, direta, femoral) atravessam o mesmo orifício miopectíneo; cobri-lo por via pré-peritoneal fundamenta Stoppa, TAPP e TEP.","Caso07_Tecnicas"],["B","Hérnia inguinal recidivada bilateral após Bassini e Shouldice: melhor técnica?","Stoppa (reparo pré-peritoneal por via posterior, tela cobrindo ambos os orifícios miopectíneos): evita a fibrose anterior e a lesão do funículo. Também aceitável: TEP/TAPP.","Caso07_Tecnicas"],["B","Orquite isquêmica pós-herniorrafia: mecanismo e manejo?","Trombose venosa do plexo pampiniforme (congestão venosa, não arterial), entre 2º e 5º dia: testículo edemaciado e doloroso. Tratamento conservador (AINE, suporte escrotal, analgesia); não operar e sem antibiótico de rotina.","Caso07_Complicacoes"],["B","Limites do anel femoral?","Anterior: ligamento inguinal/trato iliopúbico. Posterior: ligamento de Cooper. Medial: ligamento lacunar (Gimbernat). Lateral: veia femoral.","Caso07_Hernias"],["B","Qual variação vascular cuidar no reparo femoral?","Corona mortis: anastomose entre artérias obturatória e epigástrica inferior (~25–30%), sobre o ramo superior do púbis.","Caso07_Hernias"],["B","Toda hérnia femoral deve ser operada? Por quê?","Sim, eletivamente mesmo se assintomática: anel femoral estreito e rígido → alto risco de encarceramento/estrangulamento. Nunca \"watchful waiting\".","Caso07_Hernias"],["B","Quando o tratamento expectante (watchful waiting) é opção?","Hérnia inguinal oligo/assintomática em homens (HerniaSurge 2018); ~70% acabam operados em 10 anos. Em mulheres, operar (risco de femoral). Nunca para femoral.","Caso07_Hernias ATUALIZADO"],["B","Hérnia incisional gigante: complicações imediatas do reparo e estratégias?","Perda de domicílio → hipertensão intra-abdominal/síndrome compartimental e hematoma subcutâneo. Estratégias: pneumoperitônio progressivo, toxina botulínica, separação de componentes (Ramirez), reparo em ponte; monitorar pressão intravesical.","Caso07_Incisional"],["B","Hérnia incisional com tela onlay infectada, paciente estável: conduta?","Drenagem: retirar pontos, desbridar e curativo diário (\"ubi pus, ibi evacua\"). Antibiótico é coadjuvante. Atualização: posição retromuscular (sublay/Rives-Stoppa) é a preferida por reduzir infecção e recidiva.","Caso07_Incisional ATUALIZADO"],["B","Hérnia encarcerada em paciente com dupla antiagregação (stent): conduta?","Emergência: cirurgia imediata em serviço com retaguarda (o risco de necrose supera o hemorrágico). Em urgência, manter AAS; suspender clopidogrel se possível; plaquetas disponíveis. Nunca suspender antiagregação sem avaliar o risco do stent.","Caso07_Hernias"],["B","Hérnia umbilical no adulto: epidemiologia?","⚠️ O enunciado do banco (Q7.9) está incompleto. Em adultos é mais frequente em mulheres (multiparidade, obesidade, ascite); confirmar a proporção com o tutor.","Caso07_Hernias ATUALIZADO"],["B","Qual a origem da artéria cística e sua relação com o triângulo de Calot?","Ramo da artéria hepática direita (~80–90%); cruza obliquamente o triângulo hepatocístico (cístico, hepático comum, borda hepática).","Caso08_Litiase"],["B","Quais os 3 critérios da Visão Crítica de Segurança (Strasberg)?","1) Triângulo hepatocístico limpo de gordura e fibrose. 2) Terço inferior da vesícula separado do leito hepático. 3) Duas e apenas duas estruturas (cístico e artéria cística) entrando na vesícula. Obrigatória antes de clipar.","Caso08_Litiase"],["B","Dor biliar típica: características?","Intensa e CONSTANTE (apesar de \"cólica\"), em HCD/epigástrio, irradia para dorso/escápula direita, dura 30 min a horas, pós-prandial, com náuseas.","Caso08_Litiase"],["B","Colelitíase assintomática: operar? Exceções?","Em geral não há indicação de rotina. Exceções: cálculo > 3 cm, vesícula em porcelana, pólipo ≥ 1 cm (ou 6–9 mm com fatores de risco), anemia falciforme/esferocitose (sobretudo com esplenectomia), pré-transplante, cirurgia bariátrica (selecionados). ⚠️ O gabarito do banco (Q8.2, operar jovem de baixo risco) diverge das diretrizes: confirmar.","Caso08_Litiase ATUALIZADO"],["B","Fisiopatologia da colecistite aguda?","Obstrução do cístico por cálculo → estase/distensão → lesão da mucosa → fosfolipase A2 converte lecitina em lisolecitina (inflamação química) → infecção bacteriana secundária (E. coli, Klebsiella, Enterococcus).","Caso08_Litiase"],["B","Qual a principal enzima envolvida na colecistite aguda?","Fosfolipase A2.","Caso08_Litiase"],["B","Critérios diagnósticos das Tokyo Guidelines 2018 (TG18) para colecistite?","A: sinais locais (Murphy, dor/massa/defesa em HCD). B: sinais sistêmicos (febre, PCR, leucocitose). C: imagem característica. Suspeito: A + B. Definitivo: A + B + C.","Caso08_Colecistite"],["B","Achados ultrassonográficos da colecistite?","Parede > 4 mm, líquido perivesicular, distensão, Murphy ultrassonográfico, cálculo impactado. USG é o exame inicial (sensibilidade > 90% para cálculos).","Caso08_Colecistite"],["B","Graus de gravidade da colecistite (TG18)?","I leve: sem disfunção, inflamação discreta → CVL precoce. II moderada: leucócitos > 18 mil, massa palpável, sintomas > 72 h ou inflamação local acentuada (gangrena, abscesso). III grave: disfunção orgânica (cardiovascular, neurológica, respiratória, renal, hepática, hematológica) → suporte/drenagem, cirurgia em centro experiente.","Caso08_Colecistite"],["B","Qual o tratamento padrão-ouro da colecistite aguda e o prazo?","Colecistectomia videolaparoscópica precoce: idealmente ≤ 72 h (aceitável até 7 dias do início dos sintomas; WSES até 10 dias). Antibiótico pós-op: ≤ 24 h em graus I/II com foco controlado.","Caso08_Colecistite ATUALIZADO"],["B","Exames essenciais na colecistite em jovem hígida?","USG + enzimas hepáticas (transaminases, GGT/FA, bilirrubinas) para confirmar o diagnóstico e estratificar risco de coledocolitíase.","Caso08_Colecistite"],["B","Estratificação de risco de coledocolitíase (ASGE 2019)?","ALTO: cálculo visto no colédoco (USG/imagem), colangite clínica ou BT > 4 mg/dL + colédoco dilatado → CPRE direta. INTERMEDIÁRIO: testes hepáticos alterados, idade > 55 ou colédoco dilatado → colangioRM, ecoendoscopia ou colangiografia intraoperatória. BAIXO: nenhum fator → colecistectomia direta. ⚠️ Versão 2019 substituiu critérios antigos (colédoco > 6 mm).","Caso08_Coledocolitiase ATUALIZADO"],["B","Paciente com cálculo na vesícula, FA e GGT elevadas persistentes, sem icterícia: exame?","Risco intermediário → colangiorressonância (ou ecoendoscopia/colangiografia intraoperatória).","Caso08_Coledocolitiase"],["B","CPRE: é exame diagnóstico?","Não, é terapêutica (papilotomia + extração). O diagnóstico é por colangioRM, ecoendoscopia ou colangiografia intraoperatória.","Caso08_Coledocolitiase"],["B","Icterícia há 3 meses com colestase, hoje assintomático: conduta?","Provável migração espontânea do cálculo: repetir hepatograma; se normal, colecistectomia isolada.","Caso08_Coledocolitiase"],["B","Coledocolitíase confirmada na colangioRM, paciente ictérica: conduta?","CPRE com papilotomia e extração, seguida de colecistectomia laparoscópica na mesma internação (alternativa: um tempo, com exploração laparoscópica do colédoco).","Caso08_Coledocolitiase"],["B","Tríade de Charcot e pêntade de Reynolds?","Charcot: dor em HCD + febre + icterícia (colangite). Reynolds: + hipotensão + alteração mental (colangite grave).","Caso08_Colangite"],["B","Colangite aguda grave (grau III, TG18): conduta?","UTI, antibiótico de amplo espectro e drenagem biliar de emergência (CPRE com extração do cálculo, se possível). Grau II: drenagem precoce (24–48 h). Grau I: antibiótico; drenar se sem resposta.","Caso08_Colangite"],["B","Diferencial: cólica, colecistite, colangite e pancreatite biliar?","Cólica: dor sem febre/alteração laboratorial. Colecistite: dor + febre + Murphy, sem icterícia. Colangite: dor + febre + icterícia + colédoco dilatado. Pancreatite biliar: dor em faixa + lipase > 3× o normal.","Caso08_Colangite"],["B","Classificação de Strasberg das lesões de via biliar?","A: fístula do cístico/ductos de Luschka. B: oclusão de ducto hepático direito aberrante. C: secção de ducto aberrante com fístula. D: lesão lateral da via principal. E1–E5: lesões circunferenciais (correspondem a Bismuth I–V).","Caso08_LesaoViaBiliar"],["B","Sinais de alerta de lesão de via biliar no pós-op precoce da colecistectomia?","Dor desproporcional persistente, icterícia, febre, drenagem biliar pelo dreno/ferida, íleo prolongado. Investigar cedo (colangioRM). Bismuth III: lesão no confluência com confluência preservada.","Caso08_LesaoViaBiliar"],["B","Jejum após ingestão de 300 mL de leite 2 h antes da anestesia: conduta?","Leite NÃO é líquido claro: aplica-se a regra de 6 h; aguardar completar 6 h e operar no mesmo dia.","Caso08_Perioperatorio"],["B","Regra do jejum (ASA/ACERTO) completa?","Líquidos claros 2 h; leite materno 4 h; fórmula infantil, leite não humano e refeição leve 6 h; refeição gordurosa/copiosa 8 h.","Caso08_Perioperatorio"],["B","Critérios diagnósticos da pancreatite aguda (Atlanta revisada)?","2 de 3: dor abdominal típica (epigástrica em faixa), lipase/amilase ≥ 3× o limite superior, achados característicos em imagem. TC precoce (< 72 h) subestima a necrose.","Caso09_PancreatiteAguda"],["B","Os níveis de amilase/lipase refletem a gravidade da pancreatite?","Não. Servem para diagnóstico, não para prognóstico (lipase é mais específica; a amilase normaliza antes).","Caso09_PancreatiteAguda"],["B","Sinais de Cullen e Grey-Turner na pancreatite: valor?","Raros (< 3%), tardios (24–48 h) e NÃO patognomônicos (também em AAA roto, ectópica rota, trauma retroperitoneal). Indicam hemorragia retroperitoneal.","Caso09_PancreatiteAguda"],["B","Classificação de gravidade da pancreatite aguda (Atlanta revisada 2012)?","Leve: sem falência orgânica nem complicação local. Moderadamente grave: falência orgânica transitória (< 48 h) e/ou complicação local. Grave: falência orgânica persistente (> 48 h). Falência definida por Marshall modificado (respiração, rim, cardiovascular).","Caso09_PancreatiteAguda ATUALIZADO"],["B","Nomenclatura das coleções na pancreatite (Atlanta revisada)?","< 4 semanas: coleção fluida peripancreática aguda (PA intersticial) e coleção necrótica aguda (PA necrosante). > 4 semanas: pseudocisto (só líquido) e necrose murada/WON (líquido + sólido).","Caso09_PancreatiteAguda"],["B","Tratamento inicial da pancreatite aguda biliar leve?","Fluidos com cristaloide balanceado (Ringer lactato) guiados por metas, analgesia (opioide permitido) e nutrição enteral/oral precoce conforme tolerância. Atualização: reposição moderada (WATERFALL, NEJM 2022) em vez de agressiva. Sem antibiótico profilático.","Caso09_PancreatiteAguda ATUALIZADO"],["B","Colecistectomia na pancreatite aguda biliar?","Leve: na MESMA internação (recorrência até 30% em semanas). Necrosante/coleções: adiar até resolução ou > 6 semanas. CPRE só se colangite ou obstrução biliar persistente.","Caso09_PancreatiteAguda"],["B","Por que ocorre hipocalcemia na pancreatite grave?","Saponificação: lipase digere a gordura peripancreática → ácidos graxos livres ligam-se ao cálcio (sabões) → cálcio sequestrado.","Caso09_PancreatiteAguda"],["B","Critérios de Ranson na admissão (não biliar)?","Idade > 55, leucócitos > 16.000, glicemia > 200, LDH > 350, AST > 250. Às 48 h: queda do Ht > 10%, aumento da ureia > 5, cálcio < 8, PaO₂ < 60, déficit de base > 4, sequestro > 6 L.","Caso09_PancreatiteAguda"],["B","Necrose pancreática infectada (> 4 semanas, gás na coleção): tratamento?","Abordagem step-up: drenagem endoscópica transmural guiada por ecoendoscopia (ou percutânea) → necrosectomia se necessário. Atualização: o estudo POINTER (2021) mostrou que adiar a drenagem até a necrose murar não é pior que drenar imediatamente.","Caso09_PancreatiteAguda ATUALIZADO"],["B","Pseudocisto: quando tratar e como?","Apenas se sintomático, infectado ou complicado (assintomático: observar). Maduro (> 4–6 semanas) e aposto ao estômago: drenagem endoscópica transgástrica.","Caso09_PancreatiteAguda"],["B","Pancreatite aguda de etiologia indefinida após avaliação inicial: exame?","CPRM (colangiorressonância); se normal e recorrente: ecoendoscopia (mais sensível para microlitíase). Avaliação inicial: álcool, USG, triglicerídeos, cálcio, medicamentos.","Caso09_PancreatiteAguda"],["B","Pancreatite crônica: principal sintoma e tratamento escalonado?","Dor. Analgesia + abstinência → endoscopia (esfincterotomia, extração de cálculos, litotripsia, prótese ductal) → cirurgia (descompressiva, híbrida ou ressectiva).","Caso09_PancreatiteCronica"],["B","Escolha da cirurgia na pancreatite crônica?","Ducto dilatado (≥ 7 mm) SEM massa cefálica: Puestow (drenagem pura). Ducto dilatado + massa inflamatória cefálica: Frey (escavação + drenagem) ou Beger (ressecção cefálica poupando duodeno). Doença de corpo/cauda: pancreatectomia distal. Whipple se suspeita de neoplasia.","Caso09_PancreatiteCronica"],["B","Indicação cirúrgica na pancreatite crônica?","Dor refratária e incapacitante após falha de tratamento clínico e endoscópico, com alteração anatômica corrigível. Outras: obstrução biliar/duodenal, pseudoaneurisma, trombose esplênica com varizes gástricas, impossibilidade de excluir câncer.","Caso09_PancreatiteCronica"],["B","Octreotide na HDA: quando
