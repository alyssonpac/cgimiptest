óstico clínico é considerado suficiente para indicar a apendicectomia sem exame de imagem adicional — o valor preditivo positivo é elevado e o atraso aumenta o risco de perfuração.","w":{"A":"Alvarado 2 é baixa probabilidade. A conduta é investigar outras causas e considerar alta com orientação, não internar para propedêutica de imagem.","B":"Dois erros: Alvarado 2 é risco baixo, e em mulheres o diagnóstico diferencial ginecológico (cisto ovariano roto, doença inflamatória pélvica, gravidez ectópica) é amplo, exigindo imagem antes de qualquer indicação cirúrgica. Operar com escore 2 seria indefensável.","D":"Alvarado 5 é faixa intermediária, que exige exame de imagem (TC em homens e idosos; ultrassonografia como primeira linha em mulheres jovens, crianças e gestantes), não alta."},"p":["Alvarado (MANTRELS, total 10): Migração da dor 1, Anorexia 1, Náusea/vômito 1, Tensão em FID 2, Rebote 1, Elevação de temperatura 1, Leucocitose 2, Shift (desvio à esquerda) 1. Faixas: 0–3 baixa probabilidade; 4–6 intermediária (imagem); ≥ 7 alta probabilidade."],"f":"Alvarado A — A practical score for the early diagnosis of acute appendicitis; WSES Jerusalem Guidelines for diagnosis and treatment of acute appendicitis; Sabiston, 21ª ed., cap. 52 (Apêndice)."},{"v":"Vol. II","c":10,"n":4,"g":"A","s":["Paciente de 40 anos, com relato de 2 episódios de vômitos com sangue após o almoço. Ao exame: FC 65 bpm, PA 120×70, corado, eupneico, afebril, hidratado. Exames: Hb 12 g/dL, ureia 30, INR 1,0. Marque a melhor alternativa."],"a":{"A":"A uremia, o uso de drogas, a idade e o INR devem ser considerados para definir urgência","B":"A necessidade da urgência deve estar baseada em parâmetros laboratoriais","C":"HDA em 50% dos casos se dá por varizes de esôfago e requer EDA em 2 h","D":"Forrest 1A na EDA requer transfusão e internamento por 48 h"},"ok":"A estratificação de risco na HDA é multifatorial, combinando dados clínicos e laboratoriais: ureia, hemoglobina, pressão arterial, frequência cardíaca, idade, comorbidades e uso de medicamentos (AINEs, antiagregantes, anticoagulantes). É exatamente o que compõem os escores de Glasgow- Blatchford e Rockall. Este paciente, com sinais vitais normais, Hb 12 e ureia 30, é de baixo risco.","w":{"B":"Reduz a decisão a laboratório, ignorando o exame clínico e os sinais vitais, que são o componente mais importante da avaliação inicial.","C":"Erra a epidemiologia. A causa mais comum de HDA é a doença ulcerosa péptica (cerca de 40–50%); as varizes esofágicas respondem por aproximadamente 10–15%. A recomendação de endoscopia em 12 horas se aplica à suspeita de sangramento varicoso, não a metade dos casos.","D":"Forrest IA é sangramento arterial em jato — a lesão de mais alto risco, com ressangramento superior a 50% se não tratada. A conduta é hemostasia endoscópica imediata (terapia dupla) seguida de IBP em infusão contínua. Reduzir a conduta a \"transfusão e 48 h de internação\" omite exatamente o que importa. Além disso, transfusão não é automática: a estratégia restritiva (limiar de Hb 7 g/dL) é a recomendada."},"p":["Classificação de Forrest: IA jato arterial, IB babação; IIA vaso visível, IIB coágulo aderido, IIC hematina; III base limpa. Alto risco = IA, IB e IIA (terapia endoscópica obrigatória)."],"f":"ACG Guideline — Upper GI and Ulcer Bleeding; Villanueva C et al., N Engl J Med — Transfusion strategies for acute upper gastrointestinal bleeding; Sabiston, 21ª ed., cap. 49."},{"v":"Vol. II","c":10,"n":5,"g":"C","s":["Sobre o diagnóstico e tratamento do abdome agudo infeccioso, responda a melhor alternativa:"],"a":{"A":"As fibras tipo A são consideradas fibras lentas e responsáveis por dor localizada","B":"A diverticulite aguda com abscesso localizado requer intervenção de urgência e colostomia à Hartmann","C":"O tratamento conservador da apendicite aguda é possível, porém pouco realizado pela alta frequência de recidivas","D":"A úlcera péptica perfurada frequentemente acontece na parede posterior do duodeno"},"ok":"O tratamento não operatório da apendicite não complicada com antibióticos é possível e foi validado por ensaios randomizados (APPAC, CODA). Contudo, a recorrência é significativa — cerca de 27% em 1 ano e até 39% em 5 anos no APPAC —, o que mantém a apendicectomia como padrão na maioria dos serviços. A alternativa descreve corretamente essa realidade.","w":{"A":"Inverte a fisiologia. As fibras A-delta são mielinizadas e rápidas, conduzindo a dor somática bem localizada (a dor que migra para a fossa ilíaca direita, por irritação do peritônio parietal). As fibras C são amielínicas e lentas, responsáveis pela dor visceral difusa e mal localizada (a dor periumbilical inicial).","B":"Diverticulite com abscesso localizado (Hinchey Ib/II) é tratada com antibiótico e, se maior que 4–5 cm, drenagem percutânea. A cirurgia de Hartmann é reservada à peritonite purulenta ou fecal difusa (Hinchey III e IV) ou à falha do tratamento conservador.","D":"Inverte a topografia. A úlcera duodenal da parede anterior perfura; a da parede posterior sangra, por erodir a artéria gastroduodenal."},"p":["Sequência da dor na apendicite: visceral difusa periumbilical (fibras C, distensão do apêndice) → somática localizada em FID (fibras A-delta, irritação do peritônio parietal). Essa migração é o sinal semiológico mais valioso."],"f":"Salminen P et al., JAMA — APPAC trial; CODA Collaborative, N Engl J Med — antibiotics versus appendectomy; Sabiston, 21ª ed., cap. 52 e cap. 51."},{"v":"Vol. II","c":10,"n":6,"g":"A","s":["Mulher de 73 anos procura atendimento com dor abdominal intensa de início súbito","e contínuo. Cerca de 3 horas após o início, apresentou um episódio emético e uma evacuação diarreica intensa. Não elimina gases desde o início do quadro. Antecedentes: histerectomia abdominal há 14 anos e fibrilação atrial. Ao exame, abdome levemente distendido, doloroso difusamente, sem sinais de irritação peritoneal. Ruídos hidroaéreos ausentes. O provável diagnóstico é:"],"a":{"A":"Isquemia mesentérica aguda","B":"Ruptura de cisto de ovário","C":"Úlcera péptica perfurada","D":"Diverticulite aguda"},"ok":"Três elementos apontam para o diagnóstico. Fibrilação atrial é o fator de risco cardinal para embolia da artéria mesentérica superior. A dor desproporcional ao exame físico — intensa, mas com abdome pouco alterado e sem peritonite — é o achado semiológico clássico. E o esvaziamento intestinal reflexo (a evacuação diarreica intensa no início, por vezes com sangue) completa o quadro. A ausência de irritação peritoneal indica que a isquemia ainda é transmural incompleta, ou seja, é a janela terapêutica.","w":{"B":"Ruptura de cisto ovariano em mulher de 73 anos, histerectomizada, é implausível — e cursaria com dor pélvica, não difusa com íleo.","C":"A úlcera perfurada produziria abdome em tábua com peritonite franca, exatamente o oposto do descrito.","D":"A diverticulite tem instalação mais insidiosa (dias), dor localizada em fossa ilíaca esquerda, febre e sinais localizados de irritação peritoneal."},"p":["A angiotomografia de abdome com fases arterial e venosa é o exame de escolha e deve ser solicitada com urgência — o lactato só se eleva tardiamente, quando a necrose já está estabelecida, e um lactato normal não exclui o diagnóstico.","As quatro etiologias da isquemia mesentérica aguda: embolia da AMS (~50%, cardioembólica), trombose arterial sobre placa aterosclerótica (~25%), isquemia não oclusiva (baixo débito, vasopressores) e trombose venosa mesentérica (trombofilia, hipertensão portal)."],"f":"Sabiston, 21ª ed., cap. 50 (Intestino delgado) e cap. 62 (Doença arterial mesentérica); WSES Guidelines on acute mesenteric ischemia."},{"v":"Vol. II","c":10,"n":7,"g":"A","s":["Homem de 67 anos, com colectomia há 8 anos, refere dor abdominal difusa há 36 horas, inicialmente intermitente e agora contínua, associada a distensão, náuseas e vômitos fecaloides. Exame: abdome distendido, timpânico, ruídos presentes, dor à palpação sem defesa localizada. Laboratório: leucócitos 12.300; lactato 1,8. TC: distensão de delgado até 4,5 cm, com zona de transição única compatível com brida, sem pneumoperitônio ou sinais de sofrimento de alça. Internado, recebe hidratação e sonda nasogástrica. Após 12 h, refere melhora da dor, débito por sonda com aspecto de estase gástrica e estabilidade clínica. Qual a conduta mais apropriada neste momento?"],"a":{"A":"Manter tratamento conservador com descompressão por sonda, hidratação e reavaliação clínica e laboratorial nas próximas 24–48 h","B":"Indicar laparotomia imediata, pois há risco de perfuração mesmo sem sinais de isquemia","C":"Solicitar colonoscopia para tentar liberar a obstrução","D":"Iniciar antibioticoterapia endovenosa de amplo espectro e jejum prolongado por 5 dias"},"ok":"Obstrução de delgado por brida, sem sinais de estrangulamento (lactato normal, sem defesa, sem pneumatose, sem espessamento parietal ou líquido livre na TC) e com melhora clínica após 12 h de descompressão, é indicação clara de tratamento conservador. Cerca de 70 a 80% dessas obstruções resolvem sem cirurgia. A janela habitual é de 24 a 48 horas de observação ativa.","w":{"B":"Não há qualquer sinal de sofrimento de alça, e o paciente está melhorando. Operar aqui expõe a nova formação de aderências, que é justamente a causa da doença.","C":"Colonoscopia não tem papel em obstrução de delgado. Ela é usada em obstrução colônica — para descompressão em volvo de sigmoide ou colocação de prótese em obstrução neoplásica.","D":"Não há infecção a tratar, e \"jejum prolongado por 5 dias\" é conduta arbitrária e prejudicial. O antibiótico não desobstrui."},"p":["Sinais de estrangulamento que obrigam a operar: dor contínua e intensa, febre, taquicardia, defesa/peritonite, leucocitose com desvio, lactato elevado, acidose, e na TC — espessamento parietal, pneumatose, redução do realce parietal, líquido livre, sinal do \"redemoinho\". O contraste hidrossolúvel oral (gastrografina) tem valor duplo: se atinge o cólon em 24 h, prediz resolução conservadora; e tem efeito terapêutico discreto por osmose."],"f":"Sabiston, 21ª ed., cap. 50; EAST/ASCRS Guidelines — management of small bowel obstruction; Bologna Guidelines (WSES) for adhesive small bowel obstruction."},{"v":"Vol. II","c":10,"n":8,"g":"B","s":["Homem de 23 anos, previamente hígido, com dor abdominal há 18 horas. Início periumbilical com migração para fossa ilíaca direita, náuseas e febre de 38,3 °C. Exame: fácies de dor, abdome plano, doloroso em FID, com defesa voluntária e Blumberg positivo. Laboratório: leucócitos 14.500 (neutrófilos 82%), PCR 45 mg/L. Ultrassonografia: apêndice não compressível, 9 mm de diâmetro, sem líquido","periapendicular. Qual deve ser a conduta mais apropriada?"],"a":{"A":"Iniciar antibiótico de amplo espectro e observação clínica, pois pode se tratar de apendicite inicial","B":"Solicitar tomografia de abdome para confirmar o diagnóstico e excluir complicações","C":"Optar por tratamento clínico com antibiótico por 7 dias e alta se houver melhora","D":"Indicar apendicectomia videolaparoscópica, com antibiótico profilático pré-incisional"},"ok":"Aqui é preciso registrar uma inconsistência do material: este enunciado aparece duas vezes neste caso (Q8 e Q13), com gabaritos registrados diferentes — B aqui e D adiante. Do ponto de vista da literatura, o quadro é de apendicite aguda já confirmada clínica e ultrassonograficamente (Alvarado 8–9, apêndice não compressível de 9 mm): a conduta correta é a apendicectomia videolaparoscópica com antibiótico profilático pré- incisional — ou seja, a alternativa D. A tomografia acrescentaria pouco em um homem jovem com diagnóstico já estabelecido pelo ultrassom.","w":{"A":"O antibiótico com observação seria a estratégia não operatória do estudo CODA, mas exige apendicite não complicada, exclusão de apendicolito por TC e consentimento informado sobre o risco de recorrência. Não é a conduta padrão.","C":"Mesma objeção, agravada pela alta precoce — o tratamento não operatório exige monitorização.","D":"É, do ponto de vista de conteúdo, a resposta esperada. A antibioticoprofilaxia pré-incisional está correta e não deve ser prolongada no pós-operatório em apendicite não complicada."},"p":["Sinalização: divergência interna do material. Vale confirmar com o tutor qual gabarito prevalece. A ultrassonografia é primeira linha em jovens, crianças, mulheres e gestantes. A TC é preferida em homens adultos e idosos, ou quando o ultrassom é inconclusivo — e a ressonância, em gestantes com ultrassom não diagnóstico."],"f":"WSES Jerusalem Guidelines for acute appendicitis; CODA Collaborative, N Engl J Med; Sabiston, 21ª ed., cap. 52.","rv":"Há questões idênticas com gabaritos diferentes no banco; a literatura apoia apendicectomia videolaparoscópica sem TC se o diagnóstico já está firmado."},{"v":"Vol. II","c":10,"n":9,"g":"B","s":["LD, 69 anos, obesa, hipertensa e em uso crônico de corticoide por artrite reumatoide, com dor no quadrante inferior esquerdo há 5 dias, febre baixa e constipação. Ao exame: dor localizada, defesa voluntária e massa palpável no flanco esquerdo. Leucócitos 13.200; PCR 12 mg/dL. TC: diverticulite em sigmoide com abscesso pericólico de 5,5 cm, sem extravasamento de contraste. Qual é a conduta mais adequada?"],"a":{"A":"Antibioticoterapia EV exclusiva, com acompanhamento clínico, pois abscessos de até 6 cm podem ser tratados assim","B":"Drenagem percutânea guiada por imagem associada a antibioticoterapia, pelo tamanho do abscesso","C":"Sigmoidectomia laparoscópica eletiva imediata, devido ao risco elevado de recidiva em imunossuprimidos","D":"Laparotomia com ressecção à Hartmann, pela alta mortalidade em imunossuprimidos e pelo tamanho do abscesso"},"ok":"Diverticulite complicada com abscesso corresponde a Hinchey Ib/II. A regra prática consolidada é: abscessos menores que 4 cm respondem a antibioticoterapia isolada; abscessos maiores que 4 a 5 cm devem ser drenados por via percutânea guiada por imagem, associada ao antibiótico. Com 5,5 cm, a paciente se enquadra na segunda faixa. A drenagem permite controlar o foco sem cirurgia de urgência, possibilitando uma eventual ressecção eletiva em um tempo, com anastomose primária e sem estoma.","w":{"A":"O limite de 6 cm citado não corresponde às diretrizes; o ponto de corte aceito está entre 4 e 5 cm. Manter apenas antibiótico em abscesso de 5,5 cm tem alta taxa de falha.","C":"\"Eletiva imediata\" é contraditório. E operar na vigência do processo inflamatório agudo aumenta a chance de estoma e de complicações. A sigmoidectomia eletiva deve ser discutida depois, após a resolução do quadro — e, em imunossuprimidos, essa discussão é de fato mais favorável à cirurgia.","D":"Hartmann é para peritonite difusa (Hinchey III/IV) ou falha do tratamento conservador. Impor uma colostomia terminal a uma paciente com abscesso drenável é conduta excessiva."},"p":["Classificação de Hinchey: I abscesso pericólico ou mesentérico (Ia flegmão, Ib abscesso confinado); II abscesso pélvico, retroperitoneal ou à distância; III peritonite purulenta generalizada; IV peritonite fecal."],"f":"Sabiston, 21ª ed., cap. 51; ASCRS Clinical Practice Guidelines for the Treatment of Left-Sided Colonic Diverticulitis; WSES Guidelines for acute left-sided colonic diverticulitis."},{"v":"Vol. II","c":10,"n":10,"g":"B","s":["Homem de 58 anos com dor abdominal difusa intensa, distensão e ausência de eliminação de gases e fezes há 48 horas. Radiografia mostra alças dilatadas com níveis hidroaéreos. A tomografia evidencia transição abrupta entre alças com","espessamento parietal e pneumatose intestinal. Lactato de 5,0 mmol/L. Esses achados sugerem:"],"a":{"A":"Abdome agudo vascular por provável isquemia mesentérica","B":"Obstrução intestinal por brida com sofrimento isquêmico","C":"Abdome agudo inflamatório por diverticulite perfurada","D":"Obstrução colônica por neoplasia avançada"},"ok":"O achado que define o diagnóstico é a zona de transição abrupta, que caracteriza obstrução mecânica de delgado — tipicamente por brida. Sobre esse quadro obstrutivo somam-se os marcadores de estrangulamento: espessamento parietal, pneumatose intestinal (gás na parede da alça, sinal de necrose transmural) e lactato de 5,0 mmol/L. É a obstrução que evoluiu para sofrimento de alça — indicação de laparotomia imediata.","w":{"A":"A isquemia mesentérica primária (embólica ou trombótica) não produz zona de transição abrupta: a alteração é segmentar e difusa no território vascular acometido, com falha de enchimento no vaso. O contraste desta questão com a questão 6 é justamente esse.","C":"A diverticulite perfurada produziria pneumoperitônio, líquido livre e inflamação pericólica localizada no sigmoide, não obstrução de delgado com transição abrupta.","D":"A obstrução colônica neoplásica cursaria com dilatação do cólon até um ponto de transição no próprio cólon, com massa parietal — quadro distinto do descrito."},"p":["Pneumatose intestinal + gás no sistema porta = necrose intestinal até prova em contrário. Levar à sala imediatamente."],"f":"Sabiston, 21ª ed., cap. 50; WSES Bologna Guidelines for adhesive small bowel obstruction."},{"v":"Vol. II","c":10,"n":11,"g":"C","s":["Paciente de 54 anos, previamente saudável, admitido com dor abdominal intensa e desproporcional ao exame físico, febre alta e hipotensão. Exame físico revela eritema difuso e crepitação palpável na parede abdominal, sem sinais de peritonite difusa. TC de abdome mostra gás em planos musculares e líquido livre moderado. Qual deve ser a conduta imediata mais adequada?"],"a":{"A":"Solicitar ressonância magnética para confirmar o diagnóstico antes da cirurgia","B":"Iniciar antibioticoterapia de amplo espectro e aguardar estabilização hemodinâmica antes de operar","C":"Antibioticoterapia de amplo espectro e exploração cirúrgica imediata com desbridamento extenso","D":"Realizar laparotomia programada após 24 horas de suporte intensivo"},"ok":"O quadro é de fasciíte necrotizante da parede abdominal: dor desproporcional ao exame, eritema, crepitação, sepse e gás em planos musculares na tomografia. O tratamento é uma emergência cirúrgica absoluta — antibiótico de amplo espectro somado a desbridamento cirúrgico imediato e extenso, com reabordagens programadas até que todo o tecido inviável tenha sido removido. Cada hora de atraso aumenta a mortalidade de forma mensurável.","w":{"A":"A ressonância é demorada e desnecessária: a TC já demonstrou gás nos planos profundos, e o diagnóstico é essencialmente clínico. Esperar imagem adicional custa vidas.","B":"\"Aguardar estabilização\" é o erro conceitual mais grave. O paciente não estabiliza enquanto o foco necrótico permanecer — a fonte da instabilidade é o tecido infectado, e a ressuscitação ocorre em paralelo à cirurgia, não antes dela.","D":"Laparotomia programada para 24 horas em fasciíte necrotizante é sentença. A doença progride centímetros por hora."},"p":["Interseção: fasciíte necrotizante já apareceu no Caso 3 (agentes) e no Caso 5 (Fournier). É um dos conteúdos mais reaproveitados do banco. O escore LRINEC (PCR, leucócitos, hemoglobina, sódio, creatinina, glicose) auxilia na suspeita, mas não deve retardar a exploração cirúrgica quando a clínica é sugestiva."],"f":"Sabiston, 21ª ed., cap. 12; IDSA Guidelines for Skin and Soft Tissue Infections; WSES/SIS-E Consensus on necrotizing soft tissue infections."},{"v":"Vol. II","c":10,"n":12,"g":"C","s":["Em relação às estratégias de laparotomia em pacientes críticos, qual das alternativas diferencia corretamente a laparotomia programada da laparotomia por demanda?"],"a":{"A":"A laparotomia programada é realizada apenas quando surgem novos sinais clínicos, enquanto a por demanda segue um cronograma fixo","B":"A laparotomia por demanda envolve reoperações seriadas com intervalos predefinidos, independentemente da evolução clínica","C":"A laparotomia programada prevê reintervenções em intervalos regulares, enquanto a por demanda é realizada conforme a necessidade clínica do paciente","D":"Ambas as abordagens exigem reoperações diárias, independentemente da condição do paciente"},"ok":"Definição direta: programada (planned relaparotomy) significa reoperar em intervalos fixos, tipicamente a cada 24 a 48 horas, independentemente da evolução; por demanda (on-demand) significa reoperar apenas quando há deterioração clínica ou evidência de foco não controlado. O ensaio randomizado de van Ruler mostrou mortalidade semelhante, mas com menos reoperações, menor tempo de UTI e menor custo na estratégia sob demanda — que se tornou a preferida.","w":{"A":"Inverte exatamente as duas definições.","B":"Também inverte: intervalos predefinidos caracterizam a estratégia programada.","D":"Nenhuma das duas exige reoperação diária obrigatória, e a frase apaga a distinção entre elas, que é o objeto da pergunta."},"p":["Interseção: o mesmo conteúdo aparece no Caso 3, questão 6."],"f":"van Ruler O et al., JAMA 2007; WSES Guidelines for management of intra- abdominal infections; Sabiston, 21ª ed., cap. 45."},{"v":"Vol. II","c":10,"n":13,"g":"D","s":["(Enunciado repetido da questão 8) Homem de 23 anos, previamente hígido, com dor abdominal há 18 horas, migrando da região periumbilical para a fossa ilíaca direita, com náuseas e febre de 38,3 °C. Abdome doloroso em FID, com defesa voluntária e Blumberg positivo. Leucócitos 14.500 (neutrófilos 82%), PCR 45 mg/L. Ultrassonografia: apêndice não compressível, 9 mm, sem líquido periapendicular. Qual deve ser a conduta mais apropriada?"],"a":{"A":"Iniciar antibiótico de amplo espectro e observação clínica","B":"Solicitar tomografia de abdome para confirmar o diagnóstico e excluir complicações","C":"Optar por tratamento clínico com antibiótico por 7 dias e alta se houver melhora","D":"Indicar apendicectomia videolaparoscópica, com antibiótico profilático pré-incisional"},"ok":"Aqui o gabarito registrado é D, coerente com a literatura: o diagnóstico de apendicite aguda está estabelecido pela clínica (migração da dor, Blumberg, febre), pelo laboratório (leucocitose com neutrofilia, PCR elevada) e pela imagem (apêndice não compressível de 9 mm). O tratamento padrão é a apendicectomia videolaparoscópica, com antibiótico profilático em dose única pré-incisional — que não deve ser prolongado no pós-operatório quando a apendicite é não complicada.","w":{"A":"O tratamento não operatório existe, mas exige critérios rígidos e discussão com o paciente sobre recorrência. Não é conduta padrão diante de diagnóstico confirmado.","B":"Foi o gabarito registrado na questão 8 e representa a inconsistência do material. Com ultrassonografia já diagnóstica em um homem jovem, a tomografia é dispensável e apenas atrasa a cirurgia.","C":"Antibiótico por 7 dias com alta se melhorar não corresponde ao protocolo do tratamento não operatório, que envolve internação inicial e seguimento estruturado."},"p":["Antibiótico na apendicite: não complicada — profilaxia pré- incisional, sem manutenção. Complicada (perfurada, abscesso, peritonite) — terapia por 3 a 5 dias após controle do foco."],"f":"WSES Jerusalem Guidelines; Sabiston, 21ª ed., cap. 52.","rv":"Há questões idênticas com gabaritos diferentes no banco; a literatura apoia apendicectomia videolaparoscópica sem TC se o diagnóstico já está firmado."},{"v":"Vol. II","c":11,"n":1,"g":"B","s":["O método de maior acurácia para avaliação da doença maligna esofágica locorregional é:"],"a":{"A":"Tomografia computadorizada","B":"Ultrassonografia endoscópica","C":"Ressonância magnética","D":"Toracoscopia e estadiamento minimamente invasivo"},"ok":"A ecoendoscopia (USG endoscópica) é o método mais acurado para determinar a profundidade de invasão parietal (T) e o acometimento linfonodal regional (N), porque visualiza individualmente as cinco camadas da parede esofágica e permite punção aspirativa de linfonodos suspeitos. Sua acurácia para o T chega a 85–90%.","w":{"A":"A tomografia é essencial para o M — pesquisa de metástases hepáticas, pulmonares e à distância — e para avaliar invasão de estruturas adjacentes, mas não distingue as camadas da parede, sendo imprecisa para o T.","C":"A ressonância tem papel limitado no esôfago, sendo mais útil no reto e no fígado.","D":"A toracoscopia/laparoscopia de estadiamento tem papel selecionado (sobretudo na junção esofagogástrica, para detectar carcinomatose peritoneal), mas é invasiva e não é o método de escolha para o estadiamento locorregional."},"p":["Sequência de estadiamento: EDA com biópsia → TC de tórax e abdome (M) → ecoendoscopia (T e N) → PET-CT quando a TC não mostra metástase, para detectar doença oculta → broncoscopia se o tumor for de terço médio ou superior, para excluir invasão traqueobrônquica. Esta mesma pergunta reaparece na questão 13 deste caso, com redação praticamente idêntica."],"f":"Sabiston, 21ª ed., cap. 42 (Esôfago); NCCN Guidelines — Esophageal and Esophagogastric Junction Cancers."},{"v":"Vol. II","c":11,"n":2,"g":"C","s":["O megaesôfago é patologia de etiologia idiopática ou chagásica, principalmente no Brasil. Podemos afirmar que:"],"a":{"A":"O esofagograma baritado é utilizado no diagnóstico, sendo característico o sinal da maçã mordida","B":"A endoscopia é o padrão-ouro para diagnóstico, podendo ser observada a aperistalse do corpo esofágico","C":"A cirurgia de Aquino pode ser realizada para os megaesôfagos graus III e IV, sendo realizada a ressecção da mucosa e submucosa através de sua invaginação, sem toracotomia associada","D":"A cardiomiotomia a Heller é o procedimento cirúrgico de escolha para o megaesôfago grau II, porém tem baixa taxa de controle de sintomas"},"ok":"A operação de Aquino (mucosectomia esofágica por invaginação) é uma alternativa nacional às esofagectomias para o megaesôfago avançado (graus III e IV): remove-se a mucosa e a submucosa doentes preservando a túnica muscular, com anastomose cervical, sem necessidade de toracotomia. Isso reduz a morbidade respiratória em comparação à esofagectomia transtorácica.","w":{"A":"Erra o sinal. O esofagograma no megaesôfago mostra o afilamento distal em \"bico de pássaro\" (ou \"chama de vela\"). O sinal da \"maçã mordida\" é radiológico de neoplasia estenosante.","B":"Erra em dois pontos. O padrão-ouro diagnóstico é a manometria esofágica, que demonstra aperistalse do corpo e relaxamento incompleto do esfíncter inferior. A endoscopia é obrigatória, mas para excluir neoplasia (pseudoacalasia), e não como padrão-ouro. Além disso, aperistalse é achado manométrico, não endoscópico.","D":"A primeira parte está correta — a cardiomiotomia de Heller com fundoplicatura parcial é o procedimento de escolha nos graus I e II —, mas a segunda a invalida: o controle sintomático é excelente, com sucesso superior a 85–90%."},"p":["Classificação de Rezende (megaesôfago chagásico): I calibre normal, com retardo de esvaziamento; II até 7 cm, com retenção; III 7–10 cm, hipotônico; IV > 10 cm, dolicomegaesôfago. Graus I–II → miotomia de Heller ou POEM. Graus III–IV → mucosectomia (Aquino) ou esofagectomia."],"f":"Sabiston, 21ª ed., cap. 42; Pinotti HW e escola brasileira de cirurgia do esôfago; consensos brasileiros sobre megaesôfago chagásico."},{"v":"Vol. II","c":11,"n":3,"g":"B","s":["O carcinoma escamoso de esôfago apresenta morbimortalidade elevada por sua característica anatômica tubular, pela ausência de adventícia e pela conformação de sua drenagem linfática. Qual das opções abaixo não invalida uma ressecção cirúrgica?"],"a":{"A":"Presença de fístula traqueobrônquica","B":"Invasão da pleura por continuidade","C":"Ângulo de Picus maior que 120 graus com a aorta","D":"Linfonodos megálicos em tronco celíaco"},"ok":"Enunciado negativo — busca-se o que não contraindica. A invasão da pleura por contiguidade é ressecável em bloco: a pleura pode ser removida junto com a peça cirúrgica sem comprometer estruturas vitais. É considerada T4a (ressecável), diferentemente das estruturas T4b.","w":{"A":"A fístula traqueobrônquica indica invasão da árvore respiratória (T4b), contraindicando a ressecção com intenção curativa.","C":"O ângulo de Picus mede o contato circunferencial entre o tumor e a aorta na tomografia. Contato superior a 90 graus já sugere invasão aórtica; acima de 120 graus, a irressecabilidade é praticamente certa.","D":"Linfonodo de tronco celíaco em tumor de terço médio ou superior representa disseminação linfática à distância (M1 ou N à distância), o que contraindica a ressecção curativa. Vale a nuance: em adenocarcinoma de esôfago distal ou de junção, o linfonodo celíaco é considerado regional."},"p":["Critérios de irressecabilidade (T4b): invasão de aorta, traqueia, brônquios, coração, grandes vasos ou corpo vertebral; fístula traqueoesofágica; metástases à distância."],"f":"Sabiston, 21ª ed., cap. 42; NCCN Guidelines — Esophageal Cancer; AJCC 8ª edição."},{"v":"Vol. II","c":11,"n":4,"g":"C","s":["Paciente de 71 anos procura o serviço de cirurgia com queixa de disfagia, halitose e regurgitação de alimentos mal digeridos. Realizou o exame apresentado. Qual a conduta mais adequada?"],"a":{"A":"Trata-se de tumor de esôfago precoce e o tratamento seria esofagectomia trans-hiatal","B":"Trata-se de divertículo de Meckel e o tratamento seria diverticulotomia endoscópica","C":"Trata-se de divertículo de Zenker e o tratamento é a diverticulotomia endoscópica","D":"Trata-se de megaesôfago e o tratamento seria cirurgia de Aquino"},"ok":"A tríade disfagia + halitose + regurgitação de alimentos não digeridos em idoso é a apresentação clássica do divertículo de Zenker, um divertículo de pulsão (falso, contendo apenas mucosa e submucosa) que se forma no triângulo de Killian, área de fraqueza entre o constritor inferior da faringe e o músculo cricofaríngeo. O tratamento moderno é a diverticulotomia endoscópica com secção do septo cricofaríngeo (grampeador ou laser), reservando a via cervical aberta com miotomia e diverticulopexia ou diverticulectomia para divertículos muito grandes ou falha endoscópica.","w":{"A":"Tumor precoce de esôfago não causaria regurgitação de alimentos não digeridos nem halitose característica, e a esofagectomia trans-hiatal é desproporcional a uma lesão precoce (que se trata por ressecção endoscópica).","B":"O divertículo de Meckel é do íleo, remanescente do ducto onfalomesentérico — nada tem a ver com o esôfago. Distrator de nomenclatura.","D":"O megaesôfago cursa com disfagia progressiva para sólidos e líquidos, com regurgitação, mas o esofagograma mostraria dilatação difusa com afilamento distal em bico de pássaro, não a formação sacular cervical."},"p":["Regra: regurgitação de alimento não digerido, sem ácido, aponta para obstáculo acima do estômago — Zenker ou acalasia. Regurgitação com sabor ácido ou amargo aponta para refluxo."],"f":"Sabiston, 21ª ed., cap. 42; SAGES Guidelines — management of Zenker's diverticulum."},{"v":"Vol. II","c":11,"n":5,"g":"B","s":["Paciente de 70 anos com disfagia progressiva nos últimos 3 meses, associada a perda de 9 kg. Tabagista e etilista desde os 14 anos. Natural e procedente da zona rural do agreste. Marque a melhor resposta."],"a":{"A":"Por ser área epidemiológica para Chagas, iniciar investigação com esofagograma","B":"Iniciar investigação com EDA para definir etiologia e passagem de SNE para nutrição até definir a terapêutica","C":"No ocidente, a neoplasia do esôfago distal mais comum é o carcinoma epidermoide","D":"Esofagectomia trans-hiatal é o acesso adequado para os tumores de esôfago médio"},"ok":"Disfagia progressiva com perda ponderal expressiva em tabagista e etilista de longa data é câncer de esôfago até prova em contrário. O exame inicial obrigatório é a endoscopia digestiva alta com biópsia, que fornece diagnóstico histológico. Paralelamente, o suporte nutricional precoce é fundamental: esses pacientes chegam desnutridos e a terapia oncológica exige reserva.","w":{"A":"O esofagograma seria razoável na suspeita de megaesôfago, mas a apresentação aqui (progressiva, com perda de 9 kg, em tabagista e etilista pesado) aponta fortemente para neoplasia. Investigar Chagas primeiro atrasaria o diagnóstico.","C":"Inverte a epidemiologia. No ocidente, o adenocarcinoma é o tipo mais comum do esôfago distal, associado a DRGE, esôfago de Barrett e obesidade. O epidermoide predomina nos terços médio e superior e associa-se a tabagismo e etilismo.","D":"Erra o acesso. Para tumores de terço médio, o acesso adequado é o transtorácico (Ivor Lewis ou McKeown), que permite linfadenectomia mediastinal adequada e dissecção sob visão direta. A esofagectomia trans-hiatal é mais apropriada para tumores distais e da junção."},"p":["Sobre nutrição no câncer de esôfago: prefira sonda nasoenteral ou jejunostomia. A gastrostomia deve ser evitada quando o estômago será usado como conduto na reconstrução."],"f":"Sabiston, 21ª ed., cap. 42; NCCN Guidelines — Esophageal and EGJ Cancers."},{"v":"Vol. II","c":11,"n":6,"g":"D","s":["Os principais sintomas da neoplasia maligna do esôfago são a perda de peso e a disfagia progressiva. Sobre essas neoplasias, é correto afirmar que:"],"a":{"A":"O PET-CT é útil no rastreamento de micrometástases não vistas na TC de abdome, devendo ser solicitado mesmo que o paciente apresente metástases à TC","B":"A broncoscopia deve ser solicitada para pacientes com neoplasia de esôfago torácico e abdominal, com o objetivo de investigar fístula traqueoesofágica","C":"O protocolo CROSS comparou pacientes submetidos à cirurgia ou à QT/RT pós-operatória, observando melhores resultados nos pacientes submetidos ao tratamento adjuvante","D":"O USG endoscópico é exame utilizado na avaliação pré-operatória para estadiar o T e o N, uma vez que, a depender do resultado, o paciente pode ser submetido diretamente à cirurgia ou a tratamento neoadjuvante"},"ok":"A ecoendoscopia é o exame que define a conduta terapêutica: um T1 N0 pode ir diretamente à ressecção (endoscópica no T1a, cirúrgica no T1b), enquanto T2 ou superior, ou qualquer N positivo, indica quimiorradioterapia neoadjuvante antes da cirurgia. É essa capacidade de mudar conduta que justifica sua indicação rotineira.","w":{"A":"Contradição interna. Se a TC já demonstrou metástases, o paciente é M1 e não é candidato a cirurgia — o PET-CT nada acrescentaria. Ele é indicado justamente quando a TC é negativa, para detectar doença oculta.","B":"Erra a indicação por topografia. A broncoscopia é indicada em tumores de terço médio e superior, que têm relação anatômica com traqueia e brônquio principal esquerdo. Tumores abdominais (distais e de junção) não têm essa relação.","C":"Descreve o CROSS de forma invertida. O ensaio comparou quimiorradioterapia neoadjuvante seguida de cirurgia versus cirurgia isolada, demonstrando ganho de sobrevida no braço neoadjuvante — não adjuvante."},"p":["Resultado do CROSS: carboplatina + paclitaxel com radioterapia de 41,4 Gy, seguidos de esofagectomia, elevaram a sobrevida mediana de 24 para 49 meses, com resposta patológica completa em cerca de 29% (49% nos epidermoides)."],"f":"van Hagen P et al., N Engl J Med 2012 — Preoperative chemoradiotherapy for esophageal or junctional cancer (ensaio CROSS); NCCN Guidelines; Sabiston, 21ª ed., cap. 42."},{"v":"Vol. II","c":11,"n":7,"g":"A","s":["Sobre a cirurgia antirrefluxo:"],"a":{"A":"Alterações estruturais pulmonares relacionadas a broncoaspiração crônica são uma das indicações","B":"Hérnias de hiato tipo 1 têm que ser corrigidas na maioria dos casos","C":"A manometria esofágica é importante para o diagnóstico da DRGE","D":"A impedanciometria é obrigatória para o planejamento cirúrgico"},"ok":"As manifestações extraesofágicas com dano estrutural comprovado — pneumonia de repetição, bronquiectasias, fibrose pulmonar por microaspiração crônica — constituem indicação formal de cirurgia antirrefluxo, pois representam doença com repercussão orgânica que o tratamento clínico não controlou adequadamente.","w":{"B":"A hérnia hiatal tipo I (por deslizamento) é a mais comum e, na ausência de DRGE sintomática ou complicada, não requer correção. Operam-se as paraesofágicas (tipos II, III e IV) sintomáticas, pelo risco de volvo gástrico e encarceramento.","C":"A manometria não diagnostica DRGE. Seu papel é pré-operatório: avaliar a peristalse do corpo esofágico (para escolher entre fundoplicatura total ou parcial) e excluir acalasia, cuja fundoplicatura seria desastrosa. O diagnóstico de DRGE se faz pela pHmetria de 24 horas (padrão-ouro) ou pela endoscopia com esofagite erosiva.","D":"A impedanciometria é útil em casos selecionados — sobretudo refluxo não ácido e sintomas persistentes em uso de IBP —, mas não é obrigatória no planejamento cirúrgico de rotina."},"p":["Indicações de cirurgia antirrefluxo: falha ou intolerância ao tratamento clínico otimizado; preferência do paciente jovem que não deseja IBP por décadas; complicações (esofagite grave, estenose, Barrett); manifestações extraesofágicas com dano estrutural; hérnia hiatal volumosa sintomática."],"f":"Sabiston, 21ª ed., cap. 42; SAGES Guidelines for the surgical treatment of GERD."},{"v":"Vol. II","c":11,"n":8,"g":"B","s":["Homem de 41 anos, com disfagia progressiva para sólidos e líquidos há 8 meses, regurgitação noturna de alimentos não digeridos e perda ponderal de 6 kg. Nega pirose ou hematêmese. Esofagograma: esôfago dilatado com afilamento distal em \"bico de pássaro\". EDA: ausência de lesão obstrutiva ou neoplasia, mucosa normal, teste de lugol sem alterações. Qual o próximo passo diagnóstico e terapêutico mais adequado?"],"a":{"A":"Iniciar IBP e reavaliar sintomas em 30 dias","B":"Realizar manometria esofágica para confirmação diagnóstica e posterior indicação de tratamento definitivo (miotomia de Heller ou POEM)","C":"Solicitar TC de tórax para excluir neoplasia","D":"Indicar dilatação pneumática ou toxina botulínica"},"ok":"A disfagia para sólidos e líquidos desde o início é a marca do distúrbio motor (a disfagia mecânica começa por sólidos e progride). Somada ao \"bico de pássaro\" e a uma endoscopia normal, o diagnóstico presumido é acalasia. O próximo passo é a manometria esofágica — padrão-ouro —, que confirma a aperistalse e o relaxamento incompleto do esfíncter inferior, e ainda classifica o subtipo de Chicago, o que orienta o tratamento.","w":{"A":"IBP trataria refluxo, e o paciente nega pirose. Além disso, a acalasia pode até melhorar transitoriamente com IBP por outros motivos, mascarando o diagnóstico e atrasando o tratamento definitivo.","C":"A endoscopia com lugol já foi realizada e não mostrou neoplasia. Uma TC de tórax poderia ser cogitada na suspeita de pseudoacalasia (tumor infiltrativo da cárdia) em paciente idoso com evolução curta e grande perda ponderal — não é o caso de um homem de 41 anos com 8 meses de sintomas.","D":"A dilatação pneumática é opção terapêutica válida, e a toxina botulínica é reservada a pacientes sem condições cirúrgicas (efeito temporário, de 6 a 12 meses). Mas indicar tratamento antes de confirmar o diagnóstico pela manometria inverte a ordem."},"p":["Classificação de Chicago da acalasia: tipo I (clássica, sem pressurização), tipo II (com pressurização panesofágica — melhor resposta ao tratamento), tipo III (espástica — melhor resposta ao POEM, que permite miotomia mais longa)."],"f":"Sabiston, 21ª ed., cap. 42; Chicago Classification v4.0; ACG Clinical Guideline — Diagnosis and Management of Achalasia."},{"v":"Vol. II","c":11,"n":9,"g":"C","s":["Homem de 63 anos, tabagista e etilista, com disfagia progressiva há 2 meses. EDA: lesão vegetante a 33 cm da arcada dentária superior, biópsia com carcinoma epidermoide. TC de tórax e abdome: espessamento parietal sem invasão de estruturas adjacentes; linfonodo mediastinal menor que 1 cm; sem metástases. Ecoendoscopia: tumor T1N1. ECOG 1. Qual a conduta terapêutica mais adequada?"],"a":{"A":"Ressecção cirúrgica upfront com esofagectomia","B":"Apenas quimiorradioterapia definitiva, reservando cirurgia se persistirem sintomas","C":"Quimiorradioterapia neoadjuvante, aos moldes do CROSS, seguida de esofagectomia com linfadenectomia","D":"Ressecção endoscópica, pois se trata de tumor precoce"},"ok":"O detalhe decisivo é o N1. Ainda que o T seja apenas 1, a presença de linfonodo comprometido caracteriza doença localmente avançada e indica tratamento multimodal: quimiorradioterapia neoadjuvante no esquema CROSS seguida de esofagectomia com linfadenectomia. Com ECOG 1, o paciente tolera a estratégia completa.","w":{"A":"Cirurgia upfront estaria indicada apenas em T1-T2 N0. Com N1, a cirurgia isolada tem resultado oncológico inferior.","B":"A quimiorradioterapia definitiva é alternativa aceitável no carcinoma epidermoide, especialmente cervical ou em paciente sem condições cirúrgicas — mas a alternativa se autoinvalida ao propor cirurgia apenas \"se persistirem sintomas\", critério que não é oncológico. A cirurgia de resgate se indica por doença residual ou recidiva, não por sintoma.","D":"A ressecção endoscópica se restringe a T1a N0 (limitado à mucosa), bem diferenciado, sem invasão linfovascular e menor que 2 cm. Um N1 exclui essa possibilidade de imediato."},"p":["Regra prática: T1a N0 → ressecção endoscópica. T1b–T2 N0 → esofagectomia upfront. T2 com fatores de risco, T3–T4a, ou qualquer N+ → neoadjuvância (CROSS) e depois cirurgia. T4b ou M1 → tratamento sistêmico ou paliativo."],"f":"van Hagen P et al., NEJM 2012 (CROSS); NCCN Guidelines — Esophageal Cancer; Sabiston, 21ª ed., cap. 42."},{"v":"Vol. II","c":11,"n":10,"g":"B","s":["Franklin, 72 anos, tabagista pesado, com disfagia progressiva para sólidos há 3 meses e perda de 9 kg. EDA: lesão infiltrativa ulcerada em terço médio do esôfago, 25–28 cm da ADS; biópsia com carcinoma espinocelular. Ecoendoscopia: cT3N1.","PET-CT: captação intensa na lesão, linfonodos mediastinais regionais aumentados, sem metástases à distância. Função pulmonar e cardiovascular adequadas; ECOG 0. Sem invasão traqueobrônquica. Ângulo de Picus 40. Qual a conduta inicial mais apropriada?"],"a":{"A":"Esofagectomia transtorácica (Ivor Lewis) imediata com linfadenectomia em 2 campos","B":"Quimiorradioterapia neoadjuvante (esquema tipo CROSS) seguida de esofagectomia com linfadenectomia em 3 campos","C":"Quimiorradioterapia definitiva (~50–50,4 Gy) com platina-taxano, sem cirurgia subsequente","D":"Quimioterapia perioperatória (por exemplo, FLOT) seguida de esofagectomia"},"ok":"Tumor cT3N1 de terço médio, sem metástase à distância, sem invasão de estruturas irressecáveis (ângulo de Picus de 40 graus é bem abaixo do limiar de 90), em paciente com ECOG 0 e boa reserva funcional. Esse é o cenário exato do CROSS: quimiorradioterapia neoadjuvante seguida de esofagectomia com linfadenectomia adequada.","w":{"A":"Cirurgia imediata em T3N1 tem resultado oncológico inferior ao tratamento multimodal, com maior taxa de margem comprometida e recidiva locorregional.","C":"A quimiorradioterapia definitiva é opção válida no epidermoide, sobretudo em tumores cervicais ou em pacientes inoperáveis. Aqui o paciente tem excelente performance e função preservada, e a abordagem trimodal (neo + cirurgia) oferece melhor controle local.","D":"O esquema FLOT é quimioterapia perioperatória validada para adenocarcinoma gástrico e da junção esofagogástrica, não para carcinoma epidermoide de terço médio, que responde melhor à radioterapia associada."},"p":["Divisor de águas terapêutico: epidermoide responde muito bem à radioterapia (CROSS, ou QRT definitiva). Adenocarcinoma de junção responde bem à quimioterapia perioperatória (FLOT) ou também ao CROSS."],"f":"van Hagen P et al., NEJM 2012; Al-Batran SE et al., Lancet 2019 — FLOT4- AIO; NCCN Guidelines."},{"v":"Vol. II","c":11,"n":11,"g":"C","s":["Paciente de 58 anos, tabagista e etilista, com disfagia progressiva há 3 meses. EDA revela lesão vegetante no terço médio do esôfago, com biópsia confirmando carcinoma epidermoide. A ecoendoscopia indica invasão da camada muscular própria e linfonodos regionais aumentados. A conduta mais apropriada neste caso é:"],"a":{"A":"Esofagectomia em 3 campos upfront","B":"Quimioterapia sistêmica exclusiva com platina e fluoropirimidina","C":"Quimiorradioterapia neoadjuvante seguida de cirurgia","D":"Radioterapia isolada com intenção paliativa"},"ok":"Invasão da muscular própria corresponde a T2, e linfonodos regionais aumentados indicam N+. Como já discutido, qualquer N positivo desloca o tratamento para a via multimodal: quimiorradioterapia neoadjuvante seguida de esofagectomia.","w":{"A":"Cirurgia upfront estaria indicada apenas se fosse N0. Com linfonodos comprometidos, perde-se a oportunidade do downstaging.","B":"Quimioterapia sistêmica exclusiva é tratamento de doença metastática (M1) ou de paciente sem condições de terapia local. Aqui a doença é localmente avançada e potencialmente curável.","D":"Radioterapia isolada paliativa é para pacientes sem condições clínicas de tratamento curativo ou com doença irressecável e sintomática. Não se aplica a um paciente potencialmente curável."},"p":["Este é o terceiro caso clínico consecutivo com a mesma resposta conceitual. A banca insiste: N positivo = neoadjuvância antes da cirurgia."],"f":"NCCN Guidelines — Esophageal Cancer; Sabiston, 21ª ed., cap. 42."},{"v":"Vol. II","c":11,"n":12,"g":"A","s":["Na avaliação pré-operatória de um paciente com câncer de esôfago distal potencialmente ressecável, o achado mais relevante que contraindica a cirurgia curativa é:"],"a":{"A":"Envolvimento de linfonodo de tronco celíaco isolado","B":"Invasão da submucosa na USG endoscópica","C":"Lesão com estenose parcial endoscópica","D":"Espessamento da parede esofágica com invasão de veia ázigos"},"ok":"O gabarito considera o comprometimento do linfonodo de tronco celíaco como o achado mais relevante para contraindicar a ressecção curativa, tratando-o como disseminação linfática à distância. Convém registrar a nuance: no AJCC 8ª edição, para tumores de esôfago distal e de junção, os linfonodos celíacos passaram a ser considerados regionais, o que na prática atual não contraindica automaticamente a cirurgia após neoadjuvância. Ainda assim, entre as quatro alternativas, é a única que representa doença avançada.","w":{"B":"Invasão da submucosa é T1b — doença precoce, plenamente ressecável, com indicação de esofagectomia (ou ressecção endoscópica em casos muito selecionados).","C":"Estenose parcial é achado descritivo da lesão, sem valor de estadiamento e sem relação com ressecabilidade.","D":"A veia ázigos pode ser ligada e ressecada em bloco durante a esofagectomia transtorácica — é rotina técnica, não contraindicação. A alternativa explora a confusão com a invasão da aorta, esta sim proibitiva."},"p":["Guarde a distinção AJCC: T4a (pleura, pericárdio, diafragma, peritônio) é ressecável; T4b (aorta, traqueia, brônquio, coração, grandes vasos, corpo vertebral) é irressecável."],"f":"AJCC Cancer Staging Manual, 8ª ed.; NCCN Guidelines; Sabiston, 21ª ed., cap. 42."},{"v":"Vol. II","c":11,"n":13,"g":"B","s":["Paciente de 68 anos com adenocarcinoma de junção esofagogástrica Siewert tipo II, estadiado como T3N1M0, em programação cirúrgica. Sobre a abordagem cirúrgica ideal:"],"a":{"A":"Esofagectomia transtorácica com linfadenectomia mediastinal seguida de terapia adjuvante","B":"Gastrectomia total com linfadenectomia D2 precedida de terapia neoadjuvante","C":"Gastrectomia subtotal com linfadenectomia D1 seguida de terapia neoadjuvante","D":"Radioterapia neoadjuvante seguida de esofagectomia trans-hiatal"},"ok":"O Siewert II (tumor centrado entre 1 cm acima e 2 cm abaixo da junção anatômica, a \"cárdia verdadeira\") é tratado como câncer gástrico proximal: gastrectomia total com esofagectomia distal e linfadenectomia D2. Sendo T3N1, há indicação formal de tratamento sistêmico perioperatório — o esquema FLOT — antes da cirurgia.","w":{"A":"A esofagectomia transtorácica é a operação do Siewert I (esôfago distal). E a terapia adjuvante isolada é inferior à perioperatória, cujo benefício foi demonstrado nos ensaios MAGIC e FLOT4.","C":"Dois erros. Gastrectomia subtotal não obtém margem proximal adequada num tumor da junção. E linfadenectomia D1 é insuficiente para tumor T3N1.","D":"A radioterapia neoadjuvante isolada não é o padrão para adenocarcinoma da junção — o padrão é quimioterapia perioperatória (FLOT) ou quimiorradioterapia (CROSS). Além disso, a esofagectomia trans-hiatal não seria a operação de escolha para o Siewert II."},"p":["Classificação de Siewert (em relação à junção anatômica): I — centro de 1 a 5 cm acima (tratado como esôfago: esofagectomia). II — de 1 cm acima a 2 cm abaixo (gastrectomia total com esofagectomia distal). III — de 2 a 5 cm abaixo (tratado como gástrico proximal: gastrectomia total)."],"f":"Sabiston, 21ª ed., cap. 42 e cap. 49; Al-Batran SE et al., Lancet 2019 (FLOT4- AIO); NCCN Guidelines — Gastric and EGJ Cancers."},{"v":"Vol. II","c":12,"n":1,"g":"C","s":["São fatores de bom prognóstico no câncer gástrico, exceto:"],"a":{"A":"Tipo intestinal de Lauren","B":"Localização antral","C":"Células em anel de sinete","D":"Idade avançada"},"ok":"Enunciado negativo. As células em anel de sinete caracterizam o tipo difuso de Lauren, cujo crescimento é infiltrativo, com pouca coesão celular (perda da E-caderina), alto potencial de disseminação peritoneal e pior prognóstico. É o único fator de mau prognóstico entre os quatro.","w":{"A":"O tipo intestinal forma glândulas, é mais bem delimitado, associa-se a fatores ambientais e à sequência gastrite → atrofia → metaplasia → displasia → carcinoma, e tem melhor prognóstico.","B":"A localização antral (distal) é mais favorável que a proximal ou a de junção, permitindo gastrectomia subtotal e associando-se a melhor sobrevida.","D":"Aqui vale a nuance: o tipo intestinal é o que predomina em idosos, e o difuso em jovens — daí a associação de idade avançada com melhor prognóstico neste enunciado. Por si só, idade avançada não é um fator protetor."},"p":["Lauren intestinal: idoso, homem, distal, glandular, ligado a H. pylori e metaplasia, melhor prognóstico. Lauren difuso: jovem, mulher, proximal ou linite plástica, anel de sinete, CDH1/E-caderina, disseminação peritoneal, pior prognóstico."],"f":"Sabiston, 21ª ed., cap. 49 (Estômago); Lauren P — The two histological main types of gastric carcinoma."},{"v":"Vol. II","c":12,"n":2,"g":"C","s":["Todos abaixo são fatores de risco para câncer gástrico, exceto:"],"a":{"A":"Helicobacter pylori","B":"Mutação no gene E-caderina","C":"Síndrome de Plummer-Vinson","D":"Elevada ingesta de nitratos"},"ok":"Enunciado negativo. A síndrome de Plummer-Vinson (ou Paterson-Kelly) é a tríade de anemia ferropriva, disfagia e membrana esofágica cervical, e associa-se ao carcinoma epidermoide de esôfago e de hipofaringe — não ao câncer gástrico. É o distrator de topografia clássico do caso.","w":{"A":"H. pylori é classificado como carcinógeno de classe I pela IARC/OMS, desencadeando a cascata gastrite crônica → atrofia → metaplasia intestinal → displasia → adenocarcinoma do tipo intestinal.","B":"Mutação germinativa de CDH1 (E-caderina) causa o câncer gástrico difuso hereditário, com penetrância alta e indicação de gastrectomia total profilática em portadores.","D":"Nitratos e nitritos de alimentos defumados, conservados em sal e embutidos são convertidos em nitrosaminas no estômago, fator ambiental bem estabelecido."},"p":["Outros fatores de risco: tabagismo, gastrite atrófica autoimune e anemia perniciosa, pólipos adenomatosos gástricos, gastrectomia parcial prévia (coto gástrico, após 15–20 anos), doença de Ménétrier, grupo sanguíneo A e síndromes hereditárias (Lynch, FAP, Li-Fraumeni)."],"f":"Sabiston, 21ª ed., cap. 49; IARC Monographs — Helicobacter pylori; NCCN Guidelines — Gastric Cancer."},{"v":"Vol. II","c":12,"n":3,"g":"B","s":["Todas as opções terapêuticas abaixo podem ser utilizadas no episódio agudo de hemorragia digestiva alta por varizes esofágicas, exceto:"],"a":{"A":"Octreotide endovenoso","B":"Betabloqueador oral","C":"Ligadura elástica por endoscopia","D":"TIPS (shunt transjugular intra-hepático portossistêmico)"},"ok":"Enunciado negativo. O betabloqueador não seletivo (propranolol, nadolol, carvedilol) é droga de profilaxia — primária, antes do primeiro sangramento, e secundária, para prevenir recidiva. No episódio agudo é contraindicado, pois bloqueia a resposta taquicárdica compensatória à hipovolemia e mascara a deterioração hemodinâmica. Só se inicia (ou reinicia) após a estabilização.","w":{"A":"O octreotide (ou terlipressina) é o vasoativo de escolha na fase aguda, promovendo vasoconstrição esplâncnica e redução da pressão portal. Deve ser iniciado antes mesmo da endoscopia.","C":"A ligadura elástica endoscópica é o tratamento hemostático de escolha para varizes esofágicas (a escleroterapia é alternativa; para varizes gástricas, usa-se cianoacrilato).","D":"O TIPS é terapia de resgate no sangramento refratário, e o \"TIPS precoce\" (nas primeiras 72 h) é recomendado em pacientes de alto risco (Child C ou Child B com sangramento ativo à endoscopia)."},"p":["Pacote do sangramento varicoso agudo: ressuscitação restritiva com alvo de Hb 7–8 g/dL, vasoativo (terlipressina/octreotide), antibiótico profilático (ceftriaxona — reduz mortalidade), endoscopia em até 12 h com ligadura, e balão de Sengstaken-Blakemore apenas como ponte por até 24 h."],"f":"Baveno VII Consensus on Portal Hypertension; AASLD Practice Guidance; Sabiston, 21ª ed., cap. 53 (Fígado)."},{"v":"Vol. II","c":12,"n":4,"g":"C","s":["Peça cirúrgica de gastrectomia. Assinale a alternativa que contém a reconstrução a ser utilizada para o restabelecimento do trato digestivo e o oligoelemento a ser reposto no pós-operatório."],"a":{"A":"Billroth II e ferro","B":"Billroth I e ácido fólico","C":"Y de Roux e cianocobalamina","D":"Y de Roux e riboflavina"},"ok":"A peça corresponde a uma gastrectomia total, cuja única reconstrução possível é a esofagojejunostomia em Y de Roux — as reconstruções Billroth I e II exigem um coto gástrico distal, que não existe. E, como a gastrectomia total remove todas as células parietais (corpo e fundo), elimina-se a produção de fator intrínseco, indispensável à absorção ileal da vitamina B12. A reposição de cianocobalamina por via parenteral torna-se obrigatória e vitalícia.","w":{"A":"Billroth II (gastrojejunostomia) só é possível após gastrectomia parcial. O ferro também precisa ser reposto após gastrectomia (por perda do ácido gástrico que reduz o ferro férrico a ferroso), mas não é a deficiência mais característica e obrigatória.","B":"Billroth I (gastroduodenostomia) igualmente exige coto gástrico. O ácido fólico é absorvido no jejuno proximal e não depende do estômago.","D":"A reconstrução está correta, mas a riboflavina (vitamina B2) não tem relação com o estômago — é absorvida no delgado proximal por transporte independente do fator intrínseco."},"p":["Deficiências pós-gastrectomia total: B12 (fator intrínseco, obrigatória e vitalícia), ferro, cálcio e vitamina D, e às vezes folato. A B12 é a marca registrada."],"f":"Sabiston, 21ª ed., cap. 49; NCCN Guidelines — seguimento nutricional pós- gastrectomia."},{"v":"Vol. II","c":12,"n":5,"g":"D","s":["Homem de 62 anos com dor epigástrica, vômitos e perda de peso, realizou EDA que evidenciou lesão úlcero-infiltrativa em corpo gástrico, com histopatológico de adenocarcinoma bem diferenciado, subtipo intestinal. É correto afirmar:"],"a":{"A":"Esse paciente tem indicação de USG endoscópico como primeiro exame, para investigar infiltração e linfonodos","B":"Nos pacientes com linfonodos perigástricos suspeitos, é necessário realizar PET-CT para confirmação","C":"Os protocolos MAGIC e FLOT utilizam quimioterapia perioperatória adjuvante, com radioterapia pós-operatória nos pacientes com linfadenectomia incompleta","D":"A cirurgia a ser realizada é a gastrectomia total com reconstrução em Y de Roux e linfadenectomia D2; não é necessário o uso de sonda nasoenteral ou dreno abdominal"},"ok":"Tumor de corpo gástrico exige gastrectomia total para obter margem proximal adequada, com reconstrução em Y de Roux e linfadenectomia D2, que é o padrão. A segunda parte da alternativa reflete os princípios do ERAS aplicados à cirurgia gástrica: sonda nasogástrica e dreno abdominal não devem ser usados rotineiramente, pois não reduzem complicações e retardam a recuperação.","w":{"A":"A ecoendoscopia é importante, mas não é o primeiro exame. A sequência é EDA com biópsia (já realizada) → TC de tórax, abdome e pelve → ecoendoscopia, quando o resultado puder mudar a conduta.","B":"O PET-CT tem sensibilidade limitada no câncer gástrico, sobretudo no tipo difuso e mucinoso, que captam pouco FDG. Não é exame de confirmação de linfonodo perigástrico.","C":"Erra a natureza dos protocolos. MAGIC e FLOT são de quimioterapia perioperatória (pré e pós-operatória), não \"perioperatória adjuvante\". E a radioterapia pós-operatória para linfadenectomia inadequada é o conceito do protocolo INT-0116/MacDonald, distinto desses dois."},"p":["FLOT (docetaxel, oxaliplatina, leucovorina, 5-FU) suplantou o esquema ECF/ECX do MAGIC, com melhor sobrevida global — mediana de 50 versus 35 meses no FLOT4-AIO."],"f":"Al-Batran SE et al., Lancet 2019 (FLOT4-AIO); Cunningham D et al., NEJM 2006 (MAGIC); Sabiston, 21ª ed., cap. 49; ERAS Society Guidelines for gastrectomy."},{"v":"Vol. II","c":12,"n":6,"g":"D","s":["O câncer gástrico pode se localizar em várias partes, o que tem importância para a estratégia cirúrgica e a reconstrução do trânsito. Qual técnica não se aplica?"],"a":{"A":"Tumores de fundo são geralmente tratados com gastrectomia total, com reconstrução em Y de Roux","B":"Tumores do antro são tratados com gastrectomia subtotal, com reconstrução em Y de Roux","C":"Tumores do antro são tratados com gastrectomia subtotal, com reconstrução pela técnica B1","D":"Tumores de fundo são geralmente tratados com gastrectomia total, com reconstrução por B1"},"ok":"Enunciado negativo. A reconstrução Billroth I é uma gastroduodenostomia — anastomose direta entre o coto gástrico remanescente e o duodeno. Após gastrectomia total não existe coto gástrico, tornando a técnica anatomicamente impossível. É a única alternativa inaplicável.","w":{"A":"Correta: tumor de fundo ou corpo proximal exige gastrectomia total com esofagojejunostomia em Y de Roux.","B":"Correta: após gastrectomia subtotal por tumor antral, o Y de Roux é uma reconstrução válida e frequentemente preferida, por reduzir refluxo biliar para o coto.","C":"Também correta: o Billroth I é reconstrução clássica após gastrectomia subtotal distal, sendo a mais fisiológica por manter o trânsito duodenal."},"p":["Reconstruções após gastrectomia parcial: Billroth I (gastroduodenostomia, mais fisiológica, mas exige coto móvel e sem tensão); Billroth II (gastrojejunostomia com alça aferente, risco de","refluxo alcalino e síndrome da alça aferente); Y de Roux (menor refluxo biliar, mas risco de síndrome do Roux stasis)."],"f":"Sabiston, 21ª ed., cap. 49; Japanese Gastric Cancer Treatment Guidelines."},{"v":"Vol. II","c":12,"n":7,"g":"D","s":["Sobre o tratamento cirúrgico dos tumores gástricos, marque a correta:"],"a":{"A":"A linfadenectomia D1 é adequada para tratar pacientes com lesões que acometem até a camada muscular do estômago","B":"A linfadenectomia D2 deve ser reservada para tumores proximais e do cárdia","C":"A reconstrução a Billroth II é mais fisiológica e apresenta menor taxa de complicação quando comparada à reconstrução em Y de Roux","D":"A cirurgia para ressecção de GISTs gástricos não necessita de linfadenectomia, pelo baixo índice de acometimento linfático desses tumores"},"ok":"Os tumores estromais gastrointestinais (GIST) originam-se das células intersticiais de Cajal e disseminam-se por via hematogênica (fígado) e peritoneal, praticamente nunca por via linfática. Por isso a ressecção é em cunha, com margens negativas macroscópicas e sem linfadenectomia, e sem necessidade de margens amplas — a pseudocápsula não deve ser rompida.","w":{"A":"A D1 (apenas linfonodos perigástricos) é insuficiente para tumores que invadem a muscular própria (T2 ou mais). O padrão nesses casos é a D2.","B":"Inverte o conceito. A D2 é o padrão para todo câncer gástrico com intenção curativa a partir de T2, independentemente da localização — e não uma exceção para tumores proximais.","C":"Erra duplamente. A reconstrução mais fisiológica é a Billroth I, que mantém o trânsito duodenal. E o Billroth II associa-se a mais refluxo biliar alcalino e à síndrome da alça aferente do que o Y de Roux."},"p":["GIST: marcador CD117 (c-KIT) e DOG-1 positivos. Tratamento adjuvante com imatinibe por 3 anos nos de alto risco (tamanho, índice mitótico, localização, ruptura tumoral). Localização mais comum: estômago (60–70%), depois delgado."],"f":"Sabiston, 21ª ed., cap. 49; NCCN Guidelines — Gastrointestinal Stromal Tumors; Japanese Gastric Cancer Treatment Guidelines."},{"v":"Vol. II","c":12,"n":8,"g":"B","s":["A lesão de Dieulafoy é causa rara de hemorragia gastrintestinal maciça e recorrente. O sangramento decorre da ruptura de artéria calibrosa anormal, geralmente situada no centro de erosão superficial, circundada por mucosa de aspecto normal, nos 6 cm proximais à junção esofagogástrica, na curvatura menor. Em relação à vascularização arterial gástrica, qual artéria está envolvida?"],"a":{"A":"Artéria gastroduodenal","B":"Artéria gástrica esquerda","C":"Artéria gastro-omental direita","D":"Artéria gástrica direita"},"ok":"A topografia descrita — 6 cm proximais à junção esofagogástrica, na curvatura menor — corresponde ao território da artéria gástrica esquerda, ramo direto do tronco celíaco. A lesão de Dieulafoy é uma artéria submucosa de calibre persistentemente aumentado (uma \"artéria de calibre persistente\") que erode a mucosa suprajacente e sangra de forma maciça e intermitente.","w":{"A":"A artéria gastroduodenal irriga a parede posterior do bulbo duodenal — é a artéria clássica do sangramento por úlcera duodenal posterior, não da lesão de Dieulafoy típica.","C":"A gastro-omental (gastroepiploica) direita irriga a grande curvatura distal, ramo da gastroduodenal — topografia oposta à descrita.","D":"A artéria gástrica direita, ramo da hepática própria, irriga a curvatura menor distal, próxima ao piloro — e não a região proximal descrita no enunciado."},"p":["Vascularização gástrica: curvatura menor — gástrica esquerda (tronco celíaco) e gástrica direita (hepática própria). Curvatura maior — gastro-omental esquerda (esplênica) e direita (gastroduodenal). Fundo — vasos gástricos curtos (esplênica). O diagnóstico de Dieulafoy é endoscópico e frequentemente exige mais de um exame, pelo caráter intermitente. Tratamento: hemostasia endoscópica (clipe, escleroterapia, ligadura); na falha, embolização ou ressecção em cunha."],"f":"Sabiston, 21ª ed., cap. 49; ACG Guideline — Upper GI Bleeding."},{"v":"Vol. II","c":12,"n":9,"g":"D","s":["Em relação à gastrectomia total com linfadenectomia D2, qual estação não faz parte da dissecção linfonodal?"],"a":{"A":"Tronco celíaco","B":"Artéria hepática comum","C":"Artéria gástrica esquerda","D":"Artéria mesentérica superior"},"ok":"Enunciado negativo. A linfadenectomia D2 abrange as estações perigástricas (1 a 6) e as dos vasos do tronco celíaco e seus ramos: estação 7 (gástrica esquerda), 8 (hepática comum), 9 (tronco celíaco), 10 (hilo esplênico) e 11 (artéria esplênica). Os linfonodos da artéria mesentérica superior (estação 14v) pertencem à dissecção D3/estendida, não fazendo parte do D2 padrão.","w":{"A":"Estação 9 — integra a D2.","B":"Estação 8 — integra a D2.","C":"Estação 7 — integra a D2."},"p":["Definição prática: D1 = linfonodos perigástricos (estações 1–6). D2 = D1 + estações 7, 8, 9, 10 e 11. Para ser considerada adequada, a peça deve conter no mínimo 16 linfonodos examinados. A D2 sem esplenectomia e pancreatectomia de rotina é o padrão atual — os ensaios holandês e britânico mostraram que a morbimortalidade da D2 clássica vinha justamente da ressecção desses órgãos."],"f":"Japanese Gastric Cancer Treatment Guidelines (JGCA); Songun I et al., Lancet Oncol — Dutch D1D2 trial, seguimento de 15 anos; Sabiston, 21ª ed., cap. 49."},{"v":"Vol. II","c":12,"n":10,"g":"D","s":["As neoplasias gástricas estão entre as mais comuns do TGI. Sobre elas, marque a","melhor opção:"],"a":{"A":"A neoplasia gástrica precoce é aquela em que não encontramos linfonodos megálicos","B":"Úlceras malignas apresentam bordas planas, fundo limpo e pregueado conservado","C":"Gastrectomias curativas devem ter o cuidado de preservar a cadeia linfática, evitando linfoceles","D":"A síndrome da alça aferente, pós-gastrectomia, pode ser corrigida com um Y de Roux"},"ok":"A síndrome da alça aferente é complicação da reconstrução a Billroth II: a alça que traz bile e suco pancreático fica obstruída ou angulada, acumulando secreção, o que causa dor pós-prandial em epigástrio aliviada por vômito bilioso em jato, sem alimento. A correção definitiva é a conversão para Y de Roux, que redireciona as secreções biliopancreáticas para longe do coto gástrico.","w":{"A":"Erra a definição, que é o ponto mais cobrado. O câncer gástrico precoce é aquele restrito à mucosa e submucosa, independentemente do acometimento linfonodal — pode haver linfonodo positivo e ainda assim ser precoce.","B":"Descreve a úlcera benigna. A úlcera maligna tem bordas elevadas, irregulares e endurecidas, fundo sujo e necrótico, e interrupção abrupta das pregas, que não convergem para a lesão.","C":"Contradiz o princípio oncológico. A gastrectomia curativa remove a cadeia linfática (linfadenectomia D2), e não a preserva. Linfocele não é preocupação que justifique preservar linfonodos."},"p":["Diferencial das complicações pós-gastrectomia: alça aferente =","vômito bilioso em jato, sem alimento, que alivia a dor. Gastrite alcalina de refluxo = dor contínua em queimação, vômito bilioso que não alivia. Dumping precoce = 15–30 min após a refeição, sintomas vasomotores e gastrointestinais. Dumping tardio = 1–3 h após, hipoglicemia reativa."],"f":"Sabiston, 21ª ed., cap. 49; Japanese Gastric Cancer Treatment Guidelines."},{"v":"Vol. II","c":12,"n":11,"g":"C","s":["Paciente de 58 anos, submetido a colectomia esquerda por adenocarcinoma de cólon esquerdo há 2 anos. O seguimento mostrou elevação do CEA e o rastreamento identificou duas lesões hepáticas, medindo a maior 3,0 cm. É correto afirmar:"],"a":{"A":"Ressecção hepática não altera sobrevida","B":"Quimioterapia isolada constitui o melhor tratamento","C":"Ressecção hepática está relacionada ao aumento da sobrevida","D":"A quantidade de metástases hepáticas não influencia o prognóstico"},"ok":"A metástase hepática colorretal é uma das poucas doenças metastáticas com intenção curativa cirúrgica. A ressecção com margens livres, em doença ressecável e com fígado remanescente funcional adequado, eleva a sobrevida em 5 anos de praticamente zero (com quimioterapia isolada) para 35 a 60%. É o conceito central da questão.","w":{"A":"Contradiz décadas de evidência. A hepatectomia é o único tratamento potencialmente curativo nesse cenário.","B":"A quimioterapia isolada é paliativa. Ela tem papel importante como neoadjuvância (conversão de irressecável para ressecável) e adjuvância, mas não substitui a ressecção quando esta é possível.","D":"O número de lesões é fator prognóstico reconhecido, integrando escores como o de Fong (que inclui número > 1, tamanho > 5 cm, CEA > 200, linfonodo positivo no primário e intervalo livre < 12 meses). Nuance importante: o número isolado deixou de ser contraindicação absoluta — hoje o critério é a possibilidade de R0 com remanescente hepático funcional suficiente."},"p":["Critério moderno de ressecabilidade: obter margem R0 preservando pelo menos 20–30% de fígado remanescente funcionante (mais em fígado quimioterapiado ou esteatótico), com vascularização e drenagem biliar íntegras."],"f":"Sabiston, 21ª ed., cap. 53; Fong Y et al., Ann Surg — Clinical score for predicting recurrence after hepatic resection for metastatic colorectal cancer; NCCN Guidelines — Colon Cancer."},{"v":"Vol. II","c":12,"n":12,"g":"A","s":["Com relação ao câncer gástrico, pode-se afirmar que:"],"a":{"A":"A OMS considera o H. pylori como carcinogênico, porém a úlcera gástrica não é considerada precursora do câncer de estômago","B":"Uma das características do carcinoma gástrico precoce é a ausência de metástases","C":"O adenocarcinoma é bastante responsivo à quimioterapia e radioterapia, sendo a gastrectomia indicada na falha da terapêutica clínica","D":"A localização gástrica do tumor estromal é incomum, sendo mais frequente no intestino delgado"},"ok":"Duas afirmações verdadeiras encadeadas. O H. pylori é carcinógeno de classe I pela IARC/OMS. E a úlcera péptica gástrica em si não é lesão precursora de câncer — o que ocorre é que algumas lesões malignas se apresentam ulceradas e podem ser confundidas com úlcera benigna. Daí a regra de biopsiar toda úlcera gástrica, em múltiplos fragmentos das bordas, e reendoscopar para documentar a cicatrização.","w":{"B":"Erra a definição de precoce, exatamente como na questão 10: câncer gástrico precoce é o restrito à mucosa e submucosa, independentemente de linfonodos ou metástases. Cerca de 10 a 20% dos precoces já têm linfonodo positivo.","C":"Inverte a hierarquia terapêutica. O adenocarcinoma gástrico é apenas moderadamente responsivo à quimioterapia, e a cirurgia é o único tratamento curativo — a quimioterapia é adjuvante ou perioperatória, jamais substituta.","D":"Inverte a epidemiologia. O estômago é a localização mais comum dos GISTs (60–70%), seguido do intestino delgado (20–30%)."},"p":["A erradicação do H. pylori reduz o risco de câncer gástrico, sobretudo se realizada antes do desenvolvimento de atrofia e metaplasia intestinal — daí a recomendação de tratar todos os portadores em regiões de alta incidência."],"f":"Sabiston, 21ª ed., cap. 49; IARC Monographs; NCCN Guidelines — Gastric Cancer."},{"v":"Vol. II","c":12,"n":13,"g":"C","s":["Paciente de 65 anos, com perda de peso não intencional e alteração de hábito intestinal, alternando períodos de constipação e diarreia, sem outras queixas ou","comorbidades. Sobre o caso:"],"a":{"A":"A radiografia de abdome será de grande ajuda","B":"A pesquisa de sangue oculto nas fezes é importante para fechar o diagnóstico","C":"Anemia é uma alteração laboratorial provável","D":"Só deverá ser feita colonoscopia se a endoscopia digestiva alta for normal"},"ok":"O quadro sugere neoplasia colorretal, provavelmente esquerda (alteração de hábito intestinal com alternância). Tumores colorretais sangram de forma crônica e oculta, produzindo anemia ferropriva — achado laboratorial esperado e frequentemente a primeira pista, especialmente nos tumores do cólon direito.","w":{"A":"A radiografia simples de abdome não tem papel diagnóstico em neoplasia colorretal; só serve para avaliar obstrução ou perfuração.","B":"A pesquisa de sangue oculto é exame de rastreamento em população assintomática. Em paciente com sintomas de alarme, ela não fecha nem exclui diagnóstico — a conduta é ir direto à colonoscopia. Um resultado negativo poderia falsamente tranquilizar.","D":"Inverte a prioridade. Com sintomas colorretais evidentes, a colonoscopia é o exame de escolha e o primeiro a ser feito. A EDA entraria em investigação de anemia sem causa aparente ou sintomas dispépticos, não como pré-requisito."},"p":["Sintomas de alarme que obrigam colonoscopia independentemente da idade: sangramento retal, anemia ferropriva, alteração persistente de hábito intestinal, perda ponderal, massa abdominal e história familiar relevante."],"f":"Sabiston, 21ª ed., cap. 51; NCCN Guidelines — Colorectal Cancer Screening."},{"v":"Vol. II","c":12,"n":14,"g":"C","s":["Homem de 62 anos, agricultor, com saciedade precoce e perda de 8 kg em 4 meses, náusea e dor epigástrica pós-prandial. Nega hematêmese, mas relata evacuações enegrecidas há duas semanas. Exame: palidez cutânea, sem visceromegalias. EDA: lesão úlcero-infiltrativa em antro gástrico, cerca de 4 cm, bordas elevadas e rígidas. Biópsia: adenocarcinoma gástrico tipo intestinal (Lauren). Hb 9,5 g/dL. Qual a conduta diagnóstica e de estadiamento mais adequada?"],"a":{"A":"Indicar gastrectomia subtotal, pois o tumor é distal e ressecável","B":"Iniciar quimioterapia neoadjuvante, por se tratar de doença avançada localmente","C":"Solicitar tomografia de tórax, abdome e pelve com contraste e avaliar laparoscopia diagnóstica para completar o estadiamento","D":"Encaminhar para PET-CT, pois substitui a TC e a ecoendoscopia no estadiamento inicial"},"ok":"O diagnóstico histológico está feito; falta o estadiamento, que é o que define a conduta. A sequência correta é a TC de tórax, abdome e pelve com contraste para pesquisar metástase à distância, complementada pela laparoscopia diagnóstica com citologia peritoneal em tumores localmente avançados (T3-T4 ou N+), que detecta carcinomatose e implantes peritoneais não vistos na tomografia em cerca de 20 a 30% dos casos, evitando laparotomias inúteis.","w":{"A":"Indicar cirurgia sem estadiamento arrisca operar um paciente com doença metastática ou carcinomatose, sem qualquer benefício.","B":"A neoadjuvância é provavelmente o caminho, mas depois do estadiamento completo — não se inicia quimioterapia sem saber se a doença é localizada ou metastática.","D":"O PET-CT não substitui a TC nem a ecoendoscopia no câncer gástrico. Sua sensibilidade é limitada, especialmente em tumores difusos, mucinosos e com anel de sinete, que captam pouco FDG."},"p":["A laparoscopia de estadiamento com lavado peritoneal é recomendada em todo câncer gástrico clinicamente T3-T4 ou N+ candidato a tratamento com intenção curativa. Citologia positiva é classificada como M1."],"f":"NCCN Guidelines — Gastric Cancer; Japanese Gastric Cancer Treatment Guidelines; Sabiston, 21ª ed., cap. 49."},{"v":"Vol. II","c":12,"n":15,"g":"A","s":["Homem de 60 anos, ex-tabagista, com disfagia para sólidos, plenitude precoce e perda de 12 kg. EDA: lesão infiltrativa centrada 3 cm abaixo da transição esofagogástrica, invadindo parcialmente a junção. Histopatológico: adenocarcinoma pouco diferenciado com células em anel de sinete. TC de tórax e abdome: espessamento da transição e corpo proximal do estômago, sem metástases à distância; linfonodos perigástricos das cadeias 1 e 2 aumentados. Qual a estratégia terapêutica mais adequada?"],"a":{"A":"Quimioterapia perioperatória (FLOT) seguida de gastrectomia total com linfadenectomia D2","B":"Quimiorradioterapia neoadjuvante seguida de esofagectomia trans- hiatal","C":"Cirurgia upfront com gastrectomia total, já que não há metástase e a doença é localizada","D":"Quimiorradioterapia (CROSS), pois a lesão é considerada Siewert I e o tratamento é semelhante ao do câncer de esôfago"},"ok":"Lesão centrada 3 cm abaixo da junção corresponde ao Siewert III, tratado como câncer gástrico proximal. Sendo localmente avançada (invasão parcial da junção, linfonodos regionais comprometidos) e sem metástases, a estratégia é quimioterapia perioperatória com FLOT seguida de gastrectomia total com esofagectomia distal e linfadenectomia D2. O anel de sinete e o padrão pouco diferenciado reforçam a necessidade de tratamento sistêmico.","w":{"B":"Esofagectomia trans-hiatal seria a operação do Siewert I, não do III. A abordagem gástrica é a adequada aqui.","C":"Cirurgia isolada em doença T3/T4 com N+ tem resultado inferior à estratégia perioperatória, tanto em sobrevida global quanto em recidiva.","D":"Erra a classificação: 3 cm abaixo da junção é Siewert III, não I (que seria de 1 a 5 cm acima). Consequentemente, erra também o protocolo."},"p":["Siewert em uma linha: I = acima (esôfago) → esofagectomia. II = na junção (cárdia) → gastrectomia total com esofagectomia distal. III = abaixo (gástrico proximal) → gastrectomia total."],"f":"Al-Batran SE et al., Lancet 2019 (FLOT4-AIO); NCCN Guidelines — Gastric and EGJ Cancers; Sabiston, 21ª ed., cap. 49."},{"v":"Vol. II","c":12,"n":16,"g":"C","s":["Paciente de 68 anos internado para colectomia. Pesa 54 kg e mede 1,64 m; além da neoplasia, é doente renal crônico em tratamento conservador. Responda a alternativa verdadeira:"],"a":{"A":"Durante o jejum para o procedimento não é necessário repor calorias, visto que o intervalo é curto; deve ser oferecida maltodextrina duas horas antes","B":"Deverá ser ofertado pelo menos 500 kcal durante o jejum pré- operatório, além de reposição de sódio e potássio a 2–4 mEq/kg/dia","C":"No enunciado já constam as informações necessárias para o cálculo da equação de Harris-Benedict","D":"O paciente possui IMC dentro da normalidade e não deve realizar reposições hipercalóricas"},"ok":"A equação de Harris-Benedict calcula o gasto energético basal a partir de quatro variáveis: sexo, idade, peso e altura. Todas as quatro constam do enunciado (homem, 68 anos, 54 kg, 1,64 m). É uma questão de leitura atenta.","w":{"A":"A primeira parte contradiz a segunda: se não fosse necessário repor calorias, não se ofereceria maltodextrina. Além disso, a bebida com carboidrato 2 h antes é justamente uma oferta calórica com finalidade metabólica (redução da resistência insulínica).","B":"Os números são arbitrários e não correspondem a nenhuma recomendação. Além disso, reposição de potássio a 2–4 mEq/kg/dia em um paciente com doença renal crônica seria potencialmente perigosa.","D":"O IMC é de aproximadamente 20,1 kg/m², de fato dentro da faixa normal — mas paciente oncológico com DRC pode estar em risco nutricional apesar do IMC. A conclusão da alternativa é precipitada e não é o que se pergunta."},"p":["Harris-Benedict (homens): GEB = 66,5 + (13,75 × peso) + (5,003 × altura em cm) − (6,775 × idade). Mulheres: 655,1 + (9,563 × peso) + (1,850 × altura) − (4,676 × idade). Multiplica-se por fatores de","atividade e de estresse."],"f":"Sabiston, 21ª ed., cap. 6; ESPEN Guideline on Clinical Nutrition in Surgery."},{"v":"Vol. II","c":12,"n":17,"g":"B","s":["Homem de 55 anos admitido com dor abdominal súbita em andar superior, história de úlcera péptica, hipotenso e com abdome em tábua. Foi solicitado o exame de imagem apresentado. Assinale a alternativa que melhor descreve o tratamento definitivo:"],"a":{"A":"Tratamento conservador com IBP endovenoso e jejum absoluto","B":"Laparotomia com sutura da úlcera e omentoplastia (técnica de Graham)","C":"Videolaparoscopia para antrectomia e reconstrução em Y de Roux","D":"Endoscopia digestiva alta para cauterização da lesão perfurada"},"ok":"A radiografia mostra ar livre subdiafragmático (pneumoperitônio), confirmando úlcera péptica perfurada em paciente com abdome em tábua e hipotensão. O tratamento definitivo é cirúrgico: rafia simples da perfuração reforçada por retalho de omento (patch de Graham), procedimento rápido, seguro e adequado ao paciente instável. Completa-se o tratamento com erradicação de H. pylori e IBP.","w":{"A":"O tratamento conservador (protocolo de Taylor) é opção de exceção: paciente estável, perfuração selada demonstrada por contraste hidrossolúvel, sem peritonite difusa. Um paciente hipotenso com abdome em tábua não se enquadra.","C":"A antrectomia é operação definitiva, indicada em situações selecionadas — úlcera gigante, refratária ou recidivada em paciente estável. Em paciente hipotenso, é morbidade desnecessária: o princípio é o damage control.","D":"A endoscopia trata sangramento, não perfuração. Insuflar ar em uma víscera perfurada agravaria a contaminação peritoneal."},"p":["A perfuração é a segunda complicação mais frequente da úlcera péptica (após o sangramento) e ocorre mais na parede anterior do bulbo duodenal. A tríade clássica: dor súbita e intensa, rigidez abdominal e história prévia de dispepsia."],"f":"Sabiston, 21ª ed., cap. 49; WSES Guidelines for the management of perforated peptic ulcer."},{"v":"Vol. II","c":12,"n":18,"g":"B","s":["Em relação ao estadiamento TNM do câncer gástrico (AJCC 8ª edição), um tumor que invade a subserosa, com acometimento de 1 linfonod
