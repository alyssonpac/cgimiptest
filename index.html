rgery (Weimann A et al.); Projeto ACERTO."},{"v":"Vol. I","c":4,"n":2,"g":"D","s":["Todos os pacientes com procedimento cirúrgico programado devem ser submetidos a uma análise global no internamento. Pacientes com risco nutricional grave são aqueles em que existe pelo menos um dos itens a seguir, exceto:"],"a":{"A":"Perda de peso > 10% em 6 meses","B":"IMC < 18,5","C":"Albumina sérica < 3 mg/dL","D":"Transferrina < 200 mg/dL"},"ok":"Enunciado negativo. Os critérios clássicos de risco nutricional grave da ESPEN, adotados pelo ACERTO, são: perda ponderal > 10–15% em 6 meses, IMC < 18,5 kg/m², ASG grau C e albumina < 3,0 g/dL (na ausência de disfunção hepática ou renal). A transferrina não integra essa lista — é marcador auxiliar, fortemente influenciado pelo status de ferro (sobe na ferropenia, cai na inflamação e na sobrecarga de ferro), o que a torna pouco confiável isoladamente.","w":{"A":"Critério clássico de risco nutricional grave.","B":"Critério clássico. Em idosos, alguns consensos elevam o corte para IMC < 20 ou < 22.","C":"Critério clássico, embora seja o mais contestado dos quatro pela razão discutida na questão anterior — mas continua nas listas oficiais."},"p":["Pacientes em risco nutricional grave devem receber terapia nutricional pré-operatória por 7 a 14 dias, adiando cirurgia eletiva se necessário. É a única situação em que se posterga uma cirurgia oncológica por motivo nutricional."],"f":"ESPEN Guideline on Clinical Nutrition in Surgery (Clin Nutr, Weimann A et al.); Projeto ACERTO; Sabiston, 21ª ed., cap. 6."},{"v":"Vol. I","c":4,"n":3,"g":"A","s":["Assinale a alternativa que indica corretamente inconvenientes da NPT:"],"a":{"A":"Sepse de corrente sanguínea e litíase biliar","B":"Translocação bacteriana e hipertrofia intestinal","C":"Íleo paralítico e aceleração do esvaziamento gástrico","D":"Hipotrigliceridemia e pancreatite"},"ok":"As duas complicações mais características da nutrição parenteral total são exatamente essas. A infecção de corrente sanguínea associada a cateter é a complicação infecciosa mais temida e decorre do acesso venoso central de longa permanência somado a uma solução rica em glicose. A litíase e a lama biliar surgem porque, sem estímulo enteral, não há liberação de colecistocinina, a vesícula não se contrai e a bile estagna — é fenômeno frequente após 4 a 6 semanas de NPT.","w":{"B":"A NPT causa o oposto: atrofia da mucosa intestinal por ausência de nutrientes luminais, o que aumenta (não reduz) a translocação bacteriana. A alternativa acerta a translocação, mas erra ao falar em hipertrofia.","C":"A NPT não acelera o esvaziamento gástrico; se algo, o repouso intestinal prolongado favorece dismotilidade. A alternativa mistura conceitos.","D":"Inverte o distúrbio lipídico: a NPT causa hipertrigliceridemia pela oferta de emulsão lipídica, e é justamente a hipertrigliceridemia que pode desencadear pancreatite. \"Hipotrigliceridemia\" torna a alternativa falsa."},"p":["Outras complicações da NPT: hiperglicemia, síndrome de realimentação (hipofosfatemia, hipocalemia, hipomagnesemia), esteatose e colestase hepáticas, distúrbios hidroeletrolíticos e complicações mecânicas da punção central. Interseção: a litíase biliar por NPT reaparece no Caso 8."],"f":"Sabiston, 21ª ed., cap. 6; ASPEN Clinical Guidelines — Parenteral Nutrition; ESPEN Guideline on Clinical Nutrition in Surgery."},{"v":"Vol. I","c":4,"n":4,"g":"A","s":["O início da nutrição enteral é evitado na seguinte situação clínica:"],"a":{"A":"Terceiro dia de pós-operatório com distensão abdominal e resíduo gástrico maior que 600 mL","B":"Paciente em pós-operatório de apendicite aguda com peritonite difusa","C":"Paciente em pré-operatório de adenocarcinoma gástrico de antro","D":"Pós-operatório de colectomia à Hartmann por tumor perfurado de sigmoide"},"ok":"Resíduo gástrico elevado associado a distensão abdominal no 3º dia de pós- operatório configura falha do esvaziamento gástrico — íleo prolongado ou obstrução. Nesse cenário, infundir dieta aumenta o risco de vômito, broncoaspiração e distensão progressiva. É contraindicação relativa, mas real, e é a única das quatro que impede o início.","w":{"B":"Peritonite tratada não contraindica a nutrição enteral. Ao contrário: em pós-operatório de peritonite, alimentar precocemente reduz translocação bacteriana e complicações infecciosas.","C":"É a indicação ideal de terapia nutricional pré-operatória. Paciente oncológico com tumor gástrico costuma ter risco nutricional e se beneficia de suporte por 7 a 14 dias antes da cirurgia.","D":"Após colectomia à Hartmann, a alimentação precoce é recomendada — o estoma inclusive facilita a avaliação do trânsito. Nenhum motivo para adiar."},"p":["Contraindicações reais à NE: instabilidade hemodinâmica com necessidade de altas doses de vasopressor (risco de isquemia mesentérica não oclusiva), obstrução intestinal mecânica completa, isquemia intestinal, hemorragia digestiva ativa e volumosa, fístula enterocutânea de alto débito sem acesso distal, vômitos incoercíveis ou resíduo muito elevado. Atenção: o resíduo gástrico isolado, de 200 a 500 mL, não é motivo para suspender dieta — diretrizes atuais desestimulam a medida rotineira de resíduo. O que define aqui é o valor muito alto somado à distensão."],"f":"ESPEN Guideline on Clinical Nutrition in the Intensive Care Unit; ASPEN/SCCM Guidelines for the Provision of Nutrition Support Therapy; Sabiston, 21ª ed., cap. 6."},{"v":"Vol. I","c":4,"n":5,"g":"D","s":["A prevalência de desnutrição varia de 22% a 58%, sendo mais significativa em portadores de doenças neoplásicas e do trato digestivo. Marque a opção correta."],"a":{"A":"Os linfócitos podem ser usados para avaliação nutricional; o limite é de 500 cel/mm³","B":"O suporte nutricional deve ser oferecido para pacientes com capacidade de ingerir mais de 50% da cota basal","C":"Pacientes gravemente desnutridos devem receber de modo progressivo até 5 g/kg/dia de proteína","D":"São elementos fundamentais ao paciente cirúrgico e devem fazer parte de sua dieta: ômega-3, glutamina e arginina"},"ok":"Os três nutrientes citados compõem a dieta imunomoduladora, recomendada pelo ACERTO e pela ESPEN em pacientes oncológicos de alto risco nutricional submetidos a cirurgia de grande porte do trato digestivo alto. A arginina é substrato para óxido nítrico e para a proliferação linfocitária; o ômega-3 desloca a produção de eicosanoides para mediadores menos inflamatórios (série 3); a glutamina é o combustível preferencial do enterócito e do linfócito.","w":{"A":"O ponto de corte da contagem total de linfócitos para depleção grave é < 900 cel/mm³ (leve < 1500; moderada < 1200; grave < 900). O valor de 500 está muito abaixo e não corresponde a nenhum critério padronizado.","B":"Invertido. O suporte é indicado para quem não consegue atingir a cota — tipicamente, ingestão inferior a 60% das necessidades por mais de 7 a 10 dias.","C":"Dose exagerada. A oferta proteica recomendada é de 1,2 a 2,0 g/kg/dia em pacientes cirúrgicos e críticos (podendo chegar a 2,5 g/kg/dia em grande queimado). Cinco gramas por quilo excederia a capacidade de utilização e sobrecarregaria rim e fígado."},"p":["Cotas de referência: 25–30 kcal/kg/dia de energia; 1,2–1,5 g/kg/dia de proteína em cirúrgicos; até 2,0 g/kg/dia em críticos."],"f":"ESPEN Guideline on Clinical Nutrition in Surgery; Projeto ACERTO; Sabiston, 21ª ed., cap. 6."},{"v":"Vol. I","c":4,"n":6,"g":"C","s":["O estado nutricional influencia diretamente a evolução perioperatória. É correto afirmar que:"],"a":{"A":"Pacientes submetidos a cirurgia de grande porte devem ser triados do ponto de vista nutricional, não sendo necessária a triagem em cirurgias de pequeno e médio porte","B":"Pacientes ASG-B ou ASG-C devem receber terapia nutricional parenteral no pré-operatório","C":"A pré-albumina tem meia-vida menor que a albumina, sendo mais sensível para alterações nutricionais recentes","D":"Não há necessidade de continuação da terapia imunomoduladora no pós-operatório para pacientes com desnutrição grave"},"ok":"A pré-albumina (transtirretina) tem meia-vida de aproximadamente 2 dias, contra cerca de 20 dias da albumina. Por isso responde rapidamente a mudanças na oferta de nutrientes e é o marcador de escolha para monitorar a resposta à terapia nutricional instituída, refletindo o que aconteceu nos últimos dias, e não nas últimas semanas.","w":{"A":"Todo paciente internado deve ser triado, independentemente do porte da cirurgia. A triagem (NRS-2002 ou MUST) é ferramenta universal, rápida e de baixo custo.","B":"Erra a via. Pacientes com desnutrição moderada ou grave devem receber suporte pré-operatório preferencialmente por via oral ou enteral. A parenteral fica reservada a quem não pode usar o trato digestivo ou não atinge a meta pela via enteral.","D":"Contraria a recomendação: em desnutrição grave, a imunonutrição deve ser mantida por 5 a 7 dias no pós-operatório, e não apenas antes da cirurgia."},"p":["ASG (Avaliação Subjetiva Global): A = bem nutrido; B = moderadamente desnutrido ou em risco; C = gravemente desnutrido."],"f":"ESPEN Guideline on Clinical Nutrition in Surgery; Detsky AS et al. — Subjective Global Assessment; Sabiston, 21ª ed., cap. 6."},{"v":"Vol. I","c":4,"n":7,"g":"C","s":["Qual dos nutrientes abaixo não compõe a dieta imunomoduladora, tão apreciada no contexto de pacientes de alto risco nutricional em pacientes oncológicos?"],"a":{"A":"Arginina","B":"Tiamina","C":"Ácidos graxos ômega-3","D":"Glutamina"},"ok":"Aqui há uma inconsistência entre o gabarito registrado e o conteúdo: os componentes da dieta imunomoduladora são arginina, ácidos graxos ômega-3, nucleotídeos e glutamina. A tiamina (vitamina B1) é a única que não faz parte — ela é uma vitamina hidrossolúvel essencial, importantíssima na prevenção da encefalopatia de Wernicke e na síndrome de realimentação, mas sem papel imunomodulador. Logo, a resposta esperada pelo conteúdo é a alternativa B, e o gabarito C parece corresponder a um erro de digitação no material original.","w":{"A":"Arginina é componente central: precursora de óxido nítrico e de poliaminas, estimula proliferação de linfócitos T.","C":"Ômega-3 é componente central: EPA e DHA deslocam a cascata do ácido araquidônico, reduzindo eicosanoides pró-inflamatórios.","D":"Glutamina é componente frequente das fórmulas: principal combustível do enterócito e do colonócito, preserva a barreira intestinal."},"p":["Regra dos benefícios comprovados da imunonutrição: redução de complicações infecciosas e de tempo de internação. Ela não reduz mortalidade global — questões que afirmam redução de mortalidade \"em todos os pacientes cirúrgicos\" são falsas."],"f":"ESPEN Guideline on Clinical Nutrition in Surgery; Projeto ACERTO; Sabiston, 21ª ed., cap. 6; Drover JW et al., J Am Coll Surg — meta-análise de dietas com arginina em cirurgia eletiva.","rv":"O gabarito do banco (ômega-3) é incoerente com o comando: a tiamina não faz parte da dieta imunomoduladora."},{"v":"Vol. I","c":4,"n":8,"g":"A","s":["Paciente de 55 anos, portador de tumor gástrico com invasão do piloro, sem passagem de sonda nasoenteral, necessitando de terapia neoadjuvante. Relata perda de 5 kg na última semana. Ingesta alimentar atinge 40% da cota calórica. Peso histórico 50 kg. IMC 18 kg/m². Marque a melhor alternativa."],"a":{"A":"Este paciente apresenta risco nutricional grave","B":"Instituir NPT imediatamente","C":"Iniciar quimioterapia neoadjuvante para poder alimentar","D":"Pela NRS-2002 ele apresenta escore 2 e, como tem mais de 50 anos, acrescentar 1 ponto"},"ok":"O paciente preenche vários critérios de gravidade simultaneamente: perda ponderal de 10% do peso em uma semana (muito acima do limiar de 5% em um mês), IMC de 18 kg/m² (abaixo de 18,5), ingestão de apenas 40% da cota e doença oncológica com obstrução mecânica. Pela NRS-2002, o comprometimento nutricional é grau 3 e a gravidade da doença é ao menos grau 2, totalizando escore ≥ 5. Trata-se, portanto, de risco nutricional grave, com indicação de terapia nutricional antes de qualquer tratamento oncológico.","w":{"B":"Está no caminho certo, mas erra a precipitação e a hierarquia. Antes de indicar NPT, é preciso esgotar as alternativas enterais: sonda posicionada além da obstrução sob endoscopia, prótese, jejunostomia. A NPT é indicada quando essas falham — e, no caso, a falha de passagem da SNE aponta para isso, mas a alternativa A é a que responde ao que se pergunta.","C":"Inverte a ordem terapêutica. Não se inicia quimioterapia em paciente com desnutrição grave esperando que o tumor reduza para depois alimentar — a toxicidade seria proibitiva e a resposta, pior. Primeiro se corrige a nutrição.","D":"Erra o cálculo e o critério etário. O acréscimo de 1 ponto na NRS- 2002 aplica-se a pacientes com ≥ 70 anos, não 50. E o escore de comprometimento nutricional aqui é 3, não 2."},"p":["NRS-2002: soma comprometimento nutricional (0–3) + gravidade da doença (0–3) + 1 ponto se idade ≥ 70 anos. Escore ≥ 3 indica terapia nutricional; ≥ 5 indica risco elevado."],"f":"Kondrup J et al. — Nutritional Risk Screening (NRS 2002), Clin Nutr; ESPEN Guideline on Clinical Nutrition in Surgery."},{"v":"Vol. I","c":4,"n":9,"g":"B","s":["Paciente oncológico, candidato a gastrectomia total, apresenta desnutrição grave e será submetido a suporte nutricional pré-operatório com imunonutrição. Segundo as evidências mais robustas, qual combinação de nutrientes e principal benefício esperado são mais consistentes com a literatura atual?"],"a":{"A":"Glutamina, arginina e ômega-3, reduzindo mortalidade em todos os pacientes cirúrgicos","B":"Arginina, nucleotídeos e ômega-3, reduzindo complicações infecciosas e tempo de internação","C":"Glutamina isolada, reduzindo tempo de ventilação mecânica em cirurgias eletivas","D":"Nucleotídeos e zinco, melhorando cicatrização e reduzindo risco de fístulas"},"ok":"A tríade com melhor nível de evidência é arginina + nucleotídeos (RNA) + ácidos graxos ômega-3, e o benefício demonstrado em metanálises é a redução de complicações infecciosas e do tempo de internação em cirurgia oncológica de grande porte do trato digestivo.","w":{"A":"Os nutrientes estão corretos, mas o desfecho está superestimado. Nenhuma metanálise demonstrou redução de mortalidade \"em todos os pacientes cirúrgicos\" — o benefício é sobre morbidade infecciosa em populações selecionadas. É a pegadinha do absoluto.","C":"Glutamina isolada não tem esse efeito. Aliás, o estudo REDOXS mostrou possível aumento de mortalidade com glutamina em altas doses em pacientes críticos com falência múltipla de órgãos, o que restringiu bastante seu uso.","D":"Nucleotídeos e zinco importam para cicatrização, mas essa não é a formulação nem o desfecho descritos na literatura da imunonutrição."},"p":["Quando o suporte começar: 5 a 7 dias antes da cirurgia em pacientes de alto risco nutricional, mantido por 5 a 7 dias no pós-operatório."],"f":"ESPEN Guideline on Clinical Nutrition in Surgery; Heyland DK et al., REDOXS trial, N Engl J Med; Sabiston, 21ª ed., cap. 6."},{"v":"Vol. I","c":4,"n":10,"g":"B","s":["Paciente de 32 anos, vítima de colisão moto × carro, internado há 10 dias. Submetido a drenagem torácica direita por pneumotórax e a laparotomia por lesão esplênica. Encontra-se consciente e orientado, em O₂ por cateter nasal, afebril. Abdome flácido, levemente doloroso, ruídos presentes. Dieta oral liberada, porém aceita apenas 40% do ofertado. Qual seria o suporte nutricional mais adequado?"],"a":{"A":"Suplementação oral","B":"Nutrição enteral","C":"Nutrição parenteral periférica","D":"Nutrição parenteral central"},"ok":"O trato gastrointestinal está funcionante (ruídos presentes, abdome flácido, dieta liberada), o que exclui de saída as vias parenterais. O ponto decisivo é a magnitude do déficit: com aceitação de apenas 40% da cota em um politraumatizado hipercatabólico há 10 dias, a suplementação oral isolada não fecha a lacuna. A conduta é instituir nutrição enteral por sonda, complementando o que a via oral não alcança.","w":{"A":"Suplementação oral seria a escolha se a aceitação estivesse próxima de 60–75% da cota, permitindo que o complemento fechasse a meta. Com 40% de aceitação em paciente hipercatabólico, é insuficiente.","C":"A parenteral periférica tem osmolaridade limitada (até cerca de 900 mOsm/L), não permite aporte calórico pleno, causa flebite e só se justifica por períodos muito curtos — e, sobretudo, é desnecessária com intestino funcionante.","D":"Parenteral central em paciente com TGI íntegro é conduta errada: expõe a infecção de cateter, hiperglicemia e atrofia da mucosa intestinal sem qualquer vantagem."},"p":["Regra de ouro, cobrada repetidamente: \"if the gut works, use it\". A hierarquia é via oral → suplemento oral → enteral por sonda → parenteral. A parenteral só entra quando o TGI é inacessível, não funcionante ou insuficiente após tentativa enteral."],"f":"ESPEN Guideline on Clinical Nutrition in Surgery e na UTI; ASPEN/SCCM Guidelines; Sabiston, 21ª ed., cap. 6."},{"v":"Vol. I","c":5,"n":1,"g":"C","s":["São exemplos de via aérea definitiva, exceto:"],"a":{"A":"Tubo orotraqueal conectado a fonte de O₂ suplementar","B":"Cricotireoidostomia cirúrgica conectada a fonte de O₂ suplementar","C":"Combitubo conectado a fonte de O₂ suplementar","D":"Tubo nasotraqueal conectado a fonte de O₂ suplementar"},"ok":"Via aérea definitiva, pela definição do ATLS, exige três elementos simultâneos: tubo posicionado dentro da traqueia, balonete (cuff) insuflado e tubo fixado, conectado a uma fonte de oxigênio. O combitubo é um dispositivo supraglótico de duplo lúmen que, na maioria das inserções, se aloja no esôfago — ele ventila indiretamente pela orofaringe. Não está na traqueia, portanto não é via aérea definitiva; é dispositivo temporário de resgate.","w":{"A":"Intubação orotraqueal é o protótipo da via aérea definitiva.","B":"Cricotireoidostomia cirúrgica é via aérea definitiva cirúrgica, indicada quando não se consegue intubar nem ventilar.","D":"A intubação nasotraqueal também é definitiva, embora hoje pouco usada; é contraindicada em suspeita de fratura de base de crânio e em apneia."},"p":["As três vias aéreas definitivas do ATLS: tubo orotraqueal, tubo nasotraqueal e via aérea cirúrgica (cricotireoidostomia ou traqueostomia). Máscara laríngea, combitubo e tubo laríngeo são temporários, servindo de ponte."],"f":"ATLS — Advanced Trauma Life Support, 10ª ed., cap. 2 (Manejo da via aérea e ventilação); Sabiston, 21ª ed., cap. 17."},{"v":"Vol. I","c":5,"n":2,"g":"D","s":["Homem de 25 anos, vítima de capotamento, chega consciente, desorientado, ECG = 11. Apresenta dor abdominal, murmúrio diminuído em hemitórax esquerdo, percussão maciça, FC 112 bpm, PA 88×56 mmHg. Sobre o atendimento inicial, é correto afirmar que:"],"a":{"A":"O paciente apresenta sinais de choque e deve ser submetido a laparotomia exploradora para investigar causa abdominal","B":"O paciente precisa ser submetido a TC de crânio antes de qualquer procedimento cirúrgico","C":"O paciente deve ser submetido a TC de abdome com contraste, já que tem dor abdominal na admissão","D":"O paciente apresenta mais de uma causa para choque hipovolêmico e deve ser submetido a drenagem torácica"},"ok":"O paciente está em choque (taquicardia, hipotensão, alteração do sensório) com duas fontes possíveis de sangramento simultâneas: o tórax esquerdo (murmúrio diminuído com percussão maciça = hemotórax) e o abdome (dor). A sequência do ATLS manda tratar o que se encontra na fase \"B\" antes de prosseguir: drenagem torácica em selo d'água, que é simultaneamente diagnóstica (quantifica o sangramento) e terapêutica.","w":{"A":"Pular direto para a laparotomia ignora o hemotórax, que pode ser a fonte principal do choque, e viola a sequência ABCDE.","B":"TC de crânio em paciente instável é conduta proibida pelo ATLS — \"o tomógrafo é o túnel da morte para o instável\". A estabilização precede qualquer exame de imagem em sala fechada.","C":"Mesmo raciocínio: TC de abdome exige paciente estável. Instável com suspeita abdominal vai para FAST à beira do leito ou direto para a laparotomia."},"p":["Diferencial pela percussão: maciça com murmúrio abolido = hemotórax; hipertimpânica com murmúrio abolido, jugular túrgida e desvio de traqueia = pneumotórax hipertensivo."],"f":"ATLS, 10ª ed., cap. 1 e 4 (Trauma torácico); Sabiston, 21ª ed., cap. 17."},{"v":"Vol. I","c":5,"n":3,"g":"B","s":["Homem de 43 anos, atleta, vítima de acidente automobilístico, apresenta importante dor torácica, FC 140 bpm, taquipneia, turgência jugular e sudorese. Ao exame:","escoriação e hematoma anterolateral do hemitórax direito no 5º espaço intercostal com crepitação; ausência de murmúrio vesicular à direita; ritmo cardíaco regular em dois tempos. O diagnóstico e a conduta são, respectivamente:"],"a":{"A":"Tamponamento cardíaco; pericardiocentese descompressiva","B":"Hemopneumotórax hipertensivo; toracocentese descompressiva imediata, seguida de toracostomia com drenagem em selo d'água","C":"Embolia pulmonar; assistência respiratória e anticoagulante","D":"Hemotórax maciço; assistência respiratória por pressão positiva com reposição volêmica imediata"},"ok":"A combinação de murmúrio abolido unilateralmente, turgência jugular, taquicardia extrema, taquipneia e enfisema subcutâneo (crepitação) sobre um trauma torácico fechado define pneumotórax hipertensivo — aqui com componente hemorrágico associado. O tratamento é imediato e em dois tempos: descompressão com agulha (ou toracostomia com dedo, conforme o ATLS 10ª ed.) seguida obrigatoriamente de drenagem torácica em selo d'água, que é o tratamento definitivo.","w":{"A":"Tamponamento cardíaco também cursa com turgência jugular e hipotensão, mas a ausculta cardíaca estaria abafada — e aqui as bulhas são normofonéticas (\"ritmo regular em dois tempos\"). Além disso, o tamponamento não abole o murmúrio vesicular. A tríade de Beck é hipotensão, turgência jugular e abafamento de bulhas.","C":"Embolia pulmonar não produz murmúrio abolido unilateral nem enfisema subcutâneo, e é diagnóstico implausível minutos após um trauma. Anticoagular um politraumatizado seria perigoso.","D":"O hemotórax maciço cursa com jugulares colabadas (por hipovolemia) e percussão maciça, não com turgência jugular. E ventilação com pressão positiva em pneumotórax hipertensivo não drenado agrava dramaticamente o quadro."},"p":["Turgência jugular no trauma reduz o diferencial a três: pneumotórax hipertensivo, tamponamento cardíaco e contusão miocárdica com falência de VD. O murmúrio abolido decide o primeiro."],"f":"ATLS, 10ª ed., cap. 4; Sabiston, 21ª ed., cap. 17."},{"v":"Vol. I","c":5,"n":4,"g":"B","s":["Em relação ao trauma na gestante e na criança, há diferenças anatômicas e fisiológicas em comparação ao adulto. É incorreto afirmar que:"],"a":{"A":"A cricotireoidostomia cirúrgica pode ser realizada em crianças cuja membrana cricotireóidea seja facilmente palpável, geralmente a partir dos 12 anos","B":"No pneumotórax hipertensivo, na criança e no adulto, deve ser realizada toracocentese descompressiva no 5º espaço intercostal anterior à linha axilar média","C":"Nas crianças há maior frequência de lesões de órgãos internos sem associação a fraturas dos ossos contíguos","D":"As gestantes Rh negativas devem ser consideradas candidatas a imunoglobulina Rh, a menos que a lesão seja remota ao útero"},"ok":"Enunciado negativo. A afirmação B mistura duas referências anatômicas de procedimentos diferentes. O ATLS 10ª edição mudou o local da descompressão por agulha no adulto para o 5º espaço intercostal na linha axilar anterior (a parede é mais fina ali, com maior taxa de sucesso). Mas, na criança, mantém-se o 2º espaço intercostal na linha hemiclavicular. Afirmar que o local é o mesmo para criança e adulto é o erro.","w":{"A":"Verdadeira. Em crianças pequenas a cricotireoidostomia cirúrgica é evitada pelo risco de estenose subglótica; a alternativa é a cricotireoidostomia por punção com ventilação a jato. Aos 12 anos, a anatomia já permite a técnica cirúrgica.","C":"Verdadeira e é um conceito importante: a caixa torácica da criança é mais complacente e o esqueleto mais cartilaginoso, de modo que a energia é transmitida às vísceras sem fraturar costelas. Ausência de fratura não exclui lesão visceral grave.","D":"Verdadeira. Toda gestante Rh negativa vítima de trauma abdominal deve receber imunoglobulina anti-D, dada a possibilidade de hemorragia fetomaterna mesmo em traumas aparentemente leves."},"p":["Outras diferenças na gestante: elevação do diafragma (drenar tórax um a dois espaços acima), hipervolemia fisiológica (mascara perda de até 1500 mL), decúbito lateral esquerdo após 20 semanas para evitar compressão da cava."],"f":"ATLS, 10ª ed., cap. 10 (Trauma pediátrico) e cap. 12 (Trauma na gestação); Sabiston, 21ª ed., cap. 17."},{"v":"Vol. I","c":5,"n":5,"g":"C","s":["Qual das situações abaixo é imprescindível para dispensarmos o RX cervical em um politraumatizado?"],"a":{"A":"Paresia de membro superior direito","B":"Fratura de fêmur associada","C":"Sobriedade","D":"Sonolência"},"ok":"Os critérios NEXUS permitem dispensar a imagem cervical apenas se todos os cinco estiverem presentes: ausência de dor à palpação da linha média posterior, ausência de déficit neurológico focal, nível de consciência normal, ausência de intoxicação e ausência de lesão dolorosa distrativa. A sobriedade é o único item da lista que aparece entre as alternativas.","w":{"A":"Paresia é déficit neurológico focal — viola o critério e obriga a imagem, com preferência por tomografia.","B":"Fratura de fêmur é o exemplo clássico de lesão distrativa: a dor intensa em outro sítio pode mascarar a dor cervical, tornando o exame físico não confiável.","D":"Sonolência indica alteração do nível de consciência, o que igualmente invalida a aplicação do NEXUS."},"p":["A regra canadense (Canadian C-Spine Rule) é a alternativa ao NEXUS, com sensibilidade semelhante e maior especificidade, mas não se aplica a pacientes com Glasgow < 15, instáveis ou intoxicados."],"f":"ATLS, 10ª ed., cap. 7 (Trauma de coluna vertebral e medular); Hoffman JR et al., NEJM — Validity of a set of clinical criteria to rule out injury to the cervical spine (NEXUS)."},{"v":"Vol. I","c":5,"n":6,"g":"D","s":["Homem de 27 anos, vítima de colisão carro-moto, chega inconsciente, Glasgow 6, PA 70/40 mmHg, FC 148 bpm, FR 34 irpm, saturação 80% em ar ambiente, murmúrio vesicular ausente à direita e jugulares ingurgitadas. Enquanto a equipe prepara o tubo orotraqueal, o residente inicia ventilação com bolsa-válvula-máscara. Imediatamente após, o paciente evolui com parada cardíaca em atividade elétrica sem pulso. Qual a conduta mais adequada e imediata?"],"a":{"A":"Iniciar RCP de alta qualidade por 2 minutos antes de qualquer outra intervenção","B":"Administrar 1 L de cristaloide aquecido em bolus rápido enquanto prossegue ventilando com bolsa-válvula-máscara","C":"Realizar toracotomia de reanimação imediatamente no pronto-socorro","D":"Realizar punção descompressiva com agulha no 2º espaço intercostal em linha hemiclavicular direita"},"ok":"O quadro descreve um pneumotórax hipertensivo que descompensou com a ventilação por pressão positiva — a bolsa-válvula-máscara empurra mais ar para o espaço pleural a cada insuflação, colapsando o retorno venoso e precipitando AESP. A causa da parada é mecânica e reversível, e o tratamento é a descompressão imediata. Em AESP no trauma, a prioridade absoluta é identificar e tratar a causa reversível, não a compressão torácica isolada.","w":{"A":"Fazer RCP sem descomprimir é insistir em circular sangue que não retorna ao coração. As compressões não corrigem a causa mecânica; o paciente não recupera pulso enquanto o tórax não for descomprimido.","B":"Volume em pneumotórax hipertensivo não resolve a obstrução ao retorno venoso, e continuar ventilando com pressão positiva agrava o quadro a cada insuflação.","C":"A toracotomia de reanimação tem indicação restrita — sobretudo trauma penetrante torácico com sinais de vida à chegada e parada presenciada. Aqui a causa é reversível por um procedimento de segundos; a toracotomia é desproporcional."},"p":["Sobre o local da punção: o ATLS 10ª ed. passou a preferir o 5º EIC na linha axilar anterior no adulto, por menor espessura de parede. A alternativa cita o 2º EIC hemiclavicular, que continua sendo aceito e é o local clássico. O ponto da questão é descomprimir, não o sítio."],"f":"ATLS, 10ª ed., cap. 4; AHA/ACLS — reversible causes of PEA (os \"5H e 5T\", em que o pneumotórax hipertensivo é um dos T)."},{"v":"Vol. I","c":5,"n":7,"g":"C","s":["Mulher de 70 anos, com náuseas e vômitos há 6 semanas, baixa aceitação de dieta sobretudo nos últimos 7 dias, perda de 12 kg no período (peso atual 40 kg), submetida em caráter de urgência a abordagem por úlcera gástrica pré-pilórica perfurada com contaminação cavitária importante; realizada gastrorrafia e biópsia local. Encontra-se em pós-operatório imediato, intubada em UTI, estável, com parâmetros ventilatórios altos, sem dieta enteral estabelecida (não foi possível passar SNE no intraoperatório). Qual a melhor estratégia nutricional?"],"a":{"A":"Manter dieta zero e prescrever apenas aporte hídrico venoso","B":"Iniciar dieta enteral em cota plena após passagem às cegas de SNE gástrica","C":"Iniciar dieta parenteral exclusiva no momento, garantindo aporte calórico inicial com progressão de cota","D":"Pensar em nova abordagem cirúrgica para confecção de gastrostomia"},"ok":"Paciente com desnutrição grave (perda de 23% do peso em 6 semanas), pós- operatório de perfuração gástrica com contaminação e sem acesso enteral viável — a tentativa intraoperatória falhou. Nesse cenário específico, a nutrição parenteral está indicada, iniciada com aporte reduzido e progressão lenta, justamente pelo alto risco de síndrome de realimentação nessa paciente.","w":{"A":"Manter apenas hidratação venosa em uma paciente com desnutrição grave é conduta insustentável: acelera a perda de massa magra, compromete cicatrização da gastrorrafia e aumenta risco infeccioso.","B":"Passar sonda gástrica às cegas logo após gastrorrafia é potencialmente desastroso: risco de lesão da sutura recém- confeccionada. Além disso, iniciar em cota plena numa paciente com desnutrição grave é a receita para síndrome de realimentação.","D":"Reoperar apenas para acesso nutricional, em paciente instável do ponto de vista respiratório e recém-operada de peritonite, não se justifica como primeira escolha. Se necessário depois, a preferência recai sobre acesso enteral guiado por endoscopia."},"p":["Na síndrome de realimentação, o retorno da glicose desloca fósforo, potássio e magnésio para o intracelular. Prevenção: iniciar com 25% da meta calórica, repor tiamina antes das calorias e monitorar eletrólitos diariamente nos primeiros dias."],"f":"ESPEN Guideline on Clinical Nutrition in the ICU; ASPEN Consensus Recommendations for Refeeding Syndrome; Sabiston, 21ª ed., cap. 6."},{"v":"Vol. I","c":5,"n":8,"g":"C","s":["Homem de 78 anos, hipertenso e diabético, em uso de sonda vesical de demora por hiperplasia prostática, aguardando cirurgia há 8 meses. Apresentou febre, dor e inchaço da bolsa escrotal há 24 h, com piora e desorientação. À avaliação: celulite","extensa de bolsa escrotal, região pubiana e base peniana, com áreas de necrose e crepitação. Séptico, com instabilidade hemodinâmica, levado de imediato para cirurgia. Qual o agente etiológico esperado?"],"a":{"A":"Escherichia coli + Staphylococcus aureus","B":"Pseudomonas + Enterococcus","C":"Clostridium + Streptococcus","D":"Staphylococcus aureus + S. epidermidis"},"ok":"O quadro é de gangrena de Fournier, fasciíte necrotizante do períneo e da genitália. Ela é caracteristicamente polimicrobiana e sinérgica (fasciíte tipo I), com participação de anaeróbios — Clostridium e Bacteroides — associados a estreptococos e enterobactérias. A crepitação descrita reflete produção de gás pelos anaeróbios. Entre as opções oferecidas, a única que reúne anaeróbio produtor de gás com coco gram-positivo é a C.","w":{"A":"E. coli realmente participa, mas o par com S. aureus não descreve o padrão sinérgico anaeróbio-aeróbio típico, e não explica a crepitação.","B":"Pseudomonas e Enterococcus podem aparecer em infecção urinária associada a sonda de longa permanência, mas não são os protagonistas da gangrena de Fournier nem produzem gás tecidual.","D":"Estafilococos são agentes de infecção de pele e partes moles convencionais, sem produção de gás nem o padrão fulminante descrito."},"p":["Conduta na gangrena de Fournier: ressuscitação, antibiótico de amplo espectro cobrindo gram-positivos, gram-negativos e anaeróbios (por exemplo, piperacilina-tazobactam + clindamicina, ou ceftriaxona + metronidazol + vancomicina), e sobretudo desbridamento cirúrgico imediato e agressivo, com reabordagens programadas. O antibiótico não substitui a cirurgia. Interseção: fasciíte necrotizante aparece também no Caso 3 (questão","1) e no Caso 10 (questão 11)."],"f":"Sabiston, 21ª ed., cap. 12; IDSA Practice Guidelines for Skin and Soft Tissue Infections; WSES/SIS-E Consensus on necrotizing soft tissue infections."},{"v":"Vol. I","c":5,"n":9,"g":"A","s":["Homem de 33 anos, vítima de acidente de motocicleta em alta velocidade, intubado na cena por inconsciência. Na admissão: (I) intubado, saturação 85%, colar cervical; (II) escoriação no tórax direito, ausculta diminuída à direita, sem enfisema subcutâneo; (III) PA 140×80 mmHg, FC 100 bpm, FAST negativo; (IV) Glasgow 3T, sedado; (V) fratura exposta de perna direita. Encaminhado para tomografia. Qual deve ser a conduta em relação ao trauma de tórax?"],"a":{"A":"Ventilação mecânica","B":"Drenagem torácica","C":"Tração do tubo traqueal","D":"Videotoracoscopia"},"ok":"O achado-chave é a combinação de estabilidade hemodinâmica (PA 140×80, FC 100), ausência de enfisema subcutâneo e FAST negativo, com apenas murmúrio diminuído à direita e dessaturação. Não há sinais de pneumotórax hipertensivo nem de hemotórax maciço. A escoriação torácica com dessaturação em paciente já intubado sugere contusão pulmonar, cujo tratamento é de suporte: ventilação mecânica com estratégia protetora, analgesia adequada e restrição hídrica criteriosa.","w":{"B":"Drenar sem evidência de pneumotórax ou hemotórax significativo expõe o paciente a complicações desnecessárias. O quadro descrito não preenche critérios: sem hipotensão, sem turgência jugular, sem enfisema, sem macicez.","C":"A tração do tubo seria a resposta se houvesse intubação seletiva do brônquio-fonte direito — situação que causa murmúrio abolido à esquerda, não à direita. Aqui a ausculta está diminuída do lado direito, incompatível com esse mecanismo.","D":"Videotoracoscopia no trauma tem papel em hemotórax retido, suspeita de lesão diafragmática e sangramento persistente de baixo débito — nunca como conduta inicial em paciente recém-admitido."},"p":["A contusão pulmonar tem evolução característica: piora progressiva nas primeiras 24 a 48 h. Radiografia inicial pode ser normal; a TC é bem mais sensível."],"f":"ATLS, 10ª ed., cap. 4; Sabiston, 21ª ed., cap. 17."},{"v":"Vol. I","c":5,"n":10,"g":"B","s":["Você está de plantão em uma UTI e recebe a radiografia do paciente do leito 1. Ar ambiente, PA 130×80, FC 80, sem outras queixas. Com a imagem apresentada, qual a conduta?","Radiografia de tórax da questão — linha pleural visível à esquerda, com ausência de trama vascular na periferia"],"a":{"A":"Toracotomia direita","B":"Toracostomia esquerda","C":"Toracocentese esquerda","D":"Toracoplastia direita"},"ok":"A radiografia mostra a linha da pleura visceral no hemitórax esquerdo, com ausência de trama vascular periférica a ela — o achado definidor de pneumotórax. O paciente está estável (sem hipotensão, sem taquicardia, saturando em ar ambiente), o que afasta pneumotórax hipertensivo. O tratamento padrão de um pneumotórax não hipertensivo, mas de volume significativo, é a toracostomia com drenagem em selo d'água do lado acometido.","w":{"A":"Toracotomia é procedimento maior, indicado por drenagem inicial superior a 1500 mL, débito persistente acima de 200 mL/h por 2–4 h, lesão de grandes vasos ou de vias aéreas — nada disso está presente. E o lado indicado está errado.","C":"A toracocentese (punção) alivia temporariamente, mas não é tratamento definitivo de pneumotórax volumoso. Em paciente estável sem urgência, parte-se direto para a drenagem.","D":"Toracoplastia é procedimento de exceção, historicamente usado em tuberculose e em empiema crônico com espaço pleural residual. Não tem qualquer papel aqui, e o lado também está errado."},"p":["Sinal de alerta em radiografias de trauma: sempre confira a lateralidade antes de responder. Metade das alternativas erradas dessas questões erra simplesmente o lado."],"f":"ATLS, 10ª ed., cap. 4; Sabiston, 21ª ed., cap. 57 (Parede torácica, pleura e mediastino)."},{"v":"Vol. I","c":5,"n":11,"g":"D","s":["Homem de 34 anos, vítima de acidente automobilístico em estrada, trazido pelos bombeiros sem médico. Chega com acesso venoso periférico obstruído, desorientado, sudoreico, pulsos finos e extremidades frias, com piora progressiva e sem responder às perguntas. Tórax com ferimentos e escoriações com marcas de cinto de segurança, crepitação em hemitórax direito, murmúrio abolido à direita e macicez à percussão. Qual deverá ser a conduta neste momento?"],"a":{"A":"Toracotomia exploradora imediata","B":"Pericardiocentese","C":"Radiografia do tórax","D":"Drenagem torácica direita"},"ok":"O paciente está em choque hemorrágico e tem, do lado direito, murmúrio abolido com macicez à percussão — a assinatura do hemotórax. A conduta imediata é a toracostomia com drenagem em selo d'água, simultaneamente terapêutica (esvazia a cavidade, reexpande o pulmão, permite tamponamento pela aposição pleural) e diagnóstica (quantifica o sangramento e define se haverá indicação de toracotomia).","w":{"A":"A toracotomia pode vir depois, mas depende de critérios objetivos que só a drenagem fornece: drenagem inicial > 1500 mL ou débito > 200 mL/h por 2 a 4 horas consecutivas. Indicá-la antes de drenar é pular a etapa que gera a informação.","B":"Pericardiocentese trataria tamponamento cardíaco, cujo quadro seria de bulhas abafadas e turgência jugular, sem alteração do murmúrio nem macicez unilateral.","C":"Radiografia em paciente instável e deteriorando atrasa o tratamento de um diagnóstico já estabelecido pelo exame físico. No trauma, o exame físico basta para indicar a drenagem."},"p":["Macicez = líquido (hemotórax). Hipertimpanismo = ar (pneumotórax). É o divisor de águas mais cobrado do caso, e aparece em três questões diferentes."],"f":"ATLS, 10ª ed., cap. 4; Sabiston, 21ª ed., cap. 17."},{"v":"Vol. I","c":6,"n":1,"g":"B","s":["Paciente admitido na emergência com o seguinte exame: decortica com membro superior direito, localiza com membro superior esquerdo, mantém olhos fechados e geme. Qual sua pontuação na Escala de Coma de Glasgow?"],"a":{"A":"8","B":"9","C":"10","D":"7"},"ok":"O conceito que a questão testa é a regra da melhor resposta motora: diante de assimetria entre os lados, pontua-se sempre o melhor. O membro direito decortica (valeria 3), mas o esquerdo localiza a dor, o que vale 5. A resposta verbal é gemido, ou seja, sons incompreensíveis = 2. Restam os olhos: o gabarito considerou abertura à dor = 2, totalizando 5 + 2 + 2 = 9. Note que o enunciado apenas afirma \"mantém olhos fechados\", sem especificar se abre ao estímulo doloroso — se a leitura for de ausência total de abertura (1), o total seria 8. É uma questão ambígua nesse ponto; vale confirmar com o tutor. O que não é ambíguo, e é o que se cobra, é pontuar 5 pela localização, e não 3 pela decorticação.","w":{"A":"Corresponde a somar abertura ocular 1 (nenhuma) em vez de 2. É a leitura mais literal do enunciado, e por isso essa é a alternativa concorrente.","C":"Chegaria a 10 somando resposta motora 6 (obedece comandos), o que não é descrito — o paciente não obedece, apenas localiza.","D":"Sete resultaria de pontuar a pior resposta motora (decorticação = 3) em vez da melhor. É o erro conceitual que a questão quer capturar."},"p":["Escala: abertura ocular 4 espontânea / 3 ao chamado / 2 à dor / 1 nenhuma. Verbal 5 orientado / 4 confuso / 3 palavras inapropriadas / 2 sons incompreensíveis / 1 nenhuma. Motora 6 obedece / 5 localiza / 4 retirada / 3 decorticação (flexão) / 2 descerebração (extensão) / 1 nenhuma. TCE leve 13–15, moderado 9–12, grave ≤ 8."],"f":"ATLS, 10ª ed., cap. 6 (Trauma cranioencefálico); Teasdale G, Jennett B — Assessment of coma and impaired consciousness, Lancet."},{"v":"Vol. I","c":6,"n":2,"g":"D","s":["Em relação ao paciente da questão anterior, quais os itens indispensáveis na condução imediata do caso?"],"a":{"A":"CPAP e observação","B":"Máscara de O₂ e ressonância magnética do encéfalo","C":"Craniectomia descompressiva à direita","D":"Intubação orotraqueal e tomografia computadorizada do encéfalo"},"ok":"Glasgow ≤ 8 é indicação absoluta de via aérea definitiva: o paciente não protege a via aérea e precisa de controle da ventilação para evitar hipóxia e hipercapnia, que são lesões secundárias devastadoras no TCE. Estabilizada a via aérea, a TC de crânio sem contraste é o exame de escolha — rápido, disponível e capaz de identificar hematomas cirúrgicos, desvio de linha média e edema.","w":{"A":"CPAP não é via aérea definitiva e é inadequado em paciente que não protege a via aérea. \"Observação\" em Glasgow 8 é inaceitável.","B":"Dois erros. Máscara de O₂ não substitui a via aérea definitiva. E a ressonância, embora mais sensível para lesão axonal difusa, é demorada, pouco disponível na urgência e inadequada para paciente instável ou monitorizado — não é o exame da fase aguda.","C":"Craniectomia descompressiva sem qualquer imagem prévia é impensável: não se sabe se há lesão cirúrgica, de que tipo nem de que lado."},"p":["No TCE, a lesão primária já está feita; todo o esforço é evitar a lesão secundária: hipóxia (SatO₂ < 90%), hipotensão (PAS < 90 mmHg), hipercapnia, hipoglicemia, hipertermia e convulsão. Um único episódio de hipotensão praticamente dobra a mortalidade."],"f":"ATLS, 10ª ed., cap. 6; Brain Trauma Foundation Guidelines for the Management of Severe TBI."},{"v":"Vol. I","c":6,"n":3,"g":"A","s":["Numa fratura de base de crânio anterior, qual dos achados abaixo não devemos encontrar?"],"a":{"A":"Tontura","B":"Rinorragia","C":"Alteração da motricidade ocular","D":"Anosmia"},"ok":"Enunciado negativo. A fossa craniana anterior aloja o osso etmoide (lâmina crivosa, por onde passam os filetes do nervo olfatório), o teto orbitário e o seio frontal. Suas fraturas produzem sinais anatomicamente específicos: rinorragia e rinorreia liquórica, anosmia por lesão do I par, equimose periorbitária bilateral (sinal do guaxinim) e comprometimento dos nervos oculomotores que atravessam a fissura orbitária superior. A tontura é sintoma inespecífico, mais associado a lesões da fossa posterior ou do osso temporal (fratura de rochedo, com lesão vestibular) — não é achado que caracterize fratura de base anterior.","w":{"B":"Rinorragia é achado esperado, por comunicação entre o seio frontal/etmoide e a cavidade nasal.","C":"Alteração da motricidade ocular ocorre pelo acometimento dos pares III, IV e VI na fissura orbitária superior.","D":"Anosmia é o sinal mais característico, por cisalhamento dos filetes olfatórios na lâmina crivosa."},"p":["Fratura de base anterior: guaxinim, rinorreia, anosmia. Fratura de base média/posterior (rochedo temporal): sinal de Battle (equimose mastóidea), otorragia/otorreia, paralisia facial periférica, hipoacusia, vertigem.","Consequência prática: em suspeita de fratura de base anterior, contraindica-se sonda nasogástrica e intubação nasotraqueal pelo risco de penetração intracraniana."],"f":"ATLS, 10ª ed., cap. 6; Sabiston, 21ª ed., cap. 17."},{"v":"Vol. I","c":6,"n":4,"g":"B","s":["Com relação ao FAST e ao lavado peritoneal diagnóstico (LPD), assinale o que for verdadeiro:"],"a":{"A":"Ambos têm boa especificidade para lesões retroperitoneais, porém baixa sensibilidade","B":"Não há contraindicações para realização destes métodos em pacientes de trauma abdominal fechado","C":"Ambos têm boa indicação em pacientes estáveis e sem alteração do nível de consciência","D":"Ambos têm boa indicação em pacientes instáveis e com alteração do nível de consciência"},"ok":"A alternativa D seria a mais defensável conceitualmente: FAST e LPD são exatamente os métodos indicados no paciente instável ou com exame físico não confiável, justamente porque são realizados à beira do leito, sem deslocar o doente. O gabarito registrado é B, sob o argumento de que não há contraindicação absoluta a esses métodos no trauma fechado — o FAST é não invasivo e o LPD tem apenas contraindicações relativas. Vale ter os dois raciocínios prontos e confirmar com o tutor, porque essa é a única questão do caso com gabarito discutível.","w":{"A":"Justamente o contrário: nem o FAST nem o LPD avaliam bem o retroperitônio. Essa é a principal limitação de ambos — lesões de duodeno, pâncreas, rim e grandes vasos retroperitoneais passam despercebidas. Para retroperitônio, o exame é a TC.","C":"Em paciente estável e com sensório preservado, o exame de escolha é a tomografia com contraste, que caracteriza lesão de órgão sólido, gradua-a e permite tratamento não operatório. FAST e LPD são para o instável."},"p":["Contraindicação absoluta ao LPD: indicação já estabelecida de laparotomia (não faz sentido investigar). Relativas: cirurgia abdominal prévia, obesidade mórbida, gestação avançada, coagulopatia. O FAST não tem contraindicação, mas é limitado em obesos, enfisema subcutâneo e ar intestinal."],"f":"ATLS, 10ª ed., cap. 5 (Trauma abdominal e pélvico); Sabiston, 21ª ed., cap. 17.","rv":"Gabarito discutível: o lavado peritoneal tem contraindicações (laparotomia já indicada, cirurgia prévia, coagulopatia, gestação avançada)."},{"v":"Vol. I","c":6,"n":5,"g":"A","s":["Homem de 34 anos, vítima de agressão por arma branca há 2 horas. Refere dor local; nega náuseas, vômitos ou dor abdominal. Obesidade grau III, consciente, orientado, FC 86 bpm, PA 130×70 mmHg. Abdome globoso, depressível, com dor à palpação profunda adjacente aos orifícios, sem descompressão dolorosa. Três lesões perfurocortantes: duas em flanco direito e uma em epigástrio, medindo 2,5 cm. Julgue: I. Como está hemodinamicamente estável e sem peritonite, deve ser submetido a avaliação mais detalhada. II. Cerca de 55–60% dos pacientes com lesão por arma branca que penetram a cavidade apresentarão hipotensão, peritonite ou evisceração. III. A conduta conservadora pode ser adotada em lesões por arma branca que penetram o peritônio anterior em pacientes estáveis. IV. As condutas conservadoras incluem observação clínica com exame físico seriado por pelo menos 24 h, associada a exames como tomografia, lavado peritoneal e videolaparoscopia diagnóstica."],"a":{"A":"V, V, V, V","B":"V, F, V, V","C":"V, V, F, V","D":"F, V, V, F"},"ok":"Todas as quatro afirmações são verdadeiras. (I) Estabilidade hemodinâmica sem sinais peritoneais permite e exige investigação em vez de laparotomia imediata. (II) A estatística está correta: pouco mais da metade dos ferimentos por arma branca que penetram a cavidade se apresenta com um dos três critérios de laparotomia imediata — o que significa que quase metade não os apresenta, e é essa fração que se beneficia de conduta seletiva. (III) O manejo seletivo não operatório de ferimento por arma branca em paciente estável é conduta consagrada e reduz laparotomias não terapêuticas. (IV) O arsenal descrito é exatamente o recomendado: exame físico seriado por no mínimo 24 h, complementado por TC, LPD ou videolaparoscopia diagnóstica conforme o caso.","w":{"B":"Erra ao considerar falsa a afirmação II, cuja estatística está de acordo com a literatura.","C":"Erra ao negar a afirmação III, que é a base do manejo seletivo moderno.","D":"Erra duplamente: nega a I (investigação em paciente estável) e a IV (arsenal do manejo conservador)."},"p":["Indicações de laparotomia imediata no trauma penetrante: instabilidade hemodinâmica, peritonite, evisceração, sangramento por sonda nasogástrica ou toque retal, e ferimento por arma de fogo transfixante do abdome. Atenção ao flanco: lesões nessa topografia exigem avaliação do retroperitônio — TC com triplo contraste é o exame indicado."],"f":"ATLS, 10ª ed., cap. 5; EAST Practice Management Guidelines — Selective Nonoperative Management of Penetrating Abdominal Trauma; Sabiston, 21ª ed., cap. 17."},{"v":"Vol. I","c":6,"n":6,"g":"C","s":["Nos pacientes com traumatismo cranioencefálico que evoluem com sangramento intracraniano e hipertensão intracraniana, ocorrem alterações fisiológicas para manter a PIC normal. De acordo com a doutrina de Monro-Kellie, as primeiras alterações são:"],"a":{"A":"Redução dos conteúdos arterial e venoso","B":"Redução do conteúdo arterial e do líquido cerebroespinhal","C":"Redução do conteúdo venoso e do líquido cerebroespinhal","D":"Redução do conteúdo arterial e herniação do cerebelo"},"ok":"A doutrina de Monro-Kellie estabelece que o crânio é uma caixa rígida com volume fixo, ocupada por três componentes: parênquima (~80%), sangue (~10%) e líquor (~10%). Diante de uma massa expansiva, a compensação inicial se faz pelos dois compartimentos mais facilmente deslocáveis: o líquor, que é reabsorvido e desviado para o espaço subaracnóideo espinhal, e o sangue venoso, que é expulso pelo sistema de baixa pressão. O sangue arterial é o último a ser comprometido, porque a autorregulação luta para preservar a perfusão cerebral.","w":{"A":"Deixa de fora o líquor, que é o principal amortecedor inicial, e inclui o arterial, que é o último a ceder.","B":"Mesmo erro: coloca o compartimento arterial entre os primeiros a ser reduzido.","D":"A herniação não é um mecanismo de compensação, e sim a falência dele — é o desfecho quando a compensação se esgota."},"p":["A curva pressão-volume é exponencial: enquanto há complacência, grandes aumentos de volume geram pouca elevação da PIC; esgotada a reserva, pequenos incrementos disparam a PIC. É o que explica a deterioração súbita. PPC = PAM − PIC. Alvo de PPC entre 60 e 70 mmHg. Por isso a hipotensão é tão letal no TCE."],"f":"ATLS, 10ª ed., cap. 6; Brain Trauma Foundation Guidelines; Sabiston, 21ª ed., cap. 68."},{"v":"Vol. I","c":6,"n":7,"g":"D","s":["Assinale a alternativa que representa um paciente vítima de trauma passível de tratamento não operatório:"],"a":{"A":"Vítima de ferimento por arma branca com exteriorização de epíplon pelo ferimento","B":"Vítima de trauma contuso, com FAST positivo, instável hemodinamicamente após ressuscitação volêmica","C":"Vítima de trauma por arma de fogo em parede anterior do abdome, com irritação peritoneal franca e completa estabilidade hemodinâmica","D":"Vítima de trauma contuso, com estabilidade hematimétrica e hemodinâmica, e tomografia que evidenciou trauma esplênico grau III"},"ok":"O tratamento não operatório (TNO) exige três condições simultâneas: trauma contuso, estabilidade hemodinâmica (mantida sem transfusão contínua) e ausência de outras indicações de laparotomia. A lesão esplênica graus I a III em paciente estável é o cenário clássico de TNO, com sucesso superior a 90%, complementado por angioembolização quando há blush de contraste ou pseudoaneurisma.","w":{"A":"Evisceração de epíplon é indicação absoluta de laparotomia no trauma penetrante, pela altíssima probabilidade de lesão visceral associada.","B":"Instabilidade persistente após ressuscitação com FAST positivo é a indicação mais inequívoca de laparotomia imediata — o paciente está sangrando no abdome agora.","C":"Irritação peritoneal franca indica laparotomia independentemente da estabilidade hemodinâmica. Além disso, ferimento por arma de fogo na parede anterior do abdome tem alta probabilidade de penetração peritoneal e de lesão visceral, e a maioria dos serviços indica laparotomia."},"p":["O TNO exige logística: monitorização em ambiente com vigilância, hematócrito seriado, cirurgião disponível e centro cirúrgico pronto. Não é \"observar e esperar\" — é vigilância ativa."],"f":"ATLS, 10ª ed., cap. 5; EAST Guidelines — Nonoperative Management of Blunt Hepatic and Splenic Injury; WSES classification of splenic trauma."},{"v":"Vol. I","c":6,"n":8,"g":"D","s":["O trauma representa a principal causa de morte em adultos jovens, com mortalidade distribuída em três fases distintas. Na TC apresentada, identifique a lesão encontrada. Marque a resposta correta.","Tomografia de abdome do caso"],"a":{"A":"Na TC observamos pneumoperitônio anterior ao fígado, com ruptura de víscera oca","B":"Na TC há líquido livre peri-hepático, com lesão da cápsula","C":"Na TC podemos identificar ruptura esplênica e lesão hepática","D":"Na TC há coleção esplênica organizada, com lesão em dois tempos"},"ok":"A imagem demonstra coleção organizada em topografia esplênica, compatível com hematoma subcapsular esplênico, entidade que fundamenta o conceito de ruptura em dois tempos: o sangramento inicial fica contido pela cápsula íntegra, o paciente permanece estável por horas ou dias, e a ruptura tardia da cápsula produz hemorragia abrupta. É uma das razões pelas quais o tratamento não operatório do baço exige vigilância prolongada.","w":{"A":"Pneumoperitônio tem densidade de ar (marcadamente hipoatenuante, comportando-se como gás na janela de pulmão) e se acumula na porção mais anterior — não é o que a imagem mostra.","B":"Descreve apenas líquido livre peri-hepático, o que é achado inespecífico e não corresponde à coleção organizada visualizada.","C":"Descreve duas lesões parenquimatosas simultâneas com ruptura franca, o que não se demonstra nos cortes apresentados."},"p":["As três fases da mortalidade no trauma (distribuição trimodal de Trunkey): imediata (segundos a minutos — lesões de grandes vasos, coração, cérebro), precoce (minutos a horas — a \"golden hour\", hemorragias tratáveis) e tardia (dias a semanas — sepse e falência de múltiplos órgãos)."],"f":"ATLS, 10ª ed., cap. 5; Sabiston, 21ª ed., cap. 17 e cap. 56 (Baço); AAST Organ Injury Scale para baço."},{"v":"Vol. I","c":6,"n":9,"g":"B","s":["Politraumatismos por acidentes automobilísticos apresentam incidência progressiva nas grandes cidades. Fraturas de face podem estar implicadas nesse contexto. Qual a alternativa que corresponde à fratura apresentada?","Traço de fratura apresentado na questão"],"a":{"A":"Le Fort I","B":"Le Fort II","C":"Le Fort III","D":"Le Fort IV"},"ok":"A Le Fort II é a fratura piramidal: o traço atravessa a maxila, sobe pela parede medial da órbita e cruza os ossos nasais, separando um bloco em forma de pirâmide que inclui o nariz e a porção central da maxila. A imagem apresentada corresponde a esse traço. Clinicamente cursa com mobilidade do bloco maxilonasal, edema periorbitário e frequentemente rinorreia liquórica.","w":{"A":"Le Fort I é a fratura transversa baixa (de Guérin): o traço passa acima dos ápices dentários e separa o processo alveolar do restante da maxila — mobiliza-se apenas o palato e a arcada dentária, sem o nariz.","C":"Le Fort III é a disjunção craniofacial completa: o traço atravessa as órbitas e o arco zigomático bilateralmente, separando toda a face da base do crânio.","D":"Le Fort IV não existe na classificação original. A classificação tem apenas três tipos."},"p":["Teste clínico: segurando a arcada dentária superior e tracionando, move-se apenas o palato (I), o palato e o nariz (II) ou toda a face (III). Implicação prática: fraturas de face médio e alto grau contraindicam sonda nasogástrica e intubação nasotraqueal, pelo risco de trajeto intracraniano."],"f":"ATLS, 10ª ed., cap. 6; Sabiston, 21ª ed., cap. 70 (Cirurgia plástica e reconstrutiva da face)."},{"v":"Vol. I","c":6,"n":10,"g":"C","s":["No atendimento dos grandes queimados é fundamental estimar a área percentual de superfície queimada. De acordo com a regra de Wallace, uma queimadura acometendo toda a perna esquerda de um adulto corresponde a:"],"a":{"A":"9%","B":"36%","C":"18%","D":"12%"},"ok":"Na regra dos nove do adulto, cada membro inferior inteiro corresponde a 18% da superfície corporal (9% na face anterior e 9% na posterior). \"Toda a perna\" no enunciado significa o membro inferior completo, portanto 18%.","w":{"A":"Nove por cento corresponde a um membro superior inteiro, à cabeça e pescoço, ou a metade de um membro inferior.","B":"Trinta e seis por cento seriam ambos os membros inferiores, ou todo o tronco (anterior 18% + posterior 18%).","D":"Doze por cento não corresponde a nenhum segmento da regra dos nove."},"p":["Regra dos nove no adulto: cabeça e pescoço 9%, cada membro superior 9%, tronco anterior 18%, tronco posterior 18%, cada membro inferior 18%, períneo 1%. Na criança a proporção muda: cabeça 18% e cada membro inferior 14%, refletindo o crânio proporcionalmente maior. Para estimativas rápidas de áreas irregulares, a palma da mão do paciente (com os dedos) equivale a cerca de 1%. Fórmula de Parkland: 4 mL × peso (kg) × %SCQ de Ringer lactato nas primeiras 24 h, sendo metade nas primeiras 8 horas contadas a partir do momento da queimadura, não da admissão."],"f":"ATLS, 10ª ed., cap. 9 (Lesões térmicas); Sabiston, 21ª ed., cap. 19 (Queimaduras)."},{"v":"Vol. I","c":6,"n":11,"g":"C","s":["Paciente de 28 anos, vítima de colisão moto × carro, chega ao hospital com hipotensão e fratura em livro aberto na radiografia de pelve, sem sinais de defesa abdominal. Qual exame ajudará a guiar a necessidade de laparotomia exploradora nesse paciente?"],"a":{"A":"Exame clínico seriado","B":"Tomografia de abdome","C":"FAST","D":"Nenhum — esse paciente já tem indicação de laparotomia"},"ok":"Este é o dilema clássico da fratura pélvica instável com hipotensão: o sangramento pode estar no retroperitônio pélvico (tratado com estabilização mecânica, faixa pélvica e angioembolização) ou na cavidade peritoneal (tratado com laparotomia). O FAST à beira do leito é o exame que discrimina os dois cenários sem deslocar o paciente. FAST positivo aponta para hemoperitônio e laparotomia; FAST negativo direciona para o sangramento pélvico retroperitoneal.","w":{"A":"Exame clínico seriado exige tempo e um paciente estável — não é opção em hipotenso agudo. Além disso, a fratura pélvica em si gera dor abdominal, tornando o exame físico pouco confiável.","B":"Tomografia exige transporte e tempo; em paciente hipotenso, é contraindicada até que se obtenha estabilidade.","D":"A fratura pélvica isolada não indica laparotomia. Ao contrário: abrir o abdome de um paciente cujo sangramento é retroperitoneal pode descomprimir o tamponamento pélvico e piorar catastroficamente a hemorragia."},"p":["Sequência na fratura pélvica instável com hipotensão: faixa pélvica (binder) → ressuscitação com protocolo de transfusão maciça e ácido tranexâmico → FAST. Se positivo, laparotomia; se negativo, angioembolização ou packing pré-peritoneal."],"f":"ATLS, 10ª ed., cap. 5; WSES Guidelines — Pelvic trauma classification and management."},{"v":"Vol. I","c":6,"n":12,"g":"B","s":["Paciente atendido na unidade de trauma, vítima de \"queda a cavaleiro\". Qual dos","sinais clínicos abaixo não é compatível com lesão de uretra posterior?"],"a":{"A":"Uretrorragia","B":"Sinal de Cullen","C":"Hematoma de bolsa escrotal","D":"Próstata em posição elevada ao toque"},"ok":"Enunciado negativo. O sinal de Cullen é a equimose periumbilical, indicativa de hemorragia retroperitoneal que disseca até o ligamento falciforme — classicamente associado a pancreatite hemorrágica grave, ruptura de aneurisma de aorta e gravidez ectópica rota. Nada tem a ver com lesão uretral.","w":{"A":"Uretrorragia (sangue no meato uretral) é o sinal mais característico e o que contraindica a sondagem vesical até a avaliação uretral por uretrocistografia retrógrada.","C":"Hematoma perineal ou de bolsa escrotal, em padrão \"borboleta\", decorre do extravasamento sanguíneo pelos planos do períneo.","D":"Próstata alta ou não palpável ao toque retal indica que o rompimento uretral permitiu a ascensão prostática — sinal clássico de lesão de uretra posterior."},"p":["Diante de suspeita de lesão uretral: não sondar. Fazer uretrocistografia retrógrada; se confirmada a lesão, derivar a urina por cistostomia suprapúbica. Sinal de Grey-Turner é a equimose de flanco, com o mesmo significado retroperitoneal do sinal de Cullen. Ambos são tardios (24–48 h) e pouco sensíveis."],"f":"ATLS, 10ª ed., cap. 5; Sabiston, 21ª ed., cap. 72 (Urologia); AUA/EAU Guidelines on Urotrauma."},{"v":"Vol. I","c":6,"n":13,"g":"D","s":["Os fenômenos fisiopatológicos que indicam cirurgia de controle de danos (\"damage control\") são:"],"a":{"A":"Hipotensão, acidose e coagulopatia","B":"Acidose, hipertermia e coagulopatia","C":"Hipotensão, alcalose e hipotermia","D":"Hipotermia, coagulopatia e acidose"},"ok":"A tríade letal do trauma é hipotermia, acidose metabólica e coagulopatia, e os três componentes se retroalimentam: a hipotermia inibe a atividade das enzimas da cascata de coagulação e a função plaquetária; a acidose reduz ainda mais a atividade do complexo fator VIIa-fator tecidual; e a coagulopatia resultante perpetua o sangramento, que agrava a hipoperfusão e, portanto, a acidose. Reconhecer essa tríade é o gatilho para abreviar a cirurgia.","w":{"A":"Hipotensão é consequência do sangramento, não componente da tríade. A tríade descreve o estado metabólico e hemostático, não o hemodinâmico.","B":"Erra ao colocar hipertermia: o problema é exatamente o oposto, a hipotermia.","C":"Erra duas vezes: hipotensão em vez de coagulopatia, e alcalose em vez de acidose."},"p":["As três etapas do damage control: (1) cirurgia abreviada — controlar hemorragia (packing, clampeamento, shunt) e contaminação (grampeamento das alças, sem anastomoses), abdome deixado aberto; (2) estabilização em UTI — reaquecimento, correção de acidose e coagulopatia; (3) reoperação programada em 24 a 48 h para reconstrução definitiva. Damage control resuscitation: hipotensão permissiva (PAS ~90 mmHg até controle da hemorragia, exceto no TCE), transfusão balanceada 1:1:1, ácido tranexâmico nas 3 primeiras horas, restrição de cristaloides."],"f":"ATLS, 10ª ed., cap. 3 e 5; Sabiston, 21ª ed., cap. 17; Rotondo MF et al. — \"Damage control\": an approach for improved survival in exsanguinating penetrating abdominal injury."},{"v":"Vol. I","c":6,"n":14,"g":"C","s":["Paciente de 36 anos, vítima de ferimento por arma branca no flanco esquerdo, chega consciente, PA 90/60 mmHg, FC 122 bpm, perfusão periférica lentificada, abdome doloroso difusamente e discretamente distendido. O FAST é duvidoso. A equipe discute encaminhá-lo para TC de abdome ou para laparotomia imediata. Qual a conduta mais indicada?"],"a":{"A":"Encaminhar imediatamente para TC de abdome com contraste, pois o FAST duvidoso não exclui lesão significativa","B":"Realizar lavado peritoneal diagnóstico para decidir sobre laparotomia","C":"Encaminhar diretamente para laparotomia exploradora sem outros exames","D":"Iniciar reposição volêmica até estabilizar e então encaminhar para TC"},"ok":"O paciente já preenche critérios de laparotomia imediata independentemente do resultado do FAST: trauma penetrante, instabilidade hemodinâmica (PA 90/60 com FC 122 e má perfusão) e dor abdominal difusa. Quando o quadro clínico já indica a operação, nenhum exame de imagem muda a conduta — ele apenas atrasa o tratamento. O FAST duvidoso, nesse contexto, é irrelevante.","w":{"A":"TC exige estabilidade hemodinâmica. Levar um instável ao tomógrafo é o erro clássico do trauma.","B":"O LPD teria papel se o paciente estivesse estável com FAST duvidoso e exame físico não confiável. Com instabilidade e trauma penetrante, é etapa desnecessária.","D":"\"Estabilizar para depois investigar\" é raciocínio equivocado: a fonte da instabilidade é o sangramento intra-abdominal, e só a laparotomia o interrompe. Volume sem controle da hemorragia dilui fatores de coagulação e agrava a tríade letal."},"p":["Regra geral: instável + suspeita abdominal = sala de cirurgia. O exame de imagem é ferramenta do paciente estável."],"f":"ATLS, 10ª ed., cap. 5; EAST Practice Management Guidelines; Sabiston, 21ª ed., cap. 17."},{"v":"Vol. I","c":6,"n":15,"g":"B","s":["Paciente de 25 anos trazido após acidente de motocicleta. Glasgow 10 (ocular 2, verbal 3, motora 5). Pupilas isocóricas e fotorreagentes, mas com anisocoria transitória à esquerda durante a avaliação inicial. TC de crânio revela hematoma extradural temporal de 2 cm de espessura, sem desvio de linha média. Hemodinamicamente estável, sem outras lesões graves. Qual a conduta inicial mais apropriada?"],"a":{"A":"Solicitar nova tomografia para reavaliação antes de qualquer intervenção","B":"Preparar imediatamente o paciente para craniotomia de urgência, devido ao risco de expansão do hematoma e deterioração neurológica","C":"Iniciar manitol 20% em bolus e observar a evolução neurológica em UTI","D":"Realizar intubação orotraqueal imediata e hiperventilar para reduzir a pressão intracraniana"},"ok":"O hematoma extradural (epidural) é a emergência neurocirúrgica com melhor prognóstico quando drenado precocemente — é a lesão em que o tempo mais faz diferença. Os critérios de indicação cirúrgica são volume > 30 mL, espessura > 15 mm ou desvio de linha média > 5 mm, além de qualquer deterioração neurológica. Aqui há espessura de 20 mm somada a anisocoria transitória, sinal de compressão do III par por herniação uncal incipiente. A craniotomia é imediata.","w":{"A":"Repetir a tomografia diante de uma lesão já cirúrgica só consome o tempo que separa o paciente de um bom desfecho. O intervalo lúcido do extradural pode terminar em minutos.","C":"O manitol é medida temporizadora, útil enquanto se prepara a sala, mas nunca substituto da drenagem. Usá-lo e apenas observar é conduta insuficiente.","D":"Intubação e proteção da via aérea são adequadas como suporte, mas a hiperventilação de rotina é hoje desaconselhada: a vasoconstrição induzida reduz a PIC ao custo de isquemia cerebral. Só se admite hiperventilação leve e transitória (PaCO₂ 30–35 mmHg) como ponte em herniação iminente."},"p":["Extradural: lesão da artéria meníngea média, imagem biconvexa (lentiforme), não cruza suturas, intervalo lúcido clássico, bom prognóstico se drenado cedo. Subdural: ruptura de veias-ponte,","imagem em crescente, cruza suturas, associado a lesão parenquimatosa e pior prognóstico."],"f":"ATLS, 10ª ed., cap. 6; Bullock MR et al., Neurosurgery — Surgical Management of Acute Epidural Hematomas; Brain Trauma Foundation Guidelines."},{"v":"Vol. I","c":6,"n":16,"g":"A","s":["Homem de 28 anos, trabalhador da construção civil, sofreu queda de andaime de cerca de 6 metros. Trazido pelos colegas, chega desorientado, com irritação peritoneal, hematoma e escoriações no abdome, extremidades frias, pálido e com pulsos finos. Qual a conduta mais adequada?"],"a":{"A":"Laparotomia exploradora imediata","B":"FAST abdominal","C":"Tomografia de abdome","D":"Radiografia do tórax e FAST"},"ok":"O paciente reúne dois critérios independentes de laparotomia imediata: choque hipovolêmico evidente (extremidades frias, palidez, pulsos finos, desorientação) e irritação peritoneal franca. Quando ambos estão presentes, nenhum exame acrescenta informação capaz de mudar a conduta — o abdome já tem indicação cirúrgica, e o tempo gasto investigando é tempo de sangramento.","w":{"B":"O FAST seria útil se o exame físico fosse duvidoso ou não confiável. Com peritonite franca, um FAST negativo não descartaria a laparotomia, o que revela sua inutilidade aqui.","C":"TC em paciente em choque é contraindicada.","D":"Radiografia de tórax faz parte da avaliação inicial do politraumatizado e pode ser obtida em paralelo, mas não deve retardar o encaminhamento à sala. Como conduta principal, a alternativa é insuficiente."},"p":["Peritonite franca + choque = laparotomia. Não investigue o que já está decidido."],"f":"ATLS, 10ª ed., cap. 5; Sabiston, 21ª ed., cap. 17."},{"v":"Vol. I","c":7,"n":1,"g":"C","s":["Em relação à classificação das hérnias inguinais, é correto afirmar:"],"a":{"A":"A hérnia inguinal da criança é classificada como Nyhus tipo II","B":"A hérnia da criança é, na maioria das vezes, direta, decorrendo de falha na parede posterior do canal inguinal","C":"A base do triângulo de Hesselbach é formada anatomicamente pelo ligamento inguinal","D":"O ligamento de Cooper está localizado abaixo da fáscia transversal e pode ser usado na correção de hérnias femorais e recidivadas"},"ok":"O triângulo de Hesselbach é delimitado por três estruturas: medialmente, a borda lateral do músculo reto abdominal; superolateralmente, os vasos epigástricos inferiores; e inferiormente (a base), o ligamento inguinal. É por essa área de fraqueza da fáscia transversalis que se insinuam as hérnias diretas.","w":{"A":"A hérnia inguinal da criança é congênita, decorrente da persistência do conduto peritoniovaginal, e por definição tem anel interno de calibre normal ou pouco alargado — corresponde a Nyhus I, não II.","B":"Inverte completamente: a hérnia da criança é indireta em praticamente todos os casos, precisamente por ser congênita e seguir o trajeto do conduto peritoniovaginal. Hérnia direta na infância é rara e sugere doença do colágeno.","D":"Esta alternativa também é verdadeira em seu conteúdo — o ligamento de Cooper (pectíneo) é reparo do reparo de McVay, usado em hérnias femorais e recidivadas, e situa-se profundamente. A banca considerou C como gabarito por descrever com precisão a base do triângulo, mas D é defensável. Se cair novamente, priorize a que descreve a anatomia de forma inequívoca."},"p":["Regra de ouro do caso: hérnia indireta sai lateralmente aos vasos epigástricos inferiores (pelo anel inguinal interno); direta sai medialmente a eles, pelo triângulo de Hesselbach."],"f":"Sabiston, 21ª ed., cap. 44 (Hérnias); Zollinger's Atlas of Surgical Operations — anatomia da região inguinal."},{"v":"Vol. I","c":7,"n":2,"g":"D","s":["BBW, 60 anos, admitido com dor em tumoração inguinal surgida há 4 horas. Ao exame: tumoração dolorosa e irredutível em região inguinal direita. Assinale a afirmação correta:"],"a":{"A":"O diagnóstico é de hérnia inguinal \"domiciliada\"","B":"Está indicada cirurgia de urgência e deve-se iniciar com laparotomia exploradora","C":"As hérnias inguinais ocorrem mais à direita, geralmente em homens, e encarceram mais facilmente que as femorais","D":"A técnica aberta com melhores resultados é a de Lichtenstein, com recorrência similar à da técnica laparoscópica"},"ok":"A técnica de Lichtenstein — reparo aberto sem tensão com tela de polipropileno fixada ao ligamento inguinal, ao tendão conjunto e ao tubérculo púbico, com abertura para o funículo — é o padrão de referência do reparo aberto. Metanálises mostram taxas de recidiva equivalentes às das técnicas laparoscópicas (TAPP e TEP), com diferenças em dor crônica, tempo de recuperação e custo, mas não em recorrência.","w":{"A":"\"Domiciliada\" é o termo usado para a hérnia crônica e redutível, que \"vive\" fora e retorna à cavidade. Uma tumoração dolorosa e irredutível de instalação aguda é hérnia encarcerada, com risco de estrangulamento.","B":"A urgência está correta, mas a via está errada. A abordagem inicial de uma hérnia inguinal encarcerada é inguinal, pela incisão convencional, permitindo inspecionar o conteúdo herniário. A laparotomia é reservada aos casos com necessidade de ressecção intestinal ou quando a alça se reduz espontaneamente antes da inspeção.","C":"Erra a comparação final. É verdade que as hérnias inguinais são mais frequentes à direita e em homens, mas as femorais encarceram e estrangulam muito mais — o anel femoral é rígido e estreito, delimitado por ligamentos inelásticos."},"p":["Encarcerada = irredutível. Estrangulada = irredutível com","comprometimento vascular (dor intensa, sinais inflamatórios locais, febre, leucocitose, sinais de obstrução)."],"f":"Sabiston, 21ª ed., cap. 44; HerniaSurge Group — International Guidelines for Groin Hernia Management, Hernia 2018."},{"v":"Vol. I","c":7,"n":3,"g":"D","s":["Paciente de 42 anos, com tumoração dolorosa e hiperemiada em região inguinal direita há 12 horas, confirmada por exame físico, laboratório e imagem como hérnia inguinal estrangulada com líquido em cavidade. Qual a melhor conduta?"],"a":{"A":"Herniorrafia inguinal totalmente extraperitoneal (TEP)","B":"Reparo de Stoppa","C":"Herniorrafia inguinal a Lichtenstein","D":"Laparotomia exploradora, com ressecção intestinal"},"ok":"Hérnia estrangulada com líquido livre na cavidade indica sofrimento de alça, provável necrose e contaminação. Nesse cenário, é preciso acesso adequado para avaliar a viabilidade intestinal, ressecar o segmento inviável e realizar anastomose. Além disso, campo contaminado contraindica a colocação de tela sintética de polipropileno pelo risco de infecção protética, o que elimina as opções que dependem de prótese.","w":{"A":"A TEP é técnica laparoscópica pré-peritoneal, com colocação de tela — inadequada em campo contaminado e limitada para avaliar e ressecar alça necrótica.","B":"O reparo de Stoppa emprega uma grande tela pré-peritoneal cobrindo todo o orifício miopectíneo bilateralmente. É excelente para hérnias recidivadas complexas em campo limpo, mas inaceitável na presença de contaminação.","C":"Lichtenstein também depende de tela. Além disso, o acesso inguinal isolado não é ideal quando já há líquido livre e necessidade de ressecção ampla."},"p":["Em campo contaminado, se for imprescindível reforçar a parede, usa- se reparo primário com sutura (tecido próprio) ou tela biológica/absorvível, nunca polipropileno."],"f":"Sabiston, 21ª ed., cap. 44; HerniaSurge Guidelines — manejo da hérnia inguinal estrangulada; WSES Guidelines on emergency repair of complicated abdominal wall hernias."},{"v":"Vol. I","c":7,"n":4,"g":"C","s":["Em relação à anatomia da região inguinal para o reparo das hérnias, é correto afirmar:"],"a":{"A":"O triângulo de Hesselbach é uma região mais frágil da fáscia transversalis, por onde se insinuam as hérnias indiretas","B":"A hérnia femoral tem como ponto de reparo o ligamento de Cooper e geralmente se desenvolve lateral aos vasos femorais","C":"Nos reparos laparoscópicos, o triângulo do desastre é aquele onde logo abaixo passam os vasos ilíacos externos","D":"O tendão conjunto corresponde ao encontro dos músculos oblíquo externo e transverso do abdome, servindo como reparo medial da tela na técnica de Lichtenstein"},"ok":"Na visão laparoscópica do espaço pré-peritoneal, o triângulo do desastre (triangle of doom) é delimitado medialmente pelo ducto deferente e lateralmente pelos vasos gonadais, tendo como vértice o anel inguinal profundo. No seu interior correm os vasos ilíacos externos. É zona proibida para grampos ou tachas, pois a lesão vascular ali pode ser fatal.","w":{"A":"Acerta a fragilidade da fáscia transversalis, mas erra o tipo de hérnia: pelo triângulo de Hesselbach saem as diretas, não as indiretas.","B":"O ligamento de Cooper realmente é o reparo, mas a hérnia femoral se desenvolve medialmente à veia femoral, e não lateral aos vasos. O canal femoral é o compartimento mais medial da bainha femoral.","D":"Erra a composição muscular. O tendão conjunto (foice inguinal) resulta da fusão das fibras do oblíquo interno e do transverso do abdome — o oblíquo externo forma a aponeurose que constitui o teto do canal e o ligamento inguinal, não o tendão conjunto."},"p":["Triângulo da dor (triangle of pain): lateral aos vasos gonadais e abaixo do trato iliopúbico. Contém os nervos femorocutâneo lateral, femoral e o ramo femoral do genitofemoral. Grampear ali causa neuralgia crônica."],"f":"Sabiston, 21ª ed., cap. 44; Fruchaud H — descrição do orifício miopectíneo; HerniaSurge Guidelines."},{"v":"Vol. I","c":7,"n":5,"g":"B","s":["Paciente de 58 anos submetido a hernioplastia inguinal aberta pela técnica de Lichtenstein há 4 dias, por hérnia inguinal Nyhus II à esquerda, retorna com dor e edema testicular à esquerda associados a febre não aferida. Sobre a provável complicação, assinale a correta."],"a":{"A":"Orquite isquêmica secundária a trombose da artéria testicular","B":"Orquite isquêmica secundária a trombose do plexo pampiniforme","C":"Orquite isquêmica secundária a lesão do nervo genitofemoral","D":"Orquiepididimite, sendo necessária administração de antimicrobiano por 7 dias"},"ok":"A orquite isquêmica pós-herniorrafia é, na imensa maioria dos casos, um fenômeno de congestão venosa, não arterial. A dissecção extensa do funículo lesa o plexo pampiniforme, gerando trombose venosa; o sangue arterial continua chegando, mas não drena, produzindo edema, dor e aumento doloroso do testículo entre o 2º e o 5º dia de pós-operatório. A evolução costuma ser autolimitada em semanas, com risco de atrofia testicular tardia.","w":{"A":"A artéria testicular tem calibre pequeno, mas há circulação colateral abundante (artéria deferencial e cremastérica). Trombose arterial isolada é rara e não é o mecanismo habitual.","C":"A lesão do nervo genitofemoral produz neuralgia — dor em queimação, parestesia e hipoestesia na face medial da coxa e no escroto —, mas não causa edema nem isquemia testicular.","D":"Orquiepididimite infecciosa é diagnóstico diferencial, mas seria incomum como complicação direta da hernioplastia sem outros fatores. A questão pede a provável complicação da técnica, que é a orquite isquêmica."},"p":["Manejo da orquite isquêmica: conservador. Anti-inflamatórios, suporte escrotal, analgesia. Não se opera e não se indica antibiótico de rotina."],"f":"Sabiston, 21ª ed., cap. 44; Wantz GE — Testicular atrophy and chronic residual neuralgia as risks of inguinal hernioplasty."},{"v":"Vol. I","c":7,"n":6,"g":"D","s":["Sobre a anatomia da região inguinal, as hérnias dessa região e a imagem apresentada, assinale a alternativa correta:"],"a":{"A":"Trata-se de uma hérnia inguinal do tipo direta","B":"Trata-se de um paciente do sexo masculino","C":"Trata-se de uma hérnia femoral","D":"Trata-se de uma hérnia inguinal do tipo indireta"},"ok":"A imagem mostra o defeito herniário situado lateralmente aos vasos epigástricos inferiores, na topografia do anel inguinal profundo — o que define a hérnia como indireta. É exatamente a aplicação da regra fundamental do caso.","w":{"A":"A hérnia direta apareceria medialmente aos vasos epigástricos, no triângulo de Hesselbach, e o defeito teria aspecto mais amplo e de base larga.","B":"Não é dedutível da imagem; e a presença ou ausência de ducto deferente e vasos gonadais no campo é o que permitiria essa inferência, elemento que a alternativa não sustenta.","C":"A hérnia femoral se localiza abaixo do trato iliopúbico/ligamento inguinal, medial à veia femoral — topografia distinta da mostrada."},"p":["Na visão laparoscópica, os vasos epigástricos inferiores são o divisor de águas: à esquerda deles (lateral) fica a fossa inguinal lateral, sede da indireta; entre eles e a artéria umbilical obliterada fica a fossa inguinal medial, sede da direta."],"f":"Sabiston, 21ª ed., cap. 44; HerniaSurge Guidelines — anatomia laparoscópica da região inguinal."},{"v":"Vol. I","c":7,"n":7,"g":"A","s":["As hérnias incisionais gigantes podem ser desafios cirúrgicos. Assinale a alternativa que elenca corretamente complicações imediatas associadas ao seu reparo."],"a":{"A":"Síndrome compartimental abdominal e hematoma subcutâneo","B":"Diástase dos retos abdominais e infecção de sítio cirúrgico","C":"Seroma de ferida e fratura das costelas flutuantes","D":"Deiscência de ferida e fibrose retroperitoneal"},"ok":"Nas hérnias incisionais gigantes ocorre a chamada \"perda de domicílio\": uma parte importante do conteúdo visceral passa a residir fora da cavidade, que se retrai. Reintroduzir esse volume de forma abrupta eleva a pressão intra-abdominal e pode desencadear síndrome compartimental
