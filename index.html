abdominal, com comprometimento respiratório (elevação do diafragma), redução do retorno venoso e queda do débito urinário. O hematoma subcutâneo é complicação imediata da dissecção extensa de retalhos.","w":{"B":"A diástase dos retos é uma condição prévia e distinta, não uma complicação do reparo. E a infecção de sítio cirúrgico, embora frequente, é complicação precoce/tardia (dias), não imediata.","C":"O seroma é complicação precoce e muito comum, mas não imediata. Fratura de costelas flutuantes não é complicação descrita desse reparo.","D":"Deiscência é complicação precoce, e a fibrose retroperitoneal é uma doença sem relação com o procedimento."},"p":["Estratégias para hérnias com perda de domicílio: pneumoperitônio progressivo pré-operatório, toxina botulínica na parede lateral, separação de componentes (técnica de Ramirez) e reparo em ponte com tela. A monitorização da pressão intravesical no pós-operatório detecta a síndrome compartimental precocemente."],"f":"Sabiston, 21ª ed., cap. 44; Ramirez OM et al. — Components separation method for closure of abdominal wall defects."},{"v":"Vol. I","c":7,"n":8,"g":"B","s":["Com relação às hérnias femorais, considere as assertivas: I. O reparo não deve ser realizado por via laparoscópica. II. A técnica de Lichtenstein está contraindicada para o reparo do canal femoral. III. O uso de tela de polipropileno não é recomendado quando há gangrena intestinal. Está(ão) correta(s):"],"a":{"A":"I","B":"II e III","C":"I e II","D":"I e III"},"ok":"Apenas II e III são verdadeiras. (II) A técnica de Lichtenstein posiciona a tela acima do ligamento inguinal, reforçando a parede posterior do canal inguinal — o defeito femoral fica abaixo desse plano e permanece descoberto. Por isso a técnica não corrige hérnia femoral. (III) Na presença de gangrena intestinal, o campo é contaminado e a tela sintética não absorvível está contraindicada pelo risco de infecção protética crônica, com necessidade de retirada.","w":{"A":"A afirmação I é falsa e, isolada, não constitui resposta.","C":"Inclui a afirmação I, que é falsa: a via laparoscópica (TAPP ou TEP) é considerada excelente para hérnia femoral, pois a tela pré-peritoneal cobre todo o orifício miopectíneo de Fruchaud, incluindo o defeito femoral. As diretrizes internacionais recomendam a abordagem laparoscópica preferencialmente em hérnias femorais e em mulheres.","D":"Mesmo erro: inclui a afirmação I."},"p":["Técnicas que corrigem hérnia femoral: McVay (ancoragem no ligamento de Cooper), plug femoral, Stoppa e as laparoscópicas TAPP/TEP. Lichtenstein clássico não corrige."],"f":"Sabiston, 21ª ed., cap. 44; HerniaSurge Group — International Guidelines for Groin Hernia Management (recomendação de abordagem endoscópica em mulheres pela alta prevalência de hérnia femoral)."},{"v":"Vol. I","c":7,"n":9,"g":"D","s":["Questão de verdadeiro ou falso sobre hérnias da parede abdominal, incluindo a afirmação de que as hérnias umbilicais são mais comuns nos homens na proporção 3:1."],"a":{"A":"1V – 3V – 5V – 7V – 9F","B":"2V – 4V – 6F – 8V – 10V","C":"5V – 6V – 7V – 9F – 10F","D":"1V – 4V – 7F – 8V – 9V"},"ok":"O enunciado desta questão está incompleto no material original — apenas o primeiro item (hérnias umbilicais) foi transcrito, sem as demais assertivas numeradas. O gabarito registrado é D. Do que se pode aproveitar: a hérnia umbilical no adulto é mais frequente em mulheres (proporção aproximada de 3:1), enquanto na criança a distribuição é semelhante entre os sexos, com maior prevalência em prematuros e afrodescendentes. Se a afirmação do enunciado diz \"mais comuns nos homens\", ela é falsa para adultos. PA R A G R AVA R Hérnia umbilical infantil: fecha espontaneamente em até 90% dos casos até os 4–5 anos. Indicação cirúrgica: persistência após 4–5 anos, anel > 1,5–2 cm, encarceramento ou defeito que aumenta. Em adultos, o reparo com tela é preferido para defeitos maiores que 1 cm. Cirrótico com hérnia umbilical e ascite merece atenção especial: alto risco de ruptura e de encarceramento; o controle da ascite deve preceder o reparo eletivo. Fonte: Sabiston, 21ª ed., cap. 44 e cap. 66 (Cirurgia pediátrica).","w":{},"p":[],"f":""},{"v":"Vol. I","c":7,"n":10,"g":"D","s":["Utilizando os vasos epigástricos inferiores, os vasos femorais e o ligamento de Cooper como pontos de reparo anatômico das hérnias inguinofemorais, pode-se afirmar corretamente que:"],"a":{"A":"A lesão do nervo ilioinguinal é muito comum na cirurgia por videolaparoscopia","B":"O anel inguinal interno por onde o saco herniário se exterioriza está medialmente aos vasos epigástricos, caracterizando a hérnia inguinal direta","C":"Quando o saco herniário está medialmente aos vasos epigástricos e lateralmente ao ligamento de Cooper, caracteriza a hérnia femoral","D":"O saco herniário que se exterioriza lateralmente aos vasos epigástricos é classificado como tipo 2 na classificação de Nyhus"},"ok":"A hérnia que se exterioriza lateralmente aos vasos epigástricos inferiores é indireta, por definição. Quando essa hérnia indireta apresenta o anel inguinal interno alargado mas com a parede posterior íntegra, ela corresponde ao Nyhus II. A alternativa D é a única que combina corretamente topografia e classificação.","w":{"A":"Inverte a via de risco. O nervo ilioinguinal corre no canal inguinal, junto ao funículo, e é lesado na cirurgia aberta. Na laparoscopia, os nervos em risco são os do triângulo da dor: femorocutâneo lateral e ramos do genitofemoral.","B":"Contradição interna: o anel inguinal interno está, por definição, lateral aos vasos epigástricos. E hérnia que sai por ele é indireta, não direta.","C":"Erra a topografia da femoral. Ela se situa abaixo do ligamento inguinal e medialmente à veia femoral, tendo o ligamento de Cooper como limite posterior — não \"lateralmente ao Cooper\". Fonte: Sabiston, 21ª ed., cap. 44; Nyhus LM — Individualization of hernia repair: a new era."},"p":[],"f":""},{"v":"Vol. I","c":7,"n":11,"g":"D","s":["Paciente apresenta hérnia inguinal indireta pela segunda vez na mesma topografia, com anel herniário de 1 cm. Qual a classificação de Nyhus desse caso?"],"a":{"A":"I","B":"II","C":"III","D":"IV"},"ok":"A classificação de Nyhus reserva o tipo IV para toda hérnia recidivada, independentemente do tipo anatômico original. Como se trata de recidiva de hérnia indireta, o enquadramento é Nyhus IVB (o subtipo B corresponde à recidiva indireta). O tamanho do anel e o tipo original passam a ser subclassificação, não o determinante principal.","w":{"A":"Nyhus I é a hérnia indireta com anel interno de calibre normal — e, sobretudo, primária, não recidivada.","B":"Nyhus II é a indireta com anel alargado e parede posterior íntegra, também primária.","C":"Nyhus III agrupa os defeitos de parede posterior: IIIA (direta), IIIB (indireta com destruição da parede posterior, a \"mista\" ou pantalonas) e IIIC (femoral). Todos primários."},"p":["Mnemônico de Nyhus: I = indireta pequena (criança); II = indireta","com anel alargado; III = defeito de parede posterior (A direta, B indireta grande/mista, C femoral); IV = recidivada (A direta, B indireta, C femoral, D mista)."],"f":"Sabiston, 21ª ed., cap. 44; Nyhus LM — Classification of groin hernia."},{"v":"Vol. I","c":7,"n":12,"g":"B","s":["Um paciente com hérnia localizada acima do ligamento inguinal, lateral aos vasos epigástricos inferiores, que alarga o anel inguinal interno sem causar defeito na parede posterior, é classificado como:"],"a":{"A":"Nyhus I","B":"Nyhus II","C":"Nyhus IIIA","D":"Nyhus IIIC"},"ok":"O enunciado descreve item por item a definição de Nyhus II: hérnia indireta (lateral aos vasos epigástricos, acima do ligamento inguinal), com anel inguinal interno alargado, porém com a parede posterior preservada. É a definição literal.","w":{"A":"Nyhus I exige anel inguinal interno de calibre normal — o enunciado explicitamente diz que está alargado.","C":"Nyhus IIIA é a hérnia direta, que sai medialmente aos vasos epigástricos e por definição implica defeito da parede posterior. O enunciado nega ambos os elementos.","D":"Nyhus IIIC é a hérnia femoral, situada abaixo do ligamento inguinal — o enunciado diz \"acima\"."},"p":["Esta é a terceira questão do caso sobre Nyhus. Se você memorizar apenas uma classificação da P1 inteira, memorize esta."],"f":"Sabiston, 21ª ed., cap. 44; Nyhus LM, Klein MS, Rogers FB — Inguinal hernia, Curr Probl Surg."},{"v":"Vol. I","c":7,"n":13,"g":"D","s":["O conhecimento anatômico detalhado da região inguinal é essencial para o tratamento operatório das hérnias inguinais. Dentre as estruturas a seguir, assinale aquela que não faz parte do funículo espermático:"],"a":{"A":"Ducto deferente","B":"Ramo genital do nervo genitofemoral","C":"Plexo pampiniforme","D":"Artéria epigástrica inferior"},"ok":"Enunciado negativo. A artéria epigástrica inferior é ramo da artéria ilíaca externa e sobe pela parede abdominal anterior, por trás do músculo reto, fora do funículo espermático. Ela é justamente o reparo anatômico que separa a hérnia direta da indireta — está adjacente ao funículo, mas não o compõe.","w":{"A":"O ducto deferente é o componente central do funículo.","B":"O ramo genital do genitofemoral acompanha o funículo, inerva o músculo cremaster e a pele escrotal anterior.","C":"O plexo pampiniforme é a rede venosa de drenagem testicular e componente essencial do funículo — é sua trombose que causa a orquite isquêmica da questão 5."},"p":["Conteúdo do funículo espermático: ducto deferente; três artérias (testicular, deferencial e cremastérica); plexo pampiniforme; ramo genital do genitofemoral; vasos linfáticos; e o processo vaginal remanescente. Envolvido por três fáscias (espermática externa, cremastérica e espermática interna)."],"f":"Sabiston, 21ª ed., cap. 44; Gray's Anatomy — região inguinal e funículo espermático."},{"v":"Vol. I","c":7,"n":14,"g":"B","s":["Qual das assertivas abaixo é falsa em relação à hérnia femoral?"],"a":{"A":"Mais comum em mulheres","B":"É tratada pela técnica de Lichtenstein","C":"Maior risco de encarceramento","D":"O abaulamento é observado abaixo do ligamento inguinal"},"ok":"Enunciado negativo. A técnica de Lichtenstein posiciona a tela sobre a parede posterior do canal inguinal, acima do ligamento inguinal, deixando o canal femoral — que está abaixo dele — completamente descoberto. Por isso não corrige hérnia femoral. Mesmo conceito da questão 8, item II.","w":{"A":"Verdadeira. A hérnia femoral é claramente mais frequente em mulheres, pela pelve mais larga e pelo anel femoral proporcionalmente maior. Ainda assim, vale a ressalva: mesmo entre mulheres, a hérnia mais comum continua sendo a inguinal indireta.","C":"Verdadeira e é o dado mais importante para a prova: o anel femoral é rígido, delimitado pelo ligamento inguinal, ligamento lacunar, ligamento de Cooper e veia femoral. Cerca de 40% se apresentam já encarceradas ou estranguladas.","D":"Verdadeira. O abaulamento aparece na raiz da coxa, abaixo do ligamento inguinal — em contraste com a hérnia inguinal, cujo abaulamento é acima dele."},"p":["Corolário prático: toda hérnia femoral tem indicação cirúrgica, mesmo assintomática, pelo risco elevado de estrangulamento."],"f":"Sabiston, 21ª ed., cap. 44; HerniaSurge Guidelines."},{"v":"Vol. I","c":7,"n":15,"g":"C","s":["Um paciente com hérnia tipo IIIA e IVC, segundo a classificação de Nyhus, apresenta que tipos de hérnia, respectivamente?"],"a":{"A":"Femoral e inguinal direta","B":"Inguinal indireta e femoral recidivada","C":"Inguinal direta e femoral recidivada","D":"Inguinal direta e umbilical"},"ok":"Aplicação direta da classificação: IIIA = hérnia inguinal direta (defeito da parede posterior, medial aos vasos epigástricos) e IVC = hérnia femoral recidivada (tipo IV designa recidiva; o sufixo C designa femoral, seguindo a mesma lógica do IIIC).","w":{"A":"Inverte a ordem e o conteúdo: IIIA é direta, não femoral; IVC é femoral recidivada, não inguinal direta.","B":"IIIA é direta, não indireta. A segunda parte está correta.","D":"A classificação de Nyhus se aplica apenas às hérnias da região inguinofemoral; hérnia umbilical não está contemplada em nenhum tipo."},"p":["Sufixos do Nyhus IV: A = direta recidivada; B = indireta recidivada; C = femoral recidivada; D = mista. Os mesmos sufixos do tipo III, o que facilita a memorização."],"f":"Sabiston, 21ª ed., cap. 44; Nyhus LM — Classification of groin hernia."},{"v":"Vol. I","c":7,"n":16,"g":"B","s":["Durante cirurgia de hérnia inguinal recidivada bilateral em paciente de 68 anos, previamente operado por técnica de Bassini há 25 anos e Shouldice há 12 anos, o cirurgião identifica extensa fibrose envolvendo o ligamento inguinal e ausência de integridade da fáscia transversalis. Qual opção representa a escolha mais adequada de abordagem e posicionamento da tela?"],"a":{"A":"Técnica de Lichtenstein com posicionamento pré-peritoneal da tela recortada para evitar compressão do funículo","B":"Técnica de Stoppa com tela de poliéster posicionada no espaço pré- peritoneal, recobrindo ambos os anéis miopectíneos de Fruchaud","C":"Técnica de McVay modificada com ancoragem no ligamento de Cooper e reforço parcial com tela absorvível","D":"Videolaparoscopia TAPP com tela de polipropileno leve fixada exclusivamente com cola biológica"},"ok":"O caso reúne três elementos que apontam para a mesma solução: recidiva bilateral, duas abordagens anteriores prévias com fibrose extensa e destruição da fáscia transversalis. O reparo de Stoppa (GPRVS — giant prosthetic reinforcement of the visceral sac) aborda o espaço pré-peritoneal por via posterior, virgem de cirurgia, evitando a fibrose anterior e o risco de lesão do funículo. A tela única e ampla recobre bilateralmente todo o orifício miopectíneo de Fruchaud, cobrindo os defeitos indireto, direto e femoral de uma só vez, e a pressão intra-abdominal a mantém aposta.","w":{"A":"Contradição interna: a técnica de Lichtenstein é, por definição, um reparo anterior com tela onlay sobre a parede posterior. Não existe \"Lichtenstein pré-peritoneal\". Além disso, reoperar por via anterior em campo fibrosado é justamente o que se quer evitar.","C":"McVay é reparo com tensão, usando tecido próprio ancorado ao ligamento de Cooper. Em fáscia transversalis destruída e tecido fibrótico, a tensão é proibitiva e a recidiva, quase certa. Tela absorvível não confere reforço duradouro.","D":"A abordagem laparoscópica seria conceitualmente razoável nesse cenário, mas a alternativa se autoinvalida ao especificar fixação exclusivamente com cola biológica em uma recidiva bilateral complexa com grande defeito — situação em que se exige fixação mecânica ou tela de grande superfície autoaderente."},"p":["Princípio de Fruchaud: todas as hérnias da virilha (indireta, direta e femoral) atravessam um mesmo orifício miopectíneo. Cobri-lo integralmente por via pré-peritoneal é o fundamento das técnicas de Stoppa, TAPP e TEP."],"f":"Sabiston, 21ª ed., cap. 44; Stoppa RE — The treatment of complicated groin and incisional hernias, World J Surg; HerniaSurge Guidelines (recomendação de abordagem posterior em recidiva após reparo anterior)."},{"v":"Vol. I","c":7,"n":17,"g":"D","s":["Sobre as hérnias femorais, assinale a alternativa correta:"],"a":{"A":"São mais comuns em homens e raramente estrangulam, devido ao amplo anel femoral","B":"O saco herniário geralmente protrai medialmente ao ligamento lacunar e acima do ligamento inguinal","C":"A hérnia femoral localiza-se abaixo do ligamento inguinal e lateral à veia femoral","D":"A cirurgia de correção pode envolver o fechamento do anel femoral, com cuidado para não lesar o nervo obturador acessório"},"ok":"O reparo da hérnia femoral frequentemente inclui a obliteração do canal femoral, aproximando o trato iliopúbico ao ligamento de Cooper. Nessa manobra é preciso atenção à coroa mortis — a anastomose entre a artéria obturatória e a epigástrica inferior, presente em cerca de 25 a 30% das pessoas, que cursa sobre o ramo superior do púbis — e às estruturas obturatórias adjacentes, cuja lesão pode provocar hemorragia de difícil controle.","w":{"A":"Duplamente falsa: são mais comuns em mulheres e estrangulam com frequência, justamente porque o anel femoral é estreito e rígido, não amplo.","B":"Erra a topografia: a hérnia femoral protrai abaixo do ligamento inguinal, e o ligamento lacunar constitui seu limite medial — o saco passa lateralmente a ele, não medialmente.","C":"Acerta o \"abaixo do ligamento inguinal\", mas erra a relação com a veia: a hérnia femoral é medial à veia femoral, ocupando o compartimento mais medial da bainha femoral, que é justamente o canal femoral."},"p":["Limites do anel femoral: anteriormente o ligamento inguinal (trato iliopúbico), posteriormente o ligamento de Cooper (pectíneo), medialmente o ligamento lacunar (de Gimbernat) e lateralmente a veia femoral."],"f":"Sabiston, 21ª ed., cap. 44; Gray's Anatomy — bainha e canal femoral."},{"v":"Vol. I","c":7,"n":18,"g":"B","s":["Paciente de 75 anos, com passado de angina, em uso de clopidogrel e AAS após implante de stent não farmacológico, chega à UPA com tumoração irredutível em","região inguinal direita, dolorosa à palpação. Qual a melhor conduta?"],"a":{"A":"Internar para avaliação cardiológica e troca das medicações para enoxaparina","B":"Transferir para unidade de emergência para cirurgia imediata","C":"Reduzir o conteúdo e suspender as medicações para cirurgia em 5 a 7 dias","D":"Avaliação cardiológica quanto ao risco, e TP/TTPA para risco de sangramento"},"ok":"Tumoração inguinal irredutível e dolorosa é hérnia encarcerada, com risco iminente de estrangulamento e necrose intestinal. Trata-se de emergência cirúrgica, e nesse contexto o risco de perder a alça supera amplamente o risco hemorrágico da dupla antiagregação. A conduta é transferir para serviço com retaguarda cirúrgica e operar.","w":{"A":"A avaliação cardiológica e a troca de antiagregante por heparina (\"bridging\") são estratégias de cirurgia eletiva, e mesmo aí a substituição de antiagregante por heparina não tem respaldo — heparina não previne trombose de stent.","C":"Perigoso em dois níveis. Primeiro, a redução manual (taxis) de hérnia encarcerada dolorosa arrisca a redução em massa, em que o saco com a alça isquêmica retorna à cavidade e a necrose evolui silenciosamente. Segundo, aguardar 5 a 7 dias com uma alça possivelmente comprometida é inaceitável.","D":"Os exames citados são inadequados: TP e TTPA não avaliam a função plaquetária nem o efeito do AAS ou do clopidogrel. Além disso, protelar a cirurgia por avaliação eletiva contraria a urgência do quadro."},"p":["Sobre a dupla antiagregação: em cirurgia de urgência, mantém-se o","AAS e, quando possível, suspende-se apenas o clopidogrel, com plaquetas disponíveis para transfusão se houver sangramento significativo. Nunca se suspende antiagregação no primeiro mês após stent não farmacológico ou nos primeiros 6–12 meses após stent farmacológico em cirurgia eletiva."],"f":"Sabiston, 21ª ed., cap. 44; ACC/AHA Perioperative Guideline — manejo de antiagregantes em portadores de stent; WSES Guidelines on emergency hernia repair."},{"v":"Vol. I","c":7,"n":19,"g":"D","s":["Mulher de 54 anos, no 6º dia de pós-operatório de correção de hérnia incisional de laparotomia mediana com tela de polipropileno sobre a aponeurose (técnica onlay), com dreno no subcutâneo. Evoluiu com dor na incisão e saída de secreção espessa e purulenta. Encontra-se em bom estado geral, afebril, com abdome flácido e pouco doloroso. Qual deve ser a conduta neste momento?"],"a":{"A":"Troca da tela e curativo com carvão ativado","B":"Cefazolina com abertura da incisão, se não houver melhora","C":"Antibioticoterapia por 14 dias","D":"Retirada de pontos, desbridamento e curativo diário"},"ok":"O quadro é de infecção de sítio cirúrgico superficial/profunda com coleção purulenta em paciente estável, afebril e sem sinais sistêmicos. O princípio fundamental do tratamento de qualquer coleção purulenta é a drenagem: abrir a ferida, retirar os pontos da região comprometida, desbridar tecido desvitalizado e manter curativos diários. Nesse cenário, o antibiótico é coadjuvante e frequentemente dispensável.","w":{"A":"A retirada da tela não é o primeiro passo. Telas de polipropileno macroporosas (monofilamentares) toleram bem infecção e podem ser salvas com drenagem, desbridamento e curativos — inclusive com terapia por pressão negativa. A explantação fica reservada à falha do tratamento conservador, exposição extensa ou telas multifilamentares/microporosas (como o PTFE).","B":"Inverte a ordem terapêutica. Não se trata coleção purulenta com antibiótico esperando para abrir depois: abre-se primeiro. \"Se não houver melhora\" é uma espera injustificável diante de pus.","C":"Antibiótico prolongado sem drenagem é conduta ineficaz e favorece resistência. Ademais, a paciente está afebril e em bom estado geral, sem indicação de esquema prolongado."},"p":["Regra atemporal da cirurgia: ubi pus, ibi evacua — onde há pus, drene. Antibiótico não penetra em coleção."],"f":"Sabiston, 21ª ed., cap. 12 e cap. 44; Ventral Hernia Working Group — manejo de infecção de tela."},{"v":"Vol. I","c":7,"n":20,"g":"D","s":["Mulher de 74 anos, diabética e hipertensa em uso de metformina e losartana, com","taxas controladas, procurou o ambulatório por tumoração na raiz da coxa direita ao esforço, sem dor, com diagnóstico de hérnia femoral. Parecer cardiológico prévio liberou a cirurgia (ASA II, PA controlada). O interno pergunta ao preceptor se a paciente deve ser operada mesmo com essas comorbidades. Qual deveria ser a conduta?"],"a":{"A":"Manter em observação ambulatorial","B":"Sem sintomas dolorosos, não operar","C":"Idade e comorbidades contraindicam a cirurgia","D":"Operar por risco aumentado de obstrução e estrangulamento"},"ok":"Esta é a questão-síntese do caso: toda hérnia femoral deve ser operada eletivamente, mesmo quando assintomática. O motivo é o risco desproporcionalmente alto de encarceramento e estrangulamento, decorrente do anel femoral estreito e rígido. Operar de forma eletiva em uma paciente ASA II com comorbidades controladas tem morbimortalidade baixa; esperar a hérnia estrangular converte o mesmo procedimento em uma cirurgia de urgência, potencialmente com ressecção intestinal, e a mortalidade sobe várias vezes.","w":{"A":"Observação é a conduta aceitável apenas em hérnia inguinal (não femoral) minimamente sintomática em homens — estratégia de \"watchful waiting\" validada por ensaios clínicos. Não se aplica à femoral.","B":"Confunde os dois cenários. Na hérnia femoral, a ausência de dor não é argumento para não operar; ela apenas indica que ainda não houve complicação.","C":"Idade e comorbidades controladas não contraindicam cirurgia eletiva de pequeno porte. Ao contrário: quanto mais comórbida a paciente, maior a vantagem de operar eletivamente em vez de na urgência."},"p":["Watchful waiting é opção para hérnia inguinal oligossintomática em","homens — e, ainda assim, cerca de 70% acabam operando em 10 anos por progressão dos sintomas. Nunca é opção para femoral."],"f":"Sabiston, 21ª ed., cap. 44; HerniaSurge Group — International Guidelines for Groin Hernia Management (recomendação forte de reparo em toda hérnia femoral); Fitzgibbons RJ et al., JAMA — Watchful waiting vs repair of inguinal hernia in minimally symptomatic men."},{"v":"Vol. I","c":8,"n":1,"g":"A","s":["O triângulo de Calot é estrutura anatômica primordial na realização da colecistectomia. A respeito desse marco anatômico, marque a alternativa correta:"],"a":{"A":"A artéria cística, que atravessa obliquamente esse triângulo, origina-se da artéria hepática direita na maioria dos pacientes","B":"O triângulo é formado por 3 estruturas biliares: ducto cístico, colédoco e ducto hepático direito","C":"O linfonodo da vesícula biliar (Mascagni) localiza-se posteriormente à vesícula, longe da artéria cística e do triângulo","D":"A artéria hepática direita passa anteriormente ao colédoco e forma a base do trígono de Calot"},"ok":"A artéria cística origina-se da artéria hepática direita em aproximadamente 80 a 90% das pessoas e cruza o triângulo hepatocístico obliquamente para alcançar a vesícula. Identificá-la corretamente dentro do triângulo é o passo que previne a lesão vascular e biliar durante a colecistectomia.","w":{"B":"Erra a composição. O triângulo de Calot original é delimitado pelo ducto cístico (inferolateral), pelo ducto hepático comum (medial) e pela artéria cística (superior). Na versão modernamente usada em cirurgia — o triângulo hepatocístico —, o limite superior é a borda inferior do fígado, não a artéria. Em nenhuma das versões o colédoco ou o ducto hepático direito participam.","C":"Inverte a topografia. O linfonodo de Mascagni (ou linfonodo de Calot) situa-se dentro do triângulo, tipicamente anterior à artéria cística — é, inclusive, referência cirúrgica útil, pois a artéria costuma passar logo atrás dele.","D":"A artéria hepática direita passa posteriormente ao ducto hepático comum, e não forma a base do triângulo. Sua proximidade é justamente o que a torna vulnerável a lesão quando a dissecção é feita fora do plano correto."},"p":["Critical View of Safety (visão crítica de segurança de Strasberg), obrigatória antes de clipar qualquer estrutura: (1) triângulo hepatocístico limpo de gordura e tecido fibroso; (2) terço inferior da vesícula descolado do leito hepático; (3) apenas duas estruturas entrando na vesícula — o ducto cístico e a artéria cística."],"f":"Sabiston, 21ª ed., cap. 54 (Sistema biliar); Strasberg SM — Avoidance of biliary injury during laparoscopic cholecystectomy, J Hepatobiliary Pancreat Surg."},{"v":"Vol. I","c":8,"n":2,"g":"B","s":["A doença litiásica biliar associa-se a agravos como colecistite, colangite, abscesso hepático e pancreatite. Considerando uma paciente sadia de 40 anos, portadora","assintomática de cálculo único de 1,0 cm na vesícula, qual a melhor conduta?"],"a":{"A":"Observação e acompanhamento com USG anual","B":"Programar cirurgia eletiva pelo baixo risco","C":"Na primeira crise, fazer antibióticos e operar depois","D":"Operar em caso de colangite ou colecistite"},"ok":"O gabarito adotado indica a colecistectomia eletiva, sob o argumento de que se trata de paciente jovem, hígida e de baixo risco cirúrgico, com longa expectativa de vida e, portanto, alta probabilidade cumulativa de vir a se tornar sintomática. É importante conhecer a nuance: para a maioria das diretrizes, a colelitíase assintomática não tem indicação cirúrgica de rotina, pois apenas 1 a 2% dos portadores desenvolvem sintomas por ano. As exceções em que se opera o assintomático são: cálculo > 3 cm, vesícula em porcelana, pólipo associado > 1 cm, anemias hemolíticas, transplantados, candidatos a cirurgia bariátrica e populações com alta incidência de câncer de vesícula.","w":{"A":"É a conduta defendida pela maioria das diretrizes internacionais para colelitíase assintomática. A banca considerou a cirurgia preferível pelo perfil da paciente, mas vale registrar a divergência.","C":"Contradiz a lógica da questão: a paciente é assintomática, e a alternativa pressupõe esperar a crise. Além disso, cólica biliar simples não requer antibiótico.","D":"Postergar até a complicação é justamente o oposto da conduta preventiva — e ambas (colangite e colecistite) são complicações que se deseja evitar."},"p":["Guarde a lista de exceções que obrigam a operar o assintomático: cálculo > 3 cm, vesícula em porcelana (calcificada), pólipo > 1 cm,","anemia falciforme ou esferocitose (sobretudo se for fazer esplenectomia), pré-transplante, e cirurgia bariátrica concomitante em alguns protocolos."],"f":"Sabiston, 21ª ed., cap. 54; SAGES Guidelines for the Clinical Application of Laparoscopic Biliary Tract Surgery; Tokyo Guidelines 2018.","rv":"O gabarito diverge das diretrizes para colelitíase assintomática (em geral, observar; exceções específicas)."},{"v":"Vol. I","c":8,"n":3,"g":"B","s":["As doenças biliares são um dos problemas cirúrgicos mais frequentes. Assinale o paciente que você, como generalista, priorizaria para avaliação de um cirurgião."],"a":{"A":"Paciente de 92 anos, DPOC, ICC, assintomático da vesícula, cujo USG de rotina mostrou vesícula de paredes finas com cálculo único de 0,3 cm","B":"Paciente de 32 anos, hígida, com dor biliar constante há semanas, cujo USG mostrou vesícula de paredes espessadas com cálculo de 1 cm impactado em infundíbulo","C":"Paciente de 50 anos, asmática, com dor tipo queimação retroesternal, cujo USG mostrou vesícula de paredes finas e cálculo único móvel de 0,8 cm","D":"Paciente de 42 anos, HAS/DM, assintomático, cujo USG de rotina mostrou vesícula com cálculos"},"ok":"A alternativa B reúne todos os elementos que caracterizam doença biliar sintomática e complicada: paciente jovem e hígida (baixo risco cirúrgico), dor biliar persistente por semanas (não mais cólica intermitente), parede vesicular espessada (sinal inflamatório) e cálculo impactado no infundíbulo — situação que impede o esvaziamento e mantém a inflamação. É a que mais se beneficia e com maior urgência.","w":{"A":"Paciente muito idosa, com DPOC e ICC (risco cirúrgico elevado), assintomática, com cálculo pequeno e vesícula normal. Não há indicação de cirurgia: o risco do procedimento supera largamente o risco da doença.","C":"A descrição da dor — \"queimação retroesternal\" — é típica de doença do refluxo gastroesofágico, não de dor biliar. O cálculo é achado incidental, com vesícula normal e cálculo móvel. Investigar o esôfago, não a vesícula.","D":"Colelitíase assintomática em paciente sem fatores de risco adicionais. Não é prioridade cirúrgica."},"p":["Dor biliar típica: dor intensa e constante (apesar do nome \"cólica\"), em hipocôndrio direito ou epigástrio, irradiada para dorso ou escápula direita, com duração de 30 minutos a algumas horas, frequentemente pós-prandial e associada a náuseas."],"f":"Sabiston, 21ª ed., cap. 54; SAGES Guidelines."},{"v":"Vol. I","c":8,"n":4,"g":"C","s":["Com relação ao tratamento da colecistite aguda, assinale o que for verdadeiro:"],"a":{"A":"A colecistostomia percutânea trans-hepática foi opção terapêutica no passado, mas não tem mais indicação na era da laparoscopia","B":"O tratamento conservador com antibióticos, repouso intestinal e cirurgia em segundo tempo reduz a inflamação local e as chances de lesão de via biliar","C":"A colecistectomia videolaparoscópica é o tratamento padrão-ouro, sem necessidade de antibioticoterapia pós-operatória na maioria dos casos","D":"A colecistectomia aberta foi opção terapêutica no passado, mas não tem mais indicação na era da laparoscopia"},"ok":"A colecistectomia videolaparoscópica precoce (idealmente nas primeiras 72 horas, aceitável em até 7 dias do início dos sintomas) é o padrão-ouro para colecistite aguda graus I e II. Uma vez removida a vesícula com controle do foco, a antibioticoterapia pode ser interrompida em até 24 horas de pós- operatório na maioria dos casos — não há benefício em prolongá-la.","w":{"A":"Contém um absoluto e é falsa. A colecistostomia percutânea mantém indicação clara: pacientes de altíssimo risco cirúrgico ou em choque, em quem a colecistite grau III precisa de drenagem do foco sem a agressão da cirurgia. É medida de resgate e ponte.","B":"Este era o paradigma antigo (\"esfriar e operar depois\"). Ensaios randomizados (como o estudo ACDC) demonstraram o contrário: a cirurgia precoce reduz tempo de internação, custo e complicações, sem aumentar a taxa de lesão de via biliar ou de conversão.","D":"Outro absoluto e igualmente falso. A colecistectomia aberta permanece indicada quando a laparoscopia é inviável ou insegura: aderências extensas, cirrose com hipertensão portal, suspeita de câncer de vesícula, instabilidade que não tolera pneumoperitônio, e, sobretudo, como conversão diante de anatomia não identificável."},"p":["Padrão de prova: alternativas com \"não tem mais indicação\", \"sempre\", \"nunca\" e \"proscrito\" são quase invariavelmente falsas. Interseção: a duração do antibiótico na colecistite reaparece no Caso 3, questões 2 e 10."],"f":"Tokyo Guidelines 2018 (TG18) — flowchart for the management of acute cholecystitis; Gutt CN et al., Ann Surg — ACDC trial (Acute Cholecystitis: early laparoscopic surgery vs antibiotic therapy and delayed elective cholecystectomy); Sabiston, 21ª ed., cap. 54."},{"v":"Vol. I","c":8,"n":5,"g":"B","s":["Em relação à fisiopatologia da colecistite aguda, qual a principal enzima envolvida?"],"a":{"A":"Tirosina-quinase","B":"Fosfolipase A2","C":"5-Nucleotidase","D":"Aldeído desidrogenase"},"ok":"A cadeia fisiopatológica é: obstrução do ducto cístico pelo cálculo → estase e distensão da vesícula → lesão da mucosa → liberação de fosfolipase A2 pela própria mucosa vesicular. A enzima converte a lecitina biliar em lisolecitina, um potente detergente que agride a camada mucosa e desencadeia a inflamação química. Só posteriormente ocorre a colonização bacteriana secundária — daí o conceito de que a colecistite aguda começa química e se torna infecciosa.","w":{"A":"Tirosina-quinases são enzimas de sinalização celular, com papel central em oncologia (alvo de imatinibe em GIST, por exemplo), sem relação com a colecistite.","C":"A 5-nucleotidase é um marcador laboratorial de colestase, usado para confirmar que uma fosfatase alcalina elevada tem origem hepatobiliar e não óssea. É marcador, não mediador.","D":"A aldeído desidrogenase participa do metabolismo do etanol, sem relação com a via biliar."},"p":["Sequência para memorizar: obstrução do cístico → estase → fosfolipase A2 → lecitina vira lisolecitina → inflamação química → infecção bacteriana secundária (E. coli, Klebsiella, Enterococcus)."],"f":"Sabiston, 21ª ed., cap. 54; Tokyo Guidelines 2018 — pathophysiology of acute cholecystitis."},{"v":"Vol. I","c":8,"n":6,"g":"B","s":["Mulher de 42 anos chega ao hospital com dor em hipocôndrio direito, calafrios e icterícia há 48 horas. Nas últimas 6 horas evoluiu com sonolência e queda dos níveis pressóricos. FC 120 bpm, PA 100×50 mmHg, T 38,7 °C. Abdome doloroso em todo o andar superior, mais intenso à direita. USG à beira do leito: dilatação de vias biliares e cálculo de 1,0 cm no colédoco distal. Persiste com taquicardia e nível de consciência alterado. A conduta mais apropriada é:"],"a":{"A":"Iniciar antibioticoterapia profilática e internação em UTI","B":"Internação em UTI, antibioticoterapia, realização de CPRE de emergência para drenagem da via biliar e, se possível, extração do cálculo","C":"Laparotomia com colecistectomia, exploração da via biliar, retirada do cálculo e internação em UTI","D":"Internação em UTI, antibioticoterapia e drenagem percutânea, guiada por ultrassonografia, da vesícula biliar"},"ok":"A paciente tem a pêntade de Reynolds completa: dor em hipocôndrio direito, icterícia e febre (tríade de Charcot) somadas a hipotensão e alteração do estado mental. Isso caracteriza colangite aguda grave (grau III), com disfunção orgânica. O tratamento tem três pilares simultâneos: suporte em UTI, antibioticoterapia de amplo espectro e, o mais importante, drenagem biliar urgente — que, com cálculo no colédoco distal, é feita por CPRE com papilotomia e extração.","w":{"A":"Está incompleta e usa o termo errado. Aqui o antibiótico é terapêutico, não profilático. E sobretudo: sem drenar a via biliar obstruída, o antibiótico não alcança o foco sob pressão e a paciente evolui para choque refratário.","C":"Cirurgia aberta com exploração de via biliar em paciente séptica e instável é conduta de altíssima morbimortalidade. A drenagem endoscópica é menos invasiva, mais rápida e igualmente eficaz para descomprimir. A colecistectomia fica para um segundo tempo, após a resolução do quadro.","D":"A drenagem percutânea da vesícula (colecistostomia) não resolve o problema: a obstrução está no colédoco. Drenar a vesícula não descomprime a árvore biliar acima da obstrução. Se a CPRE não fosse possível, a alternativa seria drenagem trans-hepática percutânea da via biliar (PTBD), não da vesícula."},"p":["Tríade de Charcot (dor + febre + icterícia) = colangite. Pêntade de Reynolds (+ hipotensão + confusão) = colangite grave, com indicação de drenagem de emergência. A colangite é uma das poucas situações em cirurgia geral em que a descompressão do foco tem urgência comparável à do choque séptico de origem abdominal."],"f":"Tokyo Guidelines 2018 — diagnostic criteria and severity grading of acute cholangitis, e flowchart for management; Sabiston, 21ª ed., cap. 54."},{"v":"Vol. I","c":8,"n":7,"g":"D","s":["Analise o sistema de classificação de lesões das vias biliares ilustrado a seguir. Esse sistema representa a classificação de:"],"a":{"A":"Hannover","B":"Bismuth","C":"Stewart-Way","D":"Strasberg"},"ok":"A ilustração corresponde à classificação de Strasberg, reconhecível pelos tipos designados por letras de A a E, com o tipo E subdividido de E1 a E5. É a classificação mais usada para lesões de via biliar após colecistectomia laparoscópica, justamente por contemplar as fístulas e lesões periféricas que a classificação anterior não cobria.","w":{"A":"A classificação de Hannover é mais recente e detalhada, incorporando o acometimento vascular associado, mas usa nomenclatura diferente (tipos A a E com subdivisões numéricas próprias) e não é a ilustrada.","B":"A classificação de Bismuth é anterior e classifica apenas as estenoses da via biliar principal, por níveis numerados de I a V conforme a distância da confluência dos hepáticos. Ela corresponde, grosso modo, ao tipo E de Strasberg subdividido.","C":"A classificação de Stewart-Way agrupa as lesões por mecanismo de ocorrência durante a laparoscopia (classes I a IV), sendo mais útil para análise de causa do que para descrição anatômica."},"p":["Strasberg em resumo: A = fístula do cístico ou de ductos acessórios (ductos de Luschka); B = oclusão de ducto hepático direito aberrante; C = secção de ducto aberrante com fístula; D = lesão lateral da via biliar principal, sem perda de continuidade; E1–E5 = secção completa da via biliar principal em níveis progressivamente mais altos (corresponde a Bismuth I–V)."],"f":"Strasberg SM, Hertl M, Soper NJ — An analysis of the problem of biliary injury during laparoscopic cholecystectomy, J Am Coll Surg 1995; Sabiston, 21ª ed., cap. 54."},{"v":"Vol. I","c":8,"n":8,"g":"A","s":["A avaliação do risco de coledocolitíase sempre deve ser realizada antes de se operar um paciente por cálculos da vesícula biliar. Qual dos pacientes abaixo se beneficiaria de uma colangiorressonância pré-operatória?"],"a":{"A":"Homem, 65 anos, cólica biliar recorrente há muitos anos, sem história de icterícia pregressa, fosfatase alcalina e gama-GT aumentadas, TGO e TGP tocadas","B":"Mulher, 35 anos, 1 episódio de cólica biliar, passado de icterícia durante gestação há 2 anos","C":"Homem, 42 anos, passado recente de pancreatite biliar leve, no momento com hepatograma normal","D":"Mulher, 55 anos, com colecistite aguda, TGO e TGP levemente aumentadas, fosfatase alcalina e gama normais"},"ok":"A colangiorressonância (ou a ecoendoscopia, ou ainda a colangiografia intraoperatória) é o exame do risco intermediário. O paciente da alternativa A tem alteração atual e persistente das enzimas canaliculares (fosfatase alcalina e gama-GT elevadas), o que configura preditor de coledocolitíase sem, contudo, atingir os critérios de risco alto — não há cálculo visualizado no colédoco, colangite nem bilirrubina acima de 4. É exatamente a faixa em que se investiga antes de operar.","w":{"B":"Um único episódio de cólica biliar e icterícia gestacional há dois anos (provavelmente colestase da gravidez) caracterizam risco baixo. A conduta é colecistectomia direta, sem investigação prévia da via biliar.","C":"Pancreatite biliar é preditor de risco, mas o enunciado especifica que o episódio já se resolveu e o hepatograma está normal no momento — o cálculo migrou e passou. Risco baixo a intermediário-baixo; a conduta usual é colecistectomia com colangiografia intraoperatória, não colangiorressonância prévia.","D":"Elevação isolada e leve de transaminases na vigência de colecistite aguda é achado inespecífico, atribuível à inflamação perivesicular. Com fosfatase alcalina e gama-GT normais, não há indicativo de obstrução do colédoco. Risco baixo."},"p":["Estratificação (ASGE): risco alto — cálculo visualizado no colédoco à USG, colangite aguda, ou bilirrubina total > 4 mg/dL com colédoco dilatado → CPRE direto. Risco intermediário — colédoco dilatado (> 6 mm com vesícula in situ), bilirrubina 1,8–4, enzimas canaliculares alteradas, idade > 55 anos, pancreatite biliar → colangioRM, ecoendoscopia ou colangiografia intraoperatória. Risco baixo — nenhum preditor → colecistectomia direta."],"f":"ASGE Guideline — The role of endoscopy in the evaluation of suspected choledocholithiasis (atualização 2019); Sabiston, 21ª ed., cap. 54."},{"v":"Vol. I","c":8,"n":9,"g":"D","s":["Mulher de 57 anos, submetida a colecistectomia eletiva por litíase há 48 h, com passado de várias crises e dois internamentos por colecistite aguda. Evoluiu com dor em hipocôndrio direito, icterícia e um pico febril. Realizou o exame apresentado. Qual o exame realizado e o diagnóstico provável?"],"a":{"A":"TC e síndrome de Mirizzi","B":"CPRE e cálculo do hepático comum","C":"Colecistograma oral e tumor de Klatskin","D":"RNM e lesão iatrogênica Bismuth III"},"ok":"A imagem é uma colangiorressonância, reconhecível pela representação da árvore biliar em alto sinal sobre fundo escuro, sem cateter ou contraste endoscópico. O contexto clínico é decisivo: colecistectomia difícil (múltiplas crises prévias, dois episódios de colecistite, portanto fibrose e anatomia distorcida) seguida, em 48 horas, de dor, icterícia e febre. Esse é o quadro de lesão iatrogênica de via biliar, e o padrão apresentado corresponde a lesão alta, na confluência — Bismuth III.","w":{"A":"A síndrome de Mirizzi é a compressão do ducto hepático comum por cálculo impactado no infundíbulo ou no cístico — um diagnóstico pré- operatório, não uma complicação que surge 48 h após a retirada da vesícula.","B":"A CPRE tem aparência característica muito distinta, com o endoscópio visível e o contraste injetado retrogradamente. Além disso, cálculo residual no hepático comum não explicaria bem o quadro imediato em paciente cuja vesícula acabou de ser removida.","C":"O colecistograma oral é exame obsoleto há décadas — e não teria como opacificar uma vesícula que já foi retirada. O tumor de Klatskin, por sua vez, é doença de instalação insidiosa, incompatível com surgimento em 48 horas."},"p":["Sinais de alerta para lesão de via biliar no pós-operatório precoce de colecistectomia: dor persistente desproporcional, icterícia, febre, drenagem biliar pelo dreno ou pela ferida, e íleo prolongado. Investigar cedo: quanto mais precoce o reconhecimento, melhor o resultado da reconstrução. Bismuth: I — coto > 2 cm abaixo da confluência; II — coto < 2 cm; III — na confluência, com comunicação entre os hepáticos preservada; IV — confluência destruída, hepáticos separados; V — lesão de ducto direito aberrante."],"f":"Sabiston, 21ª ed., cap. 54; Strasberg SM — Biliary injury in laparoscopic surgery; Bismuth H — Postoperative strictures of the bile duct."},{"v":"Vol. I","c":8,"n":10,"g":"B","s":["Paciente de 45 anos, com dor abdominal em hipocôndrio direito associada a vômitos, em crises, com passado recente de icterícia há 3 meses. Traz exames do momento em que estava ictérico: BT 2,1; BD 1,8; FA 800; GGT 900; TGO 200; TGP 100. No momento encontra-se assintomático. Qual a melhor conduta?"],"a":{"A":"Colecistectomia com colangiografia trans-operatória de imediato","B":"Fazer novo hepatograma; se normal, realizar colecistectomia apenas","C":"Colangiorressonância","D":"CPRE"},"ok":"O ponto central é o tempo: as alterações laboratoriais são de três meses atrás, e o paciente está assintomático agora. Isso sugere fortemente que um cálculo migrou pelo colédoco e foi eliminado espontaneamente — fenômeno frequente, já que a maioria dos cálculos pequenos passa pela papila. A conduta racional é reavaliar o hepatograma atual: se estiver normal, o paciente foi reclassificado como risco baixo e pode ir direto para a colecistectomia.","w":{"A":"Colangiografia intraoperatória seria a escolha se o hepatograma atual permanecesse alterado (risco intermediário). Indicá-la \"de imediato\" pula a etapa de reestratificação, que custa um exame de sangue.","C":"Colangiorressonância é o exame do risco intermediário — mas só se sabe se ele ainda está nessa faixa após o novo hepatograma. Pedir a ressonância antes é gastar recurso caro sem reestratificar.","D":"CPRE é reservada ao risco alto, e é procedimento invasivo com risco de pancreatite pós-CPRE de 3 a 5%. Indicá-la com base em exames de três meses atrás, em paciente assintomático, é inaceitável — CPRE puramente diagnóstica está proscrita."},"p":["Princípio que a banca cobra: CPRE não é exame diagnóstico. Ela é terapêutica. Diagnóstico de coledocolitíase se faz com colangioRM, ecoendoscopia ou colangiografia intraoperatória."],"f":"ASGE Guideline — suspected choledocholithiasis; Sabiston, 21ª ed., cap. 54."},{"v":"Vol. I","c":8,"n":11,"g":"B","s":["Mulher de 65 anos com icterícia, febre e dor em hipocôndrio direito irradiando para o dorso. Laboratório: bilirrubina total elevada, leucocitose e enzimas hepáticas alteradas. USG evidencia dilatação do colédoco com cálculo impactado distalmente. Qual das seguintes afirmações é a mais correta?"],"a":{"A":"Este quadro é classicamente descrito como tríade de Charcot e indica colecistite aguda litiásica","B":"A presença de icterícia e febre sugere colangite ascendente; a intervenção imediata com CPRE é indicada em casos graves","C":"A dor em hipocôndrio direito isolada é suficiente para o diagnóstico","D":"O quadro descrito dispensa antibioticoterapia"},"ok":"A tríade de Charcot — dor, febre e icterícia — associada a colédoco dilatado com cálculo impactado define colangite aguda. O tratamento tem três componentes: suporte, antibioticoterapia e drenagem biliar. A CPRE com papilotomia e extração do cálculo é o método de escolha, com urgência proporcional à gravidade (imediata nos graus III, em até 24–48 h nos graus II).","w":{"A":"Contém um acerto e um erro fatal. A tríade de Charcot está corretamente nomeada, mas ela indica colangite, não colecistite. Colecistite cursa com dor e febre, mas sem icterícia (a menos que haja Mirizzi ou coledocolitíase associada) e sem dilatação do colédoco.","C":"Dor isolada em hipocôndrio direito tem diferencial amplíssimo — cólica biliar, colecistite, hepatite, úlcera, pleurite, pielonefrite. Não fecha diagnóstico algum sozinha.","D":"A colangite é infecção da árvore biliar sob pressão, com alto risco de bacteremia e choque séptico. Dispensar antibiótico seria conduta gravíssima."},"p":["Diferencial rápido: cólica biliar = dor sem febre e sem alteração laboratorial. Colecistite = dor + febre + Murphy, sem icterícia. Colangite = dor + febre + icterícia, com colédoco dilatado. Pancreatite biliar = dor irradiada em faixa + lipase ≥ 3× o normal."],"f":"Tokyo Guidelines 2018; Sabiston, 21ª ed., cap. 54."},{"v":"Vol. I","c":8,"n":12,"g":"C","s":["Sobre os critérios de Tóquio (Tokyo Guidelines) utilizados para diagnóstico de colecistite aguda, assinale a alternativa correta:"],"a":{"A":"O diagnóstico definitivo requer apenas evidência de inflamação sistêmica, como febre e leucocitose","B":"Os critérios de Tóquio classificam a colecistite aguda em leve, moderada e grave, com base apenas em achados laboratoriais","C":"O diagnóstico clínico é confirmado pela presença de sinais sistêmicos de inflamação, dor no quadrante superior direito e achados de imagem compatíveis","D":"A classificação de gravidade grau III corresponde a casos com colelitíase assintomática e boa resposta ao tratamento clínico"},"ok":"O diagnóstico definitivo pelas Tokyo Guidelines exige a combinação de três domínios: (A) sinais locais de inflamação — sinal de Murphy, dor, massa ou defesa em hipocôndrio direito; (B) sinais sistêmicos de inflamação — febre, PCR elevada, leucocitose; (C) achados de imagem característicos. Diagnóstico suspeito requer um item de A e um de B; definitivo requer A + B + C.","w":{"A":"Insuficiente. Sinais sistêmicos isolados não distinguem colecistite de dezenas de outras infecções. É preciso o componente local e a imagem.","B":"Erra ao dizer \"apenas achados laboratoriais\". A graduação é clínico- laboratorial e de imagem, baseada sobretudo em disfunção orgânica e na intensidade da inflamação local — não em laboratório isolado.","D":"Inverte completamente. O grau III é o mais grave, definido pela presença de disfunção orgânica: cardiovascular (necessidade de vasopressor), neurológica, respiratória, renal, hepática (INR > 1,5) ou hematológica (plaquetas < 100.000). Colelitíase assintomática não é nem colecistite."},"p":["Graus: I (leve) — paciente hígido, inflamação local discreta, sem disfunção orgânica → colecistectomia laparoscópica precoce. II (moderada) — leucócitos > 18.000, massa palpável, sintomas > 72 h, ou inflamação local acentuada (gangrena, abscesso, peritonite biliar) → colecistectomia precoce em serviço experiente. III (grave) — disfunção orgânica → suporte, antibiótico e, conforme a resposta, drenagem percutânea ou cirurgia."],"f":"Tokyo Guidelines 2018 (TG18) — diagnostic criteria and severity grading for acute cholecystitis, J Hepatobiliary Pancreat Sci; Sabiston, 21ª ed., cap. 54."},{"v":"Vol. I","c":8,"n":13,"g":"A","s":["Paciente do sexo feminino, 28 anos, com colecistite aguda diagnosticada pela clínica de dor em hipocôndrio direito, anictérica e com Murphy positivo. Passado de dois partos normais. Nega diabetes e HAS. Nega tabagismo e etilismo. Podemos escolher alguns exames que são essenciais para a cirurgia:"],"a":{"A":"USG, transaminases e gamaglutamiltransferase","B":"USG, bilirrubinas e coagulograma","C":"USG, parecer cardiológico e hemograma","D":"Hemograma, bilirrubina e coagulograma"},"ok":"O propósito dos exames aqui é duplo: confirmar o diagnóstico (ultrassonografia) e estratificar o risco de coledocolitíase, que é a informação que muda a conduta cirúrgica. Para isso servem as enzimas canaliculares — gama-GT e fosfatase alcalina — e as transaminases. Em paciente jovem, hígida e assintomática do ponto de vista cardiovascular, nada além disso é essencial.","w":{"B":"A ultrassonografia está certa, mas o coagulograma não é exame de rotina — só se justifica com história de sangramento, hepatopatia ou uso de anticoagulante, nenhum presente aqui. Mesmo raciocínio da questão 8 do Caso 1.","C":"Parecer cardiológico em paciente de 28 anos, hígida e assintomática, é completamente desnecessário e apenas atrasaria a cirurgia.","D":"Omite a ultrassonografia, que é o exame diagnóstico fundamental, e inclui novamente o coagulograma desnecessário."},"p":["A USG é o exame inicial de escolha para colecistite: sensibilidade acima de 90% para cálculos, e os achados de colecistite são espessamento parietal > 4 mm, líquido perivesicular, distensão vesicular e sinal de Murphy ultrassonográfico."],"f":"Tokyo Guidelines 2018; ASGE Guideline — suspected choledocholithiasis; Sabiston, 21ª ed., cap. 54."},{"v":"Vol. I","c":8,"n":14,"g":"D","s":["Manoel, 60 anos, sem comorbidades, agendado para colecistectomia videolaparoscópica, com jejum prescrito desde as 22 h do dia anterior. Às 10 h do dia da cirurgia ingeriu 300 mL de leite puro, inadvertidamente. Foi encaminhado ao bloco cirúrgico às 12 h. Qual a conduta mais apropriada?"],"a":{"A":"Cancelar a cirurgia e reagendar para o dia seguinte, respeitando pelo menos 12 h de jejum","B":"Realizar a anestesia e a cirurgia normalmente às 12 h, sem protocolos especiais para intubação","C":"Realizar intubação com paciente acordado, considerando estômago cheio","D":"Aguardar completar 6 horas de jejum para realização do procedimento"},"ok":"O leite não é líquido claro. Por conter gordura e proteína, seu esvaziamento gástrico é lento e ele se enquadra na regra dos sólidos e refeições leves: 6 horas. Como a ingestão ocorreu às 10 h, o jejum se completa às 16 h. A conduta correta e mais simples é adiar o procedimento algumas horas dentro do mesmo dia — não é necessário cancelar nem recorrer a técnicas de exceção.","w":{"A":"Cancelar e reagendar é desproporcional: bastam 6 horas, obtidas no mesmo dia. E 12 horas de jejum contrariam frontalmente as diretrizes de jejum abreviado.","B":"Operar com 2 horas após ingestão de leite significa estômago cheio, com risco relevante de regurgitação e broncoaspiração (síndrome de Mendelson). Inaceitável em cirurgia eletiva, em que não há urgência que justifique o risco.","C":"Intubação acordado ou sequência rápida com pressão cricoide são estratégias para cirurgia de urgência em paciente de estômago cheio, quando não se pode esperar. Em cirurgia eletiva, a solução é simplesmente aguardar."},"p":["Regra do jejum pré-operatório (ASA/ACERTO): líquidos claros 2 h; leite materno 4 h; fórmula infantil, leite não humano e refeição leve 6 h; refeição gordurosa ou copiosa 8 h. Líquido claro = translúcido, sem gordura e sem resíduo: água, chá, café sem leite, suco coado, bebida com maltodextrina. Leite de qualquer origem não entra nessa categoria."],"f":"ASA Practice Guidelines for Preoperative Fasting (atualização 2023); Projeto ACERTO; Sabiston, 21ª ed., cap. 14."},{"v":"Vol. I","c":8,"n":15,"g":"C","s":["Mulher de 42 anos, na emergência com dor em cólica e vômitos há 3 dias, com piora nas últimas 24 h. Febre baixa e urina escura. Ao exame: estado geral regular, desidratada, FC 92, PA 100×70, T 37,8 °C, ictérica. Abdome globoso, doloroso em toda a metade superior, principalmente em flanco direito, sem irritação peritoneal, RHA hipoativos. Hb 11, Ht 32%, BT 2,7 (BD 1,9), leucócitos 12.000 com 5 bastões. USG: vesícula de paredes espessadas e edemaciada, com pequenos cálculos, dilatação de vias biliares; pâncreas pouco visualizado. Colangiorressonância revelou dilatação do colédoco com falha de enchimento na porção terminal. Qual a melhor conduta neste momento?"],"a":{"A":"Colecistectomia videolaparoscópica","B":"Colecistectomia aberta","C":"Colangiopancreatografia endoscópica retrógrada","D":"Hidratação e antibioticoterapia para diminuir a inflamação"},"ok":"A colangiorressonância já confirmou a coledocolitíase — a \"falha de enchimento na porção terminal do colédoco\" é o cálculo. Com o diagnóstico estabelecido e via biliar obstruída em paciente ictérica e com sinais inflamatórios, a conduta é a CPRE com papilotomia e extração do cálculo, desobstruindo a via biliar. A colecistectomia é realizada em um segundo tempo, idealmente na mesma internação.","w":{"A":"A colecistectomia isolada retiraria a vesícula, mas deixaria o cálculo no colédoco — a icterícia e o risco de colangite persistiriam. A sequência correta é desobstruir primeiro.","B":"Além do mesmo problema da alternativa A, a via aberta não se justifica: não há instabilidade, anatomia proibitiva nem falha de outra abordagem. Poderia ser cogitada uma colecistectomia com exploração do colédoco, mas a CPRE é menos invasiva e resolve o problema imediato.","D":"Hidratação e antibiótico são medidas de suporte necessárias, mas insuficientes: não removem o cálculo nem descomprimem a via biliar. Manter obstrução tratada apenas clinicamente é o caminho para a colangite grave."},"p":["Sequência clássica da coledocolitíase confirmada: CPRE → colecistectomia laparoscópica na mesma internação. A alternativa é a abordagem em um tempo (colecistectomia com exploração laparoscópica do colédoco), que exige expertise e instrumental específicos."],"f":"ASGE Guideline — suspected choledocholithiasis; Tokyo Guidelines 2018; Sabiston, 21ª ed., cap. 54."},{"v":"Vol. II","c":9,"n":1,"g":"A","s":["Sobre diagnóstico e estadiamento da pancreatite aguda, julgue: I. Os sinais de Cullen e Grey-Turner são bastante frequentes e patognomônicos de pancreatite aguda grave. II. Quanto mais grave a PA, maiores são os níveis de amilase e lipase sanguíneas. III. A obesidade, conforme modificação do APACHE (APACHE-O), entrou como variável, tendo o obeso maior potencial de gravidade. IV. Os níveis de PCR são facilmente disponíveis e se elevam com a gravidade da doença, sendo mais úteis 48 h após o início dos sintomas. V. Devido à importância do escore de Balthazar, todos os pacientes com PA devem ser submetidos a TC de abdome com contraste venoso."],"a":{"A":"F, F, V, V, F","B":"F, F, V, F, V","C":"V, F, V, V, V","D":"V, V, F, F, F"},"ok":"A sequência correta é F, F, V, V, F. (I) Falsa — Cullen (equimose periumbilical) e Grey-Turner (equimose de flanco) são raros (menos de 3% dos casos), tardios (24–48 h) e não são patognomônicos: aparecem também em ruptura de aneurisma de aorta, gravidez ectópica rota e trauma retroperitoneal. (II) Falsa — este é o erro mais importante do caso: o nível de amilase e lipase não guarda correlação com a gravidade. Servem para diagnóstico (lipase ≥ 3× o limite superior), jamais para prognóstico. (III) Verdadeira — o APACHE-O acrescenta pontos por IMC elevado, pois a obesidade aumenta o risco de necrose e de falência orgânica. (IV) Verdadeira — a PCR é barata, disponível e prognóstica, com melhor desempenho às 48 horas (valores > 150 mg/L indicam gravidade). (V) Falsa — a TC não é indicada de rotina nem no início do quadro; deve ser reservada para dúvida diagnóstica ou, sobretudo, após 72 horas a 4 dias, quando a necrose já se delimitou e a imagem se torna informativa.","w":{"B":"Erra ao considerar falsa a IV (PCR) e verdadeira a V (TC para todos).","C":"Aceita como verdadeiras a I (Cullen/Grey-Turner patognomônicos) e a V (TC universal), ambas falsas.","D":"Aceita a I e a II, os dois erros clássicos, e nega as verdadeiras III e IV."},"p":["Diagnóstico de PA exige 2 de 3 critérios (Atlanta revisada): dor abdominal típica, lipase/amilase ≥ 3× o limite superior, e achados de imagem característicos. TC precoce subestima a necrose, porque ela leva 48–72 h para se estabelecer. Pedir TC no primeiro dia costuma ser um exame desperdiçado."],"f":"Atlanta Classification revisada (Banks PA et al., Gut 2013); Sabiston, 21ª ed., cap. 55 (Pâncreas exócrino); American College of Gastroenterology Guideline — Management of Acute Pancreatitis."},{"v":"Vol. II","c":9,"n":2,"g":"C","s":["Paciente alcoolista crônico é internado com queixa de dor epigástrica e empachamento. Traz a imagem tomográfica apresentada. Qual a melhor conduta terapêutica?"],"a":{"A":"Cirurgia de Puestow","B":"Cirurgia de Frey","C":"Drenagem endoscópica transgástrica","D":"Pancreatectomia corpo-caudal"},"ok":"A imagem mostra coleção cística volumosa em contato com a parede posterior do estômago, compatível com pseudocisto pancreático — o quadro clínico de alcoolista com dor epigástrica e empachamento (por compressão gástrica) fecha o diagnóstico. O tratamento de escolha para pseudocisto sintomático, maduro (parede bem definida, geralmente > 4–6 semanas) e com aposição à parede gástrica é a drenagem endoscópica transgástrica (cistogastrostomia endoscópica), preferencialmente guiada por ecoendoscopia.","w":{"A":"A cirurgia de Puestow (pancreatojejunostomia látero-lateral) é operação de drenagem ductal para pancreatite crônica com ducto principal dilatado, e não tratamento de pseudocisto.","B":"A cirurgia de Frey combina ressecção da cabeça pancreática com pancreatojejunostomia longitudinal — é operação para pancreatite crônica com dor refratária e massa inflamatória cefálica, não para pseudocisto.","D":"Pancreatectomia corpo-caudal é ressecção maior, com morbidade elevada e risco de diabetes, sem justificativa quando existe uma opção endoscópica minimamente invasiva e eficaz."},"p":["Pseudocisto: coleção com parede fibrosa madura, sem conteúdo sólido, que surge > 4 semanas após pancreatite aguda intersticial. Trata-se apenas se sintomático, infectado ou complicado — pseudocisto assintomático se acompanha, independentemente do tamanho."],"f":"Atlanta revisada (2013); Sabiston, 21ª ed., cap. 55; ASGE Guideline — endoscopic management of pancreatic fluid collections."},{"v":"Vol. II","c":9,"n":3,"g":"D","s":["Em relação ao tratamento da pancreatite crônica, assinale a alternativa correta:"],"a":{"A":"A suplementação enzimática pancreática está indicada apenas nos pacientes com dor abdominal persistente","B":"A abstinência alcoólica não influencia a evolução da doença após o surgimento da insuficiência exócrina","C":"A ressecção pancreática é indicada como primeira linha em todos os pacientes com calcificações difusas","D":"A dor abdominal refratária pode ser tratada com procedimentos endoscópicos ou cirurgia descompressiva"},"ok":"A dor é o principal problema clínico da pancreatite crônica e a principal indicação de intervenção. O tratamento é escalonado: analgesia e abstinência primeiro; depois, endoscopia (esfincterotomia pancreática, extração de cálculos, litotripsia, prótese ductal); e, na falha, cirurgia — descompressiva (Puestow), híbrida (Frey, Beger) ou ressectiva, conforme a anatomia.","w":{"A":"Inverte a indicação. A reposição de enzimas pancreáticas trata a insuficiência exócrina — esteatorreia, perda ponderal, deficiência de vitaminas lipossolúveis. Seu efeito sobre a dor é, no máximo, modesto e inconsistente.","B":"Falso e clinicamente relevante: a abstinência de álcool e tabaco reduz a frequência dos surtos, retarda a progressão da insuficiência e melhora a dor em qualquer estágio da doença.","C":"Contém dois erros. Calcificações difusas por si só não indicam cirurgia — muitos pacientes são oligossintomáticos. E, quando há indicação, a ressecção pancreática não é primeira linha: prioriza-se a descompressão ductal, que preserva parênquima e função endócrina."},"p":["Regra da escolha cirúrgica: ducto principal dilatado (≥ 7 mm) sem massa cefálica → Puestow (drenagem pura). Ducto dilatado com massa inflamatória na cabeça → Frey ou Beger (ressecção cefálica + drenagem). Doença limitada a corpo/cauda → pancreatectomia distal. Ducto fino, doença difusa, dor incapacitante → considerar pancreatectomia total com autotransplante de ilhotas."],"f":"Sabiston, 21ª ed., cap. 55; American Pancreatic Association / ACG Guidelines on Chronic Pancreatitis."},{"v":"Vol. II","c":9,"n":4,"g":"B","s":["Homem de 47 anos, dor epigástrica intensa iniciada há 8 horas, irradiando para o dorso, náuseas e vômitos. Etanol social; sem febre. PA 120×75, FC 104, SatO₂ 96%. Amilase 180 U/L (VN até 100), lipase 975 U/L (≥ 3× VN), AST/ALT discretamente elevadas. USG: vesícula com múltiplos cálculos; colédoco 6 mm, sem dilatação. Sem icterícia. Qual a conduta inicial mais apropriada nas primeiras 24 horas?"],"a":{"A":"Antibioticoprofilaxia rotineira para prevenir necrose infectada","B":"Reposição volêmica com cristaloide guiada por metas, analgesia e início precoce de nutrição enteral conforme tolerância","C":"Jejum absoluto e tomografia para avaliar gravidade","D":"CPRE e avaliar nutrição parenteral"},"ok":"Trata-se de pancreatite aguda biliar, sem sinais de colangite nem de obstrução (colédoco de 6 mm, sem icterícia). O tripé do tratamento inicial é: fluidoterapia com cristaloide balanceado guiada por metas (débito urinário, ureia, hematócrito) — hoje se prefere reposição moderada à agressiva, após o ensaio WATERFALL; analgesia adequada, inclusive com opioides; e nutrição enteral precoce, iniciada nas primeiras 24 a 48 horas conforme tolerância, que reduz translocação bacteriana, infecção e mortalidade.","w":{"A":"A antibioticoprofilaxia não é recomendada, nem mesmo na pancreatite necrosante estéril. Não previne necrose infectada e seleciona germes resistentes e fungos. Antibiótico só entra quando há infecção documentada ou fortemente suspeita.","C":"Duplo erro. O jejum absoluto prolongado é o paradigma antigo — a alimentação precoce é o padrão atual. E a TC nas primeiras horas subestima a necrose, sendo inútil para estratificar gravidade nesse momento.","D":"A CPRE de urgência só é indicada em pancreatite biliar com colangite associada ou obstrução biliar persistente. Este paciente não tem icterícia nem colédoco dilatado. Além disso, a via parenteral seria escolha errada com trato digestivo funcionante."},"p":["A colecistectomia deve ser realizada na mesma internação na pancreatite biliar leve — postergá-la expõe a recorrência em até 30% em algumas semanas."],"f":"Ensaio WATERFALL (de-Madaria E et al., N Engl J Med 2022) — reposição agressiva versus moderada; ACG Guideline — Acute Pancreatitis; IAP/APA evidence- based guidelines; Sabiston, 21ª ed., cap. 55."},{"v":"Vol. II","c":9,"n":5,"g":"B","s":["Homem de 59 anos, etilista prévio, com pancreatite crônica há 6 anos. Dor epigástrica intermitente, controlada com analgésicos comuns e enzimas pancreáticas. TC: calcificações difusas, ducto principal de 4 mm, sem dilatação significativa e sem obstrução biliar. Albumina 4 g/dL, glicemia de jejum 138 mg/dL. Qual das situações justifica indicação cirúrgica no contexto da pancreatite crônica?"],"a":{"A":"Presença de insuficiência exócrina isolada, mesmo sem dor ou obstrução anatômica","B":"Dor persistente e incapacitante, refratária ao tratamento clínico e endoscópico, associada a alterações anatômicas passíveis de correção","C":"Controle glicêmico inadequado devido a diabetes pancreatogênico","D":"Calcificações pancreáticas difusas em paciente assintomático"},"ok":"A indicação cirúrgica na pancreatite crônica é essencialmente funcional, não anatômica: opera-se a dor refratária e incapacitante que já falhou ao tratamento clínico e endoscópico, desde que exista uma alteração anatômica corrigível (ducto dilatado, cálculo intraductal, massa inflamatória cefálica, estenose). Nenhum achado de imagem, isoladamente, indica cirurgia.","w":{"A":"Insuficiência exócrina se trata com reposição enzimática oral. A cirurgia não a corrige — ao contrário, ressecções pancreáticas tendem a piorá-la.","C":"O diabetes pancreatogênico (tipo 3c) é tratado clinicamente, quase sempre com insulina. A cirurgia não o melhora e frequentemente o agrava, por remover mais parênquima produtor de ilhotas.","D":"Calcificações difusas em paciente assintomático são achado de imagem, não indicação cirúrgica. Operar um assintomático o exporia a morbidade sem benefício."},"p":["Outras indicações cirúrgicas na pancreatite crônica: obstrução biliar ou duodenal persistente, pseudoaneurisma, trombose de veia esplênica com hipertensão portal segmentar e sangramento por varizes gástricas, e a impossibilidade de excluir malignidade em massa cefálica."],"f":"Sabiston, 21ª ed., cap. 55; ACG Clinical Guideline — Chronic Pancreatitis; European (HaPanEU) guidelines."},{"v":"Vol. II","c":9,"n":6,"g":"C","s":["Homem de 47 anos com pancreatite crônica alcoólica, dor epigástrica diária há 3 anos, perda ponderal, múltiplas internações e dependência de opioides. CPRM e TC: ducto pancreático principal de 9 mm com cálculo intraductal; aumento inflamatório da cabeça pancreática (\"massa inflamatória\"), sem critérios de neoplasia, sem estenose duodenal ou biliar significativa. Tentativas endoscópicas prévias com litotripsia e prótese, sem alívio sustentado. Função endócrino-exócrina ainda parcialmente preservada. Qual a melhor opção cirúrgica visando controle da dor e","descompressão ductal?"],"a":{"A":"Pancreatoduodenectomia (Whipple) clássica","B":"Pancreatectomia caudal","C":"Ressecção-descompressão \"head-centered\" (técnicas tipo Frey/Beger)","D":"Pancreatectomia total com autotransplante de ilhotas"},"ok":"O caso reúne exatamente os dois elementos que definem a escolha: ducto principal dilatado (9 mm) com cálculo e massa inflamatória na cabeça do pâncreas. Uma drenagem pura (Puestow) não resolveria a massa cefálica, que é reconhecidamente o \"marca-passo da dor\". Uma ressecção maior sacrificaria função ainda preservada. As técnicas híbridas centradas na cabeça — Frey (escavação da cabeça + pancreatojejunostomia longitudinal) e Beger (ressecção cefálica com preservação duodenal) — resolvem ambos os problemas com preservação do duodeno, da via biliar e do parênquima remanescente. São as recomendadas nesse cenário.","w":{"A":"O Whipple clássico remove duodeno, antro, vesícula e via biliar distal em uma doença benigna — morbidade desproporcional. Reserva-se para quando não se pode excluir malignidade ou há estenose duodenal e biliar simultâneas.","B":"A pancreatectomia caudal remove justamente a porção não doente. A doença está na cabeça; ressecar corpo e cauda não trata a fonte da dor e agrava a insuficiência endócrina.","D":"A pancreatectomia total com autotransplante de ilhotas é opção de exceção: doença difusa com ducto fino (não drenável), dor incapacitante, após falha de todas as outras estratégias. Aqui o ducto está dilatado e a função ainda está preservada, o que a torna desproporcional."},"p":["Mnemônico das operações: Puestow = drenagem pura (ducto","dilatado, sem massa). Frey = escavação + drenagem (ducto dilatado + massa cefálica). Beger = ressecção cefálica com preservação duodenal. Whipple = ressecção completa da cabeça, quando há dúvida oncológica."],"f":"Sabiston, 21ª ed., cap. 55; Frey CF, Smith GJ — Description of an operation for chronic pancreatitis; Beger HG et al. — Duodenum-preserving pancreatic head resection."},{"v":"Vol. II","c":9,"n":7,"g":"B","s":["A colangiopancreatografia por ressonância magnética (CPRM) é indicada em pacientes com pancreatite aguda principalmente nos casos em que:"],"a":{"A":"Há suspeita de necrose pancreática infectada","B":"A etiologia permanece indefinida após a avaliação inicial","C":"Há necessidade de drenagem percutânea de coleções","D":"A classificação de Balthazar não pôde ser determinada"},"ok":"A CPRM é o exame de escolha para a investigação etiológica quando a avaliação inicial (história, álcool, ultrassonografia, triglicerídeos, cálcio, medicamentos) não esclarece a causa. Ela detecta microlitíase, coledocolitíase, anomalias como o pâncreas divisum e lesões neoplásicas ductais que possam ter precipitado o quadro.","w":{"A":"Necrose infectada se avalia por TC com contraste, que demonstra gás nas coleções, e se confirma por punção aspirativa quando necessário. A ressonância não é o exame dessa pergunta.","C":"Drenagens percutâneas são guiadas por TC ou ultrassonografia, métodos disponíveis em tempo real e compatíveis com o procedimento.","D":"O escore de Balthazar é, por definição, tomográfico. Se não foi determinado, o exame a solicitar é a TC, não a ressonância."},"p":["Complemento: a ecoendoscopia é ainda mais sensível que a CPRM para microlitíase e é a alternativa quando a ressonância vem normal em pancreatite recorrente de causa indefinida."],"f":"ACG Guideline — Acute Pancreatitis; IAP/APA guidelines; Sabiston, 21ª ed., cap. 55."},{"v":"Vol. II","c":9,"n":8,"g":"B","s":["A hipocalcemia pode ser observada em pacientes com pancreatite aguda grave. Esse achado laboratorial está fisiopatologicamente relacionado:"],"a":{"A":"Ao aumento da liberação de aldosterona e à hipovolemia","B":"Ao consumo de cálcio pela saponificação de ácidos graxos na necrose pancreática","C":"À ativação do eixo paratireoideo como resposta inflamatória sistêmica","D":"À alcalose respiratória gerada pela dor abdominal intensa"},"ok":"A lipase pancreática extravasada digere a gordura peripancreática e mesentérica, liberando ácidos graxos livres que se ligam ao cálcio ionizado formando sabões insolúveis — o fenômeno da saponificação (necrose gordurosa). Esses depósitos são visíveis macroscopicamente na cirurgia como placas esbranquiçadas. O cálcio sequestrado sai da circulação, produzindo hipocalcemia. É um marcador de gravidade e integra o escore de Ranson (cálcio < 8 mg/dL às 48 h).","w":{"A":"Aldosterona regula sódio e potássio, não cálcio. A hipovolemia pode diluir ou concentrar, mas não é o mecanismo descrito.","C":"Inverte a lógica. O PTH é estimulado em resposta à hipocalcemia, tentando corrigi-la — não é a causa. Em alguns casos graves há resposta paratireóidea insuficiente, o que agrava o quadro, mas ainda assim a ativação do eixo não é a origem.","D":"A alcalose aumenta a ligação do cálcio à albumina e reduz o cálcio ionizado, podendo causar sintomas — mas é mecanismo secundário e não explica a hipocalcemia da pancreatite grave."},"p":["Ranson na admissão (não biliar): idade > 55, leucócitos > 16.000, glicemia > 200, LDH > 350, AST > 250. Às 48 h: queda do hematócrito > 10%, aumento da ureia > 5 mg/dL, cálcio < 8, PaO₂ < 60, déficit de base > 4, sequestro de líquidos > 6 L."],"f":"Sabiston, 21ª ed., cap. 55; Ranson JHC — Prognostic signs and the role of operative management in acute pancreatitis."},{"v":"Vol. II","c":9,"n":9,"g":"C","s":["Paciente de 58 anos, com histórico de pancreatite aguda necrosante há 5 semanas, evolui com febre persistente, dor abdominal e perda ponderal progressiva. A TC contrastada evidencia coleção bem delimitada, com conteúdo heterogêneo e presença de gás no interior da região pancreática. Com base na imagem e no quadro clínico, a conduta mais apropriada é:"],"a":{"A":"Observação clínica com suporte nutricional e controle ambulatorial semanal","B":"Antibioticoterapia empírica por 14 dias, sem necessidade de intervenção","C":"Drenagem endoscópica guiada por ultrassonografia, com ou sem necrosectomia","D":"Ressecção cirúrgica da cabeça pancreática com derivação biliodigestiva"},"ok":"Os três elementos — mais de 4 semanas de evolução, coleção bem delimitada com conteúdo heterogêneo (sólido e líquido) e gás no interior — definem necrose pancreática murada (WON) infectada. O tratamento moderno é a abordagem step-up: começa-se pelo método menos invasivo (drenagem endoscópica transmural guiada por ecoendoscopia, ou drenagem percutânea), progredindo para necrosectomia endoscópica ou vídeo-assistida apenas se a resposta for insuficiente. Essa estratégia reduz falência orgânica, fístula e mortalidade em comparação à necrosectomia aberta primária.","w":{"A":"Observação em necrose infectada com sepse é conduta inaceitável — a mortalidade sem drenagem é muito elevada.","B":"O antibiótico é necessário, mas isolado não resolve: a necrose é tecido desvitalizado, sem perfusão, no qual o antimicrobiano não penetra adequadamente. Sem drenagem, não há controle do foco.","D":"Ressecção pancreática formal em pancreatite necrosante é conduta equivocada e de morbimortalidade proibitiva. O tecido necrótico é debridado, não ressecado anatomicamente, e a derivação biliodigestiva não tem qualquer papel aqui."},"p":["Nomenclatura de Atlanta revisada: < 4 semanas — coleção fluida","peripancreática aguda (na PA intersticial) e coleção necrótica aguda (na PA necrosante). > 4 semanas — pseudocisto (só líquido) e necrose murada/WON (líquido + conteúdo sólido). Gás no interior sugere infecção."],"f":"van Santvoort HC et al., N Engl J Med 2010 — A step-up approach or open necrosectomy for necrotizing pancreatitis (ensaio PANTER); Atlanta revisada (2013); Sabiston, 21ª ed., cap. 55."},{"v":"Vol. II","c":10,"n":1,"g":"A","s":["A hemorragia digestiva alta é uma emergência que necessita de diagnóstico preciso e tratamento precoce. É incorreto afirmar que:"],"a":{"A":"O octreotide deve ser utilizado rotineiramente na HDA não varicosa, com melhora importante da sobrevida","B":"Fatores indicativos de maior gravidade são idade avançada, instabilidade hemodinâmica, taquicardia e histórico prévio de melena ou enterorragia","C":"Deve ser iniciado o uso empírico de IBP endovenoso, que pode reduzir sangramentos em doses elevadas","D":"Se houver persistência de sangramento após uma primeira EDA, pode-se tentar uma segunda vez; em caso de insucesso, inicia-se terapia de resgate, cirúrgica ou embolização transarterial"},"ok":"Enunciado negativo. O octreotide é análogo da somatostatina e age por vasoconstrição esplâncnica seletiva, reduzindo o fluxo portal — mecanismo que só faz sentido no sangramento varicoso, decorrente de hipertensão portal. Na HDA não varicosa (úlcera péptica, erosões, Mallory- Weiss), não há benefício demonstrado em sobrevida e a droga não faz parte do tratamento padrão.","w":{"B":"Verdadeira: idade, instabilidade hemodinâmica, taquicardia, comorbidades e sangramento prévio são preditores reconhecidos, incorporados aos escores de Glasgow-Blatchford e Rockall.","C":"Verdadeira. O IBP endovenoso empírico em altas doses é recomendado antes da endoscopia: eleva o pH gástrico, estabiliza o coágulo e reduz a proporção de lesões de alto risco à endoscopia.","D":"Verdadeira e descreve a escalada terapêutica correta: uma segunda endoscopia é aceitável no ressangramento; falhando, parte-se para embolização transarterial (preferida em pacientes de alto risco cirúrgico) ou cirurgia."},"p":["Escore de Glasgow-Blatchford (0–23) usa ureia, hemoglobina, PA sistólica, FC, melena, síncope, hepatopatia e insuficiência cardíaca. Valor 0–1 identifica pacientes de risco muito baixo, que podem receber alta com endoscopia ambulatorial."],"f":"Sabiston, 21ª ed., cap. 49 (Estômago); ACG Clinical Guideline — Upper Gastrointestinal and Ulcer Bleeding; International Consensus Recommendations on nonvariceal UGIB."},{"v":"Vol. II","c":10,"n":2,"g":"A","s":["Homem de 70 anos, tabagista, em situação de rua, etilista crônico, com queixa crônica de ardor epigástrico, admitido com dor abdominal difusa excruciante há 7 horas e abdome em tábua. Gasometria: pH 6,9; pO₂ 80; pCO₂ 46; bicarbonato 10;","lactato 9. Qual exame de imagem rápido e de baixo custo poderia ser diagnóstico, qual o diagnóstico sindrômico esperado e qual a melhor conduta, considerando perfuração duodenal?"],"a":{"A":"RX de tórax em pé; abdome agudo perfurativo; rafia simples e omental patch","B":"RX de abdome em pé; choque séptico; antrectomia com Billroth II","C":"RX de abdome deitado; perfuração neoplásica; gastrectomia total","D":"TC de abdome; abscesso cavitário; duodenorrafia"},"ok":"Três acertos em uma alternativa. (1) O exame é a radiografia de tórax em ortostase, que inclui as cúpulas diafragmáticas e é o método mais sensível entre os simples para detectar pneumoperitônio (ar subdiafragmático). (2) O diagnóstico sindrômico é abdome agudo perfurativo — dor súbita excruciante com abdome em tábua. (3) A conduta para úlcera duodenal perfurada é a rafia simples com epiploplastia (patch de Graham), procedimento rápido e adequado ao paciente grave, complementado por erradicação de H. pylori e IBP no pós-operatório.","w":{"B":"Erra o exame (RX de abdome é menos sensível que o de tórax para pneumoperitônio), o diagnóstico sindrômico (o quadro é perfurativo; a sepse é consequência) e a conduta — a antrectomia com Billroth II é procedimento definitivo de exceção, inadequado a um paciente acidótico e instável.","C":"RX deitado não demonstra pneumoperitônio, pois o ar não se acumula sob o diafragma. E gastrectomia total nesse cenário é desproporcional.","D":"A TC é mais sensível, mas não é \"rápida e de baixo custo\" como pede o enunciado, e o diagnóstico e a conduta propostos não correspondem ao quadro."},"p":["Se o paciente não puder ficar em pé, a alternativa é o decúbito lateral esquerdo com raios horizontais, que evidencia ar entre o fígado e a parede abdominal. A úlcera péptica perfura mais frequentemente na parede anterior do duodeno (a posterior tende a sangrar, por erodir a artéria gastroduodenal)."],"f":"Sabiston, 21ª ed., cap. 49; WSES Guidelines for perforated peptic ulcer."},{"v":"Vol. II","c":10,"n":3,"g":"C","s":["Jovem de 20 anos relata surgimento de dor em fossa ilíaca direita. Nega febre e descarga genital."],"a":{"A":"Se masculino, Alvarado 2, melhor conduta: internar para exames de imagem","B":"Se feminino, Alvarado 2, melhor conduta: cirurgia corretiva","C":"Se masculino, Alvarado 8, melhor conduta: cirurgia corretiva","D":"Se masculino, Alvarado 5, melhor conduta: alta"},"ok":"O escore de Alvarado estratifica a probabilidade de apendicite. Pontuação ≥ 7 indica alta probabilidade, e em homens jovens com escore alto o diagn
