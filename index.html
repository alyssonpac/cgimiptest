a e a função hepática normal argumentam fortemente contra cirrose.","C":"Mallory-Weiss é laceração da junção esofagogástrica após vômitos, com aspecto endoscópico completamente distinto.","D":"A gastropatia hipertensiva portal tem aspecto em \"mosaico\" difuso, e o TIPS não faria sentido em obstrução esplênica isolada — não há gradiente porto-sistêmico hepático a descomprimir."},"p":["Pense em hipertensão portal segmentar sempre que houver varizes gástricas isoladas com fígado normal. As causas são trombose de veia esplênica por pancreatite, tumor pancreático ou trauma."],"f":"Sabiston, 21ª ed., cap. 55 e cap. 56; literatura sobre sinistral portal hypertension."},{"v":"Vol. III (autorais)","c":9,"n":5,"g":"C","s":["Paciente com pancreatite crônica e pseudocisto apresenta hemorragia digestiva intermitente com queda de hemoglobina, sem fonte identificada à endoscopia. Angiotomografia evidencia pseudoaneurisma de artéria esplênica comunicando-se com o pseudocisto. Qual a conduta?"],"a":{"A":"Cirurgia de Puestow de urgência","B":"Drenagem endoscópica do pseudocisto","C":"Angiografia com embolização do pseudoaneurisma","D":"Observação, pois a maioria trombosa espontaneamente"},"ok":"O pseudoaneurisma de artéria peripancreática — mais comumente a esplênica, seguida da gastroduodenal — resulta da digestão enzimática da parede arterial por um pseudocisto adjacente. Quando se rompe para dentro do ducto pancreático, produz hemossuccus pancreaticus: sangramento intermitente pela papila, que a endoscopia raramente flagra. O tratamento de escolha é a angiografia com embolização, que é eficaz, rápida e muito menos mórbida que a cirurgia em um leito inflamado.","w":{"A":"O Puestow é cirurgia eletiva de drenagem ductal para dor, não conduta para hemorragia arterial.","B":"Drenar endoscopicamente um pseudocisto que contém um pseudoaneurisma pode desencadear hemorragia catastrófica. É por isso que a angiotomografia deve preceder qualquer drenagem de pseudocisto.","D":"Pseudoaneurisma não trombosa de forma confiável e tem mortalidade elevada quando rompe livremente."},"p":["Regra de segurança: sempre avalie a vascularização com TC contrastada antes de drenar um pseudocisto. Um pseudoaneurisma não reconhecido transforma um procedimento eletivo em uma hemorragia incontrolável."],"f":"Sabiston, 21ª ed., cap. 55; literatura sobre hemossuccus pancreaticus e pseudoaneurismas peripancreáticos."},{"v":"Vol. III (autorais)","c":9,"n":6,"g":"B","s":["Paciente com pancreatite crônica avançada apresenta esteatorreia, perda ponderal e deficiência de vitaminas lipossolúveis. Qual a conduta mais adequada?"],"a":{"A":"Restrição rigorosa de gordura na dieta, sem reposição enzimática","B":"Reposição de enzimas pancreáticas em doses adequadas com as refeições, associada a inibidor de bomba de prótons e reposição de vitaminas A, D, E e K","C":"Nutrição parenteral total domiciliar","D":"Ressecção pancreática para tratar a insuficiência exócrina"},"ok":"A insuficiência exócrina só se manifesta quando mais de 90% da função acinar foi perdida. O tratamento é a reposição enzimática oral (lipase em dose adequada, 40.000 a 50.000 unidades por refeição principal), administrada durante as refeições. O inibidor de bomba de prótons aumenta a eficácia, porque o pH ácido duodenal — resultante da menor secreção de bicarbonato pancreático — inativa a lipase. Repõem-se ainda as vitaminas lipossolúveis.","w":{"A":"Restringir gordura sem repor enzimas piora a desnutrição e a deficiência vitamínica. A conduta atual é manter dieta normal em gordura e repor enzimas suficientes.","C":"Nutrição parenteral em paciente com trato digestivo funcionante é desproporcional.","D":"A ressecção agrava a insuficiência exócrina e endócrina — é conduta contrária ao objetivo."},"p":["Motivos comuns de falha da reposição: dose insuficiente, tomada fora das refeições, ausência de IBP e má adesão. Antes de aumentar a dose, cheque esses quatro pontos."],"f":"ACG Clinical Guideline — Chronic Pancreatitis; HaPanEU/United European Gastroenterology guidelines; Sabiston, 21ª ed., cap. 55."},{"v":"Vol. III (autorais)","c":9,"n":7,"g":"D","s":["Homem de 60 anos com icterícia obstrutiva indolor e massa em cabeça de pâncreas à TC, com aspecto de \"salsicha\" e halo periférico, IgG4 sérica elevada. Qual a hipótese diagnóstica e a conduta inicial?"],"a":{"A":"Adenocarcinoma ductal; duodenopancreatectomia imediata","B":"Pancreatite crônica alcoólica; abstinência e analgesia","C":"Pseudocisto cefálico; drenagem endoscópica","D":"Pancreatite autoimune tipo 1; teste terapêutico com corticoide após confirmação diagnóstica"},"ok":"A pancreatite autoimune tipo 1 é a manifestação pancreática da doença relacionada a IgG4. Seus achados característicos são a imagem em \"salsicha\" (aumento difuso com perda das lobulações), o halo periférico hipoatenuante, a estenose irregular do ducto principal e a IgG4 sérica elevada, com frequente acometimento de outros órgãos (via biliar, glândulas salivares, retroperitônio). É o grande simulador do câncer de pâncreas, e sua identificação evita uma duodenopancreatectomia desnecessária. A resposta ao corticoide é dramática e serve de confirmação.","w":{"A":"É exatamente o erro que se quer evitar. Um percentual dos Whipples realizados por suspeita de câncer revela pancreatite autoimune no anatomopatológico.","B":"A pancreatite alcoólica cursa com calcificações, cálculos ductais e história etílica, não com IgG4 elevada e imagem em salsicha.","C":"O pseudocisto é coleção líquida, não massa sólida."},"p":["Cuidado: parte dos adenocarcinomas pancreáticos também eleva discretamente a IgG4. Por isso a conduta é confirmar com critérios (imagem, sorologia, histologia, outros órgãos e resposta ao corticoide), e não simplesmente presumir."],"f":"HISORt criteria (Mayo Clinic); International Consensus Diagnostic Criteria for Autoimmune Pancreatitis; Sabiston, 21ª ed., cap. 55."},{"v":"Vol. III (autorais)","c":9,"n":8,"g":"A","s":["Sobre a prevenção da pancreatite pós-CPRE, assinale a correta:"],"a":{"A":"A administração retal de anti-inflamatório não esteroidal (indometacina ou diclofenaco) e a hidratação com Ringer lactato reduzem a incidência","B":"A antibioticoprofilaxia reduz a incidência de pancreatite pós-CPRE","C":"A pancreatite pós-CPRE ocorre em menos de 0,5% dos procedimentos","D":"O uso de prótese pancreática aumenta o risco"},"ok":"A pancreatite é a complicação mais frequente da CPRE, ocorrendo em cerca de 3 a 5% dos casos (e até 15% em pacientes de alto risco). As duas medidas com melhor evidência de prevenção são o AINE por via retal (indometacina ou diclofenaco, 100 mg, imediatamente antes ou após o procedimento) e a hidratação vigorosa com Ringer lactato periprocedimento.","w":{"B":"O antibiótico previne colangite em alguns cenários, mas não previne pancreatite.","C":"Subestima em uma ordem de grandeza a incidência real.","D":"Inverte o efeito: a prótese pancreática profilática é justamente uma das medidas que reduzem o risco em pacientes de alto risco (canulação difícil, esfincterotomia pancreática, disfunção do esfíncter de Oddi)."},"p":["Fatores de risco: mulher jovem, disfunção do esfíncter de Oddi, história prévia de pancreatite pós-CPRE, canulação difícil, injeção repetida no ducto pancreático e ausência de dilatação da via biliar. É esse risco que fundamenta a regra do Caso 8: CPRE não é exame diagnóstico."],"f":"ESGE Guideline — Prophylaxis of post-ERCP pancreatitis; Elmunzer BJ et al., NEJM — rectal indomethacin."},{"v":"Vol. III (autorais)","c":9,"n":9,"g":"C","s":["Sobre o diabetes pancreatogênico (tipo 3c), assinale a correta:"],"a":{"A":"Cursa com hiperinsulinemia e resistência insulínica, semelhante ao tipo","B":"É facilmente controlado com metformina isolada, sem risco de hipoglicemia","C":"Caracteriza-se por deficiência simultânea de insulina e glucagon, o que o torna instável, com risco elevado de hipoglicemia (\"diabetes frágil\")","D":"Não requer insulinoterapia em nenhum estágio"},"ok":"O diabetes tipo 3c decorre da destruição das ilhotas por doença pancreática (pancreatite crônica, ressecção, neoplasia). Sua particularidade crucial é a perda simultânea de células beta (insulina) e células alfa (glucagon). Sem glucagon, o paciente perde o principal mecanismo de contrarregulação da hipoglicemia, tornando o controle glicêmico instável e o risco hipoglicêmico elevado — daí o termo \"diabetes frágil\". Some-se a isso a má absorção associada, que torna a ingestão de carboidrato imprevisível.","w":{"A":"Descreve o diabetes tipo 2, cujo mecanismo é essencialmente de resistência insulínica com hiperinsulinemia inicial.","B":"A metformina pode ter papel inicial, mas a maioria dos pacientes evolui para necessidade de insulina, e o risco de hipoglicemia é justamente a marca do tipo 3c.","D":"A insulinoterapia é frequentemente necessária, sobretudo após pancreatectomias extensas."},"p":["Implicação prática: alvos glicêmicos devem ser menos rigorosos nesses pacientes, e a reposição enzimática adequada é parte do controle glicêmico, por regularizar a absorção."],"f":"Sabiston, 21ª ed., cap. 55; ADA Standards of Medical Care — classification of diabetes; literatura sobre type 3c diabetes."},{"v":"Vol. III (autorais)","c":9,"n":10,"g":"B","s":["Sobre a nutrição na pancreatite aguda grave, assinale a correta:"],"a":{"A":"O jejum prolongado (\"repouso pancreático\") é o padrão de tratamento","B":"A nutrição enteral precoce é preferível à parenteral, reduzindo infecção, falência orgânica e mortalidade, podendo ser administrada por sonda gástrica ou nasojejunal","C":"A nutrição enteral é contraindicada, por estimular a secreção pancreática e agravar a inflamação","D":"A nutrição parenteral deve ser iniciada nas primeiras 24 horas em todos os casos"},"ok":"O paradigma do \"repouso pancreático\" foi abandonado. A nutrição enteral precoce (nas primeiras 24 a 72 horas) mantém a barreira intestinal, reduz translocação bacteriana e diminui comprovadamente infecção, falência orgânica e mortalidade em comparação à parenteral. Ensaios randomizados mostraram que a via nasogástrica é tão eficaz e segura quanto a nasojejunal, o que simplifica muito a implementação.","w":{"A":"Contraria a evidência atual, e o jejum prolongado agrava a atrofia da mucosa e a translocação.","C":"A preocupação com estímulo secretório não se confirmou clinicamente como fator de piora.","D":"A parenteral fica reservada aos casos em que a via enteral é impossível ou não atinge a meta após alguns dias."},"p":["Interseção com o Caso 4: é o mesmo princípio do \"se o intestino funciona, use-o\", aqui com evidência de redução de mortalidade."],"f":"IAP/APA evidence-based guidelines for the management of acute pancreatitis; ESPEN Guideline on Clinical Nutrition in Acute and Chronic Pancreatitis; Sabiston, 21ª ed., cap. 55."},{"v":"Vol. III (autorais)","c":10,"n":1,"g":"B","s":["Homem de 76 anos, institucionalizado, constipado crônico, apresenta distensão abdominal maciça, dor e parada de eliminação de gases e fezes. Radiografia evidencia alça colônica muito distendida, em forma de \"grão de café\", com convexidade voltada para o hipocôndrio direito. Sem sinais de peritonite. Qual a conduta inicial?"],"a":{"A":"Laparotomia com sigmoidectomia à Hartmann","B":"Descompressão endoscópica (retossigmoidoscopia) com sonda retal, seguida de sigmoidectomia eletiva na mesma internação","C":"Enema opaco terapêutico","D":"Observação com laxantes e enemas"},"ok":"O quadro é de volvo de sigmoide, mais comum em idosos institucionalizados com constipação crônica e sigmoide redundante. Na ausência de sinais de sofrimento (peritonite, febre, acidose, sangue à endoscopia), o tratamento inicial é a descompressão endoscópica com colocação de sonda retal, eficaz em 70 a 90% dos casos. Como a recorrência sem cirurgia chega a 50 a 60%, recomenda-se sigmoidectomia eletiva na mesma internação, após o preparo.","w":{"A":"A cirurgia de urgência com Hartmann fica reservada aos casos com peritonite, necrose à endoscopia ou falha da descompressão.","C":"O enema opaco pode ser diagnóstico (sinal do \"bico de pássaro\"), mas não é o tratamento de escolha e traz risco de perfuração em alça distendida.","D":"Observação isolada não desfaz a torção e permite evolução para necrose."},"p":["Diferencie do volvo de ceco: mais comum em adultos jovens com má fixação do cólon direito, a alça se projeta para o quadrante superior esquerdo, a descompressão endoscópica raramente funciona, e o tratamento é cirúrgico — colectomia direita."],"f":"Sabiston, 21ª ed., cap. 51; ASCRS Clinical Practice Guidelines for the Management of Colonic Volvulus."},{"v":"Vol. III (autorais)","c":10,"n":2,"g":"C","s":["Paciente de 68 anos com obstrução colônica completa por neoplasia estenosante de sigmoide, sem sinais de perfuração, hemodinamicamente estável. Estadiamento revela metástases hepáticas múltiplas irressecáveis. Qual a conduta mais adequada?"],"a":{"A":"Colectomia total com anastomose ileorretal","B":"Sigmoidectomia à Hartmann de urgência","C":"Colocação de prótese metálica autoexpansível (stent colônico) como medida paliativa, permitindo início precoce de quimioterapia","D":"Observação com enemas e dieta líquida"},"ok":"Em paciente com doença metastática irressecável e obstrução, o objetivo é paliativo: aliviar a obstrução com a menor morbidade e o menor atraso para o tratamento sistêmico. A prótese colônica autoexpansível cumpre exatamente isso — descomprime, evita cirurgia de urgência e estoma, e permite iniciar quimioterapia em dias.","w":{"A":"Colectomia total é operação de grande porte, injustificável no cenário paliativo.","B":"O Hartmann resolve a obstrução, mas impõe colostomia definitiva (poucos pacientes metastáticos serão reconstituídos), maior morbidade e atraso da quimioterapia.","D":"Conduta insuficiente em obstrução completa."},"p":["Nuance importante: o stent como ponte para cirurgia curativa em doença não metastática é mais controverso — há preocupação com perfuração e disseminação de células tumorais. Sua indicação mais consensual é a paliação, e como ponte apenas em pacientes de alto risco cirúrgico. O stent é contraindicado em obstrução de reto muito distal (a menos de 5 cm da margem anal, por tenesmo e migração) e diante de perfuração."],"f":"ESGE Guideline — Self-expandable metal stents for obstructing colonic and extracolonic cancer; ASCRS Guidelines; Sabiston, 21ª ed., cap. 51."},{"v":"Vol. III (autorais)","c":10,"n":3,"g":"A","s":["Paciente de 74 anos, internado por fratura de fêmur, em uso de opioides, evolui com distensão abdominal progressiva e ceco medindo 11 cm à radiografia. TC exclui obstrução mecânica. Qual o diagnóstico e a conduta?"],"a":{"A":"Síndrome de Ogilvie (pseudo-obstrução colônica aguda); correção de eletrólitos, suspensão de opioides e anticolinérgicos, descompressão, e neostigmina se não houver resposta","B":"Volvo de ceco; colectomia direita de urgência","C":"Megacólon tóxico; colectomia total","D":"Impactação fecal; enemas repetidos"},"ok":"A síndrome de Ogilvie é dilatação colônica maciça sem obstrução mecânica, tipicamente em pacientes hospitalizados por outra condição — trauma, cirurgia ortopédica, doença cardiopulmonar — em uso de opioides e com distúrbios eletrolíticos. O tratamento inicial é conservador: corrigir eletrólitos (potássio, magnésio, cálcio), suspender opioides e anticolinérgicos, descompressão nasogástrica e retal, mobilização. Sem resposta em 24 a 48 horas, ou com ceco acima de 12 cm, indica-se neostigmina endovenosa sob monitorização cardíaca — resposta dramática em cerca de 80 a 90%.","w":{"B":"O volvo de ceco teria zona de transição na TC, que explicitamente excluiu obstrução mecânica.","C":"O megacólon tóxico ocorre em colite (inflamatória ou por C. difficile) com sinais sistêmicos de toxicidade, ausentes aqui.","D":"Impactação fecal não produz dilatação cecal desse porte com TC excluindo obstrução."},"p":["O diâmetro cecal é o parâmetro crítico: acima de 12 cm, o risco de perfuração isquêmica aumenta acentuadamente (lei de Laplace — a","tensão de parede é maior onde o diâmetro é maior). Contraindicações à neostigmina: bradicardia, broncoespasmo ativo, obstrução mecânica não excluída. Tenha atropina disponível."],"f":"Sabiston, 21ª ed., cap. 51; Ponec RJ et al., NEJM — neostigmine for acute colonic pseudo-obstruction; ASCRS Guidelines."},{"v":"Vol. III (autorais)","c":10,"n":4,"g":"D","s":["Gestante de 20 semanas com dor em fossa ilíaca direita, náuseas, febre baixa e leucocitose. Ultrassonografia inconclusiva. Qual a conduta mais adequada?"],"a":{"A":"Tomografia de abdome com contraste","B":"Observação por 48 h antes de qualquer exame adicional","C":"Laparotomia exploradora imediata","D":"Ressonância magnética de abdome sem contraste; confirmada a apendicite, apendicectomia (preferencialmente videolaparoscópica)"},"ok":"A apendicite é a causa não obstétrica mais comum de cirurgia na gestação. Quando o ultrassom é inconclusivo, o exame de escolha é a ressonância magnética sem gadolínio, que não usa radiação ionizante e tem alta acurácia. Confirmado o diagnóstico, opera-se — o atraso aumenta perfuração, que por sua vez eleva a perda fetal de cerca de 3% para 20 a 35%.","w":{"A":"A TC expõe o feto a radiação ionizante e deve ser evitada quando há alternativa. É aceitável apenas se a ressonância não estiver disponível e o diagnóstico for imperativo.","B":"Observar por 48 horas em suspeita de apendicite na gestante é conduta perigosa: o risco fetal decorre justamente da perfuração.","C":"Operar sem confirmação, com ultrassom inconclusivo, expõe a uma laparotomia branca em uma gestante."},"p":["A apresentação pode ser atípica: o apêndice é deslocado cranial e lateralmente pelo útero gravídico conforme a idade gestacional, e leucocitose é fisiológica na gestação, reduzindo o valor do exame. A videolaparoscopia é segura em qualquer trimestre, com as precauções técnicas já descritas (acesso aberto, pressão reduzida, decúbito lateral esquerdo)."],"f":"SAGES Guidelines for laparoscopy during pregnancy; ACOG Committee Opinion on imaging during pregnancy; WSES Jerusalem Guidelines."},{"v":"Vol. III (autorais)","c":10,"n":5,"g":"B","s":["Paciente de 32 anos, com trombofilia conhecida (fator V de Leiden), apresenta dor abdominal difusa de instalação subaguda (4 dias), sem sinais de peritonite. Angiotomografia evidencia falha de enchimento na veia mesentérica superior, com espessamento de alças e ascite. Sem sinais de necrose transmural. Qual a conduta inicial?"],"a":{"A":"Laparotomia exploradora imediata com ressecção intestinal","B":"Anticoagulação plena imediata com heparina, suporte clínico e vigilância, reservando a cirurgia para sinais de necrose","C":"Trombólise sistêmica de rotina","D":"Observação sem anticoagulação"},"ok":"A trombose venosa mesentérica difere das formas arteriais em três aspectos: instalação subaguda (dias), fatores de risco trombofílicos ou de hipertensão portal, e tratamento primariamente clínico. A base é a anticoagulação plena imediata com heparina, que interrompe a progressão do trombo e permite a recanalização, associada a suporte, jejum e vigilância clínica. A cirurgia se reserva a sinais de necrose transmural ou peritonite.","w":{"A":"Operar sem sinais de necrose expõe a ressecções desnecessárias de intestino ainda viável — e a trombose venosa frequentemente melhora só com anticoagulação.","C":"A trombólise (sistêmica ou por cateter) é opção de exceção, em casos selecionados e refratários, não conduta de rotina.","D":"Não anticoagular permite a progressão do trombo e o infarto venoso."},"p":["Distinção rápida: embolia arterial (fibrilação atrial, início súbito, dor desproporcional) × trombose arterial (aterosclerose, angina mesentérica prévia, perda ponderal) × isquemia não oclusiva (baixo débito, vasopressor) × trombose venosa (trombofilia, hipertensão portal, início subagudo)."],"f":"Sabiston, 21ª ed., cap. 50 e cap. 62; WSES Guidelines on acute mesenteric ischemia."},{"v":"Vol. III (autorais)","c":10,"n":6,"g":"C","s":["Paciente de 71 anos, com doença arterial coronariana, apresenta dor abdominal em cólica no quadrante inferior esquerdo seguida de diarreia sanguinolenta, com melhora espontânea parcial em 24 h. Colonoscopia evidencia mucosa edemaciada e friável em cólon descendente, poupando o reto. Qual o diagnóstico mais provável?"],"a":{"A":"Doença de Crohn","B":"Retocolite ulcerativa","C":"Colite isquêmica","D":"Diverticulite aguda"},"ok":"A colite isquêmica é a forma mais comum de isquemia intestinal e tem apresentação característica: dor em cólica de início relativamente súbito seguida, em 24 horas, de sangramento retal ou diarreia sanguinolenta, geralmente autolimitada. Acomete tipicamente as áreas de watershed — a flexura esplênica (ponto de Griffith) e a junção retossigmoide (ponto de Sudeck) — e caracteristicamente poupa o reto, que tem irrigação dupla pela circulação ilíaca interna.","w":{"A":"A doença de Crohn tem acometimento descontínuo, transmural, frequentemente ileal, com fístulas e doença perianal, e curso crônico.","B":"A retocolite ulcerativa sempre acomete o reto e progride de forma contínua e ascendente — o inverso do descrito.","D":"A diverticulite cursa com dor localizada persistente, febre e leucocitose, sem diarreia sanguinolenta como marca."},"p":["A maioria dos casos de colite isquêmica é não gangrenosa e se resolve com suporte, hidratação, repouso intestinal e antibiótico em casos selecionados. Indicações cirúrgicas: peritonite, gangrena, colite fulminante, estenose sintomática tardia."],"f":"Sabiston, 21ª ed., cap. 51; ACG Clinical Guideline — Epidemiology, Risk Factors, Patterns of Presentation, Diagnosis, and Management of Colon Ischemia."},{"v":"Vol. III (autorais)","c":10,"n":7,"g":"A","s":["Paciente de 66 anos com hematoquezia volumosa e instabilidade hemodinâmica. Após ressuscitação e endoscopia digestiva alta negativa, qual a sequência mais adequada de investigação e tratamento?"],"a":{"A":"Angiotomografia ou arteriografia (com possibilidade de embolização) em sangramento ativo; colonoscopia após preparo, se o paciente estabilizar","B":"Colonoscopia imediata, sem preparo, em paciente instável","C":"Laparotomia exploradora com colectomia total às cegas","D":"Cintilografia com hemácias marcadas como primeira escolha em instável"},"ok":"Na hemorragia digestiva baixa volumosa com instabilidade, a prioridade é localizar e tratar o ponto de sangramento com rapidez. A angiotomografia detecta sangramentos a partir de cerca de 0,3 mL/min e localiza a fonte, permitindo prosseguir com arteriografia e embolização superseletiva, que é terapêutica. A colonoscopia, embora seja o exame de escolha na maioria dos sangramentos baixos, exige preparo e paciente estável.","w":{"B":"Colonoscopia sem preparo em paciente instável tem visualização ruim, baixo rendimento diagnóstico e risco.","C":"Colectomia \"às cegas\" é a última das opções, com alta morbimortalidade e risco de ressecar o segmento errado.","D":"A cintilografia com hemácias marcadas é mais sensível (0,1 mL/min), mas é demorada e localiza mal — não serve ao paciente instável."},"p":["Causas mais comuns de HDB no adulto: doença diverticular (a mais frequente e a que mais sangra volumosamente), angiodisplasia, neoplasia, colite (isquêmica, infecciosa, inflamatória) e doença anorretal. Sempre exclua HDA primeiro: cerca de 10 a 15% das hematoquezias","volumosas têm origem alta, e a passagem de sonda nasogástrica ou a EDA precoce evita o erro."],"f":"ACG Clinical Guideline — Management of Patients With Acute Lower Gastrointestinal Bleeding; Sabiston, 21ª ed., cap. 51."},{"v":"Vol. III (autorais)","c":10,"n":8,"g":"D","s":["Paciente de 28 anos, com apendicite aguda de 5 dias de evolução, apresenta massa palpável em fossa ilíaca direita. TC evidencia plastrão apendicular com abscesso de 4,5 cm, sem peritonite difusa, com estabilidade clínica. Qual a conduta inicial mais adequada?"],"a":{"A":"Apendicectomia videolaparoscópica de urgência","B":"Colectomia direita","C":"Antibioticoterapia isolada por 14 dias, sem drenagem","D":"Antibioticoterapia associada a drenagem percutânea do abscesso, com apendicectomia de intervalo discutida individualmente"},"ok":"O plastrão apendicular com abscesso em paciente estável é tratado de forma conservadora: antibiótico associado a drenagem percutânea quando a coleção é maior que 3 a 4 cm. Operar na vigência do plastrão implica dissecção em tecido inflamado e friável, com risco elevado de lesão de alças, fístula e necessidade de ressecção ileocecal.","w":{"A":"A apendicectomia de urgência nesse cenário é justamente o que se evita.","B":"Colectomia direita seria uma escalada desnecessária, reservada a casos em que a dissecção se mostra impossível ou há suspeita de neoplasia.","C":"Antibiótico isolado em abscesso de 4,5 cm tem taxa de falha significativa — a drenagem é parte do controle do foco."},"p":["A apendicectomia de intervalo (6 a 8 semanas depois) deixou de ser rotina: cerca de 80% dos pacientes não recidivam. Ela é indicada individualmente, sobretudo se houver sintomas recorrentes ou apendicolito. Em pacientes acima de 40 anos, é obrigatória a colonoscopia de seguimento, pelo risco de neoplasia de ceco simulando plastrão."],"f":"WSES Jerusalem Guidelines for acute appendicitis; Sabiston, 21ª ed., cap. 52."},{"v":"Vol. III (autorais)","c":10,"n":9,"g":"B","s":["Mulher de 24 anos com dor abdominal aguda em fossa ilíaca direita, atraso menstrual de 6 semanas e leve sangramento vaginal. PA 92×58, FC 112. Qual a conduta imediata?"],"a":{"A":"Tomografia de abdome com contraste","B":"Solicitar beta-hCG, ultrassonografia transvaginal e ressuscitação volêmica, com avaliação ginecológica de urgência pela suspeita de gravidez ectópica rota","C":"Apendicectomia videolaparoscópica de urgência","D":"Analgesia e reavaliação em 24 h"},"ok":"Mulher em idade fértil com dor abdominal aguda é gravidez ectópica até prova em contrário. O quadro descrito — atraso menstrual, sangramento vaginal, dor e instabilidade hemodinâmica — sugere ectópica rota com hemoperitônio. A conduta é imediata: beta-hCG, ultrassonografia transvaginal (ou FAST à beira do leito, se instável), ressuscitação e avaliação ginecológica urgente para laparoscopia.","w":{"A":"A TC não é o exame de escolha em suspeita de gestação, e o exame não deve preceder a ressuscitação em paciente instável.","C":"Operar assumindo apendicite sem excluir gestação ectópica é erro grave, e a abordagem cirúrgica seria diferente.","D":"Reavaliar em 24 h uma paciente hipotensa e taquicárdica é inaceitável."},"p":["Regra de ouro: toda mulher em idade fértil com dor abdominal aguda deve ter beta-hCG dosado, antes de qualquer imagem com radiação e antes de qualquer indicação cirúrgica. Diferenciais ginecológicos do abdome agudo: gravidez ectópica, torção anexial, cisto ovariano roto, doença inflamatória pélvica e abscesso tubo-ovariano."],"f":"Sabiston, 21ª ed., cap. 45; ACOG Practice Bulletin — Tubal Ectopic Pregnancy."},{"v":"Vol. III (autorais)","c":10,"n":10,"g":"C","s":["Sobre a diverticulite aguda não complicada (Hinchey Ia) em paciente imunocompetente, com bom estado geral e tolerância à via oral, assinale a conduta atualmente recomendada:"],"a":{"A":"Internação obrigatória com antibiótico endovenoso por 10 dias","B":"Sigmoidectomia eletiva após o primeiro episódio, em todos os pacientes","C":"Tratamento ambulatorial, podendo-se inclusive omitir o antibiótico em pacientes selecionados, com dieta e reavaliação; colonoscopia de controle após 6 a 8 semanas","D":"Colonoscopia imediata durante o quadro agudo, para excluir neoplasia"},"ok":"Duas mudanças importantes de paradigma. Primeiro, a diverticulite não complicada em paciente selecionado pode ser tratada ambulatorialmente, e ensaios randomizados (AVOD e DIABOLO) mostraram que a omissão do antibiótico não piora desfechos em imunocompetentes com bom estado geral — a diverticulite não complicada é entendida hoje como processo predominantemente inflamatório, não infeccioso. Segundo, a colonoscopia de controle após 6 a 8 semanas é recomendada para excluir neoplasia simulando diverticulite.","w":{"A":"Internação e antibiótico endovenoso ficam reservados a quem não tolera via oral, tem comorbidades, imunossupressão, dor intensa ou sinais sistêmicos.","B":"A indicação de sigmoidectomia eletiva deixou de ser baseada no número de episódios. Hoje se individualiza: sintomas persistentes, fístula, estenose, imunossupressão e episódios complicados.","D":"A colonoscopia na fase aguda é contraindicada pelo risco de perfuração — faz-se depois."},"p":["Interseção com o Caso 3: o abandono do antibiótico na diverticulite não complicada segue a mesma lógica de \"menos antibiótico, mais controle de foco e seleção de pacientes\" que rege a antibioticoprofilaxia e a duração da terapia."],"f":"Chabok A et al., Br J Surg — AVOD trial; Daniels L et al., Br J Surg — DIABOLO trial; ASCRS Clinical Practice Guidelines for Sigmoid Diverticulitis; Sabiston, 21ª ed., cap. 51."},{"v":"Vol. III (autorais)","c":11,"n":1,"g":"C","s":["Paciente de 55 anos com DRGE de longa data realiza endoscopia que evidencia mucosa de aspecto salmão estendendo-se por 4 cm acima da junção esofagogástrica. Biópsias confirmam metaplasia intestinal sem displasia. Qual a conduta?"],"a":{"A":"Esofagectomia profilática","B":"Ressecção endoscópica de toda a área metaplásica","C":"Tratamento com IBP e vigilância endoscópica com biópsias a cada 3 a 5 anos","D":"Nenhuma vigilância é necessária, pois não há displasia"},"ok":"O esôfago de Barrett sem displasia tem risco de progressão para adenocarcinoma de cerca de 0,1 a 0,5% ao ano — baixo, mas não desprezível. A conduta é controle do refluxo com IBP e vigilância endoscópica a cada 3 a 5 anos, com biópsias segundo o protocolo de Seattle (quatro quadrantes a cada 1 a 2 cm).","w":{"A":"Esofagectomia profilática em Barrett sem displasia é conduta desproporcional, com mortalidade operatória incompatível com o risco da lesão.","B":"A ablação (radiofrequência) ou ressecção endoscópica se indica a partir da displasia, não no Barrett sem displasia — embora segmentos longos em pacientes jovens sejam objeto de discussão.","D":"Abandonar a vigilância ignora o risco de progressão."},"p":["Conduta por grau: sem displasia → vigilância 3–5 anos. Displasia de baixo grau → ablação por radiofrequência (preferida) ou vigilância em 6–12 meses. Displasia de alto grau ou adenocarcinoma intramucoso (T1a) → ressecção endoscópica da lesão visível seguida de ablação do restante."],"f":"ACG Clinical Guideline — Diagnosis and Management of Barrett's Esophagus; Sabiston, 21ª ed., cap. 42."},{"v":"Vol. III (autorais)","c":11,"n":2,"g":"A","s":["Homem de 52 anos, após episódio de vômitos intensos durante libação alcoólica, apresenta dor torácica intensa, dispneia, enfisema subcutâneo cervical e derrame pleural esquerdo. Qual o diagnóstico e a conduta?"],"a":{"A":"Síndrome de Boerhaave (perfuração esofágica espontânea); ressuscitação, antibiótico de amplo espectro, drenagem pleural e reparo cirúrgico precoce","B":"Síndrome de Mallory-Weiss; hemostasia endoscópica","C":"Infarto agudo do miocárdio; angioplastia primária","D":"Pneumotórax espontâneo; drenagem torácica isolada"},"ok":"A síndrome de Boerhaave é a ruptura transmural do esôfago por aumento súbito da pressão intraluminal contra um cricofaríngeo fechado, tipicamente após vômitos. A tríade de Mackler — vômitos, dor torácica e enfisema subcutâneo — é a apresentação clássica. A ruptura ocorre habitualmente na parede posterolateral esquerda do terço distal. É emergência com mortalidade elevada, e o desfecho depende do tempo até o tratamento: reparo primário com reforço nas primeiras 24 horas oferece os melhores resultados.","w":{"B":"A síndrome de Mallory-Weiss é uma laceração apenas da mucosa, que causa hematêmese e não perfuração — não produz enfisema nem derrame pleural.","C":"Embora a dor torácica confunda, o enfisema subcutâneo e o derrame pleural não pertencem ao infarto.","D":"O pneumotórax espontâneo não explica o enfisema cervical após vômitos nem o derrame com esse contexto."},"p":["O diagnóstico se confirma por esofagografia com contraste hidrossolúvel ou TC com contraste oral. Sinal de Hamman (crepitação sincrônica com o batimento cardíaco) pode estar presente. Opções terapêuticas: reparo primário com reforço (pleura, fundo gástrico, músculo intercostal) nas perfurações precoces; prótese endoscópica com drenagem em casos selecionados; e exclusão esofágica nas perfurações tardias com sepse."],"f":"Sabiston, 21ª ed., cap. 42; WSES Guidelines on esophageal perforation."},{"v":"Vol. III (autorais)","c":11,"n":3,"g":"B","s":["Criança de 4 anos ingere soda cáustica. Chega ao pronto-socorro 2 horas depois, com sialorreia e odinofagia. Qual a conduta inicial mais adequada?"],"a":{"A":"Induzir vômito e administrar substância neutralizante (vinagre ou bicarbonato)","B":"Estabilização, jejum, avaliação da via aérea e endoscopia digestiva alta nas primeiras 12 a 24 horas para graduar a lesão","C":"Lavagem gástrica com sonda de grosso calibre","D":"Esofagectomia de urgência"},"ok":"A conduta na ingestão de cáusticos começa por não piorar: nada de vômito induzido, nada de neutralização (a reação é exotérmica e agrava a lesão) e nada de sonda às cegas. Após estabilizar e avaliar a via aérea (o edema pode obstruí-la), realiza-se endoscopia entre 12 e 24 horas, janela em que a lesão já se expressou e a parede ainda não atingiu a fragilidade máxima. A graduação de Zargar define prognóstico e conduta.","w":{"A":"Induzir vômito reexpõe o esôfago ao agente. A neutralização gera calor e agrava a queimadura química.","C":"A sonda de grosso calibre às cegas arrisca perfurar um esôfago já lesado.","D":"A esofagectomia de urgência se reserva a necrose transmural extensa com perfuração ou mediastinite."},"p":["Graduação de Zargar: 0 normal; I edema e hiperemia; IIa úlceras superficiais; IIb úlceras profundas ou circunferenciais; IIIa necrose focal; IIIb necrose extensa. A partir de IIb, o risco de estenose tardia é alto (cerca de 70–100% no IIIa). Álcalis causam necrose de liquefação (penetram profundamente,","lesando mais o esôfago); ácidos causam necrose de coagulação (formam escara, lesando mais o estômago)."],"f":"Sabiston, 21ª ed., cap. 42; ESGE/ESPGHAN Guideline on caustic ingestion."},{"v":"Vol. III (autorais)","c":11,"n":4,"g":"D","s":["Sobre o POEM (miotomia endoscópica peroral) no tratamento da acalasia, assinale a correta:"],"a":{"A":"Está contraindicado no subtipo III de Chicago","B":"Apresenta menor taxa de refluxo pós-operatório que a miotomia de Heller com fundoplicatura","C":"Substitui completamente a manometria no diagnóstico","D":"É particularmente vantajoso no subtipo III (espástico), por permitir miotomia mais longa, mas associa-se a maior incidência de DRGE, por não incluir fundoplicatura"},"ok":"O POEM cria um túnel submucoso que permite estender a miotomia proximalmente pelo corpo esofágico — vantagem decisiva no subtipo III (espástico) de Chicago, em que a doença acomete o corpo e não apenas o esfíncter. Seu principal inconveniente é a maior incidência de refluxo gastroesofágico (30 a 50%), porque, ao contrário da miotomia de Heller, não se associa fundoplicatura.","w":{"A":"Inverte: o tipo III é justamente a melhor indicação.","B":"Inverte: o refluxo é maior no POEM.","C":"O POEM é tratamento, não substitui o diagnóstico manométrico — que, aliás, é o que define o subtipo e orienta a escolha entre POEM e Heller."},"p":["Escolha terapêutica na acalasia: tipo I e II → Heller com fundoplicatura parcial (Dor ou Toupet), POEM ou dilatação pneumática. Tipo III → POEM preferencialmente. Pacientes sem condições cirúrgicas → toxina botulínica (efeito de 6 a 12 meses). Todo paciente pós-POEM deve receber IBP e ser vigiado para esofagite."],"f":"ACG Clinical Guideline — Diagnosis and Management of Achalasia; Chicago Classification v4.0; Sabiston, 21ª ed., cap. 42."},{"v":"Vol. III (autorais)","c":11,"n":5,"g":"A","s":["Paciente de 63 anos submetido a esofagectomia trans-hiatal evolui no 6º pós- operatório com febre, taquicardia, drenagem cervical purulenta e enfisema subcutâneo cervical. Qual o diagnóstico mais provável e a conduta inicial?"],"a":{"A":"Fístula da anastomose cervical; abertura da incisão cervical, drenagem ampla, jejum e suporte nutricional, com boa chance de resolução conservadora","B":"Fístula da anastomose torácica; toracotomia de urgência","C":"Quilotórax; ligadura do ducto torácico","D":"Necrose do conduto gástrico; ressecção imediata e esofagostomia"},"ok":"A fístula da anastomose cervical é a complicação mais frequente da esofagectomia trans-hiatal (incidência de 10 a 25%). Sua grande vantagem sobre a fístula intratorácica é o prognóstico: drena para o pescoço, não contamina o mediastino de forma catastrófica e habitualmente resolve com tratamento conservador — abertura da incisão, drenagem, jejum e nutrição enteral por jejunostomia.","w":{"B":"A anastomose descrita é cervical (esofagectomia trans-hiatal), e não há indicação de toracotomia com essa apresentação.","C":"O quilotórax cursa com drenagem torácica leitosa de alto débito, rica em triglicerídeos, sem purulência cervical.","D":"A necrose do conduto gástrico é catastrófica e cursa com sepse grave, drenagem escurecida e endoscopia demonstrando mucosa necrótica — cenário mais dramático que o descrito, e o diagnóstico exige confirmação endoscópica antes de ressecar."},"p":["Comparação das técnicas: trans-hiatal (McKeown modificada, anastomose cervical) — mais fístula, porém de manejo mais simples, e maior risco de lesão do laríngeo recorrente. Ivor Lewis (anastomose torácica) — menos fístula, mas quando ocorre é mediastinite grave, com mortalidade elevada."],"f":"Sabiston, 21ª ed., cap. 42; NCCN Guidelines; literatura sobre complicações da esofagectomia."},{"v":"Vol. III (autorais)","c":11,"n":6,"g":"C","s":["Paciente com câncer de esôfago irressecável (T4b), com disfagia grave, ECOG 2, sem condições de tratamento curativo. Qual a melhor opção para paliação da disfagia?"],"a":{"A":"Gastrostomia endoscópica percutânea isolada","B":"Dilatação endoscópica seriada como medida definitiva","C":"Prótese esofágica autoexpansível, associada ou não a quimiorradioterapia paliativa","D":"Esofagectomia paliativa"},"ok":"A prótese esofágica autoexpansível proporciona alívio imediato e duradouro da disfagia, restaurando a alimentação por via oral — o que tem impacto direto sobre qualidade de vida e dignidade nos meses finais. É o padrão de paliação da disfagia maligna, podendo ser combinada com quimiorradioterapia paliativa.","w":{"A":"A gastrostomia resolve a nutrição, mas não devolve a deglutição — o paciente continua sem poder engolir a própria saliva e sem comer, o que é um desfecho psicológico e social muito diferente.","B":"A dilatação isolada tem efeito de curta duração (dias a poucas semanas), exige repetições frequentes e traz risco de perfuração.","D":"Esofagectomia paliativa é operação de altíssima morbimortalidade sem ganho oncológico — não se justifica."},"p":["Cuidado com a combinação prótese + radioterapia: aumenta o risco de fístula e de migração. A sequência e a indicação devem ser individualizadas em discussão multidisciplinar."],"f":"NCCN Guidelines — Esophageal Cancer, seção de paliação; ESGE Guideline on esophageal stenting; Sabiston, 21ª ed., cap. 42."},{"v":"Vol. III (autorais)","c":11,"n":7,"g":"B","s":["Sobre a estenose péptica do esôfago, assinale a correta:"],"a":{"A":"É indicação absoluta de esofagectomia","B":"Trata-se com dilatação endoscópica associada a IBP em dose plena; biópsias devem ser realizadas para excluir malignidade","C":"Não requer biópsia, pois a origem péptica é evidente pela história","D":"A cirurgia antirrefluxo está contraindicada nesses pacientes"},"ok":"A estenose péptica é complicação da DRGE de longa data. O tratamento combina dilatação endoscópica (com velas de Savary ou balão) e IBP em dose plena, que reduz a recorrência da estenose de forma significativa. As biópsias são obrigatórias — toda estenose esofágica deve ter malignidade excluída, e o adenocarcinoma sobre Barrett é exatamente o diagnóstico que não se pode perder.","w":{"A":"A esofagectomia é reservada às estenoses refratárias a múltiplas dilatações, com esôfago não funcionante.","C":"Confiar na história sem biopsiar é o erro clínico mais perigoso desse cenário.","D":"A cirurgia antirrefluxo não é contraindicada; ao contrário, pode ser indicada após a dilatação, para controlar o refluxo que originou a estenose."},"p":["A dilatação deve ser gradual, respeitando a regra dos três (não mais de três velas consecutivas com resistência em uma mesma sessão), para reduzir o risco de perfuração."],"f":"Sabiston, 21ª ed., cap. 42; ASGE Guideline on the role of endoscopy in benign esophageal strictures."},{"v":"Vol. III (autorais)","c":11,"n":8,"g":"D","s":["Sobre a linfadenectomia na esofagectomia por câncer, assinale a correta:"],"a":{"A":"A linfadenectomia não influencia o prognóstico","B":"A dissecção em 1 campo (abdominal) é suficiente para tumores de terço médio","C":"A dissecção em 3 campos inclui abdome, tórax e pelve","D":"A dissecção em 3 campos inclui abdome, tórax e cervical, sendo mais utilizada em carcinoma epidermoide de terço médio e superior, pela drenagem linfática longitudinal do esôfago"},"ok":"A drenagem linfática do esôfago é longitudinal e submucosa, sem barreiras segmentares, o que permite metástases linfonodais distantes do tumor primário — inclusive cervicais em tumores torácicos. A dissecção em 3 campos compreende abdome, tórax e pescoço, e é mais empregada no carcinoma epidermoide de terço médio e superior, sobretudo em centros orientais.","w":{"A":"A adequação da linfadenectomia correlaciona-se com estadiamento correto e com sobrevida.","B":"A dissecção em 1 campo é insuficiente para tumores de terço médio, que exigem pelo menos 2 campos (abdome e tórax).","C":"Erra o terceiro campo: é cervical, não pélvico — o esôfago não drena para a pelve."},"p":["O número mínimo de linfonodos recomendado varia conforme a diretriz, mas cifras em torno de 15 a 20 são frequentemente citadas para estadiamento adequado."],"f":"Sabiston, 21ª ed., cap. 42; NCCN Guidelines; Japanese Esophageal Society guidelines."},{"v":"Vol. III (autorais)","c":11,"n":9,"g":"A","s":["Paciente com adenocarcinoma de esôfago distal T1a (limitado à mucosa), bem diferenciado, sem invasão linfovascular, lesão de 12 mm. Qual a conduta mais adequada?"],"a":{"A":"Ressecção endoscópica (mucosectomia ou dissecção submucosa), seguida de ablação do Barrett remanescente","B":"Esofagectomia trans-hiatal","C":"Quimiorradioterapia definitiva","D":"Vigilância endoscópica semestral, sem tratamento"},"ok":"O adenocarcinoma T1a (intramucoso), bem diferenciado, sem invasão linfovascular e de pequenas dimensões, tem risco de metástase linfonodal inferior a 2%. Por isso, a ressecção endoscópica é curativa e é a conduta de escolha, com preservação do órgão. Completa-se com ablação por radiofrequência do Barrett remanescente, para eliminar o campo de risco.","w":{"B":"A esofagectomia, com mortalidade de 2 a 5% e morbidade importante, é desproporcional a uma lesão com risco linfonodal quase nulo. Ela entra a partir do T1b (submucosa), em que o risco linfonodal sobe para 20 a 25%.","C":"A quimiorradioterapia definitiva não se aplica a doença precoce ressecável endoscopicamente.","D":"Vigilância sem tratamento diante de adenocarcinoma estabelecido é conduta inadequada."},"p":["A diferença entre T1a e T1b é a linha divisória mais importante do câncer precoce de esôfago: T1a → endoscopia; T1b → cirurgia."],"f":"ACG Clinical Guideline — Barrett's Esophagus; NCCN Guidelines — Esophageal Cancer; Sabiston, 21ª ed., cap. 42."},{"v":"Vol. III (autorais)","c":11,"n":10,"g":"C","s":["Sobre a fundoplicatura no tratamento cirúrgico da DRGE, assinale a correta:"],"a":{"A":"A fundoplicatura total (Nissen) está indicada mesmo em pacientes com aperistalse esofágica","B":"A fundoplicatura parcial apresenta maior taxa de disfagia pós-operatória que a total","C":"A escolha entre fundoplicatura total e parcial depende da motilidade esofágica avaliada por manometria; em dismotilidade importante, prefere-se a parcial","D":"A recidiva do refluxo após fundoplicatura é praticamente inexistente"},"ok":"A manometria pré-operatória é obrigatória justamente para essa decisão. Em paciente com motilidade preservada, a fundoplicatura total (Nissen, 360°) oferece o melhor controle do refluxo. Em dismotilidade importante, uma válvula total gera resistência que o esôfago fraco não vence, causando disfagia — por isso se prefere a parcial (Toupet 270° posterior ou Dor 180° anterior).","w":{"A":"É exatamente o cenário em que a total está contraindicada. Aperistalse levanta ainda a suspeita de acalasia, que deve ser excluída.","B":"Inverte: a disfagia pós-operatória é mais frequente na fundoplicatura total.","D":"A recidiva de refluxo após fundoplicatura ocorre em cerca de 10 a 20% em 10 anos, e parte dos pacientes retorna ao uso de IBP."},"p":["Complicações da fundoplicatura: disfagia (geralmente transitória), síndrome de \"gas bloat\" (incapacidade de eructar e distensão), deslizamento da válvula, herniação e recidiva."],"f":"SAGES Guidelines for the surgical treatment of GERD; Sabiston, 21ª ed., cap. 42."},{"v":"Vol. III (autorais)","c":12,"n":1,"g":"B","s":["Paciente com adenocarcinoma gástrico precoce, lesão elevada de 18 mm no antro, bem diferenciado, restrito à mucosa, sem ulceração e sem invasão linfovascular à ecoendoscopia. Qual a conduta mais adequada?"],"a":{"A":"Gastrectomia subtotal com linfadenectomia D2","B":"Dissecção endoscópica submucosa (ESD), com avaliação dos critérios de cura no anatomopatológico","C":"Quimioterapia neoadjuvante seguida de cirurgia","D":"Vigilância endoscópica semestral"},"ok":"A lesão preenche os critérios expandidos para ressecção endoscópica: adenocarcinoma bem diferenciado, restrito à mucosa (T1a), sem ulceração, sem invasão linfovascular. Nessas condições, o risco de metástase linfonodal é próximo de zero e a dissecção endoscópica submucosa (ESD) é curativa, com preservação do órgão. O anatomopatológico da peça define se a ressecção foi curativa (margens livres, sem invasão profunda).","w":{"A":"A gastrectomia D2 é conduta correta para lesões que não preenchem critérios endoscópicos, mas aqui seria desproporcional.","C":"Neoadjuvância é para doença localmente avançada (T2+ ou N+).","D":"Vigilância sem tratamento diante de adenocarcinoma diagnosticado é conduta inadequada."},"p":["Critérios japoneses (expandidos) para ESD no câncer gástrico precoce: bem diferenciado, T1a, sem ulceração (qualquer tamanho) ou com ulceração e ≤ 3 cm; ou indiferenciado, T1a, sem ulceração e ≤ 2 cm. Sempre sem invasão linfovascular."],"f":"Japanese Gastric Cancer Treatment Guidelines (JGCA); NCCN Guidelines — Gastric Cancer; Sabiston, 21ª ed., cap. 49."},{"v":"Vol. III (autorais)","c":12,"n":2,"g":"C","s":["Paciente com adenocarcinoma gástrico metastático, HER2 positivo (3+ à imuno- histoquímica). Qual a terapia sistêmica de primeira linha mais adequada?"],"a":{"A":"Quimioterapia isolada com FLOT","B":"Cetuximabe associado a quimioterapia","C":"Quimioterapia baseada em platina e fluoropirimidina associada a trastuzumabe","D":"Cirurgia citorredutora seguida de quimioterapia"},"ok":"O ensaio ToGA demonstrou que a adição de trastuzumabe (anticorpo monoclonal anti-HER2) à quimioterapia com platina e fluoropirimidina aumenta a sobrevida global no adenocarcinoma gástrico e de junção HER2- positivo metastático. Por isso a pesquisa de HER2 é obrigatória em toda doença avançada.","w":{"A":"O FLOT é esquema perioperatório para doença ressecável, não de primeira linha em metastático — e desperdiçaria o alvo terapêutico identificado.","B":"O cetuximabe é anti-EGFR, com papel no câncer colorretal RAS selvagem, não no gástrico HER2-positivo.","D":"A citorredução não é conduta padrão em doença metastática sistêmica; a cirurgia no metastático é essencialmente paliativa (sangramento, obstrução, perfuração)."},"p":["Outros marcadores que hoje se pesquisam no câncer gástrico avançado: PD-L1 (para imunoterapia com nivolumabe ou pembrolizumabe), instabilidade de microssatélites/MMR e CLDN18.2 (zolbetuximabe)."],"f":"Bang YJ et al., Lancet — ToGA trial; NCCN Guidelines — Gastric Cancer."},{"v":"Vol. III (autorais)","c":12,"n":3,"g":"A","s":["Durante laparoscopia de estadiamento de câncer gástrico T3N1, não se observam implantes macroscópicos, mas a citologia do lavado peritoneal é positiva para células neoplásicas. Como se classifica e qual a implicação?"],"a":{"A":"Citologia positiva (CY1) é classificada como M1, contraindicando a gastrectomia com intenção curativa isolada","B":"Citologia positiva não altera o estadiamento","C":"Citologia positiva classifica como N3","D":"Citologia positiva indica cirurgia imediata com intenção curativa"},"ok":"A citologia peritoneal positiva (CY1), mesmo sem implantes visíveis, é classificada como M1 pelo AJCC e pela JGCA. Traduz doença peritoneal microscópica, com prognóstico semelhante ao da carcinomatose macroscópica. Contraindica a gastrectomia com intenção curativa isolada; o tratamento é sistêmico, com reavaliação posterior em protocolos selecionados (alguns centros reoperam pacientes que convertem para CY0 após quimioterapia).","w":{"B":"Alterar o estadiamento é justamente o objetivo da laparoscopia com lavado.","C":"N3 refere-se a número de linfonodos comprometidos (≥ 7), não a citologia.","D":"Operar com intenção curativa em CY1 expõe o paciente a uma grande cirurgia sem benefício de sobrevida."},"p":["É por isso que a laparoscopia de estadiamento com lavado é recomendada em todo câncer gástrico clinicamente T3-T4 ou N+ candidato a tratamento curativo — ela evita 20 a 30% de laparotomias inúteis."],"f":"AJCC 8ª edição; Japanese Gastric Cancer Treatment Guidelines; NCCN Guidelines."},{"v":"Vol. III (autorais)","c":12,"n":4,"g":"D","s":["Paciente com linfoma gástrico MALT de baixo grau, H. pylori positivo, estádio IE","(limitado ao estômago), sem translocação t(11;18). Qual o tratamento inicial?"],"a":{"A":"Gastrectomia total","B":"Quimioterapia CHOP","C":"Radioterapia isolada","D":"Erradicação do H. pylori com esquema tríplice, com reavaliação endoscópica seriada"},"ok":"O linfoma MALT gástrico de baixo grau associado a H. pylori é um dos poucos tumores tratáveis com antibiótico. A erradicação da bactéria remove o estímulo antigênico que sustenta a proliferação linfoide, e produz remissão completa em 60 a 80% dos casos em estádio IE. O seguimento é endoscópico, com biópsias seriadas, e a resposta pode levar meses.","w":{"A":"A gastrectomia foi abandonada como tratamento de primeira linha; é reservada a complicações (perfuração, sangramento refratário).","B":"A quimioterapia se reserva a linfomas de alto grau (difuso de grandes células B), doença avançada ou falha da erradicação.","C":"A radioterapia é a segunda linha, indicada quando a erradicação falha ou quando o paciente é H. pylori negativo."},"p":["A translocação t(11;18) é o principal preditor de não resposta à erradicação — pacientes que a apresentam devem ser encaminhados diretamente à radioterapia ou quimioterapia."],"f":"NCCN Guidelines — B-Cell Lymphomas; Sabiston, 21ª ed., cap. 49; ESMO Guidelines on gastric MALT lymphoma."},{"v":"Vol. III (autorais)","c":12,"n":5,"g":"B","s":["Paciente com GIST gástrico de 8 cm, com 8 mitoses por 50 campos de grande aumento, ressecado com margens livres e sem ruptura tumoral. Qual a conduta adjuvante?"],"a":{"A":"Nenhuma; a ressecção completa é curativa em todos os GISTs","B":"Imatinibe adjuvante por 3 anos, dado o alto risco de recidiva","C":"Quimioterapia convencional com antraciclina","D":"Radioterapia adjuvante em campo gástrico"},"ok":"O risco de recidiva do GIST é estimado por tamanho, índice mitótico, localização e ruptura tumoral. Um tumor gástrico de 8 cm com 8 mitoses por 50 CGA é de alto risco. Nesses casos, o imatinibe adjuvante por 3 anos aumenta a sobrevida livre de recidiva e a sobrevida global, conforme o ensaio escandinavo-alemão SSGXVIII.","w":{"A":"Verdadeiro apenas para GISTs de muito baixo e baixo risco.","C":"O GIST é resistente à quimioterapia convencional — foi justamente essa resistência que tornou o imatinibe uma revolução terapêutica.","D":"A radioterapia não tem papel adjuvante no GIST."},"p":["O GIST gástrico tem prognóstico melhor que o de intestino delgado com as mesmas características de tamanho e mitoses — a localização é variável independente do risco. Mutações e resposta: KIT éxon 11 (a mais comum, melhor resposta ao imatinibe), KIT éxon 9 (resposta com dose dobrada), PDGFRA D842V (resistente ao imatinibe; usa-se avapritinibe)."],"f":"Joensuu H et al., JAMA — SSGXVIII trial; NCCN Guidelines — GIST; Sabiston, 21ª ed., cap. 49."},{"v":"Vol. III (autorais)","c":12,"n":6,"g":"C","s":["Paciente submetido a gastrectomia subtotal com reconstrução a Billroth II apresenta, 20 minutos após as refeições, taquicardia, sudorese, palpitações, dor abdominal em cólica e diarreia. Qual o diagnóstico e a conduta inicial?"],"a":{"A":"Síndrome da alça aferente; conversão cirúrgica em Y de Roux","B":"Dumping tardio; suplementação de carboidrato simples","C":"Dumping precoce; medidas dietéticas — refeições fracionadas, restrição de carboidratos simples, separação de líquidos e sólidos, decúbito após as refeições","D":"Gastrite alcalina de refluxo; colestiramina"},"ok":"O dumping precoce ocorre 15 a 30 minutos após a refeição e decorre da chegada rápida de conteúdo hiperosmolar ao delgado, que atrai água para a luz, gerando distensão, hipovolemia relativa e liberação de peptídeos vasoativos. Daí a combinação de sintomas vasomotores (taquicardia, sudorese, palpitações, tontura) e gastrointestinais (cólica, diarreia). O tratamento é inicialmente dietético, eficaz na grande maioria.","w":{"A":"A síndrome da alça aferente cursa com dor pós-prandial aliviada por vômito bilioso em jato, sem alimento, e não com sintomas vasomotores.","B":"O dumping tardio ocorre 1 a 3 horas após a refeição, por hipoglicemia reativa — hiperinsulinemia desencadeada pelo pico glicêmico anterior. Aí sim se corrige com carboidrato, mas o quadro descrito é precoce.","D":"A gastrite alcalina cursa com dor epigástrica contínua em queimação e vômito bilioso que não alivia a dor."},"p":["Refratários ao tratamento dietético: acrescentar acarbose (para o tardio), goma-guar, e octreotide nos casos graves; a conversão cirúrgica em Y de Roux é o último recurso."],"f":"Sabiston, 21ª ed., cap. 49; UpToDate — Postgastrectomy complications."},{"v":"Vol. III (autorais)","c":12,"n":7,"g":"A","s":["Mulher de 28 anos, com mutação germinativa em CDH1 e história familiar de câncer gástrico difuso em três parentes de primeiro grau. Endoscopia com biópsias múltiplas normal. Qual a conduta recomendada?"],"a":{"A":"Gastrectomia total profilática, a ser discutida a partir dos 20 a 30 anos","B":"Vigilância endoscópica anual indefinidamente, sem cirurgia","C":"Gastrectomia subtotal profilática","D":"Nenhuma conduta, pois as biópsias foram normais"},"ok":"A síndrome do câncer gástrico difuso hereditário decorre de mutação germinativa em CDH1 (gene da E-caderina) e tem penetrância elevada — risco cumulativo de 60 a 70% em homens e 55 a 80% em mulheres. Como as lesões são submucosas e multifocais, as biópsias endoscópicas frequentemente são falso-negativas, e a vigilância é pouco confiável. Por isso se recomenda gastrectomia total profilática entre os 20 e os 30 anos.","w":{"B":"A vigilância é oferecida apenas a quem recusa a cirurgia ou a adia, e é reconhecidamente insuficiente.","C":"A gastrectomia subtotal deixaria mucosa gástrica em risco — o gene atua em todo o órgão. A ressecção precisa ser total, com margem proximal em mucosa esofágica.","D":"Biópsias normais não excluem doença nesse contexto, e essa é justamente a armadilha da questão."},"p":["Mulheres com CDH1 têm também risco elevado de carcinoma lobular de mama, e devem ser vigiadas com ressonância mamária a partir dos 30 anos."],"f":"International Gastric Cancer Linkage Consortium guidelines; NCCN Guidelines — Genetic/Familial High-Risk Assessment: Gastric; Sabiston, 21ª ed., cap. 49."},{"v":"Vol. III (autorais)","c":12,"n":8,"g":"D","s":["Sobre as margens cirúrgicas na gastrectomia por adenocarcinoma, assinale a correta:"],"a":{"A":"A margem proximal de 1 cm é suficiente em todos os casos","B":"A margem distal é a única que importa oncologicamente","C":"Não há necessidade de exame de congelação intraoperatório","D":"Recomenda-se margem proximal de 3 a 5 cm no tipo intestinal e de 5 a 8 cm no tipo difuso, com exame de congelação quando houver dúvida"},"ok":"A margem proximal é a mais crítica, e depende do subtipo de Lauren. O tipo intestinal, de crescimento expansivo e bem delimitado, permite margem de 3 a 5 cm. O tipo difuso, de crescimento infiltrativo com extensão submucosa muito além do que se vê macroscopicamente, exige margem de 5 a 8 cm. Quando a margem é limítrofe, o exame de congelação intraoperatório orienta a extensão da ressecção.","w":{"A":"Um centímetro é insuficiente, especialmente no tipo difuso.","B":"A margem proximal é justamente a mais problemática, por limitar a possibilidade de gastrectomia subtotal.","C":"A congelação é ferramenta importante e recomendada em margens duvidosas."},"p":["Consequência prática: em tumor de corpo ou de tipo difuso, a necessidade de margem ampla frequentemente converte uma gastrectomia subtotal planejada em total."],"f":"Japanese Gastric Cancer Treatment Guidelines; NCCN Guidelines; Sabiston, 21ª ed., cap. 49."},{"v":"Vol. III (autorais)","c":12,"n":9,"g":"B","s":["Paciente com adenocarcinoma gástrico avançado apresenta ascite volumosa, implantes peritoneais múltiplos à laparoscopia e nódulo umbilical palpável. Como se denomina esse nódulo e qual sua implicação?"],"a":{"A":"Sinal de Blumer; indica doença ressecável","B":"Nódulo de irmã Maria José; indica carcinomatose peritoneal, doença M1","C":"Sinal de Courvoisier; indica obstrução biliar benigna","D":"Nódulo de Virchow; indica acometimento hepático"},"ok":"O nódulo da irmã Maria José é a metástase periumbilical por disseminação peritoneal ou pelo ligamento falciforme. É sinal de doença M1, com prognóstico reservado. Foi descrito pela irmã Mary Joseph Dempsey, assistente cirúrgica de William Mayo, que notou a associação entre o nódulo e a malignidade abdominal avançada.","w":{"A":"A prateleira de Blumer é o implante no fundo de saco retovesical ou retouterino, palpável ao toque retal — também é sinal de carcinomatose, mas não é o nódulo umbilical.","C":"O sinal de Courvoisier é a vesícula palpável indolor em icterícia obstrutiva neoplásica periampular.","D":"O linfonodo de Virchow é o supraclavicular esquerdo, e indica disseminação linfática, não hepática."},"p":["Os quatro sinais de doença gástrica avançada, para decorar: Virchow (supraclavicular esquerdo), irmã Maria José (umbilical), Blumer (fundo de saco ao toque retal) e Krukenberg (metástase ovariana bilateral com células em anel de sinete)."],"f":"Sabiston, 21ª ed., cap. 49; NCCN Guidelines."},{"v":"Vol. III (autorais)","c":12,"n":10,"g":"C","s":["Sobre a esplenectomia e a pancreatectomia distal associadas à gastrectomia D2, segundo a evidência atual:"],"a":{"A":"Devem ser realizadas rotineiramente, para garantir a dissecção da estação 10","B":"A esplenectomia melhora a sobrevida em tumores distais","C":"Não devem ser realizadas rotineiramente, pois aumentam a morbimortalidade sem ganho de sobrevida; reservam-se aos casos de invasão direta","D":"A pancreatectomia distal é obrigatória para acessar a estação 11"},"ok":"Este é um dos capítulos mais importantes da história da cirurgia gástrica. Os ensaios ocidentais iniciais (holandês e britânico) mostraram maior mortalidade com a D2 — mas a análise posterior atribuiu esse excesso à esplenectomia e à pancreatectomia distal realizadas de rotina, e não à linfadenectomia em si. Ao se abandonar a ressecção rotineira desses órgãos, a D2 passou a ter morbimortalidade aceitável e benefício de sobrevida em longo prazo, tornando-se o padrão.","w":{"A":"A estação 10 (hilo esplênico) pode ser dissecada com preservação do baço em mãos experientes, e o ensaio japonês JCOG0110 mostrou que a esplenectomia não traz benefício em tumores que não acometem a grande curvatura proximal.","B":"Não há qualquer racional para esplenectomia em tumor distal — as estações 10 e 11 nem sequer são o território de drenagem principal.","D":"A dissecção da estação 11 (artéria esplênica) é feita ao longo do vaso, sem necessidade de ressecar o pâncreas."},"p":["Interseção com o Caso 1: pacientes esplenectomizados exigem vacinação contra encapsuladas — pneumococo, meningococo e Hib."],"f":"Songun I et al., Lancet Oncol — Dutch D1D2 trial, seguimento de 15 anos; Sano T et al., Ann Surg — JCOG0110; Japanese Gastric Cancer Treatment Guidelines."},{"v":"Vol. III (autorais)","c":13,"n":1,"g":"B","s":["No 5º dia de pós-operatório de duodenopancreatectomia, o dreno peripancreático apresenta débito de 150 mL com amilase 12.000 U/L (mais de 3 vezes o limite superior sérico). O paciente está afebril, tolerando dieta, sem repercussão clínica. Como se classifica e qual a conduta?"],"a":{"A":"Fístula pancreática grau C; reoperação imediata","B":"Fístula bioquímica (antiga grau A); manter o dreno, observar, sem necessidade de mudança na conduta clínica","C":"Fístula grau B; iniciar antibiótico e nutrição parenteral","D":"Deiscência de anastomose biliar; CPRE"},"ok":"Pela classificação atualizada do ISGPS (2016), a elevação isolada da amilase no dreno acima de 3 vezes o limite superior sérico, sem repercussão clínica, não é mais chamada de fístula grau A, e sim \"fuga bioquímica\" — porque não altera o manejo nem o desfecho. A conduta é manter o dreno e observar.","w":{"A":"O grau C implica falência orgânica, sepse ou necessidade de reoperação — nada disso está presente.","C":"O grau B implica mudança no manejo: manutenção prolongada do dreno, drenagem percutânea adicional, antibiótico, nutrição parenteral ou embolização por sangramento — também ausente aqui.","D":"A fístula biliar teria débito com aspecto bilioso e bilirrubina elevada no dreno, não amilase."},"p":["Fatores de risco para fístula pancreática: ducto pancreático fino (&lt; 3 mm) e parênquima mole (não fibrótico). Paradoxalmente, o pâncreas \"normal\" é o mais arriscado — o pâncreas fibrosado da pancreatite crônica segura melhor os pontos."],"f":"Bassi C et al., Surgery 2017 — ISGPS 2016 update on postoperative pancreatic fistula; Sabiston, 21ª ed., cap. 55."},{"v":"Vol. III (autorais)","c":13,"n":2,"g":"D","s":["Paciente no 10º dia de pós-operatório de duodenopancreatectomia com preservação pilórica mantém intolerância à dieta, com necessidade de sonda nasogástrica por vômitos. Sem coleções à TC e sem sinais de fístula. Qual o diagnóstico e a conduta?"],"a":{"A":"Fístula pancreática; reoperação","B":"Obstrução mecânica; laparotomia","C":"Recidiva tumoral precoce; quimioterapia","D":"Esvaziamento gástrico retardado; suporte com sonda, procinéticos, nutrição enteral pós-pilórica ou parenteral, com resolução espontânea na maioria dos casos"},"ok":"O esvaziamento gástrico retardado é a complicação mais frequente da duodenopancreatectomia (incidência de 20 a 40%), especialmente na variante com preservação pilórica. É diagnóstico de exclusão — exige TC sem coleções e sem obstrução mecânica. O tratamento é conservador: descompressão gástrica, procinéticos (eritromicina, metoclopramida) e suporte nutricional, com resolução espontânea na quase totalidade dos casos.","w":{"A":"Não há débito de amilase nem coleção descrita.","B":"A TC excluiu coleções, e a obstrução mecânica exigiria achado tomográfico de zona de transição.","C":"Recidiva no 10º dia de pós-operatório é implausível."},"p":["Classificação ISGPS do esvaziamento gástrico retardado: A — necessidade de sonda até o 7º dia ou reinserção após o 3º; B — até o 14º dia; C — além do 21º dia. O grau A não altera significativamente a internação; o C, sim."],"f":"Wente MN et al., Surgery — ISGPS definition of delayed gastric emptying; Sabiston, 21ª ed., cap. 55."},{"v":"Vol. III (autorais)","c":13,"n":3,"g":"A","s":["Mulher de 34 anos com episódios recorrentes de confusão mental, sudorese e alívio dos sintomas após ingestão de alimentos. Glicemia de 38 mg/dL durante crise, com insulina e peptídeo C elevados, e pesquisa de sulfonilureia negativa. Qual o diagnóstico e a conduta?"],"a":{"A":"Insulinoma; localização por TC/ecoendoscopia e ressecção (enucleação, se possível)","B":"Hipoglicemia factícia por insulina exógena; acompanhamento psiquiátrico","C":"Insuficiência adrenal; reposição de corticoide","D":"Diabetes tipo 1 mal controlado; ajuste de insulina"},"ok":"A tríade de Whipple está completa: sintomas de hipoglicemia, glicemia documentada baixa e alívio com glicose. O peptídeo C elevado confirma produção endógena de insulina, e a pesquisa negativa de sulfonilureia exclui a causa medicamentosa. O diagnóstico é insulinoma, e o tratamento é cirúrgico — enucleação quando o tumor é pequeno, superficial e distante do ducto principal; pancreatectomia distal ou duodenopancreatectomia conforme a localização.","w":{"B":"Na hipoglicemia por insulina exógena, o peptídeo C estaria suprimido, porque a insulina administrada não vem acompanhada dele.","C":"A insuficiência adrenal causaria hipoglicemia, mas com insulina e peptídeo C baixos, além de hipotensão e hiponatremia.","D":"O diabetes tipo 1 cursa com hiperglicemia de base e peptídeo C indetectável."},"p":["O insulinoma é o TNE pancreático funcionante mais comum, benigno em cerca de 90%, geralmente menor que 2 cm e solitário. Sua localização pode ser difícil: ecoendoscopia e ultrassonografia intraoperatória são as ferramentas mais sensíveis."],"f":"Sabiston, 21ª ed., cap. 55; NCCN Guidelines — Neuroendocrine Tumors; Endocrine Society Guideline on hypoglycemic disorders."},{"v":"Vol. III (autorais)","c":13,"n":4,"g":"C","s":["Paciente com insulinoma apresenta também hiperparatireoidismo primário e adenoma hipofisário. Qual a síndrome e qual a implicação cirúrgica?"],"a":{"A":"NEM-2A; realizar tireoidectomia total profilática","B":"Síndrome de Von Hippel-Lindau; ressecção renal","C":"NEM-1 (síndrome de Wermer); os tumores pancreáticos tendem a ser multifocais, exigindo abordagem cirúrgica diferenciada e rastreamento familiar","D":"Complexo de Carney; ressecção cardíaca"},"ok":"A tríade paratireoide, pâncreas e hipófise — os \"3 P\" — define a NEM-1 (síndrome de Wermer), causada por mutação no gene MEN1 (menina). A implicação cirúrgica é decisiva: os tumores neuroendócrinos pancreáticos na NEM-1 são multifocais, o que torna a enucleação isolada insuficiente e frequentemente exige pancreatectomia mais extensa ou abordagem combinada, além de vigilância vitalícia.","w":{"A":"A NEM-2A é composta por carcinoma medular de tireoide, feocromocitoma e hiperparatireoidismo — a tireoidectomia profilática se aplica aos portadores de mutação RET, não ao quadro descrito.","B":"Von Hippel-Lindau cursa com hemangioblastomas, carcinoma renal de células claras, feocromocitoma e tumores neuroendócrinos pancreáticos — mas sem o adenoma hipofisário e o hiperparatireoidismo do enunciado.","D":"O complexo de Carney envolve mixomas cardíacos, lentiginose e hiperatividade endócrina, quadro distinto."},"p":["Regra de ordem cirúrgica: na NEM-1, trata-se primeiro o hiperparatireoidismo, porque a hipercalcemia agrava a secreção de","gastrina e os sintomas dos demais tumores. Na NEM-2, trata-se primeiro o feocromocitoma, antes de qualquer outra cirurgia."],"f":"Sabiston, 21ª ed., cap. 39 e cap. 55; Endocrine Society Clinical Practice Guideline — Multiple Endocrine Neoplasia Type 1."},{"v":"Vol. III (autorais)","c":13,"n":5,"g":"B","s":["Paciente de 66 anos com IPMN de ramo secundário de 2,2 cm na cauda pancreática, sem nódulo mural, sem dilatação do ducto principal, sem icterícia e com CA 19-9 normal. Qual a conduta?"],"a":{"A":"Pancreatectomia distal imediata","B":"Vigilância com ressonância/colangiorressonância e ecoendoscopia em intervalos definidos, com cirurgia se surgirem estigmas de alto risco ou características preocupantes","C":"Drenagem endoscópica do cisto","D":"Alta sem seguimento"},"ok":"O IPMN de ramo secundário tem risco de malignidade bem inferior ao de ducto principal (5 a 15% contra 40 a 70%). Uma lesão de 2,2 cm sem nódulo mural, sem dilatação ductal, sem icterícia e com marcador normal não apresenta nem estigmas de alto risco nem características preocupantes — a conduta é vigilância.","w":{"A":"A pancreatectomia distal tem morbidade relevante (fístula, diabetes) e não se justifica sem indicação.","C":"Drenar uma neoplasia mucinosa é erro conceitual: não é pseudocisto, e a drenagem pode disseminar células.","D":"Alta sem seguimento ignora o potencial evolutivo da lesão."},"p":["Estigmas de alto risco (cirurgia): icterícia obstrutiva com lesão cefálica, componente sólido com realce, ducto principal ≥ 10 mm. Características preocupantes (ecoendoscopia): cisto ≥ 3 cm, parede espessada com realce, ducto de 5–9 mm, nódulo mural sem realce, mudança abrupta de calibre com atrofia distal, linfadenopatia, CA 19- 9 elevado, pancreatite, crescimento ≥ 5 mm em 2 anos."],"f":"Fukuoka/Kyoto International Consensus Guidelines for IPMN and MCN; European evidence-based guidelines on pancreatic cystic neoplasms."},{"v":"Vol. III (autorais)","c":13,"n":6,"g":"D","s":["Paciente submetido a duodenopancreatectomia por adenocarcinoma pancreático, com margens livres (R0) e 2 de 18 linfonodos comprometidos, ECOG 0. Qual a conduta adjuvante?"],"a":{"A":"Nenhuma, pois a ressecção foi R0","B":"Radioterapia isolada","C":"Imunoterapia com pembrolizumabe","D":"Quimioterapia adjuvante — mFOLFIRINOX em pacientes com bom performance status, ou gencitabina com capecitabina como alternativa"},"ok":"A quimioterapia adjuvante é padrão após ressecção de adenocarcinoma pancreático, mesmo com margens livres, porque a taxa de recidiva sem tratamento sistêmico é altíssima. O ensaio PRODIGE-24/CCTG PA.6 mostrou sobrevida global mediana de 54 meses com mFOLFIRINOX contra 35 meses com gencitabina, tornando-o o padrão em pacientes com bom performance status. A alternativa é gencitabina com capecitabina (ESPAC- 4).","w":{"A":"A ressecção R0 melhora o prognóstico, mas não dispensa a adjuvância.","B":"A radioterapia isolada não é padrão adjuvante; a quimiorradioterapia tem papel restrito e discutido, sobretudo em margem comprometida.","C":"A imunoterapia tem papel apenas no subgrupo raro com instabilidade de microssatélites/dMMR, que representa menos de 1% dos adenocarcinomas pancreáticos."},"p":["A adjuvância deve começar preferencialmente em até 8 a 12 semanas da cirurgia, o que exige recuperação pós-operatória adequada — outro argumento a favor da neoadjuvância em casos limítrofes, já que ela garante que o paciente receba tratamento sistêmico."],"f":"Conroy T et al., NEJM — PRODIGE 24/CCTG PA.6; Neoptolemos JP et al., Lancet — ESPAC-4; NCCN Guidelines."},{"v":"Vol. III (autorais)","c":13,"n":7,"g":"A","s":["Paciente com adenocarcinoma de cabeça de pâncreas irressecável, com icterícia obstrutiva e obstrução duodenal sintomática, ECOG 1, expectativa de vida estimada em meses. Qual a melhor paliação?"],"a":{"A":"Prótese biliar metálica endoscópica associada a prótese duodenal (ou derivação cirúrgica dupla em pacientes selecionados com melhor expectativa)","B":"Duodenopancreatectomia paliativa","C":"Radioterapia isolada","D":"Observação com analgesia"},"ok":"A paliação da obstrução dupla — biliar e duodenal — pode ser feita por via endoscópica (prótese metálica biliar e prótese duodenal enteral), preferível em pacientes com expectativa de vida mais curta ou pior performance, ou por derivação cirúrgica dupla (hepaticojejunostomia com gastrojejunostomia), preferível quando a expectativa é maior e a durabilidade importa.","w":{"B":"O Whipple paliativo tem morbimortalidade alta e nenhum ganho oncológico em doença irressecável.","C":"A radioterapia isolada não alivia obstrução mecânica de forma confiável nem rápida.","D":"Observação em paciente com icterícia e obstrução duodenal é conduta inaceitável."},"p":["Complete a paliação com o controle da dor: opioides em escalada e, na dor visceral refratária, neurólise do plexo celíaco (por ecoendoscopia ou percutânea), que reduz o consumo de opioide e melhora a qualidade de vida."],"f":"NCCN Guidelines — Pancreatic Adenocarcinoma; Sabiston, 21ª ed., cap. 55."},{"v":"Vol. III (autorais)","c":13,"n":8,"g":"C","s":["Como diferenciar uma massa inflamatória de pancreatite crônica de um adenocarcinoma da cabeça do pâncreas?"],"a":{"A":"A dosagem de CA 19-9 isolada é suficiente para o diagnóstico diferencial","B":"A presença de calcificações exclui completamente a neoplasia","C":"Nenhum método isolado é definitivo; combina-se imagem (TC com protocolo pancreático, ressonância), marcadores, ecoendoscopia com punção e, em casos duvidosos, exploração cirúrgica — o sinal do ducto duplo favorece neoplasia","D":"A ausência de icterícia exclui a neoplasia"},"ok":"Essa distinção é um dos maiores desafios da cirurgia pancreática, e a razão pela qual uma parcela dos Whipples realizados por suspeita de câncer revela doença benigna. Nenhum exame isolado resolve: combina-se imagem, marcadores, ecoendoscopia com punção (mais sensível que a punção percutânea e sem risco de disseminação no trajeto) e, permanecendo a dúvida em lesão ressecável, a exploração cirúrgica é justificável. O sinal do ducto duplo — dilatação simultânea do colédoco e do ducto pancreático — favorece fortemente neoplasia.","w":{"A":"O CA 19-9 se eleva em colestase benigna e em pancreatite, e pode ser normal em Lewis-negativos.","B":"Calcificações favorecem pancreatite crônica, mas não excluem neoplasia — e, aliás, a pancreatite crônica é fator de risco para câncer de pâncreas.","D":"Massas de corpo e cauda não causam icterícia, e nem toda lesão cefálica obstrui precocemente."},"p":["Interseção com a questão 7 do Caso 9 (Volume III): a pancreatite autoimune é outro grande simulador — sempre considere IgG4 antes de indicar um Whipple por massa sem diagnóstico histológico."],"f":"Sabiston, 21ª ed., cap. 55; NCCN Guidelines; literatura sobre diagnóstico diferencial de massas pancreáticas."},{"v":"Vol. III (autorais)","c":13,"n":9,"g":"B","s":["Sobre os tumores neuroendócrinos pancreáticos não funcionantes, assinale a correta:"],"a":{"A":"São sempre benignos, não requerendo tratamento","B":"Representam hoje a maioria dos TNE pancreáticos, frequentemente diagnosticados de forma incidental; a conduta depende de tamanho, grau (Ki-67) e estadiamento, podendo variar de vigilância a ressecção","C":"Devem ser tratados com quimioterapia convencional em todos os casos","D":"São mais agressivos que o adenocarcinoma ductal"},"ok":"Com a disseminação de exames de imagem, os TNE não funcionantes passaram a ser os mais frequentes, muitas vezes achados incidentais. A conduta é individualizada pelo tamanho (lesões abaixo de 2 cm, bem diferenciadas e assintomáticas podem ser vigiadas), pelo grau (índice Ki-67: G1 &lt; 3%, G2 3–20%, G3 &gt; 20%) e pelo estadiamento.","w":{"A":"\"Sempre benignos\" é absoluto falso: todos os TNE pancreáticos têm potencial maligno, ainda que variável.","C":"A quimioterapia convencional se reserva a tumores de alto grau e a carcinomas neuroendócrinos pouco diferenciados. Nos bem diferenciados, usam-se análogos de somatostatina, everolimo, sunitinibe e terapia com radionuclídeos (PRRT).","D":"Inverte o prognóstico: os TNE bem diferenciados têm sobrevida muito superior à do adenocarcinoma ductal, mesmo em doença metastática."},"p":["Diferença conceitual crucial: tumor neuroendócrino (NET) é bem diferenciado, graduado por Ki-67, com bom prognóstico relativo. Carcinoma neuroendócrino (NEC) é pouco diferenciado, de comportamento agressivo, tratado como tumor de pequenas células."],"f":"NCCN Guidelines — Neuroendocrine and Adrenal Tumors; ENETS Guidelines; WHO Classification 2019; Sabiston, 21ª ed., cap. 55."},{"v":"Vol. III (autorais)","c":13,"n":10,"g":"A","s":["Sobre a duodenopancreatectomia (Whipple), assinale a correta:"],"a":{"A":"São ressecados: cabeça do pâncreas, duodeno, primeiras alças jejunais, vesícula biliar e via biliar distal, com ou sem antrectomia; a reconstrução envolve pancreatojejunostomia, hepaticojejunostomia e gastro (ou duodeno) jejunostomia","B":"O baço é sempre ressecado em bloco","C":"O cólon transverso é rotineiramente ressecado","D":"A reconstrução envolve apenas uma anastomose"},"ok":"A duodenopancreatectomia remove um bloco anatômico definido por sua vascularização comum: cabeça do pâncreas e processo uncinado, duodeno, primeiras alças jejunais, vesícula biliar e via biliar distal, com antrectomia na variante clássica ou preservação pilórica na variante de Traverso-Longmire. A reconstrução exige três anastomoses: pancreatojejunostomia (a mais problemática, fonte da fístula pancreática), hepaticojejunostomia e gastrojejunostomia ou duodenojejunostomia.","w":{"B":"O baço não faz parte da peça — ele é ressecado na pancreatectomia distal (corpo e cauda), quando a esplênica é sacrificada.","C":"O cólon transverso só é ressecado se houver invasão direta.","D":"São três anastomoses, e essa multiplicidade é a razão da morbidade elevada do procedimento."},"p":["Mortalidade da duodenopancreatectomia em centros de alto volume: 2 a 5%. A morbidade permanece alta (30 a 50%), predominando fístula pancreática, esvaziamento gástrico retardado, hemorragia e infecção. O volume do centro é um dos determinantes mais fortes de desfecho."],"f":"Sabiston, 21ª ed., cap. 55; NCCN Guidelines; literatura sobre relação volume- desfecho em cirurgia pancreática."},{"v":"Vol. III (autorais)","c":14,"n":1,"g":"C","s":["Homem de 45 anos, assintomático, sem história familiar de câncer colorretal. Segundo as recomendações atuais de rastreamento populacional, quando deve iniciar e com qual método?"],"a":{"A":"Aos 60 anos, apenas com pesquisa de sangue oculto nas fezes","B":"Não há indicação de rastreamento em assintomáticos","C":"Aos 45 anos, com colonoscopia a cada 10 anos, ou testes de fezes em intervalos menores conforme o método","D":"Aos 45 anos, com enema opaco anual"},"ok":"As principais sociedades reduziram a idade de início do rastreamento de risco médio de 50 para 45 anos, diante do aumento da incidência de câncer colorretal em adultos jovens. As opções incluem colonoscopia a cada 10 anos (o padrão-ouro, por ser diagnóstica e terapêutica), teste imunoquímico fecal (FIT) anual, FIT-DNA a cada 1 a 3 anos, ou colonografia por TC a cada 5 anos.","w":{"A":"Sessenta anos é tardio, e a pesquisa de sangue oculto isolada não é a única opção.","B":"O câncer colorretal é doença prevenível pelo rastreamento, que interrompe a sequência adenoma-carcinoma pela polipectomia.","D":"O enema opaco caiu em desuso e não é opção de rastreamento anual."},"p":["História familiar muda a regra: parente de primeiro grau com câncer colorretal ou adenoma avançado → iniciar aos 40 anos ou 10 anos antes da idade do diagnóstico no familiar, o que vier primeiro, com intervalo de 5 anos."],"f":"USPSTF Recommendation Statement on Colorectal Cancer Screening; NCCN Guidelines — Colorectal Cancer Screening; ACS Guideline."},{"v":"Vol. III (autorais)","c":14,"n":2,"g":"A","s":["Paciente de 30 anos com centenas de pólipos adenomatosos ao longo de todo o cólon, com mutação germinativa em APC e história familiar. Qual a conduta cirúrgica recomendada?"],"a":{"A":"Proctocolectomia total com bolsa ileal e anastomose ileoanal, ou colectomia total com anastomose ileorretal em casos selecionados de poupança retal, com vigilância do reto remanescente","B":"Polipectomia endoscópica de
