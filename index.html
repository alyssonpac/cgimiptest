<style>
:root{--bg:#f6f7f9;--sf:#fff;--tx:#1b1f24;--mu:#6a737d;--bd:#dde1e6;--ac:#1565c0;--ok:#1b7f3b;--okb:#e3f4e8;--er:#b3261e;--erb:#fbe7e5;--wa:#8a5200;--wab:#fff0d6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181c;--sf:#1e2227;--tx:#e8eaed;--mu:#9aa3ad;--bd:#343a41;--ac:#7db4ff;--ok:#6fd48c;--okb:#17301f;--er:#ff8a80;--erb:#3a1b19;--wa:#ffcc80;--wab:#3a2c10}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px);color-scheme:light dark}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 -apple-system,system-ui,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:12px}
.tabs{display:flex;gap:6px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:8px 0;z-index:5}
.tabs button{flex:1;padding:11px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:10px;font-weight:600;font-size:15px}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.bar{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
select,input[type=search]{flex:1 1 140px;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--sf);color:var(--tx);font-size:14px;min-width:0}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:10px 0}
.meta{font-size:12px;color:var(--mu);margin-bottom:6px}
.stem p{margin:0 0 8px}
.alt{display:flex;gap:10px;width:100%;text-align:left;margin:7px 0;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--sf);color:var(--tx);font-size:15px}
.alt b{flex:0 0 22px}.alt.ok{background:var(--okb);border-color:var(--ok)}.alt.er{background:var(--erb);border-color:var(--er)}
.box{border-left:4px solid var(--ac);background:var(--bg);padding:10px 12px;margin:10px 0;border-radius:6px;font-size:15px}
.box h4{margin:0 0 4px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--mu)}
.box.wa{border-color:#e69100;background:var(--wab);color:var(--wa)}.box.ok{border-color:var(--ok)}
.nav{display:flex;gap:8px;align-items:center;margin:10px 0}
.nav button,.btn{padding:10px 14px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:10px;font-size:15px}
.nav .mid{flex:1;text-align:center;font-size:13px;color:var(--mu)}
.fc{min-height:210px;display:flex;flex-direction:column;justify-content:center;font-size:18px;cursor:pointer}
.fc .back{border-top:1px dashed var(--bd);margin-top:12px;padding-top:12px;font-size:16px}
.grade{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.grade button{padding:11px 4px;border-radius:10px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);font-size:14px}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;background:var(--wab);color:var(--wa);margin-left:6px}
.stat{font-size:13px;color:var(--mu);margin:4px 0}
.hide{display:none}
#nav{position:fixed;top:0;bottom:0;left:0;width:min(340px,88vw);background:var(--sf);border-right:1px solid var(--bd);overflow:auto;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px));transform:translateX(-102%);transition:transform .2s;z-index:20;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start}
#nav.open{transform:none;box-shadow:0 0 30px rgba(0,0,0,.3)}
#qbd{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:19}#qbd.open{display:block}
.nh{flex:0 0 100%;display:flex;justify-content:space-between;align-items:center}
.lg{flex:0 0 100%;font-size:12px;color:var(--mu);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ng{flex:0 0 100%;font-size:12px;font-weight:600;color:var(--mu);margin-top:8px}
.nb{width:52px;padding:8px 0;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font-size:13px}
.nb.ok,.s.ok{background:var(--okb);border-color:var(--ok);color:var(--ok)}
.nb.er,.s.er{background:var(--erb);border-color:var(--er);color:var(--er)}
.nb.cur{outline:2px solid var(--ac);outline-offset:1px;font-weight:700}
.s{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid var(--bd);background:var(--bg)}
@media(min-width:1100px){#nav{transform:none;z-index:1;box-shadow:none}#qbd{display:none!important}#qm,#nx{display:none}body.qon .wrap{margin-left:360px}}

<script>
const D={"q":[{"v":"Vol. I","c":1,"n":1,"g":"A","s":["A embolia pulmonar é uma complicação grave e evitável no pós-operatório. Qual das alternativas abaixo não é fator de risco para trombose venosa profunda?"],"a":{"A":"Cirurgia laparoscópica","B":"Insuficiência hepática","C":"Gravidez","D":"Diagnóstico de câncer"},"ok":"A cirurgia laparoscópica é a alternativa que menos se enquadra como fator de risco: por ser minimamente invasiva, associa-se a menor resposta inflamatória, deambulação precoce e internação curta, reduzindo a estase venosa. Vale a ressalva de que o pneumoperitônio e o Trendelenburg aumentam transitoriamente a estase em membros inferiores — por isso a videolaparoscopia não é \"protetora\", apenas é a opção de menor risco entre as quatro. Já a insuficiência hepática cursa com queda da síntese de fatores de coagulação (II, VII, IX, X) e prolongamento do INR, gerando tendência hemorrágica, e não trombótica.","w":{"B":"É a resposta que a banca considera errada aqui, mas atenção: a hepatopatia avançada também reduz a síntese de anticoagulantes naturais (proteínas C e S, antitrombina), gerando um \"reequilíbrio hemostático\" que pode até favorecer trombose portal. Para efeito de prova, entretanto, insuficiência hepática é tratada como não-fator de risco para TVP.","C":"Gravidez e puerpério são fatores de risco clássicos: hiperestrogenismo, compressão da veia cava pelo útero gravídico e aumento de fibrinogênio e fatores VII, VIII e X.","D":"Neoplasia maligna é um dos fatores de risco mais fortes (síndrome de Trousseau) — as células tumorais expressam fator tecidual e micropartículas pró-coagulantes."},"p":["Fatores de risco para TEV: câncer, obesidade, imobilização, cirurgia de grande porte, idade avançada, estrogênios, trombofilias, gravidez, TEV prévio. A mesma pergunta reaparece na questão 14 deste caso, com as alternativas reordenadas."],"f":"Sabiston, Textbook of Surgery, 21ª ed., cap. 5 (Hemostasia e trombose) — tríade de Virchow e estratificação de risco de TEV; escore de Caprini."},{"v":"Vol. I","c":1,"n":2,"g":"A","s":["O destino do lactato contido na solução de Ringer, utilizada como padrão em vítimas de traumatismo e no pós-operatório, é:"],"a":{"A":"Transforma-se em bicarbonato no fígado e ajuda a corrigir a acidose","B":"Transforma-se em fumarato e entra no ciclo de Krebs","C":"Transforma-se em ácido lático, que é um ácido fraco","D":"Transforma-se em glicose pela gliconeogênese hepática"},"ok":"O lactato do Ringer é metabolizado no fígado por duas vias — oxidação a piruvato e gliconeogênese. Em ambas há consumo de íons H⁺, o que gera bicarbonato como saldo líquido. Por isso o Ringer lactato tem efeito tampão discretamente alcalinizante e é preferível ao soro fisiológico 0,9% em grandes volumes, que causa acidose metabólica hiperclorêmica.","w":{"B":"Fumarato é intermediário do ciclo de Krebs, mas o lactato entra no metabolismo pela conversão a piruvato (lactato desidrogenase), não a fumarato.","C":"Inverte a química: o lactato já é a base conjugada, isto é, a forma dissociada do ácido lático. Um ânion não gera acidose ao ser metabolizado — ao contrário, consome H⁺.","D":"A gliconeogênese hepática (ciclo de Cori) realmente ocorre e é uma das vias, mas é uma resposta incompleta: a alternativa não menciona o efeito ácido-básico, que é o que a questão pergunta. A alternativa A descreve o desfecho clinicamente relevante."},"p":["Em hepatopata grave e em choque com hipoperfusão hepática, o clearance do lactato cai — nesses casos o Ringer lactato perde parte do efeito tampão e pode confundir a interpretação do lactato sérico como marcador de perfusão."],"f":"Sabiston, 21ª ed., cap. 4 (Reposição hidroeletrolítica no paciente cirúrgico). Diretriz de fluidoterapia perioperatória — preferência por cristaloides balanceados sobre SF 0,9%."},{"v":"Vol. I","c":1,"n":3,"g":"C","s":["As iniciativas ERAS/ACERTO têm consensos similares quanto a rotinas perioperatórias. Assinale a alternativa que representa uma recomendação desses guidelines:"],"a":{"A":"Uso liberal de opioides","B":"Uso liberal de drenos","C":"Uso liberal de anestesia peridural","D":"Uso liberal de fluidoterapia"},"ok":"A analgesia peridural é um dos pilares do ERAS, sobretudo em laparotomias e cirurgia colorretal aberta. Ela reduz a necessidade de opioides sistêmicos, bloqueia as fibras simpáticas eferentes (atenuando o íleo pós-operatório) e diminui a intensidade da resposta endócrino-metabólica ao trauma. É a única das quatro em que \"uso liberal\" combina com a filosofia do protocolo.","w":{"A":"Exatamente o oposto: o ERAS prega analgesia multimodal justamente para poupar opioides, que retardam o retorno da função intestinal, aumentam náuseas e prolongam a internação.","B":"Drenos devem ser evitados ou usados de forma seletiva. Não previnem deiscência, não diagnosticam precocemente fístula de forma confiável, atrasam a mobilização e aumentam desconforto.","D":"O ERAS recomenda restrição hídrica e fluidoterapia guiada por metas. A sobrecarga volêmica causa edema de alça, íleo prolongado e complicações respiratórias."},"p":["Pilares do ERAS/ACERTO: jejum abreviado (líquidos claros até 2 h, sólidos até 6 h), bebida com maltodextrina 2 h antes, sem preparo mecânico rotineiro do cólon, analgesia multimodal, anestesia regional, restrição hídrica, evitar drenos e sondas, dieta e mobilização precoces, profilaxia de náusea e de TEV."],"f":"Projeto ACERTO (Aceleração da Recuperação Total Pós-Operatória), Colégio Brasileiro de Cirurgiões; ERAS Society Guidelines for Colorectal Surgery (World J Surg, atualização mais recente); Sabiston, 21ª ed., cap. 10."},{"v":"Vol. I","c":1,"n":4,"g":"C","s":["O Programa Nacional de Segurança do Paciente (PNSP), instituído pelo Ministério da Saúde em 2013, tem entre suas metas o conceito de Cirurgia Segura, cuja lista de verificação divide a cirurgia nas seguintes fases:"],"a":{"A":"Checagem dos instrumentos, dos anestésicos e marcação da incisão com caneta","B":"Alergias prévias, presença de comorbidades e checagem dos exames de imagem","C":"Antes da indução anestésica, antes da incisão cirúrgica e antes de o paciente sair da sala","D":"Verificação da equipe de anestesia, de cirurgia e de enfermagem habilitada no centro cirúrgico"},"ok":"O checklist de Cirurgia Segura da OMS, incorporado ao PNSP pela Portaria 529/2013, divide o procedimento em três momentos temporais bem definidos: Sign in (antes da indução anestésica), Time out (antes da incisão) e Sign out (antes de o paciente deixar a sala). A alternativa C é a única que descreve momentos, e não itens isolados.","w":{"A":"Descreve alguns itens que compõem o Sign in, mas não as fases. A marcação do sítio cirúrgico é parte do checklist, não uma etapa dele.","B":"São itens do Sign in e do Time out, novamente confundindo conteúdo com fase.","D":"Confere a composição da equipe, que é apenas um item do Time out."},"p":["Sign in: identidade, sítio, consentimento, alergias, via aérea difícil, risco de sangramento. Time out: apresentação nominal da equipe, confirmação de paciente/sítio/procedimento, antibiótico nos últimos 60 min, exames de imagem expostos. Sign out: contagem de compressas e instrumentais, identificação de peças, registro de problemas, plano pós-operatório."],"f":"OMS, Cirurgia Segura Salva Vidas (Safe Surgery Saves Lives, 2009); Ministério da Saúde/ANVISA, Portaria GM/MS 529/2013 e Protocolo de Cirurgia Segura."},{"v":"Vol. I","c":1,"n":5,"g":"C","s":["Eduardo, 34 anos, com esferocitose hereditária, foi encaminhado da Hematologia para parecer sobre esplenectomia. Assinale a alternativa que apresenta corretamente as principais vacinas recomendadas para pacientes submetidos a esplenectomia:"],"a":{"A":"Tríplice bacteriana, tríplice viral e Influenza","B":"Hepatite B, meningocócica e pneumocócica","C":"Haemophilus influenzae tipo B, meningocócica e pneumocócica","D":"Haemophilus influenzae tipo A, meningocócica e pneumocócica"},"ok":"O baço é o principal órgão de depuração de bactérias encapsuladas opsonizadas. Sua ausência expõe o paciente à sepse fulminante pós- esplenectomia (OPSI), cujos agentes clássicos são Streptococcus pneumoniae (o mais frequente, ~50–90% dos casos), Neisseria meningitidis e Haemophilus influenzae tipo b. Daí a tríade vacinal obrigatória: pneumocócica, meningocócica e anti-Hib.","w":{"A":"Tríplice bacteriana e viral não protegem contra encapsuladas. Influenza é recomendada anualmente como medida adicional, mas não compõe o núcleo da profilaxia da OPSI.","B":"Hepatite B é vacina do calendário geral, sem relação com asplenia. Faltou o Hib.","D":"Pegadinha de uma letra: o sorotipo relevante é o tipo b, não o tipo A. É o erro mais cobrado nesse enunciado."},"p":["Timing: idealmente ≥ 2 semanas antes da esplenectomia eletiva; na esplenectomia de urgência (trauma), aplicar ≥ 14 dias após a cirurgia. Considerar antibioticoprofilaxia com penicilina em crianças e nos primeiros anos pós-esplenectomia."],"f":"Sabiston, 21ª ed., cap. 56 (Baço); CDC/ACIP — Immunization of Asplenic Persons; Ministério da Saúde, Manual dos Centros de Referência para Imunobiológicos Especiais (CRIE)."},{"v":"Vol. I","c":1,"n":6,"g":"B","s":["Com relação às orientações pré-operatórias, marque a alternativa verdadeira:"],"a":{"A":"A maioria dos anti-hipertensivos deve ser suspensa no pré-operatório, pois a REMIT tende a reduzir por si só a pressão arterial","B":"A explanação do procedimento e da evolução pós-operatória esperada é obrigatória, pois reduz a tensão psíquica do paciente e o risco médico- legal","C":"Os exames pré-operatórios devem ser solicitados de forma rotineira, independentemente das peculiaridades do paciente e do procedimento","D":"Os índices de avaliação de status-performance têm importância meramente ilustrativa, não sendo capazes de estratificar risco cirúrgico"},"ok":"O aconselhamento pré-operatório é o primeiro item do protocolo ACERTO/ERAS. Explicar o procedimento e o que esperar no pós-operatório reduz ansiedade, melhora adesão à deambulação e à dieta precoces, diminui consumo de analgésicos e cumpre a exigência do consentimento informado — daí a dupla proteção clínica e médico-legal.","w":{"A":"Inverte a fisiologia: a REMIT cursa com aumento de catecolaminas, cortisol e ADH, elevando a PA. Anti-hipertensivos em geral são mantidos, com exceção de IECA/BRA, que muitos serviços suspendem na manhã da cirurgia pelo risco de hipotensão refratária na indução.","C":"Exames de rotina indiscriminados não reduzem desfechos adversos, geram achados incidentais e atrasam a cirurgia. A solicitação deve ser dirigida por idade, comorbidades e porte do procedimento.","D":"É o oposto do consenso: ASA, ECOG/Zubrod, METs e o índice de Lee correlacionam-se com morbimortalidade e efetivamente mudam conduta. Fonte: Sabiston, 21ª ed., cap. 10 (Princípios do cuidado pré-operatório); Projeto ACERTO; ACC/AHA Guideline on Perioperative Cardiovascular Evaluation for Noncardiac Surgery."},"p":[],"f":""},{"v":"Vol. I","c":1,"n":7,"g":"D","s":["Os cuidados perioperatórios foram norteados por décadas por paradigmas baseados na fisiologia, no medo ou na opinião de eminências. Assinale a alternativa que contempla adequadamente o paradigma anterior ao trazido pelo ACERTO/ERAS:"],"a":{"A":"A progressão da dieta costumava ser feita de forma rápida e regrada","B":"O uso de drenos costumava ser feito de forma seletiva e por curto período","C":"O preparo dos cólons costumava ser feito de forma seletiva e com catárticos pouco irritantes","D":"O uso de sonda nasogástrica costumava ser feito de forma rotineira e profilática"},"ok":"A sonda nasogástrica profilática após laparotomia era rotina até os anos 1990, sob a justificativa de \"descomprimir o intestino e proteger a anastomose\". Metanálises mostraram exatamente o contrário: aumenta atelectasia, pneumonia e febre, e retarda o retorno da função intestinal, sem reduzir deiscência. Hoje é reservada a indicações específicas (íleo estabelecido, obstrução, vômitos incoercíveis).","w":{"A":"Invertido. A dieta antigamente era progredida de forma lenta, esperando eliminação de flatos. O paradigma atual é a alimentação precoce, nas primeiras 24 h.","B":"Invertido. Antes os drenos eram rotineiros; hoje é que são seletivos.","C":"Invertido e duplamente errado. O preparo mecânico antes era rotineiro e com catárticos agressivos (manitol); hoje é seletivo, e quando indicado se associa antibiótico oral."},"p":["Repare no padrão da questão: três alternativas descrevem o paradigma atual como se fosse o antigo. Basta identificar qual das quatro práticas foi abandonada."],"f":"Projeto ACERTO — Aguilar-Nascimento et al.; ERAS Society Guidelines; Sabiston, 21ª ed., cap. 10. Metanálise clássica: Nelson R et al., Cochrane Database — descompressão nasogástrica de rotina após cirurgia abdominal."},{"v":"Vol. I","c":1,"n":8,"g":"C","s":["Mulher de 55 anos com colelitíase sintomática (episódio único de cólica biliar). HAS controlada com ramipril (PA 110×70), sem alergias, duas cesarianas prévias sem intercorrências. Corre 10 km, 4×/semana. Não fuma; ingere álcool 1×/semana, 2 a 4 doses. Marque a melhor alternativa."],"a":{"A":"O parecer cardiológico deve ser solicitado para a realização do procedimento","B":"Entre os exames pré-operatórios necessários está um coagulograma","C":"A paciente realizará um procedimento que se enquadra como hospital- dia","D":"O jejum deve ser de oito horas, incluindo líquidos como leite e sucos espessos"},"ok":"A colecistectomia videolaparoscópica em paciente ASA II, sem comorbidade descompensada e com boa capacidade funcional, é procedimento de regime de hospital-dia (cirurgia ambulatorial com alta em menos de 24 h) na maioria dos serviços. É a única alternativa compatível com as diretrizes atuais.","w":{"A":"Paciente com HAS controlada, assintomática do ponto de vista cardiovascular e com capacidade funcional muito acima de 4 METs (corrida de 10 km equivale a > 10 METs). Pelo algoritmo da ACC/AHA, não há indicação de investigação cardíaca adicional nem de parecer.","B":"Coagulograma não é exame de rotina. Só se justifica com história pessoal ou familiar de sangramento, hepatopatia, uso de anticoagulante ou procedimento de alto risco hemorrágico. A anamnese aqui é negativa (duas cesarianas sem intercorrência).","D":"Duplo erro. O jejum atual é de 2 h para líquidos claros e 6 h para sólidos/leite. Além disso, leite e sucos espessos não são líquidos claros — comportam-se como sólidos e exigem 6 h."},"p":["Líquido claro = translúcido, sem resíduo e sem gordura: água, chá, café sem leite, suco coado sem polpa, bebida com maltodextrina. Leite (inclusive vegetal), sucos com polpa e caldos gordurosos entram na regra das 6 h."],"f":"ACC/AHA 2014 Perioperative Guideline (algoritmo METs); ASA Practice Guidelines for Preoperative Fasting (atualização 2023); Projeto ACERTO."},{"v":"Vol. I","c":1,"n":9,"g":"B","s":["Mulher de 42 anos com neoplasia ovariana avançada, em uso de anticoncepcional oral, submetida a tratamento cirúrgico. No 4º dia de pós-operatório evoluiu com dor e edema de panturrilha direita, associados a febre. Como cuidados perioperatórios, deveriam ter sido recomendados:"],"a":{"A":"Troca do anticoncepcional oral por injetável","B":"Bota pneumática","C":"Por se tratar de cirurgia de grande porte, com áreas cruentas extensas, evitar heparina de baixo peso molecular","D":"Filtro de veia cava"},"ok":"A paciente reúne quatro fatores de risco maiores: neoplasia maligna, cirurgia oncológica pélvica de grande porte, imobilização pós-operatória e estrogenoterapia. É risco muito alto de TEV (Caprini ≥ 5) e a profilaxia deveria ter sido combinada: mecânica (compressão pneumática intermitente, a \"bota pneumática\") somada à farmacológica com HBPM. Entre as quatro opções, a bota pneumática é a única medida profilática correta e sem contraindicação.","w":{"A":"Trocar a via de administração não resolve: o risco trombótico decorre do componente estrogênico/progestagênico e da neoplasia, não da via. O correto seria suspender o hormônio antes da cirurgia eletiva.","C":"Justamente o contrário. Em cirurgia oncológica abdominopélvica, a HBPM é fortemente recomendada, e há indicação de profilaxia estendida por 28 dias após a alta. Áreas cruentas não contraindicam profilaxia em dose profilática.","D":"O filtro de veia cava é medida de exceção, indicado quando há TEV comprovado com contraindicação absoluta à anticoagulação ou falha da anticoagulação plena. Não é método de profilaxia primária."},"p":["Em cirurgia oncológica abdominal ou pélvica: profilaxia mecânica + HBPM, iniciada no perioperatório e mantida por 4 semanas após a alta."],"f":"Sabiston, 21ª ed., cap. 5; ASCO Guideline — Venous Thromboembolism Prophylaxis in Patients with Cancer; ACCP CHEST Guidelines, prevenção de TEV em pacientes cirúrgicos."},{"v":"Vol. I","c":1,"n":10,"g":"C","s":["Paciente de 55 anos com colelitíase sintomática. Usa captopril e hidroclorotiazida; PA 110×75 mmHg. Trabalha na construção civil como pedreiro e vai e volta do trabalho de bicicleta. Marque a melhor alternativa."],"a":{"A":"Deve realizar parecer cardiológico por ter mais de 50 anos e ser hipertenso","B":"Por ser ASA 1, não necessita de parecer cardiológico, a não ser que a cirurgia seja ambulatorial","C":"Tem capacidade funcional superior a 4 METs e é assintomático — não necessita de parecer cardiológico","D":"É ASA 2 e por isso deve fazer parecer cardiológico mesmo assintomático"},"ok":"O algoritmo perioperatório da ACC/AHA é sequencial: (1) cirurgia de urgência? não; (2) síndrome coronariana aguda? não; (3) risco cardíaco estimado; (4) capacidade funcional. Um pedreiro que pedala diariamente para o trabalho tem capacidade funcional claramente > 4 METs. Paciente assintomático com ≥ 4 METs segue para a cirurgia sem teste adicional e sem parecer, independentemente da idade.","w":{"A":"Idade e HAS isoladamente não indicam investigação. HAS controlada nem sequer entra como preditor no índice de Lee.","B":"Erra duas vezes: o paciente é ASA II (doença sistêmica leve, controlada), não ASA I; e cirurgia ambulatorial é justamente a de menor risco, não faria sentido exigir parecer nela.","D":"A classificação ASA sozinha não indica parecer cardiológico. ASA II com boa capacidade funcional e sem preditores clínicos vai direto para a cirurgia."},"p":["Referências de METs: 1 MET = repouso; 4 METs = subir um lance de escada, caminhar em plano rápido, tarefas domésticas pesadas; > 10 METs = esportes vigorosos. O ponto de corte da prova é sempre 4."],"f":"ACC/AHA Guideline on Perioperative Cardiovascular Evaluation and Management for Noncardiac Surgery; Duke Activity Status Index; Sabiston, 21ª ed., cap. 10."},{"v":"Vol. I","c":1,"n":11,"g":"A","s":["Paciente de 70 anos com tumor de cólon direito realizou procedimento cirúrgico sem intercorrências e foi transferido para a UTI. Marque a melhor alternativa."],"a":{"A":"A anestesia peridural, por promover bloqueio alfa-adrenérgico, reduz significativamente a resposta simpática e assim diminui o íleo paralítico","B":"A resposta inflamatória é mediada por agentes colinérgicos e por citocinas de modo a paralisar o intestino","C":"A peridural, por ter efeito apenas analgésico, ajuda a controlar a dor no trans e no pós-operatório","D":"A intensidade da resposta inflamatória não tem relação com a anestesia, e sim com o porte da cirurgia"},"ok":"O íleo pós-operatório tem quatro mecanismos: resposta inflamatória à manipulação intestinal, hiperatividade simpática reflexa, uso de opioides e reflexos neurogênicos espinhais. A peridural torácica bloqueia as fibras simpáticas eferentes (T5–L2), interrompendo o arco reflexo inibitório, e ainda poupa opioide. Por isso reduz incidência e duração do íleo — é um dos pilares do ERAS.","w":{"B":"Erra o mediador. A inibição da motilidade é predominantemente simpática (adrenérgica); a via colinérgica, ao contrário, é estimulatória e tem efeito anti-inflamatório (via vagal). As citocinas participam, mas não por mecanismo colinérgico.","C":"O \"apenas analgésico\" invalida a alternativa. Justamente o valor da peridural no ERAS está nos efeitos além da analgesia: bloqueio simpático, redução da REMIT e economia de opioide.","D":"A técnica anestésica modula a resposta inflamatória e neuroendócrina de forma comprovada. O porte importa, mas não é o único determinante. Fonte: Sabiston, 21ª ed., cap. 10 e 49; ERAS Society Guidelines — analgesia epidural em cirurgia colorretal aberta; revisões sobre fisiopatologia do íleo pós-operatório."},"p":[],"f":""},{"v":"Vol. I","c":1,"n":12,"g":"A","s":["Qual das condições abaixo não é fator de risco para tromboembolismo venoso no pós-operatório?"],"a":{"A":"Insuficiência hepática","B":"Deficiência de proteína C","C":"Obesidade","D":"Câncer"},"ok":"Mesma lógica da questão 1, agora sem a distração da laparoscopia. A insuficiência hepática cursa com redução da síntese dos fatores de coagulação vitamina K-dependentes e prolongamento do INR, configurando classicamente um estado de sangramento, não de trombose. As outras três são fatores de risco consagrados.","w":{"B":"Deficiência de proteína C é trombofilia hereditária clássica — a proteína C ativada inativa os fatores Va e VIIIa; sua falta gera hipercoagulabilidade.","C":"Obesidade aumenta o risco por estase venosa, estado pró-inflamatório crônico e maior expressão de PAI-1.","D":"Câncer é o fator de risco adquirido mais forte, por expressão de fator tecidual pelas células tumorais."},"p":["Questão praticamente idêntica à número 1 deste mesmo caso. É o conteúdo mais repetido do Caso 1 — três das quinze questões giram em torno da lista de risco de TEV."],"f":"Sabiston, 21ª ed., cap. 5; escore de Caprini para estratificação de risco de TEV em pacientes cirúrgicos."},{"v":"Vol. I","c":1,"n":13,"g":"B","s":["Homem de 72 anos, para colecistectomia laparoscópica. DAC com angioplastia há 4","anos; DM2 em uso de metformina e empagliflozina; HAS controlada com losartana e atenolol; DPOC moderada sem exacerbação no último ano; creatinina 1,7 mg/dL (TFG ~45); ASA III; capacidade funcional 4–5 METs; ECG basal sem novas alterações. Qual o conjunto de condutas pré-operatórias mais apropriado?"],"a":{"A":"Suspender betabloqueador 48 h antes; manter BRA no dia; manter SGLT2; solicitar teste ergométrico","B":"Manter atenolol e losartana no dia da cirurgia; suspender SGLT2 3 dias antes; não solicitar teste isquêmico","C":"Manter betabloqueador; manter metformina; manter SGLT2; solicitar eco de estresse pela idade","D":"Suspender todos os hipoglicemiantes; internar 48 h antes para heparinização profilática e angiografia coronariana"},"ok":"Três decisões corretas em uma alternativa só. (1) O betabloqueador de uso crônico deve ser mantido — sua suspensão abrupta causa rebote adrenérgico, taquicardia e isquemia. (2) Os inibidores de SGLT2 devem ser suspensos 3 a 4 dias antes de cirurgia, pelo risco de cetoacidose diabética euglicêmica no perioperatório. (3) Com capacidade funcional ≥ 4 METs, sem sintomas e sem alteração nova no ECG, não há benefício em teste isquêmico — ele apenas atrasaria a cirurgia sem mudar conduta. A manutenção da losartana no dia é aceitável em muitos protocolos, embora vários serviços prefiram suspender IECA/BRA na manhã da cirurgia; esse é o ponto mais discutível da alternativa, mas não a invalida frente às outras.","w":{"A":"Suspender betabloqueador é erro grave (rebote); manter SGLT2 expõe à cetoacidose euglicêmica; e o teste ergométrico é desnecessário e ainda inadequado nesse perfil.","C":"Manter SGLT2 é o erro central. Metformina, na prática, é suspensa no dia da cirurgia (sobretudo com TFG 45 e uso de contraste). E o eco de estresse \"pela idade\" contraria o algoritmo — idade isolada não indica teste.","D":"Internação de 48 h, heparinização e coronariografia em paciente estável, assintomático e com boa capacidade funcional constituem conduta invasiva sem respaldo. A revascularização pré-operatória profilática não reduz eventos (estudo CARP)."},"p":["Regra prática das medicações: mantém anti-hipertensivos (com ressalva para IECA/BRA), betabloqueador, estatina, psicotrópicos, levotiroxina, inalatórios e corticoide (com dose de estresse). Suspende no dia antidiabéticos orais e insulina em dose ajustada. Suspende dias antes SGLT2 (3–4 d), HBPM (12–24 h), HNF (2–6 h), AAS em situação selecionada (7–10 d)."],"f":"ACC/AHA Perioperative Guideline; FDA Drug Safety Communication sobre SGLT2 e cetoacidose perioperatória; SBD — Diretrizes da Sociedade Brasileira de Diabetes, manejo perioperatório; estudo CARP (Coronary Artery Revascularization Prophylaxis)."},{"v":"Vol. I","c":1,"n":14,"g":"A","s":["Sobre a avaliação pré-operatória, assinale a alternativa incorreta:"],"a":{"A":"A aptidão física subjacente é um importante preditor de sobrevivência após a cirurgia, mas o escore ASA não demonstrou correlacionar-se com o risco de complicações","B":"O escore ASA é de fácil reprodução e comumente utilizado como parte da avaliação pré-operatória","C":"O escore ASA é ferramenta útil para pesquisa, padronizando categorias de pacientes em diferentes hospitais","D":"O sistema ASA apresenta limitações, como não considerar a otimização pré-operatória e não fazer ajustes para idade, sexo, peso ou gravidez"},"ok":"Enunciado negativo: procura-se a falsa. A afirmação A é a única incorreta porque nega uma correlação bem estabelecida — o escore ASA tem correlação consistente com morbidade e mortalidade perioperatórias, e é justamente por isso que se tornou universal apesar de sua subjetividade. A primeira metade da frase (aptidão física prediz sobrevida) está certa; a segunda a torna falsa.","w":{"B":"Verdadeira: a simplicidade e a reprodutibilidade razoável são as maiores virtudes do ASA.","C":"Verdadeira: o ASA permite comparar populações cirúrgicas entre serviços, sendo variável de ajuste em praticamente todo estudo de desfecho cirúrgico.","D":"Verdadeira e é a crítica clássica ao escore: é subjetivo, tem variabilidade interobservador, não incorpora o porte da cirurgia nem a otimização clínica prévia, e não ajusta para idade, sexo, peso ou gestação."},"p":["ASA I: hígido. II: doença sistêmica leve e controlada. III: doença sistêmica grave, com limitação funcional. IV: doença sistêmica grave que é ameaça constante à vida. V: moribundo, sobrevida improvável","sem a cirurgia. VI: morte encefálica, doador. Sufixo E para emergência."],"f":"American Society of Anesthesiologists — ASA Physical Status Classification System; Sabiston, 21ª ed., cap. 10."},{"v":"Vol. I","c":1,"n":15,"g":"C","s":["Homem de 68 anos submetido a prótese total de joelho. Em determinado momento do perioperatório, a equipe confirmou que todos os membros foram apresentados por nome e função, confirmou o nome do paciente, o local da cirurgia e o procedimento, confirmou a administração do antibiótico e que os exames de imagem essenciais estavam expostos na sala. Em que momento foram realizadas essas comunicações?"],"a":{"A":"Na sala pré-anestésica, pelo anestesista","B":"Ao final do procedimento","C":"Antes da incisão da pele","D":"No momento da admissão hospitalar"},"ok":"A descrição corresponde exatamente ao Time out, que ocorre com toda a equipe presente e paramentada, imediatamente antes da incisão. Os três marcadores citados são exclusivos dessa fase: apresentação nominal de cada membro da equipe, confirmação da profilaxia antibiótica (administrada nos 60 minutos anteriores) e exposição das imagens essenciais.","w":{"A":"Corresponderia ao Sign in, feito pelo anestesista com o paciente ainda acordado — mas nele a equipe cirúrgica completa ainda não está reunida, e não se confere antibiótico nem imagem.","B":"Ao final é o Sign out: contagem de compressas e instrumentais, identificação das peças cirúrgicas, registro de intercorrências e plano pós- operatório.","D":"Admissão hospitalar é etapa administrativa, anterior e externa ao checklist cirúrgico."},"p":["O item que mais distingue o Time out é a apresentação nominal da equipe. Se o enunciado citar isso, é Time out."],"f":"OMS — Surgical Safety Checklist; Ministério da Saúde/ANVISA, Protocolo de Cirurgia Segura (PNSP, 2013)."},{"v":"Vol. I","c":2,"n":1,"g":"B","s":["Dentre as alternativas abaixo, assinale a que representa um achado clínico da REMIT em regressão:"],"a":{"A":"Oligúria","B":"Fome","C":"Taquicardia","D":"Hipertensão"},"ok":"O retorno do apetite é o marcador clínico clássico da entrada na fase anabólica (de recuperação). Ele reflete queda dos hormônios contrarregulatórios, normalização do gasto energético e reversão do balanço nitrogenado para positivo. É um sinal simples e cobrado justamente por isso.","w":{"A":"Oligúria pertence à fase inicial e decorre da ação combinada de ADH e aldosterona, que retêm água e sódio.","C":"Taquicardia é achado da fase de estresse, mediada pela descarga de catecolaminas.","D":"Hipertensão também é da fase inicial, pelo mesmo mecanismo adrenérgico e pela retenção hidrossalina."},"p":["Fase inicial (catabólica/estresse): taquicardia, hipertensão, hiperglicemia, oligúria, anorexia, balanço nitrogenado negativo. Fase de regressão (anabólica): fome, diurese restabelecida, balanço nitrogenado positivo, ganho de massa magra e depois de gordura."],"f":"Sabiston, 21ª ed., cap. 2 (Resposta metabólica ao trauma e à sepse); Cuthbertson DP — descrição original das fases ebb e flow."},{"v":"Vol. I","c":2,"n":2,"g":"B","s":["A REMIT envolve a inter-relação entre os sistemas nervoso, imunológico, endócrino e circulatório. É correto afirmar que:"],"a":{"A":"O uso da clonidina na indução anestésica é adjuvante da sedoanalgesia, devendo-se ter cuidado pelo seu efeito hipertensor","B":"O cortisol aumenta em até 5 vezes seus valores em até 24 h, sendo um dos principais responsáveis pelo estímulo à lipólise e à mobilização de ácidos graxos","C":"Na fase inicial (ebb) há predomínio de circulação inadequada, metabolismo anaeróbico, acidose e diminuição dos hormônios de estresse","D":"A aldosterona é o hormônio responsável pela acidose mista do pós- operatório"},"ok":"O cortisol é o hormônio-síntese da REMIT. Após trauma ou cirurgia de grande porte, seus níveis sobem 4 a 5 vezes nas primeiras 24 horas, e o pico se correlaciona com a magnitude da agressão. Suas ações: gliconeogênese hepática, proteólise muscular com liberação de aminoácidos, lipólise com mobilização de ácidos graxos livres, resistência insulínica periférica e efeito permissivo sobre as catecolaminas.","w":{"A":"Dois erros. A clonidina é agonista alfa-2, não bloqueador, e seu efeito é hipotensor — ela reduz a liberação central de noradrenalina.","C":"A primeira metade está certa (baixo débito, hipoperfusão, metabolismo anaeróbico, acidose lática), mas a última parte inverte tudo: na fase ebb os hormônios de estresse já estão elevados — são eles que iniciam a resposta.","D":"A aldosterona retém sódio e excreta H⁺ e K⁺ no túbulo distal, contribuindo para alcalose metabólica, não acidose. O distúrbio típico do pós-operatório é alcalose mista (metabólica pela aldosterona e respiratória pela dor e taquipneia). Fonte: Sabiston, 21ª ed., cap. 2; Desborough JP — The stress response to trauma and surgery, Br J Anaesth (revisão clássica sobre o eixo HHA no perioperatório)."},"p":[],"f":""},{"v":"Vol. I","c":2,"n":3,"g":"D","s":["No pós-operatório de gastrectomia total, o paciente sofre desequilíbrio fisiológico transitório até a restituição da homeostase. Em relação ao metabolismo, pode-se afirmar que:"],"a":{"A":"A fase anabólica inicial é caracterizada pelo predomínio de balanço nitrogenado negativo","B":"A fase anabólica inicial é caracterizada pela restauração do estoque de gordura","C":"Na fase catabólica, que ocorre nos primeiros dias, os balanços de água, potássio e sódio são negativos","D":"A fase catabólica ocorre durante os três a cinco primeiros dias de pós- operatório, com balanços nitrogenado e calórico negativos"},"ok":"A fase catabólica (também chamada adrenérgico-corticoide) dura tipicamente 3 a 5 dias após cirurgia de grande porte não complicada. Nela predominam catecolaminas, cortisol e glucagon; há proteólise muscular intensa com perda urinária de nitrogênio (balanço nitrogenado negativo) e gasto energético que supera a ingestão (balanço calórico negativo).","w":{"A":"Balanço nitrogenado negativo é da fase catabólica, não da anabólica. Na anabólica ele se torna positivo.","B":"Erra a ordem. A recuperação anabólica ocorre em duas etapas: primeiro a reposição de proteína (fase anabólica precoce, semanas), depois a reposição de gordura (fase de ganho de gordura, meses). A restauração do estoque adiposo é a última a acontecer.","C":"Inverte o balanço hidroeletrolítico. Na fase catabólica, ADH e aldosterona promovem retenção de água e sódio (balanços positivos); o potássio é que fica com balanço negativo, pela excreção aumentada e pela liberação intracelular na proteólise."},"p":["Sequência de Moore: fase catabólica (3–5 d) → fase de transição (1–2 d, diurese, queda do cortisol) → fase anabólica precoce (semanas, reposição proteica) → fase de ganho de gordura (meses)."],"f":"Sabiston, 21ª ed., cap. 2; Moore FD — Metabolic Care of the Surgical Patient (descrição original das quatro fases)."},{"v":"Vol. I","c":2,"n":4,"g":"B","s":["Em relação à REMIT, podemos afirmar que:"],"a":{"A":"A clonidina, alfa-bloqueador usado para sedoanalgesia, pode ter como efeito colateral hipotensão","B":"Na fase EBB (baixo fluxo) observa-se diminuição do débito cardíaco e aumento dos hormônios de estresse","C":"Na fase flow ocorre aumento gradual do catabolismo, com diminuição dos hormônios do estresse e tendência à normalização da glicose","D":"No pós-operatório é esperada alcalose mista, devido ao aumento da aldosterona e ao aumento de CO₂ no sangue"},"ok":"A fase ebb corresponde às primeiras horas após o trauma. Caracteriza-se por queda do débito cardíaco, redução do consumo de oxigênio, hipoperfusão tecidual e hipotermia — mas com os hormônios contrarregulatórios (catecolaminas, cortisol, glucagon, ADH) já elevados, pois são eles que deflagram a resposta.","w":{"A":"O erro está em \"alfa-bloqueador\". A clonidina é agonista alfa-2 de ação central. O efeito hipotensor citado está correto, mas o mecanismo descrito está errado, o que invalida a alternativa.","C":"Descreve o oposto da fase flow. Nela há aumento do catabolismo com hormônios de estresse ainda elevados, hipermetabolismo, aumento do débito cardíaco e hiperglicemia — não normalização glicêmica.","D":"A conclusão (alcalose mista) está certa, mas o mecanismo respiratório está invertido: a alcalose respiratória decorre de hipocapnia por hiperventilação (dor, ansiedade, febre), e não de aumento de CO₂ — aumento de CO₂ causaria acidose respiratória."},"p":["Ebb = horas, \"fase de choque\": ↓DC, ↓VO₂, hipotermia, hormônios já ↑. Flow = dias, \"fase hipermetabólica\": ↑DC, ↑VO₂, febre, hiperglicemia, proteólise."],"f":"Sabiston, 21ª ed., cap. 2; Cuthbertson DP, Lancet — descrição original de ebb e flow."},{"v":"Vol. I","c":2,"n":5,"g":"B","s":["Assinale a alternativa que contempla condutas que intensificam a REMIT:"],"a":{"A":"Videolaparoscopia e anestesia peridural","B":"Alargamento do jejum e uso excessivo de dispositivos de energia","C":"Aconselhamento pré-operatório e fisioterapia pré-operatória","D":"Anestesia preemptiva e grandes incisões"},"ok":"O jejum prolongado agrava a resistência insulínica pré-existente e aprofunda o catabolismo já antes da incisão — é justamente o que o ACERTO combate com a bebida de maltodextrina 2 h antes. O uso excessivo de dispositivos de energia (eletrocautério, bisturi harmônico, seladores) amplia a área de lesão térmica tecidual, aumentando a liberação de mediadores inflamatórios (IL-1, IL-6, TNF-α) e, portanto, a magnitude da REMIT.","w":{"A":"Ambas atenuam a resposta: a videolaparoscopia reduz a incisão e o trauma parietal; a peridural bloqueia a aferência nociceptiva e a eferência simpática.","C":"Ambas atenuam. Aconselhamento reduz ansiedade e liberação de catecolaminas; a pré-habilitação (fisioterapia pré-operatória) melhora a reserva funcional e a tolerância ao estresse cirúrgico.","D":"Alternativa mista, e é aí que está a pegadinha: anestesia preemptiva atenua (bloqueia a aferência antes que o estímulo se estabeleça), enquanto grandes incisões intensificam. Como a alternativa exige que ambas intensifiquem, ela é falsa."},"p":["Atenuam a REMIT: videolaparoscopia, peridural/bloqueios, analgesia preemptiva, jejum abreviado com carboidrato, normotermia, aconselhamento, pré-habilitação. Intensificam: jejum prolongado,","grandes incisões, hipotermia, dor não controlada, hipovolemia, sepse, lesão térmica extensa."],"f":"Projeto ACERTO; ERAS Society Guidelines; Sabiston, 21ª ed., cap. 2 e cap. 10."},{"v":"Vol. I","c":2,"n":6,"g":"A","s":["Conhecendo bem a REMIT, um bom anestesista pode fazer uso frequente da clonidina durante grandes cirurgias. Além de seu efeito sedativo, ela atua diminuindo a resposta:"],"a":{"A":"Simpática","B":"Parassimpática","C":"Do sistema reticular ativador ascendente","D":"Do núcleo rubro"},"ok":"A clonidina é agonista alfa-2 adrenérgico de ação central. Ao estimular autorreceptores alfa-2 pré-sinápticos no locus ceruleus, reduz a liberação de noradrenalina, diminuindo a atividade simpática central. Daí decorrem sedação, analgesia, bradicardia e hipotensão — e a atenuação da resposta endócrino-metabólica ao trauma, com menor pico de catecolaminas e cortisol.","w":{"B":"Não há bloqueio parassimpático. Ao contrário, a bradicardia observada resulta da redução do tônus simpático com predomínio relativo do vago.","C":"A sedação da clonidina envolve o locus ceruleus, e a alternativa erra ao nomear o SARA como alvo da questão — o que se pergunta é qual resposta ao trauma ela reduz, e essa resposta é a simpática.","D":"O núcleo rubro pertence às vias motoras extrapiramidais, sem relação com a REMIT nem com a farmacologia da clonidina."},"p":["A dexmedetomidina tem o mesmo mecanismo, com seletividade alfa-2 muito maior, e é hoje o agente preferido na UTI e no perioperatório pelo mesmo racional."],"f":"Sabiston, 21ª ed., cap. 2 e cap. 14 (Anestesia); Miller's Anesthesia — agonistas alfa-2 adrenérgicos."},{"v":"Vol. I","c":2,"n":7,"g":"A","s":["As respostas fisiológicas ao estresse cirúrgico são múltiplas e complexas. Uma das consequências mais precoces de um procedimento cirúrgico é:"],"a":{"A":"Aumento do nível de cortisol circulante","B":"Diminuição dos níveis séricos de catecolaminas","C":"Diminuição da síntese de aldosterona","D":"Aumento da secreção de insulina"},"ok":"A ativação do eixo hipotálamo-hipófise-adrenal é imediata: a aferência nociceptiva estimula o hipotálamo a liberar CRH, a adeno-hipófise libera ACTH e o córtex adrenal libera cortisol. A elevação é detectável já nos primeiros minutos após a incisão e atinge 4 a 5 vezes o basal em 24 horas.","w":{"B":"Invertido: as catecolaminas aumentam de forma imediata, tanto pela medula adrenal quanto pelas terminações simpáticas.","C":"Invertido: a aldosterona aumenta, por ativação do sistema renina- angiotensina (hipovolemia relativa, queda da perfusão renal) e também por estímulo direto do ACTH.","D":"Invertido e é o erro mais cobrado: a insulina é o único hormônio importante que cai (ou fica inapropriadamente baixa para o grau de hiperglicemia). As catecolaminas inibem sua secreção via receptor alfa-2 pancreático, e há resistência insulínica periférica associada."},"p":["Sobem: cortisol, ACTH, catecolaminas, glucagon, ADH, aldosterona, GH, prolactina. Caem: insulina (relativa), T3 (síndrome do eutireóideo doente), testosterona, estrogênio."],"f":"Sabiston, 21ª ed., cap. 2; Desborough JP, Br J Anaesth — The stress response to trauma and surgery."},{"v":"Vol. I","c":2,"n":8,"g":"D","s":["Assinale a alternativa que apresenta o principal estímulo ao desencadeamento da resposta endócrina após o trauma ou a cirurgia:"],"a":{"A":"Acidose tecidual","B":"Bloqueio espinhal","C":"Alteração da temperatura","D":"Estímulos nervosos provenientes da área lesada"},"ok":"A via principal é neural aferente: nociceptores da área lesada → fibras aferentes → medula → hipotálamo → eixo hipotálamo-hipófise-adrenal e sistema simpático. A prova disso é clínica: o bloqueio neuroaxial que interrompe essa aferência abole ou atenua a resposta em cirurgias de membros inferiores e abdome inferior, o que não aconteceria se o gatilho fosse humoral ou metabólico.","w":{"A":"Acidose, hipóxia e hipovolemia são estímulos adicionais e amplificadores, sobretudo em choque, mas não são o desencadeante principal na cirurgia eletiva não complicada.","B":"O bloqueio espinhal faz exatamente o contrário: inibe a resposta ao interromper a via aferente. É o argumento que confirma a alternativa D.","C":"A hipotermia intensifica a resposta simpática, mas é fator agravante, não o estímulo deflagrador. Fonte: Sabiston, 21ª ed., cap. 2; Kehlet H — Multimodal approach to control postoperative pathophysiology (fundamento do bloqueio da aferência nociceptiva)."},"p":[],"f":""},{"v":"Vol. I","c":2,"n":9,"g":"B","s":["Sobre a REMIT, é correto afirmar que:"],"a":{"A":"A alcalose mista do pós-operatório é ocasionada pela hipoventilação associada aos altos níveis de aldosterona","B":"As principais citocinas envolvidas na REMIT são IL-1 e TNF-alfa, responsáveis respectivamente pela febre e pela glicogenólise","C":"O GH está aumentado na REMIT, porém é inibido pelo aumento da IL-1 e do TNF-alfa","D":"Nas fases iniciais do trauma (fase EBB) há queda das funções metabólicas, com diminuição inicial do débito cardíaco e aumento do lactato"},"ok":"IL-1 e TNF-α são as citocinas iniciadoras da resposta inflamatória à lesão tecidual. A IL-1 age no centro termorregulador hipotalâmico (via prostaglandina E2) produzindo febre — é o \"pirógeno endógeno\" clássico —, e o TNF-α participa da mobilização de substratos energéticos, incluindo glicogenólise e lipólise. Ambas induzem a produção hepática de IL-6, o principal marcador da magnitude da resposta.","w":{"A":"Duplo erro. A alcalose respiratória do pós-operatório decorre de hiperventilação (dor, ansiedade), não de hipoventilação, e o componente metabólico vem da aldosterona com excreção de H⁺.","C":"O GH realmente aumenta, mas IL-1 e TNF-α não o inibem — elas contribuem para a resistência periférica ao GH, reduzindo a produção de IGF-1, o que é diferente de inibir a secreção do hormônio.","D":"Esta alternativa está tecnicamente correta em seu conteúdo (a fase ebb cursa com queda do débito cardíaco e lactato elevado por metabolismo anaeróbico) e é frequentemente apontada como uma segunda resposta defensável. A banca considerou B como gabarito; se essa questão reaparecer, vale ter os dois raciocínios prontos."},"p":["Cascata: lesão tecidual → IL-1 e TNF-α → IL-6 → proteínas de fase aguda (PCR, fibrinogênio) ↑ e albumina, transferrina e pré-albumina ↓ (proteínas de fase aguda negativas)."],"f":"Sabiston, 21ª ed., cap. 2 (mediadores da resposta inflamatória); Lin E, Lowry SF — Inflammatory cytokines in the surgical patient."},{"v":"Vol. I","c":2,"n":10,"g":"D","s":["Com relação às respostas fisiológicas ao estresse cirúrgico, pode-se afirmar que:"],"a":{"A":"Em geral ocorre aumento da secreção de insulina e diminuição das concentrações de glucagon e hormônio do crescimento","B":"A aldosterona é potente estimuladora da retenção de cloro e potássio nos túbulos renais","C":"Ocorre aumento dos níveis de cortisol circulante devido a uma maior liberação de ACTH a partir da hipófise posterior","D":"A vasopressina estimula a reabsorção de água nos túbulos renais"},"ok":"A vasopressina (ADH) é liberada pela neuro-hipófise em resposta a hipovolemia, dor, hiperosmolaridade e estresse cirúrgico. Atua em receptores V2 no ducto coletor, promovendo inserção de aquaporinas-2 e reabsorção de água livre. É a base fisiopatológica da hiponatremia dilucional e da oligúria com urina concentrada no pós-operatório imediato.","w":{"A":"Inverte tudo. Insulina cai; glucagon e GH aumentam.","B":"Erra os íons. A aldosterona retém sódio (e água, secundariamente) e excreta potássio e H⁺. O cloro acompanha o sódio passivamente, mas o erro central é dizer que ela retém potássio.","C":"Erra a topografia. O ACTH é produzido na adeno-hipófise (hipófise anterior). A hipófise posterior (neuro-hipófise) armazena e libera ADH e ocitocina. Pegadinha clássica desse caso."},"p":["Adeno-hipófise: ACTH, GH, TSH, FSH, LH, prolactina. Neuro-hipófise: ADH e ocitocina."],"f":"Sabiston, 21ª ed., cap. 2 e cap. 4; Guyton & Hall, Tratado de Fisiologia Médica — eixo hipotálamo-hipofisário."},{"v":"Vol. I","c":2,"n":11,"g":"A","s":["No pós-operatório imediato de colectomia total, o paciente desenvolve hiponatremia progressiva associada a osmolaridade urinária elevada. Simultaneamente apresenta taquicardia, vasoconstrição periférica e aumento da pressão arterial. Qual o mecanismo fisiopatológico mais provável?"],"a":{"A":"Secreção inapropriada de ADH estimulada por dor e estresse cirúrgico, associada à ativação simpática mediada por catecolaminas","B":"Supressão do ADH pelo estresse cirúrgico, com ativação parassimpática e vasodilatação periférica","C":"Inibição do sistema renina-angiotensina-aldosterona pela hipervolemia induzida pela reposição volêmica intraoperatória","D":"Liberação maciça de ANP (peptídeo natriurético atrial)"},"ok":"A combinação de hiponatremia com urina concentrada (osmolaridade urinária alta) é a assinatura laboratorial do excesso de ADH: o rim reabsorve água livre desproporcionalmente ao sódio. No pós-operatório, isso é fisiológico e esperado — dor, náusea, estresse e hipovolemia relativa são estímulos não osmóticos potentes para o ADH. A taquicardia, a vasoconstrição e a hipertensão descrevem simultaneamente a descarga catecolaminérgica. A alternativa A é a única que reúne os dois eixos presentes no caso.","w":{"B":"Contradiz o quadro em três pontos: o ADH está aumentado (urina concentrada), há ativação simpática (taquicardia, hipertensão) e vasoconstrição, não vasodilatação.","C":"O SRAA está ativado, não inibido — é parte da resposta. Além disso, a hipervolemia não explicaria vasoconstrição nem hiponatremia com urina concentrada.","D":"O ANP causaria natriurese com urina diluída e tenderia a reduzir a pressão arterial, o oposto do quadro descrito."},"p":["Regra prática: hiponatremia + osmolaridade urinária alta + Na urinário > 20 = ADH inapropriadamente alto. No pós-operatório imediato, evitar soluções hipotônicas, que agravam o quadro."],"f":"Sabiston, 21ª ed., cap. 4; UpToDate — Hyponatremia in the postoperative patient."},{"v":"Vol. I","c":2,"n":12,"g":"C","s":["Qual das alternativas descreve corretamente uma característica da resposta metabólica ao trauma?"],"a":{"A":"Redução do gasto energético basal","B":"Diminuição da liberação de catecolaminas","C":"Aumento da proteólise e da gliconeogênese","D":"Supressão completa da resposta inflamatória"},"ok":"O estado hipercatabólico é a marca da fase flow. Há proteólise muscular para fornecer aminoácidos (especialmente alanina e glutamina) ao fígado, que os converte em glicose pela gliconeogênese. Essa glicose é destinada a tecidos glicose-dependentes — cérebro, hemácias e, sobretudo, a ferida em cicatrização e as células inflamatórias.","w":{"A":"O gasto energético aumenta na fase flow: cerca de 10–20% em cirurgia eletiva, 20–40% em politrauma e sepse, e até 100% em grande queimado.","B":"As catecolaminas aumentam de forma precoce e sustentada.","D":"Não há supressão da inflamação — ela é o motor da resposta. O que ocorre é uma fase compensatória anti-inflamatória (CARS) subsequente, que pode gerar imunoparalisia, mas nunca supressão completa. Fonte: Sabiston, 21ª ed., cap. 2 e cap. 6 (Suporte metabólico e nutricional)."},"p":[],"f":""},{"v":"Vol. I","c":2,"n":13,"g":"A","s":["Durante a fase aguda da resposta metabólica ao trauma, qual alteração hormonal é esperada?"],"a":{"A":"Aumento do cortisol, glucagon e catecolaminas","B":"Aumento da secreção de insulina com hipoglicemia","C":"Redução do cortisol e da noradrenalina","D":"Estabilização imediata do metabolismo glicídico"},"ok":"Cortisol, glucagon e catecolaminas formam a tríade dos hormônios contrarregulatórios. Agem em sinergia para garantir substrato energético: glicogenólise e gliconeogênese hepáticas, lipólise no tecido adiposo e proteólise muscular. É o mecanismo da hiperglicemia do estresse, presente mesmo em não diabéticos.","w":{"B":"Duplamente errado: a insulina cai (ou fica inapropriadamente normal) e o resultado é hiperglicemia, não hipoglicemia.","C":"Inverte a resposta central da REMIT.","D":"Não há estabilização; há hiperglicemia com resistência insulínica, que pode persistir por dias e é um dos alvos do controle glicêmico perioperatório (alvo 140–180 mg/dL em pacientes cirúrgicos críticos). Fonte: Sabiston, 21ª ed., cap. 2; NICE-SUGAR trial — alvo glicêmico em pacientes críticos."},"p":[],"f":""},{"v":"Vol. I","c":2,"n":14,"g":"A","s":["Responda verdadeiro ou falso sobre a resposta ao trauma cirúrgico: ( ) Ocorre aumento de ACTH e cortisol, catecolaminas, ADH, aldosterona e insulina. ( ) O cortisol mobiliza aminoácidos do músculo esquelético e estimula a gliconeogênese hepática, ao mesmo tempo em que inibe a captação de aminoácidos e a síntese proteica. ( ) Pacientes usuários crônicos de corticoide submetidos a cirurgia de grande porte devem receber 100 mg de hidrocortisona na indução e 25 mg de 8/8 h por 24–48 h. ( ) O aumento sérico do T3 induz aumento do consumo de oxigênio e da produção de calor."],"a":{"A":"F, V, V, F","B":"V, V, V, V","C":"F, V, F, V","D":"V, F, V, F"},"ok":"A sequência correta é F, V, V, F. (I) Falsa — a lista está certa em tudo, exceto pela insulina, que diminui na fase aguda; incluir insulina entre os hormônios que aumentam é o erro plantado. (II) Verdadeira — descreve com precisão o efeito catabólico do cortisol: proteólise periférica, gliconeogênese hepática e inibição da síntese proteica muscular. (III) Verdadeira — corresponde ao esquema de dose de estresse na insuficiência adrenal secundária ao corticoide crônico. (IV) Falsa — na resposta ao trauma ocorre a síndrome do eutireóideo doente: cai a conversão periférica de T4 em T3 (com aumento do T3 reverso), de modo que o T3 sérico diminui, não aumenta.","w":{"B":"Erra ao considerar verdadeiras as afirmações I e IV.","C":"Erra ao negar a afirmação III (dose de estresse de corticoide, que é conduta padrão) e ao aceitar a IV.","D":"Erra ao aceitar a I (insulina) e ao negar a II, que é a descrição clássica da ação do cortisol."},"p":["Dose de estresse de corticoide por porte: pequeno porte, 25 mg de hidrocortisona no dia; médio porte, 50–75 mg/dia por 1–2 dias; grande porte, 100 mg na indução seguidos de 50 mg/dia (ou 25 mg 8/8 h) por 48–72 h, com desmame para a dose habitual."],"f":"Sabiston, 21ª ed., cap. 2 e cap. 39 (Adrenal); UpToDate — The management of the surgical patient taking glucocorticoids; Salem M et al., Ann Surg — perioperative glucocorticoid coverage."},{"v":"Vol. I","c":3,"n":1,"g":"C","s":["A fasciíte necrotizante caracteriza-se por infecção grave na ferida operatória nas primeiras 24 a 48 horas, sendo importante causa de febre no pós-operatório. Quais os principais microrganismos envolvidos?"],"a":{"A":"Pseudomonas e enterococos","B":"E. coli e S. aureus","C":"Estreptococo e Clostridium","D":"Candida e Clostridium"},"ok":"A infecção de ferida operatória que se manifesta nas primeiras 24 a 48 horas é altamente sugestiva de infecção necrotizante de partes moles, e os dois agentes clássicos desse cenário hiperagudo são o Streptococcus pyogenes (estreptococo beta-hemolítico do grupo A) e o Clostridium perfringens. O estreptococo produz exotoxinas pirogênicas e proteases; o clostrídio produz alfa-toxina (lecitinase) e gera crepitação por gás tecidual. Ambos evoluem em horas, com dor desproporcional ao exame, e exigem desbridamento cirúrgico imediato.","w":{"A":"Pseudomonas e enterococos são agentes de infecção hospitalar tardia, frequentemente relacionados a uso prévio de antibiótico de amplo espectro e dispositivos invasivos, não a febre nas primeiras 48 h.","B":"E. coli e S. aureus causam a maioria das infecções de sítio cirúrgico convencionais, mas essas se manifestam tipicamente entre o 4º e o 7º dia, não em 24–48 h.","D":"Candida é fungo, agente de infecção tardia em imunossuprimidos e em uso prolongado de antibióticos, jamais de quadro hiperagudo pós- operatório."},"p":["Fasciíte necrotizante tipo I = polimicrobiana (aeróbios + anaeróbios), típica da gangrena de Fournier e de diabéticos. Tipo II = monomicrobiana por S. pyogenes, em jovens previamente hígidos. O tratamento é sempre desbridamento cirúrgico precoce e amplo, com antibiótico como coadjuvante."],"f":"Sabiston, 21ª ed., cap. 12 (Infecções cirúrgicas); IDSA Practice Guidelines for the Diagnosis and Management of Skin and Soft Tissue Infections."},{"v":"Vol. I","c":3,"n":2,"g":"A","s":["A duração da antibioticoterapia nos processos infecciosos abdominais vem sendo cada vez mais estudada. Nos casos de colecistite aguda, cujo achado é de vesícula de 0,8 cm e bile purulenta em seu interior, a duração recomendada é:"],"a":{"A":"Só no início da cirurgia","B":"Até 48 h após a cirurgia","C":"Até 5 dias após a cirurgia","D":"7 dias após a cirurgia"},"ok":"O gabarito registrado é A, com o racional de que, uma vez removida a vesícula, o foco infeccioso está controlado e a cobertura antimicrobiana pode se restringir à dose de indução. Esse raciocínio é sustentado pelo princípio de controle de foco: em infecção intra-abdominal com foco completamente ressecado, a antibioticoterapia pós-operatória não reduz infecção de sítio cirúrgico e favorece resistência.","w":{"B":"Esta é a alternativa que o comentário do colega defende, e há boa base para isso: as Tokyo Guidelines 2018 recomendam que, em colecistite grau I e II com colecistectomia bem-sucedida, o antimicrobiano seja suspenso em até 24 h de pós-operatório, e a presença de bile francamente purulenta (empiema) é um dos cenários em que muitos serviços mantêm por 24–48 h. Do ponto de vista de literatura, B é defensável.","C":"Cinco dias corresponderia ao esquema de infecção intra-abdominal complicada sem controle adequado do foco, ou à colecistite grau III com repercussão sistêmica — não ao caso descrito.","D":"Sete dias é conduta obsoleta para esse cenário. O estudo STOP-IT demonstrou que 4 dias fixos equivalem a esquemas prolongados em infecção intra-abdominal com foco controlado."},"p":["Divergência sinalizada: gabarito oficial A, literatura atual mais próxima de B. Vale confirmar com o tutor, porque o mesmo conteúdo reaparece na questão 10 deste caso e no Caso 8."],"f":"Tokyo Guidelines 2018 (TG18) — antimicrobial therapy for acute cholangitis and cholecystitis, J Hepatobiliary Pancreat Sci; Sawyer RG et al., STOP-IT trial, N Engl J Med 2015; Sabiston, 21ª ed., cap. 54.","rv":"O gabarito registrado (A, apenas na indução) diverge da literatura em colecistite grave/bile purulenta (TG18: 4–7 dias após controle do foco em graus II/III). Confirme com o tutor."},{"v":"Vol. I","c":3,"n":3,"g":"B","s":["A prevenção da infecção do sítio cirúrgico é um dos temas mais debatidos em cirurgia. Sobre este tema e as diretrizes da OMS, é correto afirmar que:"],"a":{"A":"É fortemente recomendado o banho com clorexidina no pré-operatório","B":"A antibioticoprofilaxia deve ser iniciada 120 minutos antes da incisão, levando em conta a meia-vida do fármaco","C":"Para pacientes submetidos ao tratamento do câncer colorretal, é recomendado o preparo mecânico do cólon sem o uso de antibióticos orais","D":"É fortemente recomendada a troca dos materiais cirúrgicos antes do fechamento da parede abdominal"},"ok":"A OMS recomenda que a profilaxia antimicrobiana seja administrada dentro dos 120 minutos que antecedem a incisão, ajustando o momento exato à meia-vida do fármaco — cefazolina e cefuroxima idealmente 30 a 60 minutos antes; vancomicina e fluoroquinolonas, que exigem infusão lenta, mais próximas dos 120 minutos. É recomendação forte, com evidência moderada.","w":{"A":"O banho pré-operatório é recomendado, mas a OMS afirma que sabonete comum é aceitável e que não há evidência de superioridade da clorexidina para essa finalidade específica. Dizer \"fortemente recomendado com clorexidina\" extrapola a diretriz. Atenção: clorexidina alcoólica é superior para o preparo da pele na sala, o que é situação diferente do banho.","C":"Inverte a recomendação. Em cirurgia colorretal eletiva, a OMS sugere preparo mecânico associado a antibióticos orais; preparo mecânico isolado não é recomendado.","D":"A troca de luvas e instrumental antes do fechamento é sugerida como recomendação condicional/fraca, com baixa qualidade de evidência. \"Fortemente recomendada\" é o que torna a alternativa falsa."},"p":["Guarde a hierarquia: recomendação forte = profilaxia em até 120 min, não usar lâmina na tricotomia, clorexidina alcoólica no preparo da pele, não prolongar antibiótico no pós-operatório. Recomendação condicional = troca de luvas, selante de pele, banho com antisséptico."],"f":"OMS — Global Guidelines for the Prevention of Surgical Site Infection, 2ª ed. (2018); CDC Guideline for the Prevention of Surgical Site Infection (2017)."},{"v":"Vol. I","c":3,"n":4,"g":"A","s":["Sobre a infecção do sítio cirúrgico e as recomendações mais atuais da OMS, é correto afirmar que:"],"a":{"A":"O melhor momento para a profilaxia antimicrobiana é 120 minutos antes da incisão, levando em conta o tempo de meia-vida do antibiótico","B":"O preparo de cólon para cirurgias colorretais eletivas deve ser feito associando antibióticos venosos ao preparo mecânico","C":"A tricotomia pré-operatória deve ser evitada e, se necessária, deve ser realizada com lâmina","D":"É fortemente recomendada a troca de luvas e instrumentais para fechamento da parede abdominal para diminuir a infecção de sítio cirúrgico"},"ok":"Mesma recomendação da questão anterior, com enunciado reformulado — a janela de até 120 minutos antes da incisão, ajustada à farmacocinética do agente. Note que a banca cobrou o mesmo item duas vezes seguidas.","w":{"B":"Troca \"orais\" por \"venosos\". O antibiótico venoso já faz parte da profilaxia padrão de qualquer cirurgia colorretal; o que a diretriz acrescenta ao preparo mecânico é o antibiótico oral não absorvível (neomicina + metronidazol ou eritromicina).","C":"A primeira metade está certa — evitar tricotomia —, mas a segunda a destrói. Se for indispensável, deve ser feita com tricotomizador elétrico (clipper), nunca com lâmina, que produz microlacerações e aumenta a colonização.","D":"Recomendação condicional, não forte. Mesmo erro da alternativa D da questão anterior. Fonte: OMS — Global Guidelines for the Prevention of Surgical Site Infection (2018), recomendações 4, 8 e 15."},"p":[],"f":""},{"v":"Vol. I","c":3,"n":5,"g":"C","s":["Assinale a conduta que contempla corretamente as intervenções que inequivocamente diminuem a chance de infecção de sítio cirúrgico:"],"a":{"A":"Banho pré-operatório com iodopovidona (PVPI)","B":"Tricotomia com barbeador elétrico atraumático","C":"Soluções alcoólicas de clorexidina","D":"Selante de pele impregnado com antimicrobiano"},"ok":"O preparo da pele na sala cirúrgica com clorexidina em base alcoólica é uma das poucas medidas com evidência robusta e recomendação forte. A associação combina o efeito imediato do álcool com a ação residual prolongada da clorexidina, que persiste ligada à queratina por horas. Ensaios randomizados mostraram redução de ISC frente ao PVPI aquoso.","w":{"A":"O PVPI aquoso é inferior à clorexidina alcoólica para preparo da pele. E, para banho pré-operatório, a diretriz não estabelece superioridade de nenhum antisséptico sobre sabonete comum.","B":"A tricotomia com clipper é a forma menos lesiva de remover pelos, mas a recomendação principal é não realizar tricotomia. Fazer a tricotomia, ainda que atraumática, não reduz ISC — apenas não a aumenta tanto quanto a lâmina.","D":"Selantes de pele com antimicrobiano não demonstraram benefício. A OMS explicitamente não recomenda seu uso rotineiro para prevenção de ISC."},"p":["Se a questão pedir a medida \"inequívoca\", pense em clorexidina alcoólica no preparo da pele, profilaxia no tempo certo, normotermia intraoperatória, controle glicêmico e oxigenação suplementar (FiO₂ 80% em intubados)."],"f":"OMS — Global Guidelines for the Prevention of SSI (2018); Darouiche RO et al., N Engl J Med 2010 — Chlorhexidine-alcohol versus povidone-iodine for surgical- site antisepsis."},{"v":"Vol. I","c":3,"n":6,"g":"A","s":["O controle da sepse abdominal habitualmente é feito de maneira clínica, com antibioticoterapia, e cirúrgica, com ressecção do segmento infectado e lavagens cavitárias. Acerca do controle clínico-cirúrgico da sepse abdominal, assinale o que for verdadeiro:"],"a":{"A":"As relaparotomias podem ser feitas sob demanda ou de forma programada, a depender da dinâmica organizacional do serviço","B":"O tratamento exclusivamente clínico da sepse abdominal é prática médica proscrita, independentemente da etiologia","C":"As drenagens percutâneas de coleções cavitárias não têm potencial resolutivo, funcionando apenas como ponte para relaparotomias","D":"A coleta de culturas de coleções cavitárias não tem impacto na conduta"},"ok":"Existem duas estratégias formalmente descritas para a peritonite grave: a relaparotomia sob demanda (reoperar apenas diante de deterioração clínica ou nova evidência de foco) e a relaparotomia programada (reintervenções em intervalos fixos, tipicamente 24–48 h). O ensaio randomizado de van Ruler e colaboradores não mostrou diferença de mortalidade, mas a estratégia sob demanda associou-se a menos reoperações, menor tempo de UTI e menor custo — sendo hoje a preferida, com a programada reservada a situações selecionadas e à disponibilidade do serviço.","w":{"B":"Absoluto e falso. Há cenários em que o tratamento é clínico ou minimamente invasivo: diverticulite Hinchey Ib/II com abscesso drenável, apendicite não complicada com tratamento antibiótico, abscesso pericólico pequeno.","C":"Falso. A drenagem percutânea guiada por imagem é definitiva em boa parte dos abscessos intra-abdominais únicos, bem delimitados e acessíveis — resolve sem laparotomia em cerca de 70–80% dos casos.","D":"Falso. A cultura orienta o descalonamento, identifica resistência e é especialmente relevante em infecção de origem hospitalar, uso prévio de antimicrobianos e falha terapêutica."},"p":["Conteúdo repetido: a mesma distinção entre relaparotomia programada e sob demanda reaparece no Caso 10 (abdome agudo), questão 12."],"f":"van Ruler O et al., JAMA 2007 — Comparison of on-demand vs planned relaparotomy strategy in severe peritonitis; WSES Guidelines for management of intra-abdominal infections; Sabiston, 21ª ed., cap. 45."},{"v":"Vol. I","c":3,"n":7,"g":"C","s":["Paciente no 5º dia de pós-operatório de colectomia direita apresenta dispneia (FR 25), taquicardia (110), distensão abdominal, náuseas e vômitos. A ferida drena secreção sero-hemática. A tomografia revela pequeno pneumoperitônio e discreta lâmina de líquido em goteiras e pelve. Marque a melhor alternativa."],"a":{"A":"Trata-se de embolia pulmonar e o anticoagulante deve ser iniciado imediatamente em dose plena","B":"Trata-se de infecção pós-operatória e devemos iniciar antibióticos de largo espectro","C":"Trata-se de infecção e a instituição de antibiótico é indiscutível; laparotomia exploradora com colostomia é necessária","D":"Trata-se de embolia pulmonar e a passagem de filtro de veia cava é a melhor opção"},"ok":"O quadro é de deiscência de anastomose colorretal, cujo pico de incidência é entre o 5º e o 7º dia de pós-operatório. Os elementos são clássicos: taquipneia e taquicardia (repercussão sistêmica), íleo com distensão e vômitos, drenagem sero-hemática pela ferida e, na TC, pneumoperitônio persistente com líquido livre. O manejo padrão em paciente com repercussão sistêmica é estabilização, antibiótico de amplo espectro e laparotomia com desfazimento da anastomose e derivação fecal (estoma). O termo \"colostomia\" na alternativa é usado genericamente para derivação — após colectomia direita seria tecnicamente uma ileostomia terminal —, mas é a única alternativa que contempla a reoperação, que é o ponto central.","w":{"A":"Embolia pulmonar não causa pneumoperitônio, distensão abdominal nem drenagem sero-hemática pela ferida. Anticoagular plenamente um paciente com deiscência seria potencialmente catastrófico.","B":"Está parcialmente certa — infecção existe e o antibiótico é necessário —, mas é insuficiente. Sem controle do foco, o antibiótico isolado não resolve deiscência com peritonite; é o erro clássico de tratar sepse abdominal sem operar.","D":"Mesmo erro diagnóstico da alternativa A, agravado por propor filtro de veia cava, cuja indicação é restrita a TEV comprovado com contraindicação à anticoagulação."},"p":["Pneumoperitônio residual é esperado até cerca de 3 a 7 dias após laparotomia. O que caracteriza deiscência não é o gás isolado, mas o gás associado a líquido livre, coleção e deterioração clínica."],"f":"Sabiston, 21ª ed., cap. 51 (Cólon e reto); ASCRS Clinical Practice Guidelines — management of anastomotic leak."},{"v":"Vol. I","c":3,"n":8,"g":"A","s":["A infecção relacionada à assistência à saúde representa o efeito adverso mais frequente nos pacientes que recebem cuidados assistenciais. De acordo com a OMS, é incorreto afirmar que:"],"a":{"A":"É recomendado o banho pré-operatório com clorexidina para a redução de infecção do sítio cirúrgico, sendo superior ao banho com sabonete antimicrobiano","B":"A profilaxia antibiótica cirúrgica deve ser realizada idealmente 120 minutos antes da incisão, respeitando a meia-vida do antimicrobiano","C":"A tricotomia só deve ser realizada se absolutamente necessária, evitando o uso de lâminas","D":"Não há evidência científica para descontinuar os imunossupressores no pré-operatório"},"ok":"Enunciado negativo. A afirmação A é a falsa: a OMS recomenda o banho pré-operatório, mas afirma explicitamente que não há evidência de superioridade da clorexidina sobre sabonete comum ou antimicrobiano para essa finalidade. Alegar superioridade é extrapolar a diretriz — exatamente o erro plantado, já explorado na questão 3.","w":{"B":"Verdadeira, é a recomendação forte da diretriz, cobrada pela terceira vez neste caso.","C":"Verdadeira. A recomendação é não realizar tricotomia; se indispensável, usar clipper elétrico, nunca lâmina.","D":"Verdadeira. A OMS afirma que não há evidência suficiente para recomendar a suspensão rotineira de imunossupressores no pré- operatório, decisão que deve ser individualizada com o especialista que acompanha o paciente. Fonte: OMS — Global Guidelines for the Prevention of Surgical Site Infection (2018), recomendações 1, 2, 4 e 6."},"p":[],"f":""},{"v":"Vol. I","c":3,"n":9,"g":"C","s":["Qual dos antissépticos abaixo age principalmente por indução de radicais livres?"],"a":{"A":"Clorexidina","B":"Álcool 70%","C":"H₂O₂ (peróxido de hidrogênio)","D":"Violeta de genciana"},"ok":"O peróxido de hidrogênio é um agente oxidante. Ao ser decomposto, gera radicais hidroxila (•OH), extremamente reativos, que atacam lipídios de membrana, proteínas e DNA microbiano. É particularmente eficaz contra anaeróbios, que não possuem catalase ou superóxido-dismutase para neutralizar esses radicais — daí seu uso histórico em feridas contaminadas, hoje restrito por citotoxicidade sobre fibroblastos.","w":{"A":"A clorexidina é uma biguanida catiônica: liga-se à membrana bacteriana carregada negativamente, rompendo sua integridade e precipitando o conteúdo citoplasmático. Não gera radicais livres.","B":"O álcool age por desnaturação de proteínas e dissolução de lipídios de membrana. Precisa de água para agir, razão pela qual o álcool 70% é mais eficaz que o absoluto.","D":"A violeta de genciana é um corante trifenilmetano com ação antifúngica e antibacteriana por interferência na parede celular, sem relação com estresse oxidativo. Fonte: Sabiston, 21ª ed., cap. 12; Rutala WA, Weber DJ — CDC Guideline for Disinfection and Sterilization in Healthcare Facilities."},"p":[],"f":""},{"v":"Vol. I","c":3,"n":10,"g":"C","s":["Paciente de 50 anos operado de colecistectomia aberta em caráter de urgência recebe alta no 1º dia de pós-operatório. Achado de colecistite aguda. HAS controlada. Marque a melhor alternativa."],"a":{"A":"O uso de antibiótico profilático neste caso deve ser prolongado por 7 dias","B":"Em colecistite faz-se necessário prolongar o antibiótico para evitarmos uma colangite","C":"O antibiótico profilático deve ser instituído na indução anestésica e mantido em concentração plasmática até o término da cirurgia","D":"O peritônio se defende mal em casos de infecção, daí a necessidade de manter por mais tempo a profilaxia"},"ok":"Este é o conceito central de profilaxia (distinta de terapia): o objetivo é manter concentração tecidual acima da CIM durante todo o período em que a ferida está aberta. Isso significa dose na indução e redose intraoperatória se a cirurgia ultrapassar duas meias-vidas do fármaco (cerca de 4 h para cefazolina) ou se houver perda sanguínea superior a 1500 mL. Encerrada a cirurgia com foco controlado, a profilaxia termina.","w":{"A":"Prolongar por 7 dias não reduz ISC, aumenta seleção de resistência, risco de C. difficile e custo. Nenhuma diretriz sustenta essa conduta em colecistite grau I com colecistectomia completa.","B":"Confunde os cenários. Colangite é infecção da via biliar por obstrução do colédoco — não é prevenida por antibiótico após colecistectomia. Retirar a vesícula não gera nem previne colangite.","D":"Fisiologicamente falso e é o inverso do que ocorre. O peritônio tem excelente capacidade de defesa: grande população de macrófagos residentes, drenagem linfática ativa pelos estomas diafragmáticos e capacidade de bloquear focos com o omento. É o subcutâneo que se defende mal."},"p":["Regra do \"início e fim\": profilaxia começa na indução e termina ao final da cirurgia. Se o cirurgião quiser manter antibiótico depois, isso já é terapia, e precisa de justificativa (foco não controlado, colecistite grau III, perfuração, gangrena)."],"f":"OMS — Global Guidelines for the Prevention of SSI (2018), recomendação sobre não prolongar profilaxia no pós-operatório; Tokyo Guidelines 2018; Sabiston, 21ª ed., cap. 12."},{"v":"Vol. I","c":3,"n":11,"g":"A","s":["Qual das características abaixo seria adequada para um antimicrobiano ser usado na antibioticoprofilaxia cirúrgica?"],"a":{"A":"Dose única","B":"Largo espectro","C":"Versátil, usado também como terapêutico","D":"Ser também fungicida"},"ok":"O antimicrobiano profilático ideal reúne: espectro estreito, dirigido à flora esperada do sítio operatório; boa penetração tecidual; meia-vida que permita cobertura em dose única; baixo custo; baixa toxicidade; e que não seja o mesmo fármaco usado como terapêutico de resgate na instituição. A cefazolina é o protótipo. A dose única é a característica que sintetiza todas as outras.","w":{"B":"Largo espectro é indesejável na profilaxia: seleciona flora resistente e aumenta o risco de C. difficile, sem ganho de eficácia.","C":"Justamente o contrário do princípio: reservar os antimicrobianos terapêuticos (carbapenêmicos, piperacilina-tazobactam, vancomicina) preserva sua eficácia para quando forem realmente necessários.","D":"Cobertura antifúngica não faz parte da profilaxia cirúrgica de rotina. Só se cogita antifúngico em cenários específicos, como perfuração de trato gastrointestinal superior em paciente imunossuprimido ou com uso prolongado de antibiótico."},"p":["Profilaxia = espectro estreito, dose única, na indução, redose se a cirurgia se prolongar. Terapia = espectro ajustado ao foco e à gravidade, com duração definida e descalonamento pela cultura."],"f":"Sabiston, 21ª ed., cap. 12; ASHP Therapeutic Guidelines on Antimicrobial Prophylaxis in Surgery; OMS Global Guidelines (2018)."},{"v":"Vol. I","c":4,"n":1,"g":"D","s":["Dentre os vários marcadores de desnutrição e risco cirúrgico, destaca-se a albumina sérica. Assinale a alternativa que representa a interpretação mais atual do seu significado clínico-laboratorial:"],"a":{"A":"A albuminemia serve como medida indireta da massa proteica corporal","B":"A albuminemia serve como aferição indireta do estado nutricional","C":"A albuminemia não sofre influência de condições pró-inflamatórias","D":"A albuminemia tem correlação estreita com o risco cirúrgico"},"ok":"A albumina é hoje entendida como marcador de gravidade da doença e de inflamação, não de nutrição. Justamente por isso ela mantém excelente valor prognóstico: albumina baixa identifica pacientes com maior morbimortalidade, deiscência de anastomose e infecção de sítio cirúrgico. A correlação com risco cirúrgico é robusta e sobrevive a todas as revisões — o que caiu foi o uso dela como termômetro nutricional.","w":{"A":"Sua meia-vida longa (cerca de 20 dias) e a grande reserva extravascular fazem dela um péssimo espelho da massa proteica corporal, que pode variar muito antes que a albumina se mova.","B":"Mesmo raciocínio: a albuminemia responde muito mais à inflamação e ao estado volêmico do que à ingestão. Um paciente pode estar gravemente desnutrido com albumina normal e vice-versa.","C":"Falso e é o oposto da fisiologia. A albumina é proteína de fase aguda negativa: na inflamação, a IL-6 redireciona a síntese hepática para PCR e fibrinogênio, a permeabilidade capilar aumenta e a albumina extravasa. Cai rapidamente em sepse, trauma e pós-operatório, independentemente da nutrição."},"p":["Hierarquia dos marcadores: albumina = prognóstico; pré-albumina (transtirretina, meia-vida 2 dias) = resposta recente à terapia nutricional; transferrina (8 dias) = intermediária, mas sofre influência do ferro; contagem de linfócitos = grosseira."],"f":"Sabiston, 21ª ed., cap. 6 (Suporte metabólico e nutricional); ESPEN Guideline on Clinical Nutrition in Su
