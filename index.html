 usar?","Apenas na HDA VARICOSA (vasoconstrição esplâncnica ↓ fluxo portal). Não é rotina na HDA não varicosa. Na varicosa: associar antibiótico (ceftriaxone), endoscopia em ≤ 12 h; Baveno VII: TIPS precoce em Child C 10–13 ou Child B > 7 com sangramento ativo.","Caso10_AbdomeAgudo ATUALIZADO"],["B","Escore de Glasgow-Blatchford: variáveis e uso?","Ureia, hemoglobina, PAS, FC, melena, síncope, hepatopatia, insuficiência cardíaca (0–23). Escore 0–1: baixo risco, alta com endoscopia ambulatorial.","Caso10_HDA"],["B","Classificação de Forrest e condutas?","IA jato arterial, IB babação, IIA vaso visível (alto risco → terapia endoscópica obrigatória), IIB coágulo aderido, IIC hematina, III base limpa. Pós-terapia: IBP em dose alta por 72 h; endoscopia em ≤ 24 h; transfusão restritiva (Hb < 7; < 8 se cardiopata).","Caso10_HDA ATUALIZADO"],["B","Abdome em tábua + choque, tabagista/etilista: exame e conduta?","RX de tórax em pé (pneumoperitônio sob as cúpulas); alternativa: decúbito lateral esquerdo com raios horizontais. Úlcera duodenal perfurada: rafia simples + omental patch (Graham).","Caso10_AbdomeAgudo"],["B","Onde a úlcera péptica perfura com mais frequência?","Parede anterior do duodeno (a posterior sangra: artéria gastroduodenal).","Caso10_AbdomeAgudo"],["B","Mnemônico do escore de Alvarado (MANTRELS)?","Migração da dor 1, Anorexia 1, Náusea/vômito 1, Tensão em FID 2, Rebote 1, Elevação de temperatura 1, Leucocitose 2, Shift à esquerda 1 (total 10). 0–3: baixa; 4–6: intermediária (imagem); ≥ 7: alta probabilidade.","Caso10_Apendicite"],["B","Sequência da dor na apendicite?","Visceral periumbilical difusa (fibras C, distensão) → somática localizada em FID (A-delta, peritônio parietal). A migração é o sinal mais valioso.","Caso10_Apendicite"],["B","Apendicite aguda confirmada em homem jovem (Alvarado ≥ 8, USG positiva): conduta?","Apendicectomia videolaparoscópica com antibiótico profilático pré-incisional em dose única. ⚠️ O banco tem a mesma questão com gabaritos diferentes (B e D): a literatura apoia D; não pedir TC se o diagnóstico já está firmado.","Caso10_Apendicite ATUALIZADO"],["B","Antibiótico na apendicite: não complicada × complicada?","Não complicada: profilaxia pré-incisional, sem manutenção. Complicada (perfurada/abscesso/peritonite): 3–5 dias após controle do foco.","Caso10_Apendicite"],["B","Tratamento não operatório da apendicite: evidências?","Possível na não complicada (APPAC, CODA), mas com recorrência: ~27% em 1 ano e 39% em 5 anos (APPAC); CODA: ~29% operados em 90 dias (apendicolito aumenta o risco de falha). Padrão continua sendo apendicectomia.","Caso10_Apendicite"],["B","Imagem na suspeita de apendicite: qual primeiro?","USG em jovens, crianças, mulheres e gestantes (com RM se inconclusivo na gestante); TC preferida em homens adultos e idosos ou quando USG inconclusiva.","Caso10_Apendicite"],["B","Classificação de Hinchey da diverticulite?","I: abscesso pericólico (Ia flegmão, Ib abscesso confinado). II: abscesso pélvico/retroperitoneal/à distância. III: peritonite purulenta. IV: peritonite fecal.","Caso10_Diverticulite"],["B","Diverticulite com abscesso: conduta pelo tamanho?","< 4 cm: antibiótico isolado. > 4–5 cm: drenagem percutânea guiada por imagem + antibiótico. Imunossuprimidos (corticoide) têm maior risco de falha. Diverticulite não complicada: antibiótico seletivo (DIABOLO/AVOD).","Caso10_Diverticulite ATUALIZADO"],["B","Dor desproporcional ao exame + FA + evacuação reflexa: diagnóstico e exame?","Isquemia mesentérica aguda (embolia da AMS). Exame: angiotomografia com fases arterial e venosa; lactato sobe tarde e normal não exclui. Tratar com revascularização (embolectomia/endovascular) e laparotomia se necrose.","Caso10_AbdomeAgudo"],["B","Obstrução de delgado por brida sem sinais de estrangulamento: conduta?","Tratamento conservador (SNG, hidratação, reavaliação) por 24–72 h; 70–80% resolvem. Teste com contraste hidrossolúvel (gastrografina) ajuda: se não chegar ao cólon em 24 h, operar.","Caso10_AbdomeAgudo ATUALIZADO"],["B","Sinais de estrangulamento na obstrução intestinal?","Dor contínua intensa, febre, taquicardia, peritonite, leucocitose, lactato elevado, acidose; na TC: espessamento parietal, pneumatose, ↓ realce parietal, líquido livre. Pneumatose + gás portal = necrose → sala imediata.","Caso10_AbdomeAgudo"],["B","Fasciíte necrotizante de parede abdominal: conduta?","Emergência: antibiótico amplo espectro + desbridamento cirúrgico imediato e extenso, com reabordagens. Escore LRINEC (PCR, leucócitos, Hb, Na, creatinina, glicose) auxilia, mas não exclui; dor desproporcional, crepitação, gás em planos musculares.","Caso10_AbdomeAgudo"],["B","Laparotomia programada × por demanda?","Programada: reoperar a cada 24–48 h independentemente da evolução. Por demanda: reoperar se deterioração/foco não controlado. van Ruler: mortalidade igual, menos reoperações e custos na por demanda.","Caso10_AbdomeAgudo"],["B","Método de maior acurácia para o estadiamento locorregional (T e N) do câncer de esôfago?","Ecoendoscopia (EUS): vê as 5 camadas da parede, acurácia 85–90% para T e permite punção de linfonodos.","Caso11_Esofago"],["B","Sequência de estadiamento do câncer de esôfago?","EDA com biópsia → TC tórax/abdome (M) → ecoendoscopia (T e N) → PET-CT (doença oculta) → broncoscopia se terço médio/superior (invasão traqueobrônquica).","Caso11_Esofago"],["B","Disfagia progressiva + perda de peso em tabagista/etilista: primeira conduta?","EDA com biópsia (câncer até prova em contrário) + suporte nutricional (sonda nasoenteral ou jejunostomia; evitar gastrostomia se o estômago será conduto).","Caso11_Esofago"],["B","T4a × T4b no esôfago (AJCC)?","T4a (pleura, pericárdio, diafragma, peritônio): RESSECÁVEL. T4b (aorta, traqueia, brônquio, coração, grandes vasos, corpo vertebral): irressecável. Também irressecável: fístula traqueoesofágica e metástases à distância.","Caso11_Esofago"],["B","Gânglio do tronco celíaco isolado no câncer de esôfago distal: contraindica cirurgia?","⚠️ Gabarito do banco: sim. Atualização: no AJCC 8ª ed., para esôfago distal/JEG os linfonodos celíacos passaram a ser regionais (N), logo não contraindicam por si só; confirmar a posição do tutor.","Caso11_Esofago ATUALIZADO"],["B","Conduta no carcinoma epidermoide de esôfago por estádio?","T1a N0: ressecção endoscópica. T1b–T2 N0: esofagectomia direta. T2 de risco, T3–T4a ou qualquer N+: neoadjuvância (CROSS) → esofagectomia. T4b ou M1: sistêmico/paliativo.","Caso11_Esofago"],["B","Esquema CROSS: composição e resultado?","Carboplatina + paclitaxel semanais + RT 41,4 Gy → esofagectomia. Sobrevida mediana 24 → 49 meses; resposta patológica completa ~29% (49% nos epidermoides). Atualização: no ADENOCARCINOMA, o ESOPEC (ASCO 2024, 438 pacientes) mostrou FLOT perioperatório superior ao CROSS: sobrevida mediana 66 × 37 meses, SG em 3 anos 57% × 51% (HR 0,70), pCR 19% × 14%. CROSS segue razoável em quem não tolera FLOT.","Caso11_Esofago ATUALIZADO"],["B","Epidermoide × adenocarcinoma de esôfago: resposta terapêutica?","Epidermoide: muito radiossensível (CROSS ou QRT definitiva). Adenocarcinoma de junção: quimioterapia perioperatória (FLOT) ou CROSS. Atualização: após CRT com doença residual, nivolumabe adjuvante (CheckMate 577).","Caso11_Esofago ATUALIZADO"],["B","Classificação de Siewert e tratamento?","I: centro 1–5 cm acima da JEG (esofagectomia). II: de 1 cm acima a 2 cm abaixo (cárdia verdadeira; gastrectomia total + esofagectomia distal com D2 ou esofagectomia). III: 2–5 cm abaixo (gastrectomia total). T3N1: terapia perioperatória (FLOT).","Caso11_Esofago"],["B","Disfagia para sólidos E líquidos desde o início + bico de pássaro + EDA normal: diagnóstico e próximo exame?","Acalasia: manometria esofágica (padrão-ouro). Tratamento: miotomia de Heller (com fundoplicatura parcial) ou POEM.","Caso11_Acalasia"],["B","Classificação de Chicago da acalasia?","Tipo I: clássica (sem pressurização). Tipo II: pressurização panesofágica (melhor resposta ao tratamento). Tipo III: espástica (melhor resposta ao POEM, miotomia mais longa). Chicago 4.0 (2021) mantém os subtipos.","Caso11_Acalasia ATUALIZADO"],["B","Classificação de Rezende do megaesôfago chagásico e conduta?","I: calibre normal com retardo. II: até 7 cm. III: 7–10 cm. IV: > 10 cm (dolicomegaesôfago). I–II: Heller ou POEM. III–IV: cirurgia de Aquino (mucosectomia por invaginação, sem toracotomia) ou esofagectomia.","Caso11_Acalasia"],["B","Divertículo de Zenker: tríade, anatomia e tratamento?","Disfagia, halitose, regurgitação de alimento não digerido (idoso). Divertículo de pulsão (falso) no triângulo de Killian (constritor inferior × cricofaríngeo). Tratamento: diverticulotomia endoscópica com miotomia cricofaríngea.","Caso11_Esofago"],["B","Regurgitação de alimento NÃO digerido sem ácido: o que sugere?","Obstáculo acima do estômago (Zenker ou acalasia); regurgitação ácida/amarga sugere refluxo.","Caso11_Esofago"],["B","Indicações de cirurgia antirrefluxo?","Falha/intolerância ao tratamento clínico, jovem que não quer IBP por décadas, complicações (esofagite grave, estenose, Barrett), manifestações extraesofágicas com dano estrutural (pneumonia de repetição, bronquiectasia, fibrose por microaspiração).","Caso11_DRGE"],["B","Lauren intestinal × difuso?","Intestinal: idoso, homem, distal, glandular, H. pylori/metaplasia, melhor prognóstico. Difuso: jovem, mulher, proximal/linite plástica, anel de sinete, CDH1 (E-caderina), disseminação peritoneal, pior prognóstico.","Caso12_Estomago"],["B","Fatores de risco do câncer gástrico?","H. pylori, tabagismo, dieta salgada/defumada, gastrite atrófica/anemia perniciosa, pólipos adenomatosos, gastrectomia prévia (coto após 15–20 anos), Ménétrier, grupo A, síndromes hereditárias. Plummer-Vinson NÃO (associa-se a CEC de esôfago/hipofaringe).","Caso12_Estomago"],["B","Síndrome de Plummer-Vinson?","Anemia ferropriva + disfagia + membrana esofágica cervical; risco de carcinoma epidermoide de esôfago e hipofaringe.","Caso12_Esofago"],["B","Pacote do sangramento varicoso agudo?","Ressuscitação restritiva (Hb alvo 7–8), vasoativo (terlipressina/octreotide), antibiótico profilático (ceftriaxone), endoscopia em ≤ 12 h com ligadura, balão de Sengstaken-Blakemore como ponte, TIPS precoce em alto risco. Betabloqueador NÃO no episódio agudo (profilaxia).","Caso12_HDA"],["B","Gastrectomia total: reconstrução e reposição pós-operatória?","Y de Roux (esofagojejunostomia). Repor vitamina B12 (cianocobalamina; sem fator intrínseco) de forma vitalícia; também ferro, cálcio, vitamina D e às vezes folato.","Caso12_Estomago"],["B","Tumor intestinal de corpo gástrico: cirurgia e princípios ERAS?","Gastrectomia total + Y de Roux + linfadenectomia D2; sem SNG nem dreno de rotina.","Caso12_Estomago"],["B","FLOT × MAGIC (ECF) no câncer gástrico?","FLOT (docetaxel, oxaliplatina, leucovorina, 5-FU) perioperatório superou ECF/ECX: sobrevida mediana 50 × 35 meses (FLOT4-AIO). Atualização: MATTERHORN (2025) mostrou ganho de sobrevida livre de evento ao adicionar durvalumabe ao FLOT (confirmar aprovação local).","Caso12_Estomago ATUALIZADO"],["B","Reconstruções após gastrectomia parcial?","Billroth I (gastroduodenostomia, fisiológica; exige coto móvel sem tensão); Billroth II (gastrojejunostomia com alça aferente: refluxo alcalino e síndrome da alça aferente); Y de Roux (menos refluxo). Billroth é IMPOSSÍVEL após gastrectomia total (sem coto).","Caso12_Estomago"],["B","GIST gástrico: origem, marcadores e cirurgia?","Células intersticiais de Cajal; CD117 (c-KIT) e DOG-1 positivos. Dissemina por via hematogênica/peritoneal, quase nunca linfática: ressecção em cunha R0, SEM linfadenectomia, sem romper a pseudocápsula. Adjuvante: imatinibe 3 anos em alto risco (estudos recentes sugerem 5 anos em risco muito alto; confirmar).","Caso12_Estomago ATUALIZADO"],["B","Lesão de Dieulafoy: o que é e qual artéria?","Artéria submucosa de calibre persistente que erode a mucosa normal e sangra maciçamente; típica nos 6 cm proximais à JEG na curvatura menor (território da artéria gástrica esquerda).","Caso12_HDA"],["B","Vascularização gástrica?","Curvatura menor: gástrica esquerda (tronco celíaco) e direita (hepática própria). Curvatura maior: gastro-omental esquerda (esplênica) e direita (gastroduodenal). Fundo: vasos curtos (esplênica).","Caso12_Estomago"],["B","Linfadenectomia D1 × D2 no câncer gástrico?","D1: estações perigástricas 1–6. D2: D1 + 7 (gástrica esquerda), 8 (hepática comum), 9 (tronco celíaco), 10 (hilo esplênico) e 11 (esplênica). Adequada: ≥ 16 linfonodos. A. mesentérica superior (14v) é D3. Sem esplenectomia/pancreatectomia de rotina.","Caso12_Estomago"],["B","Síndrome da alça aferente: quadro e tratamento?","Complicação do Billroth II: dor pós-prandial aliviada por vômito bilioso em jato sem alimento. Correção: conversão para Y de Roux.","Caso12_Estomago"],["B","Complicações pós-gastrectomia: diferenciais?","Alça aferente: vômito bilioso em jato que alivia. Gastrite alcalina: dor em queimação contínua, vômito bilioso sem alívio. Dumping precoce: 15–30 min após refeição (vasomotor). Dumping tardio: hipoglicemia 1–3 h depois.","Caso12_Estomago"],["B","Metástase hepática colorretal ressecável: papel da cirurgia?","Intenção curativa: ressecção R0 com fígado remanescente funcional ≥ 20–30% eleva a sobrevida em 5 anos para 35–60%.","Caso12_FigadoMetastase"],["B","O H. pylori e a úlcera gástrica no câncer gástrico?","H. pylori é carcinógeno classe I (IARC/OMS); a úlcera gástrica NÃO é lesão precursora, mas lesões malignas podem se apresentar ulceradas: biopsiar toda úlcera gástrica (múltiplos fragmentos das bordas) e reendoscopar. Erradicar antes da atrofia reduz o risco.","Caso12_Estomago"],["B","Alteração do hábito intestinal + perda de peso aos 65 anos: achado laboratorial provável e conduta?","Anemia ferropriva (sangramento oculto) → colonoscopia (neoplasia colorretal até prova em contrário). Sinais de alarme: sangramento retal, anemia, mudança persistente do hábito, perda ponderal, massa.","Caso12_ColonReto"],["B","Câncer gástrico com biópsia confirmada: próximo passo?","Estadiamento: TC tórax/abdome/pelve com contraste + laparoscopia com lavado peritoneal em T3–T4 ou N+ (citologia positiva = M1). Ecoendoscopia para T/N.","Caso12_Estomago"],["B","Adenocarcinoma centrado 3 cm abaixo da JEG, localmente avançado: conduta?","Siewert III: FLOT perioperatório + gastrectomia total com D2 (com esofagectomia distal se necessário). Siewert I: esofagectomia; II: gastrectomia total com esofagectomia distal.","Caso12_Estomago"],["B","Equação de Harris-Benedict: variáveis?","Sexo, idade, peso e altura (GEB). Homens: 66,5 + 13,75·peso + 5,003·altura(cm) − 6,775·idade. Mulheres: 655,1 + 9,563·peso + 1,850·altura − 4,676·idade. Multiplicar por fatores de atividade e estresse; padrão-ouro: calorimetria indireta.","Caso12_Nutricao"],["B","Úlcera perfurada com pneumoperitônio e instabilidade: tratamento definitivo?","Laparotomia (ou laparoscopia) com rafia simples + omentoplastia (Graham) e erradicação do H. pylori; teste/biópsia se úlcera gástrica.","Caso12_Estomago"],["B","TNM do câncer gástrico (AJCC 8ª ed.)?","T1a mucosa; T1b submucosa; T2 muscular própria; T3 subserosa; T4a serosa; T4b estruturas adjacentes. N1: 1–2 linfonodos; N2: 3–6; N3a: 7–15; N3b: ≥ 16.","Caso12_Estomago"],["B","Lauren difuso: característica e margem cirúrgica?","Crescimento infiltrativo (perda de E-caderina/CDH1), disseminação peritoneal, tumor de Krukenberg. Margem proximal maior (5–8 cm no difuso, 3–5 cm no intestinal).","Caso12_Estomago"],["B","Vômitos incoercíveis por obstrução pilórica: distúrbio e correção?","Alcalose metabólica hipoclorêmica e hipocalêmica com aciduria paradoxal (hipovolemia → aldosterona retém Na⁺ e excreta K⁺/H⁺). Correção: SF 0,9% + cloreto de potássio.","Caso12_Estomago"],["B","Bypass gástrico em Y de Roux com dor abdominal e perda ponderal importante: complicação a lembrar?","Hérnia interna (espaço de Petersen, mesocólon transverso, brecha jejunojejunal): obstrução da alça biliopancreática. TC pode ser normal; sinal do redemoinho; ter baixo limiar para laparoscopia. Fechar as brechas mesentéricas reduz o risco.","Caso12_Estomago"],["B","Cirurgia para tumor de cabeça do pâncreas?","Duodenopancreatectomia (Whipple), clássica (com antrectomia) ou com preservação pilórica (Traverso-Longmire); sem diferença oncológica.","Caso13_Pancreas"],["B","Principal complicação do Whipple e fatores de risco?","Fístula pancreática (ISGPS 2016: grau B/C; elevação isolada da amilase = \"fístula bioquímica\"). Risco: ducto fino (< 3 mm) e parênquima mole (pâncreas normal é o mais perigoso).","Caso13_Pancreas ATUALIZADO"],["B","Adenocarcinoma de pâncreas com metástase hepática e CA 19-9 de 1500: conduta?","Estádio IV: quimioterapia paliativa (FOLFIRINOX/NALIRIFOX ou gemcitabina + nab-paclitaxel) + drenagem biliar se necessário. Sem ressecção.","Caso13_Pancreas ATUALIZADO"],["B","CA 19-9 no câncer de pâncreas: armadilhas?","> 500–1000 sugere doença avançada; sobe em colestase benigna; falso-negativo em Lewis-negativos (5–10%). Não serve para rastreio.","Caso13_Pancreas"],["B","Neoplasia sólida pseudopapilar (Frantz): perfil?","Mulher jovem (20–30 anos), oligossintomática, massa volumosa sólido-cística com hemorragia e cápsula, baixo grau de malignidade; ressecção completa é curativa em > 95%.","Caso13_Pancreas"],["B","Sinal de Courvoisier-Terrier?","Vesícula palpável, indolor e distendida em paciente ictérico → obstrução biliar crônica de causa neoplásica (periampular), não cálculo.","Caso13_Pancreas"],["B","Quais são os tumores periampulares?","Cabeça do pâncreas (mais comum, pior prognóstico), ampola de Vater (melhor), colédoco distal e duodeno. Tratados pela mesma operação: duodenopancreatectomia.","Caso13_Pancreas"],["B","Escala ECOG?","0 plenamente ativo. 1 restrito a atividade extenuante, ambulatorial. 2 autocuidado, fora do leito > 50% do tempo, não trabalha. 3 autocuidado limitado, leito/cadeira > 50%. 4 totalmente dependente. 5 morte. (Zubrod = ECOG.)","Caso13_Pancreas"],["B","Tipo histológico mais comum do câncer de pâncreas e localização?","Adenocarcinoma ductal (85–90%), com intensa desmoplasia; 60–70% na cabeça. Neuroendócrinos: ~3–5%, prognóstico muito melhor.","Caso13_Pancreas"],["B","Ressecabilidade do adenocarcinoma de pâncreas (NCCN)?","Ressecável: sem contato arterial e contato venoso ≤ 180° sem irregularidade. Borderline: contato arterial ≤ 180° ou venoso > 180° reconstruível. Irressecável: envolvimento arterial > 180° (AMS/tronco celíaco circunferencial) ou metástases.","Caso13_Pancreas"],["B","Tumor de cabeça de pâncreas ictérico, borderline (contato venoso > 180°): conduta?","Prótese biliar endoscópica + quimioterapia neoadjuvante (FOLFIRINOX ou gencitabina + nab-paclitaxel) → reestadiar → cirurgia. Drenagem biliar pré-op não é rotina se for direto para cirurgia (↑ infecção); indicar se colangite, prurido intratável, BT muito alta ou neoadjuvância.","Caso13_Pancreas ATUALIZADO"],["B","Tratamento adjuvante após ressecção do adenocarcinoma de pâncreas?","mFOLFIRINOX (PRODIGE 24: sobrevida mediana 54 vs 35 meses com gencitabina) em pacientes com bom PS.","Caso13_Pancreas ATUALIZADO"],["B","Diferenciação das neoplasias císticas do pâncreas?","Serosa: mulher idosa, microcística em \"favo de mel\" com cicatriz central, CEA baixo. Mucinosa cística: mulher de meia-idade, corpo/cauda, macrocística, estroma ovariano, sem comunicação ductal, CEA alto. IPMN: comunica com o ducto. Frantz: mulher jovem, sólido-cística.","Caso13_PancreasCistico"],["B","Líquido do cisto pancreático: como interpretar CEA e amilase?","CEA alto (> 192 ng/mL) = mucinoso (mucinosa cística ou IPMN). CEA baixo + amilase baixa = seroso. Amilase alta = comunicação ductal (pseudocisto ou IPMN).","Caso13_PancreasCistico"],["B","Estigmas de alto risco e características preocupantes nos cistos pancreáticos (Fukuoka)?","Alto risco (cirurgia): icterícia obstrutiva com lesão cefálica, componente sólido com realce, ducto principal ≥ 10 mm. Preocupantes (ecoendoscopia): cisto ≥ 3 cm, parede espessada com realce, ducto 5–9 mm, nódulo sem realce, pancreatite, diabetes recente, CA 19-9 elevado.","Caso13_PancreasCistico"],["B","Cisto < 3 cm sem estigmas: conduta?","Vigilância por imagem (RM/colangioRM): < 1 cm a cada 6 meses no 1º ano depois a cada 2 anos; 1–2 cm anual; 2–3 cm ecoendoscopia em 3–6 meses e alternar RM/EUS.","Caso13_PancreasCistico"],["B","Cisto mucinoso (CEA alto) volumoso e sintomático em corpo/cauda: conduta?","Pancreatectomia distal (potencial maligno; mucinosa cística quase exclusiva de mulher de 40–60 anos).","Caso13_PancreasCistico"],["B","IPMN: tipos e conduta?","Comunica com o ducto. Ducto principal: risco de malignidade 40–70% → ressecção. Ramo secundário: risco menor, vigilância. Misto: tratar como ducto principal. Sinal da \"olho de peixe\": papila patulosa com muco.","Caso13_PancreasCistico"],["B","Neoplasia neuroendócrina funcionante mais comum do pâncreas?","Insulinoma (benigno em ~90%, < 2 cm, solitário). Tríade de Whipple: sintomas de hipoglicemia, glicemia < 50 mg/dL e alívio com glicose. Cirurgia: enucleação. O mais comum em geral hoje são os não funcionantes.","Caso13_Pancreas"],["B","Padrão de imagem do hemangioma hepático?","Realce globular periférico na fase arterial com preenchimento centrípeto progressivo (portal/tardia). Dispensa biópsia (risco de sangramento); conduta expectante.","Caso13_Figado"],["B","HNF × adenoma hepático?","HNF: realce arterial homogêneo com cicatriz central, sem relação causal com ACO, conduta expectante. Adenoma: mulher com ACO, risco de sangramento/malignização: suspender ACO e ressecar se > 5 cm, homem, sintomático ou β-catenina mutado.","Caso13_Figado"],["B","CHC em paciente cirrótico: precisa de biópsia?","Não: nódulo > 1 cm com realce arterial + washout (LI-RADS 5) fecha o diagnóstico. Biópsia só em casos atípicos.","Caso13_Figado"],["B","Critérios de Milão para transplante no CHC?","1 nódulo ≤ 5 cm ou até 3 nódulos ≤ 3 cm, sem invasão vascular e sem doença extra-hepática. (UCSF e critérios estendidos são alternativas.)","Caso13_Figado"],["B","Volume mínimo de fígado remanescente após hepatectomia?","Fígado normal: 20–25%. Quimioterapiado/esteatótico: 30–40%. Cirrótico: ≥ 40%. Exigir 50% é falso. Estratégias: embolização portal, ALPPS.","Caso14_FigadoMetastase"],["B","Contraindicação à ressecção de metástase colorretal hepática?","Impossibilidade de R0 com remanescente funcional (ex.: invasão das 3 veias hepáticas). Não há limite numérico absoluto de lesões.","Caso14_FigadoMetastase"],["B","Pólipo maligno pedunculado: quando a polipectomia basta?","Adenocarcinoma bem/moderadamente diferenciado, sem invasão linfovascular, margem ≥ 1–2 mm, sem budding e Haggitt 1–3. Seguimento com colonoscopia em 3–6 meses. Cirurgia se Haggitt 4, invasão linfovascular, margem comprometida ou mal diferenciado.","Caso14_ColonReto"],["B","Classificação de Haggitt?","0: in situ. 1: submucosa da cabeça. 2: colo. 3: pedículo. 4: submucosa da parede abaixo do pedículo (risco linfonodal significativo).","Caso14_ColonReto"],["B","Fatores protetores contra câncer colorretal?","Aspirina/AINEs (inibição COX-2; CAPP2 na síndrome de Lynch), atividade física, fibras, cálcio, vitamina D e colonoscopia com polipectomia.","Caso14_ColonReto"],["B","Atualização: idade de início do rastreamento do câncer colorretal?","⚠️ 45 anos para risco médio (USPSTF 2021/ACS); antes se usava 50. Colonoscopia a cada 10 anos, ou FIT anual. História familiar: 40 anos ou 10 anos antes do caso índice.","Caso14_ColonReto ATUALIZADO"],["B","Regra de Goodsall?","Linha transversa pelo ânus: orifício externo ANTERIOR → trajeto radial direto à cripta; POSTERIOR → trajeto curvilíneo à linha média posterior. Exceção: anterior a > 3 cm da borda anal tende a seguir curva.","Caso14_ColonReto"],["B","Classificação de Parks das fístulas anorretais?","Interesfincteriana (~45%, mais comum), transesfincteriana (~30%), supraesfincteriana (~20%), extraesfincteriana (~5%, iatrogênica ou Crohn). Princípio: não seccionar esfíncter em excesso (seton em trajetos altos).","Caso14_ColonReto"],["B","Bethesda/Amsterdam e síndrome de Lynch: o que saber?","Mutações de reparo de mismatch (MLH1, MSH2, MSH6, PMS2, EPCAM), instabilidade de microssatélites; cólon direito, mucinoso, pouco diferenciado, infiltrado linfocitário. Câncer de cólon em Lynch: colectomia subtotal (↓ metacrônico até 40% em 10 anos); segmental com colonoscopia a cada 1–2 anos é alternativa aceita. Mulheres: histerectomia + salpingo-ooforectomia profilática após prole.","Caso14_ColonReto ATUALIZADO"],["B","Gene da síndrome de Peutz-Jeghers e características?","STK11/LKB1: pólipos hamartomatosos (delgado) e manchas melanocíticas mucocutâneas; risco de câncer de cólon, delgado, pâncreas, mama, ovário.","Caso14_ColonReto"],["B","Síndromes polipoides e genes?","FAP: APC (adenomatosos). Peutz-Jeghers: STK11. Polipose juvenil: SMAD4/BMPR1A. Cowden: PTEN. Polipose associada ao MUTYH: MUTYH (autossômica recessiva).","Caso14_ColonReto"],["B","Câncer de reto T3 e/ou N+ a 5 cm da margem anal: conduta?","Neoadjuvância (quimiorradioterapia) → ressecção anterior baixa com excisão total do mesorreto (ETM). Atualização: terapia neoadjuvante total (TNT: RAPIDO/PRODIGE 23) é cada vez mais usada; watch & wait em resposta clínica completa (Habr-Gama/OPRA).","Caso14_ColonReto ATUALIZADO"],["B","Regra decisiva: cólon × reto e neoadjuvância?","Cólon: cirurgia primeiro, adjuvância se estádio III ou II de alto risco. Reto: neoadjuvância a partir de T3 ou N+. Margem distal no reto: 2 cm em geral (1 cm aceitável em tumores baixos).","Caso14_ColonReto"],["B","Exame de escolha para estadiamento local do câncer de reto?","Ressonância de pelve: T, fáscia mesorretal (margem circunferencial), invasão venosa extramural, linfonodos. Complementar: ecoendoscopia retal em T1/T2.","Caso14_ColonReto"],["B","Sequência genética de Fearon-Vogelstein?","APC (adenoma precoce, via Wnt) → KRAS → perda de DCC/SMAD4 (18q) → p53 (carcinoma). Via alternativa: serrilhada (BRAF, MSI/CIMP).","Caso14_ColonReto"],["B","Câncer de sigmoide localizado sem metástases: cirurgia?","Retossigmoidectomia/colectomia, laparoscópica (equivalente oncológico), com ligadura vascular alta, mesocólon, margens ≥ 5 cm e ≥ 12 linfonodos examinados.","Caso14_ColonReto"],["B","Critérios de alto risco no estádio II do câncer de cólon (indicam adjuvância)?","T4, perfuração, obstrução, invasão linfovascular/perineural, mal diferenciado, margens comprometidas, < 12 linfonodos examinados (e MSS; dMMR/MSI-H tem bom prognóstico no II).","Caso14_ColonReto ATUALIZADO"],["B","Estadiamento colorretal resumido e adjuvância?","I: T1–T2 N0. II: T3–T4 N0. III: qualquer T com N+. IV: M1. Estádio III: FOLFOX ou CAPOX; IDEA: 3 meses (CAPOX) em T1–3 N1 de baixo risco e 6 meses em alto risco (T4 ou N2).","Caso14_ColonReto ATUALIZADO"],["B","Metástase hepática metacrônica pequena e ressecável de câncer de cólon: conduta?","Hepatectomia com intenção curativa (sobrevida em 5 anos 35–60%), com quimioterapia perioperatória conforme o caso.","Caso14_FigadoMetastase"],["B","Localização mais comum do colangiocarcinoma?","Peri-hilar (tumor de Klatskin, confluência dos hepáticos): 50–60%; distal 20–30%; intra-hepático 10–20%.","Caso15_ViasBiliares"],["B","Fatores de risco do colangiocarcinoma?","Colangite esclerosante primária (principal no Ocidente), cistos de colédoco, hepatolitíase, Clonorchis sinensis/Opisthorchis viverrini, thorotrast.","Caso15_ViasBiliares"],["B","Classificação de Bismuth-Corlette do Klatskin?","I: abaixo da confluência. II: atinge a confluência. IIIa: ducto hepático direito. IIIb: esquerdo. IV: ambos ou multifocal.","Caso15_ViasBiliares"],["B","Cirurgia no colangiocarcinoma Bismuth IIIa?","Hepatectomia direita + ressecção da via biliar extra-hepática + segmento I (lobo caudado, cujos ductos drenam na confluência). Considerar embolização portal e drenagem biliar do remanescente.","Caso15_ViasBiliares"],["B","Câncer de vesícula incidental: quando não reoperar?","Apenas em T1a (lâmina própria): colecistectomia simples com cístico livre é curativa. T1b/T2 ou mais: reoperação (colecistectomia radical com segmentos IVb/V e linfadenectomia).","Caso15_ViasBiliares"],["B","T do câncer de vesícula (AJCC 8ª)?","Tis; T1a lâmina própria; T1b muscular; T2a conjuntivo perimuscular lado peritoneal, T2b lado hepático; T3 perfura serosa ou invade fígado/órgão adjacente; T4 veia porta/artéria hepática ou ≥ 2 órgãos extra-hepáticos.","Caso15_ViasBiliares ATUALIZADO"],["B","CHC: aspectos que costumam cair e a inconsistência do banco?","CHC cresce em NASH/MASH (inclusive sem cirrose); AFP elevada em só 60–70%; relação com hemocromatose é VERDADEIRA (risco aumentado na cirrose por hemocromatose). ⚠️ Q15.2 pede a \"incorreta\" e tem duas falsas (C e D): confirmar com o tutor. Rastreamento: USG a cada 6 meses ± AFP.","Caso15_Figado ATUALIZADO"],["B","Por que o CHC é multicêntrico no cirrótico?","Carcinogênese de campo: todo o parênquima cirrótico está sob lesão-regeneração-displasia; o transplante trata tumor e cirrose e elimina recidiva multicêntrica.","Caso15_Figado"],["B","Por que o CHC mostra realce arterial e washout?","Neoangiogênese: tumor é irrigado pela artéria hepática, enquanto o parênquima recebe ~75% do fluxo pela porta. LI-RADS 5 = CHC definitivo (realce arterial + washout + cápsula + crescimento).","Caso15_Figado"],["B","Estadiamento BCLC do CHC (versão 2022)?","0: único ≤ 2 cm, Child A, PS 0 → ablação/ressecção. A: único ou até 3 ≤ 3 cm → ressecção, transplante (Milão) ou ablação. B: multinodular além de Milão → TACE. C: invasão vascular/metástase → sistêmico (atezolizumabe + bevacizumabe ou durvalumabe + tremelimumabe). D: Child C/PS 3–4 → suporte.","Caso15_Figado ATUALIZADO"],["B","Ressecção de CHC no cirrótico: requisitos e contraindicações?","Lesão única, função preservada (Child A, BT e INR normais) e sem hipertensão portal significativa. Contraindicam: GPVH ≥ 10 mmHg, plaquetas < 100 mil com esplenomegalia, varizes, ascite.","Caso15_Figado"],["B","Escala ECOG/Zubrod: paciente em repouso 40% do tempo?","ECOG 2 (ambulatorial, autocuidado, fora do leito > 50% do tempo, não trabalha). Mais de 50% no leito = ECOG 3.","Caso15_Figado"],["B","Adenoma hepático: subtipos e conduta?","HNF-1α inativado (esteatótico, ~35%, baixo risco); inflamatório (~40%, maior risco de sangrar; obesidade/álcool); β-catenina (~10%, maior risco de malignização). Suspender ACO; ressecar se > 5 cm, homem, β-catenina ou sintomático/complicado.","Caso15_Figado"],["B","HNF: achados e RM com contraste hepatoespecífico?","Realce arterial intenso homogêneo, cicatriz central estrelada (2/3 dos casos), 2ª lesão benigna mais comum. Resposta hiperplásica policlonal (não é neoplasia). Na RM com gadoxetato mantém captação na fase hepatobiliar (o adenoma \"lava\"). Conduta expectante.","Caso15_Figado"],["B","Padrão laboratorial: hepatocelular × colestático × misto (razão R)?","R = (ALT/LSN)/(FA/LSN). R > 5 hepatocelular; R < 2 colestático; 2–5 misto. Transaminases > 1000 + ductos finos no USG + uso de amoxicilina/AINE = hepatite medicamentosa: suspender e dar suporte (Hy's law: icterícia + lesão hepatocelular = gravidade).","Caso15_Figado"],["B","Abscesso hepático piogênico: investigação e agentes?","Origem portal (apendicite, diverticulite, neoplasia colorretal oculta): fazer colonoscopia, sobretudo com Streptococcus anginosus. Diabéticos (asiáticos): Klebsiella hipervirulenta com risco de endoftalmite e abscesso cerebral. Tratamento: drenagem percutânea + antibiótico prolongado.","Caso15_Figado"],["B","Icterícia + perda ponderal + vesícula palpável indolor + dilatação de vias biliares intra/extra-hepáticas: conduta?","Neoplasia periampular (mais comum: cabeça de pâncreas, 60–70%): TC de abdome com protocolo pancreático + CA 19-9/bilirrubinas. Ampola de Vater: melhor prognóstico (40–60% em 5 anos).","Caso15_ViasBiliares"],["B","[Vol3] Câncer de sigmoide, obesa, TVP prévia: tromboprofilaxia?","Risco muito alto (Caprini > 5): HBPM + profilaxia mecânica, com HBPM estendida por 28 dias após a alta (cirurgia oncológica abdominal/pélvica).","V3_Caso01_TEV"],["B","[Vol3] DOAC (rivaroxabana) antes de cirurgia de baixo risco hemorrágico e CrCl 55: conduta?","Suspender 24 h antes (≈ 2 meias-vidas), sem ponte com heparina. Alto risco hemorrágico: suspender 48 h. CrCl menor: intervalos maiores (dabigatrana). Retomar 24 h (baixo risco) a 48–72 h (alto risco) após.","V3_Caso01_Anticoagulacao"],["B","[Vol3] Alvo glicêmico perioperatório?","140–180 mg/dL (NICE-SUGAR: controle intensivo 80–110 ↑ mortalidade por hipoglicemia). A hiperglicemia aumenta ISC (OMS).","V3_Caso01_Glicemia"],["B","[Vol3] Consequências da hipotermia perioperatória (< 36 °C)?","↑ ISC (vasoconstrição, ↓ neutrófilos), coagulopatia e sangramento, eventos cardíacos adversos, tremores. Manter normotermia.","V3_Caso01_Hipotermia"],["B","[Vol3] Corticoide crônico (prednisona 20 mg/dia por > 3 semanas) antes de colectomia: conduta?","Manter dose habitual + hidrocortisona 100 mg na indução e 50 mg/dia por 48–72 h com desmame (clássico). Risco de crise addisoniana por supressão do eixo HHA. Atualização (Woodcock 2020): em grande porte, 100 mg na indução + 200 mg/24 h em infusão até retomar a via oral, desmame em ~48 h (evidência fraca).","V3_Caso01_Corticoide ATUALIZADO"],["B","[Vol3] Espirometria pré-operatória de rotina reduz complicações pulmonares?","Não. Indicações: ressecção pulmonar, dispneia inexplicada, DPOC/asma não otimizados. Fatores de risco: idade > 60, DPOC, ASA ≥ III, ICC, dependência funcional.","V3_Caso01_RiscoPulmonar"],["B","[Vol3] Delirium pós-operatório no idoso: conduta inicial?","Medidas não farmacológicas e correção de precipitantes (dor, retenção urinária, constipação, fármacos, hipóxia, privação de sono), reorientação. Evitar benzodiazepínicos; antipsicótico só se agitação perigosa.","V3_Caso01_Delirium"],["B","[Vol3] Preparo intestinal em cirurgia colorretal eletiva?","Preparo mecânico + antibiótico oral não absorvível (neomicina + metronidazol) + profilaxia EV reduz ISC e infecção de órgão/espaço (OMS, ASCRS, ERAS). Preparo mecânico isolado não tem benefício.","V3_Caso01_PreparoColon"],["B","[Vol3] AAS em prevenção secundária antes de cirurgia abdominal: manter?","Sim, manter (rebote pró-trombótico supera o risco hemorrágico modesto). Suspender só em cirurgias com risco hemorrágico crítico (neurocirurgia, câmara posterior do olho). Clopidogrel: suspender 5–7 dias, se o risco do stent permitir.","V3_Caso01_Antiagregante"],["B","[Vol3] Os 6 preditores do índice de risco cardíaco revisado (Lee/IRCR)?","Cirurgia de alto risco (torácica, abdominal ou vascular suprainguinal), doença coronariana, ICC, doença cerebrovascular, DM em insulina, creatinina > 2 mg/dL.","V3_Caso01_RiscoCardiaco"],["B","[Vol3] IL-6 e proteínas de fase aguda?","IL-6 (induzida por IL-1 e TNF-α) é o principal indutor hepático das positivas (PCR, fibrinogênio, haptoglobina, ferritina, ceruloplasmina, α1-antitripsina) e reduz as negativas (albumina, pré-albumina, transferrina). Com PCR alta, não interprete albumina como nutrição.","V3_Caso02_REMIT"],["B","[Vol3] UTI com T3 baixo, T4 baixo, T3 reverso alto, TSH normal: diagnóstico e conduta?","Síndrome do eutireóideo doente (↓ desiodase 1, ↑ desiodase 3): adaptativa; conduta expectante, sem reposição.","V3_Caso02_REMIT"],["B","[Vol3] SIRS × CARS?","SIRS: resposta pró-inflamatória inicial (IL-1, TNF-α, IL-6). CARS: compensatória (IL-10, IL-4, TGF-β, ↓ HLA-DR em monócitos) → imunoparalisia e susceptibilidade a infecções tardias.","V3_Caso02_REMIT"],["B","[Vol3] Qual agressão causa maior hipermetabolismo?","Grande queimado (gasto energético ↑ 80–100% ou mais; hipercatabolismo por meses). Gradiente: cirurgia eletiva 10–20% < fratura 15–30% < sepse/peritonite < politrauma/TCE < grande queimado.","V3_Caso02_REMIT"],["B","[Vol3] Via colinérgica anti-inflamatória?","Aferência vagal detecta inflamação; eferência libera acetilcolina que age em receptores nicotínicos α7 de macrófagos esplênicos → inibe NF-κB e reduz TNF-α.","V3_Caso02_REMIT"],["B","[Vol3] Por que o idoso tolera pior a REMIT?","Sarcopenia e menor reserva cardiopulmonar/renal: a mesma proteólise causa perda funcional, mais infecção, ventilação prolongada e recuperação lenta. Pré-habilitação e nutrição proteica ajudam.","V3_Caso02_REMIT"],["B","[Vol3] Oligúria no 1º PO com Na urinário 12 e densidade 1.028: interpretação?","Pré-renal fisiológica da REMIT (ADH + aldosterona). Otimizar volume sem excesso; não tratar o número isolado.","V3_Caso02_REMIT"],["B","[Vol3] Qual intervenção NÃO atenua a REMIT?","Fluidoterapia liberal intraoperatória (edema, íleo, deiscência). ERAS: restritiva e guiada por metas.","V3_Caso02_REMIT"],["B","[Vol3] Mecanismo da hiperglicemia de estresse?","↑ produção hepática de glicose (glucagon, cortisol, catecolaminas) + resistência insulínica periférica (TNF-α, IL-6, ↓ GLUT-4).","V3_Caso02_REMIT"],["B","[Vol3] Classificação das feridas operatórias?","Limpa; limpa-contaminada (abertura controlada de víscera oca sem extravasamento); contaminada (extravasamento significativo de bile/fezes/urina infectada ou quebra de assepsia); infectada (infecção presente).","V3_Caso03_Infeccao"],["B","[Vol3] Colectomia de 4 h com perda de 1800 mL e cefazolina na indução: conduta?","Redose de cefazolina (cirurgia > 2 meias-vidas, ~4 h; ou perda > 1500 mL).","V3_Caso03_Profilaxia"],["B","[Vol3] Febre no 2º dia de pós-op sem foco?","Resposta inflamatória (IL-1/IL-6) + atelectasia: autolimitada; fisioterapia respiratória e analgesia. Cronologia clássica: precoce (inflamação/atelectasia, também reação transfusional), 3º–5º dia (ISC, pneumonia, ITU), 5º–7º dia (deiscência, abscesso, TVP/TEP).","V3_Caso03_Infeccao"],["B","[Vol3] Diarreia, febre e leucocitose 22.000 após ceftriaxona por 7 dias: conduta?","Colite por C. difficile: suspender o antibiótico, vancomicina oral ou fidaxomicina (IDSA/SHEA 2021: fidaxomicina preferida) e pesquisar toxina/PCR. Grave/fulminante: vancomicina alta dose + metronidazol EV, considerar colectomia.","V3_Caso03_Infeccao ATUALIZADO"],["B","[Vol3] Abscesso pélvico único de 6 cm no 7º PO de apendicite perfurada: conduta?","Drenagem percutânea guiada por imagem (transglútea ou transretal) + antibiótico (resolve 70–90%). Coleções > 3–5 cm, únicas e bem delimitadas; reoperar se falha, peritonite difusa ou instabilidade.","V3_Caso03_Infeccao"],["B","[Vol3] Pacote da 1ª hora da sepse abdominal (Surviving Sepsis)?","Lactato, hemoculturas antes do antibiótico, antimicrobiano de amplo espectro na 1ª hora, cristaloide 30 mL/kg se hipotensão ou lactato ≥ 4, vasopressor se PAM < 65 persistente e controle precoce do foco.","V3_Caso03_Infeccao"],["B","[Vol3] Classificação CDC da ISC?","Superficial (pele/subcutâneo, 30 dias), profunda (fáscia e músculo; 30 dias, ou 90 dias com implante), órgão/espaço. Superficial: abrir e curativo; profunda: drenar/desbridar ± antibiótico.","V3_Caso03_Infeccao"],["B","[Vol3] \"Alergia à penicilina\" e profilaxia com cefazolina?","> 90% não têm alergia IgE; reatividade cruzada com cefazolina < 1% (cadeia lateral distinta). Alergia grave documentada: clindamicina + aminoglicosídeo, ou vancomicina.","V3_Caso03_Profilaxia"],["B","[Vol3] Drenos abdominais previnem deiscência?","Não previnem nem diagnosticam confiavelmente a deiscência; se prolongados ↑ infecção e retardam a recuperação. ERAS: evitar ou retirar precocemente.","V3_Caso03_Infeccao"],["B","[Vol3] Peritonite primária, secundária e terciária?","Primária: sem foco visceral (PBE). Secundária: perfuração/lesão visceral. Terciária: persiste ou recorre > 48 h após tratamento adequado, flora alterada (Enterococcus, S. coagulase-negativo, Pseudomonas, Candida), alta mortalidade.","V3_Caso03_Infeccao"],["B","[Vol3] Etilista desnutrido, NE plena e no 3º dia fósforo 1,1, K 2,8 e confusão: diagnóstico e prevenção?","Síndrome de realimentação. Tiamina antes das calorias, início baixo (10–20 kcal/kg/dia ou 25% da meta) com progressão gradual, monitorar P, K, Mg diariamente.","V3_Caso04_Nutricao ATUALIZADO"],["B","[Vol3] Via de acesso enteral por tempo previsto?","< 4–6 semanas: sonda nasoentérica. > 4–6 semanas: ostomia (gastrostomia se esvaziamento gástrico normal; jejunostomia se refluxo/gastroparesia ou estômago a usar como conduto).","V3_Caso04_Nutricao"],["B","[Vol3] Fístula enterocutânea de alto débito (900 mL/dia): estratégia?","SNAP: Sepsis control, Nutrition, Anatomy (definir trajeto), Plan de cirurgia (6–12 meses depois). Corrigir hidroeletrólitos, proteger a pele, reduzir débito (IBP, somatostatina/octreotide, antimotilidade), suporte nutricional parenteral ou enteral distal.","V3_Caso04_Nutricao"],["B","[Vol3] Metas para o paciente cirúrgico crítico?","25–30 kcal/kg/dia e 1,5–2,0 g/kg/dia de proteína; evitar hiperalimentação (hiperglicemia, esteatose, ↑ CO₂).","V3_Caso04_Nutricao"],["B","[Vol3] Disfunção hepática associada à NPT: mecanismo e conduta?","Esteatose (excesso de glicose/calorias) e colestase por ausência de estímulo enteral (2–4 semanas). Reduzir calorias, ciclar a NPT, iniciar nutrição enteral trófica e usar emulsão lipídica com óleo de peixe.","V3_Caso04_Nutricao ATUALIZADO"],["B","[Vol3] Nutrição do grande queimado?","Enteral precoce (24 h), proteína 2,0–2,5 g/kg/dia, hipermetabolismo por meses, perdas cutâneas maciças.","V3_Caso04_Nutricao"],["B","[Vol3] Critérios GLIM para desnutrição?","Triagem positiva (NRS-2002, MUST, MNA) + ≥ 1 critério fenotípico (perda de peso não intencional, IMC baixo, massa muscular reduzida) + ≥ 1 etiológico (↓ ingesta/absorção, inflamação/doença).","V3_Caso04_Nutricao"],["B","[Vol3] Cirrótico Child B com ascite: suporte nutricional?","Proteína 1,2–1,5 g/kg/dia (NÃO restringir), 30–35 kcal/kg/dia, 4–6 refeições e ceia noturna rica em carboidrato.","V3_Caso04_Nutricao"],["B","[Vol3] Diarreia em paciente com NE: conduta?","Investigar medicamentos (sorbitol, antibióticos, procinéticos, Mg), C. difficile e fórmula (osmolaridade, velocidade) antes de suspender a dieta.","V3_Caso04_Nutricao"],["B","[Vol3] Câncer em risco nutricional grave: terapia pré-op?","7–14 dias (ESPEN), mesmo adiando a cirurgia 1–2 semanas; reduz infecção, deiscência e internação.","V3_Caso04_Nutricao"],["B","[Vol3] Choque hemorrágico ATLS: classes?","I: < 15% (FC normal). II: 15–30% (FC 100–120, PA normal, ansioso). III: 31–40% (FC > 120, PAS cai, FR 30–40, DU 5–15 mL/h, confuso). IV: > 40% (letárgico, hipotenso).","V3_Caso05_ATLS"],["B","[Vol3] Ressuscitação hemostática no sangramento maciço?","Transfusão balanceada 1:1:1 (hemácias:plasma:plaquetas), mínimo de cristaloide, hipotensão permissiva (sem TCE), ácido tranexâmico em até 3 h, cálcio e controle precoce do foco. Atualização: sangue total (LTOWB) tem uso crescente.","V3_Caso05_ATLS ATUALIZADO"],["B","[Vol3] Ferimento precordial com hipotensão, jugular túrgida e bulhas abafadas?","Tamponamento cardíaco (tríade de Beck): descompressão imediata (toracotomia/janela pericárdica; pericardiocentese como ponte) + ressuscitação. FAST pericárdico positivo confirma.","V3_Caso05_ATLS"],["B","[Vol3] Tórax instável: qual o principal determinante da insuficiência respiratória?","Contusão pulmonar subjacente (não o movimento paradoxal). Tratar com analgesia (bloqueios/peridural), ventilação conforme necessidade e fixação de costelas em casos selecionados.","V3_Caso05_ATLS"],["B","[Vol3] Desaceleração, mediastino alargado, apagamento do botão aórtico: conduta?","Suspeita de lesão traumática de aorta (istmo): angiotomografia de tórax; controle de PA e FC (alvo PAS < 100–120 e FC < 80, β-bloqueador) e reparo endovascular (TEVAR).","V3_Caso05_ATLS"],["B","[Vol3] Ferimento toracoabdominal esquerdo (7º EIC LAA) estável: preocupação?","Lesão diafragmática oculta: videotoracoscopia ou videolaparoscopia diagnóstica. Zona toracoabdominal: entre linha intermamilar (4º EIC ant., 6º post.) e rebordo costal.","V3_Caso05_ATLS"],["B","[Vol3] Hemotórax retido após 5 dias: conduta?","VATS precoce (3º–7º dia) para evitar empiema (até 30%) e encarceramento pulmonar.","V3_Caso05_ATLS"],["B","[Vol3] Toracotomia de reanimação: quando funciona?","Melhor em trauma penetrante torácico com sinais de vida ou parada presenciada (sobrevida 20–35% em precordial por arma branca); resultados muito ruins no contuso.","V3_Caso05_ATLS"],["B","[Vol3] Triagem em desastre com recursos insuficientes?","Maior bem para o maior número: priorizar quem tem maior chance de sobrevida com menor consumo de tempo, pessoal e material (diferente de incidente com recursos suficientes, em que se prioriza o mais grave).","V3_Caso05_ATLS"],["B","[Vol3] Cricotireoidostomia: indicação e restrição?","\"Não intubo, não ventilo\". Em crianças pequenas (< 12 anos) evitar a cirúrgica (estenose subglótica) e fazer punção com agulha.","V3_Caso05_ATLS"],["B","[Vol3] Laceração esplênica com blush de contraste em paciente estável: conduta?","Tratamento não operatório + angioembolização (blush = sangramento arterial/pseudoaneurisma, principal preditor de falha do TNO isolado). Instável: laparotomia.","V3_Caso06_TraumaAbdome"],["B","[Vol3] Abdome tenso, PIC elevada, oligúria e pressão intravesical 26 mmHg no pós-op de trauma?","Síndrome compartimental abdominal (PIA > 20 mmHg + disfunção orgânica nova): laparotomia descompressiva e abdome aberto (peritoneostomia). HIA: PIA ≥ 12 mmHg.","V3_Caso06_TraumaAbdome"],["B","[Vol3] Trauma de guidão com dor epigástrica e TC inicial discreta: risco?","Lesão de duodeno/pâncreas (retroperitoneais, diagnóstico tardio): alta suspeição, observação, reavaliação seriada e nova imagem em 6–12 h (CPRM/CPRE se dúvida ductal).","V3_Caso06_TraumaAbdome"],["B","[Vol3] Choque neurogênico: diagnóstico e conduta?","Lesão medular acima de T6: hipotensão + bradicardia + extremidades quentes. Reposição criteriosa + vasopressor após excluir hemorragia (PAM alvo ≥ 85 mmHg por 5–7 dias).","V3_Caso06_TRM ATUALIZADO"],["B","[Vol3] Perda motora e da dor/temperatura com preservação de propriocepção e vibração?","Síndrome da artéria espinhal anterior (2/3 anteriores da medula; poupa colunas posteriores). Brown-Séquard: motor/propriocepção ipsilaterais e dor/temperatura contralaterais. Medular central: déficit maior em MMSS.","V3_Caso06_TRM"],["B","[Vol3] PIC 25 e PAM 75: PPC e implicação?","PPC = 75 − 25 = 50 mmHg, abaixo do alvo (60–70): reduzir PIC (cabeceira 30°, sedação, osmoterapia, drenagem de líquor) e/ou elevar PAM.","V3_Caso06_TCE"],["B","[Vol3] Idoso anticoagulado com cefaleia e coleção em crescente cruzando suturas: diagnóstico e tratamento?","Hematoma subdural crônico (veias-ponte). Tratamento: trepanação com drenagem; reverter anticoagulação. Atualização: embolização da artéria meníngea média (EMBOLISE, 2024) reduz recidiva como adjuvante.","V3_Caso06_TCE ATUALIZADO"],["B","[Vol3] Fratura pélvica instável com hemorragia: o que prioriza?","Faixa pélvica ao nível dos trocanteres + ressuscitação hemostática; hemorragia 80–90% venosa/óssea. Conforme FAST: angioembolização, packing pré-peritoneal ou laparotomia; REBOA zona III em centros selecionados.","V3_Caso06_TraumaAbdome"],["B","[Vol3] Arma de fogo no abdome com acidose (pH 7,12), hipotermia (33,5 °C) e sangramento em lençol: conduta?","Damage control: controlar hemorragia/contaminação, grampear sem anastomose, abdome temporariamente aberto, reaquecer e corrigir coagulopatia na UTI.","V3_Caso06_TraumaAbdome"],["B","[Vol3] Corticoide (metilprednisolona) no trauma raquimedular agudo?","Não recomendado de rotina (NASCIS: benefício marginal e inconsistente com ↑ infecção e complicações).","V3_Caso06_TRM"],["B","[Vol3] Hérnia obturadora e sinal de Howship-Romberg?","Mulher idosa, magra, multípara com obstrução intestinal; dor medial da coxa até o joelho (compressão do nervo obturador) agravada por extensão e rotação interna.","V3_Caso07_Hernias"],["B","[Vol3] Hérnia de Richter: o que é e o perigo?","Aprisionamento só da borda antimesentérica; pode estrangular/necrosar SEM obstrução (diagnóstico tardio). Típica da femoral.","V3_Caso07_Hernias"],["B","[Vol3] Dor inguinal crônica pós-herniorrafia: conduta?","Inguinodinia neuropática (10–12%): analgesia multimodal, neuromoduladores (gabapentinoides), bloqueio nervoso; se refratária, neurectomia tripla. Prevenção: identificar e preservar nervos (ilioinguinal, ílio-hipogástrico, ramo genital).","V3_Caso07_Hernias"],["B","[Vol3] Classificação EHS das hérnias inguinais?","L (lateral/indireta), M (medial/direta), F (femoral), com tamanho 1 (≤ 1,5 cm, 1 polpa digital), 2 (1,5–3 cm), 3 (> 3 cm); X = não avaliado; P = primária, R = recidivada.","V3_Caso07_Hernias"],["B","[Vol3] Hérnia umbilical em cirrótico com ascite e pele fina?","Controlar a ascite (diuréticos, paracenteses, avaliar TIPS) e reparar eletivamente; ruptura espontânea (síndrome de Flood) tem mortalidade 30–60%.","V3_Caso07_Hernias"],["B","[Vol3] Tela em campo contaminado?","Evitar sintética permanente microporosa; alternativas: tecido próprio, tela biológica ou sintética absorvível/macroporosa leve. Atualização: dados recentes sustentam sintéticas macroporosas leves em contaminação selecionada.","V3_Caso07_Hernias ATUALIZADO"],["B","[Vol3] Hérnia incisional com defeito de 12 cm: técnica?","Separação de componentes (anterior de Ramirez ou liberação do transverso, TAR/Novitsky) + tela retromuscular para fechamento da linha alba sem tensão.","V3_Caso07_Incisional"],["B","[Vol3] Hérnia inguinal redutível e oligossintomática na gestante?","Conduta expectante; reparo eletivo após o parto, salvo complicação.","V3_Caso07_Hernias"],["B","[Vol3] Hérnia de Spiegel?","Linha semilunar, abaixo da arqueada (sem folheto posterior da bainha do reto), intraparietal e muitas vezes não palpável (USG/TC), com alto risco de encarceramento: reparo eletivo.","V3_Caso07_Hernias"],["B","[Vol3] TAPP × TEP?","TAPP: entra na cavidade peritoneal, tela pré-peritoneal e fecha o peritônio; permite inspecionar o lado contralateral e manejar encarceradas. TEP: totalmente extraperitoneal, evita a cavidade, mais difícil tecnicamente.","V3_Caso07_Tecnicas"],["B","[Vol3] Síndrome de Mirizzi?","Compressão extrínseca do hepático comum por cálculo impactado no infundíbulo/cístico (± fístula colecistobiliar): icterícia com dilatação só acima do cístico. Classificação de Csendes I–V. Cirurgia com cuidado (subtotal; derivação biliar se fístula grande).","V3_Caso08_Litiase"],["B","[Vol3] Colecistite alitiásica: contexto e conduta?","Paciente crítico (trauma, queimadura, jejum, NPT, VM): estase e isquemia. Se risco cirúrgico alto: colecistostomia percutânea; colecistectomia se recuperação.","V3_Caso08_Colecistite"],["B","[Vol3] Íleo biliar: tríade de Rigler e conduta?","Obstrução intestinal + pneumobilia + cálculo ectópico (fístula colecistoentérica; íleo terminal). Enterolitotomia; fístula em segundo tempo ou não abordada se frágil.","V3_Caso08_Litiase"],["B","[Vol3] Fibrose intensa sem Visão Crítica de Segurança na colecistectomia: conduta?","Estratégia de bailout: colecistectomia subtotal (fenestrada ou reconstituinte), conversão e/ou colangiografia; nunca clipar sem identificar. Fundamental para evitar lesão de via biliar.","V3_Caso08_LesaoViaBiliar"],["B","[Vol3] Pancreatite biliar leve resolvida: quando operar?","Mesma internação (PONCHO: postergar → ~17% de eventos biliares em semanas).","V3_Caso08_Litiase"],["B","[Vol3] Pólipo vesicular assintomático de 12 mm: conduta?","Colecistectomia (≥ 10 mm, séssil, crescimento, idade > 60, colangite esclerosante). Pólipos 6–9 mm com fatores de risco: considerar; < 6 mm: vigilância.","V3_Caso08_Litiase ATUALIZADO"],["B","[Vol3] Colecistite recorrente na gestante: quando operar?","Colecistectomia laparoscópica no 2º trimestre (menor risco materno-fetal).","V3_Caso08_Litiase"],["B","[Vol3] Ductos de Luschka e variações biliares?","Variações em 20–40%; ductos subvesiculares de Luschka e ducto hepático direito aberrante são causa de fístula biliar e lesão. Conhecer a anatomia e usar colangiografia se dúvida.","V3_Caso08_LesaoViaBiliar"],["B","[Vol3] Colecistite grau III com ASA IV: conduta?","Suporte intensivo + antibiótico + colecistostomia percutânea; colecistectomia diferida se recuperação (TG18).","V3_Caso08_Colecistite"],["B","[Vol3] Fístula biliar de baixo débito pós-colecistectomia (Strasberg A)?","Drenagem da coleção + CPRE com papilotomia ± prótese para reduzir a pressão biliar; tratamento minimamente invasivo.","V3_Caso08_LesaoViaBiliar"],["B","[Vol3] Pancreatite hipertrigliceridêmica: conduta específica?","TG > 1000 mg/dL (3ª causa). Suporte + jejum inicial, insulina em infusão contínua (com glicose se necessário), fibrato depois; plasmaférese em casos refratários/graves (evidência limitada). Meta TG < 500 mg/dL.","V3_Caso09_PancreatiteAguda"],["B","[Vol3] BISAP?","BUN > 25 mg/dL, Impaired mental status, SIRS, Age > 60, Pleural effusion (1 ponto cada; ≥ 3 = alto risco de mortalidade e falência orgânica). Calculável nas primeiras 24 h à beira do leito.","V3_Caso09_PancreatiteAguda"],["B","[Vol3] Pancreatite grave com PIV 24, oligúria e ↑ pressão de pico: diagnóstico e conduta?","Síndrome compartimental abdominal: medidas escalonadas (SNG/descompressão retal, sedação/bloqueio neuromuscular, drenagem de ascite, restrição hídrica/diurese) e, se refratária, laparotomia descompressiva.","V3_Caso09_PancreatiteAguda"],["B","[Vol3] Hematêmese por varizes gástricas isoladas na pancreatite crônica?","Hipertensão portal segmentar (sinistra) por trombose da veia esplênica; tratamento definitivo: esplenectomia (e embolização/terapia endoscópica como ponte).","V3_Caso09_PancreatiteCronica"],["B","[Vol3] Pseudoaneurisma de artéria esplênica por pseudocisto: tratamento?","Angiografia com embolização (primeira linha); cirurgia se falha. Mais comum: esplênica, depois gastroduodenal.","V3_Caso09_PancreatiteCronica"],["B","[Vol3] Insuficiência exócrina na pancreatite crônica: conduta?","Enzimas pancreáticas (lipase 40–50 mil UI por refeição principal, metade nos lanches) com as refeições + IBP se resposta insuficiente; repor vitaminas lipossolúveis. Surge com > 90% de perda acinar.","V3_Caso09_PancreatiteCronica"],["B","[Vol3] Pancreatite autoimune tipo 1: achados e tratamento?","Doença relacionada a IgG4: pâncreas em \"salsicha\" com halo, IgG4 elevada, icterícia (excluir câncer), outros órgãos. Tratamento: corticoide (prednisona 0,6–1 mg/kg) após confirmar o diagnóstico (critérios ICDC).","V3_Caso09_PancreatiteCronica"],["B","[Vol3] Prevenção da pancreatite pós-CPRE?","AINE retal (indometacina ou diclofenaco 100 mg) + hidratação com Ringer lactato; prótese pancreática profilática em alto risco. Incidência 3–5% (até 15% em alto risco).","V3_Caso09_PancreatiteAguda ATUALIZADO"],["B","[Vol3] Diabetes pancreatogênico (tipo 3c)?","Perda de células beta E alfa (insulina + glucagon): instável, com hipoglicemias; usar insulina (metformina possível); associar reposição enzimática.","V3_Caso09_PancreatiteCronica"],["B","[Vol3] Nutrição na pancreatite aguda grave?","Enteral precoce (24–72 h) é preferível à parenteral (↓ infecção, falência, mortalidade); via oral se tolerada; \"repouso pancreático\" abandonado.","V3_Caso09_PancreatiteAguda"],["B","[Vol3] Volvo de sigmoide (\"grão de café\") sem sofrimento: conduta?","Descompressão endoscópica (retossigmoidoscopia + sonda retal) e sigmoidectomia eletiva na mesma internação (recorrência 60–90%). Sofrimento (peritonite, acidose, sangue): laparotomia/Hartmann.","V3_Caso10_AbdomeAgudo"],["B","[Vol3] Obstrução colônica por neoplasia de sigmoide com metástases irressecáveis?","Prótese metálica autoexpansível (paliativa), permitindo iniciar quimioterapia precocemente. Em obstrução curável, stent como ponte é opção individualizada (ESGE).","V3_Caso10_AbdomeAgudo"],["B","[Vol3] Distensão do ceco (11 cm) em paciente internado com opioide, sem obstrução mecânica?","Síndrome de Ogilvie: corrigir eletrólitos, suspender opioides/anticolinérgicos, neostigmina EV (monitorizada) se ceco > 12 cm ou sem melhora em 24–48 h; descompressão colonoscópica; cirurgia se isquemia/perfuração.","V3_Caso10_AbdomeAgudo"],["B","[Vol3] Suspeita de apendicite na gestante com USG inconclusiva?","Ressonância magnética sem gadolínio; confirmada, apendicectomia (preferencialmente laparoscópica). Apendicite é a causa não obstétrica mais comum de cirurgia na gestação.","V3_Caso10_Apendicite"],["B","[Vol3] Trombose venosa mesentérica: tratamento?","Anticoagulação plena imediata (heparina), suporte e vigilância; cirurgia só se necrose/peritonite. Instalação subaguda; trombofilia/hipertensão portal.","V3_Caso10_AbdomeAgudo"],["B","[Vol3] Colite isquêmica: quadro e topografia?","Dor em cólica + diarreia sanguinolenta em < 24 h, idoso com DAC; áreas de \"watershed\" (ângulo esplênico, retossigmoide); a maioria resolve com suporte; cirurgia se gangrena/perfuração.","V3_Caso10_AbdomeAgudo"],["B","[Vol3] Hematoquezia volumosa instável com EDA negativa?","Ressuscitar → angiotomografia (detecta ≥ 0,3 mL/min) ou arteriografia com embolização; colonoscopia após preparo se estabilizar.","V3_Caso10_AbdomeAgudo"],["B","[Vol3] Plastrão apendicular com abscesso de 4,5 cm, estável?","Antibiótico + drenagem percutânea (coleção > 3–4 cm); apendicectomia de intervalo individualizada; colonoscopia em > 40 anos para excluir neoplasia.","V3_Caso10_Apendicite"],["B","[Vol3] Mulher com dor em FID, atraso menstrual, sangramento e instabilidade?","Gravidez ectópica rota até prova em contrário: β-hCG, USG transvaginal, ressuscitação e avaliação ginecológica urgente.","V3_Caso10_AbdomeAgudo"],["B","[Vol3] Diverticulite não complicada (Hinchey Ia) em imunocompetente?","Tratamento ambulatorial; antibiótico pode ser omitido em selecionados (AVOD, DIABOLO); colonoscopia 6–8 semanas após se não feita recentemente.","V3_Caso10_Diverticulite"],["B","[Vol3] Barrett sem displasia: conduta?","IBP + vigilância endoscópica com biópsias de 4 quadrantes a cada 2 cm (Seattle): ≥ 3 cm a cada 3 anos; < 3 cm a cada 5 anos (ACG 2022). Risco de adenocarcinoma 0,1–0,5% ao ano.","V3_Caso11_Esofago ATUALIZADO"],["B","[Vol3] Boerhaave: tríade de Mackler e conduta?","Vômitos + dor torácica + enfisema subcutâneo (ruptura do esôfago distal à esquerda, cricofaríngeo fechado). Ressuscitação, antibiótico amplo, drenagem pleural e reparo/ stent precoce; mortalidade ↑ com atraso > 24 h.","V3_Caso11_Esofago"],["B","[Vol3] Ingestão de soda cáustica: conduta inicial?","Estabilizar, jejum, avaliar via aérea e EDA em 12–24 h (Zargar); NÃO induzir vômito, NÃO neutralizar (reação exotérmica) e NÃO passar sonda às cegas.","V3_Caso11_Esofago"],["B","[Vol3] POEM na acalasia: vantagens e desvantagem?","Miotomia endoscópica por túnel submucoso, permite miotomia longa (ideal no tipo III, espástico); maior incidência de DRGE (IBP pós-POEM).","V3_Caso11_Acalasia"],["B","[Vol3] Fístula da anastomose cervical pós-esofagectomia?","Complicação frequente (10–25%) da trans-hiatal; boa evolução: abrir a incisão cervical, drenar, jejum e nutrição; menos grave que a fístula intratorácica.","V3_Caso11_Esofago"],["B","[Vol3] Paliação da disfagia no esôfago irressecável?","Prótese esofágica autoexpansível (alívio imediato) ± quimiorradioterapia paliativa; braquiterapia é alternativa em maior sobrevida.","V3_Caso11_Esofago"],["B","[Vol3] Estenose péptica do esôfago?","Dilatação endoscópica (Savary ou balão) + IBP em dose plena; biópsia para excluir malignidade.","V3_Caso11_DRGE"],["B","[Vol3] Linfadenectomia em 3 campos?","Abdominal, torácica e cervical; mais usada em CEC de terço médio/superior (drenagem linfática longitudinal submucosa).","V3_Caso11_Esofago"],["B","[Vol3] Adenocarcinoma esofágico T1a bem diferenciado, 12 mm, sem invasão linfovascular?","Ressecção endoscópica (mucosectomia ou ESD) + ablação do Barrett remanescente (RFA). Risco de linfonodo < 2%.","V3_Caso11_Esofago"],["B","[Vol3] Fundoplicatura total × parcial?","Manometria define: motilidade normal → Nissen (360°); dismotilidade importante → parcial (Toupet 270°, Dor anterior). Acalasia pós-Heller: Dor.","V3_Caso11_DRGE"],["B","[Vol3] Câncer gástrico precoce, lesão de 18 mm, bem diferenciada, mucosa, sem ulceração?","Dissecção endoscópica da submucosa (ESD) com avaliação dos critérios de cura (JGCA, expandidos: diferenciado, T1a, sem úlcera; ≤ 3 cm se ulcerado; ≤ 2 cm indiferenciado). Fora dos critérios: gastrectomia + D2.","V3_Caso12_Estomago"],["B","[Vol3] Adenocarcinoma gástrico metastático HER2+ (3+): 1ª linha?","Platina + fluoropirimidina + trastuzumabe (ToGA). Atualização: pembrolizumabe adicional (KEYNOTE-811) em HER2+ PD-L1 CPS ≥ 1; HER2−: quimioterapia + nivolumabe (CPS ≥ 5) ou zolbetuximabe se CLDN18.2+.","V3_Caso12_Estomago ATUALIZADO"],["B","[Vol3] Câncer gástrico T3N1 com citologia peritoneal positiva (CY1) sem implantes?","CY1 = M1 (AJCC e JGCA): contraindica gastrectomia curativa imediata; tratar com quimioterapia sistêmica e reavaliar (cirurgia de conversão em selecionados).","V3_Caso12_Estomago"],["B","[Vol3] Linfoma gástrico MALT de baixo grau, H. pylori+, estádio IE?","Erradicação do H. pylori (tríplice) com reavaliação endoscópica seriada. t(11;18) prediz má resposta à erradicação → radioterapia/rituximabe.","V3_Caso12_Estomago"],["B","[Vol3] GIST gástrico de 8 cm com 8 mitoses/50 CGA?","Alto risco: imatinibe adjuvante por 3 anos (tamanho, mitoses, localização, ruptura). Ressecção em cunha sem linfadenectomia.","V3_Caso12_Estomago"],["B","[Vol3] Dumping precoce (15–30 min após a refeição)?","Chegada rápida de conteúdo hiperosmolar ao delgado: taquicardia, sudorese, cólica, diarreia. Dieta: fracionar, ↓ carboidratos simples, separar líquidos e sólidos; acarbose/octreotide se refratário; cirurgia raramente. Dumping tardio: hipoglicemia 1–3 h depois.","V3_Caso12_Estomago"],["B","[Vol3] Mutação germinativa de CDH1: conduta?","Câncer gástrico difuso hereditário: gastrectomia total profilática (discutir entre 20–30 anos), mesmo com endoscopia normal; vigilância de mama (carcinoma lobular).","V3_Caso12_Estomago"],["B","[Vol3] Margem proximal na gastrectomia por Lauren?","Intestinal: 3–5 cm. Difuso: 5–8 cm, com exame de congelação (ou gastrectomia total).","V3_Caso12_Estomago"],["B","[Vol3] Nódulo periumbilical no câncer gástrico?","Nódulo da irmã Maria José: carcinomatose peritoneal (M1). Outros sinais: Virchow (supraclavicular E), Blumer (fundo de saco, toque retal), Krukenberg (ovário).","V3_Caso12_Estomago"],["B","[Vol3] Esplenectomia/pancreatectomia distal na gastrectomia D2?","Não rotineiras (↑ morbimortalidade sem ganho de sobrevida: JCOG0110, estudos Dutch/MRC); só se invasão direta ou linfonodos do hilo esplênico em tumores proximais em selecionados.","V3_Caso12_Estomago"],["B","[Vol3] Fístula pancreática pós-Whipple: classificação ISGPS 2016?","Amilase do dreno > 3× o limite superior sérico: sem repercussão = fístula bioquímica (antigo grau A, sem mudança de conduta). Grau B: exige mudança de conduta (drenagem, antibiótico, dieta). Grau C: reoperação, falência orgânica ou morte.","V3_Caso13_Pancreas ATUALIZADO"],["B","[Vol3] Esvaziamento gástrico retardado no pós-Whipple?","Complicação mais frequente (20–40%), maior com preservação pilórica; diagnóstico de exclusão: sonda, procinéticos, nutrição pós-pilórica/parenteral; ISGPS graus A–C.","V3_Caso13_Pancreas"],["B","[Vol3] Insulinoma: confirmação bioquímica e conduta?","Tríade de Whipple + glicemia < 55 com insulina e peptídeo C elevados e pesquisa de sulfonilureia negativa; localizar (TC/RM, ecoendoscopia) e enuclear (pancreatectomia se perto do ducto).","V3_Caso13_Pancreas"],["B","[Vol3] NEM-1 (Wermer)?","Paratireoide + pâncreas (gastrinoma/insulinoma) + hipófise (os 3 P's); gene MEN1; TNEs multifocais: cirurgia individualizada (tratar hiperparatireoidismo primeiro). NEM-2: feocromocitoma, CMT, hiperparatireoidismo (RET).","V3_Caso13_Pancreas"],["B","[Vol3] IPMN de ramo secundário de 2,2 cm sem estigmas?","Vigilância (RM/colangioRM e ecoendoscopia; Fukuoka); risco de malignidade 5–15% vs 40–70% no ducto principal; cirurgia se estigmas ou características preocupantes.","V3_Caso13_PancreasCistico"],["B","[Vol3] Adenocarcinoma de pâncreas ressecado R0 com N+: adjuvância?","mFOLFIRINOX se ECOG 0–1 (PRODIGE 24); alternativa gencitabina + capecitabina.","V3_Caso13_Pancreas"],["B","[Vol3] Paliação da obstrução dupla (biliar + duodenal) no câncer de pâncreas?","Prótese biliar metálica + prótese duodenal por via endoscópica; derivação cirúrgica dupla (hepaticojejunostomia + gastrojejunostomia) se sobrevida > 6 meses.","V3_Caso13_Pancreas"],["B","[Vol3] Massa inflamatória de pancreatite crônica × adenocarcinoma?","Nenhum método isolado define: TC/RM, CA 19-9, IgG4, ecoendoscopia com biópsia (EUS-FNB); em dúvida, abordagem multidisciplinar. Parte dos Whipples por suspeita revela doença benigna.","V3_Caso13_Pancreas"],["B","[Vol3] TNE pancreático não funcionante?","Maioria hoje (incidental); conduta pelo tamanho: < 1–2 cm e baixo grau: vigilância; > 2 cm ou grau elevado: ressecção com linfadenectomia. Funcionantes tratados independentemente do tamanho.","V3_Caso13_Pancreas"],["B","[Vol3] O que se ressecta no Whipple?","Cabeça do pâncreas/uncinado, duodeno, primeiras alças jejunais, vesícula e via biliar distal (± antro). Reconstrução: pancreaticojejunostomia, hepaticojejunostomia e gastro/duodenojejunostomia.","V3_Caso13_Pancreas"],["B","[Vol3] Rastreamento do câncer colorretal de risco médio?","Início aos 45 anos: colonoscopia a cada 10 anos ou FIT anual/ teste de DNA fecal a cada 1–3 anos.","V3_Caso14_ColonReto"],["B","[Vol3] FAP com mutação em APC: cirurgia?","Proctocolectomia total com bolsa ileal e anastomose ileoanal, ou colectomia total com anastomose ileorretal (reto com poucos pólipos). Risco ~100% de câncer até os 40 anos. Vigiar duodeno.","V3_Caso14_ColonReto"],["B","[Vol3] CCR metastático MSI-H/dMMR?","Imunoterapia com inibidor de checkpoint (pembrolizumabe, KEYNOTE-177; nivolumabe ± ipilimumabe, CheckMate 8HW). Atualização: neoadjuvância com imunoterapia (NICHE-2) em dMMR localmente avançado.","V3_Caso14_ColonReto ATUALIZADO"],["B","[Vol3] Excisão total do mesorreto (Heald)?","Dissecção no plano avascular (\"holy plane\") entre a fáscia mesorretal e a fáscia pré-sacral, preservando nervos autonômicos; reduziu recidiva local de 30% para < 10%.","V3_Caso14_ColonReto"],["B","[Vol3] Resposta clínica completa após neoadjuvância no reto distal?","Watch & Wait (Habr-Gama): vigilância intensiva (toque, endoscopia, RM) com cirurgia de resgate se rebrota; preserva o órgão. Risco de recrescimento ~25–30%.","V3_Caso14_ColonReto"],["B","[Vol3] Carcinomatose peritoneal colorretal limitada, ECOG 0?","Citorredução completa + HIPEC em selecionados (PCI baixo). ⚠️ Atualização: PRODIGE 7 não mostrou benefício adicional do HIPEC com oxaliplatina; o benefício parece vir da citorredução.","V3_Caso14_ColonReto ATUALIZADO"],["B","[Vol3] Intervalo de colonoscopia após 3 adenomas tubulares < 10 mm com baixo grau?","3–5 anos (3–4 adenomas pequenos; 5–10 adenomas: 3 anos; adenoma ≥ 10 mm/viloso/displasia de alto grau: 3 anos; 1–2 adenomas < 10 mm: 7–10 anos) (USMSTF 2020).","V3_Caso14_ColonReto ATUALIZADO"],["B","[Vol3] CCR metastático RAS selvagem de cólon esquerdo: terapia-alvo?","Anti-EGFR (cetuximabe/panitumumabe) + quimioterapia; exige RAS selvagem e lado esquerdo. Cólon direito ou RAS mutado: bevacizumabe. BRAF V600E: encorafenibe + cetuximabe.","V3_Caso14_ColonReto ATUALIZADO"],["B","[Vol3] Fissura anal crônica: tratamento?","Clínico: fibras, banhos de assento, tópicos relaxantes (nifedipina/diltiazem ou nitroglicerina); toxina botulínica; esfincterotomia lateral interna se falha. Fissura na linha média posterior (hipertonia do esfíncter interno e isquemia).","V3_Caso14_ColonReto"],["B","[Vol3] Obstrução de cólon direito por neoplasia?","Colectomia direita com anastomose ileocólica primária (segura mesmo em urgência). Cólon esquerdo obstruído: stent, Hartmann ou anastomose com lavagem/colectomia subtotal.","V3_Caso14_ColonReto"],["B","[Vol3] Hepatectomia direita (Couinaud)?","Segmentos V, VI, VII e VIII (ao longo da veia hepática média). Esquerda: II, III, IV; direita ampliada: + IV; segmento I = caudado.","V3_Caso15_Figado"],["B","[Vol3] Insuficiência hepática pós-hepatectomia (critério 50-50)?","Bilirrubina > 2,9 mg/dL e INR > 1,7 no 5º dia (ISGLS: INR e BT acima do normal após o 5º dia). Principal causa de mortalidade; suporte e tratar sepse/sangramento; prevenção: volume remanescente suficiente.","V3_Caso15_Figado"],["B","[Vol3] Rastreamento do CHC?","USG a cada 6 meses (± AFP) em cirróticos de qualquer etiologia e portadores de hepatite B selecionados (homens asiáticos > 40, mulheres > 50, africanos > 20, história familiar).","V3_Caso15_Figado"],["B","[Vol3] CHC BCLC C com Child A: 1ª linha?","Atezolizumabe + bevacizumabe (IMbrave150) ou durvalumabe + tremelimumabe (HIMALAYA); alternativas lenvatinibe/sorafenibe. Excluir varizes não tratadas antes de bevacizumabe.","V3_Caso15_Figado ATUALIZADO"],["B","[Vol3] Cisto hidático hepático?","Echinococcus granulosus (cães pastores e ovinos), cisto com vesículas-filhas e calcificação parietal. Tratamento: albendazol + PAIR (punção-aspiração-injeção-reaspiração) ou cirurgia (cistectomia/pericistectomia) em complicados/grandes; cuidado com anafilaxia e disseminação.","V3_Caso15_Figado"],["B","[Vol3] CEP + piora da colestase e perda de peso?","Investigar colangiocarcinoma (0,5–1,5%/ano; risco cumulativo 10–15%): colangioRM, CA 19-9 e colangioscopia com escovado/biópsia. Transplante hepático em selecionados.","V3_Caso15_ViasBiliares"],["B","[Vol3] Cisto de colédoco tipo I (Todani)?","Dilatação fusiforme do colédoco extra-hepático (tríade dor + icterícia + massa em < 1/3). Tratamento: ressecção completa do cisto + colecistectomia + hepaticojejunostomia em Y de Roux (drenagem interna isolada é contraindicada: risco de câncer).","V3_Caso15_ViasBiliares"],["B","[Vol3] Colangiocarcinoma intra-hepático solitário ressecável?","Hepatectomia com linfadenectomia hilar + capecitabina adjuvante (BILCAP). Doença avançada: gencitabina + cisplatina + durvalumabe (TOPAZ-1).","V3_Caso15_ViasBiliares ATUALIZADO"],["B","[Vol3] CHC dentro de Milão em lista de transplante com espera de 8 meses?","Terapia-ponte (TACE ou ablação por radiofrequência) quando espera > 6 meses, para evitar progressão além de Milão e queda da lista.","V3_Caso15_Figado"],["B","[Vol3] Manobra de Pringle?","Clampeamento do pedículo hepático (artéria hepática + veia porta) no ligamento hepatoduodenal para reduzir sangramento na transecção; tolerância ~15–20 min contínuos (intermitente 15/5).","V3_Caso15_Figado"]]};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
let S={};try{S=JSON.parse(localStorage.getItem("qb1")||"{}")}catch(e){}
S.q=S.q||{};S.f=S.f||{};
const save=()=>{try{localStorage.setItem("qb1",JSON.stringify(S))}catch(e){}};
function tab(n){document.body.classList.toggle("qon",n=="q");$("pq").classList.toggle("hide",n!="q");$("pf").classList.toggle("hide",n!="f");$("tq").classList.toggle("on",n=="q");$("tf").classList.toggle("on",n=="f");if(n=="f")fRender();else qRender();try{location.hash=n=="f"?"flashcards":"questoes"}catch(e){}}
$("tq").onclick=()=>tab("q");$("tf").onclick=()=>tab("f");
/* QUESTÕES */
const qid=q=>q.v+"|"+q.c+"."+q.n;
let qlist=[],qi=0;
const vols=[...new Set(D.q.map(q=>q.v))];
$("qv").innerHTML='<option value="">Todos os volumes</option>'+vols.map(v=>`<option>${esc(v)}</option>`).join("");
function qCases(){const v=$("qv").value;const cs=[...new Set(D.q.filter(q=>!v||q.v==v).map(q=>q.c))].sort((a,b)=>a-b);
 $("qc").innerHTML='<option value="">Todos os casos</option>'+cs.map(c=>{const nm=D.cases[(v||D.q.find(q=>q.c==c).v)+"|"+c];return `<option value="${c}">Caso ${c}${nm?" – "+esc(nm):""}</option>`}).join("")}
function qFilter(){const v=$("qv").value,c=$("qc").value,s=$("qs").value,t=$("qt").value.toLowerCase();
 qlist=D.q.filter(q=>(!v||q.v==v)&&(!c||q.c==c)&&(s=="all"||(s=="new"&&!S.q[qid(q)])||(s=="wrong"&&S.q[qid(q)]&&S.q[qid(q)].r===0))&&(!t||(q.s.join(" ")+Object.values(q.a).join(" ")+q.ok).toLowerCase().includes(t)));qi=0}
function qRender(){
 qNav();const done=Object.values(S.q),hits=done.filter(x=>x.r===1).length;
 $("qstat").textContent=`Progresso geral: ${done.length}/${D.q.length} respondidas · ${done.length?Math.round(100*hits/done.length):0}% de acerto`;
 const b=$("qbox");if(!qlist.length){b.innerHTML='<div class="card">Nenhuma questão com esse filtro.</div>';return}
 const q=qlist[qi],st=S.q[qid(q)],ans=st&&st.a;
 let h=`<div class="card"><div class="meta">${esc(q.v)} · Caso ${q.c} · Questão ${q.c}.${q.n}</div><div class="stem">${q.s.map(p=>`<p>${esc(p)}</p>`).join("")}</div>`;
 for(const L of Object.keys(q.a)){let cl="";if(ans){if(L==q.g)cl=" ok";else if(L==ans)cl=" er"}
  h+=`<button class="alt${cl}" data-l="${L}"><b>${L}</b><span>${esc(q.a[L])}</span></button>`}
 if(ans){h+=`<div class="box ok"><h4>Gabarito ${q.g} — comentário</h4>${esc(q.ok)}</div>`;
  if(q.rv)h+=`<div class="box wa"><h4>Revisão (divergência/atualização)</h4>${esc(q.rv)}</div>`;
  const w=Object.keys(q.w);if(w.length)h+=`<div class="box"><h4>Por que as demais estão erradas</h4>${w.map(L=>`<p><b>${L})</b> ${esc(q.w[L])}</p>`).join("")}</div>`;
  if(q.p.length)h+=`<div class="box"><h4>Para gravar</h4>${q.p.map(p=>`<p>${esc(p)}</p>`).join("")}</div>`;
  if(q.f)h+=`<div class="meta">Fonte: ${esc(q.f)}</div>`}
 h+=`</div><div class="nav"><button id="qp">‹</button><div class="mid">${qi+1} / ${qlist.length}</div><button id="qn">›</button></div>`;
 b.innerHTML=h;
 b.querySelectorAll(".alt").forEach(x=>x.onclick=()=>{if(S.q[qid(q)])return;S.q[qid(q)]={a:x.dataset.l,r:x.dataset.l==q.g?1:0};save();qRender()});
 $("qp").onclick=()=>{qi=(qi-1+qlist.length)%qlist.length;qRender();scrollTo(0,0)};$("qn").onclick=()=>{qi=(qi+1)%qlist.length;qRender();scrollTo(0,0)}}
$("qv").onchange=()=>{qCases();qFilter();qRender()};$("qc").onchange=$("qs").onchange=$("qt").oninput=()=>{qFilter();qRender()};
const openNav=()=>{$("nav").classList.add("open");$("qbd").classList.add("open")},closeNav=()=>{$("nav").classList.remove("open");$("qbd").classList.remove("open")};
$("qm").onclick=openNav;$("qbd").onclick=closeNav;
function qNav(){const n=$("nav"),top=n.scrollTop;
 let h='<div class="nh"><b>Questões</b><button class="btn" id="nx">✕</button></div><div class="lg"><i class="s ok"></i>Acertei <i class="s er"></i>Errei <i class="s"></i>Não respondi</div>',last="";
 qlist.forEach((q,i)=>{const k=q.v+"|"+q.c;if(k!=last){last=k;const nm=D.cases[k];h+=`<div class="ng">${esc(q.v)} · Caso ${q.c}${nm?" – "+esc(nm):""}</div>`}
  const st=S.q[qid(q)];h+=`<button class="nb${st?(st.r?" ok":" er"):""}${i==qi?" cur":""}" data-i="${i}">${q.c}.${q.n}</button>`});
 n.innerHTML=h;n.scrollTop=top;
 const c=n.querySelector(".cur");if(c&&(c.offsetTop<top||c.offsetTop>top+n.clientHeight-60))n.scrollTop=Math.max(0,c.offsetTop-90);
 n.querySelectorAll(".nb").forEach(b=>b.onclick=()=>{qi=+b.dataset.i;closeNav();qRender();scrollTo(0,0)});
 $("nx").onclick=closeNav}
/* FLASHCARDS */
const fcs=D.f.map((c,i)=>({i,t:c[0],a:c[1],b:c[2],tg:c[3].split(" ")}));
const deckOf=c=>{const m=c.tg[0].match(/^(V3_)?Caso(\d+)/);return m?(m[1]?"Vol. III":(+m[2]<=8?"Vol. I":"Vol. II"))+" · Caso "+m[2]:"Outros"};
const decks=[...new Set(fcs.map(deckOf))];
$("fv").innerHTML='<option value="">Todos os baralhos</option>'+decks.map(d=>`<option>${esc(d)}</option>`).join("");
let fq=[],shown=false;
const DAY=864e5,IV=[0,1,3,7,16,35];
function fBuild(){const v=$("fv").value,m=$("fm").value,now=Date.now();
 fq=fcs.filter(c=>(!v||deckOf(c)==v)&&(m!="upd"||c.tg.includes("ATUALIZADO"))&&(m!="due"||!S.f[c.i]||S.f[c.i].d<=now));
 for(let i=fq.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[fq[i],fq[j]]=[fq[j],fq[i]]}shown=false}
const cloze=(s,front)=>esc(s).replace(/\{\{c\d+::(.*?)(::.*?)?\}\}/g,(_,x)=>front?'<b style="color:var(--ac)">[…]</b>':`<b style="color:var(--ac)">${x}</b>`);
function fRender(){
 if(!fq.length&&!$("fbox").dataset.init){fBuild();$("fbox").dataset.init=1}
 const seen=Object.keys(S.f).length;$("fstat").textContent=`${fq.length} na fila · ${seen}/${fcs.length} já estudados`;
 const b=$("fbox");if(!fq.length){b.innerHTML='<div class="card">Fila vazia. Troque o filtro para “Todos” para revisar mais cards.</div>';return}
 const c=fq[0],tag=c.tg.includes("ATUALIZADO")?'<span class="tag">atualizado</span>':"";
 const front=c.t=="C"?cloze(c.a,true):esc(c.a),back=c.t=="C"?cloze(c.a,false)+(c.b?"<br>"+esc(c.b):""):esc(c.b);
 b.innerHTML=`<div class="card fc" id="fc"><div class="meta">${esc(deckOf(c))}${tag}</div><div>${front}</div>${shown?`<div class="back">${back}</div>`:'<div class="meta" style="margin-top:14px">Toque para ver a resposta</div>'}</div>`+(shown?'<div class="grade"><button data-g="0">Errei</button><button data-g="1">Difícil</button><button data-g="2">Bom</button><button data-g="3">Fácil</button></div>':"");
 $("fc").onclick=()=>{if(!shown){shown=true;fRender()}};
 b.querySelectorAll(".grade button").forEach(x=>x.onclick=()=>{const g=+x.dataset.g,o=S.f[c.i]||{k:0};let k=g==0?0:g==1?Math.max(1,o.k):Math.min(5,o.k+(g==3?2:1));
  S.f[c.i]={k,d:Date.now()+(g==0?6e4*10:IV[k]*DAY)};save();fq.shift();if(g==0)fq.push(c);shown=false;fRender()})}
$("fv").onchange=$("fm").onchange=()=>{fBuild();fRender()};
qCases();qFilter();qRender();
if(location.hash=="#flashcards")tab("f");
</script></body></html>
