 colecistectomia","C":"Hepatite medicamentosa, suporte clínico","D":"Descompensação de doença hepática crônica, antibiótico e busca da causa"},"ok":"O padrão laboratorial é decisivo: transaminases na casa dos milhares (TGP 2054) caracterizam lesão hepatocelular, não colestática. Some-se a isso o antecedente de uso prolongado de amoxicilina associada a AINEs — ambos hepatotóxicos conhecidos — e, sobretudo, a ausência de dilatação de vias biliares ao ultrassom, que exclui obstrução mecânica. O diagnóstico é hepatite medicamentosa (DILI), e o tratamento é suspender o agente e oferecer suporte clínico.","w":{"A":"A colangite exigiria a tríade de Charcot (dor, febre, icterícia) e dilatação de vias biliares — o enunciado descreve calibre normal e leucograma normal (6.200). A CPRE em via biliar não dilatada seria procedimento invasivo e inútil.","B":"A síndrome de Mirizzi é a compressão extrínseca do ducto hepático comum por cálculo impactado no infundíbulo ou no cístico. Cursaria com dilatação da via biliar acima da compressão e padrão colestático, não com transaminases em milhares.","D":"Não há qualquer indício de hepatopatia crônica prévia (o enunciado nega episódios anteriores), e o padrão laboratorial é de lesão hepatocelular aguda. Antibiótico agravaria, se acrescentado a um quadro já medicamentoso."},"p":["Distinção de padrões: hepatocelular = transaminases muito elevadas com FA relativamente pouco alterada (razão R > 5). Colestático = FA e GGT muito elevadas com transaminases pouco alteradas (R < 2).","Misto = R entre 2 e 5. A amoxicilina-clavulanato é uma das causas mais frequentes de DILI no mundo — habitualmente com padrão colestático ou misto e latência de semanas."],"f":"Sabiston, 21ª ed., cap. 53; ACG Clinical Guideline — Idiosyncratic Drug- Induced Liver Injury; LiverTox (NIH)."},{"v":"Vol. II","c":15,"n":10,"g":"D","s":["Em relação aos hepatocarcinomas, podemos afirmar que:"],"a":{"A":"Mesmo para pacientes com risco aumentado de CHC, a confirmação histológica é necessária no pré-operatório","B":"A cintilografia óssea é exame pedido na presença de sintomas ósseos, porém não é necessária nos candidatos a transplante hepático","C":"Pacientes com tumor único < 5 cm ou três tumores < 3 cm, assintomáticos, independentemente de doença vascular ou extra- hepática, têm indicação de transplante hepático","D":"O padrão tomográfico de nódulo sólido com padrão hipervascular na fase arterial com washout na fase venosa é característico do CHC"},"ok":"O comportamento vascular do CHC decorre de sua neoangiogênese: o tumor é irrigado predominantemente pela artéria hepática, enquanto o parênquima normal recebe cerca de 75% do fluxo pela veia porta. Isso produz o padrão patognomônico: hipercaptação intensa na fase arterial seguida de washout (lavagem) na fase portal ou tardia. Em paciente cirrótico com nódulo > 1 cm, esse padrão é diagnóstico, dispensando biópsia.","w":{"A":"Contradiz diretamente o conceito acima. A biópsia não é necessária quando a imagem é típica em fígado cirrótico — e adiciona risco de sangramento e de disseminação pelo trajeto.","B":"Inverte a indicação. O rastreamento de metástase extra-hepática é mais rigoroso nos candidatos a transplante, e não menos — a presença de doença fora do fígado é contraindicação absoluta ao transplante.","C":"Descreve os critérios de Milão, mas insere um erro fatal: o \"independentemente de doença vascular ou extra-hepática\". Os critérios de Milão exigem justamente ausência de invasão vascular macroscópica e de doença extra-hepática."},"p":["Sistema LI-RADS padroniza a interpretação: LR-5 corresponde ao CHC definitivo (realce arterial + washout + cápsula + crescimento limiar), permitindo diagnóstico sem histologia."],"f":"EASL e AASLD Guidelines on HCC; Sabiston, 21ª ed., cap. 53; ACR LI-RADS."},{"v":"Vol. II","c":15,"n":11,"g":"A","s":["Paciente de 47 anos, diabético, com história de mal-estar inespecífico e febre, foi submetido a tomografia com o achado apresentado. Sobre o caso:"],"a":{"A":"Colonoscopia pode ser necessária na investigação da etiologia","B":"O tratamento cirúrgico é a melhor opção","C":"Cobertura antibiótica para gram-positivos é necessária","D":"A causa mais provável é criptogênica"},"ok":"A imagem, associada a febre e mal-estar em paciente diabético, corresponde a abscesso hepático piogênico. A investigação etiológica é obrigatória, porque a origem mais frequente é portal, a partir de um foco abdominal — apendicite, diverticulite e, notadamente, neoplasia colorretal oculta. Por isso a colonoscopia integra a propedêutica, sobretudo quando o agente isolado é Streptococcus do grupo anginosus ou Klebsiella pneumoniae.","w":{"B":"O tratamento de primeira linha é drenagem percutânea guiada por imagem associada a antibioticoterapia. A cirurgia fica reservada a abscessos multiloculados, rotos, de difícil acesso ou refratários.","C":"Erra o espectro. Os agentes predominantes são gram-negativos entéricos (E. coli, Klebsiella) e anaeróbios. A cobertura deve contemplá- los — por exemplo, ceftriaxona associada a metronidazol.","D":"Abscessos criptogênicos existem, mas representam a minoria. A causa mais frequente é a biliar (colangite, obstrução), seguida da portal. Assumir origem criptogênica sem investigar é abandonar a busca por um câncer colorretal potencialmente curável."},"p":["Em pacientes diabéticos, sobretudo asiáticos, o abscesso hepático por Klebsiella pneumoniae hipervirulenta é uma entidade distinta, com risco de disseminação metastática — endoftalmite e abscesso cerebral."],"f":"Sabiston, 21ª ed., cap. 53; UpToDate — Pyogenic liver abscess; literatura sobre associação entre abscesso hepático e neoplasia colorretal."},{"v":"Vol. II","c":15,"n":12,"g":"B","s":["Rose Amélia, 35 anos, com desconforto em hipocôndrio direito de longa data, foi submetida a cirurgia eletiva. Em uso regular apenas de gestodeno. Sem hepatopatia prévia e com sorologias para hepatites normais. De posse dos achados ultrassonográficos e da macroscopia apresentados, a hipótese mais provável é de:"],"a":{"A":"Hemangioma","B":"Hiperplasia nodular focal","C":"Cisto hidático","D":"CHC"},"ok":"A macroscopia mostra lesão bem delimitada com cicatriz central estrelada e septos fibrosos irradiando a partir dela — o achado anatomopatológico definidor da hiperplasia nodular focal. O contexto é compatível: mulher jovem, sem hepatopatia, com sorologias negativas. O uso de anticoncepcional é achado frequente, mas não causal.","w":{"A":"O hemangioma teria aspecto macroscópico esponjoso, vinhoso e hemorrágico, sem cicatriz central organizada.","C":"O cisto hidático (equinococose) apresentaria membrana germinativa, vesículas-filhas e conteúdo líquido, com quadro epidemiológico específico (contato com cães e ovinos).","D":"O CHC em uma mulher de 35 anos sem hepatopatia e com sorologias negativas seria altamente improvável, e sua macroscopia mostraria lesão nodular com necrose e hemorragia, não cicatriz central organizada."},"p":["A HNF na ressonância com contraste hepatoespecífico (ácido gadoxético/Primovist) mantém ou aumenta a captação na fase hepatobiliar, porque contém hepatócitos funcionantes e ductos biliares — enquanto o adenoma \"lava\". É a forma mais confiável de diferenciar as duas."],"f":"Sabiston, 21ª ed., cap. 53; EASL Guidelines on benign liver tumours."},{"v":"Vol. II","c":15,"n":13,"g":"C","s":["Homem de 58 anos, portador de cirrose por HCV curado, Child-Pugh A, sem ascite e sem encefalopatia, plaquetas 155.000/mm³, bilirrubina total 0,9 mg/dL e INR 1,1. Ultrassonografia de rastreio identifica nódulo hepático único no segmento VIII, medindo 2,5 cm. Ressonância demonstra realce arterial intenso com washout em fase portal/tardia e cápsula aparente, sem trombose portal e sem outras lesões. AFP 42,3 ng/mL. Qual a conduta mais apropriada?"],"a":{"A":"Listagem para transplante hepático, por estar dentro dos critérios de Milão","B":"Ablação por radiofrequência como primeira escolha pela dimensão da lesão","C":"Ressecção hepática, considerando função hepática preservada e ausência de sinais de hipertensão portal significativa","D":"TACE como terapia inicial de controle locorregional, reservando a ressecção para falha"},"ok":"O paciente reúne exatamente os três requisitos que autorizam a ressecção hepática em cirrótico com CHC: lesão única, função hepática preservada (Child-Pugh A, bilirrubina normal, INR normal) e ausência de hipertensão portal clinicamente significativa — indicada aqui pelas plaquetas de 155.000 (acima de 100.000) e pela ausência de ascite, esplenomegalia relevante ou varizes descritas. Nessas condições, a ressecção oferece o melhor controle oncológico, com sobrevida em 5 anos de 60 a 70%.","w":{"A":"O paciente de fato está dentro dos critérios de Milão, mas o transplante é reservado a quem tem função hepática comprometida (Child B/C) ou hipertensão portal significativa, ou ainda a lesões multifocais. Listar um Child A com lesão única ressecável ocuparia um órgão escasso desnecessariamente.","B":"A ablação por radiofrequência é excelente para lesões ≤ 3 cm, sendo comparável à ressecção em lesões ≤ 2 cm. Aos 2,5 cm ela é opção válida, mas em paciente com função preservada e lesão perfeitamente ressecável, a ressecção oferece melhor controle local e margem oncológica.","D":"A TACE é o tratamento do estádio BCLC B (multinodular, sem invasão vascular, Child A/B) — não do BCLC A com lesão única ressecável."},"p":["Critérios de hipertensão portal clinicamente significativa que contraindicam a ressecção: gradiente venoso hepático ≥ 10 mmHg, plaquetas < 100.000 com esplenomegalia, varizes esofágicas, ascite."],"f":"EASL Clinical Practice Guidelines on HCC; BCLC staging system (Reig M et al., J Hepatol 2022); Sabiston, 21ª ed., cap. 53."},{"v":"Vol. II","c":15,"n":14,"g":"C","s":["Mulher de 32 anos, IMC 33, em uso de anticoncepcional oral combinado há 12 anos, investigada por dor no hipocôndrio direito. A ressonância mostra nódulo hepático de 7,4 cm no segmento V, com hipersinal em T1, realce arterial intenso e queda de sinal em sequência in-phase/out-of-phase. AFP normal. Biópsia: adenoma hepatocelular subtipo inflamatório. Qual a conduta mais adequada segundo as evidências atuais?"],"a":{"A":"Manter o anticoncepcional e observar clinicamente, pois o subtipo inflamatório raramente apresenta risco de malignização","B":"Suspender o anticoncepcional e acompanhar com imagem semestral, pois ressecções só são indicadas em tumores acima de 10 cm","C":"Suspender o anticoncepcional, ressecar a lesão cirurgicamente devido ao tamanho > 5 cm e ao risco aumentado de complicações","D":"Indicar embolização arterial hepática imediata, pela alta chance de transformação maligna em todos os subtipos"},"ok":"Duas condutas se somam. Primeiro, a suspensão do anticoncepcional, que pode induzir regressão parcial do adenoma. Segundo, a ressecção cirúrgica, indicada porque a lesão excede 5 cm — limiar acima do qual o risco de hemorragia espontânea e de transformação maligna aumenta significativamente. O subtipo inflamatório reforça a indicação: é o de maior risco hemorrágico, e associa-se a obesidade e síndrome metabólica, presentes no caso (IMC 33).","w":{"A":"Errado em dois pontos: manter o estrogênio perpetua o estímulo, e o subtipo inflamatório não é de baixo risco — é o de maior risco de sangramento.","B":"Erra o limiar. O ponto de corte para ressecção é 5 cm, não 10 cm. Uma lesão de 7,4 cm já ultrapassou a faixa de observação.","D":"A embolização é medida de urgência para adenoma roto com sangramento ativo, não conduta eletiva. E a afirmação de \"alta chance de transformação maligna em todos os subtipos\" é falsa — o risco é concentrado no subtipo β-catenina ativado e em homens."},"p":["Subtipos moleculares do adenoma hepatocelular: HNF-1α inativado (esteatótico, ~35%, baixo risco); inflamatório (~40%, maior risco hemorrágico, ligado à obesidade e ao álcool); β-catenina ativado (~10%, maior risco de malignização, indicação de ressecção independentemente do tamanho); e não classificado. Regra: ressecar adenoma se > 5 cm, subtipo β-catenina, sexo masculino (risco de malignização muito maior), ou crescimento apesar da suspensão hormonal."],"f":"EASL Clinical Practice Guidelines on the management of benign liver tumours; Sabiston, 21ª ed., cap. 53; Nault JC et al. — classificação molecular dos adenomas hepatocelulares."},{"v":"Vol. II","c":15,"n":15,"g":"B","s":["Mulher de 64 anos com icterícia indolor, emagrecimento e dilatação de via biliar principal à TC. A ressonância mostra lesão hipointensa na cabeça pancreática, com contato < 180° com a artéria mesentérica superior, sem linfonodomegalias ou metástases. CA 19-9 elevado (350 U/mL). A conduta inicial mais apropriada segundo os critérios atuais de ressecabilidade é:"],"a":{"A":"Gastroduodenopancreatectomia imediata com intenção curativa","B":"Quimioterapia neoadjuvante com FOLFIRINOX ou gencitabina-nab- paclitaxel","C":"Radioterapia com intenção neoadjuvante e posterior cirurgia após redução tumoral","D":"Colocação de stent biliar e vigilância trimestral com marcadores tumorais"},"ok":"Contato arterial de até 180° com a artéria mesentérica superior classifica o tumor como borderline ressecável — qualquer contato arterial já retira o tumor da categoria de plenamente ressecável. Nesse cenário, a conduta atual é quimioterapia neoadjuvante (FOLFIRINOX em pacientes com bom performance status; gencitabina com nab-paclitaxel nos demais), seguida de reestadiamento. A neoadjuvância eleva a taxa de ressecção R0, trata a doença micrometastática precocemente e seleciona biologicamente quem se beneficia da cirurgia.","w":{"A":"Cirurgia imediata em tumor borderline resulta em alta taxa de margem comprometida (R1) e recidiva precoce — é o erro que a classificação de ressecabilidade foi criada para evitar.","C":"A radioterapia isolada não é a estratégia neoadjuvante padrão no adenocarcinoma pancreático. Ela pode ser incorporada após a quimioterapia em protocolos selecionados, mas não substitui o tratamento sistêmico.","D":"Stent com vigilância é conduta paliativa, inadequada em doença potencialmente curável. Marcadores tumorais não substituem tratamento."},"p":["Reforço da classificação NCCN: ressecável = sem contato arterial, contato venoso ≤ 180° sem irregularidade. Borderline = qualquer contato arterial ≤ 180°, ou contato venoso > 180° reconstruível. Localmente avançado = contato arterial > 180° ou oclusão venosa não reconstruível."],"f":"NCCN Guidelines — Pancreatic Adenocarcinoma; Conroy T et al., NEJM — FOLFIRINOX; Sabiston, 21ª ed., cap. 55."},{"v":"Vol. II","c":15,"n":16,"g":"A","s":["Paciente com hepatocarcinoma em fígado cirrótico, apresentando três nódulos hepáticos (2 cm, 2,5 cm e 3 cm) nos segmentos 2, 5 e 7, com função hepática preservada, PS 0, sem invasão vascular e sem metástases. Segundo a classificação BCLC, o estadiamento e a conduta ideais são:"],"a":{"A":"Estádio A; candidato a transplante hepático conforme os critérios de Milão","B":"Estádio B; indicação de TACE como melhor estratégia","C":"Estádio A; indicação de hepatectomia direita","D":"Estádio 0; vigilância sem tratamento imediato"},"ok":"O paciente tem três nódulos, todos ≤ 3 cm, sem invasão vascular e sem doença extra-hepática — enquadra-se perfeitamente nos critérios de Milão, o que o classifica como BCLC A (estádio precoce) e o torna candidato ao transplante hepático, que é a melhor opção: trata o tumor multifocal e a cirrose subjacente simultaneamente, com sobrevida em 5 anos superior a 70%.","w":{"B":"Erra o estadiamento. O BCLC B (intermediário) é o multinodular que excede os critérios de Milão. Como aqui os critérios são preenchidos, o estádio é A, e a TACE seria uma opção inferior — no máximo, ponte para o transplante enquanto se aguarda o órgão.","C":"Acerta o estádio, mas erra a conduta. As lesões estão em três segmentos diferentes (2, 5 e 7), ou seja, distribuídas em ambos os lobos. Uma hepatectomia direita não removeria a lesão do segmento 2, que é esquerdo. Além disso, a ressecção em CHC multifocal em cirrótico tem alta recidiva.","D":"O BCLC 0 (muito precoce) é o nódulo único ≤ 2 cm. E, em qualquer estádio, \"vigilância sem tratamento\" nunca é conduta no CHC estabelecido."},"p":["Algoritmo BCLC resumido: 0 (nódulo único ≤ 2 cm, Child A, PS 0) → ablação ou ressecção. A (único ou até 3 ≤ 3 cm, Child A/B, PS 0) → ressecção, transplante ou ablação. B (multinodular além de Milão, Child A/B, PS 0) → TACE. C (invasão vascular, disseminação extra- hepática ou PS 1-2) → terapia sistêmica (atezolizumabe + bevacizumabe, ou sorafenibe/lenvatinibe). D (Child C, PS > 2) → suporte."],"f":"Reig M et al., J Hepatol 2022 — BCLC strategy update; Mazzaferro V et al., NEJM 1996; EASL Guidelines; Sabiston, 21ª ed., cap. 53."},{"v":"Vol. II","c":15,"n":17,"g":"C","s":["Paciente de 60 anos, com perda de 15 kg em 3 meses, dor abdominal, icterícia e astenia. Ao exame: emagrecido, ictérico, abdome plano, doloroso à palpação do abdome superior, com abaulamento palpável indolor em hipocôndrio direito. USG de abdome com dilatação de vias biliares intra e extra-hepáticas, sem visualizar o fator obstrutivo. Assinale a verdadeira:"],"a":{"A":"A principal suspeita é obstrução biliar por coledocolitíase; a conduta envolve laboratório com canaliculares, bilirrubina e marcador tumoral, além de CPRE","B":"A principal suspeita é obstrução biliar por neoplasia periampular, que pode ter origem na cabeça do pâncreas, colangiocarcinoma distal, duodeno e via biliar; a conduta deve incluir TC de abdome para estadiamento e laboratório com marcador tumoral","C":"A principal suspeita é obstrução biliar por neoplasia periampular, sendo a etiologia mais comum os tumores na cabeça do pâncreas; a conduta deve incluir TC de abdome para estadiamento e laboratório com marcador tumoral","D":"A principal suspeita é colestase por neoplasia de vesícula biliar avançada, já que há vesícula palpável ao exame físico; a conduta deve incluir TC de abdome para estadiamento e avaliação de ressecabilidade"},"ok":"O quadro é de icterícia obstrutiva neoplásica: perda ponderal expressiva, icterícia progressiva, vesícula palpável indolor (sinal de Courvoisier) e dilatação de vias biliares intra e extra-hepáticas sem fator obstrutivo visível ao ultrassom — o que localiza a obstrução na região periampular. A alternativa C é a mais completa porque, além de fazer o diagnóstico sindrômico correto e propor a conduta adequada, especifica que a etiologia mais comum entre os tumores periampulares é o adenocarcinoma da cabeça do pâncreas (60–70% dos casos).","w":{"A":"Coledocolitíase cursaria com dor em cólica, febre ou flutuação da icterícia, e a vesícula palpável indolor argumenta fortemente contra — em litíase crônica, a vesícula está fibrosada. Além disso, a CPRE antes do estadiamento pode dificultar a avaliação da lesão.","B":"Está correta em tudo, mas é menos precisa que a alternativa C: apenas enumera as quatro origens sem hierarquizá-las. Como o enunciado pede a \"verdadeira\" e ambas o são, prevalece a que agrega a informação epidemiológica.","D":"Erra a interpretação do sinal de Courvoisier. A vesícula palpável indica obstrução distal à sua drenagem (ou seja, no colédoco distal ou na papila), com vesícula distendida e sadia — o oposto de uma neoplasia da própria vesícula, que a tornaria endurecida e irregular."},"p":["Os quatro tumores periampulares, do mais comum ao menos: cabeça de pâncreas (60–70%, pior prognóstico), ampola de Vater (melhor prognóstico, sobrevida em 5 anos de 40–60%), colédoco distal e duodeno. Todos são tratados pela duodenopancreatectomia."],"f":"Sabiston, 21ª ed., cap. 54 e cap. 55; NCCN Guidelines — Pancreatic Adenocarcinoma e Hepatobiliary Cancers."},{"v":"Vol. III (autorais)","c":1,"n":1,"g":"C","s":["Mulher de 63 anos, IMC 34, será submetida a colectomia por adenocarcinoma de sigmoide. História de TVP há 8 anos após viagem prolongada. Sem anticoagulação atual. Qual a estratégia de tromboprofilaxia mais adequada?"],"a":{"A":"Profilaxia mecânica isolada durante a internação","B":"HBPM apenas no pós-operatório, suspensa na alta","C":"HBPM associada a profilaxia mecânica, com manutenção da HBPM por 28 dias após a alta","D":"Anticoagulação plena com varfarina por 3 meses"},"ok":"A paciente soma neoplasia maligna, cirurgia abdominal de grande porte, obesidade, idade e TEV prévio — escore de Caprini bem acima de 5, categoria de risco muito alto. Em cirurgia oncológica abdominal ou pélvica, a recomendação é profilaxia combinada (mecânica + farmacológica) e profilaxia estendida por 4 semanas após a alta, estratégia que reduz TEV sintomático sem aumento significativo de sangramento maior.","w":{"A":"Profilaxia mecânica isolada só se justifica quando há contraindicação absoluta à farmacológica (sangramento ativo, coagulopatia grave, trombocitopenia importante).","B":"Suspender na alta desperdiça o período de maior risco: cerca de metade dos eventos tromboembólicos em cirurgia oncológica ocorre após a alta hospitalar.","D":"Anticoagulação plena é tratamento, não profilaxia. Expõe a sangramento sem indicação — a paciente não tem trombose ativa."},"p":["Caprini: 0–1 muito baixo; 2 baixo; 3–4 moderado; ≥5 alto. Cirurgia oncológica abdominopélvica praticamente sempre cai em alto risco."],"f":"ASCO Guideline — VTE Prophylaxis in Patients with Cancer; ACCP CHEST Guidelines; Sabiston, 21ª ed., cap. 5."},{"v":"Vol. III (autorais)","c":1,"n":2,"g":"B","s":["Homem de 71 anos em uso de rivaroxabana por fibrilação atrial (CHA₂DS₂-VASc 4), clearance de creatinina 55 mL/min, será submetido a hernioplastia inguinal eletiva (baixo risco hemorrágico). Qual a conduta mais adequada?"],"a":{"A":"Suspender a rivaroxabana 7 dias antes e iniciar ponte com HBPM em dose plena","B":"Suspender a rivaroxabana 24 horas antes, sem ponte com heparina","C":"Manter a rivaroxabana e operar sob controle rigoroso de hemostasia","D":"Suspender a rivaroxabana e transfundir plasma fresco congelado na indução"},"ok":"Os anticoagulantes orais diretos (DOACs) têm meia-vida curta e efeito previsível, o que dispensa a ponte com heparina. Para procedimento de baixo risco hemorrágico com função renal razoável, suspende-se 24 horas antes (2 meias-vidas). Em procedimentos de alto risco, o intervalo sobe para 48 horas; e com clearance abaixo de 50 mL/min, prolonga-se ainda mais — sobretudo para dabigatrana, de eliminação predominantemente renal.","w":{"A":"Sete dias é o intervalo da varfarina, não do DOAC. E o estudo BRIDGE demonstrou que a ponte com heparina em fibrilação atrial não reduz eventos tromboembólicos e aumenta sangramento maior.","C":"Operar sob anticoagulação plena expõe a hematoma inguinal volumoso e reoperação, sem qualquer benefício, já que a suspensão de 24 h é segura em termos tromboembólicos.","D":"Plasma fresco congelado não reverte DOAC — não há fatores a repor, e sim um inibidor direto circulante. Os antídotos são idarucizumabe (dabigatrana) e andexanet alfa (anti-Xa), reservados a sangramento grave ou cirurgia de emergência."},"p":["Varfarina: suspender 5 dias antes, checar INR &lt; 1,5; ponte apenas em risco tromboembólico muito alto (prótese mecânica mitral, TEV recente, AVC recente)."],"f":"ACC Expert Consensus on Periprocedural Management of Anticoagulation; Douketis JD et al., NEJM — BRIDGE trial; Sabiston, 21ª ed., cap. 10."},{"v":"Vol. III (autorais)","c":1,"n":3,"g":"D","s":["Sobre o controle glicêmico perioperatório em paciente diabético submetido a cirurgia de grande porte, assinale a alternativa correta:"],"a":{"A":"O alvo glicêmico deve ser 80–110 mg/dL, com insulinoterapia intensiva","B":"A hiperglicemia perioperatória só é deletéria em diabéticos previamente diagnosticados","C":"A metformina deve ser mantida no dia da cirurgia por reduzir a resistência insulínica","D":"O alvo recomendado é 140–180 mg/dL, e a hiperglicemia associa-se a maior risco de infecção de sítio cirúrgico"},"ok":"O estudo NICE-SUGAR demonstrou que o controle intensivo (80–110) aumenta mortalidade por hipoglicemia grave em pacientes críticos. O alvo atual é 140–180 mg/dL. A hiperglicemia perioperatória compromete quimiotaxia e função de neutrófilos, favorece glicosilação de proteínas e aumenta comprovadamente a infecção de sítio cirúrgico — sendo a OMS explícita ao recomendar seu controle.","w":{"A":"Alvo abandonado após o NICE-SUGAR, justamente pelo excesso de hipoglicemias graves.","B":"A hiperglicemia de estresse em não diabéticos tem impacto prognóstico igual ou até pior que a do diabético conhecido, porque reflete a intensidade da resposta metabólica.","C":"A metformina é suspensa no dia da cirurgia — risco de acidose lática em situações de hipoperfusão, jejum e uso de contraste iodado. Fonte: NICE-SUGAR Study Investigators, NEJM; OMS — Global Guidelines for the Prevention of SSI (2018); ADA Standards of Medical Care in Diabetes."},"p":[],"f":""},{"v":"Vol. III (autorais)","c":1,"n":4,"g":"A","s":["Durante laparotomia de 4 horas, o paciente evolui com temperatura central de 34,8 °C. Qual a principal consequência esperada dessa hipotermia perioperatória?"],"a":{"A":"Aumento de infecção de sítio cirúrgico, coagulopatia e eventos cardíacos","B":"Redução do consumo de oxigênio com efeito protetor cerebral","C":"Aceleração do metabolismo de anestésicos, com despertar precoce","D":"Vasodilatação periférica com melhora da perfusão tecidual"},"ok":"A hipotermia perioperatória não intencional produz três efeitos deletérios bem documentados: vasoconstrição cutânea com queda da tensão tecidual de oxigênio e prejuízo à função de neutrófilos (mais infecção de ferida), disfunção enzimática da cascata de coagulação e das plaquetas (mais sangramento e transfusão), e descarga adrenérgica no despertar com tremores, aumento do consumo de O₂ e risco de isquemia miocárdica.","w":{"B":"O efeito protetor da hipotermia é conceito de parada cardíaca e neuroproteção induzida e controlada, não da hipotermia acidental intraoperatória.","C":"Ocorre o contrário: a hipotermia retarda o metabolismo de anestésicos e bloqueadores neuromusculares, prolongando o despertar e a recuperação.","D":"A resposta fisiológica é vasoconstrição, não vasodilatação — e é justamente ela que reduz a oxigenação tecidual da ferida."},"p":["Prevenção: manta térmica de ar forçado, aquecimento de fluidos e de gases, e controle da temperatura da sala. É recomendação forte da OMS e pilar do ERAS."],"f":"Kurz A et al., NEJM — Perioperative normothermia to reduce the incidence of surgical-wound infection; OMS Global Guidelines (2018); Sabiston, 21ª ed., cap. 10."},{"v":"Vol. III (autorais)","c":1,"n":5,"g":"B","s":["Paciente de 58 anos em uso de prednisona 20 mg/dia há 3 anos por artrite reumatoide será submetido a colectomia. Qual a conduta mais adequada quanto à corticoterapia?"],"a":{"A":"Suspender a prednisona 24 h antes para reduzir o risco infeccioso","B":"Manter a dose habitual e administrar hidrocortisona 100 mg na indução, seguida de 50 mg/dia por 48–72 h, com desmame","C":"Substituir por dexametasona em dose única no pós-operatório","D":"Nenhuma medida adicional é necessária, pois o eixo adrenal se recupera em 24 h"},"ok":"Uso de prednisona acima de 20 mg/dia por mais de três semanas causa supressão do eixo hipotálamo-hipófise-adrenal. Diante do estresse de uma cirurgia de grande porte, a adrenal suprimida não consegue elevar o cortisol como deveria, com risco de crise addisoniana — hipotensão refratária a volume e vasopressor. A conduta é manter a dose habitual e acrescentar dose de estresse de hidrocortisona.","w":{"A":"Suspender agrava exatamente o problema, precipitando insuficiência adrenal aguda.","C":"Dexametasona em dose única no pós-operatório não cobre o período crítico (indução e intraoperatório) e não tem atividade mineralocorticoide relevante.","D":"O eixo suprimido leva semanas a meses para se recuperar após corticoterapia crônica."},"p":["Dose de estresse por porte: pequeno — 25 mg de hidrocortisona no dia; médio — 50–75 mg/dia por 1–2 dias; grande — 100 mg na indução e 50 mg/dia por 48–72 h."],"f":"Salem M et al., Ann Surg — Perioperative glucocorticoid coverage; Sabiston, 21ª ed., cap. 39; UpToDate."},{"v":"Vol. III (autorais)","c":1,"n":6,"g":"C","s":["Sobre a avaliação e a redução do risco pulmonar perioperatório, é incorreto afirmar que:"],"a":{"A":"A cessação do tabagismo idealmente deve ocorrer 4 a 8 semanas antes da cirurgia","B":"Incisões abdominais altas e torácicas conferem maior risco de complicação pulmonar do que as baixas","C":"A espirometria pré-operatória de rotina reduz complicações pulmonares em todos os pacientes cirúrgicos","D":"Manobras de expansão pulmonar no pós-operatório reduzem atelectasia e pneumonia"},"ok":"Enunciado negativo. A espirometria não deve ser solicitada de rotina: ela não prediz complicações melhor que a avaliação clínica e não reduz desfechos. Suas indicações são específicas — cirurgia de ressecção pulmonar, dispneia inexplicada, ou DPOC/asma sem otimização clínica documentada.","w":{"A":"Verdadeira. Cessar menos de 4 semanas antes pode aumentar transitoriamente a secreção brônquica; o benefício claro aparece a partir de 4 a 8 semanas.","B":"Verdadeira e é o fator de risco cirúrgico mais forte: incisões próximas ao diafragma reduzem a capacidade residual funcional e a eficácia da tosse.","D":"Verdadeira. Fisioterapia respiratória, inspirômetro de incentivo e deambulação precoce reduzem atelectasia e pneumonia pós-operatória."},"p":["Fatores de risco pulmonar: idade &gt; 60 anos, DPOC, ASA ≥ III, insuficiência cardíaca, dependência funcional, albumina &lt; 3,5 g/dL, tabagismo, cirurgia &gt; 3 h, anestesia geral e incisão alta."],"f":"Smetana GW et al., Ann Intern Med — Preoperative pulmonary risk stratification; ACP Guidelines; Sabiston, 21ª ed., cap. 10."},{"v":"Vol. III (autorais)","c":1,"n":7,"g":"A","s":["Paciente de 82 anos, no 2º dia de pós-operatório de colecistectomia, apresenta desorientação flutuante, inversão do ciclo sono-vigília e agitação noturna. Sem febre, com exames laboratoriais normais. Qual a conduta inicial mais adequada?"],"a":{"A":"Investigar e corrigir causas precipitantes (dor, retenção urinária, constipação, medicações, hipóxia), com medidas ambientais e de reorientação","B":"Iniciar benzodiazepínico em dose baixa à noite para regularizar o sono","C":"Contenção mecânica como primeira medida de segurança","D":"Iniciar haloperidol profilático em todos os idosos operados"},"ok":"O quadro é de delirium pós-operatório, complicação frequente e subdiagnosticada no idoso, associada a maior mortalidade, institucionalização e declínio cognitivo. A abordagem de primeira linha é não farmacológica: identificar e corrigir os precipitantes (dor mal controlada, retenção urinária, impactação fecal, hipóxia, distúrbio hidroeletrolítico, drogas anticolinérgicas e opioides), reorientar, restaurar o ciclo claro-escuro, devolver óculos e aparelho auditivo, e mobilizar precocemente.","w":{"B":"Os benzodiazepínicos são precipitantes clássicos de delirium no idoso e devem ser evitados, salvo em abstinência alcoólica.","C":"A contenção mecânica agrava a agitação, aumenta lesões e prolonga o delirium. É medida de exceção.","D":"Não há evidência que sustente antipsicótico profilático. O haloperidol pode ser usado em dose baixa apenas quando a agitação ameaça a segurança e as medidas não farmacológicas falharam."},"p":["Diferencie: delirium (agudo, flutuante, com alteração da atenção) de demência (crônico, progressivo, atenção preservada no início) e de depressão."],"f":"Sabiston, 21ª ed., cap. 10; American Geriatrics Society Guideline on Postoperative Delirium; critérios CAM."},{"v":"Vol. III (autorais)","c":1,"n":8,"g":"D","s":["Sobre o preparo intestinal em cirurgia colorretal eletiva, segundo as evidências e diretrizes atuais:"],"a":{"A":"O preparo mecânico isolado reduz significativamente infecção de sítio cirúrgico e deiscência","B":"O preparo mecânico está formalmente contraindicado em qualquer cirurgia colorretal","C":"Antibióticos orais isolados, sem preparo mecânico, são a estratégia de melhor evidência","D":"A combinação de preparo mecânico com antibióticos orais não absorvíveis reduz infecção de sítio cirúrgico e infecção de órgão-espaço"},"ok":"A síntese atual é clara: o preparo mecânico isolado não traz benefício e por décadas foi feito sem razão; o que reduz desfechos é a combinação de preparo mecânico com antibiótico oral não absorvível (neomicina com metronidazol, ou eritromicina), somada à profilaxia endovenosa habitual. É a recomendação da OMS, da ASCRS e do ERAS.","w":{"A":"O preparo mecânico isolado foi testado exaustivamente e não reduz ISC nem deiscência — foi essa constatação que quase o eliminou da prática.","B":"\"Formalmente contraindicado\" é um absoluto falso. Ele é dispensável isoladamente, mas útil combinado, e permanece necessário quando se planeja colonoscopia intraoperatória ou manipulação com estoma.","C":"Antibiótico oral isolado é opção discutida na literatura, mas a evidência mais robusta apoia a combinação."},"p":["Reforço da interseção com o Caso 3: esse mesmo conteúdo foi cobrado três vezes no banco original, sempre pelo ângulo das diretrizes da OMS."],"f":"OMS — Global Guidelines for the Prevention of SSI (2018); ASCRS Clinical Practice Guidelines; ERAS Society Guidelines for Colorectal Surgery."},{"v":"Vol. III (autorais)","c":1,"n":9,"g":"B","s":["Homem de 66 anos, hipertenso, será submetido a gastrectomia. Faz uso de AAS 100 mg/dia em prevenção secundária, após infarto há 2 anos, sem stent nos últimos 12 meses. Qual a conduta mais adequada quanto ao AAS?"],"a":{"A":"Suspender 10 dias antes, pelo risco hemorrágico da cirurgia abdominal","B":"Manter o AAS no perioperatório, pelo risco cardiovascular da suspensão superar o risco hemorrágico","C":"Substituir por clopidogrel, de meia-vida mais curta","D":"Suspender e iniciar enoxaparina profilática como substituto antiagregante"},"ok":"Em prevenção secundária, a suspensão do AAS associa-se a aumento de eventos coronarianos, porque produz rebote pró-trombótico exatamente no período de hipercoagulabilidade da REMIT. Na maioria das cirurgias abdominais, o incremento de sangramento com AAS mantido é modesto e manejável. A conduta é manter.","w":{"A":"Dez dias é o intervalo usado quando a suspensão é realmente indicada — e mesmo assim, hoje raramente se faz em prevenção secundária. Suspender aqui inverte a análise de risco.","C":"O clopidogrel tem meia-vida de efeito mais longa (bloqueio irreversível do P2Y12 por toda a vida da plaqueta) e maior risco hemorrágico. Trocar não faz sentido.","D":"Heparina em dose profilática é antitrombótica venosa; não substitui antiagregação arterial nem previne trombose de placa coronariana."},"p":["Exceção importante: em neurocirurgia e cirurgia de câmara posterior do olho, o AAS deve ser suspenso mesmo em coronariopatas, porque qualquer sangramento nesses compartimentos","é catastrófico."],"f":"ACC/AHA Perioperative Guideline; POISE-2 trial (Devereaux PJ et al., NEJM); Sabiston, 21ª ed., cap. 10."},{"v":"Vol. III (autorais)","c":1,"n":10,"g":"C","s":["Sobre a classificação de risco anestésico-cirúrgico, assinale a alternativa correta:"],"a":{"A":"O índice de risco cardíaco revisado (IRCR/Lee) inclui hipertensão arterial controlada entre seus preditores","B":"Um paciente com dois ou mais preditores do IRCR deve ser encaminhado diretamente à angiografia coronariana","C":"O IRCR considera cirurgia torácica, abdominal ou vascular suprainguinal como um de seus preditores","D":"O escore ASA incorpora o porte da cirurgia em sua graduação"},"ok":"O índice de Lee tem seis preditores, e um deles é justamente o tipo de cirurgia: torácica, abdominal ou vascular suprainguinal. Os outros cinco são doença coronariana, insuficiência cardíaca, doença cerebrovascular, diabetes em uso de insulina e creatinina acima de 2 mg/dL.","w":{"A":"Hipertensão controlada não é preditor do IRCR — é um dos erros mais cobrados. Ela pesa na classificação ASA, não no índice de Lee.","B":"Dois ou mais preditores levam à avaliação da capacidade funcional: se ≥ 4 METs, opera-se; se &lt; 4 METs, considera-se teste não invasivo (eco de estresse), e só depois, conforme o resultado, se cogita coronariografia. Ir direto à angiografia contraria o algoritmo e o estudo CARP.","D":"O ASA classifica apenas o estado físico do paciente, sem considerar o porte da cirurgia — essa é justamente uma de suas limitações clássicas."},"p":["Os 6 preditores do IRCR, para decorar: coronariopatia, insuficiência cardíaca, doença cerebrovascular, DM em insulina, creatinina &gt; 2, e cirurgia de alto risco (torácica, abdominal, vascular suprainguinal)."],"f":"Lee TH et al., Circulation — Derivation and prospective validation of a simple index; ACC/AHA Perioperative Guideline; Sabiston, 21ª ed., cap. 10."},{"v":"Vol. III (autorais)","c":2,"n":1,"g":"B","s":["Sobre as proteínas de fase aguda na resposta ao trauma, assinale a alternativa correta:"],"a":{"A":"A albumina é proteína de fase aguda positiva e se eleva proporcionalmente à gravidade","B":"A IL-6 é o principal indutor hepático das proteínas de fase aguda positivas, como PCR e fibrinogênio","C":"A transferrina se eleva na inflamação, sendo útil como marcador de gravidade","D":"A pré-albumina é proteína de fase aguda positiva, elevando-se nas primeiras 48 h"},"ok":"A IL-6, produzida em resposta a IL-1 e TNF-α, é o principal sinal que reprograma a síntese hepática: aumenta a produção de proteínas de fase aguda positivas (PCR, fibrinogênio, haptoglobina, ferritina, ceruloplasmina, alfa-1-antitripsina) e reduz a das negativas (albumina, pré-albumina, transferrina, retinol-binding protein).","w":{"A":"A albumina é proteína de fase aguda negativa: cai na inflamação, por menor síntese e por extravasamento capilar.","C":"A transferrina é igualmente proteína de fase aguda negativa — cai na inflamação, o que a torna pouco confiável como marcador nutricional em paciente agudo.","D":"A pré-albumina também é negativa. Sua meia-vida curta a torna útil para monitorar resposta à terapia nutricional, mas só depois que a inflamação cede."},"p":["Regra prática: se a PCR ainda está alta, não interprete albumina, pré- albumina ou transferrina como marcadores nutricionais — eles estão medindo inflamação."],"f":"Sabiston, 21ª ed., cap. 2; Gabay C, Kushner I, NEJM — Acute-phase proteins and other systemic responses to inflammation."},{"v":"Vol. III (autorais)","c":2,"n":2,"g":"C","s":["Paciente politraumatizado no 3º dia de internação em UTI apresenta T3 baixo, T4 total baixo, T3 reverso elevado e TSH normal. Qual a interpretação e a conduta?"],"a":{"A":"Hipotireoidismo primário; iniciar levotiroxina","B":"Hipotireoidismo central por lesão hipofisária; solicitar ressonância de sela","C":"Síndrome do eutireóideo doente; conduta expectante, sem reposição hormonal","D":"Tireoidite subaguda; iniciar corticoide"},"ok":"A síndrome do eutireóideo doente (síndrome do T3 baixo) decorre da inibição da desiodase tipo 1 e da ativação da tipo 3 pelas citocinas e pelo cortisol, desviando a conversão periférica de T4 para T3 reverso, biologicamente inativo. É um mecanismo adaptativo de economia energética, não uma doença tireoidiana. TSH normal ou discretamente baixo com T3 reverso elevado é a assinatura. Não se repõe hormônio: os ensaios de reposição não mostraram benefício e sugerem possível dano.","w":{"A":"No hipotireoidismo primário o TSH estaria elevado, e o T3 reverso, baixo.","B":"No hipotireoidismo central o TSH seria baixo ou inapropriadamente normal, mas o T3 reverso também estaria baixo — é justamente ele que discrimina os dois quadros.","D":"A tireoidite subaguda cursa com dor cervical, febre e tireotoxicose transitória, quadro clínico ausente aqui."},"p":["O T3 reverso é o exame que resolve a questão: elevado aponta para eutireóideo doente; baixo aponta para hipotireoidismo verdadeiro."],"f":"Sabiston, 21ª ed., cap. 2 e cap. 38; Van den Berghe G — Non-thyroidal illness in the ICU."},{"v":"Vol. III (autorais)","c":2,"n":3,"g":"A","s":["Após a fase pró-inflamatória inicial (SIRS), o organismo desenvolve uma resposta compensatória. Sobre essa fase, é correto afirmar:"],"a":{"A":"A CARS (síndrome de resposta anti-inflamatória compensatória) envolve IL-10 e TGF-β e pode levar a imunoparalisia, com maior susceptibilidade a infecções tardias","B":"A CARS ocorre apenas após o 30º dia da agressão","C":"A CARS é sempre benéfica, pois limita o dano tecidual","D":"A CARS caracteriza-se por elevação de IL-1 e TNF-α"},"ok":"A resposta ao trauma tem componentes pró e anti-inflamatórios simultâneos. A CARS é mediada por IL-10, IL-4, TGF-β e antagonistas de receptores, e sua exacerbação produz imunoparalisia — com queda da expressão de HLA-DR nos monócitos, anergia linfocitária e susceptibilidade a infecções nosocomiais e reativações virais. É uma das razões pelas quais o politraumatizado morre de sepse tardia.","w":{"B":"A CARS começa precocemente, praticamente em paralelo à SIRS, e não após 30 dias.","C":"Absoluto falso. Quando excessiva, a CARS é deletéria, por deixar o paciente imunologicamente indefeso.","D":"IL-1 e TNF-α são as citocinas pró-inflamatórias da SIRS, não da CARS."},"p":["Conceito moderno: PICS (persistent inflammation, immunosuppression and catabolism syndrome) descreve o paciente crítico crônico que mantém inflamação, imunossupressão e catabolismo simultâneos por semanas."],"f":"Sabiston, 21ª ed., cap. 2; Bone RC — Sir Isaac Newton, sepsis, SIRS and CARS; Gentile LF et al., J Trauma — PICS."},{"v":"Vol. III (autorais)","c":2,"n":4,"g":"D","s":["Qual das situações abaixo cursa com o maior aumento do gasto energético basal?"],"a":{"A":"Cirurgia eletiva de médio porte","B":"Fratura de fêmur isolada","C":"Peritonite por perfuração de víscera oca","D":"Queimadura de 60% da superfície corporal"},"ok":"A grande queimadura é a agressão que produz o estado hipermetabólico mais intenso conhecido em medicina: o gasto energético pode dobrar (aumento de 80 a 100% ou mais sobre o basal), com hipercatabolismo que persiste por meses após a cicatrização. Contribuem a perda evaporativa maciça de calor pela pele ausente, a inflamação sistêmica sustentada e a elevação prolongada de catecolaminas e cortisol.","w":{"A":"Cirurgia eletiva não complicada eleva o gasto energético em cerca de 10 a 20%.","B":"Fratura isolada eleva em torno de 15 a 30%.","C":"Peritonite e sepse elevam de 30 a 50%, aumento significativo, mas inferior ao da grande queimadura."},"p":["Gradiente do hipermetabolismo: cirurgia eletiva 10–20% &lt; fratura 15–30% &lt; sepse/peritonite 30–50% &lt; politrauma grave 40–60% &lt; grande queimado 80–100%. Consequência prática: no grande queimado, a oferta proteica pode chegar a 2,0–2,5 g/kg/dia, e o propranolol é usado para atenuar o hipermetabolismo adrenérgico."],"f":"Sabiston, 21ª ed., cap. 2, cap. 6 e cap. 19; Herndon DN et al., NEJM — propranolol no grande queimado."},{"v":"Vol. III (autorais)","c":2,"n":5,"g":"B","s":["A \"via colinérgica anti-inflamatória\" descreve um mecanismo de modulação da resposta ao trauma. Sobre ela, é correto afirmar:"],"a":{"A":"É mediada pela liberação de noradrenalina nas terminações simpáticas esplâncnicas","B":"Envolve o nervo vago e a acetilcolina agindo em receptores nicotínicos α7 de macrófagos, reduzindo a liberação de TNF-α","C":"Sua ativação aumenta a produção de IL-1 e IL-6, amplificando a inflamação","D":"É bloqueada pela anestesia peridural, que por isso intensifica a REMIT"},"ok":"A via colinérgica anti-inflamatória, descrita por Tracey, é um reflexo neural: a aferência vagal detecta a inflamação e a eferência vagal libera acetilcolina, que age em receptores nicotínicos α7 de macrófagos esplênicos, inibindo a translocação do NF-κB e reduzindo a produção de TNF-α e outras citocinas pró-inflamatórias. É a contrapartida do eixo simpático na modulação da REMIT.","w":{"A":"A noradrenalina é o mediador simpático, não colinérgico. O eixo simpático amplifica a resposta ao estresse.","C":"Inverte o efeito: a via colinérgica reduz a produção de citocinas pró- inflamatórias.","D":"Inverte tudo. A peridural bloqueia a eferência simpática e, ao fazê-lo, atenua a REMIT — é justamente por isso que é um pilar do ERAS."},"p":["Relevância prática: essa via é a base racional para a estimulação vagal como terapia anti-inflamatória em pesquisa, e ajuda a explicar por que técnicas que reduzem estresse cirúrgico melhoram desfechos."],"f":"Tracey KJ, Nature — The inflammatory reflex; Sabiston, 21ª ed., cap. 2."},{"v":"Vol. III (autorais)","c":2,"n":6,"g":"C","s":["Sobre as diferenças da resposta metabólica ao trauma em extremos de idade, assinale a correta:"],"a":{"A":"O idoso monta uma resposta neuroendócrina mais intensa que o adulto jovem, com melhor tolerância ao estresse","B":"A criança tem reserva de glicogênio proporcionalmente maior, o que a protege da hipoglicemia no jejum prolongado","C":"O idoso tem menor reserva funcional e menor massa magra, o que torna a proteólise mais deletéria e a recuperação mais lenta","D":"A REMIT é ausente em recém-nascidos, por imaturidade do eixo hipotálamo-hipófise-adrenal"},"ok":"O idoso apresenta sarcopenia e menor reserva funcional cardiovascular, pulmonar e renal. Como a resposta catabólica consome massa magra para gerar substrato, o mesmo grau de proteólise que um jovem tolera pode levar o idoso a perda funcional irreversível, com maior tempo de ventilação, mais infecções e recuperação prolongada.","w":{"A":"Inverte: o idoso monta resposta neuroendócrina atenuada e mais lenta, e tolera pior o estresse — o que explica apresentações atípicas, como sepse sem febre e sem leucocitose.","B":"Inverte: a criança tem reserva de glicogênio proporcionalmente menor e maior taxa metabólica, o que a torna mais propensa a hipoglicemia no jejum.","D":"A REMIT existe desde o período neonatal — inclusive no feto. O eixo é funcional, ainda que com particularidades."},"p":["Consequência clínica: em idosos, a pré-habilitação nutricional e funcional e a mobilização precoce têm impacto proporcionalmente maior sobre desfechos."],"f":"Sabiston, 21ª ed., cap. 2 e cap. 11 (Cirurgia no idoso)."},{"v":"Vol. III (autorais)","c":2,"n":7,"g":"A","s":["Paciente no 1º dia de pós-operatório de laparotomia apresenta débito urinário de 25 mL/h, sódio urinário de 12 mEq/L e densidade urinária de 1.028. PA 118×72, FC 96. Qual a interpretação mais provável?"],"a":{"A":"Oligúria pré-renal fisiológica, por ação de ADH e aldosterona no contexto da REMIT","B":"Necrose tubular aguda estabelecida, com indicação de diálise","C":"Nefropatia obstrutiva; solicitar ultrassonografia de vias urinárias urgente","D":"Síndrome hepatorrenal"},"ok":"O padrão é inequivocamente pré-renal: sódio urinário baixo (&lt; 20 mEq/L), urina concentrada (densidade alta) e oligúria moderada. Corresponde à ação combinada de ADH (reabsorção de água livre) e aldosterona (retenção de sódio) na fase catabólica da REMIT, somada a alguma hipovolemia relativa. A conduta é otimizar volemia e analgesia, monitorar e reavaliar — não intervir agressivamente.","w":{"B":"Na necrose tubular aguda o túbulo perde a capacidade de reabsorver sódio: o sódio urinário estaria alto (&gt; 40 mEq/L), a densidade seria isostenúrica (~1.010) e haveria cilindros granulosos.","C":"Não há qualquer dado sugestivo de obstrução (anúria, dor, bexigoma, antecedente urológico), e o padrão urinário não é compatível.","D":"A síndrome hepatorrenal exige hepatopatia avançada com ascite, ausente no enunciado."},"p":["Fração de excreção de sódio (FENa): &lt; 1% = pré-renal; &gt; 2% = renal (NTA). Cuidado ao interpretar em uso de diurético — nesse caso, use a fração de excreção de ureia (&lt; 35% sugere pré-renal)."],"f":"Sabiston, 21ª ed., cap. 2 e cap. 4; UpToDate — Postoperative oliguria."},{"v":"Vol. III (autorais)","c":2,"n":8,"g":"D","s":["Qual das intervenções abaixo não atenua a resposta endócrino-metabólica ao trauma cirúrgico?"],"a":{"A":"Analgesia peridural torácica","B":"Bebida com carboidrato 2 h antes da cirurgia","C":"Manutenção da normotermia intraoperatória","D":"Reposição volêmica liberal com cristaloide no intraoperatório"},"ok":"Enunciado negativo. A fluidoterapia liberal não atenua a REMIT — ao contrário, o excesso de volume causa edema intersticial, edema de alça com íleo prolongado, disfunção da anastomose, congestão pulmonar e maior tempo de internação. A recomendação do ERAS é fluidoterapia restritiva e guiada por metas.","w":{"A":"Atenua: bloqueia a aferência nociceptiva e a eferência simpática, reduzindo cortisol, catecolaminas e íleo.","B":"Atenua: reduz a resistência insulínica pós-operatória, o desconforto e o catabolismo, com efeito bem documentado no ACERTO.","C":"Atenua: a hipotermia é estímulo adrenérgico potente, e evitá-la reduz tremores, consumo de O₂ e complicações."},"p":["Lista das intervenções que atenuam a REMIT: videolaparoscopia, peridural e bloqueios, analgesia preemptiva e multimodal, jejum abreviado com carboidrato, normotermia, restrição hídrica, clonidina/dexmedetomidina, aconselhamento e pré-habilitação."],"f":"Projeto ACERTO; ERAS Society Guidelines; Sabiston, 21ª ed., cap. 2 e cap. 10."},{"v":"Vol. III (autorais)","c":2,"n":9,"g":"B","s":["Sobre a hiperglicemia de estresse no pós-operatório, assinale a alternativa correta:"],"a":{"A":"Decorre exclusivamente da queda da secreção de insulina pelo pâncreas","B":"Resulta da combinação de aumento da produção hepática de glicose e resistência insulínica periférica mediada por citocinas e hormônios contrarregulatórios","C":"Ocorre apenas em pacientes previamente diabéticos","D":"Deve ser tratada com controle intensivo, alvo entre 80 e 110 mg/dL"},"ok":"A hiperglicemia da REMIT tem dois componentes: aumento da produção hepática de glicose (glicogenólise e gliconeogênese, estimuladas por glucagon, cortisol e catecolaminas) e resistência insulínica periférica, mediada por TNF-α, IL-6 e pelos próprios hormônios contrarregulatórios, com redução da translocação de GLUT-4 no músculo. O resultado é hiperglicemia apesar de níveis de insulina que poderiam ser até normais.","w":{"A":"A queda relativa da insulina existe (inibição α2-adrenérgica), mas não é o mecanismo exclusivo — a resistência periférica é tão ou mais importante.","C":"A hiperglicemia de estresse ocorre em não diabéticos e tem valor prognóstico igual ou superior nesses pacientes.","D":"Alvo abandonado após o NICE-SUGAR. O alvo atual é 140–180 mg/dL."},"p":["O jejum prolongado agrava a resistência insulínica pós-operatória — daí a maltodextrina 2 h antes reduzir a hiperglicemia subsequente."],"f":"Sabiston, 21ª ed., cap. 2; NICE-SUGAR, NEJM; Ljungqvist O — Insulin resistance and outcomes in surgery."},{"v":"Vol. III (autorais)","c":2,"n":10,"g":"A","s":["Qual sequência descreve corretamente a ordem cronológica das quatro fases da recuperação metabólica descritas por Moore?"],"a":{"A":"Catabólica → transição (ponto de virada) → anabólica precoce → ganho de gordura","B":"Ebb → catabólica → ganho de gordura → anabólica","C":"Anabólica → catabólica → transição → ganho de gordura","D":"Transição → catabólica → ganho de gordura → anabólica"},"ok":"A sequência de Moore é: fase catabólica (adrenérgico-corticoide, 3 a 5 dias, balanço nitrogenado e calórico negativos); fase de transição ou ponto de virada (1 a 2 dias, diurese, queda do cortisol, retorno do apetite); fase anabólica precoce (semanas, balanço nitrogenado positivo, reposição de massa proteica); e fase de ganho de gordura (meses, recomposição do tecido adiposo).","w":{"B":"Confunde as classificações. Ebb e flow são de Cuthbertson e descrevem as primeiras horas e dias; as quatro fases de Moore descrevem a recuperação completa. Além disso, coloca o ganho de gordura antes do anabolismo proteico.","C":"Começa pela fase anabólica, o que é impossível — a agressão inicia sempre pelo catabolismo.","D":"Coloca a transição antes do catabolismo e inverte as duas últimas fases."},"p":["Guarde a ordem da reposição: primeiro proteína, depois gordura. Um paciente que recupera peso rápido no primeiro mês está repondo água e proteína, não gordura."],"f":"Moore FD — Metabolic Care of the Surgical Patient; Cuthbertson DP, Lancet; Sabiston, 21ª ed., cap. 2."},{"v":"Vol. III (autorais)","c":3,"n":1,"g":"C","s":["Segundo a classificação das feridas operatórias quanto ao grau de contaminação, uma colecistectomia eletiva em que ocorre extravasamento de bile, sem inflamação aguda significativa, é classificada como:"],"a":{"A":"Limpa","B":"Limpa-contaminada","C":"Contaminada","D":"Infectada"},"ok":"A classificação leva em conta a abertura de víscera oca e a presença de contaminação. Limpa-contaminada é a abertura controlada do trato digestivo, respiratório ou geniturinário sem extravasamento significativo. Quando há extravasamento franco de conteúdo — bile, conteúdo intestinal, urina infectada — ou quebra grosseira de técnica asséptica, a ferida sobe para contaminada.","w":{"A":"Ferida limpa é a que não penetra trato digestivo, respiratório ou geniturinário, em cirurgia eletiva com fechamento primário — herniorrafia, tireoidectomia, mastectomia.","B":"Seria a classificação da colecistectomia eletiva sem extravasamento.","D":"Ferida infectada (suja) implica infecção purulenta preexistente, víscera perfurada com peritonite estabelecida ou tecido desvitalizado — não é o caso descrito."},"p":["Risco aproximado de ISC por classe: limpa 1–2%; limpa-contaminada 3–5%; contaminada 10–15%; infectada 20–40%."],"f":"Sabiston, 21ª ed., cap. 12; CDC — Surgical Wound Classification."},{"v":"Vol. III (autorais)","c":3,"n":2,"g":"B","s":["Durante uma colectomia com cefazolina administrada na indução, a cirurgia se prolonga e completa 4 horas de duração, com perda sanguínea estimada de 1.800 mL. Qual a conduta quanto ao antimicrobiano?"],"a":{"A":"Nenhuma; a dose de indução cobre todo o intraoperatório","B":"Administrar nova dose (redose) de cefazolina, tanto pelo tempo quanto pelo volume de sangramento","C":"Trocar para um carbapenêmico, pelo risco aumentado de infecção","D":"Iniciar antibioticoterapia terapêutica por 7 dias no pós-operatório"},"ok":"A redose intraoperatória é indicada quando a cirurgia ultrapassa duas meias-vidas do fármaco — cerca de 4 horas para a cefazolina — ou quando há perda sanguínea superior a 1.500 mL, que reduz a concentração plasmática por diluição e perda. Aqui os dois critérios estão presentes.","w":{"A":"Ignora a farmacocinética. Após 4 horas, a concentração tecidual pode cair abaixo da CIM, deixando a ferida desprotegida no momento em que ainda está aberta.","C":"Trocar para espectro largo não é redose e viola o princípio da profilaxia com espectro estreito, favorecendo resistência e C. difficile.","D":"Prolongar antibiótico no pós-operatório não reduz ISC e é explicitamente desaconselhado pela OMS. Profilaxia termina com a cirurgia."},"p":["Intervalos de redose: cefazolina 4 h; cefuroxima 4 h; ampicilina- sulbactam 2 h; clindamicina 6 h; metronidazol e vancomicina geralmente não precisam de redose em cirurgias de duração habitual."],"f":"ASHP Therapeutic Guidelines on Antimicrobial Prophylaxis in Surgery; OMS Global Guidelines (2018); Sabiston, 21ª ed., cap. 12."},{"v":"Vol. III (autorais)","c":3,"n":3,"g":"A","s":["Paciente no 2º dia de pós-operatório de gastrectomia apresenta febre de 38,2 °C, sem outros sinais localizatórios. Qual a causa mais provável nesse momento?"],"a":{"A":"Atelectasia e resposta inflamatória à agressão cirúrgica","B":"Infecção de sítio cirúrgico","C":"Deiscência de anastomose","D":"Infecção de cateter venoso central"},"ok":"A febre pós-operatória segue uma cronologia útil. Nas primeiras 48 horas, a causa mais frequente é a resposta inflamatória à própria agressão cirúrgica (liberação de IL-1 e IL-6), somada à atelectasia por dor, imobilidade e redução da capacidade residual funcional. É febre de baixo grau, autolimitada, que responde a fisioterapia respiratória e analgesia.","w":{"B":"A infecção de sítio cirúrgico tipicamente se manifesta entre o 4º e o 7º dia.","C":"A deiscência de anastomose tem pico entre o 5º e o 7º dia, e cursa com deterioração clínica, não com febre isolada em bom estado geral.","D":"A infecção de cateter é causa de febre tardia, geralmente após o 5º dia de permanência do dispositivo."},"p":["Cronologia da febre pós-operatória (regra dos \"W\"): Wind (pulmão) 1–2 dias; Water (urina) 3–5 dias; Wound (ferida) 4–7 dias; Walking (TEV) 5–7 dias; Wonder drugs (medicamentos) ou abscesso, após 7 dias. Febre nas primeiras 24 h em ferida operatória, porém, obriga a pensar em infecção necrotizante."],"f":"Sabiston, 21ª ed., cap. 12; UpToDate — Fever in the surgical patient."},{"v":"Vol. III (autorais)","c":3,"n":4,"g":"D","s":["Paciente no 8º dia de pós-operatório, em uso de ceftriaxona há 7 dias, evolui com diarreia aquosa volumosa, dor abdominal, febre e leucocitose de 22.000. Qual a conduta mais adequada?"],"a":{"A":"Loperamida para controle sintomático e observação","B":"Manter a ceftriaxona e associar metronidazol venoso","C":"Colonoscopia imediata para diagnóstico","D":"Suspender o antimicrobiano em curso, iniciar vancomicina oral (ou fidaxomicina) e pesquisar toxina de Clostridioides difficile"},"ok":"O quadro é de colite por C. difficile, complicação clássica da exposição a antimicrobianos de amplo espectro. A conduta tem três componentes: suspender o antibiótico precipitante sempre que possível, iniciar terapia dirigida — hoje a vancomicina oral ou a fidaxomicina são as primeiras linhas, tendo o metronidazol sido rebaixado a alternativa —, e confirmar com pesquisa de toxina ou PCR nas fezes.","w":{"A":"Antidiarreicos são contraindicados: reduzem a depuração da toxina e podem precipitar megacólon tóxico.","B":"Duplo erro: manter o precipitante perpetua a disbiose, e o metronidazol venoso não é a primeira escolha — a vancomicina oral atinge concentrações luminais muito superiores, e o metronidazol deixou de ser recomendado como primeira linha.","C":"A colonoscopia não é necessária para o diagnóstico, que é laboratorial, e traz risco de perfuração na colite grave."},"p":["Sinais de colite fulminante: hipotensão, íleo, megacólon tóxico, lactato elevado, leucócitos &gt; 25.000. Nesses casos, associa-se vancomicina oral em dose alta com metronidazol venoso, e considera-se colectomia total com ileostomia ou ileostomia derivativa com lavagem anterógrada."],"f":"IDSA/SHEA Clinical Practice Guidelines for Clostridioides difficile Infection; Sabiston, 21ª ed., cap. 12 e cap. 51."},{"v":"Vol. III (autorais)","c":3,"n":5,"g":"B","s":["Paciente no 7º dia de pós-operatório de apendicectomia por apendicite perfurada apresenta febre persistente, dor pélvica, tenesmo e diarreia. TC evidencia coleção pélvica de 6 cm com realce parietal. Qual a conduta mais adequada?"],"a":{"A":"Antibioticoterapia isolada por 14 dias","B":"Drenagem percutânea guiada por imagem (via transglútea ou transretal) associada a antibioticoterapia","C":"Laparotomia com lavagem cavitária e drenagem aberta","D":"Observação clínica, pois abscessos pélvicos habitualmente drenam espontaneamente pelo reto"},"ok":"Abscesso intra-abdominal único, bem delimitado e maior que 3 a 5 cm tem indicação de drenagem percutânea guiada por imagem, que resolve o quadro em 70 a 90% dos casos, associada a antibioticoterapia. Coleções pélvicas podem ser acessadas pelas vias transglútea, transretal ou transvaginal. A tríade de febre, tenesmo e diarreia é a apresentação clássica do abscesso pélvico, por irritação do reto adjacente.","w":{"A":"Antibiótico isolado é adequado para coleções pequenas (&lt; 3 cm) ou flegmão. Numa coleção de 6 cm, a taxa de falha é alta — antibiótico não penetra em pus.","C":"A laparotomia é reservada a coleções múltiplas, não acessáveis por punção, ou à falha da drenagem percutânea. É mais mórbida.","D":"Absoluto falso e perigoso. A drenagem espontânea é imprevisível e a espera pode evoluir para sepse."},"p":["Princípio universal: controle do foco é a base do tratamento da infecção cirúrgica. Antibiótico sem drenagem falha; drenagem sem antibiótico frequentemente basta."],"f":"WSES Guidelines for management of intra-abdominal infections; Sabiston, 21ª ed., cap. 12 e cap. 45."},{"v":"Vol. III (autorais)","c":3,"n":6,"g":"C","s":["Sobre o pacote de tratamento inicial da sepse de foco abdominal, assinale a alternativa correta:"],"a":{"A":"A antibioticoterapia pode aguardar o resultado das culturas, para evitar uso desnecessário de amplo espectro","B":"O controle do foco deve ser realizado apenas após 48 h de estabilização hemodinâmica","C":"Deve-se coletar hemoculturas, iniciar antimicrobiano de amplo espectro na primeira hora, iniciar ressuscitação com cristaloide e planejar o controle do foco o mais precocemente possível","D":"O lactato sérico não tem papel na avaliação inicial da sepse"},"ok":"O pacote da primeira hora da Surviving Sepsis Campaign inclui: dosar lactato, coletar hemoculturas antes do antibiótico, administrar antimicrobiano de amplo espectro precocemente, iniciar cristaloide (30 mL/kg em hipotensão ou lactato ≥ 4) e iniciar vasopressor se a hipotensão persistir. Na sepse abdominal, acrescenta-se o controle do foco, que deve ser feito o mais precocemente possível, idealmente nas primeiras 6 a 12 horas.","w":{"A":"Cada hora de atraso no antibiótico aumenta a mortalidade no choque séptico. Coleta-se cultura antes, mas não se espera o resultado.","B":"Inverte a lógica: o paciente não estabiliza enquanto o foco não é controlado. A ressuscitação ocorre em paralelo à intervenção, não antes dela.","D":"O lactato é marcador de hipoperfusão e tem valor prognóstico e de monitorização — sua queda (clearance) orienta a resposta terapêutica."},"p":["Interseção: o mesmo princípio \"não espere estabilizar para controlar o foco\" aparece na fasciíte necrotizante (Casos 5 e 10) e na colangite grave (Caso 8)."],"f":"Surviving Sepsis Campaign Guidelines; WSES Guidelines; Sabiston, 21ª ed., cap. 12 e cap. 15."},{"v":"Vol. III (autorais)","c":3,"n":7,"g":"A","s":["Segundo a definição do CDC, uma infecção que acomete a fáscia e a camada muscular, ocorrendo até 30 dias após o procedimento (ou até 90 dias, se houver implante), é classificada como:"],"a":{"A":"Infecção de sítio cirúrgico incisional profunda","B":"Infecção de sítio cirúrgico incisional superficial","C":"Infecção de órgão ou espaço","D":"Infecção relacionada a dispositivo"},"ok":"O CDC divide a ISC em três categorias por profundidade. A incisional profunda compromete a fáscia e a camada muscular, com prazo de até 30 dias ou até 90 dias na presença de implante protético.","w":{"B":"A incisional superficial envolve apenas pele e subcutâneo, com prazo de 30 dias.","C":"A infecção de órgão ou espaço acomete qualquer estrutura manipulada durante a cirurgia que não seja a incisão — abscesso intra- abdominal, empiema, mediastinite, peritonite pós-operatória.","D":"Infecção de dispositivo não é uma das categorias de ISC; é classificação de infecção relacionada à assistência à saúde de outra natureza."},"p":["Utilidade prática da classificação: define a conduta. Superficial abre-se e faz curativo; profunda exige desbridamento e avaliação da integridade da aponeurose; órgão-espaço exige drenagem percutânea ou cirúrgica."],"f":"CDC/NHSN Surveillance Definitions for Specific Types of Infections; Sabiston, 21ª ed., cap. 12."},{"v":"Vol. III (autorais)","c":3,"n":8,"g":"D","s":["Sobre a antibioticoprofilaxia em pacientes alérgicos à penicilina que serão submetidos a colecistectomia, é correto afirmar:"],"a":{"A":"Nenhuma profilaxia deve ser administrada, pelo risco de reação cruzada","B":"Deve-se sempre utilizar carbapenêmico, por ausência de reação cruzada","C":"A alergia relatada à penicilina contraindica absolutamente qualquer betalactâmico","D":"A maioria dos pacientes que relata alergia à penicilina tolera cefalosporinas de primeira geração; em alergia grave documentada, opta-se por clindamicina associada a aminoglicosídeo ou por vancomicina"},"ok":"Mais de 90% dos pacientes que se dizem alérgicos à penicilina não têm alergia mediada por IgE quando testados, e a reatividade cruzada com cefazolina é baixíssima (bem inferior a 1%), porque a cefazolina não compartilha a cadeia lateral R1 das penicilinas. Em alergia grave documentada (anafilaxia, Stevens-Johnson), usam-se alternativas como clindamicina com aminoglicosídeo, ou vancomicina.","w":{"A":"Deixar o paciente sem profilaxia aumenta a ISC sem qualquer benefício.","B":"Carbapenêmico é antimicrobiano de reserva terapêutica; usá-lo como profilaxia é desperdício e pressão seletiva. Além disso, há reatividade cruzada, ainda que baixa.","C":"Absoluto falso, e é exatamente o mito que a literatura vem desconstruindo. A \"deslabelagem\" da alergia à penicilina é hoje uma meta de programas de gerenciamento antimicrobiano."},"p":["Vancomicina como profilaxia isolada tem cobertura ruim para gram- negativos — em cirurgia abdominal, deve ser combinada."],"f":"ASHP Therapeutic Guidelines on Antimicrobial Prophylaxis; IDSA — Penicillin allergy evaluation; Sabiston, 21ª ed., cap. 12."},{"v":"Vol. III (autorais)","c":3,"n":9,"g":"B","s":["Sobre o uso de drenos em cirurgia abdominal, assinale a alternativa correta:"],"a":{"A":"Drenos profiláticos reduzem a incidência de deiscência de anastomose colorretal","B":"Drenos não previnem deiscência e, quando mantidos por tempo prolongado, podem aumentar infecção e retardar a recuperação","C":"Drenos abertos (tipo Penrose) são preferíveis aos fechados por permitirem melhor drenagem","D":"O dreno deve ser mantido até que o paciente elimine flatos"},"ok":"A evidência acumulada é consistente: o dreno não previne deiscência de anastomose e não a diagnostica de forma confiável (frequentemente obstrui ou fica mal posicionado). Quando prolongado, funciona como via de contaminação retrógrada, causa dor, limita a mobilização e prolonga a internação. Por isso o ERAS recomenda evitá-lo ou retirá-lo precocemente.","w":{"A":"Contraria as metanálises e o próprio ERAS.","C":"Os drenos fechados com sucção (tipo Blake, Jackson-Pratt) são preferidos justamente por menor risco de contaminação ascendente. O Penrose, aberto, é o de maior risco.","D":"Não há relação entre o dreno e o retorno da função intestinal. O critério de retirada é o débito e a finalidade específica pela qual foi colocado."},"p":["Situações em que o dreno ainda se justifica: pancreatectomia (detecção de fístula pancreática), hepatectomia com risco de fístula biliar, drenagem de abscesso, e coleções específicas — sempre com indicação explícita, nunca por rotina."],"f":"ERAS Society Guidelines; OMS Global Guidelines (2018); Sabiston, 21ª ed., cap. 12 e cap. 51."},{"v":"Vol. III (autorais)","c":3,"n":10,"g":"C","s":["Sobre a peritonite, assinale a alternativa correta:"],"a":{"A":"A peritonite bacteriana espontânea é tratada com laparotomia exploradora de urgência","B":"A peritonite secundária é sempre monomicrobiana","C":"A peritonite terciária caracteriza-se por infecção persistente ou recorrente após tratamento aparentemente adequado, frequentemente por germes de baixa virulência e fungos","D":"A peritonite primária é a forma mais comum em pacientes cirúrgicos"},"ok":"A peritonite terciária é a que persiste ou recorre após mais de 48 horas do tratamento aparentemente adequado de uma peritonite secundária. Ocorre em pacientes críticos, imunocomprometidos, e caracteriza-se por flora alterada — Enterococcus, Staphylococcus coagulase-negativo, Pseudomonas, Candida — com alta mortalidade e resposta ruim a novas intervenções.","w":{"A":"A peritonite bacteriana espontânea (primária) é tratada clinicamente, com antibiótico (cefalosporina de terceira geração) e albumina. Operar um cirrótico com PBE é erro grave, com mortalidade elevada.","B":"A peritonite secundária, por perfuração de víscera oca, é tipicamente polimicrobiana, com aeróbios e anaeróbios do trato digestivo.","D":"A peritonite mais comum em pacientes cirúrgicos é a secundária. A primária ocorre sobretudo em cirróticos com ascite e em pacientes em diálise peritoneal."},"p":["Diagnóstico de PBE: contagem de polimorfonucleares no líquido ascítico ≥ 250/mm³, geralmente monomicrobiana à cultura. Se for polimicrobiana ou houver múltiplos critérios de Runyon, suspeite de peritonite secundária — e aí sim, investigue perfuração."],"f":"Sabiston, 21ª ed., cap. 45 e cap. 53; WSES Guidelines; AASLD Practice Guidance on ascites and SBP."},{"v":"Vol. III (autorais)","c":4,"n":1,"g":"C","s":["Paciente de 48 anos, etilista, internado com desnutrição grave (IMC 15,8) após 3 semanas de ingesta mínima. Iniciada nutrição enteral em cota plena. No 3º dia evolui com confusão mental, arritmia, fraqueza muscular e insuficiência respiratória. Laboratório: fósforo 1,1 mg/dL, potássio 2,8 mEq/L, magnésio 1,2 mg/dL. Qual o diagnóstico e como poderia ter sido evitado?"],"a":{"A":"Encefalopatia hepática; deveria ter sido iniciada lactulose profilática","B":"Sepse de foco não identificado; deveria ter sido feita antibioticoprofilaxia","C":"Síndrome de realimentação; deveria ter sido iniciada com 25% da meta calórica, com tiamina antes das calorias e monitorização diária de eletrólitos","D":"Insuficiência adrenal; deveria ter sido administrada hidrocortisona"},"ok":"A síndrome de realimentação ocorre quando a oferta abrupta de carboidrato em paciente cronicamente depletado dispara a secreção de insulina, que desloca fósforo, potássio e magnésio para o intracelular e retém sódio e água. O resultado é hipofosfatemia grave (com falência da produção de ATP), arritmias, fraqueza muscular, insuficiência respiratória e confusão. A prevenção é começar com 10 a 25% da meta calórica, repor tiamina antes das calorias (para evitar encefalopatia de Wernicke), corrigir eletrólitos previamente e progredir lentamente em 5 a 7 dias.","w":{"A":"A encefalopatia hepática não explicaria a hipofosfatemia, a hipocalemia e a hipomagnesemia simultâneas.","B":"Não há febre, leucocitose nem foco descrito, e a sepse não produz essa tríade eletrolítica característica.","D":"A insuficiência adrenal cursaria com hipotensão, hiponatremia e hipercalemia — o oposto do quadro."},"p":["Fatores de risco para realimentação: IMC &lt; 16, perda &gt; 15% em 3–6 meses, ingesta mínima por mais de 10 dias, eletrólitos baixos antes de iniciar, etilismo, anorexia nervosa e cirurgia bariátrica."],"f":"ASPEN Consensus Recommendations for Refeeding Syndrome; NICE Guideline CG32; Sabiston, 21ª ed., cap. 6."},{"v":"Vol. III (autorais)","c":4,"n":2,"g":"B","s":["Paciente com câncer de orofaringe em radioterapia necessitará de suporte enteral por período estimado de 6 meses. Qual a via de acesso mais adequada?"],"a":{"A":"Sonda nasogástrica de fino calibre","B":"Gastrostomia (endoscópica percutânea ou cirúrgica)","C":"Nutrição parenteral central","D":"Sonda nasoenteral pós-pilórica trocada a cada 30 dias"},"ok":"A regra do tempo é simples: acesso enteral necessário por menos de 4 a 6 semanas justifica sonda nasoentérica; acima disso, indica-se ostomia — gastrostomia ou jejunostomia. A gastrostomia é mais confortável, tem menor taxa de deslocamento e de sinusite, permite bolus e melhora a qualidade de vida em uso prolongado.","w":{"A":"A sonda nasogástrica por 6 meses causa erosão de asa nasal, sinusite, otite, desconforto e deslocamentos frequentes, além de estigma social relevante.","C":"A nutrição parenteral em paciente com trato digestivo funcionante é erro conceitual: mais infecção, mais custo, atrofia de mucosa.","D":"Trocar sonda nasoenteral repetidamente por 6 meses reproduz os problemas da alternativa A com desconforto adicional."},"p":["Escolha entre gastrostomia e jejunostomia: prefira jejunostomia quando há risco alto de aspiração, gastroparesia, obstrução gástrica ou quando o estômago será usado como conduto (esofagectomia). No câncer de esôfago, evite gastrostomia pelo mesmo motivo."],"f":"ESPEN Guideline on Clinical Nutrition in Surgery; ASPEN Guidelines; Sabiston, 21ª ed., cap. 6."},{"v":"Vol. III (autorais)","c":4,"n":3,"g":"D","s":["Paciente no 6º dia de pós-operatório de enterectomia evolui com fístula enterocutânea de alto débito (900 mL/24 h), sem sinais de sepse. Qual a estratégia inicial mais adequada?"],"a":{"A":"Reoperação imediata para fechamento da fístula","B":"Manter dieta oral livre para estimular o trânsito","C":"Iniciar somatostatina isoladamente, sem suporte nutricional","D":"Estabilizar hidroeletrólitos, proteger a pele, controlar o débito, iniciar suporte nutricional (parenteral ou enteral distal) e investigar a anatomia da fístula"},"ok":"O manejo da fístula enterocutânea segue a sequência mnemônica SNAP: Sepsis control (drenar coleções, antibiótico se houver infecção), Nutrition (suporte adequado, parenteral se alto débito ou sem acesso distal), Anatomy (fistulografia ou TC com contraste, para definir trajeto, origem e obstrução distal) e Procedure (cirurgia definitiva, quando indicada, após 6 semanas a 3 meses). A correção de água e eletrólitos e a proteção da pele periostomal são imediatas.","w":{"A":"Reoperar precocemente, em cavidade hostil e inflamada, tem altíssima taxa de falha e de nova fístula. Espera-se a maturação, salvo se houver sepse não controlada.","B":"Dieta oral livre em fístula de alto débito aumenta a perda e agrava o desequilíbrio hidroeletrolítico.","C":"A somatostatina/octreotide reduz o débito e pode acelerar o fechamento, mas isolada, sem suporte nutricional, é insuficiente — a desnutrição é a principal causa de morte nesses pacientes."},"p":["Fatores que impedem o fechamento espontâneo (mnemônico FRIEND): corpo estranho (Foreign body), Radiação, Inflamação/doença inflamatória intestinal, Epitelização do trajeto, Neoplasia, obstrução Distal."],"f":"Sabiston, 21ª ed., cap. 50; ESPEN Guideline; literatura sobre manejo SNAP de fístulas enterocutâneas."},{"v":"Vol. III (autorais)","c":4,"n":4,"g":"A","s":["Paciente crítico de 70 kg, em ventilação mecânica após laparotomia por peritonite. Qual a oferta calórica e proteica mais adequada?"],"a":{"A":"Cerca de 25 kcal/kg/dia e 1,5 a 2,0 g/kg/dia de proteína","B":"Cerca de 40 kcal/kg/dia e 0,8 g/kg/dia de proteína","C":"Cerca de 15 kcal/kg/dia e 3,0 g/kg/dia de proteína","D":"Cerca de 25 kcal/kg/dia e 0,6 g/kg/dia de proteína"},"ok":"As metas atuais para o paciente cirúrgico crítico são 25 a 30 kcal/kg/dia de energia total e 1,5 a 2,0 g/kg/dia de proteína. A oferta proteica generosa busca atenuar a proteólise muscular do hipercatabolismo; a oferta calórica moderada evita hiperalimentação, que causa hiperglicemia, esteatose hepática e aumento da produção de CO₂ com dificuldade de desmame ventilatório.","w":{"B":"Quarenta quilocalorias por quilo é hiperalimentação, e 0,8 g/kg/dia de proteína é a recomendação para o adulto saudável, insuficiente para o catabolismo do crítico.","C":"A oferta calórica está subestimada e a proteica, exagerada — 3 g/kg/dia excede a capacidade de utilização e sobrecarrega rim e fígado.","D":"A energia está adequada, mas a proteína é claramente insuficiente."},"p":["Na fase aguda inicial (primeiros 2–3 dias), aceita-se hipoalimentação permissiva (cerca de 70% da meta) para respeitar a produção endógena de energia; a meta plena é atingida progressivamente. No paciente com lesão renal aguda em terapia dialítica, a oferta","proteica pode chegar a 2,5 g/kg/dia, pela perda no dialisato."],"f":"ESPEN Guideline on Clinical Nutrition in the ICU; ASPEN/SCCM Guidelines; Sabiston, 21ª ed., cap. 6."},{"v":"Vol. III (autorais)","c":4,"n":5,"g":"B","s":["Paciente em nutrição parenteral total há 3 semanas apresenta elevação de transaminases, fosfatase alcalina e bilirrubinas. Qual o mecanismo mais provável e a conduta inicial?"],"a":{"A":"Hepatite viral; solicitar sorologias e suspender a NPT definitivamente","B":"Disfunção hepática associada à NPT (esteatose e colestase), por excesso calórico e ausência de estímulo enteral; reduzir a oferta calórica e iniciar nutrição enteral trófica","C":"Colangite ascendente; iniciar CPRE de urgência","D":"Síndrome de Budd-Chiari; solicitar Doppler de veias hepáticas"},"ok":"A disfunção hepática associada à NPT aparece tipicamente após 2 a 4 semanas. Em adultos predomina a esteatose (por excesso de glicose e de calorias totais, que estimula lipogênese); em crianças e uso prolongado, a colestase. A ausência de estímulo enteral suprime a liberação de colecistocinina, agravando a estase biliar. A conduta é reduzir a oferta calórica total, revisar a proporção glicose-lipídio, evitar hiperalimentação e, sobretudo, iniciar alimentação enteral mesmo que trófica, que restaura o estímulo hormonal e a trofia da mucosa.","w":{"A":"Não há dados epidemiológicos ou clínicos de hepatite viral, e suspender a NPT definitivamente em paciente que dela depende não é conduta.","C":"Colangite exigiria a tríade de Charcot e dilatação de vias biliares.","D":"Budd-Chiari cursaria com ascite, hepatomegalia dolorosa e alteração ao Doppler, quadro não descrito."},"p":["Interseção: a NPT prolongada também causa lama biliar e litíase por falta de contração vesicular — conteúdo que liga os Casos 4 e 8."],"f":"ASPEN Clinical Guidelines — Parenteral Nutrition; ESPEN Guideline; Sabiston, 21ª ed., cap. 6."},{"v":"Vol. III (autorais)","c":4,"n":6,"g":"C","s":["Sobre a nutrição no grande queimado, assinale a alternativa correta:"],"a":{"A":"A oferta calórica deve ser reduzida para evitar hiperglicemia","B":"A via parenteral é preferencial, pelo íleo prolongado","C":"A nutrição enteral deve ser iniciada precocemente, com oferta proteica elevada (até 2,0–2,5 g/kg/dia), e o hipermetabolismo pode persistir por meses","D":"A imunonutrição está formalmente contraindicada em queimados"},"ok":"O grande queimado é o paradigma do hipermetabolismo: gasto energético que pode dobrar, catabolismo proteico intenso e perdas cutâneas maciças de proteína. A nutrição enteral precoce (nas primeiras 24 horas) reduz translocação bacteriana, preserva a mucosa intestinal e atenua a resposta hipermetabólica. A oferta proteica é elevada, de 1,5 a 2,5 g/kg/dia, e o estado hipermetabólico persiste por meses após a cicatrização.","w":{"A":"Reduzir calorias em paciente hipermetabólico acelera a perda de massa magra e compromete a cicatrização. A hiperglicemia se maneja com insulina, não restringindo energia.","B":"A via preferencial é a enteral. O íleo, quando presente, é transitório, e alimenta-se por sonda pós-pilórica se necessário.","D":"Não há contraindicação formal; glutamina e outros imunonutrientes já foram estudados em queimados, com resultados variáveis."},"p":["Adjuvantes farmacológicos no grande queimado: propranolol (atenua o hipermetabolismo adrenérgico), oxandrolona (anabolizante que acelera a recuperação de massa magra) e controle glicêmico rigoroso."],"f":"Sabiston, 21ª ed., cap. 6 e cap. 19; ESPEN Guideline on clinical nutrition in burns; Herndon DN et al., NEJM."},{"v":"Vol. III (autorais)","c":4,"n":7,"g":"D","s":["Sobre os critérios GLIM (Global Leadership Initiative on Malnutrition) para diagnóstico de desnutrição, é correto afirmar:"],"a":{"A":"Baseiam-se exclusivamente na albumina sérica","B":"Substituem a necessidade de triagem nutricional prévia","C":"Consideram apenas critérios etiológicos, sem critérios fenotípicos","D":"Exigem pelo menos um critério fenotípico e um etiológico, após triagem positiva"},"ok":"Os critérios GLIM padronizaram o diagnóstico de desnutrição em duas etapas. Primeiro, triagem com ferramenta validada (NRS-2002, MUST, MNA). Se positiva, aplica-se o diagnóstico, que exige pelo menos um critério fenotípico — perda de peso não intencional, IMC baixo ou redução de massa muscular — e pelo menos um critério etiológico — redução da ingestão ou absorção, ou inflamação/doença aguda ou crônica.","w":{"A":"A albumina não integra os critérios GLIM, precisamente porque reflete inflamação e não estado nutricional. Foi uma das mudanças conceituais mais importantes do consenso.","B":"A triagem c
