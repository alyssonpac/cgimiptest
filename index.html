o locorregional e sem metástase, é classificado como:"],"a":{"A":"T2 N1 M0","B":"T3 N1 M0","C":"T3 N1a M0","D":"T4a N1 M0"},"ok":"Pelo AJCC 8ª edição, a invasão da subserosa (tecido conjuntivo subseroso, sem perfurar a serosa) corresponde a T3. O acometimento de 1 a 2 linfonodos regionais é N1. Ausência de metástase é M0. Portanto, T3 N1 M0.","w":{"A":"T2 é a invasão da muscular própria — um plano mais superficial que a subserosa.","C":"O sufixo \"N1a\" não existe na classificação do câncer gástrico. Ele pertence ao TNM do câncer colorretal, o que caracteriza esta alternativa como distrator de nomenclatura.","D":"T4a é a perfuração da serosa (peritônio visceral) — mais avançado do que o descrito. T4b seria a invasão de estruturas adjacentes."},"p":["T do câncer gástrico: T1a mucosa; T1b submucosa; T2 muscular própria; T3 subserosa; T4a perfura a serosa; T4b invade estruturas adjacentes. N do câncer gástrico: N1 1–2 linfonodos; N2 3–6; N3a 7–15; N3b ≥ 16."],"f":"AJCC Cancer Staging Manual, 8ª ed.; Sabiston, 21ª ed., cap. 49."},{"v":"Vol. II","c":12,"n":19,"g":"B","s":["É admitido na enfermaria de Cirurgia Geral um paciente com câncer gástrico localizado, tipo difuso pela classificação de Lauren, em programação de abordagem cirúrgica. Considerando esse subtipo histológico, a característica mais frequentemente associada é:"],"a":{"A":"Presença de metaplasia intestinal associada a H. pylori","B":"Crescimento infiltrativo com alto potencial de disseminação peritoneal","C":"Forte associação com refluxo biliar e pólipos hiperplásicos","D":"Crescimento exofítico e associação com p53 mutado"},"ok":"O tipo difuso caracteriza-se por células pouco coesas, decorrentes da perda de E-caderina (CDH1), que infiltram difusamente a parede sem formar massa definida — no extremo, produzindo a linite plástica. Essa perda de adesão celular explica a alta propensão à disseminação peritoneal e ao acometimento ovariano (tumor de Krukenberg).","w":{"A":"Metaplasia intestinal e H. pylori pertencem à cascata do tipo intestinal de Lauren.","C":"Refluxo biliar e pólipos hiperplásicos associam-se ao câncer do coto gástrico e ao tipo intestinal, não ao difuso.","D":"Crescimento exofítico (vegetante, bem delimitado) é característico do tipo intestinal. A mutação de p53 ocorre em ambos, mas o padrão descrito na alternativa é do intestinal."},"p":["Consequência prática: no tipo difuso, exige-se margem cirúrgica proximal maior (5 a 8 cm, contra 3 a 5 cm no intestinal), pela infiltração submucosa extensa e frequentemente além do que se vê macroscopicamente."],"f":"Sabiston, 21ª ed., cap. 49; Lauren P — classificação histológica; NCCN Guidelines."},{"v":"Vol. II","c":12,"n":20,"g":"C","s":["Paciente de 68 anos, com adenocarcinoma de antro gástrico e vômitos incoercíveis há 21 dias, submetido a gastrectomia parcial e mantido com SNE no pós-operatório. Em relação a esse quadro, é correto afirmar que:"],"a":{"A":"O paciente provavelmente apresenta acidose metabólica, hipocloremia e hipercalemia, devendo ser tratado com SF 0,9% e solução polarizante","B":"A correção do distúrbio é feita com pequenas doses de bicarbonato de sódio para corrigir a acidose e cloreto de potássio para corrigir a hipocalemia e a hipocloremia","C":"A correção do distúrbio é feita com solução fisiológica 0,9% e cloreto de potássio 19,1%","D":"O paciente provavelmente apresenta alcalose metabólica, hipocloremia e hipercalemia, devendo ser tratado com SF 0,9% e gluconato de cálcio 10%"},"ok":"Vômitos prolongados por obstrução pilórica produzem o distúrbio clássico: alcalose metabólica hipoclorêmica e hipocalêmica, com aciduria paradoxal. A perda de HCl gera alcalose e hipocloremia; a hipovolemia ativa a aldosterona, que retém sódio às custas de excretar K⁺ e H⁺, perpetuando a alcalose e a hipocalemia. A correção é com SF 0,9% (repõe volume e cloreto simultaneamente) associado a cloreto de potássio. É indispensável repor o potássio: sem ele, a alcalose não se corrige.","w":{"A":"Inverte o distúrbio ácido-base (é alcalose, não acidose) e o potássio (é hipocalemia, não hipercalemia).","B":"Prescrever bicarbonato em um paciente alcalótico agravaria gravemente o quadro. O erro é grosseiro e proposital.","D":"Acerta a alcalose e a hipocloremia, mas erra o potássio (é hipocalemia) e a reposição — gluconato de cálcio não tem papel aqui."},"p":["Mecanismo da aciduria paradoxal: apesar da alcalose sistêmica, o rim excreta urina ácida, porque a prioridade fisiológica é preservar volume (reabsorver Na⁺) e potássio, trocando-os por H⁺."],"f":"Sabiston, 21ª ed., cap. 4 e cap. 49; Guyton & Hall — distúrbios ácido-básicos."},{"v":"Vol. II","c":12,"n":21,"g":"B","s":["Mulher de 42 anos, submetida a derivação gástrica por videolaparoscopia há 8 meses, com perda de 40 kg. Apresenta episódios recorrentes de dor epigástrica tipo cólica, com irradiação ocasional para a região retroesternal, não relacionada à alimentação, com melhora espontânea. Há cerca de 8 horas iniciou novo episódio álgico. Exames laboratoriais normais. TC de abdome: ausência de pneumoperitônio ou coleções líquidas; notada volumosa distensão do estômago excluso, duodeno e jejuno proximal. A hipótese diagnóstica mais provável é:"],"a":{"A":"Síndrome de dumping","B":"Hérnia interna pelo espaço de Petersen","C":"Úlcera de boca anastomótica","D":"Síndrome da alça eferente"},"ok":"A hérnia interna é complicação temida do bypass gástrico em Y de Roux, favorecida pela perda ponderal importante (que reduz a gordura mesentérica e alarga os defeitos). O espaço de Petersen situa-se entre a alça alimentar e o mesocólon transverso. A herniação da alça biliopancreática por esse defeito causa obstrução do segmento excluso, o que explica exatamente o achado tomográfico: distensão do estômago excluso, duodeno e jejuno proximal, com dor em cólica intermitente e laboratório normal entre as crises.","w":{"A":"O dumping é sintomático e claramente relacionado à alimentação (precoce, 15–30 min; tardio, 1–3 h). O enunciado especifica que a dor não tem relação com a alimentação, e o dumping não produz distensão do estômago excluso.","C":"A úlcera de boca anastomótica (marginal) causa dor epigástrica em queimação, disfagia e às vezes sangramento — mas não gera obstrução do segmento excluso nem esse padrão tomográfico. O diagnóstico é endoscópico.","D":"A síndrome da alça eferente é complicação de reconstrução a Billroth II, não de bypass em Y de Roux."},"p":["Sinal de alerta absoluto: dor abdominal em paciente pós-bypass gástrico com perda ponderal importante é hérnia interna até prova em contrário. A TC pode ser normal entre as crises, e o \"sinal do redemoinho\" (whirl sign) mesentérico é sugestivo. A laparoscopia","diagnóstica tem limiar baixo, porque a evolução para volvo e necrose é rápida."],"f":"Sabiston, 21ª ed., cap. 47 (Obesidade mórbida); ASMBS Guidelines — internal hernia after Roux-en-Y gastric bypass."},{"v":"Vol. II","c":12,"n":22,"g":"D","s":["O exame de imagem mais adequado para estadiamento locorregional do câncer de esôfago:"],"a":{"A":"Tomografia computadorizada de tórax","B":"Ultrassonografia abdominal","C":"Endoscopia digestiva alta","D":"Ultrassonografia endoscópica"},"ok":"Repetição literal do conceito da questão 1 do Caso 11: a ecoendoscopia é o método mais acurado para o T e o N, por resolver as camadas da parede esofágica e permitir punção de linfonodos.","w":{"A":"A TC de tórax avalia invasão de estruturas adjacentes e metástases pulmonares — é do estadiamento à distância, não locorregional preciso.","B":"A ultrassonografia abdominal transcutânea não avalia o esôfago e tem papel limitado até no rastreamento de metástase hepática.","C":"A endoscopia visualiza a mucosa, localiza a lesão e permite a biópsia, mas não avalia profundidade de invasão nem linfonodos."},"p":["Terceira aparição do mesmo conceito no banco. É o item de melhor custo-benefício de todo o bloco de esôfago."],"f":"Sabiston, 21ª ed., cap. 42; NCCN Guidelines — Esophageal and EGJ Cancers."},{"v":"Vol. II","c":13,"n":1,"g":"C","s":["O adenocarcinoma pancreático é um dos tumores com mais alta mortalidade do trato digestivo. Sobre essa patologia, assinale a alternativa correta:"],"a":{"A":"Nos pacientes submetidos a ressecção com margens negativas e linfonodos não comprometidos, a sobrevida em 5 anos é de aproximadamente 80%","B":"A apresentação clínica mais comum é icterícia em homens na quarta década de vida, com massa em cabeça de pâncreas","C":"A duodenopancreatectomia é a cirurgia indicada para tumores em cabeça de pâncreas, podendo ser realizada a clássica ou com preservação pilórica","D":"O tipo de reconstrução da pancreatojejunostomia pode ser ducto-mucosa ou telescopagem, sendo esta última com vantagens significativas quanto a fístula pancreática, devendo ser rotineiramente utilizada"},"ok":"A duodenopancreatectomia (operação de Whipple) é a cirurgia para tumores da cabeça pancreática e da região periampular. Existem duas variantes consagradas: a clássica, com antrectomia, e a com preservação do piloro (Traverso-Longmire). Ensaios randomizados e metanálises não mostram diferença em sobrevida oncológica ou morbidade global entre elas — a escolha é técnica e depende da relação do tumor com o antro e o piloro.","w":{"A":"Superestima grosseiramente. Mesmo com ressecção R0 e linfonodos negativos, a sobrevida em 5 anos gira em torno de 25 a 30%. Considerando todos os pacientes, a sobrevida global em 5 anos é de aproximadamente 10%.","B":"Erra idade e sexo. O adenocarcinoma pancreático é doença da sexta a oitava décadas, com discreto predomínio masculino. Na quarta década é raro. A icterícia indolor com massa cefálica, essa sim, está correta.","D":"Inverte a evidência. Não há superioridade demonstrada da telescopagem (invaginação) sobre a anastomose ducto-mucosa na prevenção de fístula pancreática — os ensaios são conflitantes. A palavra \"rotineiramente\" é o sinal de alerta."},"p":["Fístula pancreática pós-operatória é a principal complicação do Whipple. Fatores de risco: ducto pancreático fino (< 3 mm) e parênquima \"mole\" (não fibrótico) — paradoxalmente, o pâncreas normal é o mais perigoso."],"f":"Sabiston, 21ª ed., cap. 55; NCCN Guidelines — Pancreatic Adenocarcinoma; ISGPS definitions of postoperative pancreatic fistula."},{"v":"Vol. II","c":13,"n":2,"g":"A","s":["Homem de 63 anos, com icterícia progressiva há 2 meses, perda ponderal de 12 kg e anorexia. Nega febre. Sem leucocitose, BT 16. USG revelou dilatação de vias biliares e outros achados. Sabendo que o CA 19-9 é de 1500 e considerando as imagens, qual a melhor conduta?","Tomografia apresentada na questão"],"a":{"A":"Considerar quimioterapia paliativa de imediato","B":"Iniciar protocolo de neoadjuvância","C":"Gastroduodenopancreatectomia upfront","D":"Drenar via biliar seguido de QT paliativa"},"ok":"As imagens demonstram lesão hepática compatível com metástase, associada a CA 19-9 estratosférico (1500 U/mL, contra um limite normal de 37). O paciente é, portanto, estádio IV. Nessa situação, não há benefício de ressecção — nem de neoadjuvância com intenção de conversão — e a conduta é quimioterapia sistêmica paliativa, associada a drenagem biliar para alívio da icterícia e do prurido.","w":{"B":"A neoadjuvância se destina a tumores borderline ressecáveis ou localmente avançados sem metástase, com intenção de conversão para ressecabilidade. Doença metastática não é candidata.","C":"Whipple em doença metastática seria uma operação de grande morbidade sem qualquer ganho de sobrevida — está formalmente contraindicada.","D":"A drenagem biliar é medida paliativa correta e frequentemente necessária, mas a alternativa a coloca como conduta principal antes da quimioterapia. A drenagem é adjuvante ao tratamento sistêmico, não uma estratégia oncológica em si. Como as duas alternativas se aproximam, o discriminador é a ênfase da alternativa A na quimioterapia de imediato como estratégia oncológica."},"p":["CA 19-9 muito elevado (> 500–1000 U/mL) correlaciona-se com doença avançada e frequentemente irressecável. Cuidado: ele se eleva também em colestase benigna, e é falsamente normal em indivíduos Lewis-negativos (5–10% da população)."],"f":"Sabiston, 21ª ed., cap. 55; NCCN Guidelines — Pancreatic Adenocarcinoma."},{"v":"Vol. II","c":13,"n":3,"g":"D","s":["Mulher jovem, 34 anos, oligossintomática. Relata aumento de volume abdominal no epigástrio, com leve dor. Traz a TC apresentada. Diagnóstico provável?"],"a":{"A":"Tumor esplênico","B":"Pseudocisto de pâncreas","C":"Tumor renal esquerdo","D":"Tumor de Frantz"},"ok":"O tumor de Frantz (neoplasia sólida pseudopapilar do pâncreas) tem um perfil demográfico tão característico que praticamente define o diagnóstico: mulher jovem, na segunda a terceira década, oligossintomática, com massa volumosa de aspecto sólido-cístico e frequentemente com hemorragia interna e cápsula. É de baixo grau de malignidade, e a ressecção completa é curativa em mais de 95% dos casos.","w":{"A":"Tumor esplênico primário é raríssimo, e o baço se localiza mais lateral e posteriormente, não em topografia epigástrica central.","B":"O pseudocisto exigiria antecedente de pancreatite aguda ou trauma pancreático, ausente no enunciado. Além disso, o pseudocisto é uma coleção puramente líquida, sem componente sólido.","C":"Tumor renal esquerdo teria localização retroperitoneal lateral, com relação evidente com o rim, e apresentação clínica distinta (hematúria, dor em flanco)."},"p":["Perfil dos tumores císticos e sólido-císticos por sexo e idade: Frantz = mulher jovem, sólido-cístico, cauda ou corpo. Neoplasia mucinosa","cística = mulher de meia-idade, corpo/cauda, sem comunicação ductal. Serosa = mulher idosa (\"grandmother tumor\"), microcística em favo de mel. IPMN = homem ou mulher, idoso, comunica com o ducto."],"f":"Sabiston, 21ª ed., cap. 55; WHO Classification of Tumours of the Digestive System."},{"v":"Vol. II","c":13,"n":4,"g":"D","s":["Paciente de 70 anos, sabidamente portador de cálculo vesicular de 1,5 cm, abre quadro de icterícia sem febre e sem dor. Ao exame, palpa-se em hipocôndrio direito, 5 cm abaixo do rebordo costal, tumoração uniforme de característica cística. Laboratório: BT 11 (BD 10), TGO 120, TGP 180, GGT 850."],"a":{"A":"A principal hipótese é colecistite aguda e a conduta deve ser cirurgia","B":"A principal hipótese é coledocolitíase e devemos realizar CPRE","C":"A drenagem de via biliar é urgente para evitar colangite","D":"Considerar a hipótese de tumor periampular e solicitar tomografia"},"ok":"O achado central é o sinal de Courvoisier-Terrier: vesícula palpável, distendida e indolor, em paciente ictérico. Ele indica obstrução biliar crônica e progressiva — típica de neoplasia periampular — e não de coledocolitíase, em que a vesícula costuma ser fibrosada e não distensível pelos episódios inflamatórios prévios. Somados a icterícia indolor, sem febre, e padrão colestático marcado (BD 10, GGT 850), o diagnóstico presumido é tumor periampular, e o exame de escolha é a tomografia com protocolo pancreático para diagnóstico e estadiamento.","w":{"A":"Colecistite aguda cursa com dor e febre, e não com icterícia isolada nem com vesícula indolor.","B":"A coledocolitíase produziria dor em cólica, frequentemente com flutuação da icterícia, e a vesícula palpável indolor argumenta contra. Além disso, indicar CPRE antes de caracterizar a lesão pode comprometer o estadiamento e adicionar risco.","C":"Não há colangite (sem febre, sem leucocitose descrita, sem alteração do sensório). A drenagem de urgência não se justifica; a prioridade é o diagnóstico oncológico."},"p":["Tumores periampulares (quatro origens, prognósticos diferentes): cabeça de pâncreas (o mais comum e de pior prognóstico), ampola de Vater (melhor prognóstico), colédoco distal e duodeno. Todos são tratados pela mesma operação: a duodenopancreatectomia."],"f":"Sabiston, 21ª ed., cap. 55; NCCN Guidelines — Pancreatic Adenocarcinoma."},{"v":"Vol. II","c":13,"n":5,"g":"C","s":["Portadora de adenocarcinoma pancreático cefálico estava com proposta inicial para gastroduodenopancreatectomia, mas apresentava limitações do autocuidado, com restrição de mais de 50% ao leito. Segundo a escala de performance status ECOG, qual seria seu grau?"],"a":{"A":"0","B":"2","C":"3","D":"4"},"ok":"A escala ECOG (também chamada Zubrod ou ECOG-WHO) define o grau 3 como: capaz de autocuidado apenas limitado, confinado ao leito ou à cadeira por mais de 50% das horas de vigília. O enunciado descreve exatamente essa condição.","w":{"A":"ECOG 0 é o paciente plenamente ativo, capaz de manter todas as atividades sem restrição.","B":"ECOG 2 é o paciente ambulante e capaz de todo autocuidado, mas incapaz de trabalhar, permanecendo fora do leito mais de 50% do tempo — é o limiar oposto ao descrito.","D":"ECOG 4 é o paciente completamente incapaz, confinado ao leito ou à cadeira 100% do tempo, sem qualquer autocuidado."},"p":["ECOG: 0 plenamente ativo; 1 restrito a atividade física extenuante, mas ambulatorial e capaz de trabalho leve; 2 ambulatorial, capaz de autocuidado, fora do leito > 50% do tempo, incapaz de trabalhar; 3 autocuidado limitado, no leito > 50% do tempo; 4 totalmente incapaz; 5 morte. Relevância prática: pacientes com ECOG ≥ 3 geralmente não são candidatos a cirurgia de grande porte nem a quimioterapia intensiva — recebem cuidados de suporte e paliação."],"f":"Oken MM et al. — Toxicity and response criteria of the Eastern Cooperative Oncology Group; NCCN Guidelines."},{"v":"Vol. II","c":13,"n":6,"g":"C","s":["Qual o tipo histológico mais comum no câncer de pâncreas?"],"a":{"A":"Pancreatoblastoma","B":"Linfoma","C":"Adenocarcinoma ductal","D":"IPMN"},"ok":"O adenocarcinoma ductal responde por 85 a 90% de todas as neoplasias malignas do pâncreas. Origina-se do epitélio ductal, tem intensa reação desmoplásica (o que dificulta a penetração de quimioterápicos e explica parte de sua resistência) e localiza-se em cerca de 60 a 70% dos casos na cabeça.","w":{"A":"O pancreatoblastoma é raro e essencialmente pediátrico, com prognóstico bem melhor.","B":"O linfoma pancreático primário é raro e, quando presente, tem tratamento quimioterápico, não cirúrgico — é importante diferenciá-lo antes de indicar um Whipple.","D":"O IPMN (neoplasia mucinosa papilar intraductal) é uma lesão cística pré-maligna, não o tipo histológico mais comum de câncer pancreático — embora possa evoluir para adenocarcinoma invasivo."},"p":["Os tumores neuroendócrinos pancreáticos representam cerca de 3 a 5% e têm comportamento e prognóstico completamente distintos, com sobrevida muito superior."],"f":"Sabiston, 21ª ed., cap. 55; WHO Classification of Tumours."},{"v":"Vol. II","c":13,"n":7,"g":"B","s":["As neoplasias císticas do pâncreas têm prevalência variável, de 2 a 15%. Sobre essas neoplasias, é incorreto afirmar que:"],"a":{"A":"São divididas em não neoplásicas, como o pseudocisto, e neoplásicas","B":"A imagem em favo de mel (honeycomb) é característica das neoplasias mucinosas císticas","C":"As neoplasias serosas císticas são em sua maioria benignas, enquanto as mucinosas têm potencial de malignização maior","D":"O tumor de Frantz é um tumor sólido pseudopapilar do pâncreas, de comportamento benigno, mais comum em mulheres jovens"},"ok":"Enunciado negativo. A imagem em favo de mel (honeycomb), ou padrão microcístico com múltiplos cistos pequenos e eventual cicatriz central calcificada, é característica da neoplasia cística serosa — não da mucinosa. A mucinosa é macrocística, tipicamente unilocular ou com poucos septos, e pode ter calcificação periférica em casca de ovo.","w":{"A":"Verdadeira e é a divisão fundamental: não neoplásicas (pseudocisto, cisto de retenção) e neoplásicas (serosa, mucinosa, IPMN, sólido- pseudopapilar).","C":"Verdadeira. A serosa é quase sempre benigna (cistoadenocarcinoma seroso é excepcional), enquanto a mucinosa tem potencial de malignização significativo e é indicação de ressecção.","D":"Verdadeira, com a ressalva de que o Frantz é de baixo grau de malignidade, e não estritamente benigno — mas a ressecção completa é curativa na grande maioria."},"p":["Diferencial pelo líquido aspirado: CEA alto (> 192 ng/mL) = lesão mucinosa (mucinosa cística ou IPMN). CEA baixo com amilase baixa = serosa. Amilase alta = comunicação ductal (pseudocisto ou IPMN)."],"f":"Sabiston, 21ª ed., cap. 55; Fukuoka Consensus Guidelines (International Consensus Guidelines for IPMN and MCN); European evidence-based guidelines on pancreatic cystic neoplasms."},{"v":"Vol. II","c":13,"n":8,"g":"C","s":["Sobre o adenocarcinoma ductal do pâncreas, assinale a alternativa correta:"],"a":{"A":"Quando na cabeça do pâncreas, os principais sintomas são perda ponderal e icterícia dolorosa","B":"Nas lesões ressecáveis, a biópsia pré-operatória é mandatória para a confirmação diagnóstica","C":"São critérios de irressecabilidade e/ou inoperabilidade a recusa do paciente, a invasão circunferencial da artéria mesentérica superior e a presença de metástases à distância","D":"As lesões de corpo e cauda têm melhor prognóstico que as da cabeça pancreática"},"ok":"A alternativa reúne corretamente três categorias distintas de contraindicação: inoperabilidade por decisão do paciente (recusa informada), irressecabilidade técnica (envolvimento circunferencial — mais de 180 graus — da artéria mesentérica superior ou do tronco celíaco, que impede a ressecção R0) e irressecabilidade oncológica (metástases à distância).","w":{"A":"Erra um adjetivo decisivo: a icterícia do tumor de cabeça de pâncreas é caracteristicamente indolor. É esse detalhe que a distingue da icterícia obstrutiva litiásica.","B":"Inverte a conduta padrão. Em lesão claramente ressecável, a biópsia pré-operatória não é necessária nem recomendada — ela adiciona risco (disseminação pelo trajeto, pancreatite) e um resultado negativo não excluiria o diagnóstico. A biópsia (preferencialmente por ecoendoscopia) é indicada quando se vai iniciar quimioterapia neoadjuvante ou paliativa, situações em que a confirmação histológica é imprescindível.","D":"Inverte o prognóstico. As lesões de corpo e cauda têm prognóstico pior, porque não causam icterícia precoce e são diagnosticadas em estágios mais avançados. Os tumores cefálicos \"avisam\" mais cedo."},"p":["Classificação de ressecabilidade (NCCN): ressecável — sem contato arterial e contato venoso ≤ 180° sem irregularidade. Borderline — contato arterial ≤ 180° (AMS ou tronco celíaco) ou contato venoso > 180° com possibilidade de reconstrução. Localmente avançado — contato arterial > 180° ou oclusão venosa não reconstruível."],"f":"NCCN Guidelines — Pancreatic Adenocarcinoma; Sabiston, 21ª ed., cap. 55."},{"v":"Vol. II","c":13,"n":9,"g":"B","s":["Assinale a assertiva correta sobre as neoplasias císticas do pâncreas:"],"a":{"A":"São de tratamento cirúrgico obrigatório","B":"Diabetes de início recente e esteatorreia são sinais de alarme para malignidade","C":"Tumores sólido-císticos são manejados conservadoramente na maioria dos casos","D":"A chance de o cistoadenoma seroso malignizar é alta"},"ok":"O surgimento recente de diabetes e de insuficiência exócrina (esteatorreia) em portador de lesão cística pancreática sugere que a lesão está comprometendo funcionalmente o parênquima e obstruindo o ducto — sinais de progressão e possível malignização. Diabetes de início recente em adulto, aliás, é reconhecido como manifestação precoce do próprio adenocarcinoma pancreático.","w":{"A":"Absoluto e falso. Muitas lesões císticas são acompanhadas: cistos pequenos sem estigmas de alto risco, IPMN de ramo secundário sem características preocupantes, e cistoadenoma seroso assintomático.","C":"Inverte a conduta. Os tumores sólido-císticos — de que o Frantz é o exemplo — têm potencial maligno e a conduta é ressecção cirúrgica, que é curativa. Não se acompanha lesão sólido-cística.","D":"O cistoadenoma seroso é praticamente sempre benigno; o cistoadenocarcinoma seroso é uma raridade descrita em relatos de caso."},"p":["Estigmas de alto risco (indicam cirurgia): icterícia obstrutiva com lesão cefálica, componente sólido com realce, ducto principal ≥ 10 mm. Características preocupantes (indicam ecoendoscopia): cisto ≥ 3 cm, parede espessada com realce, ducto de 5–9 mm, nódulo mural sem realce, linfadenopatia, CA 19-9 elevado, pancreatite aguda, crescimento rápido."],"f":"Fukuoka/Kyoto Consensus Guidelines for IPMN and MCN; Sabiston, 21ª ed., cap. 55."},{"v":"Vol. II","c":13,"n":10,"g":"C","s":["Qual o tumor neuroendócrino mais comum do pâncreas?"],"a":{"A":"Somatostatinoma","B":"VIPoma","C":"Insulinoma","D":"Glucagonoma"},"ok":"O insulinoma é o tumor neuroendócrino funcionante mais frequente do pâncreas. Manifesta-se pela tríade de Whipple: sintomas de hipoglicemia em jejum, glicemia documentada abaixo de 50 mg/dL e alívio dos sintomas com a administração de glicose. É benigno em cerca de 90% dos casos, geralmente pequeno (menor que 2 cm) e solitário, com tratamento cirúrgico curativo por enucleação.","w":{"A":"O somatostatinoma é raríssimo, com a tríade de diabetes, colelitíase e esteatorreia.","B":"O VIPoma causa a síndrome de Verner-Morrison (WDHA): diarreia aquosa volumosa, hipocalemia e acloridria. É raro.","D":"O glucagonoma cursa com eritema necrolítico migratório, diabetes, perda ponderal e trombose. Também é raro."},"p":["Se a questão perguntar o tumor neuroendócrino pancreático mais comum de forma geral (incluindo não funcionantes), a resposta muda: os não funcionantes são hoje os mais frequentes, por diagnóstico incidental em exames de imagem. Entre os funcionantes, o insulinoma lidera."],"f":"Sabiston, 21ª ed., cap. 55; NCCN Guidelines — Neuroendocrine and Adrenal Tumors."},{"v":"Vol. II","c":13,"n":11,"g":"B","s":["Os tumores hepáticos benignos têm prevalência média de 9% da população, porém a maioria é assintomática. Em relação a essas lesões, assinale a correta:"],"a":{"A":"Os hemangiomas são os tumores hepáticos mais comuns, em sua maioria múltiplos e menores que 5 cm","B":"A imagem típica do hemangioma na TC com contraste é impregnação globular periférica na fase arterial, com distribuição centrípeta, completando o enchimento na fase venosa","C":"Os adenomas têm risco de sangramento aumentado em gestantes e em uso de anticoncepcional, tendo indicação de ressecção nessas pacientes","D":"A hiperplasia nodular focal é lesão não neoplásica, sem impregnação do contraste na fase arterial nem na fase tardia, observando-se a cicatriz central"},"ok":"O padrão de realce do hemangioma é praticamente patognomônico: captação globular ou nodular periférica na fase arterial, com preenchimento centrípeto progressivo (de fora para dentro) nas fases portal e tardia, acompanhando a densidade do pool vascular. Reconhecer esse padrão dispensa biópsia — que, aliás, é contraindicada pelo risco de sangramento.","w":{"A":"Acerta que o hemangioma é o tumor hepático benigno mais comum, mas erra o restante: a maioria é única e pequena (menor que 4 cm); os \"gigantes\" (maiores que 5 cm) são a minoria.","C":"Contém uma verdade e um exagero. É verdade que a gestação e os anticoncepcionais aumentam o risco de crescimento e sangramento do adenoma, e que se deve suspender o contraceptivo. Mas a indicação de ressecção não decorre automaticamente disso — ela depende do tamanho (> 5 cm), do sexo masculino, do subtipo (β-catenina) e da persistência após a suspensão hormonal.","D":"Descreve exatamente o oposto. A hiperplasia nodular focal (HNF) apresenta realce arterial intenso e homogêneo, tornando-se isodensa nas fases seguintes, com cicatriz central que capta contraste tardiamente. Dizer que não impregna é o erro."},"p":["Trio dos tumores hepáticos benignos: hemangioma = realce globular periférico centrípeto, conduta expectante. HNF = realce arterial homogêneo com cicatriz central, sem relação causal com ACO, conduta expectante. Adenoma = mulher em uso de ACO, risco de sangramento e de malignização, suspender ACO e ressecar se > 5 cm ou subtipo β-catenina."],"f":"Sabiston, 21ª ed., cap. 53 (Fígado); EASL Clinical Practice Guidelines on the management of benign liver tumours."},{"v":"Vol. II","c":13,"n":12,"g":"B","s":["Homem de 63 anos com icterícia progressiva há 3 semanas, urina escura e perda de 7 kg. Dor leve em hipocôndrio direito e prurido. Ao exame: ictérico, com vesícula palpável indolor. USG: dilatação de via biliar principal e vesícula distendida. TC: massa hipoatenuante na cabeça do pâncreas, de 3 cm, com contato maior que 180° com a veia mesentérica superior, sem metástases hepáticas. CA 19-9: 420 U/mL. Qual a conduta mais adequada?"],"a":{"A":"Encaminhar para duodenopancreatectomia, pois não há metástases","B":"Iniciar quimioterapia neoadjuvante com FOLFIRINOX após passagem de prótese endoscópica em via biliar, reavaliando a ressecabilidade após o tratamento","C":"Realizar drenagem biliar endoscópica definitiva e acompanhar clinicamente, pois o tumor é irressecável","D":"Indicar biópsia percutânea e radioterapia exclusiva com finalidade curativa"},"ok":"Contato venoso superior a 180° com a veia mesentérica superior, sem envolvimento arterial e sem metástases, classifica o tumor como borderline ressecável. A conduta atual é quimioterapia neoadjuvante — FOLFIRINOX em pacientes com bom performance status, ou gencitabina com nab-paclitaxel — seguida de reestadiamento. Como o paciente está ictérico e vai receber quimioterapia, a drenagem biliar prévia por prótese endoscópica é indicada, o que a alternativa contempla corretamente. A neoadjuvância aumenta a taxa de ressecção R0 e seleciona biologicamente os pacientes que se beneficiam da cirurgia.","w":{"A":"Cirurgia upfront em doença borderline associa-se a alta taxa de margem comprometida (R1) e recidiva precoce.","C":"Classifica erroneamente como irressecável. Borderline não é irressecável — é potencialmente ressecável após tratamento sistêmico, e portanto ainda potencialmente curável.","D":"A biópsia percutânea deve ser evitada em lesões potencialmente ressecáveis, pelo risco de disseminação no trajeto; prefere-se a punção guiada por ecoendoscopia. E a radioterapia exclusiva não tem finalidade curativa no adenocarcinoma pancreático."},"p":["Sobre a drenagem biliar pré-operatória: em paciente que irá direto para a cirurgia, ela não é rotineira e pode aumentar complicações infecciosas. Indica-se quando há colangite, prurido intratável, bilirrubina muito elevada, ou quando haverá neoadjuvância — que é o caso aqui."],"f":"NCCN Guidelines — Pancreatic Adenocarcinoma; Conroy T et al., NEJM — FOLFIRINOX; Sabiston, 21ª ed., cap. 55."},{"v":"Vol. II","c":13,"n":13,"g":"B","s":["Homem de 60 anos, assintomático, realiza ultrassonografia de rotina que mostra imagem cística em cabeça de pâncreas. TC evidencia lesão arredondada de 1,8 cm,","paredes finas, sem septações internas nem componente sólido, sem dilatação do ducto pancreático principal. Ressonância confirma o achado e não demonstra comunicação com o ducto. CA 19-9 normal. Nega dor, perda ponderal ou icterícia. Qual a conduta mais adequada?"],"a":{"A":"Ressecção cirúrgica da cabeça do pâncreas devido ao risco de malignização","B":"Acompanhamento clínico e de imagem periódico, pois a lesão é pequena e sem critérios de estigma ou preocupação","C":"Punção aspirativa imediata para análise citológica","D":"Trata-se de um pseudocisto e devemos repetir imagem em 30 dias"},"ok":"A lesão não apresenta nenhum estigma de alto risco nem característica preocupante: tem menos de 3 cm, paredes finas, sem componente sólido, sem septação, sem dilatação ductal, sem sintomas e com CA 19-9 normal. A conduta é vigilância por imagem (ressonância com colangiorressonância), com intervalos definidos pelo tamanho.","w":{"A":"Duodenopancreatectomia por uma lesão de 1,8 cm sem qualquer sinal de risco expõe o paciente a mortalidade de 2 a 5% e morbidade elevada, sem qualquer justificativa oncológica.","C":"A ecoendoscopia com punção é indicada quando existem características preocupantes que precisam ser esclarecidas. Sem elas, a punção não muda conduta e adiciona risco de pancreatite e sangramento.","D":"Pseudocisto exigiria antecedente de pancreatite ou trauma, ausente aqui. E a proposta de repetir imagem em 30 dias não corresponde a nenhum protocolo de seguimento."},"p":["Intervalos de seguimento (consenso de Fukuoka/Kyoto): cistos < 1","cm — a cada 6 meses no primeiro ano, depois a cada 2 anos. 1–2 cm — anual. 2–3 cm — ecoendoscopia em 3–6 meses, depois alternando ressonância e ecoendoscopia. > 3 cm — vigilância estreita ou considerar cirurgia em bom candidato."],"f":"Fukuoka/Kyoto International Consensus Guidelines for IPMN and MCN; European evidence-based guidelines on pancreatic cystic neoplasms; Sabiston, 21ª ed., cap. 55."},{"v":"Vol. II","c":13,"n":14,"g":"A","s":["Mulher de 60 anos, com lesão cística de 4 cm no corpo do pâncreas, septada, sem comunicação com o ducto principal, CEA do líquido aspirado baixo, sem calcificações. Qual o diagnóstico mais provável e a conduta?"],"a":{"A":"Neoplasia cística serosa — conduta: ressecção se sintomática ou ≥ 4 cm (considerar ressecção distal, preservando o baço)","B":"Neoplasia mucinosa cística — conduta: vigiar, pois tem baixo risco de malignidade","C":"IPMN do ducto principal — conduta: drenagem endoscópica","D":"Tumor cístico sólido (Frantz) — conduta: quimioterapia inicial"},"ok":"O CEA baixo no líquido aspirado é o dado decisivo: ele exclui as lesões mucinosas (mucinosa cística e IPMN), que cursam com CEA elevado. Restam as lesões serosas e não mucinosas. A conduta descrita — ressecção quando sintomática ou de grande tamanho, com pancreatectomia distal preservando o baço — é adequada.","w":{"B":"Inverte duas coisas. Primeiro, a mucinosa cística cursa com CEA alto, não baixo. Segundo, ela tem potencial de malignização significativo e sua conduta padrão é a ressecção, não a vigilância.","C":"O enunciado especifica ausência de comunicação com o ducto principal, o que exclui o IPMN por definição. E \"drenagem endoscópica\" é conduta de pseudocisto, nunca de neoplasia cística — drenar uma neoplasia mucinosa poderia disseminar células no trato digestivo.","D":"O Frantz é uma lesão sólido-cística em mulher jovem, e seu tratamento é a ressecção cirúrgica, não quimioterapia."},"p":["Regra de ouro do líquido cístico: CEA alto = mucinoso = potencial maligno = considerar ressecção. CEA baixo com amilase baixa = seroso. Amilase alta = comunica com o ducto (pseudocisto ou IPMN)."],"f":"Fukuoka/Kyoto Consensus Guidelines; Brugge WR et al., Gastroenterology — Diagnosis of pancreatic cystic neoplasms (estudo da acurácia do CEA); Sabiston, 21ª ed., cap. 55."},{"v":"Vol. II","c":13,"n":15,"g":"A","s":["Mulher de 79 anos, previamente hígida, apresenta saciedade precoce e plenitude abdominal. Realizou tomografia de abdome (imagem apresentada). A aspiração guiada por TC demonstrou nível elevado de CEA. Qual a opção de tratamento mais apropriada?"],"a":{"A":"Pancreatectomia distal","B":"TC seriada com ressecção se a lesão aumentar significativamente de tamanho","C":"Drenagem interna com cistojejunostomia em Y de Roux","D":"CPRE com colocação de stent pancreático"},"ok":"O CEA elevado no líquido aspirado identifica a lesão como mucinosa, portanto com potencial de malignização. Somando-se a isso o tamanho volumoso e os sintomas compressivos (saciedade precoce e plenitude), a indicação é de ressecção cirúrgica. Como a lesão é de corpo/cauda, a operação é a pancreatectomia distal.","w":{"B":"Vigiar uma lesão mucinosa sintomática e volumosa seria conduta inadequada: o risco de albergar carcinoma invasivo é real, e a espera só piora as condições de ressecção.","C":"A cistojejunostomia é o tratamento de pseudocisto, não de neoplasia. Anastomosar uma neoplasia mucinosa ao delgado é erro grave — perpetua a lesão e pode disseminá-la.","D":"O stent pancreático via CPRE é conduta de estenose ductal ou fístula, sem qualquer papel no manejo de neoplasia cística mucinosa."},"p":["A neoplasia mucinosa cística é quase exclusiva de mulheres, tipicamente na quarta a sexta década, localiza-se em corpo e cauda, não comunica com o ducto principal, e histologicamente apresenta estroma do tipo ovariano — sua marca diagnóstica."],"f":"Fukuoka/Kyoto Consensus Guidelines; European guidelines on pancreatic cystic neoplasms; Sabiston, 21ª ed., cap. 55."},{"v":"Vol. II","c":13,"n":16,"g":"B","s":["Em relação aos limites da ressecção em metástases hepáticas de tumores colorretais, assinale a alternativa falsa:"],"a":{"A":"A preservação de volume hepático residual funcional adequado é fundamental para evitar insuficiência hepática pós-operatória","B":"Tal volume pode ser previsto pela volumetria hepática; 50% de fígado remanescente é o volume mínimo usualmente requerido","C":"Técnicas como embolização portal ou ALPPS podem ser utilizadas para aumentar o volume do fígado remanescente antes da ressecção","D":"O objetivo da cirurgia é obter margens livres de doença, idealmente com margem mínima de 1 mm"},"ok":"Enunciado negativo. O volume de fígado remanescente exigido não é 50%. Em fígado normal, aceita-se um remanescente de 20 a 25%; em fígado que recebeu quimioterapia ou com esteatose, exige-se de 30 a 40%; em fígado cirrótico, ao menos 40%. Exigir 50% de forma genérica é excessivo e tornaria irressecáveis muitos pacientes curáveis.","w":{"A":"Verdadeira: a insuficiência hepática pós-hepatectomia é a principal causa de mortalidade nesse tipo de cirurgia, e o volume remanescente é o principal determinante.","C":"Verdadeira. A embolização da veia porta induz hipertrofia compensatória do lobo contralateral em 4 a 6 semanas. O ALPPS (partição hepática com ligadura portal em dois estágios) induz hipertrofia muito mais rápida, em 7 a 10 dias, ao custo de maior morbimortalidade.","D":"Verdadeira segundo o conceito atual. A antiga exigência de margem de 1 cm foi abandonada — hoje o que importa é a margem R0 microscópica, e margens submilimétricas ainda oferecem benefício de sobrevida."},"p":["Interseção: este conteúdo pertence ao Caso 15, mas foi agrupado aqui. Reaparece também no Caso 14 (questões 2 e 11)."],"f":"Sabiston, 21ª ed., cap. 53; Schnitzbauer AA et al., Ann Surg — ALPPS; NCCN Guidelines — Colon Cancer."},{"v":"Vol. II","c":13,"n":17,"g":"C","s":["Sobre tumores hepáticos, assinale a alternativa falsa:"],"a":{"A":"A HNF não apresenta associação comprovada com o uso de anticoncepcionais orais, diferentemente dos adenomas hepáticos","B":"Adenomas hepáticos associados à mutação do gene β-catenina têm risco aumentado de transformação maligna e recomendação de ressecção","C":"A biópsia hepática é obrigatória para diagnóstico de CHC em pacientes cirróticos, independentemente dos achados de imagem","D":"O transplante hepático pode ser considerado tratamento curativo em pacientes com CHC que se enquadrem nos critérios de Milão"},"ok":"Enunciado negativo. O carcinoma hepatocelular é a única neoplasia sólida diagnosticada por imagem, sem necessidade de confirmação histológica. Em paciente cirrótico com nódulo maior que 1 cm apresentando o padrão vascular típico — realce arterial intenso seguido de washout na fase portal/tardia — o diagnóstico está firmado. A biópsia é reservada a casos atípicos e traz risco de sangramento e de disseminação pelo trajeto.","w":{"A":"Verdadeira. A HNF é uma resposta hiperplásica a uma malformação arterial, e não há associação causal comprovada com anticoncepcionais — diferentemente do adenoma, cuja incidência acompanhou historicamente o uso de contraceptivos orais.","B":"Verdadeira. O subtipo β-catenina ativado é o de maior risco de transformação maligna, e sua identificação indica ressecção independentemente do tamanho. Os outros subtipos são HNF-1α (esteatótico, baixo risco) e inflamatório (maior risco de sangramento).","D":"Verdadeira. O transplante é curativo dentro dos critérios de Milão, com sobrevida em 5 anos superior a 70%."},"p":["Critérios de Milão: um nódulo ≤ 5 cm ou até três nódulos, todos ≤ 3 cm, sem invasão vascular e sem doença extra-hepática."],"f":"EASL Clinical Practice Guidelines — Management of Hepatocellular Carcinoma; Mazzaferro V et al., NEJM — critérios de Milão; Sabiston, 21ª ed., cap. 53."},{"v":"Vol. II","c":13,"n":18,"g":"C","s":["Com base na imagem apresentada, marque a alternativa correspondente à coleção peripancreática:"],"a":{"A":"A","B":"B","C":"C","D":"D"},"ok":"A questão exige aplicação da classificação de Atlanta revisada sobre a imagem: identificar, entre as estruturas marcadas, a coleção que ocupa o espaço peripancreático — tipicamente o espaço pararrenal anterior, o saco menor ou a goteira paracólica —, distinguindo-a de estruturas normais e de coleções em outros compartimentos.","w":{"A":"Corresponde a estrutura marcada em outra topografia na imagem original.","B":"Idem.","D":"Idem."},"p":["Nomenclatura de Atlanta revisada por tempo e conteúdo: < 4 semanas — coleção fluida peripancreática aguda (só líquido, na PA intersticial) e coleção necrótica aguda (líquido + necrose, na PA necrosante). > 4 semanas — pseudocisto (parede madura, só líquido) e necrose murada/WON (parede madura, com conteúdo sólido). Só se trata coleção sintomática, infectada ou complicada. Tamanho isolado não é indicação."],"f":"Atlanta Classification revisada (Banks PA et al., Gut 2013); Sabiston, 21ª ed., cap. 55."},{"v":"Vol. II","c":13,"n":19,"g":"B","s":["Sobre os principais tumores císticos do pâncreas, é correto afirmar:"],"a":{"A":"A neoplasia mucinosa cística pancreática é comum em homens e ocorre principalmente na cabeça do pâncreas","B":"O IPMN pode comunicar-se com o ducto pancreático principal","C":"A neoplasia serosa cística tem alto potencial de malignização e requer cirurgia imediata","D":"O tumor de Frantz ocorre predominantemente em homens jovens"},"ok":"A comunicação com o sistema ductal é a característica definidora do IPMN (neoplasia mucinosa papilar intraductal) — ela o distingue de todas as outras lesões císticas. O IPMN se classifica em: ducto principal (alto risco de malignidade, 40–70%, indicação de ressecção), ramo secundário (risco menor, passível de vigilância) e misto.","w":{"A":"Inverte duas características. A neoplasia mucinosa cística é quase exclusiva de mulheres e localiza-se predominantemente em corpo e cauda, não na cabeça.","C":"Inverte o comportamento. A neoplasia serosa é benigna na imensa maioria dos casos, e sua ressecção só se indica se for sintomática, muito volumosa ou se houver dúvida diagnóstica.","D":"Inverte o sexo. O tumor de Frantz é predominante em mulheres jovens — é a lesão pancreática com perfil demográfico mais característico de todo o caso."},"p":["Sinal endoscópico patognomônico do IPMN de ducto principal: papila duodenal aberta e patulosa, com extrusão de muco (\"sinal do olho de peixe\")."],"f":"Fukuoka/Kyoto International Consensus Guidelines for IPMN and MCN; Sabiston, 21ª ed., cap. 55; WHO Classification of Tumours."},{"v":"Vol. II","c":14,"n":1,"g":"D","s":["Em colonoscopia encontra-se pólipo de 1,7 cm com pedículo longo no cólon sigmoide, ressecado ao nível de sua base. O anatomopatológico mostrou adenocarcinoma bem diferenciado na \"cabeça\" do pólipo, com invasão até a submucosa, sem invasão dos linfáticos do pedículo até sua porção proximal. Qual o melhor tratamento?"],"a":{"A":"Quimioterapia adjuvante","B":"Retossigmoidectomia com anastomose colorretal baixa","C":"Ressecção transanal do que restou do pedículo","D":"Não precisa de nenhum outro tratamento; acompanhamento e repetir a colonoscopia em 6 meses"},"ok":"O pólipo maligno pedunculado é considerado adequadamente tratado pela polipectomia quando reúne todos os critérios favoráveis: adenocarcinoma bem ou moderadamente diferenciado, ausência de invasão linfovascular, margem de ressecção livre (≥ 1 a 2 mm) e invasão limitada — no caso, restrita à cabeça do pólipo, correspondendo a Haggitt 1. Nessas condições, o risco de linfonodo positivo é inferior a 1 a 2%, o que não justifica uma colectomia. A conduta é vigilância colonoscópica.","w":{"A":"A quimioterapia adjuvante é indicada no estádio III (N+) e em estádio II de alto risco. Um pólipo maligno completamente ressecado com critérios favoráveis não se enquadra.","B":"A retossigmoidectomia seria indicada se houvesse fator desfavorável: invasão linfovascular, tumor pouco diferenciado, margem comprometida, ou invasão profunda (Haggitt 4 / sm3). Aqui, expõe o paciente a morbidade sem benefício.","C":"A ressecção transanal não alcança o sigmoide — é técnica para lesões do reto distal, ao alcance do dedo ou de plataformas transanais. Erro de topografia."},"p":["Classificação de Haggitt (pólipos pedunculados): 0 carcinoma in situ; 1 invade a submucosa da cabeça; 2 invade o colo; 3 invade o pedículo; 4 invade a submucosa da parede intestinal abaixo do pedículo — este último com risco linfonodal significativo, indicando colectomia. Para pólipos sésseis, usa-se a classificação de Kikuchi (sm1, sm2, sm3), com sm3 indicando ressecção cirúrgica."],"f":"Sabiston, 21ª ed., cap. 51 (Cólon e reto); ASCRS Clinical Practice Guidelines for the management of malignant polyps; Haggitt RC et al., Gastroenterology."},{"v":"Vol. II","c":14,"n":2,"g":"A","s":["As metástases hepáticas de tumor de cólon respondem de modo satisfatório à ressecção cirúrgica associada à quimioterapia. Assinale a alternativa que contém contraindicação ao tratamento cirúrgico:"],"a":{"A":"Invasão das 3 veias hepáticas","B":"Tumor > 10 cm","C":"Mais de 5 lesões","D":"Doença bilobar hepática"},"ok":"A contraindicação moderna à hepatectomia por metástase colorretal é técnica e funcional, não numérica. A invasão das três veias hepáticas impossibilita qualquer ressecção que preserve drenagem venosa adequada de um remanescente viável — é impossível obter R0 com fígado funcional. É a única contraindicação absoluta entre as opções.","w":{"B":"Tamanho, isoladamente, não contraindica. Uma lesão de 10 cm em um lobo pode ser removida por hepatectomia formal, desde que o remanescente seja suficiente.","C":"O número de lesões deixou de ser critério absoluto. Pacientes com mais de 5 metástases podem ser ressecados se for possível obter R0 com remanescente adequado, eventualmente em dois tempos ou com ablação combinada.","D":"A doença bilobar também não contraindica: pode ser abordada por ressecção em dois estágios, embolização portal, ALPPS ou combinação de ressecção com ablação por radiofrequência."},"p":["Critérios modernos de ressecabilidade: possibilidade de R0, remanescente hepático funcional adequado (20–30% em fígado normal, 30–40% em fígado quimioterapiado), e preservação de influxo arterial e portal, drenagem venosa e drenagem biliar do remanescente."],"f":"Sabiston, 21ª ed., cap. 53; NCCN Guidelines — Colon Cancer; Adam R et al. — evolução dos critérios de ressecabilidade hepática."},{"v":"Vol. II","c":14,"n":3,"g":"A","s":["O câncer de cólon é a neoplasia mais comum do trato digestivo no mundo ocidental. Assinale a alternativa que apresenta um fator protetor para esse câncer:"],"a":{"A":"Uso de aspirina","B":"Dieta pobre em fibra","C":"Obesidade","D":"Síndrome de Lynch"},"ok":"O uso regular de aspirina associa-se a redução da incidência e da mortalidade por câncer colorretal, por inibição da COX-2, que está superexpressa em adenomas e carcinomas colorretais e favorece proliferação e angiogênese. O efeito é dose e tempo-dependente e é particularmente marcado na síndrome de Lynch (estudo CAPP2).","w":{"B":"Dieta pobre em fibras é fator de risco: menos volume fecal, trânsito mais lento e maior tempo de contato da mucosa com carcinógenos.","C":"Obesidade é fator de risco estabelecido, por hiperinsulinemia, elevação de IGF-1 e estado inflamatório crônico.","D":"A síndrome de Lynch (câncer colorretal hereditário não polipose) é o maior fator de risco genético, com risco cumulativo de até 80% ao longo da vida."},"p":["Fatores protetores: aspirina e AINEs, atividade física, dieta rica em fibras, cálcio, vitamina D, e a própria colonoscopia com polipectomia, que interrompe a sequência adenoma-carcinoma.","Fatores de risco: idade > 50 anos, história familiar, doença inflamatória intestinal, carne vermelha e processada, obesidade, tabagismo, etilismo, diabetes e síndromes hereditárias."],"f":"Sabiston, 21ª ed., cap. 51; Burn J et al., Lancet — CAPP2 trial (aspirina na síndrome de Lynch); USPSTF/NCCN Guidelines."},{"v":"Vol. II","c":14,"n":4,"g":"A","s":["Observe a imagem apresentada. Trata-se do orifício externo de uma fístula anorretal. De acordo com a regra de Goodsall, o trajeto fistuloso esperado seria:","Região perianal apresentada na questão — orifício externo"],"a":{"A":"Trajeto 1 — amarelo","B":"Trajeto 2 — verde","C":"Trajeto 3 — vermelho","D":"Trajeto 4 — roxo"},"ok":"A regra de Goodsall orienta a previsão do trajeto: traça-se uma linha transversa imaginária pelo ânus. Orifícios externos situados anteriormente a essa linha têm trajeto radial e direto para a cripta correspondente. Orifícios posteriores têm trajeto curvilíneo, dirigindo-se à linha média posterior. Exceção clássica: orifícios anteriores situados a mais de 3 cm da borda anal tendem a se comportar como posteriores, com trajeto curvo para a linha média.","w":{"B":"Corresponde a um dos trajetos alternativos sobrepostos na imagem original, incompatível com a posição do orifício descrito.","C":"Idem.","D":"Idem."},"p":["Classificação de Parks para fístulas anorretais: interesfincteriana (a mais comum, ~45%), transesfincteriana (~30%), supraesfincteriana (~20%) e extraesfincteriana (~5%, geralmente iatrogênica ou por doença de Crohn). Princípio terapêutico: fístulas baixas e simples podem ser tratadas por fistulotomia. Fístulas altas ou complexas exigem técnicas de preservação esfincteriana (sedenho, LIFT, retalho de avanço) pelo risco de incontinência."],"f":"Sabiston, 21ª ed., cap. 52 (Ânus); ASCRS Clinical Practice Guidelines for the Management of Anorectal Abscess and Fistula-in-Ano."},{"v":"Vol. II","c":14,"n":5,"g":"C","s":["Mulher de 60 anos, imigrante, preenchendo os critérios de Bethesda, apresenta","mudança de hábito intestinal, anemia e perda ponderal. Colonoscopia encontrou lesão maligna em ângulo esplênico, provável T3N0M0. Qual a melhor conduta cirúrgica?"],"a":{"A":"Colectomia segmentar + histerectomia total abdominal","B":"Colectomia parcial","C":"Colectomia subtotal + histerectomia total abdominal","D":"Ressecção endoscópica"},"ok":"Os critérios de Bethesda sinalizam suspeita de síndrome de Lynch. Nesses pacientes, o risco de tumor metacrônico no cólon remanescente é elevado (até 40% em 10 anos), o que justifica a colectomia subtotal com anastomose ileorretal em vez de ressecção segmentar. E, em mulheres com Lynch que já completaram a prole, recomenda-se histerectomia com salpingo-ooforectomia bilateral profilática, dado o risco elevado de câncer de endométrio (até 60%) e de ovário.","w":{"A":"A ressecção segmentar deixa o cólon remanescente sob risco metacrônico substancial.","B":"Colectomia parcial isolada tem a mesma limitação e ainda ignora o risco ginecológico.","D":"A ressecção endoscópica é impossível em lesão T3, que já invade a subserosa/gordura pericólica."},"p":["Síndrome de Lynch: mutação em genes de reparo de mal pareamento (MLH1, MSH2, MSH6, PMS2, EPCAM), instabilidade de microssatélites, predomínio de tumores de cólon direito, mucinosos e pouco diferenciados, com infiltrado linfocitário. Rastreamento com colonoscopia a cada 1 a 2 anos a partir dos 20–25 anos. Critérios de Amsterdam II (regra do 3-2-1): 3 familiares com câncer associado a Lynch, 2 gerações sucessivas, 1 antes dos 50 anos,","excluída a FAP."],"f":"Sabiston, 21ª ed., cap. 51; NCCN Guidelines — Genetic/Familial High-Risk Assessment: Colorectal; ASCRS Practice Guidelines."},{"v":"Vol. II","c":14,"n":6,"g":"D","s":["Qual dos genes abaixo está mais frequentemente relacionado à sequência carcinogenética da síndrome de Peutz-Jeghers?"],"a":{"A":"P53","B":"APC","C":"KRAS","D":"STK11/LKB1"},"ok":"A síndrome de Peutz-Jeghers decorre de mutação germinativa no gene STK11 (LKB1), uma serina-treonina quinase supressora tumoral. Caracteriza-se por pólipos hamartomatosos no trato gastrointestinal (predominantemente no delgado) e manchas melanocíticas mucocutâneas em lábios, mucosa oral e extremidades. O risco de neoplasias é elevado e diversificado: cólon, delgado, pâncreas, mama, ovário e testículo.","w":{"A":"O p53 é o supressor tumoral mutado em fase tardia da sequência adenoma-carcinoma colorretal e é o gene da síndrome de Li-Fraumeni.","B":"O APC é o gene da polipose adenomatosa familiar (FAP) e o responsável pela etapa inicial da carcinogênese colorretal esporádica.","C":"O KRAS é um oncogene ativado em fase intermediária da sequência, e seu status determina a resposta a anticorpos anti-EGFR (cetuximabe e panitumumabe) na doença metastática."},"p":["Síndromes polipoides e seus genes: FAP = APC (adenomatosos). Peutz-Jeghers = STK11 (hamartomatosos + manchas melanocíticas). Polipose juvenil = SMAD4/BMPR1A. Cowden = PTEN. MUTYH- associated polyposis = MUTYH (autossômica recessiva)."],"f":"Sabiston, 21ª ed., cap. 51; NCCN Guidelines — Genetic/Familial High-Risk Assessment: Colorectal."},{"v":"Vol. II","c":14,"n":7,"g":"C","s":["T3N1M0. Adenocarcinoma retal a 5 cm da margem anal. Melhor conduta?"],"a":{"A":"Cirurgia upfront","B":"Quimioterapia seguida de cirurgia","C":"Quimiorradioterapia neoadjuvante seguida de ressecção anterior baixa","D":"Amputação abdominoperineal"},"ok":"Câncer de reto T3 e/ou N+ tem indicação formal de quimiorradioterapia neoadjuvante, que reduz a recidiva local, promove downstaging e aumenta a chance de preservação esfincteriana. Como a lesão está a 5 cm da margem anal, ainda é possível obter margem distal adequada preservando o aparelho esfincteriano: a operação é a ressecção anterior baixa com excisão total do mesorreto (ETM).","w":{"A":"Cirurgia upfront é adequada apenas em tumores T1-T2 N0 do reto. Em T3N1, associa-se a maior recidiva local.","B":"Quimioterapia isolada não substitui a radioterapia no controle local pélvico. A radioterapia é o componente essencial da neoadjuvância no reto — é justamente o que diferencia reto de cólon.","D":"A amputação abdominoperineal (operação de Miles), com colostomia definitiva, é reservada a tumores muito distais, com invasão do complexo esfincteriano ou impossibilidade de margem distal adequada. Com 5 cm de distância, indicá-la seria mutilação desnecessária."},"p":["Regra decisiva do caso: cólon não faz neoadjuvância (a cirurgia vem primeiro, seguida de quimioterapia adjuvante se N+); reto faz neoadjuvância a partir de T3 ou N+. Margem distal aceitável no reto: 2 cm em geral, admitindo-se 1 cm em tumores muito distais após neoadjuvância. A margem circunferencial (radial) é o preditor mais forte de recidiva local — daí a importância da ETM."],"f":"Sabiston, 21ª ed., cap. 51; NCCN Guidelines — Rectal Cancer; Heald RJ — princípio da excisão total do mesorreto; Sauer R et al., NEJM — German Rectal Cancer Study (neoadjuvante superior a adjuvante)."},{"v":"Vol. II","c":14,"n":8,"g":"D","s":["Qual o gene relacionado à etapa inicial da carcinogênese colorretal?"],"a":{"A":"MYH","B":"KRAS","C":"P53","D":"APC"},"ok":"O modelo de Fearon e Vogelstein descreve a sequência adenoma-carcinoma como um acúmulo ordenado de alterações genéticas. A inativação do APC — supressor tumoral do cromossomo 5q, regulador da via Wnt/β-catenina — é o evento iniciador, responsável pela formação do adenoma precoce. É a mutação encontrada em cerca de 80% dos cânceres colorretais esporádicos.","w":{"A":"O MYH (MUTYH) causa a polipose associada a MUTYH, forma autossômica recessiva de polipose. Não é a etapa inicial da carcinogênese esporádica.","B":"O KRAS é ativado na etapa intermediária, promovendo a progressão de adenoma precoce para adenoma avançado.","C":"A perda de p53 (17p) é evento tardio, associado à transição de adenoma avançado para carcinoma invasivo."},"p":["Sequência de Vogelstein: epitélio normal → APC (adenoma precoce) → KRAS (adenoma intermediário) → perda de DCC/SMAD4 em 18q (adenoma tardio) → p53 (carcinoma) → alterações adicionais (metástase). Via alternativa: a serrilhada, envolvendo mutação de BRAF e metilação de ilhas CpG, responde por cerca de 15 a 20% dos casos e origina-se de pólipos serrilhados sésseis, sobretudo do cólon direito."],"f":"Fearon ER, Vogelstein B — A genetic model for colorectal tumorigenesis, Cell 1990; Sabiston, 21ª ed., cap. 51."},{"v":"Vol. II","c":14,"n":9,"g":"C","s":["Homem de 58 anos com alteração do hábito intestinal há três meses, alternando constipação e evacuações com sangue. Perda de 5 kg e sensação de evacuação incompleta. Abdome flácido, sem massas palpáveis; toque retal sem alterações. Colonoscopia: lesão vegetante no cólon sigmoide, infiltrativa, parcialmente","obstrutiva; biópsia com adenocarcinoma moderadamente diferenciado. TC de tórax, abdome e pelve: espessamento parietal segmentar em sigmoide, sem metástases à distância, com pequenos linfonodos perilesionais. Qual a conduta inicial mais adequada?"],"a":{"A":"Iniciar quimioterapia neoadjuvante seguida de retossigmoidectomia à Hartmann","B":"Indicar colostomia em alça para encaminhar para quimioterapia neoadjuvante pelo risco de obstrução","C":"Indicar retossigmoidectomia, podendo ser realizada por via laparoscópica, com linfadenectomia regional","D":"Realizar ressecção endoscópica, já que a lesão é acessível pela colonoscopia"},"ok":"Câncer de sigmoide (portanto, cólon — não reto) localizado, sem metástases. A conduta é a ressecção cirúrgica primária com linfadenectomia regional adequada, preferencialmente por via laparoscópica, que tem resultados oncológicos equivalentes à cirurgia aberta com melhor recuperação. A quimioterapia adjuvante será decidida depois, com base no anatomopatológico definitivo (estádio III ou estádio II de alto risco).","w":{"A":"Câncer de cólon não recebe quimioterapia neoadjuvante fora de protocolos e de situações muito específicas (T4b com invasão de estruturas adjacentes). E a operação de Hartmann, com colostomia terminal, não se justifica em cirurgia eletiva com paciente preparado.","B":"Colostomia derivativa em alça só se justifica em obstrução completa ou risco iminente dela em paciente sem condições de ressecção imediata. O enunciado descreve obstrução parcial, e o paciente é candidato à ressecção.","D":"A ressecção endoscópica se limita a lesões precoces (T1 com critérios favoráveis). Uma lesão vegetante, infiltrativa e parcialmente obstrutiva é claramente avançada."},"p":["Princípios oncológicos da colectomia: ligadura vascular alta na origem do pedículo, ressecção do mesocólon correspondente, margens longitudinais de pelo menos 5 cm e mínimo de 12 linfonodos examinados para estadiamento adequado."],"f":"Sabiston, 21ª ed., cap. 51; NCCN Guidelines — Colon Cancer; COST trial e COLOR trial (equivalência da laparoscopia)."},{"v":"Vol. II","c":14,"n":10,"g":"B","s":["Mulher de 64 anos com sangramento retal intermitente e tenesmo há quatro meses. Colonoscopia: lesão úlcero-infiltrativa a 5 cm da borda anal, biópsia com adenocarcinoma. Ressonância de pelve: tumor envolvendo menos de 50% da circunferência, com invasão da gordura perirretal e linfonodo suspeito, sem envolvimento do mesorreto distal (T3N1). TC de tórax e abdome sem metástases. Qual a melhor estratégia terapêutica?"],"a":{"A":"Ressecção anterior baixa com anastomose primária","B":"Quimiorradioterapia neoadjuvante seguida de ressecção total do mesorreto","C":"Radioterapia exclusiva e acompanhamento clínico com possibilidade de Watch and Wait","D":"Amputação abdominoperineal devido à altura da lesão e às margens de segurança necessárias"},"ok":"Repetição do conceito da questão 7, agora com estadiamento por ressonância. Adenocarcinoma de reto T3N1 exige quimiorradioterapia neoadjuvante seguida de cirurgia com excisão total do mesorreto, que é o princípio técnico que reduziu a recidiva local de 30% para menos de 10%.","w":{"A":"Cirurgia primária em T3N1 tem maior risco de margem circunferencial comprometida e de recidiva pélvica.","C":"A estratégia Watch and Wait existe, mas se aplica apenas a pacientes com resposta clínica completa após a neoadjuvância, em programa estruturado de vigilância intensiva. Não é conduta inicial, e radioterapia exclusiva sem quimioterapia não é o padrão.","D":"Com 5 cm da borda anal e sem invasão esfincteriana, a preservação é possível. Impor colostomia definitiva sem necessidade é conduta inadequada."},"p":["A ressonância de pelve é o exame de escolha no estadiamento local do câncer de reto: avalia o T, a relação com a fáscia mesorretal (margem circunferencial), a invasão extramural venosa e os linfonodos. Watch and Wait (protocolo de Habr-Gama, brasileiro): pacientes com resposta clínica completa após neoadjuvância podem ser vigiados sem cirurgia, com seguimento rigoroso e cirurgia de resgate em caso de rebrota."],"f":"Sabiston, 21ª ed., cap. 51; NCCN Guidelines — Rectal Cancer; Habr-Gama A et al. — Watch and Wait; Sauer R et al., NEJM."},{"v":"Vol. II","c":14,"n":11,"g":"A","s":["Mulher de 62 anos tratada há 14 meses por adenocarcinoma de cólon sigmoide pT3N1, submetida a colectomia seguida de quimioterapia adjuvante. Em seguimento, apresenta elevação discreta do CEA (9 ng/mL). Tomografia evidencia duas lesões hepáticas, uma de 1,6 cm no segmento II e outra de 2,1 cm no segmento VI, sem doença extra-hepática, sem contato vascular significativo e com parênquima preservado. ECOG 0. Qual a melhor estratégia terapêutica?"],"a":{"A":"Ressecção hepática com intenção curativa, considerando doença metacrônica limitada e ressecável","B":"Quimioterapia sistêmica por três meses e reavaliação, reservando cirurgia se houver resposta radiológica completa","C":"Radiofrequência percutânea exclusiva para ambas as lesões como primeira escolha","D":"TACE para controle locorregional, seguida de TACE e quimioterapia paliativa"},"ok":"Doença metacrônica (surgida 14 meses após o tratamento do primário), limitada (duas lesões pequenas), ressecável (sem contato vascular, parênquima preservado, remanescente amplamente suficiente) e em paciente com ECOG 0. É o cenário ideal de hepatectomia com intenção curativa, que oferece sobrevida em 5 anos de 35 a 60%.","w":{"B":"Contém uma armadilha conceitual importante: a resposta radiológica completa não significa cura. Lesões que \"desaparecem\" na imagem após quimioterapia frequentemente contêm doença viável, e perde-se a referência anatômica para a ressecção. Por isso, em doença claramente ressecável, não se deve tratar até o desaparecimento.","C":"A ablação por radiofrequência é alternativa para lesões pequenas em pacientes sem condições cirúrgicas ou como complemento à ressecção. Como primeira escolha em doença perfeitamente ressecável, tem controle local inferior.","D":"A TACE (quimioembolização transarterial) é tratamento de carcinoma hepatocelular intermediário (BCLC B), não de metástase colorretal ressecável."},"p":["Interseção: o mesmo conceito aparece no Caso 12 (questão 11) e no Caso 13 (questão 16). É um dos conteúdos mais reaproveitados do","banco."],"f":"Sabiston, 21ª ed., cap. 53; NCCN Guidelines — Colon Cancer; Fong Y et al. — escore prognóstico de recidiva."},{"v":"Vol. II","c":14,"n":12,"g":"D","s":["Sobre as neoplasias de cólon — quadro clínico, diagnóstico e tratamento —, escolha a alternativa correta:"],"a":{"A":"A maioria dos pacientes cursa com sintomas intestinais mesmo em tumores iniciais, devido à inflamação causada pela proliferação celular anormal","B":"A neoplasia de cólon é precedida por lesões polipoides do tipo adenomas (viloso ou hamartoma), sendo o primeiro com maior potencial de malignização; por isso o rastreio deve ser feito com colonoscopia","C":"O tratamento da neoplasia de cólon frequentemente envolve neoadjuvância para controle da disseminação e aumento das chances de ressecção R0","D":"Em relação à ressecção cirúrgica oncológica, é imprescindível margem de segurança de 5 cm e ressecção do mesentério correspondente; após a análise da peça, fatores como padrão invasivo e achado de menos de 12 linfonodos indicam tratamento adjuvante adicional"},"ok":"A alternativa reúne três princípios corretos. A margem longitudinal de 5 cm e a ressecção do mesocólon correspondente (com ligadura vascular alta) são padrões oncológicos. E o achado de menos de 12 linfonodos examinados na peça é considerado fator de estadiamento inadequado, sendo um dos critérios de alto risco que indicam quimioterapia adjuvante em estádio II — junto com T4, perfuração, obstrução, invasão linfovascular ou perineural e tumor pouco diferenciado.","w":{"A":"Inverte a realidade clínica. Tumores iniciais de cólon são majoritariamente assintomáticos — é exatamente por isso que existe rastreamento. Os sintomas surgem tardiamente.","B":"Erra a histologia. O hamartoma não é adenoma e não segue a sequência adenoma-carcinoma clássica. Os adenomas são tubulares, tubulovilosos e vilosos, sendo o viloso o de maior potencial de malignização — essa parte está correta, mas a inclusão do hamartoma invalida a alternativa.","C":"É o erro central e mais cobrado do caso: câncer de cólon não faz neoadjuvância. A neoadjuvância é do reto."},"p":["Critérios de alto risco no estádio II (T3-T4 N0) que indicam quimioterapia adjuvante: T4, perfuração, obstrução, invasão linfovascular ou perineural, tumor pouco diferenciado, margens comprometidas ou indeterminadas, e menos de 12 linfonodos examinados."],"f":"Sabiston, 21ª ed., cap. 51; NCCN Guidelines — Colon Cancer; AJCC 8ª edição."},{"v":"Vol. II","c":14,"n":13,"g":"B","s":["Paciente de 58 anos diagnosticado com adenocarcinoma de cólon descendente. A tomografia revela linfonodos regionais aumentados, mas sem metástases à distância. Qual o estadiamento provável (TNM) e a conduta inicial?"],"a":{"A":"Estádio I (T1-2 N0 M0) — tratamento exclusivo com quimioterapia","B":"Estádio III (qualquer T, N1-2, M0) — cirurgia curativa seguida de quimioterapia adjuvante","C":"Estádio III — indicação de colectomia total e radioquimioterapia","D":"Estádio II (T3-4 N0 M0) — apenas acompanhamento clínico"},"ok":"Linfonodos regionais comprometidos sem metástase à distância definem o estádio III (qualquer T, N1-2, M0). A conduta padrão é ressecção cirúrgica com linfadenectomia regional seguida de quimioterapia adjuvante — tipicamente FOLFOX ou CAPOX por 3 a 6 meses, conforme o risco (estudo IDEA).","w":{"A":"Erra o estadiamento (linfonodo positivo exclui estádio I) e a conduta — quimioterapia exclusiva não trata câncer de cólon localizado, cuja cura depende da cirurgia.","C":"Acerta o estádio, mas erra duas vezes na conduta: colectomia total é desnecessária em tumor localizado sem síndrome hereditária, e radioterapia não faz parte do tratamento do câncer de cólon (é do reto).","D":"Erra o estadiamento (N+ não é estádio II) e a conduta — mesmo no estádio II verdadeiro, \"apenas acompanhamento\" só se aplica ao estádio II de baixo risco."},"p":["Estadiamento resumido do câncer colorretal: I = T1-T2 N0. II = T3- T4 N0. III = qualquer T com N+. IV = M1. A adjuvância é padrão no III; no II, depende de fatores de alto risco."],"f":"Sabiston, 21ª ed., cap. 51; AJCC 8ª edição; NCCN Guidelines — Colon Cancer; Grothey A et al., NEJM — IDEA collaboration (duração da adjuvância)."},{"v":"Vol. II","c":15,"n":1,"g":"A","s":["Os colangiocarcinomas são tumores malignos originados do epitélio presente na vesícula e vias biliares. Assinale o sítio anatômico mais comum dos colangiocarcinomas das vias biliares:"],"a":{"A":"Confluência dos hepáticos (Klatskin)","B":"Colédoco distal","C":"Intra-hepático","D":"Terço médio do colédoco"},"ok":"Os colangiocarcinomas peri-hilares, ou tumores de Klatskin, situados na confluência dos ductos hepáticos direito e esquerdo, respondem por aproximadamente 50 a 60% de todos os colangiocarcinomas. São seguidos pelos distais (20–30%) e pelos intra-hepáticos (10–20%).","w":{"B":"Os distais representam cerca de 20 a 30% e são tratados como tumores periampulares, pela duodenopancreatectomia.","C":"Os intra-hepáticos respondem por 10 a 20% e são tratados por hepatectomia. Sua incidência vem aumentando.","D":"O terço médio do colédoco é a localização menos frequente."},"p":["Fatores de risco para colangiocarcinoma: colangite esclerosante primária (o mais importante no ocidente), cistos de colédoco, hepatolitíase, infecção por Clonorchis sinensis e Opisthorchis viverrini (Ásia), exposição ao thorotrast, e doença de Caroli."],"f":"Sabiston, 21ª ed., cap. 54 (Sistema biliar); NCCN Guidelines — Hepatobiliary Cancers."},{"v":"Vol. II","c":15,"n":2,"g":"A","s":["Sobre o carcinoma hepatocelular, marque a incorreta:"],"a":{"A":"Relacionado à hemocromatose","B":"A cirrose, particularmente macronodular, apresenta associação forte","C":"A esteato-hepatite não alcoólica não eleva o risco de desenvolver hepatocarcinoma","D":"A alfafetoproteína está elevada em mais de 90% dos casos"},"ok":"Enunciado negativo, e o material apresenta uma inconsistência: duas alternativas são falsas. A afirmação C é claramente incorreta — a esteato- hepatite não alcoólica (NASH/MASH) é hoje uma das causas de CHC que mais cresce no mundo, inclusive em fígados não cirróticos. A afirmação D também é falsa: a alfafetoproteína está elevada em apenas cerca de 60 a 70% dos casos, e pode estar normal em tumores pequenos, razão pela qual não serve como teste isolado de rastreamento nem exclui o diagnóstico. O gabarito registrado é A, mas a hemocromatose é fator de risco reconhecido, o que torna a alternativa A verdadeira. Vale confirmar com o tutor.","w":{"B":"Verdadeira: a cirrose é o principal fator de risco, presente em 80 a 90% dos casos de CHC.","C":"Falsa, como discutido — a NASH eleva o risco.","D":"Falsa, como discutido — a AFP se eleva em cerca de dois terços dos casos."},"p":["Rastreamento de CHC em cirróticos: ultrassonografia a cada 6 meses, com ou sem AFP. A AFP isolada tem sensibilidade e especificidade insuficientes."],"f":"EASL Clinical Practice Guidelines — Management of Hepatocellular Carcinoma; AASLD Practice Guidance on HCC; Sabiston, 21ª ed., cap. 53.","rv":"O enunciado pede a alternativa incorreta, mas duas alternativas são falsas (C e D). Confirme com o tutor."},{"v":"Vol. II","c":15,"n":3,"g":"D","s":["Em relação ao hepatocarcinoma, é correto afirmar:"],"a":{"A":"É mais frequente no mundo ocidental do que no oriental, devido ao sedentarismo e à dieta rica em gordura","B":"É mais comum em mulheres e está relacionado ao uso de anticoncepcionais","C":"A presença dessa neoplasia contraindica o transplante hepático","D":"Nos cirróticos, tem padrão multicêntrico de distribuição no parênquima hepático"},"ok":"No fígado cirrótico, toda a superfície hepática está submetida ao mesmo processo de lesão, regeneração e displasia — o que produz carcinogênese de campo. Por isso o CHC frequentemente é multicêntrico, com lesões sincrônicas independentes, e por isso a ressecção de uma lesão não elimina o risco de novas lesões no remanescente. Esse é justamente o racional que favorece o transplante em pacientes selecionados: ele remove todo o órgão em risco.","w":{"A":"Inverte a epidemiologia. O CHC é muito mais frequente no oriente (Ásia e África subsaariana), pela alta prevalência de hepatite B e de exposição à aflatoxina.","B":"Inverte o sexo. O CHC é mais comum em homens (proporção de 2 a 4:1). Anticoncepcionais associam-se ao adenoma hepatocelular, não ao CHC.","C":"Inverte a conduta. O CHC dentro dos critérios de Milão é uma das melhores indicações de transplante hepático, com sobrevida em 5 anos superior a 70%."},"p":["Por que o transplante supera a ressecção em muitos casos: trata simultaneamente o tumor e a cirrose subjacente, e elimina o risco de recidiva multicêntrica no remanescente."],"f":"EASL Guidelines; Mazzaferro V et al., NEJM 1996 — critérios de Milão; Sabiston, 21ª ed., cap. 53."},{"v":"Vol. II","c":15,"n":4,"g":"B","s":["Os tumores hepáticos benignos têm prevalência média de 9% da população, porém a maioria é assintomática. Em relação a essas lesões, assinale a correta:"],"a":{"A":"Os hemangiomas são os tumores hepáticos mais comuns, em sua maioria múltiplos e menores que 5 cm","B":"A imagem típica do hemangioma na TC com contraste é impregnação globular periférica na fase arterial, com distribuição centrípeta, completando o enchimento na fase venosa","C":"Os adenomas têm risco de sangramento aumentado em gestantes e em uso de anticoncepcional, tendo indicação de ressecção nessas pacientes","D":"A hiperplasia nodular focal é lesão não neoplásica, sem impregnação do contraste na fase arterial nem na fase tardia, observando-se a cicatriz central"},"ok":"Questão idêntica à número 11 do Caso 13. O padrão de realce do hemangioma — captação globular periférica na fase arterial com preenchimento centrípeto progressivo — é característico e permite o diagnóstico por imagem, dispensando biópsia (que é contraindicada pelo risco hemorrágico).","w":{"A":"Erra a frequência e o padrão: a maioria dos hemangiomas é única e pequena; os gigantes (> 5 cm) são minoria.","C":"Meia verdade. O risco de sangramento realmente aumenta com estrogênios e gestação, mas a indicação de ressecção não decorre automaticamente disso — depende de tamanho (> 5 cm), subtipo molecular e persistência após suspensão do anticoncepcional.","D":"Descreve o oposto: a HNF apresenta realce arterial intenso e homogêneo, com cicatriz central que capta contraste na fase tardia. Fonte: Sabiston, 21ª ed., cap. 53; EASL Clinical Practice Guidelines on the management of benign liver tumours."},"p":[],"f":""},{"v":"Vol. II","c":15,"n":5,"g":"A","s":["Colangiocarcinoma tipo IIIa de Bismuth, sem contraindicações cirúrgicas, deve considerar incluída em sua cirurgia curativa:"],"a":{"A":"Hepatectomia direita associada","B":"Hepatectomia esquerda associada","C":"Transplante hepático","D":"Meso-hepatectomia"},"ok":"A classificação de Bismuth-Corlette para tumores peri-hilares: I — abaixo da confluência; II — atinge a confluência; IIIa — estende-se ao ducto hepático direito; IIIb — estende-se ao ducto hepático esquerdo; IV — acomete ambos os ductos ou é multifocal. No tipo IIIa, com invasão do sistema ductal direito, a ressecção R0 exige hepatectomia direita associada à ressecção da via biliar extra-hepática, com linfadenectomia e hepaticojejunostomia em Y de Roux.","w":{"B":"A hepatectomia esquerda é a operação do tipo IIIb. É o erro simétrico que a questão explora.","C":"O transplante hepático tem papel restrito no colangiocarcinoma peri- hilar, em protocolos específicos (como o da Mayo Clinic, com quimiorradioterapia neoadjuvante e estadiamento cirúrgico rigoroso), para tumores irressecáveis muito selecionados — não como conduta padrão no IIIa ressecável.","D":"A meso-hepatectomia (ressecção dos segmentos IV, V e VIII) não é a operação indicada nesse cenário."},"p":["Além da hepatectomia, a ressecção do colangiocarcinoma peri-hilar sempre inclui a ressecção do segmento I (lobo caudado), cujos ductos drenam diretamente na confluência — omiti-lo compromete a margem."],"f":"Bismuth H, Corlette MB — Intrahepatic cholangioenteric anastomosis in carcinoma of the hilus; Sabiston, 21ª ed., cap. 54; NCCN Guidelines — Hepatobiliary Cancers."},{"v":"Vol. II","c":15,"n":6,"g":"D","s":["José foi levado à reunião clínica com câncer de vesícula incidental e optou-se por não haver necessidade de cirurgia complementar, estando o paciente já devidamente tratado. Qual o provável estadiamento T dessa lesão?"],"a":{"A":"T1b","B":"T1c","C":"T2","D":"T1a"},"ok":"O câncer de vesícula incidental — descoberto no anatomopatológico após colecistectomia por doença litiásica — só dispensa reabordagem no estádio T1a, em que o tumor invade apenas a lâmina própria. Nesse estágio, o risco de acometimento linfonodal é inferior a 2% e a colecistectomia simples com margem cística livre é considerada curativa.","w":{"A":"T1b invade a camada muscular, com risco linfonodal de 10 a 15% — exige reabordagem com ressecção do leito hepático (segmentos IVb e V) e linfadenectomia do hilo.","B":"\"T1c\" não existe na classificação do câncer de vesícula. É distrator de nomenclatura.","C":"T2 invade o tecido conjuntivo perimuscular, com risco linfonodal de 30 a 50% — reabordagem obrigatória. Distingue-se T2a (lado peritoneal) de T2b (lado hepático, pior prognóstico)."},"p":["T do câncer de vesícula: Tis in situ; T1a lâmina própria; T1b muscular; T2 conjuntivo perimuscular; T3 perfura a serosa ou invade","fígado/órgão adjacente; T4 invade a veia porta principal, a artéria hepática ou dois ou mais órgãos. Regra de ouro: T1a → nada mais. T1b em diante → reoperar (ressecção hepática dos segmentos IVb/V + linfadenectomia, com ressecção dos portais se houver invasão do ducto cístico)."],"f":"AJCC 8ª edição; NCCN Guidelines — Hepatobiliary Cancers; Sabiston, 21ª ed., cap. 54."},{"v":"Vol. II","c":15,"n":7,"g":"C","s":["Qual lesão hepática está representada na imagem apresentada?"],"a":{"A":"Hemangioma","B":"Adenoma","C":"Hiperplasia nodular focal","D":"Metástase colorretal"},"ok":"A hiperplasia nodular focal apresenta imagem característica: lesão com realce arterial intenso e homogêneo, que se torna isodensa ao parênquima nas fases seguintes, com cicatriz central estrelada que capta contraste tardiamente. Essa cicatriz, presente em cerca de dois terços dos casos, é o achado que permite o diagnóstico não invasivo.","w":{"A":"O hemangioma teria realce globular periférico com preenchimento centrípeto, padrão radiologicamente distinto e inconfundível.","B":"O adenoma tem realce arterial mas frequentemente heterogêneo, com áreas de hemorragia ou gordura, sem cicatriz central. Ocorre tipicamente em mulher usuária de anticoncepcional.","D":"A metástase colorretal é tipicamente hipovascular, com realce periférico em anel e centro hipoatenuante, geralmente múltipla e em paciente com antecedente oncológico."},"p":["A HNF é a segunda lesão hepática benigna mais comum, após o hemangioma. É uma resposta hiperplásica policlonal a uma malformação arterial — não é neoplasia. Conduta: expectante, sem necessidade de suspender anticoncepcional nem de seguimento prolongado."],"f":"Sabiston, 21ª ed., cap. 53; EASL Guidelines on benign liver tumours."},{"v":"Vol. II","c":15,"n":8,"g":"B","s":["Paciente com hepatocarcinoma nos segmentos VI/VII refere anorexia e astenia importantes e passa 40% do seu tempo útil repousando. Fazendo uma avaliação funcional, qual a classificação de Zubrod?"],"a":{"A":"1","B":"2","C":"3","D":"4"},"ok":"A escala de Zubrod é sinônimo de ECOG. O grau 2 define o paciente ambulatorial, capaz de todo autocuidado, incapaz de trabalhar, permanecendo fora do leito mais de 50% das horas de vigília. Passar 40% do tempo em repouso significa estar ativo 60% do tempo — portanto, ECOG/Zubrod 2.","w":{"A":"O grau 1 corresponde ao paciente restrito apenas a atividade física extenuante, capaz de trabalho leve e de atividades domésticas — sem a limitação descrita.","C":"O grau 3 seria repouso em mais de 50% do tempo, com autocuidado limitado.","D":"O grau 4 é o paciente totalmente incapaz, confinado ao leito 100% do tempo."},"p":["Guarde o eixo dos 50%: acima de 50% do tempo fora do leito = ECOG 2. Acima de 50% do tempo no leito = ECOG 3. Interseção: a mesma escala é cobrada no Caso 13, questão 5."],"f":"Oken MM et al. — ECOG performance status; NCCN Guidelines."},{"v":"Vol. II","c":15,"n":9,"g":"C","s":["Homem de 37 anos, com passado recente de amigdalite aguda, automedicou-se com amoxicilina associada a AINEs durante 14 dias, com último uso há 1 semana. Evolui com icterícia progressiva, náuseas, dor em HCD e colúria; nega acolia fecal ou episódios prévios. Exames: BT 23,0 (BD 19,0; BI 4,0), TGO 698, TGP 2054, leucograma 6.200, amilase 85, lipase 257. USG: lama biliar, calibre de colédoco e vias biliares intra-hepáticas normais, sem outras alterações. Qual a hipótese diagnóstica e o tratamento?"],"a":{"A":"Colangite aguda, CPRE","B":"Síndrome de Mirizzi,
