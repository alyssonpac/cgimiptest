ontinua sendo obrigatória: o GLIM é a segunda etapa, não a substitui.","C":"Os critérios fenotípicos são metade do sistema; ignorá-los descaracteriza o consenso."},"p":["Fenotípicos: perda &gt; 5% em 6 meses ou &gt; 10% além de 6 meses; IMC &lt; 20 (abaixo de 70 anos) ou &lt; 22 (acima de 70); redução de massa muscular. Etiológicos: ingestão ≤ 50% por mais de 1 semana, má absorção, ou inflamação."],"f":"Cederholm T et al., Clin Nutr — GLIM criteria for the diagnosis of malnutrition; ESPEN Guideline."},{"v":"Vol. III (autorais)","c":4,"n":8,"g":"A","s":["Paciente cirrótico Child B, com ascite, será submetido a hernioplastia umbilical eletiva. Sobre o suporte nutricional, assinale a correta:"],"a":{"A":"Recomenda-se oferta proteica de 1,2 a 1,5 g/kg/dia, com refeições fracionadas e ceia noturna rica em carboidrato","B":"A restrição proteica é obrigatória para prevenir encefalopatia hepática","C":"A oferta calórica deve ser inferior a 20 kcal/kg/dia, pelo risco de esteatose","D":"O suporte nutricional deve ser exclusivamente parenteral"},"ok":"A recomendação de restringir proteína no cirrótico foi abandonada: ela agrava a sarcopenia, que é fator independente de mortalidade e de descompensação. Recomenda-se 1,2 a 1,5 g/kg/dia de proteína e 30 a 35 kcal/kg/dia. As refeições fracionadas (4 a 6 ao dia) com ceia noturna rica em carboidrato reduzem o período de jejum noturno, que no cirrótico equivale metabolicamente a vários dias de jejum em pessoa saudável, por depleção de glicogênio hepático.","w":{"B":"Restrição proteica só se cogita, e transitoriamente, em encefalopatia refratária grave — e mesmo aí a tendência é manter a oferta e tratar com lactulose e rifaximina.","C":"Vinte quilocalorias por quilo subalimenta um paciente já sarcopênico.","D":"Não há razão para via parenteral com trato digestivo funcionante."},"p":["Em intolerância proteica documentada, prefira proteína vegetal e láctea e considere aminoácidos de cadeia ramificada (BCAA), em vez de reduzir a oferta total."],"f":"EASL Clinical Practice Guidelines on nutrition in chronic liver disease; ESPEN Guideline on clinical nutrition in liver disease; Sabiston, 21ª ed., cap. 6 e cap. 53."},{"v":"Vol. III (autorais)","c":4,"n":9,"g":"B","s":["Paciente em nutrição enteral por sonda nasogástrica evolui com diarreia (6 evacuações líquidas/dia). Qual a conduta inicial mais adequada?"],"a":{"A":"Suspender a nutrição enteral e iniciar parenteral","B":"Investigar causas medicamentosas (sorbitol em elixires, antibióticos, procinéticos), infecciosas (C. difficile) e da própria fórmula (osmolaridade, velocidade de infusão), ajustando antes de suspender","C":"Iniciar loperamida em dose alta imediatamente","D":"Aumentar a velocidade de infusão para reduzir o tempo de contato intestinal"},"ok":"A diarreia em paciente com nutrição enteral raramente decorre da dieta em si. As causas mais frequentes são medicamentosas — elixires com sorbitol, antibióticos, procinéticos, laxantes, magnésio — e infecciosas, sobretudo C. difficile. Fatores da fórmula (osmolaridade alta, infusão rápida em bolus, fórmula fria, ausência de fibra) também contribuem. A conduta é investigar e ajustar, mantendo a via enteral sempre que possível.","w":{"A":"Suspender a enteral e migrar para parenteral é a resposta reflexa e errada: perde-se o trofismo intestinal e adiciona-se risco infeccioso para tratar um problema geralmente reversível.","C":"Antidiarreico antes de excluir C. difficile pode precipitar megacólon tóxico.","D":"Aumentar a velocidade agrava a diarreia osmótica. O ajuste correto costuma ser reduzir a velocidade ou passar de bolus para infusão contínua."},"p":["Ajustes úteis: infusão contínua em vez de bolus, fórmula isosmolar com fibra solúvel, revisão de medicações e, se C. difficile for excluído, considerar probióticos conforme protocolo institucional."],"f":"ESPEN Guideline on Clinical Nutrition in the ICU; ASPEN Guidelines; Sabiston, 21ª ed., cap. 6."},{"v":"Vol. III (autorais)","c":4,"n":10,"g":"C","s":["Sobre a terapia nutricional no pré-operatório de cirurgia oncológica, assinale a correta:"],"a":{"A":"Todo paciente oncológico deve receber nutrição parenteral por 14 dias antes da cirurgia","B":"A terapia nutricional pré-operatória não altera desfechos, servindo apenas para conforto","C":"Em pacientes com risco nutricional grave, recomenda-se terapia nutricional por 7 a 14 dias antes da cirurgia, mesmo que isso implique adiar o procedimento","D":"A imunonutrição deve ser suspensa imediatamente após a indução anestésica"},"ok":"A recomendação da ESPEN é explícita e contraintuitiva para muitos: em risco nutricional grave, o benefício de corrigir o estado nutricional supera o risco de adiar a cirurgia oncológica em 1 a 2 semanas. A terapia por 7 a 14 dias reduz complicações infecciosas, deiscência e tempo de internação. É uma das poucas situações em que se posterga deliberadamente uma cirurgia de câncer.","w":{"A":"A via preferencial é oral ou enteral; a parenteral só entra quando o trato digestivo não pode ser usado ou não atinge a meta. E a indicação não é universal — depende da triagem.","B":"Contraria metanálises consistentes: em desnutridos graves, a terapia pré-operatória reduz complicações de forma significativa.","D":"A imunonutrição deve ser mantida por 5 a 7 dias no pós-operatório em pacientes desnutridos, não suspensa na indução."},"p":["Critérios de risco nutricional grave (ESPEN): perda &gt; 10–15% em 6 meses, IMC &lt; 18,5, ASG grau C ou NRS-2002 &gt; 5, albumina &lt; 3,0 g/dL sem disfunção hepática ou renal."],"f":"ESPEN Guideline on Clinical Nutrition in Surgery (Weimann A et al.); Projeto ACERTO; Sabiston, 21ª ed., cap. 6."},{"v":"Vol. III (autorais)","c":5,"n":1,"g":"C","s":["Homem de 30 anos, vítima de trauma fechado, chega com FC 128 bpm, PA 104×78 mmHg, FR 28 irpm, ansioso e confuso, com débito urinário de 15 mL/h. Segundo a classificação de choque hemorrágico do ATLS, qual a classe e a perda volêmica estimada?"],"a":{"A":"Classe I — até 15% da volemia","B":"Classe II — 15 a 30%","C":"Classe III — 31 a 40%","D":"Classe IV — mais de 40%"},"ok":"A classe III é definida por taquicardia acentuada (&gt; 120 bpm), queda da pressão sistólica, taquipneia, débito urinário reduzido (5 a 15 mL/h) e alteração do estado mental — ansiedade evoluindo para confusão. Corresponde à perda de 31 a 40% da volemia, ou cerca de 1.500 a 2.000 mL em um adulto. É a classe em que a hipotensão finalmente aparece.","w":{"A":"Na classe I o paciente está essencialmente normal, com FC abaixo de 100 e PA e diurese preservadas.","B":"Na classe II há taquicardia (100–120) e queda da pressão de pulso por vasoconstrição (a diastólica sobe), mas a sistólica ainda é normal — é a fase \"compensada\". O paciente do enunciado já perdeu essa compensação.","D":"Na classe IV o paciente está letárgico, com PA muito baixa, pulso filiforme e diurese desprezível."},"p":["O sinal mais precoce de choque não é a hipotensão, e sim o estreitamento da pressão de pulso (classe II). Esperar a hipotensão para diagnosticar choque significa perder a fase compensada. Em crianças, idosos e atletas, a resposta é atípica: crianças compensam muito e descompensam abruptamente; idosos em betabloqueador podem não taquicardizar."],"f":"ATLS, 10ª ed., cap. 3 (Choque); Sabiston, 21ª ed., cap. 17."},{"v":"Vol. III (autorais)","c":5,"n":2,"g":"D","s":["Paciente politraumatizado com sangramento maciço recebe protocolo de transfusão. Sobre a ressuscitação hemostática, assinale a correta:"],"a":{"A":"A reposição inicial deve ser feita com grandes volumes de cristaloide até a normalização da PA","B":"O ácido tranexâmico deve ser administrado apenas após 6 horas do trauma","C":"A relação ideal entre hemocomponentes é 4 unidades de concentrado de hemácias para 1 de plasma","D":"A transfusão balanceada em proporção próxima a 1:1:1 (hemácias, plasma e plaquetas) e o ácido tranexâmico nas 3 primeiras horas fazem parte da ressuscitação hemostática"},"ok":"A ressuscitação hemostática moderna substituiu a reposição volumosa de cristaloide pela transfusão balanceada de hemácias, plasma e plaquetas em proporção aproximada de 1:1:1, que reproduz o sangue total e previne a coagulopatia dilucional. O ácido tranexâmico deve ser administrado nas primeiras 3 horas — o estudo CRASH-2 mostrou redução de mortalidade, e após 3 horas o efeito pode ser deletério.","w":{"A":"O excesso de cristaloide dilui fatores de coagulação, causa acidose hiperclorêmica, hipotermia e edema, agravando a tríade letal. Hoje se pratica hipotensão permissiva (PAS ~90 mmHg) até o controle da hemorragia, exceto no TCE.","B":"Inverte a janela terapêutica: o benefício está nas 3 primeiras horas, e o uso tardio aumenta a mortalidade por sangramento.","C":"Proporção 4:1 é justamente a prática antiga que gerava coagulopatia. O ensaio PROPPR consolidou o 1:1:1."},"p":["Tríade letal: hipotermia, acidose e coagulopatia. A ressuscitação hemostática ataca as três — aquece fluidos, evita cristaloide e repõe fatores."],"f":"ATLS, 10ª ed., cap. 3; CRASH-2 Collaborators, Lancet; Holcomb JB et al., JAMA — PROPPR trial."},{"v":"Vol. III (autorais)","c":5,"n":3,"g":"A","s":["Homem de 24 anos, vítima de ferimento por arma branca em região precordial, chega hipotenso (PA 80×60), com turgência jugular, bulhas abafadas e murmúrio vesicular presente e simétrico. Qual a conduta imediata?"],"a":{"A":"Toracotomia de reanimação ou pericardiocentese, conforme a disponibilidade, com ressuscitação simultânea","B":"Drenagem torácica esquerda imediata","C":"Tomografia de tórax para confirmar o diagnóstico","D":"Intubação e observação em UTI, aguardando estabilização"},"ok":"A tríade de Beck — hipotensão, turgência jugular e abafamento de bulhas — com murmúrio vesicular preservado define tamponamento cardíaco, que no trauma penetrante precordial é altamente provável. O tratamento é a descompressão do saco pericárdico: idealmente toracotomia anterolateral esquerda de reanimação com pericardiotomia (ou esternotomia, se houver estrutura), sendo a pericardiocentese uma medida temporizadora quando a cirurgia não é imediatamente possível.","w":{"B":"A drenagem torácica é o tratamento do pneumotórax hipertensivo e do hemotórax — e o murmúrio simétrico exclui ambos. Drenar não resolve tamponamento.","C":"Levar um paciente em tamponamento ao tomógrafo é potencialmente fatal. O FAST à beira do leito (janela subxifoide) pode confirmar em segundos, mas não deve retardar a intervenção.","D":"Tamponamento não se resolve com observação: a pressão pericárdica progressiva leva a AESP."},"p":["Diferencial da turgência jugular no trauma: pneumotórax hipertensivo (murmúrio abolido, hipertimpanismo, desvio de","traqueia) × tamponamento (murmúrio simétrico, bulhas abafadas) × falência de VD por contusão miocárdica."],"f":"ATLS, 10ª ed., cap. 4; Sabiston, 21ª ed., cap. 17."},{"v":"Vol. III (autorais)","c":5,"n":4,"g":"B","s":["Paciente de 58 anos, vítima de atropelamento, apresenta movimento paradoxal de um segmento da parede torácica direita, com fraturas de arcos costais em dois pontos. Evolui com hipoxemia progressiva. Qual o principal determinante da insuficiência respiratória nesse quadro?"],"a":{"A":"O movimento paradoxal do segmento instável, que reduz o volume corrente","B":"A contusão pulmonar subjacente ao segmento fraturado","C":"A dor isolada, sem componente parenquimatoso","D":"O pneumotórax hipertensivo invariavelmente associado"},"ok":"O conceito moderno do tórax instável (flail chest) é que a insuficiência respiratória decorre principalmente da contusão pulmonar subjacente, e não da mecânica paradoxal em si. A energia que fraturou múltiplos arcos em dois pontos foi transmitida ao parênquima, gerando hemorragia alveolar, edema e shunt. O tratamento é, portanto, dirigido ao pulmão: analgesia eficaz (idealmente bloqueio regional ou peridural), fisioterapia, oxigenação e ventilação quando necessária, com restrição hídrica criteriosa.","w":{"A":"A mecânica paradoxal contribui, mas ensaios e séries mostraram que a hipoxemia acompanha a contusão, não a instabilidade da parede.","C":"A dor é fator importante — limita a tosse e a inspiração profunda —, mas há componente parenquimatoso evidente pela hipoxemia progressiva.","D":"O pneumotórax pode coexistir, mas não é invariável nem é o mecanismo principal. \"Invariavelmente\" é um absoluto falso."},"p":["A contusão pulmonar tem evolução característica: piora nas primeiras 24 a 48 horas. Radiografia inicial pode ser normal; a TC é bem mais sensível. A fixação cirúrgica de arcos costais tem indicações selecionadas (tórax instável com falha de desmame, deformidade importante, toracotomia por outra razão)."],"f":"ATLS, 10ª ed., cap. 4; Sabiston, 21ª ed., cap. 17 e cap. 57; EAST Guidelines on rib fractures."},{"v":"Vol. III (autorais)","c":5,"n":5,"g":"C","s":["Homem de 40 anos, vítima de desaceleração em colisão frontal em alta velocidade. Radiografia de tórax mostra alargamento do mediastino, apagamento do botão aórtico e desvio da traqueia para a direita. Está hemodinamicamente estável. Qual a conduta mais adequada?"],"a":{"A":"Toracotomia esquerda imediata","B":"Observação clínica com radiografias seriadas","C":"Angiotomografia de tórax para confirmar lesão traumática de aorta, com controle rigoroso da pressão arterial e da frequência cardíaca enquanto se planeja o reparo","D":"Ecocardiograma transtorácico como exame definitivo"},"ok":"Os achados descritos sugerem lesão traumática da aorta torácica, tipicamente no istmo (logo após a subclávia esquerda), onde a aorta relativamente móvel se fixa ao ligamento arterioso — ponto de máxima tensão na desaceleração. O exame de escolha é a angiotomografia. Enquanto se planeja o reparo (hoje predominantemente endovascular/TEVAR), institui-se controle anti-impulso: betabloqueador para manter FC em torno de 60 bpm e PAS em torno de 100–120 mmHg, reduzindo a tensão de parede.","w":{"A":"Toracotomia sem confirmação diagnóstica em paciente estável é conduta inadequada. E, mesmo confirmada, a abordagem preferencial hoje é endovascular.","B":"Observação isolada em suspeita de lesão aórtica é inaceitável: a ruptura completa é catastrófica e frequentemente fatal.","D":"O ecocardiograma transtorácico tem visualização ruim da aorta descendente. O transesofágico é uma alternativa em instável, mas não é o exame definitivo de escolha."},"p":["Outros sinais radiográficos de suspeita: obliteração da janela aortopulmonar, desvio da sonda nasogástrica para a direita, depressão do brônquio-fonte esquerdo, capuz pleural apical, fratura de primeiro e segundo arcos costais ou de escápula."],"f":"ATLS, 10ª ed., cap. 4; Sabiston, 21ª ed., cap. 17 e cap. 61; SVS Guidelines on blunt thoracic aortic injury."},{"v":"Vol. III (autorais)","c":5,"n":6,"g":"A","s":["Paciente vítima de ferimento por arma branca em hemitórax esquerdo, na linha axilar anterior, no 7º espaço intercostal. Estável, sem alterações à radiografia. Qual a","preocupação principal e a conduta?"],"a":{"A":"Lesão diafragmática oculta; considerar videotoracoscopia ou videolaparoscopia diagnóstica","B":"Nenhuma; alta com orientação, pois a radiografia é normal","C":"Lesão de aorta descendente; solicitar angiotomografia","D":"Contusão miocárdica; solicitar troponina seriada"},"ok":"Ferimentos penetrantes na área toracoabdominal — entre a linha intermamilar (4º EIC anteriormente, 6º posteriormente) e o rebordo costal — podem atravessar o diafragma. A lesão diafragmática à esquerda é particularmente relevante porque, sem o fígado como tampão, evolui com herniação visceral tardia, encarceramento e estrangulamento, às vezes anos depois. A radiografia é insensível para lesões pequenas, e por isso se recomenda investigação ativa por vídeo (toracoscopia ou laparoscopia) em paciente estável.","w":{"B":"Dar alta assumindo que a radiografia normal exclui lesão diafragmática é o erro clássico desse cenário.","C":"A aorta descendente está em topografia posterior e medial; o trajeto descrito não a atinge tipicamente.","D":"Contusão miocárdica é preocupação de trauma fechado precordial, não de ferimento penetrante em linha axilar."},"p":["A lesão diafragmática direita é mais rara e menos propensa à herniação, pelo tamponamento hepático — mas quando ocorre, indica trauma de altíssima energia."],"f":"ATLS, 10ª ed., cap. 4 e 5; EAST Practice Management Guidelines — evaluation of diaphragmatic injuries; Sabiston, 21ª ed., cap. 17."},{"v":"Vol. III (autorais)","c":5,"n":7,"g":"D","s":["Paciente drenado por hemotórax traumático há 5 dias mantém opacificação em base do hemitórax, com dreno de baixo débito. TC confirma coágulo residual organizado ocupando cerca de 500 mL. Qual a conduta mais adequada?"],"a":{"A":"Manter o dreno e aguardar reabsorção espontânea","B":"Colocar segundo dreno de grosso calibre no mesmo espaço","C":"Iniciar antibioticoterapia prolongada e observar","D":"Videotoracoscopia precoce para evacuação do hemotórax retido"},"ok":"O hemotórax retido deve ser evacuado precocemente, idealmente entre o 3º e o 7º dia, porque o coágulo organizado evolui para empiema (em até 30% dos casos) e encarceramento pulmonar com fibrotórax. A videotoracoscopia é o tratamento de escolha: evacua o coágulo, permite decorticação precoce e posicionamento dirigido do dreno, com resultados superiores à colocação de novo dreno.","w":{"A":"O coágulo organizado não se reabsorve espontaneamente em volume relevante.","B":"Um segundo dreno raramente resolve — o coágulo é sólido e obstrui qualquer cateter, além de gerar novo trajeto e nova porta de infecção.","C":"Antibiótico não dissolve coágulo. Trata-se de problema mecânico, não infeccioso (ainda)."},"p":["A janela de 3 a 7 dias é importante: após esse período, a organização fibrosa dificulta a toracoscopia e pode exigir toracotomia com decorticação formal."],"f":"EAST Practice Management Guidelines — management of retained hemothorax; Sabiston, 21ª ed., cap. 17 e cap. 57."},{"v":"Vol. III (autorais)","c":5,"n":8,"g":"B","s":["Sobre a toracotomia de reanimação no departamento de emergência, assinale a alternativa correta:"],"a":{"A":"Está indicada em todos os pacientes em parada cardiorrespiratória por trauma","B":"Tem melhor resultado no trauma penetrante torácico com sinais de vida à chegada ou parada presenciada, e resultados muito ruins no trauma contuso","C":"É contraindicada em ferimento por arma branca precordial","D":"Seu principal objetivo é a massagem cardíaca externa mais eficaz"},"ok":"A toracotomia de reanimação tem indicações estreitas e resultados fortemente dependentes do mecanismo. A melhor sobrevida ocorre no trauma penetrante torácico, sobretudo por arma branca precordial com tamponamento, quando há sinais de vida à chegada ou parada presenciada — sobrevida de 20 a 35% em séries selecionadas. No trauma contuso, a sobrevida é inferior a 1 a 2%, o que praticamente a desaconselha.","w":{"A":"Indicá-la para toda parada traumática é desperdício de recurso e exposição da equipe, com sobrevida desprezível na maioria dos cenários.","C":"Justamente o oposto: o ferimento por arma branca precordial é a melhor indicação.","D":"Os objetivos são: liberar tamponamento pericárdico, controlar hemorragia intratorácica, realizar massagem cardíaca interna, clampear a aorta descendente (redistribuindo fluxo para cérebro e coração) e controlar embolia gasosa."},"p":["Alternativa moderna menos invasiva: REBOA (balão de oclusão aórtica endovascular ressuscitativa), em cenários selecionados de hemorragia infradiafragmática."],"f":"ATLS, 10ª ed., cap. 4; EAST Practice Management Guideline — emergency department thoracotomy; Sabiston, 21ª ed., cap. 17."},{"v":"Vol. III (autorais)","c":5,"n":9,"g":"C","s":["Em um acidente com múltiplas vítimas e recursos insuficientes para atender a todos simultaneamente, qual princípio de triagem deve orientar o atendimento?"],"a":{"A":"Atender primeiro os mais graves, independentemente da probabilidade de sobrevida","B":"Atender por ordem de chegada","C":"Atender primeiro os pacientes com maior chance de sobrevida com o menor consumo de tempo, pessoal e material","D":"Atender primeiro as vítimas em parada cardiorrespiratória"},"ok":"Essa é a distinção central da triagem. Em incidente com múltiplas vítimas, em que os recursos são suficientes, prioriza-se o mais grave. Em desastre em massa, com recursos insuficientes, o princípio muda para o maior bem para o maior número: prioriza-se quem tem maior chance de sobreviver com menor consumo de recursos, aceitando-se conscientemente que vítimas com lesões incompatíveis com a sobrevida nas condições disponíveis recebam apenas medidas de conforto.","w":{"A":"Esse é o princípio do atendimento cotidiano e do incidente com recursos adequados — não do desastre em massa.","B":"Ordem de chegada não é critério clínico em nenhuma circunstância de trauma.","D":"Priorizar vítimas em parada em cenário de recursos escassos consumiria toda a equipe por um desfecho improvável, custando outras vidas salváveis."},"p":["Categorias de triagem por cor: vermelho (imediato, prioridade 1), amarelo (urgente, prioridade 2), verde (não urgente, deambulante), preto/cinza (expectante — lesão incompatível com sobrevida nas condições disponíveis)."],"f":"ATLS, 10ª ed., cap. 1 e Apêndice sobre desastres; Sabiston, 21ª ed., cap. 17."},{"v":"Vol. III (autorais)","c":5,"n":10,"g":"B","s":["Sobre a cricotireoidostomia, assinale a alternativa correta:"],"a":{"A":"É o método de escolha para via aérea definitiva em todos os politraumatizados","B":"Está indicada quando não se consegue intubar nem ventilar, sendo a cirúrgica evitada em crianças pequenas pelo risco de estenose subglótica","C":"A traqueostomia de urgência é preferível à cricotireoidostomia na sala de emergência","D":"A cricotireoidostomia por punção permite ventilação adequada por tempo indefinido"},"ok":"A cricotireoidostomia é a via aérea cirúrgica de resgate no cenário \"não intubo, não ventilo\". A membrana cricotireóidea é superficial, avascular e de fácil acesso. Em crianças pequenas (habitualmente abaixo de 12 anos), a técnica cirúrgica é evitada pelo risco de estenose subglótica, preferindo- se a cricotireoidostomia por punção com ventilação a jato como medida temporária.","w":{"A":"Não é método de escolha, e sim de resgate. A via preferencial é sempre a intubação orotraqueal.","C":"Inverte a preferência. A traqueostomia de urgência é mais demorada, mais sangrante e tecnicamente mais difícil na emergência — a cricotireoidostomia é o procedimento de escolha nesse contexto.","D":"A cricotireoidostomia por punção permite oxigenação, mas a ventilação é inadequada: o CO₂ se acumula progressivamente, limitando seu uso a cerca de 30 a 45 minutos, tempo para obter via aérea definitiva."},"p":["Após a estabilização, a cricotireoidostomia deve ser convertida em traqueostomia formal, se a necessidade de via aérea artificial for prolongada."],"f":"ATLS, 10ª ed., cap. 2; Sabiston, 21ª ed., cap. 17."},{"v":"Vol. III (autorais)","c":6,"n":1,"g":"B","s":["Paciente de 26 anos, vítima de trauma contuso, estável, com TC evidenciando laceração esplênica de 4 cm de profundidade acometendo vasos trabeculares, com blush de contraste intraparenquimatoso. Hemodinamicamente estável após 1.000 mL de cristaloide. Qual a conduta mais adequada?"],"a":{"A":"Esplenectomia total imediata","B":"Manter o tratamento não operatório associado a angioembolização do baço","C":"Laparotomia com esplenorrafia","D":"Observação clínica isolada, sem intervenção adicional"},"ok":"O blush de contraste indica sangramento arterial ativo ou pseudoaneurisma e é o principal preditor de falha do tratamento não operatório isolado. Em paciente estável, a conduta que combina preservação do órgão com controle do sangramento é o tratamento não operatório associado à angioembolização, que eleva a taxa de sucesso do TNO no baço para acima de 90%.","w":{"A":"A esplenectomia em paciente estável desperdiça a função imunológica do baço e expõe ao risco vitalício de OPSI, sem necessidade.","C":"A esplenorrafia caiu em desuso, substituída pela angioembolização, tecnicamente mais simples e menos mórbida.","D":"Observação isolada com blush ativo tem taxa de falha elevada, com risco de deterioração súbita."},"p":["AAST para baço: I hematoma subcapsular &lt; 10% ou laceração &lt; 1 cm; II 10–50% ou laceração 1–3 cm; III &gt; 50%, hematoma roto, ou laceração &gt; 3 cm; IV laceração com desvascularização &gt; 25%; V baço pulverizado ou avulsão hilar. Na versão de 2018, qualquer lesão vascular (blush) eleva o grau para pelo menos III."],"f":"AAST Organ Injury Scale (revisão 2018); EAST Guidelines — nonoperative management of blunt splenic injury; Sabiston, 21ª ed., cap. 17 e cap. 56."},{"v":"Vol. III (autorais)","c":6,"n":2,"g":"D","s":["Paciente no 2º dia de pós-operatório de laparotomia por trauma, com abdome tenso, pressão de pico inspiratório elevada, oligúria progressiva e instabilidade hemodinâmica. Pressão intravesical de 26 mmHg. Qual a conduta?"],"a":{"A":"Aumentar a sedação e a reposição volêmica","B":"Iniciar diurético de alça para a oligúria","C":"Solicitar TC de abdome para investigar coleção","D":"Descompressão cirúrgica com laparotomia e manutenção do abdome aberto (peritoneostomia)"},"ok":"O quadro é de síndrome compartimental abdominal: pressão intra- abdominal acima de 20 mmHg com nova disfunção orgânica (respiratória, renal e hemodinâmica). A fisiopatologia é mecânica — o aumento da pressão eleva o diafragma (reduzindo a complacência pulmonar), comprime a veia cava (reduzindo o retorno venoso) e comprime a vasculatura renal. O tratamento é a descompressão cirúrgica imediata com abdome aberto e curativo de vácuo.","w":{"A":"Sedação e volume adicionais agravam a pressão intra-abdominal, pelo edema visceral.","B":"Diurético em paciente com oligúria por compressão renal e baixo débito cardíaco é ineficaz e potencialmente danoso.","C":"TC em paciente instável com diagnóstico já estabelecido pela pressão intravesical apenas atrasa o tratamento."},"p":["Graduação da hipertensão intra-abdominal: I 12–15 mmHg; II 16–20; III 21–25; IV &gt; 25. Síndrome compartimental = PIA &gt; 20 mmHg com nova disfunção orgânica. Medidas não cirúrgicas prévias: descompressão nasogástrica e retal, sedação e bloqueio neuromuscular, drenagem percutânea de ascite, balanço hídrico negativo. Falhando, opera-se."],"f":"WSDACS/WSACS Consensus Definitions and Clinical Practice Guidelines on intra-abdominal hypertension; ATLS, 10ª ed.; Sabiston, 21ª ed., cap. 17."},{"v":"Vol. III (autorais)","c":6,"n":3,"g":"A","s":["Paciente vítima de trauma abdominal fechado por guidão de bicicleta, atendido 8 horas após o evento, com dor epigástrica persistente e amilase discretamente elevada. TC inicial \"sem alterações significativas\", com discreto líquido peripancreático. Qual a conduta mais adequada?"],"a":{"A":"Manter alta suspeição para lesão de duodeno e pâncreas, com observação, reavaliação clínica seriada e nova imagem em 6–12 h","B":"Alta hospitalar, pois a TC foi normal","C":"Laparotomia exploradora imediata","D":"Iniciar dieta oral livre e reavaliar em 48 h"},"ok":"O trauma de duodeno e pâncreas é o grande vilão do diagnóstico tardio no trauma abdominal. São órgãos retroperitoneais, mal avaliados pelo FAST e pelo LPD, e a TC precoce pode ser falsamente tranquilizadora — o líquido peripancreático discreto é frequentemente o único sinal inicial. O mecanismo por guidão é clássico (compressão contra a coluna). A conduta é vigilância ativa com reavaliação clínica e nova imagem, porque o diagnóstico tardio eleva drasticamente a morbimortalidade.","w":{"B":"Alta com dor persistente e líquido peripancreático é a armadilha exata dessa questão.","C":"Laparotomia sem indicação estabelecida em paciente estável, com achados sutis, é conduta desproporcional nesse momento — embora deterioração clínica a justifique depois.","D":"Dieta oral livre em suspeita de lesão duodenopancreática pode precipitar complicação e mascara a evolução."},"p":["A amilase isolada tem valor limitado no trauma, mas amilase que sobe em dosagens seriadas aumenta muito a suspeição de lesão pancreática.","Interseção: o duodeno também aparece na questão do hematoma duodenal em criança, que frequentemente é manejado de forma conservadora."],"f":"ATLS, 10ª ed., cap. 5; EAST Guidelines — management of duodenal and pancreatic injuries; Sabiston, 21ª ed., cap. 17."},{"v":"Vol. III (autorais)","c":6,"n":4,"g":"C","s":["Paciente com trauma raquimedular cervical apresenta hipotensão (PA 78×44), bradicardia (FC 48) e extremidades quentes e bem perfundidas. Qual o diagnóstico e a conduta?"],"a":{"A":"Choque hipovolêmico; ressuscitação volêmica agressiva","B":"Choque cardiogênico; iniciar dobutamina","C":"Choque neurogênico; reposição volêmica criteriosa associada a vasopressor, após exclusão de sangramento","D":"Choque séptico; iniciar antibiótico de amplo espectro"},"ok":"O choque neurogênico decorre da perda do tônus simpático por lesão medular acima de T6: há vasodilatação com queda da resistência vascular periférica e, caracteristicamente, bradicardia (por predomínio vagal sem oposição) e extremidades quentes. É o oposto do choque hipovolêmico, em que há taquicardia e extremidades frias. O tratamento é volume criterioso associado a vasopressor (noradrenalina ou fenilefrina), sempre depois de excluir hemorragia, que é a causa mais comum de hipotensão no politraumatizado.","w":{"A":"Volume isolado e agressivo em choque neurogênico causa edema pulmonar sem corrigir a vasoplegia. Mas a hipovolemia deve ser sempre excluída primeiro.","B":"Não há falência de bomba; o problema é de continente, não de conteúdo nem de bomba.","D":"Nada no quadro sugere infecção, e a sepse cursaria com taquicardia."},"p":["Distinção terminológica cobrada: choque neurogênico é hemodinâmico (hipotensão e bradicardia). Choque medular é neurológico — perda transitória de toda a função medular abaixo da lesão, com arreflexia e flacidez, que se resolve em dias a semanas (retorno do reflexo bulbocavernoso marca o fim)."],"f":"ATLS, 10ª ed., cap. 7; Sabiston, 21ª ed., cap. 17 e cap. 68."},{"v":"Vol. III (autorais)","c":6,"n":5,"g":"B","s":["Paciente com trauma cervical apresenta perda motora e da sensibilidade dolorosa e térmica abaixo da lesão, com preservação da propriocepção, do tato discriminativo e da sensibilidade vibratória. Qual a síndrome medular?"],"a":{"A":"Síndrome medular central","B":"Síndrome da artéria espinhal anterior","C":"Síndrome de Brown-Séquard","D":"Síndrome do cone medular"},"ok":"A síndrome da artéria espinhal anterior compromete os dois terços anteriores da medula, poupando os cordões posteriores (irrigados pelas artérias espinhais posteriores). Por isso há perda motora (trato corticoespinhal) e perda da sensibilidade dolorosa e térmica (trato espinotalâmico), com preservação de propriocepção, tato discriminativo e vibração. É a síndrome incompleta de pior prognóstico de recuperação.","w":{"A":"A síndrome medular central cursa com déficit motor desproporcionalmente maior nos membros superiores que nos inferiores, com graus variáveis de perda sensitiva. É a mais comum, típica do idoso com espondilose e trauma em hiperextensão.","C":"A síndrome de Brown-Séquard (hemissecção medular) cursa com perda motora e proprioceptiva ipsilateral e perda de dor e temperatura contralateral. É a de melhor prognóstico.","D":"A síndrome do cone medular cursa com arreflexia vesical e intestinal, anestesia em sela e graus variáveis de fraqueza de membros inferiores."},"p":["Prognóstico das síndromes incompletas, do melhor para o pior: Brown-Séquard &gt; medular central &gt; artéria espinhal anterior."],"f":"ATLS, 10ª ed., cap. 7; Sabiston, 21ª ed., cap. 68."},{"v":"Vol. III (autorais)","c":6,"n":6,"g":"D","s":["Paciente com TCE grave, monitorizado com cateter de PIC. PIC 25 mmHg e PAM 75 mmHg. Qual a pressão de perfusão cerebral e qual a implicação?"],"a":{"A":"PPC 100 mmHg; adequada, sem necessidade de intervenção","B":"PPC 25 mmHg; adequada, pois o alvo é 20–30 mmHg","C":"PPC 75 mmHg; excessiva, devendo-se reduzir a PAM","D":"PPC 50 mmHg; abaixo do alvo, sendo necessário reduzir a PIC e/ou elevar a PAM"},"ok":"PPC = PAM − PIC = 75 − 25 = 50 mmHg. O alvo recomendado pela Brain Trauma Foundation é de 60 a 70 mmHg. Uma PPC de 50 configura risco de isquemia cerebral secundária. A correção se faz por duas vias: reduzir a PIC (cabeceira a 30°, sedação e analgesia, drenagem liquórica, osmoterapia com salina hipertônica ou manitol, e, se necessário, craniectomia descompressiva) e/ou elevar a PAM com volume e vasopressor.","w":{"A":"Confunde a fórmula, somando em vez de subtrair.","B":"Confunde PPC com o alvo de PIC, que é abaixo de 22 mmHg.","C":"Interpreta a PAM como se fosse a PPC e propõe conduta oposta à necessária."},"p":["Alvos no TCE grave: PIC &lt; 22 mmHg, PPC 60–70 mmHg, PaCO₂ 35–40 mmHg (hiperventilação apenas como ponte em herniação iminente), SatO₂ &gt; 94%, PAS &gt; 110 mmHg, normotermia e normoglicemia. É por isso que a hipotensão é tão letal no TCE: com a PIC alta, qualquer queda de PAM colapsa a perfusão."],"f":"Brain Trauma Foundation Guidelines for the Management of Severe TBI, 4ª ed.; ATLS, 10ª ed., cap. 6."},{"v":"Vol. III (autorais)","c":6,"n":7,"g":"A","s":["Homem de 78 anos, em uso de varfarina, sofre queda da própria altura há 3 semanas. Evolui com cefaleia progressiva, alteração comportamental e hemiparesia leve. TC de crânio evidencia coleção em crescente, hipodensa, sobre a convexidade, cruzando linhas de sutura. Qual o diagnóstico?"],"a":{"A":"Hematoma subdural crônico","B":"Hematoma extradural agudo","C":"Hemorragia subaracnóidea traumática","D":"Contusão parenquimatosa"},"ok":"O hematoma subdural crônico decorre da ruptura de veias-ponte, favorecida pela atrofia cerebral do idoso (que estira essas veias) e pela anticoagulação. Sua imagem é em crescente (côncavo-convexa), acompanha a convexidade e cruza as suturas — porque o espaço subdural não é limitado por elas. A cronicidade (3 semanas) explica a hipodensidade. O tratamento, quando sintomático, é a drenagem por trepanação.","w":{"B":"O hematoma extradural tem forma biconvexa (lentiforme), não cruza suturas (a dura é aderida a elas), decorre tipicamente da artéria meníngea média e é agudo, com intervalo lúcido.","C":"A hemorragia subaracnóidea traumática se distribui pelos sulcos e cisternas, não como coleção em crescente sobre a convexidade.","D":"A contusão parenquimatosa é intra-axial, tipicamente em polos frontais e temporais, com aspecto heterogêneo de \"sal e pimenta\"."},"p":["Densidade e tempo no subdural: agudo hiperdenso (até 3 dias), subagudo isodenso (3 dias a 3 semanas — o mais difícil de ver), crônico hipodenso (após 3 semanas)."],"f":"ATLS, 10ª ed., cap. 6; Sabiston, 21ª ed., cap. 68; Brain Trauma Foundation Guidelines."},{"v":"Vol. III (autorais)","c":6,"n":8,"g":"C","s":["Sobre o trauma pélvico com fratura instável e hemorragia, assinale a alternativa correta:"],"a":{"A":"A laparotomia é sempre o primeiro passo, para controle direto do sangramento retroperitoneal","B":"O uso da faixa pélvica (binder) está contraindicado antes da radiografia","C":"A sequência inicial envolve estabilização mecânica com faixa pélvica, ressuscitação hemostática e, conforme o FAST, angioembolização ou packing pré-peritoneal","D":"A maioria dos sangramentos na fratura pélvica é de origem arterial"},"ok":"A hemorragia pélvica é predominantemente venosa e óssea (cerca de 80– 90%), e por isso responde bem à estabilização mecânica, que reduz o volume pélvico e favorece o tamponamento. A sequência é: faixa pélvica precoce (colocada ao nível dos trocanteres maiores, não da crista ilíaca), ressuscitação hemostática, e então FAST para discriminar sangramento intraperitoneal (laparotomia) de retroperitoneal (angioembolização ou packing pré-peritoneal extraperitoneal).","w":{"A":"Abrir o abdome descomprime o hematoma retroperitoneal contido, podendo desencadear hemorragia incontrolável. A laparotomia só se indica se houver sangramento intraperitoneal.","B":"A faixa pélvica deve ser colocada precocemente, com base na suspeita clínica, sem aguardar imagem.","D":"Inverte a proporção: apenas 10 a 20% dos sangramentos pélvicos são arteriais — e são justamente esses que se beneficiam da angioembolização."},"p":["Interseção: no Caso 6 original, a questão da fratura em livro aberto cobrava o papel do FAST nessa decisão. Aqui se completa o algoritmo."],"f":"ATLS, 10ª ed., cap. 5; WSES Guidelines — pelvic trauma; Sabiston, 21ª ed., cap. 17."},{"v":"Vol. III (autorais)","c":6,"n":9,"g":"B","s":["Paciente de 32 anos, vítima de ferimento por arma de fogo em abdome, submetido a laparotomia com ressecção de segmento de delgado, com acidose (pH 7,12), hipotermia (33,5 °C) e sangramento difuso em lençol. Qual a conduta mais adequada neste momento?"],"a":{"A":"Prosseguir com anastomose primária e fechamento definitivo da parede","B":"Realizar cirurgia abreviada (damage control): controle de hemorragia e contaminação, grampeamento das alças sem anastomose, abdome temporariamente fechado, e reoperação programada após estabilização","C":"Realizar ileostomia definitiva e fechar a parede","D":"Manter o paciente em sala até correção completa da acidose antes de encerrar o procedimento"},"ok":"O paciente apresenta a tríade letal instalada — hipotermia, acidose e coagulopatia (o \"sangramento em lençol\" é a coagulopatia manifesta). Insistir em uma cirurgia definitiva nesse estado leva a óbito na mesa. A conduta é a cirurgia de controle de danos: parar a hemorragia, conter a contaminação (grampear as alças sem reconstruir), fechar temporariamente o abdome com curativo de vácuo, levar à UTI para reaquecimento e correção metabólica, e reoperar de forma programada em 24 a 48 horas.","w":{"A":"Anastomose em paciente acidótico, hipotérmico e coagulopático tem altíssima taxa de deiscência, e o fechamento definitivo da parede predispõe à síndrome compartimental.","C":"Ileostomia definitiva é decisão que se toma na reconstrução, não na fase de controle de danos — e prolonga desnecessariamente a cirurgia.","D":"A acidose não se corrige na mesa: ela é consequência da hipoperfusão e só melhora em UTI, após controle da hemorragia e reaquecimento. Prolongar a cirurgia agrava a tríade."},"p":["Gatilhos para damage control: pH &lt; 7,2, temperatura &lt; 34 °C, INR &gt; 1,5, transfusão maciça, lesões múltiplas de difícil controle, necessidade de reavaliar viabilidade intestinal."],"f":"Rotondo MF et al., J Trauma — \"Damage control\"; ATLS, 10ª ed.; Sabiston, 21ª ed., cap. 17."},{"v":"Vol. III (autorais)","c":6,"n":10,"g":"A","s":["Sobre o uso de corticoide no trauma raquimedular agudo, segundo as evidências atuais:"],"a":{"A":"Não é recomendado de rotina, pois os estudos não demonstraram benefício funcional consistente e houve aumento de complicações infecciosas e respiratórias","B":"Deve ser administrado em todos os casos nas primeiras 8 horas, em dose alta","C":"Está indicado apenas nas lesões completas","D":"É o tratamento de escolha, substituindo a descompressão cirúrgica"},"ok":"A metilprednisolona em altas doses, popularizada pelos estudos NASCIS, foi abandonada como recomendação de rotina. As reanálises mostraram benefício funcional marginal e inconsistente, obtido em análises de subgrupo post hoc, contra aumento real de pneumonia, sepse, sangramento digestivo e hiperglicemia. Diretrizes atuais não a recomendam rotineiramente.","w":{"B":"Corresponde ao protocolo NASCIS II, hoje superado.","C":"Não há evidência que sustente indicação seletiva por completude da lesão.","D":"Corticoide jamais substituiu descompressão. O tratamento do trauma raquimedular baseia-se em imobilização, manutenção da perfusão medular (PAM 85–90 mmHg por 7 dias) e descompressão cirúrgica precoce em lesões com compressão."},"p":["Prioridades no trauma raquimedular: evitar lesão secundária. Isso significa manter oxigenação e perfusão medular — a hipotensão é tão danosa para a medula quanto para o cérebro."],"f":"ATLS, 10ª ed., cap. 7; AANS/CNS Guidelines for the Management of Acute Cervical Spine and Spinal Cord Injuries; Sabiston, 21ª ed., cap. 68."},{"v":"Vol. III (autorais)","c":7,"n":1,"g":"C","s":["Mulher de 82 anos, magra, com dor em face medial da coxa direita irradiando para o joelho, agravada pela rotação interna e extensão do quadril (sinal de Howship- Romberg). Admitida com quadro obstrutivo intestinal. Qual a hipótese diagnóstica mais provável?"],"a":{"A":"Hérnia femoral encarcerada","B":"Hérnia de Spiegel","C":"Hérnia obturadora encarcerada","D":"Hérnia lombar de Petit"},"ok":"A hérnia obturadora é rara, mas tem perfil demográfico marcante: mulher idosa, magra e multípara — daí o apelido de \"hérnia da velha magra\". O saco herniário atravessa o canal obturador e comprime o nervo obturador, produzindo o sinal de Howship-Romberg: dor na face medial da coxa que piora com extensão, abdução e rotação interna do quadril. A apresentação mais comum é obstrução intestinal, e o diagnóstico costuma ser feito por TC.","w":{"A":"A hérnia femoral produziria abaulamento palpável na raiz da coxa, abaixo do ligamento inguinal, e não dor neuropática com sinal de Howship-Romberg.","B":"A hérnia de Spiegel ocorre na linha semilunar, lateral à bainha do reto, geralmente abaixo da linha arqueada. É intraparietal e frequentemente não visível ao exame.","D":"A hérnia lombar de Petit ocorre no triângulo lombar inferior e cursa com abaulamento em flanco, sem irradiação para a coxa."},"p":["A hérnia obturadora tem a maior mortalidade entre todas as hérnias da parede abdominal (até 25–30%), pelo diagnóstico tardio em pacientes idosas e frágeis."],"f":"Sabiston, 21ª ed., cap. 44; HerniaSurge Guidelines; literatura clássica sobre hérnias raras da parede abdominal."},{"v":"Vol. III (autorais)","c":7,"n":2,"g":"B","s":["Paciente com hérnia femoral encarcerada é operado. No intraoperatório, observa-se que apenas a borda antimesentérica da alça intestinal está aprisionada no anel herniário, sem obstrução completa do lúmen. Como se denomina esse tipo de hérnia?"],"a":{"A":"Hérnia de Littré","B":"Hérnia de Richter","C":"Hérnia de Amyand","D":"Hérnia de Garengeot"},"ok":"A hérnia de Richter é aquela em que apenas parte da circunferência intestinal — a borda antimesentérica — fica aprisionada. Sua importância clínica é enorme: como o lúmen permanece parcialmente pérvio, não há obstrução intestinal, o que retarda o diagnóstico. Ainda assim, o segmento aprisionado pode necrosar e perfurar. É mais frequente em anéis pequenos e rígidos, como o femoral.","w":{"A":"A hérnia de Littré contém um divertículo de Meckel no saco herniário.","C":"A hérnia de Amyand contém o apêndice cecal dentro do saco (classicamente em hérnia inguinal direita).","D":"A hérnia de Garengeot contém o apêndice dentro de um saco de hérnia femoral — variante da Amyand, com nome próprio."},"p":["Mnemônico dos conteúdos: Richter = parede antimesentérica; Littré = Meckel; Amyand = apêndice em hérnia inguinal; Garengeot = apêndice em hérnia femoral; hérnia por deslizamento = víscera retroperitoneal (bexiga, cólon) formando parte da parede do saco."],"f":"Sabiston, 21ª ed., cap. 44; HerniaSurge Guidelines."},{"v":"Vol. III (autorais)","c":7,"n":3,"g":"D","s":["Paciente de 55 anos evolui, 8 meses após hernioplastia inguinal a Lichtenstein, com dor inguinal em queimação, com irradiação para a raiz da coxa e a base do escroto, associada a hipoestesia local. Qual o diagnóstico e a conduta inicial?"],"a":{"A":"Recidiva herniária; indicar reoperação imediata","B":"Orquite isquêmica tardia; indicar orquiectomia","C":"Infecção crônica de tela; retirar a prótese","D":"Dor inguinal crônica de origem neuropática; iniciar tratamento clínico com analgesia multimodal, neuromoduladores e bloqueio nervoso, reservando a neurectomia para casos refratários"},"ok":"A dor inguinal crônica pós-herniorrafia (inguinodinia) é a complicação mais frequente a longo prazo, atingindo 10 a 12% dos pacientes em algum grau. Quando neuropática, decorre de lesão, aprisionamento ou neuroma dos nervos ilioinguinal, ílio-hipogástrico ou ramo genital do genitofemoral — daí a dor em queimação com hipoestesia. A abordagem inicial é clínica e escalonada: analgesia multimodal, gabapentina ou pregabalina, e bloqueios diagnóstico-terapêuticos. A neurectomia (tripla) e a remoção da tela ficam para os refratários, após pelo menos 6 meses de tratamento conservador.","w":{"A":"A recidiva se manifesta como abaulamento, não como dor neuropática com hipoestesia.","B":"A orquite isquêmica é evento precoce (2 a 5 dias), autolimitado, e não se trata com orquiectomia.","C":"A infecção de tela cursaria com sinais inflamatórios, drenagem e febre, ausentes aqui."},"p":["Definição: dor persistente por mais de 3 meses após a cirurgia. Fatores de risco: dor pré-operatória, idade jovem, técnica aberta, fixação com grampos e recidiva."],"f":"HerniaSurge Group — International Guidelines for Groin Hernia Management; Sabiston, 21ª ed., cap. 44."},{"v":"Vol. III (autorais)","c":7,"n":4,"g":"A","s":["Sobre a classificação EHS (European Hernia Society) para hérnias inguinais, assinale a correta:"],"a":{"A":"Classifica em L (lateral/indireta), M (medial/direta) e F (femoral), graduando o tamanho do defeito em 1, 2 ou 3 conforme o número de \"dedos\" ou a medida em centímetros","B":"Substitui completamente a classificação de Nyhus, sendo idêntica a ela","C":"Considera apenas o tipo anatômico, sem graduar o tamanho do defeito","D":"Aplica-se exclusivamente a hérnias ventrais"},"ok":"A classificação da EHS foi criada para padronizar a descrição em cirurgia laparoscópica e em registros. Usa duas dimensões: localização — L (lateral, ou seja, indireta), M (medial, ou seja, direta) e F (femoral) — e tamanho do defeito: 1 (≤ 1,5 cm, ou um dedo), 2 (1,5 a 3 cm, dois dedos) e 3 (&gt; 3 cm). Acrescenta-se P para primária e R para recidivada.","w":{"B":"É complementar à de Nyhus, não idêntica. A EHS é mais simples e reprodutível para descrição intraoperatória; a de Nyhus é a mais cobrada em prova no Brasil.","C":"A graduação do tamanho é justamente um dos dois eixos da classificação.","D":"Há uma classificação EHS separada para hérnias ventrais e incisionais, mas a descrita aqui é a inguinal."},"p":["Utilidade prática: a EHS permite comparar séries e escolher técnica —","defeitos M3, por exemplo, têm maior recidiva e favorecem abordagem pré-peritoneal."],"f":"Miserez M et al., Hernia — The European Hernia Society groin hernia classification; HerniaSurge Guidelines."},{"v":"Vol. III (autorais)","c":7,"n":5,"g":"B","s":["Paciente cirrótico Child B, com ascite de difícil controle, apresenta hérnia umbilical volumosa com pele adelgaçada e sinais de iminência de ruptura. Qual a conduta mais adequada?"],"a":{"A":"Observação, pois a cirurgia é contraindicada em cirróticos","B":"Otimizar o controle da ascite (diuréticos, paracenteses, avaliação de TIPS) e programar o reparo, evitando aguardar a ruptura, que tem mortalidade elevada","C":"Paracentese de alívio isolada, sem reparo cirúrgico","D":"Reparo de urgência com tela de polipropileno intraperitoneal, sem controle prévio da ascite"},"ok":"A hérnia umbilical no cirrótico com ascite é uma armadilha clínica: o reparo eletivo tem morbidade, mas a ruptura espontânea (síndrome de Flood) tem mortalidade de 30 a 60%, por peritonite e falência hepática. A conduta correta é controlar a ascite primeiro — diuréticos otimizados, paracenteses seriadas, avaliação de TIPS ou de transplante — e então realizar o reparo de forma eletiva e programada, antes que a pele ulcere.","w":{"A":"\"Cirurgia contraindicada em cirróticos\" é absoluto falso. O que existe é estratificação: Child A tolera bem; Child C eletivo tem alta mortalidade.","C":"A paracentese isolada não resolve a hérnia e a ascite retorna.","D":"Operar sem controlar a ascite condena o reparo à falha: a pressão intra-abdominal elevada e o extravasamento de líquido pela ferida geram deiscência, fístula e infecção."},"p":["Escores de risco em hepatopata cirúrgico: Child-Pugh e MELD. Mortalidade em cirurgia abdominal sobe acentuadamente com MELD acima de 15 e em Child C."],"f":"Sabiston, 21ª ed., cap. 44 e cap. 53; AASLD Practice Guidance on ascites; literatura sobre hérnia umbilical no cirrótico."},{"v":"Vol. III (autorais)","c":7,"n":6,"g":"C","s":["Sobre a escolha do material da tela em reparo de hérnia da parede abdominal, assinale a correta:"],"a":{"A":"Telas microporosas multifilamentares são preferíveis em campo contaminado, por maior resistência","B":"Telas de polipropileno podem ser colocadas em contato direto com as vísceras sem risco adicional","C":"Em campo contaminado, deve-se evitar tela sintética permanente; alternativas incluem reparo com tecido próprio, telas biológicas ou sintéticas absorvíveis de longa duração","D":"A tela biológica apresenta menor taxa de recidiva que a de polipropileno em campo limpo"},"ok":"Em campo contaminado ou infectado, a tela sintética permanente — sobretudo microporosa e multifilamentar — funciona como corpo estranho colonizável, com formação de biofilme e infecção crônica que frequentemente obriga à explantação. As alternativas são o reparo com tecido próprio, telas biológicas (matriz dérmica acelular) ou sintéticas absorvíveis de longa duração (poliglicólico-trimetileno carbonato).","w":{"A":"Inverte a segurança relativa. Telas macroporosas monofilamentares de polipropileno leve são as que melhor toleram contaminação, por permitirem a entrada de macrófagos; as microporosas multifilamentares são as piores.","B":"Polipropileno em contato direto com vísceras causa aderências densas, erosão intestinal e fístula enteroatmosférica. Em posição intraperitoneal, usa-se tela com face antiaderente (composta, com PTFE, celulose oxidada ou colágeno).","D":"As telas biológicas têm recidiva maior que a de polipropileno em campo limpo, além de custo muito superior. Sua indicação é o campo contaminado."},"p":["Posições da tela na parede abdominal: onlay (sobre a aponeurose), inlay (em ponte, maior recidiva), sublay/retromuscular (posição de Rives-Stoppa, a de melhores resultados) e IPOM (intraperitoneal, exige face antiaderente)."],"f":"Ventral Hernia Working Group — Incisional ventral hernias: review and consensus; Sabiston, 21ª ed., cap. 44."},{"v":"Vol. III (autorais)","c":7,"n":7,"g":"D","s":["Paciente de 45 anos com hérnia incisional de linha média, defeito de 12 cm de largura, após laparotomia por trauma. Qual a técnica mais adequada para obter fechamento da linha alba sem tensão?"],"a":{"A":"Reparo primário com sutura contínua de fio absorvível","B":"Reparo em ponte (inlay) com tela, sem aproximar a aponeurose","C":"Reparo laparoscópico IPOM sem fechamento do defeito","D":"Separação de componentes (técnica de Ramirez ou release do transverso abdominal), associada a tela retromuscular"},"ok":"Defeitos largos (acima de 8 a 10 cm) não permitem aproximação da linha média sem tensão excessiva, o que levaria a recidiva ou a síndrome compartimental. As técnicas de separação de componentes — anterior, de Ramirez (secção da aponeurose do oblíquo externo), ou posterior, com TAR (release do músculo transverso abdominal) — permitem avançar medialmente os retos e restaurar a linha alba, associadas à tela em posição retromuscular.","w":{"A":"Reparo primário em defeito de 12 cm tem recidiva superior a 50% e alto risco de tensão.","B":"O reparo em ponte não restaura a linha alba nem a função da parede, e tem recidiva significativamente maior.","C":"O IPOM sem fechamento do defeito deixa a hérnia \"coberta\", mas não corrigida funcionalmente, com risco de abaulamento (bulging) e recidiva."},"p":["Adjuvantes pré-operatórios em hérnias gigantes com perda de domicílio: toxina botulínica na parede lateral (relaxa os músculos e aumenta o comprimento) e pneumoperitônio progressivo pré- operatório, que \"reeduca\" a cavidade."],"f":"Sabiston, 21ª ed., cap. 44; Novitsky YW et al., Ann Surg — transversus abdominis muscle release; Ramirez OM et al."},{"v":"Vol. III (autorais)","c":7,"n":8,"g":"A","s":["Gestante de 26 semanas apresenta hérnia inguinal redutível, oligossintomática, sem sinais de encarceramento. Qual a conduta mais adequada?"],"a":{"A":"Conduta expectante durante a gestação, com reparo eletivo após o parto, salvo complicação","B":"Reparo cirúrgico imediato, pelo risco de encarceramento no terceiro trimestre","C":"Cesariana eletiva antecipada com reparo simultâneo","D":"Uso de cinta compressiva permanente, contraindicando o parto vaginal"},"ok":"Hérnias inguinais redutíveis e oligossintomáticas na gestação devem ser acompanhadas. O risco de encarceramento é baixo, e boa parte dos abaulamentos regride no puerpério, com a redução da pressão intra- abdominal e o retorno hormonal ao basal. Operar durante a gestação expõe mãe e feto a risco anestésico sem benefício demonstrado. A exceção é a hérnia encarcerada ou estrangulada, que se opera independentemente da idade gestacional.","w":{"B":"A hérnia inguinal na gestante encarcera raramente. Além disso, parte dos abaulamentos inguinais na gestação são, na verdade, varicosidades do ligamento redondo, que regridem espontaneamente.","C":"Antecipar o parto por uma hérnia oligossintomática é conduta desproporcional.","D":"Não há indicação de contraindicar parto vaginal por hérnia inguinal redutível."},"p":["Se a paciente for submetida a cesariana por indicação obstétrica, o reparo simultâneo pode ser discutido, embora o campo e a distensão abdominal não sejam ideais."],"f":"HerniaSurge Guidelines; Sabiston, 21ª ed., cap. 44."},{"v":"Vol. III (autorais)","c":7,"n":9,"g":"B","s":["Sobre a hérnia de Spiegel, assinale a correta:"],"a":{"A":"Ocorre acima da linha arqueada, sendo facilmente palpável ao exame físico","B":"Ocorre na linha semilunar, geralmente abaixo da linha arqueada, é intraparietal e frequentemente não palpável, com alto risco de encarceramento","C":"É a hérnia mais comum da parede abdominal anterior","D":"Nunca requer tratamento cirúrgico, por ser assintomática"},"ok":"A hérnia de Spiegel ocorre na linha semilunar (borda lateral da bainha do reto), quase sempre abaixo da linha arqueada, onde falta o folheto posterior da bainha. Sua característica marcante é ser intraparietal: o saco se insinua entre as camadas musculares, permanecendo sob a aponeurose do oblíquo externo, e por isso frequentemente não é palpável — o diagnóstico depende de ultrassonografia ou TC. Como o anel é pequeno e fibroso, o risco de encarceramento é alto, e o reparo é indicado ao diagnóstico.","w":{"A":"Ocorre abaixo da linha arqueada e é justamente pouco palpável.","C":"É uma hérnia rara (menos de 2% das hérnias da parede abdominal). A mais comum da parede anterior é a umbilical, e da região inguinal, a indireta.","D":"Absoluto falso: o alto risco de encarceramento justifica o reparo mesmo em pacientes oligossintomáticos."},"p":["Suspeite de Spiegel diante de dor localizada na linha semilunar, sem abaulamento evidente, sobretudo se houver episódios de dor tipo cólica. A TC ou o ultrassom dinâmico (com manobra de Valsalva) fecham o diagnóstico."],"f":"Sabiston, 21ª ed., cap. 44; literatura sobre hérnias raras da parede abdominal."},{"v":"Vol. III (autorais)","c":7,"n":10,"g":"C","s":["Comparando as abordagens laparoscópicas TAPP e TEP para hérnia inguinal, assinale a correta:"],"a":{"A":"A TEP acessa a cavidade peritoneal e requer fechamento do peritônio ao final","B":"A TAPP é totalmente extraperitoneal, sem risco de lesão visceral","C":"A TAPP acessa a cavidade peritoneal, permite inspeção do lado contralateral e é útil em hérnia encarcerada; a TEP permanece no espaço pré-peritoneal, com menor risco de lesão visceral e de aderências","D":"Ambas apresentam taxa de recidiva significativamente superior à da técnica de Lichtenstein"},"ok":"A TAPP (transabdominal pré-peritoneal) entra na cavidade peritoneal, cria um retalho de peritônio, posiciona a tela no espaço pré-peritoneal e refecha o peritônio. Isso permite inspecionar a cavidade, avaliar o lado contralateral e manejar conteúdo encarcerado. A TEP (totalmente extraperitoneal) nunca entra na cavidade, o que reduz o risco de lesão visceral e de aderências, ao custo de espaço de trabalho menor e curva de aprendizado mais íngreme.","w":{"A":"Inverte as definições: quem acessa a cavidade e refecha o peritônio é a TAPP.","B":"Inverte novamente: a totalmente extraperitoneal é a TEP.","D":"As metanálises mostram recidiva equivalente entre as técnicas laparoscópicas e o Lichtenstein. As diferenças estão em dor crônica (menor nas laparoscópicas), retorno às atividades (mais rápido) e custo (maior)."},"p":["Indicações preferenciais da laparoscopia segundo as diretrizes: hérnia bilateral, recidivada após reparo anterior, e em mulheres (pela maior prevalência de hérnia femoral oculta)."],"f":"HerniaSurge Group — International Guidelines for Groin Hernia Management, Hernia 2018; Sabiston, 21ª ed., cap. 44."},{"v":"Vol. III (autorais)","c":8,"n":1,"g":"B","s":["Paciente de 68 anos com icterícia, colestase e ultrassonografia mostrando cálculo impactado no infundíbulo vesicular com dilatação da via biliar acima do nível do ducto cístico, e vesícula contraída. ColangioRM confirma estenose extrínseca do ducto hepático comum. Qual o diagnóstico?"],"a":{"A":"Colangiocarcinoma peri-hilar","B":"Síndrome de Mirizzi","C":"Coledocolitíase primária","D":"Colecistite aguda alitiásica"},"ok":"A síndrome de Mirizzi é a compressão extrínseca do ducto hepático comum por um cálculo impactado no infundíbulo vesicular ou no ducto cístico, com ou sem fístula colecistobiliar. Produz icterícia obstrutiva com dilatação apenas acima do nível da compressão, e o colédoco distal permanece de calibre normal. É importante porque aumenta muito o risco de lesão de via biliar na colecistectomia — deve ser reconhecida antes de operar.","w":{"A":"O colangiocarcinoma peri-hilar produziria estenose intrínseca, sem cálculo impactado no infundíbulo, e a vesícula estaria colabada por desuso, não contraída sobre um cálculo. É o principal diferencial, e nem sempre é possível excluí-lo antes da cirurgia.","C":"A coledocolitíase produziria dilatação de toda a via biliar, incluindo o colédoco distal.","D":"A colecistite alitiásica, por definição, não tem cálculo."},"p":["Classificação de Csendes: I compressão extrínseca sem fístula; II fístula com erosão de menos de 1/3 da circunferência do ducto; III erosão de até 2/3; IV destruição completa da parede do ducto. Tipo I costuma permitir colecistectomia (frequentemente subtotal); tipos II a IV exigem reparo biliar, por vezes com hepaticojejunostomia."],"f":"Sabiston, 21ª ed., cap. 54; Csendes A et al., Br J Surg — classificação da síndrome de Mirizzi."},{"v":"Vol. III (autorais)","c":8,"n":2,"g":"D","s":["Paciente de 72 anos, internado em UTI há 12 dias após politrauma, em ventilação mecânica e nutrição parenteral, evolui com febre, leucocitose e dor à palpação em hipocôndrio direito. USG: vesícula distendida, parede de 6 mm, lama biliar, sem cálculos, com líquido perivesicular. Qual o diagnóstico e a conduta?"],"a":{"A":"Colangite; CPRE de urgência","B":"Abscesso hepático; drenagem percutânea","C":"Colecistite litiásica; colecistectomia videolaparoscópica","D":"Colecistite aguda alitiásica; colecistostomia percutânea, dada a gravidade e o risco cirúrgico"},"ok":"A colecistite alitiásica ocorre tipicamente no paciente crítico — após trauma, grande queimadura, cirurgia de grande porte, ventilação mecânica prolongada, jejum e nutrição parenteral. A fisiopatologia envolve estase biliar (ausência de estímulo de colecistocinina), isquemia da parede vesicular e aumento da viscosidade da bile. Evolui rapidamente para gangrena e perfuração. Nesse perfil de paciente grave e de alto risco cirúrgico, a colecistostomia percutânea é a conduta de escolha, com colecistectomia diferida se e quando o paciente melhorar.","w":{"A":"Não há icterícia nem dilatação de vias biliares descritas — o quadro é vesicular, não ductal.","B":"A imagem descreve a vesícula, não uma coleção parenquimatosa hepática.","C":"O ultrassom é explícito: sem cálculos. E a colecistectomia em paciente crítico e instável tem morbimortalidade elevada."},"p":["Interseção com o Caso 4: a nutrição parenteral prolongada é fator de risco para lama e colecistite alitiásica, por ausência de contração vesicular."],"f":"Tokyo Guidelines 2018; Sabiston, 21ª ed., cap. 54."},{"v":"Vol. III (autorais)","c":8,"n":3,"g":"A","s":["Mulher de 79 anos com quadro de obstrução intestinal. Radiografia de abdome evidencia distensão de delgado, aerobilia e imagem de cálculo em fossa ilíaca","direita. Qual o diagnóstico e a conduta?"],"a":{"A":"Íleo biliar; enterolitotomia para retirada do cálculo, com abordagem da fístula em um segundo tempo (ou não abordada, em pacientes frágeis)","B":"Obstrução por brida; laparotomia com lise de aderências","C":"Volvo de sigmoide; descompressão endoscópica","D":"Neoplasia obstrutiva de delgado; ressecção segmentar"},"ok":"A tríade de Rigler — obstrução intestinal, pneumobilia (aerobilia) e cálculo ectópico — define o íleo biliar. O mecanismo é uma fístula colecistoentérica (mais comumente colecistoduodenal) por erosão crônica, pela qual um cálculo volumoso migra e impacta, tipicamente no íleo terminal, que é o segmento mais estreito. O tratamento padrão é a enterolitotomia isolada, dado o perfil habitualmente idoso e frágil do paciente; a colecistectomia com fechamento da fístula em um tempo aumenta a morbidade e é reservada a pacientes selecionados e estáveis.","w":{"B":"Brida não explica aerobilia nem cálculo ectópico. E, se a paciente nunca operou, a brida é ainda menos provável.","C":"O volvo de sigmoide produz distensão colônica em \"grão de café\", não distensão de delgado com aerobilia.","D":"Neoplasia de delgado é rara e não explicaria a pneumobilia."},"p":["Pneumobilia sem instrumentação biliar prévia (CPRE, anastomose biliodigestiva) deve sempre levantar a suspeita de fístula bilioentérica."],"f":"Sabiston, 21ª ed., cap. 54; Rigler LG et al. — descrição original da tríade."},{"v":"Vol. III (autorais)","c":8,"n":4,"g":"C","s":["Durante colecistectomia videolaparoscópica por colecistite aguda grau II, o cirurgião encontra intensa fibrose e não consegue identificar com segurança as estruturas do triângulo hepatocístico. Qual a conduta mais adequada?"],"a":{"A":"Prosseguir a dissecção até identificar o ducto cístico, mesmo que demore","B":"Clipar a estrutura tubular mais provável e completar a colecistectomia","C":"Adotar uma estratégia de bailout: colecistectomia subtotal (fenestrada ou reconstituinte) ou conversão para via aberta, com colangiografia intraoperatória se disponível","D":"Interromper o procedimento e encaminhar o paciente para CPRE"},"ok":"Quando a visão crítica de segurança não pode ser obtida, insistir na dissecção é a principal causa de lesão de via biliar. As diretrizes recomendam explicitamente uma estratégia de bailout: colecistectomia subtotal (removendo a maior parte da vesícula e deixando a parede posterior aderida ao leito, com fechamento do infundíbulo — reconstituinte — ou deixando-o aberto com dreno — fenestrada), conversão para via aberta, ou colangiografia intraoperatória para mapear a anatomia.","w":{"A":"\"Insistir até identificar\" é exatamente o comportamento que gera lesões graves, incluindo secções de colédoco confundido com cístico.","B":"Clipar \"a estrutura mais provável\" é a definição do erro de identificação errônea, mecanismo da maioria das lesões classe I de Stewart-Way.","D":"A CPRE não resolve uma colecistite aguda e não substitui o controle do foco."},"p":["Visão crítica de segurança (Strasberg): triângulo hepatocístico limpo de gordura e fibrose; terço inferior da vesícula descolado do leito;","apenas duas estruturas entrando na vesícula."],"f":"SAGES Safe Cholecystectomy Program; Strasberg SM, Brunt LM — Rationale and use of the critical view of safety; Tokyo Guidelines 2018."},{"v":"Vol. III (autorais)","c":8,"n":5,"g":"B","s":["Paciente com pancreatite aguda biliar leve, com resolução clínica em 72 horas, hepatograma normalizado e sem sinais de coledocolitíase persistente. Qual a conduta em relação à colecistectomia?"],"a":{"A":"Realizar após 6 semanas, para permitir resolução da inflamação","B":"Realizar na mesma internação, antes da alta","C":"Realizar apenas se houver novo episódio","D":"Não realizar; a CPRE com papilotomia dispensa a colecistectomia"},"ok":"A colecistectomia deve ser feita na mesma internação na pancreatite biliar leve. O ensaio PONCHO demonstrou que postergar expõe a recorrência de eventos biliares (nova pancreatite, colecistite, colangite) em cerca de 17% em poucas semanas, contra 5% na cirurgia precoce, sem aumento de complicações operatórias.","w":{"A":"Aguardar 6 semanas é o paradigma antigo, hoje contrariado pela evidência.","C":"Esperar novo episódio significa aceitar o risco de uma pancreatite grave, que pode ser fatal.","D":"A papilotomia reduz, mas não elimina, o risco de novos eventos biliares — e não previne colecistite. É estratégia de exceção, para quem não pode ser operado."},"p":["Na pancreatite biliar grave ou necrosante, a colecistectomia é postergada até a resolução do processo inflamatório e a estabilização das coleções, geralmente em 6 semanas ou mais."],"f":"da Costa DW et al., Lancet — PONCHO trial; IAP/APA Guidelines; Sabiston, 21ª ed., cap. 54 e cap. 55."},{"v":"Vol. III (autorais)","c":8,"n":6,"g":"D","s":["Paciente assintomático realiza ultrassonografia de rotina que evidencia pólipo de vesícula biliar de 12 mm, séssil, sem cálculos associados. Qual a conduta?"],"a":{"A":"Repetir ultrassonografia em 6 meses","B":"Colangiorressonância para caracterização","C":"Punção guiada para citologia","D":"Colecistectomia videolaparoscópica"},"ok":"Pólipos de vesícula ≥ 10 mm têm risco significativo de malignidade e indicam colecistectomia, independentemente de sintomas. A base séssil (em oposição a pedunculada) é fator de risco adicional. Outros critérios de indicação cirúrgica: crescimento documentado (≥ 2 mm), idade acima de 50 a 60 anos, pólipo com cálculo associado, colangite esclerosante primária e origem étnica indiana.","w":{"A":"A vigilância se aplica a pólipos menores que 10 mm sem fatores de risco: ultrassom a cada 6 meses no primeiro ano e depois anualmente por 5 anos.","B":"A colangiorressonância não caracteriza bem pólipos vesiculares; a ecoendoscopia seria mais informativa, mas com 12 mm a indicação cirúrgica já está estabelecida.","C":"A punção da vesícula é contraindicada pelo risco de disseminação peritoneal de um eventual carcinoma e de biliperitônio."},"p":["A maioria dos pólipos vesiculares é colesterolótica (pseudopólipo), benigna e pequena. O tamanho é o principal preditor de malignidade."],"f":"Joint Guidelines (ESGAR/EAES/EFISDS/ESGE) on gallbladder polyps; Sabiston, 21ª ed., cap. 54."},{"v":"Vol. III (autorais)","c":8,"n":7,"g":"A","s":["Gestante de 22 semanas apresenta segundo episódio de colecistite aguda, com boa resposta ao tratamento clínico. Qual a conduta mais adequada?"],"a":{"A":"Colecistectomia videolaparoscópica no segundo trimestre, que é o período de menor risco fetal e materno","B":"Tratamento clínico até o parto, operando apenas no puerpério","C":"Colecistostomia percutânea até o termo","D":"Colecistectomia aberta, pois a laparoscopia é contraindicada na gestação"},"ok":"A colecistite aguda recorrente na gestação tem alta taxa de novos episódios e de complicações se tratada apenas clinicamente, com risco de parto prematuro e perda fetal. A colecistectomia videolaparoscópica é segura e o segundo trimestre é a janela ideal: a organogênese já terminou (menor risco teratogênico) e o útero ainda não é volumoso o bastante para dificultar o acesso.","w":{"B":"A conduta expectante em colecistite recorrente associa-se a mais complicações maternas e fetais do que a cirurgia.","C":"A colecistostomia é medida de exceção para pacientes sem condições cirúrgicas, o que não é o caso de uma gestante hígida.","D":"A laparoscopia não é contraindicada na gestação. As precauções são: pressão de insuflação mais baixa (10–12 mmHg), acesso aberto (Hasson) para o primeiro trocarte, decúbito lateral esquerdo após 20 semanas e monitorização fetal."},"p":["Regra geral da cirurgia não obstétrica na gestação: emergências operam-se em qualquer trimestre; eletivas adiam-se para o puerpério; e as \"semi-eletivas\" preferem o segundo trimestre."],"f":"SAGES Guidelines for Diagnosis, Treatment, and Use of Laparoscopy for Surgical Problems during Pregnancy; Sabiston, 21ª ed., cap. 54."},{"v":"Vol. III (autorais)","c":8,"n":8,"g":"B","s":["Sobre variações anatômicas da via biliar relevantes para a colecistectomia, assinale a correta:"],"a":{"A":"A artéria cística origina-se da artéria hepática esquerda na maioria dos pacientes","B":"Ductos hepáticos direitos aberrantes (ducto de Luschka e variações do setorial posterior direito) são causa importante de fístula biliar e de lesão inadvertida","C":"A anatomia biliar é constante, com variações em menos de 1% da população","D":"A artéria hepática direita nunca cursa próximo ao triângulo hepatocístico"},"ok":"As variações da anatomia biliar e arterial são frequentes (presentes em 20 a 40% das pessoas) e explicam boa parte das lesões iatrogênicas. Os ductos aberrantes — os pequenos ductos subvesiculares de Luschka, que drenam diretamente no leito vesicular, e as variações de drenagem do ducto setorial posterior direito — são causa clássica de fístula biliar pós-operatória (Strasberg tipo A) e de secção inadvertida (tipos B e C).","w":{"A":"A artéria cística origina-se da artéria hepática direita em 80 a 90% dos casos.","C":"Contraria a realidade anatômica: as variações são comuns, não raras.","D":"A artéria hepática direita pode cursar em alça muito próxima ao infundíbulo (\"caterpillar hump\" ou artéria hepática direita tortuosa), sendo confundida com a artéria cística — mecanismo reconhecido de lesão arterial grave."},"p":["Prevenção: visão crítica de segurança, dissecção rente à vesícula, colangiografia intraoperatória em anatomia duvidosa, e não clipar nenhuma estrutura antes de identificá-la inequivocamente."],"f":"Sabiston, 21ª ed., cap. 54; Strasberg SM — classificação e mecanismos de lesão biliar; SAGES Safe Cholecystectomy Program."},{"v":"Vol. III (autorais)","c":8,"n":9,"g":"C","s":["Paciente de 74 anos, com múltiplas comorbidades (ICC classe III, DPOC grave, ASA IV), apresenta colecistite aguda grau III (com hipotensão em uso de vasopressor). Qual a conduta mais adequada?"],"a":{"A":"Colecistectomia videolaparoscópica de urgência","B":"Colecistectomia aberta de urgência","C":"Suporte intensivo, antibioticoterapia e drenagem vesicular (colecistostomia percutânea), com colecistectomia diferida se houver recuperação clínica","D":"Antibioticoterapia isolada, sem qualquer drenagem"},"ok":"A colecistite grau III implica disfunção orgânica. Nesse paciente, com risco cirúrgico proibitivo, o algoritmo das Tokyo Guidelines recomenda suporte intensivo, antibioticoterapia e drenagem da vesícula — habitualmente colecistostomia percutânea transhepática, que controla o foco com mínima agressão. A colecistectomia é considerada depois, de forma eletiva, se o paciente recuperar condições.","w":{"A":"e #Xb Ambas propõem cirurgia de urgência em paciente ASA IV, com disfunção orgânica e em uso de vasopressor — mortalidade elevada. A cirurgia em grau III só se cogita em centros experientes, com paciente que responde rapidamente ao suporte.","D":"Antibiótico isolado sem controle do foco em colecistite grau III tem alta taxa de falha e mortalidade."},"p":["Fluxograma resumido das TG18: grau I → colecistectomia laparoscópica precoce. Grau II → colecistectomia precoce em serviço experiente; se não, drenagem e cirurgia diferida. Grau III → suporte + antibiótico + drenagem; cirurgia diferida."],"f":"Tokyo Guidelines 2018 — flowchart for the management of acute cholecystitis; Sabiston, 21ª ed., cap. 54."},{"v":"Vol. III (autorais)","c":8,"n":10,"g":"A","s":["Paciente submetido a colecistectomia videolaparoscópica evolui, no 3º dia, com dor abdominal, distensão e drenagem de bile pelo dreno (300 mL/dia). Hemodinamicamente estável, afebril. ColangioRM: coleção subhepática, sem dilatação de vias biliares e sem descontinuidade do ducto hepático comum. Qual a conduta mais provável?"],"a":{"A":"Fístula biliar de baixo débito (Strasberg tipo A, provável coto cístico ou ducto de Luschka); drenagem da coleção e CPRE com papilotomia e/ou prótese","B":"Lesão completa do colédoco; hepaticojejunostomia imediata","C":"Coledocolitíase residual; nova colecistectomia","D":"Observação isolada, sem intervenção"},"ok":"O quadro corresponde à lesão Strasberg tipo A: fuga biliar do coto cístico ou de um ducto acessório, sem descontinuidade da via biliar principal, que permanece de calibre normal. O tratamento é minimamente invasivo e tem dois componentes: drenagem da coleção (percutânea ou pelo dreno já existente) e CPRE com papilotomia, com ou sem prótese, que reduz a pressão na via biliar e redireciona a bile para o duodeno, permitindo o fechamento espontâneo da fístula.","w":{"B":"A colangiorressonância mostra a via biliar íntegra e sem dilatação, o que exclui secção completa. Reconstruções biliares são reservadas às lesões tipo E.","C":"Coledocolitíase residual causaria icterícia e dilatação, não fístula biliar externa, e a vesícula já foi removida.","D":"Observação isolada com coleção biliar leva a biloma infectado e peritonite biliar."},"p":["Reforço de Strasberg: A fuga de cístico ou Luschka (tratamento endoscópico); B oclusão de ducto direito aberrante; C secção de ducto aberrante com fístula; D lesão lateral da via principal; E1–E5 secção completa (reconstrução cirúrgica)."],"f":"Strasberg SM et al., J Am Coll Surg; Sabiston, 21ª ed., cap. 54; SAGES Safe Cholecystectomy Program."},{"v":"Vol. III (autorais)","c":9,"n":1,"g":"C","s":["Homem de 42 anos, sem etilismo e sem colelitíase ao ultrassom, apresenta pancreatite aguda. Triglicerídeos de 1.850 mg/dL e cálcio normal. Qual a conduta específica além do suporte habitual?"],"a":{"A":"Corticoterapia em dose alta","B":"CPRE com papilotomia de urgência","C":"Insulinoterapia em infusão contínua (com glicose se necessário), jejum inicial e, em casos refratários, plasmaférese","D":"Antibioticoterapia profilática de amplo espectro"},"ok":"A pancreatite hipertrigliceridêmica é a terceira causa mais frequente, atrás de litíase biliar e álcool, e é considerada quando os triglicerídeos ultrapassam 1.000 mg/dL. O tratamento específico visa reduzir rapidamente os triglicerídeos: a insulina em infusão contínua ativa a lipoproteína lipase e acelera a depuração; associa-se jejum e, em casos graves ou refratários, plasmaférese. A longo prazo, fibrato, controle do diabetes e restrição de álcool e gordura.","w":{"A":"Corticoide não tem papel na pancreatite hipertrigliceridêmica — e pode agravar a hipertrigliceridemia.","B":"A CPRE é para pancreatite biliar com colangite ou obstrução persistente, cenário excluído aqui pela ausência de litíase.","D":"A antibioticoprofilaxia não é recomendada em nenhuma etiologia de pancreatite aguda."},"p":["Atenção laboratorial: a hipertrigliceridemia grave pode causar pseudo-hiponatremia e mascarar a amilase (interferência do método), fazendo a amilase parecer normal — a lipase é mais confiável."],"f":"ACG Guideline — Acute Pancreatitis; Sabiston, 21ª ed., cap. 55; consensos sobre pancreatite hipertrigliceridêmica."},{"v":"Vol. III (autorais)","c":9,"n":2,"g":"B","s":["Sobre os escores de gravidade na pancreatite aguda, assinale a correta:"],"a":{"A":"O escore de Ranson pode ser calculado integralmente na admissão","B":"O BISAP utiliza cinco variáveis (ureia, alteração do estado mental, SIRS, idade e derrame pleural) e pode ser calculado nas primeiras 24 horas","C":"O escore de Balthazar é clínico, sem necessidade de imagem","D":"O APACHE II não se aplica à pancreatite aguda"},"ok":"O BISAP (Bedside Index of Severity in Acute Pancreatitis) tem cinco variáveis, uma para cada letra: BUN (ureia &gt; 25 mg/dL), Impaired mental status (alteração do estado mental), SIRS, Age (idade &gt; 60 anos) e Pleural effusion (derrame pleural). Sua vantagem é ser calculável nas primeiras 24 horas, com boa capacidade de predizer mortalidade.","w":{"A":"O Ranson exige 48 horas para ser completado: cinco critérios na admissão e seis nas 48 h subsequentes. Essa demora é sua principal limitação prática.","C":"O escore de Balthazar é tomográfico, graduando alterações inflamatórias e, no índice de gravidade tomográfica, a extensão da necrose.","D":"O APACHE II é aplicável e usado na pancreatite, com a modificação APACHE-O que acrescenta a obesidade."},"p":["A classificação de Atlanta revisada define gravidade por desfecho: leve (sem falência orgânica nem complicações locais), moderadamente grave (falência orgânica transitória &lt; 48 h ou complicações locais) e grave (falência orgânica persistente &gt; 48 h)."],"f":"Atlanta revisada (Banks PA et al., Gut 2013); Wu BU et al., Gut — BISAP; ACG Guideline."},{"v":"Vol. III (autorais)","c":9,"n":3,"g":"D","s":["Paciente com pancreatite aguda grave no 5º dia apresenta pressão intravesical de 24 mmHg, oligúria, pressão de pico inspiratório elevada e piora hemodinâmica. Qual o diagnóstico e a conduta inicial?"],"a":{"A":"Necrose infectada; necrosectomia aberta imediata","B":"Choque séptico de foco biliar; CPRE","C":"Insuficiência renal aguda por nefrotoxicidade; hemodiálise","D":"Síndrome compartimental abdominal; medidas clínicas de redução da pressão (descompressão nasogástrica, sedação, balanço hídrico negativo, drenagem de ascite) e, na falha, descompressão cirúrgica"},"ok":"A pancreatite aguda grave é uma das principais causas médicas de síndrome compartimental abdominal, por edema retroperitoneal, ascite inflamatória, íleo e ressuscitação volêmica. A conduta é escalonada: começa por medidas não cirúrgicas — descompressão gástrica e retal, sedação e bloqueio neuromuscular, balanço hídrico negativo, drenagem percutânea da ascite — e só na falha se procede à descompressão cirúrgica.","w":{"A":"Não há dados de infecção (sem gás, sem cultura, sem quadro séptico definido), e a necrosectomia aberta precoce é justamente o que a estratégia step-up evita.","B":"Não há icterícia nem dilatação biliar descritas.","C":"A oligúria é consequência da compressão, não de nefrotoxicidade. Dialisar sem descomprimir não resolve."},"p":["É um dos poucos cenários em que a drenagem percutânea de ascite tem papel terapêutico direto na hipertensão intra-abdominal — e é medida simples e eficaz."],"f":"WSACS Consensus Guidelines on intra-abdominal hypertension; IAP/APA Guidelines; Sabiston, 21ª ed., cap. 55."},{"v":"Vol. III (autorais)","c":9,"n":4,"g":"A","s":["Paciente com pancreatite crônica alcoólica apresenta hematêmese volumosa. EDA revela varizes gástricas isoladas de fundo, sem varizes esofágicas. Função hepática normal, sem cirrose. Qual o mecanismo e o tratamento definitivo?"],"a":{"A":"Hipertensão portal segmentar (sinistra) por trombose de veia esplênica; esplenectomia é o tratamento definitivo","B":"Cirrose hepática oculta; iniciar betabloqueador e ligadura elástica","C":"Síndrome de Mallory-Weiss; hemostasia endoscópica","D":"Gastropatia hipertensiva portal; TIPS"},"ok":"A trombose de veia esplênica é complicação clássica da pancreatite crônica (a veia corre no dorso do pâncreas e sofre com a inflamação peripancreática). Ela produz hipertensão portal segmentar, também chamada sinistra ou \"à esquerda\": o sangue esplênico busca vias colaterais pelos vasos gástricos curtos, gerando varizes de fundo gástrico isoladas, sem varizes esofágicas e com função hepática normal. Como a obstrução é pré-hepática e localizada, a esplenectomia é curativa.","w":{"B":"A ausência de varizes esofágicas, de estigmas de hepatopati
